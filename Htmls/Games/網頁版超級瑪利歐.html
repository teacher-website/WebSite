<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>網頁版超級瑪利歐 - 完整圖片版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #6B8CFF;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .ui-info {
            display: flex;
            justify-content: space-between;
            width: 800px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: 'Courier New', Courier, monospace;
        }
        .controls {
            margin-top: 15px;
            font-size: 16px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="ui-info">
        <div id="scoreDisplay">MARIO: 000000</div>
        <div id="gameStateDisplay" style="color: #FFD700;">世界 1-1</div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div class="controls">
        <strong>🎮 操作說明：</strong><br>
        方向鍵 ⬅️ ➡️ ：左右移動 | 空白鍵 (Space) 或 ⬆️ ：跳躍<br>
        這次有真正的瑪利歐、菇菇怪和問號磚塊囉！快來試試看！
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 確保像素圖放大時不會模糊，保持懷舊的顆粒感
ctx.imageSmoothingEnabled = false;

// --- 圖片素材載入 ---
const imgMarioRight = new Image();
imgMarioRight.src = "https://i.imgur.com/vHq9NMe.png"; // 瑪利歐朝右

const imgMarioLeft = new Image();
imgMarioLeft.src = "https://i.imgur.com/WbZ8p7G.png";  // 瑪利歐朝左

const imgGoomba = new Image();
imgGoomba.src = "https://i.imgur.com/Z4O884g.png";     // 菇菇怪

const imgBlockActive = new Image();
imgBlockActive.src = "https://i.imgur.com/8N4N3I8.png"; // 問號磚塊

const imgBlockEmpty = new Image();
imgBlockEmpty.src = "https://i.imgur.com/83p1Xb1.png";  // 空磚塊

const imgPipe = new Image();
imgPipe.src = "https://i.imgur.com/k6A3Ssh.png";        // 綠色水管

// --- 遊戲參數 ---
const GRAVITY = 0.6;
const JUMP_STRENGTH = -13.5;
const GROUND_Y = 380;
let score = 0;
let gameOver = false;
let gameWon = false;

const keys = { left: false, right: false, up: false };

// --- 物件設定 ---
const player = {
    x: 60,
    y: 200,
    width: 35,
    height: 40,
    velX: 0,
    velY: 0,
    speed: 5,
    isGrounded: false,
    facing: "right"
};

const pipe = { x: 350, y: 280, width: 70, height: 100 };

const blocks = [
    { x: 200, y: 220, width: 40, height: 40, hit: false, bounceY: 0 },
    { x: 240, y: 220, width: 40, height: 40, hit: false, bounceY: 0 },
    { x: 280, y: 220, width: 40, height: 40, hit: false, bounceY: 0 }
];

const enemies = [
    { x: 500, y: 345, width: 35, height: 35, speed: -1.5, alive: true },
    { x: 680, y: 345, width: 35, height: 35, speed: -2, alive: true }
];

const flagPole = { x: 750, y: 120, width: 10, height: 260 };

// --- 鍵盤監聽 ---
window.addEventListener("keydown", (e) => {
    if (gameOver || gameWon) return;
    if (e.code === "ArrowLeft")  { keys.left = true; player.facing = "left"; }
    if (e.code === "ArrowRight") { keys.right = true; player.facing = "right"; }
    if (e.code === "ArrowUp" || e.code === "Space") {
        keys.up = true;
        e.preventDefault();
    }
});

window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft")  keys.left = false;
    if (e.code === "ArrowRight") keys.right = false;
    if (e.code === "ArrowUp" || e.code === "Space")  keys.up = false;
});

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

// --- 邏輯更新 ---
function update() {
    if (gameOver || gameWon) return;

    if (keys.left) player.velX = -player.speed;
    else if (keys.right) player.velX = player.speed;
    else player.velX = 0;

    if (keys.up && player.isGrounded) {
        player.velY = JUMP_STRENGTH;
        player.isGrounded = false;
    }

    player.velY += GRAVITY;
    player.x += player.velX;
    player.y += player.velY;

    player.isGrounded = false;

    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

    if (player.y + player.height >= GROUND_Y) {
        player.y = GROUND_Y - player.height;
        player.velY = 0;
        player.isGrounded = true;
    }

    // 水管碰撞
    if (checkCollision(player, pipe)) {
        if (player.velY > 0 && (player.y + player.height - player.velY) <= pipe.y + 12) {
            player.y = pipe.y - player.height;
            player.velY = 0;
            player.isGrounded = true;
        } else {
            if (player.velX > 0) player.x = pipe.x - player.width;
            if (player.velX < 0) player.x = pipe.x + pipe.width;
        }
    }

    // 磚塊碰撞
    blocks.forEach(block => {
        if (block.bounceY < 0) block.bounceY += 1;

        if (checkCollision(player, block)) {
            if (player.velY < 0 && (player.y - player.velY) >= block.y + block.height - 10) {
                player.y = block.y + block.height;
                player.velY = 0;
                if (!block.hit) {
                    block.hit = true;
                    block.bounceY = -8;
                    score += 100;
                    document.getElementById("scoreDisplay").innerText = "MARIO: " + String(score).padStart(6, '0');
                }
            } 
            else if (player.velY > 0 && (player.y + player.height - player.velY) <= block.y + 10) {
                player.y = block.y - player.height;
                player.velY = 0;
                player.isGrounded = true;
            }
            else {
                if (player.velX > 0) player.x = block.x - player.width;
                if (player.velX < 0) player.x = block.x + block.width;
            }
        }
    });

    // 敵人碰撞
    enemies.forEach(enemy => {
        if (!enemy.alive) return;
        enemy.x += enemy.speed;

        if (enemy.x < 0 || enemy.x > canvas.width - enemy.width || checkCollision(enemy, pipe)) {
            enemy.speed = -enemy.speed;
        }

        if (checkCollision(player, enemy)) {
            if (player.velY > 0 && (player.y + player.height - player.velY) <= enemy.y + 12) {
                enemy.alive = false;
                player.velY = -8;
                score += 200;
                document.getElementById("scoreDisplay").innerText = "MARIO: " + String(score).padStart(6, '0');
            } else {
                gameOver = true;
            }
        }
    });

    // 旗桿過關
    if (checkCollision(player, flagPole)) {
        gameWon = true;
    }
}

// --- 畫面繪製 ---
function draw() {
    ctx.fillStyle = "#6B8CFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 1. 畫地面 (懷舊磚頭色泥土)
    ctx.fillStyle = "#D88A38";
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.fillStyle = "#000000"; // 地面黑色分隔線
    ctx.fillRect(0, GROUND_Y, canvas.width, 3);

    // 2. 畫水管 (使用圖片)
    ctx.drawImage(imgPipe, pipe.x, pipe.y, pipe.width, pipe.height);

    // 3. 畫磚塊 (使用圖片)
    blocks.forEach(block => {
        let drawY = block.y + block.bounceY;
        if (!block.hit) {
            ctx.drawImage(imgBlockActive, block.x, drawY, block.width, block.height);
        } else {
            ctx.drawImage(imgBlockEmpty, block.x, drawY, block.width, block.height);
        }
    });

    // 4. 畫敵人 (使用圖片)
    enemies.forEach(enemy => {
        if (enemy.alive) {
            ctx.drawImage(imgGoomba, enemy.x, enemy.y, enemy.width, enemy.height);
        }
    });

    // 5. 畫旗桿
    ctx.fillStyle = "#EEEEEE";
    ctx.fillRect(flagPole.x, flagPole.y, flagPole.width, flagPole.height);
    ctx.fillStyle = "#00A800";
    ctx.beginPath();
    ctx.arc(flagPole.x + 5, flagPole.y, 8, 0, Math.PI * 2);
    ctx.fill();
    // 綠色旗子
    ctx.fillStyle = "#73BF00";
    ctx.fillRect(flagPole.x - 30, flagPole.y + 20, 30, 20);

    // 6. 畫瑪利歐 (使用圖片)
    if (player.facing === "right") {
        ctx.drawImage(imgMarioRight, player.x, player.y, player.width, player.height);
    } else {
        ctx.drawImage(imgMarioLeft, player.x, player.y, player.width, player.height);
    }

    // 7. 結束畫面
    if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#FF3333";
        ctx.font = "bold 40px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
    }

    if (gameWon) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#FFD700";
        ctx.font = "bold 40px Arial";
        ctx.textAlign = "center";
        ctx.fillText("STAGE CLEAR !!", canvas.width / 2, canvas.height / 2);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// 啟動遊戲
gameLoop();
</script>

</body>
</html>
