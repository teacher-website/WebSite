<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日式可愛風格萬年曆</title>
    <style>
        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            background-color: #ffeaea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }
        .calendar-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .month {
            width: 250px;
            text-align: center;
        }
        .month-header {
            background-color: #ffb7b7;
            color: #fff;
            padding: 10px;
            border-radius: 10px 10px 0 0;
            font-weight: bold;
        }
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            padding: 10px;
        }
        .day {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff0f0;
            border-radius: 50%;
            font-size: 14px;
        }
        .current-month .day:hover {
            background-color: #ffdddd;
            cursor: pointer;
        }
        button {
            background-color: #ffb7b7;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff9e9e;
        }
        select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ffb7b7;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="controls">
            <button id="prevButton">上個月</button>
            <select id="yearSelect"></select>
            <select id="monthSelect"></select>
            <button id="nextButton">下個月</button>
        </div>
        <div class="calendar-container">
            <div id="prevMonth" class="month">
                <div class="month-header"></div>
                <div class="days"></div>
            </div>
            <div id="currentMonth" class="month current-month">
                <div class="month-header"></div>
                <div class="days"></div>
            </div>
            <div id="nextMonth" class="month">
                <div class="month-header"></div>
                <div class="days"></div>
            </div>
        </div>
    </div>

    <script>
        const prevMonthEl = document.getElementById('prevMonth');
        const currentMonthEl = document.getElementById('currentMonth');
        const nextMonthEl = document.getElementById('nextMonth');
        const yearSelectEl = document.getElementById('yearSelect');
        const monthSelectEl = document.getElementById('monthSelect');
        const prevButtonEl = document.getElementById('prevButton');
        const nextButtonEl = document.getElementById('nextButton');

        let currentDate = new Date();

        function updateCalendar() {
            const prevMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
            const nextMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);

            renderMonth(prevMonthEl, prevMonth);
            renderMonth(currentMonthEl, currentDate);
            renderMonth(nextMonthEl, nextMonth);

            updateYearMonthSelects();
        }

        function renderMonth(element, date) {
            const year = date.getFullYear();
            const month = date.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            element.querySelector('.month-header').textContent = `${year}年${month + 1}月`;

            const daysContainer = element.querySelector('.days');
            daysContainer.innerHTML = '';

            for (let i = 0; i < firstDay.getDay(); i++) {
                daysContainer.appendChild(createDayElement(''));
            }

            for (let i = 1; i <= lastDay.getDate(); i++) {
                daysContainer.appendChild(createDayElement(i));
            }
        }

        function createDayElement(content) {
            const dayEl = document.createElement('div');
            dayEl.className = 'day';
            dayEl.textContent = content;
            return dayEl;
        }

        function updateYearMonthSelects() {
            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth();

            yearSelectEl.innerHTML = '';
            for (let year = 1970; year <= 2050; year++) {
                const option = new Option(year, year);
                yearSelectEl.add(option);
            }
            yearSelectEl.value = currentYear;

            monthSelectEl.innerHTML = '';
            for (let month = 0; month < 12; month++) {
                const option = new Option(month + 1, month);
                monthSelectEl.add(option);
            }
            monthSelectEl.value = currentMonth;
        }

        yearSelectEl.addEventListener('change', () => {
            currentDate.setFullYear(parseInt(yearSelectEl.value));
            updateCalendar();
        });

        monthSelectEl.addEventListener('change', () => {
            currentDate.setMonth(parseInt(monthSelectEl.value));
            updateCalendar();
        });

        prevButtonEl.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateCalendar();
        });

        nextButtonEl.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateCalendar();
        });

        updateCalendar();
    </script>
</body>
</html>
