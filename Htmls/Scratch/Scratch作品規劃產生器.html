<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch 作品規劃產生器</title>
<style>
:root{
  --bg:#FFF5F8; --dot:#F8D7E0; --card:#FFFFFF; --ink:#5D4037; --ink2:#8D6E63;
  --line:#FADADD; --pink:#FF8FAB; --pink2:#FF6F91; --orange:#FFB74D; --mint:#E8F8EE; --mint2:#5CB88A;
  --cream:#FFFDE7; --sky:#E3F2FD; --sky2:#64B5F6; --red:#E57373; --shadow:0 6px 18px rgba(255,143,171,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241C27; --dot:#342839; --card:#33283A; --ink:#F6E7EE; --ink2:#CDB6C2;
    --line:#4A3A50; --cream:#3B3226; --mint:#25382E; --sky:#22303D; --shadow:0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#241C27; --dot:#342839; --card:#33283A; --ink:#F6E7EE; --ink2:#CDB6C2;
  --line:#4A3A50; --cream:#3B3226; --mint:#25382E; --sky:#22303D; --shadow:0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0; background-color:var(--bg); background-image:radial-gradient(var(--dot) 1.5px, transparent 1.7px); background-size:22px 22px;
  color:var(--ink); font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif; line-height:1.6}
header{display:flex; gap:12px; align-items:center; padding:14px 16px; max-width:1200px; margin:0 auto; flex-wrap:wrap}
.logo{width:50px; height:50px; border-radius:16px; background:var(--pink); display:grid; place-items:center; font-size:26px; box-shadow:var(--shadow); flex:none}
header h1{font-size:1.35rem; margin:0}
header p{margin:0; color:var(--ink2); font-size:.9rem}
.tools{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap}
.layout{display:grid; grid-template-columns:240px 1fr; gap:16px; max-width:1200px; margin:0 auto; padding:0 16px 40px}
@media (max-width:820px){ .layout{grid-template-columns:1fr} .side{position:static!important} #mini{display:none} }
.side{position:sticky; top:12px; align-self:start; display:flex; flex-direction:column; gap:12px}
.card{background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:16px}
.nav button{display:flex; width:100%; align-items:center; gap:8px; border:none; background:none; color:var(--ink); font:inherit; padding:7px 8px; border-radius:12px; cursor:pointer; text-align:left}
.nav button:hover{background:var(--bg)}
.nav button[aria-current="step"]{background:var(--pink); color:#fff; font-weight:800}
.nav .dot{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:.75rem; font-weight:800; background:var(--line); color:var(--ink); flex:none}
.nav .dot.ok{background:var(--mint2); color:#fff}
.nav button[aria-current="step"] .dot{background:#fff; color:var(--pink2)}
.mini h3{margin:0 0 6px; font-size:.95rem}
.mini ul{list-style:none; margin:0; padding:0; font-size:.84rem}
.mini li{display:flex; gap:6px; padding:2px 0}
.bar{height:10px; border-radius:10px; background:var(--line); overflow:hidden; margin:6px 0 2px}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--pink),var(--orange)); border-radius:10px}
main .card{margin-bottom:14px}
h2.step{margin:0 0 4px; font-size:1.3rem}
.lead{color:var(--ink2); margin:0 0 12px}
.why{background:var(--sky); border-radius:14px; padding:8px 12px; font-size:.88rem; margin:8px 0 12px}
.why b{color:var(--sky2)}
.fld{margin:10px 0}
.fld>label,.lbl{display:block; font-weight:800; margin-bottom:3px}
.req{color:var(--pink2); margin-left:3px}
.hint{font-size:.83rem; color:var(--ink2); margin-bottom:4px}
input[type=text],input[type=number],textarea,select{width:100%; font:inherit; border:2px solid var(--line); border-radius:12px; padding:8px 10px; background:var(--bg); color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--pink)}
input::placeholder,textarea::placeholder{color:var(--ink2); opacity:.6}
textarea{resize:vertical}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px}
.chip{border:2px dashed var(--pink); background:transparent; color:var(--ink); border-radius:50px; padding:2px 10px; font:inherit; font-size:.82rem; cursor:pointer}
.chip:hover{background:var(--pink); color:#fff}
.opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px}
.opt{border:2px solid var(--line); border-radius:14px; padding:8px 10px; display:flex; gap:8px; align-items:flex-start; cursor:pointer; background:var(--bg)}
.opt input{margin-top:5px; accent-color:var(--pink); width:17px; height:17px; flex:none}
.opt:has(input:checked){border-color:var(--pink); background:var(--cream)}
.opt small{display:block; color:var(--ink2); font-size:.8rem}
.stars{color:var(--orange); letter-spacing:1px}
.row{border:2px solid var(--line); border-radius:18px; padding:10px 12px 4px; margin:10px 0; background:var(--bg); position:relative}
.row h4{margin:0 0 2px; font-size:1rem}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:0 12px}
@media (max-width:600px){ .grid2,.grid3{grid-template-columns:1fr} }
.btn{appearance:none; border:none; border-radius:50px; padding:9px 16px; font:inherit; font-weight:800; cursor:pointer; background:var(--pink); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.sec{background:var(--card); color:var(--ink); border:2px solid var(--line); box-shadow:none}
.btn.small{padding:4px 12px; font-size:.85rem}
.btn.del{position:absolute; top:8px; right:8px; background:transparent; color:var(--red); box-shadow:none; padding:2px 8px; border:2px solid var(--line)}
.navbtns{display:flex; justify-content:space-between; gap:8px; margin-top:6px}
table.sb{width:100%; border-collapse:collapse; font-size:.88rem}
table.sb th,table.sb td{border:2px solid var(--line); padding:4px; vertical-align:top}
table.sb th{background:var(--cream)}
table.sb input,table.sb textarea{padding:5px 6px; border-radius:8px; font-size:.86rem}
.sbwrap{overflow-x:auto}
.sbwrap table{min-width:720px}
.ok{color:var(--mint2)} .no{color:var(--red)}
.lv{display:inline-block; border-radius:50px; padding:0 10px; font-weight:800; font-size:.82rem; color:#fff}
.lv5{background:#43A047}.lv4{background:#7CB342}.lv3{background:#FFB300}.lv2{background:#FB8C00}.lv1{background:#E53935}.lv0{background:#9E9E9E}
table.rub{width:100%; border-collapse:collapse; font-size:.88rem}
table.rub td,table.rub th{border-bottom:2px solid var(--line); padding:6px 4px; vertical-align:top; text-align:left}
table.rub ul{margin:2px 0; padding-left:18px}
.notice{background:var(--cream); border-radius:14px; padding:8px 12px; font-size:.88rem}
#toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--card); padding:8px 18px; border-radius:50px; opacity:0; transition:.3s; pointer-events:none; z-index:50}
#toast.show{opacity:1}
dialog{border:none; border-radius:22px; padding:0; width:min(960px,96vw); max-height:92vh; background:var(--card); color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlghead{display:flex; gap:8px; align-items:center; padding:12px 16px; border-bottom:2px solid var(--line); position:sticky; top:0; background:var(--card); flex-wrap:wrap}
.dlghead h3{margin:0; margin-right:auto}
#pv{padding:8px 22px 22px; overflow:auto}
#pv table{border-collapse:collapse; width:100%; margin:8px 0; font-size:.9rem}
#pv th,#pv td{border:1px solid var(--ink2); padding:4px 6px; vertical-align:top; text-align:left}
#pv th{background:var(--cream)}
#pv pre{background:var(--bg); border-radius:10px; padding:10px; overflow:auto; font-size:.82rem}
#pv h1{font-size:1.4rem} #pv h2{font-size:1.2rem; border-left:6px solid var(--pink); padding-left:8px; margin-top:26px} #pv h3{font-size:1.05rem}
#pv blockquote{margin:6px 0; padding:4px 12px; border-left:4px solid var(--orange); background:var(--cream)}
@media print{
  body{background:#fff; color:#000}
  body>*:not(dialog){display:none!important}
  dialog{position:static; width:auto; max-height:none; box-shadow:none; display:block}
  .dlghead{display:none}
  #pv{padding:0; overflow:visible; color:#000}
  #pv th{background:#eee}
  #pv h2{break-after:avoid}
  #pv tr{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">🐱</div>
  <div>
    <h1>Scratch 作品規劃產生器</h1>
    <p>臺北市 115 年貓咪盃初賽・國小 AI 互動組｜跟著步驟填空，做出完整的作品規劃</p>
  </div>
  <div class="tools">
    <button class="btn sec small" id="bSave" title="把目前填的內容存成檔案，下次可以再載入">💾 存進度檔</button>
    <button class="btn sec small" id="bLoad" title="載入之前存的進度檔">📂 載入進度</button>
    <button class="btn sec small" id="bReset">🧹 全部清除</button>
    <input type="file" id="fLoad" accept=".json,application/json" hidden>
  </div>
</header>
<div class="layout">
  <aside class="side">
    <div class="card nav" id="nav"></div>
    <div class="card mini" id="mini"></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg">
  <div class="dlghead">
    <h3>📄 規劃書預覽</h3>
    <button class="btn small" id="bPrint">🖨 列印／存成 PDF</button>
    <button class="btn small" id="bMd2">⬇ 下載 .md</button>
    <button class="btn sec small" id="bClose">關閉</button>
  </div>
  <div id="pv"></div>
</dialog>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ================= 資料：AI 動作庫 ================= */
// star：判斷穩定度（3＝很穩定，建議優先使用）
const ACTIONS = {
  handpose: [
    {k:'hp_left',  n:'手往左移', star:3, how:'(手腕 x − 起始手腕 x) ÷ 手長 < −0.6', ready:'手回到中間：差的絕對值 ÷ 手長 < 0.25'},
    {k:'hp_right', n:'手往右移', star:3, how:'(手腕 x − 起始手腕 x) ÷ 手長 > 0.6', ready:'手回到中間：差的絕對值 ÷ 手長 < 0.25'},
    {k:'hp_up',    n:'手舉高',   star:3, how:'(手腕 y − 起始手腕 y) ÷ 手長 > 0.6（Scratch 的 y 往上是正）', ready:'手回到中間高度'},
    {k:'hp_down',  n:'手放低',   star:2, how:'(手腕 y − 起始手腕 y) ÷ 手長 < −0.6（手太低容易出鏡頭）', ready:'手回到中間高度'},
    {k:'hp_open',  n:'張開手掌', star:3, how:'五根手指都伸直（指尖比同一根手指第二關節更遠；拇指另外用 x 判斷，量到小指掌根）', ready:'手指不是全部伸直'},
    {k:'hp_fist',  n:'握拳',     star:3, how:'五根手指都彎曲', ready:'張開手掌'},
    {k:'hp_v',     n:'比 V（YA）', star:2, how:'只有食指、中指伸直', ready:'張開手掌'},
    {k:'hp_one',   n:'比 1（食指）', star:2, how:'只有食指伸直', ready:'張開手掌'},
    {k:'hp_pinch', n:'捏取（拇指碰食指）', star:2, how:'拇指尖到食指尖的距離 ÷ 手長 < 0.25', ready:'距離 ÷ 手長 > 0.45'},
    {k:'hp_wave',  n:'揮手', star:2, how:'1 秒內手腕左右越過起始位置 2 次以上', ready:'手停住 0.5 秒'},
    {k:'hp_point', n:'食指當游標（移動＋停留）', star:3, how:'游標角色跟著食指尖移動；碰到目標並停留 0.5 秒算一次', ready:'游標離開目標'},
  ],
  facemesh: [
    {k:'fm_left',  n:'向左轉頭', star:3, how:'(鼻尖 x − 臉中心 x) ÷ 臉寬 × 100 < −15', ready:'回到正面：絕對值 < 6'},
    {k:'fm_right', n:'向右轉頭', star:3, how:'(鼻尖 x − 臉中心 x) ÷ 臉寬 × 100 > 15', ready:'回到正面：絕對值 < 6'},
    {k:'fm_up',    n:'抬頭', star:2, how:'鼻尖相對兩眼中點往上的距離 ÷ 臉寬，比起始值大一個門檻', ready:'回到起始比例附近'},
    {k:'fm_nod',   n:'點頭（低頭）', star:2, how:'鼻尖相對兩眼中點往下的比例，比起始值大一個門檻', ready:'回到起始比例附近'},
    {k:'fm_mouth', n:'張開嘴巴', star:3, how:'上下唇距離 ÷ 臉寬 > 0.15', ready:'上下唇距離 ÷ 臉寬 < 0.06'},
    {k:'fm_tiltL', n:'頭往左歪', star:2, how:'(左眼 y − 右眼 y) ÷ 臉寬 超過門檻', ready:'兩眼高度差回到很小'},
    {k:'fm_tiltR', n:'頭往右歪', star:2, how:'(右眼 y − 左眼 y) ÷ 臉寬 超過門檻', ready:'兩眼高度差回到很小'},
    {k:'fm_near',  n:'靠近鏡頭', star:2, how:'臉寬 > 起始臉寬 × 1.3', ready:'臉寬 < 起始臉寬 × 1.1'},
    {k:'fm_blink', n:'閉眼睛', star:1, how:'上下眼皮距離 ÷ 臉寬 很小，維持 0.3 秒（容易誤判，不建議當主要動作）', ready:'眼睛張開'},
    {k:'fm_move',  n:'臉左右移動當游標', star:3, how:'游標角色的 x 跟著鼻尖 x（乘上倍率）移動', ready:'—'},
  ]
};
const MODULES = {handpose:'Handpose2Scratch（手部辨識 21 點）', facemesh:'Facemesh2Scratch（臉部辨識 468 點）'};
const READY_DEFAULT = {handpose:'手掌張開、放在畫面中間不動', facemesh:'臉正對鏡頭、嘴巴閉上'};
function actOf(mod,k){ return (ACTIONS[mod]||[]).find(a=>a.k===k); }
function actName(mod,k){ const a=actOf(mod,k); return a?a.n:''; }

/* ================= 狀態 ================= */
const LS_KEY = 'scratchPlanner.v1';
const blankShot = ()=>({scene:'',role:'',act:'',caption:'',sound:''});
const blankSB = ()=>({narr:'', shots:[blankShot(),blankShot(),blankShot()]});
function defaults(){
  return {
    v:1, group:'', step:0,
    basic:{grade:'',title:'',name:'',cls:'',learn:''},
    anim:{
      story:{place:'',narrator:'',opening:'',theme:''},
      creatures:[{name:'',home:'',need:'',sad:'',happy:''},{name:'',home:'',need:'',sad:'',happy:''},{name:'',home:'',need:'',sad:'',happy:''}],
      problems:[0,1,2].map(()=>({name:'',cause:'',affect:'',fix:'',goodAct:'',badWay:'',badAct:'',time:15,goodFx:'',badFx:''})),
      ai:{module:'',acts:[],whyAI:'',calib:'',ready:'',lost:'',keys:''},
      branch:{meter:'森林健康值',start:50,plus:20,minus:15,aMin:70,useMid:true,bBelow:40,
              aName:'',aDesc:'',bName:'',bDesc:'',cName:'',cDesc:''},
      sb:{},
      art:{style:'',stages:['','',''],effects:'',bgm:'',sfx:'',special:''}
    },
    game:{
      goal:{name:'',host:'',goal:'',story:''},
      ai:{module:'',acts:[],map:{},ready:'',hold:0.15,calib:'',lost:'',keys:'',whyAI:''},
      lv1:{minLen:3,maxLen:5,rounds:3,show:1,limit:3},
      lv2:{start:3,add:1,pass:8,show:0.8,limit:3},
      extra:'',
      rand:{allowRepeat:'yes',how:''},
      score:{base:'10 × 這一輪的動作數',combo:'',wrong:'retry',minus:5,lives:3,win:'',lose:'',diff:''},
      screen:{style:'',start:'',howto:'',win:'',lose:'',bgm:'',okFx:'',badFx:'',idea:''}
    }
  };
}
let S = load() || defaults();
function load(){ try{ const t=localStorage.getItem(LS_KEY); if(!t) return null; return merge(defaults(), JSON.parse(t)); }catch(e){ return null; } }
function merge(d,s){ if(s==null) return d; if(Array.isArray(d)) return Array.isArray(s)?s:d;
  if(typeof d==='object'&&d){ const o={...d}; for(const k in s){ o[k]= (k in d)? merge(d[k],s[k]) : s[k]; } return o; } return s; }
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} },250); }
function get(p){ return p.split('.').reduce((o,k)=>o==null?undefined:o[k], S); }
function set(p,v){ const ks=p.split('.'); let o=S; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]]={}; o=o[ks[i]]; } o[ks.at(-1)]=v; save(); }

/* ================= 小工具 ================= */
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filled = v => v!=null && String(v).trim()!=='';
const $ = s => document.querySelector(s);
let uid=0;
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1800); }
function chipsHTML(p,chips,mode){ if(!chips||!chips.length) return '';
  return `<div class="chips">${chips.map(c=>`<button type="button" class="chip" data-chip="${esc(p)}" data-mode="${mode||'set'}" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`; }
// 文字欄位：o = {ph 範例, hint, area, rows, num, req, chips, mode:'set'|'add'}
function F(p,label,o={}){
  const id='f'+(++uid); const v=get(p);
  const ph = o.ph ? '例如：'+o.ph : '';
  const input = o.area
    ? `<textarea id="${id}" data-p="${p}" rows="${o.rows||3}" placeholder="${esc(ph)}">${esc(v??'')}</textarea>`
    : `<input id="${id}" data-p="${p}" type="${o.num?'number':'text'}" ${o.num?'data-num="1" step="any"':''} value="${esc(v??'')}" placeholder="${esc(ph)}">`;
  return `<div class="fld">${label?`<label for="${id}">${label}${o.req?'<span class="req">*</span>':''}</label>`:''}${o.hint?`<div class="hint">${o.hint}</div>`:''}${input}${chipsHTML(p,o.chips,o.mode)}</div>`;
}
function R(p,opts,o={}){ const v=get(p); const name='r'+(++uid);
  return `<div class="opts">${opts.map(x=>`<label class="opt"><input type="radio" name="${name}" data-p="${p}" value="${esc(x.v)}" ${String(v)===String(x.v)?'checked':''} ${o.rr?'data-rr="1"':''}><span>${x.t}${x.d?`<small>${x.d}</small>`:''}</span></label>`).join('')}</div>`; }
function SEL(p,opts,blank){ const v=get(p);
  return `<select data-p="${p}" data-rr="1">${blank?`<option value="">${blank}</option>`:''}${opts.map(x=>`<option value="${esc(x.v)}" ${x.v===v?'selected':''}>${esc(x.t)}</option>`).join('')}</select>`; }
const why = (t)=>`<div class="why">🎯 <b>評分重點：</b>${t}</div>`;

/* ================= 步驟定義 ================= */
const STEPS = {
  anim:[
    {t:'基本資料', f:stepBasic, done:()=>doneBasic()},
    {t:'森林與動物', f:animCreatures, done:()=>S.anim.creatures.filter(c=>filled(c.name)&&filled(c.need)).length>=3 && filled(S.anim.story.opening)},
    {t:'AI 互動方式', f:animAI, done:()=>filled(S.anim.ai.module)&&S.anim.ai.acts.length>=1&&filled(S.anim.ai.whyAI)},
    {t:'環境問題與任務', f:animProblems, done:()=>S.anim.problems.filter(p=>filled(p.name)&&p.goodAct&&filled(p.goodFx)&&filled(p.badFx)).length>=3},
    {t:'故事分支與結局', f:animBranch, done:()=>filled(S.anim.branch.aDesc)&&filled(S.anim.branch.bDesc)},
    {t:'分鏡表', f:animSB, done:()=>sbRatio()>=0.8},
    {t:'美術與音效', f:animArt, done:()=>filled(S.anim.art.style)&&S.anim.art.stages.every(filled)&&filled(S.anim.art.bgm)},
    {t:'檢核與輸出', f:stepFinal, done:()=>false},
  ],
  game:[
    {t:'基本資料', f:stepBasic, done:()=>doneBasic()},
    {t:'遊戲目標', f:gameGoal, done:()=>filled(S.game.goal.goal)&&filled(S.game.goal.host)},
    {t:'AI 動作與聲音', f:gameAI, done:()=>S.game.ai.acts.length>=3&&S.game.ai.acts.every(k=>filled((S.game.ai.map[k]||{}).sound))&&filled(S.game.ai.ready)},
    {t:'關卡設計', f:gameLevels, done:()=>filled(S.game.rand.how)},
    {t:'計分與勝負', f:gameScore, done:()=>filled(S.game.score.combo)&&filled(S.game.score.win)&&filled(S.game.score.lose)},

function sbTasks(){
  const a=S.anim, b=a.branch;
  const t=[{id:'intro',t:'序幕',hint:'森林原本的樣子 → 問題出現 → 動物準備搬家 → 校正 AI'}];
  a.problems.forEach((p,i)=>t.push({id:'p'+i,t:`任務${i+1}${filled(p.name)?'：'+p.name:''}`,hint:`${p.cause||'問題出現'} → 觀看者用「${actName(a.ai.module,p.goodAct)||'AI 動作'}」幫忙 → 做對/做錯的畫面`}));
  t.push({id:'endA',t:'好結局'+(filled(b.aName)?'：'+b.aName:''),hint:b.aDesc});
  if(b.useMid) t.push({id:'endC',t:'中間結局'+(filled(b.cName)?'：'+b.cName:''),hint:b.cDesc});
  t.push({id:'endB',t:'壞結局'+(filled(b.bName)?'：'+b.bName:''),hint:b.bDesc});
  t.forEach(x=>{ if(!S.anim.sb[x.id]) S.anim.sb[x.id]=blankSB(); });
  return t;
}
function sbRatio(){ const t=sbTasks(); let tot=0, ok=0;

  return tot?ok/tot:0; }

function topicChecks(){
  if(S.group==='anim'){ const a=S.anim, b=a.branch;
    const cr=a.creatures.filter(c=>filled(c.name)).length, pr=a.problems.filter(p=>filled(p.name)).length;
    const fx=a.problems.filter(p=>filled(p.name)&&filled(p.goodFx)&&filled(p.badFx)).length;
    return [
      [cr>=3,`至少 3 種森林生物（目前 ${cr}）`],
      [pr>=3,`至少 3 種環境問題（目前 ${pr}）`],
      [filled(a.ai.module)&&a.ai.acts.length>=1&&a.problems.every(p=>!filled(p.name)||p.goodAct),'至少 1 種頭部或手部動作，每個任務都指定了動作'],
      [pr>0&&fx===pr,'每個行動都有「變好」畫面，不適當選擇有「變差」畫面'],
      [filled(b.aDesc)&&filled(b.bDesc),'至少兩種不同的故事發展（結局）'],
      [filled(a.ai.ready)&&filled(a.ai.calib),'說明文件：寫出互動方式（校正、預備姿勢）'],
    ];
  }
  if(S.group==='game'){ const g=S.game, ai=g.ai;
    const sounds=ai.acts.map(k=>((ai.map[k]||{}).sound||'').trim()).filter(Boolean);
    return [
      [ai.acts.length>=3,`至少 3 種手部或頭部動作（目前 ${ai.acts.length}）`],
      [filled(ai.ready),'有預備姿勢，避免同一動作被重複判定'],
      [sounds.length===ai.acts.length&&ai.acts.length>0&&new Set(sounds).size===sounds.length,'每個動作對應「不同」的聲音或效果'],
      [+g.lv1.minLen>=3&&+g.lv1.maxLen<=5&&+g.lv1.minLen<=+g.lv1.maxLen&&filled(g.rand.how),'第一關：亂數產生 3～5 個動作'],
      [+g.lv2.add>=1&&+g.lv2.pass>+g.lv2.start,'第二關：答對後節奏逐漸變長'],
      [filled(g.score.base)&&filled(g.score.combo),'每輪得分，連續正確有加分'],
      [!!g.score.wrong,'動作錯誤會重新挑戰或扣分'],
      [filled(g.score.win)&&filled(g.score.lose),'自訂關卡通過與遊戲結束條件'],
    ];
  }
  return [];
}

function evalRubric(){
  return (RUBRIC[S.group]||[]).map(r=>{ const cs=r.c(); const ok=cs.filter(x=>x[0]).length; const ratio=ok/cs.length;

    return {...r, cs, lv, pt:r.pts[lv]}; });
}

\`\`\`

  把 新動作 加到「節奏」

第一關「節奏記憶」（每一輪）：

  玩家回合（見下方）
  如果答對：輪 + 1；如果 輪 = ${g.lv1.rounds} → 廣播「過關」，進入第二關

第二關「節奏接龍」：
  刪除「節奏」全部；重複 ${g.lv2.start} 次：產生亂數動作
  每一輪：廣播「播放提示」並等待 → 玩家回合
    答對：如果「節奏」長度 ≥ ${g.lv2.pass} → 遊戲結束（贏）
          否則 重複 ${g.lv2.add} 次：產生亂數動作（只加在最後面）
    答錯：${wrongTxt}（節奏不變，重播同一段）

玩家回合：
  第幾拍 = 1；拍開始時間 = 計時器
  重複直到 第幾拍 > 「節奏」的長度 或 答錯：
    如果 確定動作 ≠ 0：
      動作 = 確定動作；確定動作 = 0          ← 先搬走再歸零
      把 動作 加到「玩家」
      如果 動作 = 「節奏」的第（第幾拍）項：第幾拍 + 1；拍開始時間 = 計時器
      否則：答錯
    如果 計時器 − 拍開始時間 > 限時：答錯
  答對 → 分數 + （${sc.base}）；連續正確 + 1；連擊加分：${sc.combo}；廣播「答對」
  答錯 → 連續正確 = 0；${sc.wrong!=='retry'?`分數 − ${sc.minus}；`:''}${+sc.lives>0?'生命 − 1；如果 生命 = 0 → 遊戲結束（輸）；':''}廣播「答錯」

難度提升：${val(sc.diff)}

function buildMD(){ return S.group==='anim'? mdAnim() : S.group==='game'? mdGame() : ''; }

/* ================= 簡易 Markdown → HTML（預覽用） ================= */
function inline(s){ return esc(s).replace(/&lt;br&gt;/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>'); }
function md2html(md){
  const L=md.split('\n'); let h='', i=0;
  while(i<L.length){ const l=L[i];
    if(l.startsWith('```')){ let c=[]; i++; while(i<L.length&&!L[i].startsWith('```')) c.push(L[i++]); i++; h+=`<pre>${esc(c.join('\n'))}</pre>`; continue; }
    if(/^\|/.test(l)){ const rows=[]; while(i<L.length&&/^\|/.test(L[i])) rows.push(L[i++]);
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      h+='<table><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>'; continue; }
    let m;
    if((m=l.match(/^(#{1,4}) (.*)/))){ h+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if(l.startsWith('> ')){ let c=[]; while(i<L.length&&L[i].startsWith('> ')) c.push(inline(L[i++].slice(2))); h+=`<blockquote>${c.join('<br>')}</blockquote>`; continue; }
    if(/^\s*- /.test(l)){ let c=[]; while(i<L.length&&/^\s*- /.test(L[i])) c.push(L[i++].replace(/^\s*- /,'')); h+='<ul>'+c.map(x=>`<li>${inline(x.replace(/^\[ \] /,'☐ '))}</li>`).join('')+'</ul>'; continue; }
    if(/^\d+\. /.test(l)){ let c=[]; while(i<L.length&&/^\d+\. /.test(L[i])) c.push(L[i++].replace(/^\d+\. /,'')); h+='<ol>'+c.map(x=>`<li>${inline(x)}</li>`).join('')+'</ol>'; continue; }
    if(l.trim()==='---'){ h+='<hr>'; i++; continue; }
    if(!l.trim()){ i++; continue; }
    let c=[]; while(i<L.length&&L[i].trim()&&!/^(#|\||\s*- |> |```|\d+\. )/.test(L[i])) c.push(inline(L[i++])); h+=`<p>${c.join('<br>')}</p>`;
  }
  return h;
}

/* ================= 畫面 ================= */
function render(){
  uid=0;
  const st=steps(); if(S.step>=st.length) S.step=st.length-1; if(S.step<0) S.step=0;
  $('#main').innerHTML = `<div class="card">${st[S.step].f()}
    <div class="navbtns" style="margin-top:16px">
      ${S.step>0?'<button class="btn sec" data-go="-1">← 上一步</button>':'<span></span>'}
      ${S.step<st.length-1?`<button class="btn" data-go="1" ${!S.group?'disabled title="請先選組別"':''}>下一步 →</button>`:''}
    </div></div>`;
  side();
}
function side(){
  const st=steps();
  $('#nav').innerHTML = `<div class="lbl" style="margin-bottom:4px">${S.group==='anim'?'🎬 動畫組':S.group==='game'?'🎵 遊戲組':'請先選組別'}</div>`+
    st.map((x,i)=>{ const ok=x.done(); return `<button data-step="${i}" ${i===S.step?'aria-current="step"':''}><span class="dot ${ok?'ok':''}">${ok?'✓':i+1}</span>${x.t}</button>`; }).join('');
  const tc=topicChecks();
  if(!tc.length){ $('#mini').innerHTML='<h3>📋 題目檢核</h3><p class="hint">選好組別後會顯示題目要求。</p>'; return; }
  const ok=tc.filter(x=>x[0]).length;
  $('#mini').innerHTML = `<h3>📋 題目要求 ${ok}/${tc.length}</h3><div class="bar"><i style="width:${ok/tc.length*100}%"></i></div>
   <ul>${tc.map(x=>`<li><span>${x[0]?'✅':'⬜'}</span><span>${esc(x[1])}</span></li>`).join('')}</ul>`;
}
let sideT=null;
function sideSoon(){ clearTimeout(sideT); sideT=setTimeout(side,200); }

document.addEventListener('input', e=>{
  const p=e.target.dataset.p; if(!p||e.target.type==='radio'||e.target.type==='checkbox'||e.target.tagName==='SELECT') return;
  set(p, e.target.dataset.num? (e.target.value===''?'':+e.target.value) : e.target.value); sideSoon();
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.act){ const base=t.dataset.act, g=get(base); const k=t.value;
    g.acts = t.checked? [...g.acts.filter(x=>x!==k), k] : g.acts.filter(x=>x!==k); save(); render(); return; }
  const p=t.dataset.p; if(!p) return;
  if(t.type==='radio'){ if(!t.checked) return;
    if(p==='group'){ S.group=t.value; save(); render(); return; }
    if(/\.module$/.test(p) && get(p)!==t.value){ const base=p.replace(/\.module$/,''); get(base).acts=[]; }
    set(p,t.value); } else if(t.type==='checkbox'&&t.dataset.bool){ set(p,t.checked); } else if(t.tagName==='SELECT'){ set(p,t.value); } else return;
  if(t.dataset.rr) render(); else side();
});
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.chip){ const p=b.dataset.chip, v=b.dataset.v, cur=get(p)||'';
    const nv = b.dataset.mode==='add' && filled(cur) ? (cur.includes(v)?cur:cur+'、'+v) : v;
    set(p,nv); const inp=document.querySelector(`[data-p="${CSS.escape(p)}"]`); if(inp){ inp.value=nv; } side(); return; }
  if(b.dataset.go){ S.step+= +b.dataset.go; save(); render(); scrollTo({top:0,behavior:'smooth'}); return; }
  if(b.dataset.step){ S.step=+b.dataset.step; save(); render(); return; }
  if(b.dataset.add){ const arr=get(b.dataset.add); arr.push(JSON.parse(JSON.stringify(b.dataset.add.endsWith('creatures')?defaults().anim.creatures[0]:defaults().anim.problems[0]))); save(); render(); return; }
  if(b.dataset.addshot){ S.anim.sb[b.dataset.addshot].shots.push(blankShot()); save(); render(); return; }
  if(b.dataset.del){ const ks=b.dataset.del.split('.'); const idx=+ks.pop(); const arr=get(ks.join('.')); arr.splice(idx,1);
    if(ks.join('.')==='anim.problems'){ // 任務順序改變，分鏡跟著移動
      const sb=S.anim.sb, n=arr.length; for(let i=idx;i<n;i++) sb['p'+i]=sb['p'+(i+1)]||blankSB(); delete sb['p'+n]; }
    save(); render(); return; }
  if(b.id==='bPreview'){ $('#pv').innerHTML=md2html(buildMD()); $('#dlg').showModal(); return; }
  if(b.id==='bMd'||b.id==='bMd2'){ download(buildMD(), fileBase()+'_規劃書.md','text/markdown'); return; }
  if(b.id==='bCopy'){ navigator.clipboard.writeText(buildMD()).then(()=>toast('已複製 .md 內容')).catch(()=>toast('無法複製，請改用下載')); return; }
  if(b.id==='bPrint'){ window.print(); return; }
  if(b.id==='bClose'){ $('#dlg').close(); return; }
  if(b.id==='bSave'){ download(JSON.stringify(S,null,1), fileBase()+'_進度.json','application/json'); return; }
  if(b.id==='bLoad'){ $('#fLoad').click(); return; }
  if(b.id==='bReset'){ if(confirm('確定要清除全部內容、從頭開始嗎？（建議先按「存進度檔」）')){ S=defaults(); save(); render(); } return; }
});
$('#fLoad').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ S=merge(defaults(), JSON.parse(r.result)); save(); render(); toast('已載入進度'); }catch(err){ toast('檔案格式不正確'); } e.target.value=''; };
  r.readAsText(f,'utf-8'); });
function fileBase(){ return (S.basic.title||'Scratch作品').replace(/[\\/:*?"<>|]/g,'_'); }
function download(text,name,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); toast('已下載 '+name); }

render();
