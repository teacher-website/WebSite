<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>埃及風雲：金字塔大漠之戰！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a100a;
            color: #ffd700;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            text-shadow: 3px 3px 6px #000;
            font-size: 32px;
        }
        #game-container {
            position: relative;
            border: 5px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            background-color: #e6c280; 
        }
        canvas {
            display: block;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 1200px; /* 跟著地圖變寬 */
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 3px #000;
        }
        #msg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            text-align: center;
            line-height: 1.6;
        }
        button {
            background-color: #ffd700;
            color: #2c1d11;
            border: none;
            padding: 12px 30px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        button:hover {
            background-color: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>𓎬 埃及風雲：金字塔大漠之戰！ 𓏃</h1>
    <div id="ui">
        <div>⏳ 剩餘時間: <span id="timer">45</span> 秒</div>
        <div>🐥 剩餘活雞: <span id="alive-chicks">161</span> 隻</div>
        <div>🏆 已抓木乃伊雞: <span id="score">0</span> / 100</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="1200" height="700"></canvas>
        <div id="msg-overlay">
            <div id="msg-text">𓁴 廣袤的吉薩沙漠上出現了 161 隻神聖小雞！<br>繞過祭司，在 45 秒內捕獲 100 隻化為木乃伊吧！</div>
            <button id="start-btn" onclick="startGame()">接受法老試煉</button>
        </div>
    </div>
    <p>操作方式：使用鍵盤方向鍵 (⬆️⬇️⬅️➡️) 操控法老王。地圖變大，更考驗你的走位與繞背技巧！</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const aliveEl = document.getElementById('alive-chicks');
        const overlay = document.getElementById('msg-overlay');
        const msgText = document.getElementById('msg-text');
        const startBtn = document.getElementById('start-btn');

        let gameActive = false;
        let score = 0;
        let timeLeft = 45;
        let gameInterval;
        let timerInterval;

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        class Character {
            constructor(x, y, speed, size, emoji) {
                this.x = x;
                this.y = y;
                this.speed = speed;
                this.size = size;
                this.emoji = emoji;
            }
            draw() {
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y);
            }
        }

        let pharaoh;
        let priest;
        let chicks = [];
        const totalChicks = 161; 
        const targetScore = 100;

        function initGame() {
            score = 0;
            timeLeft = 45;
            scoreEl.innerText = score;
            timerEl.innerText = timeLeft;
            aliveEl.innerText = totalChicks;

            // 地圖變大，法老王速度維持高機動性 7
            pharaoh = new Character(150, 350, 7, 45, '👑');
            // 祭司速度稍微提升至 4.5，增加防守威脅
            priest = new Character(750, 350, 4.5, 50, '🧙‍♂️');

            // 生成 161 隻小雞
            chicks = [];
            for(let i = 0; i < totalChicks; i++) {
                let angle = Math.random() * Math.PI * 2;
                // 因為地圖變大，小雞散開的範圍也稍微拉大 (40~180)
                let radius = Math.random() * 140 + 40; 
                
                chicks.push({
                    offsetX: Math.cos(angle) * radius,
                    offsetY: Math.sin(angle) * radius,
                    x: priest.x,
                    y: priest.y,
                    size: 24, 
                    emoji: '🐥',
                    caught: false,
                    speedOffset: Math.random() * 0.05 + 0.02
                });
            }
            updateChickPositions(true); 
        }

        function startGame() {
            initGame();
            overlay.style.display = 'none';
            gameActive = true;
            gameInterval = setInterval(update, 1000 / 60);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if(timeLeft <= 0) endGame(false);
            }, 1000);
        }

        function endGame(win) {
            gameActive = false;
            clearInterval(gameInterval);
            clearInterval(timerInterval);
            overlay.style.display = 'flex';
            if(win) {
                msgText.innerHTML = `𓀚 豐收！法老成功在吉薩金字塔前捕獲 ${score} 隻小雞！<br>木乃伊軍團已成形，準備征服世界！`;
            } else {
                msgText.innerHTML = `𓁀 時間到！黃沙漫天，殘餘的小雞躲進了金字塔深處！<br>你最終抓到了 ${score} 隻。`;
            }
            startBtn.innerText = "再次征服大漠";
        }

        function checkCollision(obj1, obj2) {
            let dist = Math.hypot(obj1.x - obj2.x, obj1.y - obj2.y);
            return dist < (obj1.size/2 + obj2.size/2);
        }

        function updateChickPositions(instant = false) {
            chicks.forEach(chick => {
                if (chick.caught) return;

                let targetX = priest.x + chick.offsetX;
                let targetY = priest.y + chick.offsetY;

                if (instant) {
                    chick.x = targetX;
                    chick.y = targetY;
                } else {
                    chick.x += (targetX - chick.x) * 0.07;
                    chick.y += (targetY - chick.y) * 0.07;
                    chick.x += Math.sin(Date.now() * chick.speedOffset) * 0.6;
                    chick.y += Math.cos(Date.now() * chick.speedOffset) * 0.6;
                }
            });
        }

        function update() {
            if (!gameActive) return;

            // 1. 法老移動限制（配合 1200x700 邊界）
            if (keys['ArrowUp'] && pharaoh.y > 35) pharaoh.y -= pharaoh.speed;
            if (keys['ArrowDown'] && pharaoh.y < canvas.height - 35) pharaoh.y += pharaoh.speed;
            if (keys['ArrowLeft'] && pharaoh.x > 35) pharaoh.x -= pharaoh.speed;
            if (keys['ArrowRight'] && pharaoh.x < canvas.width - 35) pharaoh.x += pharaoh.speed;

            // 2. 祭司 AI
            let dx = pharaoh.x - priest.x;
            let dy = pharaoh.y - priest.y;
            let angle = Math.atan2(dy, dx);
            
            priest.x += Math.cos(angle) * priest.speed;
            priest.y += Math.sin(angle) * priest.speed;

            // 限制祭司不超出大邊界
            priest.x = Math.max(150, Math.min(canvas.width - 150, priest.x));
            priest.y = Math.max(100, Math.min(canvas.height - 100, priest.y));

            // 3. 更新雞群
            updateChickPositions();

            // 4. 碰撞檢查
            let aliveCount = 0;
            chicks.forEach(chick => {
                if (chick.caught) return;
                aliveCount++;

                if (checkCollision(pharaoh, chick)) {
                    chick.caught = true;
                    chick.emoji = '💀'; 
                    score++;
                    scoreEl.innerText = score;
                    
                    if (score >= targetScore) {
                        endGame(true);
                    }
                }
            });

            aliveEl.innerText = aliveCount;
            draw();
        }

        // 繪製精緻金字塔背景
        function drawBackground() {
            // A. 天空漸層 (埃及黃昏夕陽色)
            let skyGrad = ctx.createLinearGradient(0, 0, 0, 450);
            skyGrad.addColorStop(0, '#e65c00'); // 深橘紅
            skyGrad.addColorStop(0.6, '#f9d423'); // 金黃
            skyGrad.addColorStop(1, '#e6c280'); // 地面沙色
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // B. 遠方小金字塔
            ctx.fillStyle = '#b3863b';
            ctx.beginPath(); ctx.moveTo(100, 450); ctx.lineTo(250, 250); ctx.lineTo(400, 450); ctx.fill();
            // 遠方金字塔陰影面
            ctx.fillStyle = '#996f2d';
            ctx.beginPath(); ctx.moveTo(250, 250); ctx.lineTo(400, 450); ctx.lineTo(330, 450); ctx.fill();

            // C. 主金字塔（巨大的胡夫金字塔剪影）
            ctx.fillStyle = '#c59b4e';
            ctx.beginPath();
            ctx.moveTo(350, 500); 
            ctx.lineTo(650, 150); // 塔尖
            ctx.lineTo(1050, 500); 
            ctx.fill();

            // 主金字塔立體陰影面 (右側背光)
            ctx.fillStyle = '#aa7f39';
            ctx.beginPath();
            ctx.moveTo(650, 150);
            ctx.lineTo(1050, 500);
            ctx.lineTo(880, 500);
            ctx.fill();

            // D. 沙漠地表與沙丘線條
            ctx.fillStyle = '#e6c280';
            ctx.fillRect(0, 450, canvas.width, 250);

            ctx.strokeStyle = '#cd9a5b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 480);
            ctx.bezierCurveTo(300, 440, 700, 520, 1200, 470);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(0, 560);
            ctx.bezierCurveTo(400, 600, 800, 530, 1200, 580);
            ctx.stroke();
        }

        function draw() {
            // 畫出最新的金字塔背景
            drawBackground();

            // 1. 畫留下來的木乃伊雞
            ctx.globalAlpha = 0.35;
            chicks.forEach(chick => {
                if (chick.caught) {
                    ctx.font = `${chick.size}px Arial`;
                    ctx.fillText(chick.emoji, chick.x, chick.y);
                }
            });
            ctx.globalAlpha = 1.0; 

            // 2. 畫活著的小雞群
            chicks.forEach(chick => {
                if (!chick.caught) {
                    ctx.font = `${chick.size}px Arial`;
                    ctx.fillText(chick.emoji, chick.x, chick.y);
                }
            });

            // 3. 畫大祭司和法老王
            priest.draw();
            pharaoh.draw();
        }

        // 預繪初始畫面
        initGame();
        draw();
    </script>
</body>
</html>
