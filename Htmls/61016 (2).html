<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>熱血羽球錦標賽 🏸</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 遊戲主容器 */
        #game-wrapper {
            position: relative;
            width: 800px;
            background: #fff;
            border: 6px solid #334155;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 頂部計分板 */
        #scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            color: #fff;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 4px solid #f59e0b;
        }

        .score-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .score-num {
            font-size: 36px;
            color: #f59e0b;
            font-family: 'Courier New', monospace;
        }

        /* 畫布區域 */
        canvas {
            background: #047857; /* 經典羽球場綠色 */
            display: block;
            cursor: crosshair;
        }

        /* 行動裝置控制列 */
        #mobile-controls {
            display: flex;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 15px 30px;
            border-top: 2px solid #e2e8f0;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            width: 80px;
            height: 60px;
            background: #3b82f6;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #1d4ed8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #1d4ed8;
        }

        #btn-hit {
            width: 120px;
            background: #ef4444;
            box-shadow: 0 4px 0 #b91c1c;
        }
        #btn-hit:active {
            box-shadow: 0 0px 0 #b91c1c;
        }

        /* 覆蓋畫面（開始與結束） */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        .overlay h1 {
            font-size: 40px;
            color: #f59e0b;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .overlay p {
            font-size: 16px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .start-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 0 #047857;
            transition: 0.1s;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #047857;
        }

        .hidden { display: none !important; }

        @media (max-width: 820px) {
            #game-wrapper { width: 100%; border-radius: 0; border: none; }
            canvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="scoreboard">
            <div class="score-box">
                <span>玩家 (🐱 喵喵)</span>
                <span id="player-score" class="score-num">0</span>
            </div>
            <div>賽制: 11 分制</div>
            <div class="score-box">
                <span id="cpu-score" class="score-num">0</span>
                <span>電腦 (🐶 汪汪)</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div id="mobile-controls">
            <div class="btn-group">
                <button class="btn" id="btn-left">◀</button>
                <button class="btn" id="btn-right">▶</button>
            </div>
            <button class="btn" id="btn-hit">揮拍 🏸</button>
        </div>

        <div id="start-screen" class="overlay">
            <h1>熱血羽球錦標賽</h1>
            <p>歡迎來到貓狗羽球世紀對決！率先獲得 11 分者獲勝！<br><br><b>⌨️ 電腦操作：</b> A / D 鍵移動， 空白鍵 (Space) 揮拍擊球<br><b>📱 手機操作：</b> 使用下方的虛擬按鈕</p>
            <button class="start-btn" id="btn-start-game">開球得分 🏁</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1 id="win-title">比賽結束</h1>
            <p id="win-desc">恭喜你獲得了最終的勝利！</p>
            <button class="start-btn" id="btn-restart-game">再戰一局 🔄</button>
        </div>
    </div>
