<script>
(function () {
  'use strict';
  var D = window.SITE_DATA;
  var STORE_KEY = 'ws-tree-open:' + location.pathname;
  var openSet = loadOpen();
  var treeEl = document.getElementById('tree');
  var emptyEl = document.getElementById('empty');
  var qEl = document.getElementById('q');
  var allPages = [];   // { node, where }

  function loadOpen() {
    try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]')); } catch (e) { return new Set(); }
  }
  function saveOpen() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(openSet))); } catch (e) {}
  }
  function href(path) {
    return './' + path.split('/').map(encodeURIComponent).join('/');
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  // 顯示路徑時拿掉最前面的 Htmls
  function where(path) {
    var parts = path.split('/'); parts.shift(); parts.pop();
    return parts.length ? parts.join(' › ') : '最上層';
  }
  // 把關鍵字標上螢光筆（用 DOM 組，不用 innerHTML，檔名有特殊字元也安全）
  function setText(node, text, q) {
    node.textContent = '';
    if (!q) { node.textContent = text; return; }
    var low = text.toLowerCase(), i = 0, j;
    while ((j = low.indexOf(q, i)) !== -1) {
      if (j > i) node.appendChild(document.createTextNode(text.slice(i, j)));
      node.appendChild(el('mark', null, text.slice(j, j + q.length)));
      i = j + q.length;
    }
    if (i < text.length) node.appendChild(document.createTextNode(text.slice(i)));
  }

  function pageItem(f, q, icon, extraCls) {
    var a = el('a', 'page' + (extraCls ? ' ' + extraCls : ''));
    a.href = href(f.path);
    a.appendChild(el('span', 'ico', icon || '📄'));
    var info = el('span', 'info');
    var nm = el('span', 'name'); setText(nm, f.name, q); info.appendChild(nm); nm.style.display = 'block';
    if (f.title && f.title !== f.name) {
      var tt = el('span', 'title'); setText(tt, f.title, q); tt.style.display = 'block'; info.appendChild(tt);
    }
    a.appendChild(info);
    if (f.mtime) a.appendChild(el('span', 'date', '🕒 ' + f.mtime.slice(0, 10)));
    return a;
  }

  function matches(text, q) { return !!text && text.toLowerCase().indexOf(q) !== -1; }

  // 回傳 <li> 或 null（搜尋時沒有符合的就不顯示）
  function buildFolder(d, depth, q) {
    var selfHit = q && matches(d.name, q);
    var kids = [];
    d.children.forEach(function (c) {
      var li = c.t === 'd' ? buildFolder(c, depth + 1, selfHit ? '' : q) : buildFile(c, q && !selfHit ? q : '');
      if (li) kids.push(li);
    });
    var indexHit = q && d.index && matches(d.index.title, q);
    if (q && !selfHit && !indexHit && kids.length === 0) return null;

    // 只有 index.html、沒有其他網頁的資料夾 → 直接當一個網頁顯示
    if (d.index && d.children.length === 0) {
      var li0 = el('li');
      li0.appendChild(pageItem({ name: d.name, title: d.index.title, path: d.index.path, mtime: d.index.mtime }, q, '🏠', 'home-page'));
      return li0;
    }

    var li = el('li', 'folder lv' + (depth % 4));
    var open = q ? true : openSet.has(d.path);
    if (open) li.classList.add('open');
    var row = el('div', 'folder-row');
    var head = el('button', 'folder-head');
    head.type = 'button';
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    head.appendChild(el('span', 'chev', '▶'));
    head.appendChild(el('span', 'ico', open ? '📂' : '📁'));
    var nm = el('span', 'name'); setText(nm, d.name, q); head.appendChild(nm);
    head.appendChild(el('span', 'count', d.count + ' 頁'));
    head.addEventListener('click', function () {
      var now = !li.classList.contains('open');
      li.classList.toggle('open', now);
      head.setAttribute('aria-expanded', now ? 'true' : 'false');
      head.querySelector('.ico').textContent = now ? '📂' : '📁';
      if (!qEl.value.trim()) { if (now) openSet.add(d.path); else openSet.delete(d.path); saveOpen(); }
    });
    row.appendChild(head);
    if (d.index) {
      var hb = el('a', 'home-btn');
      hb.href = href(d.index.path);
      hb.title = '開啟「' + d.name + '」的首頁';
      hb.appendChild(el('span', null, '🏠'));
      hb.appendChild(el('span', 't', '首頁'));
      row.appendChild(hb);
    }
    li.appendChild(row);
    li.dataset.path = d.path;
    var ul = el('ul');
    kids.forEach(function (k) { ul.appendChild(k); });
    li.appendChild(ul);
    return li;
  }
  function buildFile(f, q) {
    if (q && !matches(f.name, q) && !matches(f.title, q)) return null;
    var li = el('li');
    li.appendChild(pageItem(f, q));
    return li;
  }

  function collect(d) {
    if (d.index) allPages.push({ name: d.name, path: d.index.path, mtime: d.index.mtime });
    d.children.forEach(function (c) {
      if (c.t === 'd') collect(c); else allPages.push({ name: c.name, path: c.path, mtime: c.mtime });
    });
  }

  function render() {
    var q = qEl.value.trim().toLowerCase();
    document.getElementById('searchBox').classList.toggle('has-text', !!q);
    treeEl.textContent = '';
    var n = 0;
    D.tree.children.forEach(function (c) {
      var li = c.t === 'd' ? buildFolder(c, 0, q) : buildFile(c, q);
      if (li) { treeEl.appendChild(li); n++; }
    });
    emptyEl.hidden = n > 0;
    if (n === 0) {
      emptyEl.textContent = '';
      emptyEl.appendChild(el('span', 'big', q ? '🔎' : '🌱'));
      emptyEl.appendChild(document.createTextNode(q ? '找不到「' + qEl.value.trim() + '」，換個關鍵字試試看～' : '目前還沒有網頁，把 .html 檔放進 Htmls 資料夾就會出現在這裡喔！'));
    }
    document.getElementById('recentPanel').hidden = !!q || allPages.length < 4;
  }

  function setAll(open) {
    qEl.value = '';
    openSet = new Set();
    if (open) {
      (function walk(d) { d.children.forEach(function (c) { if (c.t === 'd') { openSet.add(c.path); walk(c); } }); })(D.tree);
    }
    saveOpen();
    render();
  }

  // ---------- 初始化 ----------
  document.title = D.title;
  document.getElementById('siteTitle').textContent = D.title;
  document.getElementById('siteSub').textContent = D.subtitle || '';
  var stats = document.getElementById('stats');
  [['📄', D.pages, ' 個網頁'], ['📁', D.folders, ' 個資料夾'], ['🕒', D.generated, ' 更新']].forEach(function (s) {
    var c = el('span', 'chip');
    c.appendChild(document.createTextNode(s[0] + ' '));
    c.appendChild(el('b', null, String(s[1])));
    c.appendChild(document.createTextNode(s[2]));
    stats.appendChild(c);
  });
  document.getElementById('footer').textContent = '🍬 最後更新：' + D.generated + '　·　本頁由 Sync.bat 自動產生';

  collect(D.tree);
  var recent = allPages.slice().sort(function (a, b) { return a.mtime < b.mtime ? 1 : a.mtime > b.mtime ? -1 : 0; }).slice(0, 6);
  var recentEl = document.getElementById('recent');
  recent.forEach(function (p) {
    var a = el('a'); a.href = href(p.path);
    a.appendChild(el('div', 'r-name', '📄 ' + p.name));
    a.appendChild(el('div', 'r-where', '📍 ' + where(p.path) + '　🕒 ' + (p.mtime || '').slice(0, 10)));
    recentEl.appendChild(a);
  });

  var timer;
  qEl.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(render, 120); });
  document.getElementById('clearQ').addEventListener('click', function () { qEl.value = ''; render(); qEl.focus(); });
  document.getElementById('expandAll').addEventListener('click', function () { setAll(true); });
  document.getElementById('collapseAll').addEventListener('click', function () { setAll(false); });
  render();
})();
</script>
</body>
</html>
