<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上PDF閱讀器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.7.107/pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Arial', '微軟正黑體', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            font-size: 1.5rem;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            padding: 0.5rem;
            background-color: #34495e;
            align-items: center;
        }
        
        .controls button {
            padding: 0.5rem 1rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .controls button:hover {
            background-color: #2980b9;
        }
        
        .controls button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        .page-info {
            color: white;
            margin-left: auto;
        }
        
        .file-input {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .file-input label {
            padding: 0.5rem 1rem;
            background-color: #e74c3c;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .file-input label:hover {
            background-color: #c0392b;
        }
        
        .file-input input {
            display: none;
        }
        
        .file-name {
            color: white;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .zoom-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            color: white;
        }
        
        .pdf-container {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
            background-color: #7f8c8d;
        }
        
        #pdf-viewer {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            background-color: white;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1rem 2rem;
            border-radius: 4px;
            font-size: 1.2rem;
        }
        
        /* 響應式設計 */
        @media (max-width: 768px) {
            .controls {
                flex-wrap: wrap;
            }
            
            .page-info {
                margin-left: 0;
                width: 100%;
                text-align: center;
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>線上PDF閱讀器</h1>
    </header>
    
    <div class="controls">
        <div class="file-input">
            <label for="pdf-file">選擇PDF檔案</label>
            <input type="file" id="pdf-file" accept=".pdf" />
            <span class="file-name" id="file-name">未選擇檔案</span>
        </div>
        
        <button id="prev-page" disabled>上一頁</button>
        <button id="next-page" disabled>下一頁</button>
        
        <div class="zoom-controls">
            <button id="zoom-out">縮小</button>
            <span id="zoom-level">100%</span>
            <button id="zoom-in">放大</button>
        </div>
        
        <div class="page-info">
            第 <span id="current-page">0</span> 頁，共 <span id="total-pages">0</span> 頁
        </div>
    </div>
    
    <div class="pdf-container">
        <canvas id="pdf-viewer"></canvas>
    </div>
    
    <audio id="page-turn-sound" src="/api/placeholder/400/320" alt="翻頁音效"></audio>

        // 初始化PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.7.107/pdf.worker.min.js';
        
        // 獲取DOM元素
        const pdfFile = document.getElementById('pdf-file');
        const fileName = document.getElementById('file-name');
        const prevButton = document.getElementById('prev-page');
        const nextButton = document.getElementById('next-page');
        const currentPageElement = document.getElementById('current-page');
        const totalPagesElement = document.getElementById('total-pages');
        const pdfViewer = document.getElementById('pdf-viewer');
        const pdfContainer = document.querySelector('.pdf-container');
        const zoomInButton = document.getElementById('zoom-in');
        const zoomOutButton = document.getElementById('zoom-out');
        const zoomLevelElement = document.getElementById('zoom-level');
        const pageTurnSound = document.getElementById('page-turn-sound');

        // 變數初始化
        let pdfDoc = null;
        let currentPage = 1;
        let zoomLevel = 1.0;
        const ctx = pdfViewer.getContext('2d');
        
        // 監聽檔案上傳
        pdfFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                fileName.textContent = file.name;
                loadPDF(file);
            }
        });
        
        // 載入PDF檔案
        function loadPDF(file) {
            const fileReader = new FileReader();
            
            // 顯示載入中訊息
            const loadingElement = document.createElement('div');
            loadingElement.className = 'loading';
            loadingElement.textContent = '載入中...';
            document.body.appendChild(loadingElement);
            
            fileReader.onload = function() {
                const typedArray = new Uint8Array(this.result);
                
                pdfjsLib.getDocument(typedArray).promise.then(function(pdf) {
                    pdfDoc = pdf;
                    totalPagesElement.textContent = pdf.numPages;
                    currentPage = 1;
                    
                    // 啟用按鈕
                    prevButton.disabled = currentPage === 1;
                    nextButton.disabled = currentPage === pdf.numPages;
                    
                    // 移除載入中訊息
                    document.body.removeChild(loadingElement);
                    
                    // 渲染第一頁
                    renderCurrentPage();
                }).catch(error => {
                    console.error('PDF載入錯誤:', error);
                    alert('PDF載入失敗: ' + error.message);
                    document.body.removeChild(loadingElement);
                });
            };
            
            fileReader.readAsArrayBuffer(file);
        }
        
        // 渲染當前頁面
        function renderCurrentPage() {
            pdfDoc.getPage(currentPage).then(function(page) {
                // 更新頁碼顯示
                currentPageElement.textContent = currentPage;
                
                // 計算縮放因子，使PDF適應容器寬度
                const viewport = page.getViewport({ scale: zoomLevel });
                const containerWidth = pdfContainer.clientWidth - 40; // 減去內邊距
                const containerHeight = pdfContainer.clientHeight - 40;
                
                // 設置canvas大小
                pdfViewer.width = viewport.width;
                pdfViewer.height = viewport.height;
                
                // 渲染PDF頁面
                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                page.render(renderContext);
            });
        }
        
        // 上一頁
        prevButton.addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                pageTurnSound.play();
                renderCurrentPage();
                prevButton.disabled = currentPage === 1;
                nextButton.disabled = false;
            }
        });
        
        // 下一頁
        nextButton.addEventListener('click', function() {
            if (pdfDoc && currentPage < pdfDoc.numPages) {
                currentPage++;
                pageTurnSound.play();
                renderCurrentPage();
                prevButton.disabled = false;
                nextButton.disabled = currentPage === pdfDoc.numPages;
            }
        });
        
        // 縮小
        zoomOutButton.addEventListener('click', function() {
            if (zoomLevel > 0.5) {
                zoomLevel -= 0.1;
                zoomLevel = Math.round(zoomLevel * 10) / 10; // 四捨五入到小數點後一位
                zoomLevelElement.textContent = Math.round(zoomLevel * 100) + '%';
                renderCurrentPage();
            }
        });
        
        // 放大
        zoomInButton.addEventListener('click', function() {
            if (zoomLevel < 3.0) {
                zoomLevel += 0.1;
                zoomLevel = Math.round(zoomLevel * 10) / 10; // 四捨五入到小數點後一位
                zoomLevelElement.textContent = Math.round(zoomLevel * 100) + '%';
                renderCurrentPage();
            }
        });
        
        // 鍵盤控制翻頁
        document.addEventListener('keydown', function(e) {
            if (pdfDoc) {
                if (e.key === 'ArrowLeft' && currentPage > 1) {
                    currentPage--;
                    pageTurnSound.play();
                    renderCurrentPage();
                    prevButton.disabled = currentPage === 1;
                    nextButton.disabled = false;
                } else if (e.key === 'ArrowRight' && currentPage < pdfDoc.numPages) {
                    currentPage++;
                    pageTurnSound.play();
                    renderCurrentPage();
                    prevButton.disabled = false;
                    nextButton.disabled = currentPage === pdfDoc.numPages;
                }
            }
        });
        
        // 響應式處理 - 視窗大小變化時重新渲染
        window.addEventListener('resize', function() {
            if (pdfDoc) {
                renderCurrentPage();
            }
        });
    </script>
</body>
</html>
