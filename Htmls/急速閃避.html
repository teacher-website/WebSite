<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極速閃避：網頁賽車遊戲</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            letter-spacing: 2px;
        }

        #gameCanvas {
            background-color: #333;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .instructions {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>極速閃避 (RACING)</h1>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <div class="instructions">
        操作方式：使用鍵盤左右方向鍵 (← / →) 閃避障礙物<br>
        遊戲結束後，按 <b>空白鍵 (Space)</b> 重新開始
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- 遊戲變數設定 ---
        const carWidth = 40;
        const carHeight = 70;
        let carX = (canvas.width - carWidth) / 2;
        const carY = canvas.height - carHeight - 30;
        const carSpeed = 7;

        // 障礙物設定
        const obstacleWidth = 50;
        const obstacleHeight = 50;
        let obstacleX = Math.random() * (canvas.width - obstacleWidth - 80) + 40;
        let obstacleY = -obstacleHeight;
        let obstacleSpeed = 5;

        // 按鍵狀態監聽
        let rightPressed = false;
        let leftPressed = false;

        // 遊戲狀態
        let score = 0;
        let gameOver = false;

        // --- 監聽鍵盤事件 ---
        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = true;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = true;
            } else if (e.key === " " && gameOver) {
                // 遊戲結束時按空白鍵重置
                resetGame();
            }
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = false;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = false;
            }
        }

        // --- 遊戲重置功能 ---
        function resetGame() {
            carX = (canvas.width - carWidth) / 2;
            obstacleY = -obstacleHeight;
            obstacleX = Math.random() * (canvas.width - obstacleWidth - 80) + 40;
            obstacleSpeed = 5;
            score = 0;
            gameOver = false;
            draw(); // 重新啟動遊戲迴圈
        }

        // --- 繪製功能 ---
        function drawBackground() {
            // 賽道
            ctx.fillStyle = "#444";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 左側黃線
            ctx.fillStyle = "#FFD700";
            ctx.fillRect(30, 0, 6, canvas.height);

            // 右側黃線
            ctx.fillStyle = "#FFD700";
            ctx.fillRect(canvas.width - 36, 0, 6, canvas.height);
        }

        function drawPlayer() {
            // 車身 (藍色)
            ctx.fillStyle = "#007BFF";
            ctx.fillRect(carX, carY, carWidth, carHeight);

            // 車窗 (白色)
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(carX + 5, carY + 12, carWidth - 10, 15);
            
            // 輪胎
            ctx.fillStyle = "#000";
            ctx.fillRect(carX - 3, carY + 10, 3, 15); // 左前
            ctx.fillRect(carX + carWidth, carY + 10, 3, 15); // 右前
            ctx.fillRect(carX - 3, carY + 45, 3, 15); // 左後
            ctx.fillRect(carX + carWidth, carY + 45, 3, 15); // 右後
        }

        function drawObstacle() {
            // 障礙物 (紅色)
            ctx.fillStyle = "#DC3545";
            ctx.fillRect(obstacleX, obstacleY, obstacleWidth, obstacleHeight);
        }

        function drawScore() {
            ctx.font = "bold 20px Arial";
            ctx.fillStyle = "#FFF";
            ctx.fillText("Score: " + score, 20, 35);
        }

        function drawGameOver() {
            // 半透明遮罩
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 結束文字
            ctx.font = "bold 40px Arial";
            ctx.fillStyle = "#DC3545";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

            // 分數
            ctx.font = "24px Arial";
            ctx.fillStyle = "#FFF";
            ctx.fillText("Final Score: " + score, canvas.width / 2, canvas.height / 2 + 20);

            // 提示
            ctx.font = "16px Arial";
            ctx.fillStyle = "#FFD700";
            ctx.fillText("Press SPACE to Restart", canvas.width / 2, canvas.height / 2 + 70);
        }

        // --- 碰撞偵測 ---
        function checkCollision() {
            if (
                carX < obstacleX + obstacleWidth &&
                carX + carWidth > obstacleX &&
                carY < obstacleY + obstacleHeight &&
                carY + carHeight > obstacleY
            ) {
                gameOver = true;
            }
        }

        // --- 遊戲主迴圈 ---
        function draw() {
            if (gameOver) {
                drawGameOver();
                return; // 停止更新與繪製
            }

            // 清空畫布並繪製背景
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            // 繪製物件
            drawPlayer();
            drawObstacle();
            drawScore();

            // 碰撞偵測
            checkCollision();

            // 玩家移動與邊界限制 (不超出黃線)
            if (rightPressed && carX < canvas.width - carWidth - 40) {
                carX += carSpeed;
            } else if (leftPressed && carX > 40) {
                carX -= carSpeed;
            }

            // 障礙物往下移動
            obstacleY += obstacleSpeed;

            // 當障礙物超出螢幕底部：重置位置並加分
            if (obstacleY > canvas.height) {
                obstacleY = -obstacleHeight;
                obstacleX = Math.random() * (canvas.width - obstacleWidth - 80) + 40;
                score += 1;
                obstacleSpeed += 0.4; // 難度隨分數提高，速度變快
            }

            // 請求下一幀動畫 (維持 60FPS 左右)
            requestAnimationFrame(draw);
        }

        // 啟動遊戲
        draw();
    </script>
</body>
</html>
