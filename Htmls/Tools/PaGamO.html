過後，首先打開門窗並確保逃生路線，然後要關上火源、瓦斯及電源開關，以防發生2次災害(如火災)，不要佔用電話線聊天。","s":"內政部消防署"},{"i":3182075,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"震後停水，平時要養成儲備飲用水習慣，請問成人每天約需要多少飲用水？","z":"做環保的手，是最美的手。","o":[["A","0至0.5公升"],["B","1至2公升"],["C","10公升"]],"a":"B","e":"飲用水最低限度必要量，以體重每公斤約需15毫升來判斷，體重60公斤者至少需900毫升，因此每天至少需要飲用1公升的水，如有炊事用水考量，則1天需備有3公升用水才比較安心:另家中最好能儲存每人至少3天的用水。","s":"內政部消防署"},{"i":3182076,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"使用滅火器前往滅火時，下列何者是正確的？","z":"垃圾變黃金，黃金變愛心，愛心化清流，清流繞全球。","o":[["A","先拔插梢，再持滅火器往火點移動"],["B","先持滅火器往火點移動再拔插梢"]],"a":"B","e":"滅火器操作步驟：1.提起滅火器，向火源移動。2.拉開安全插梢。3.握住皮管，朝向火苗。4.用力握下手壓柄。5.朝向火源根部噴射，左右移動掃射。","s":"內政部消防署"},{"i":3182077,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"廚房炒菜時火太大，造成油鍋起火，最快最簡單的正確滅火的方法是要先做什麼?再關閉瓦斯。","z":"資源回收的目的，在於提倡與教育人人懂得惜福。","o":[["A","直接蓋鍋蓋"],["B","用抺布覆蓋"],["C","將蔬菜丟進鍋裏"],["D","趕快用水滅火"]],"a":"A","e":"使用抺布覆蓋滅火時，抺布無法完全密閉阻隔空氣，是無法滅火，另將蔬菜丟進鍋裏，則會造成火焰擴大，油會飛濺，如果是用水澆火，油鍋的高温會使水變成水蒸氣，體積膨脹1700倍，油會四處飛濺，且水比油重，未揮發的水蒸氣沈在燃燒的油的下面，是無法達到滅火的效果，這3種油鍋滅火方式都是非常危險的。油鍋滅火，重點在阻隔空氣，使油鍋內的火，無法繼續燃燒，用大小符合的鍋蓋蓋上，即可完全滅火，且不致復燃。","s":"內政部消防署"},{"i":3182078,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"住宅中最重要的消防設備是甚麼？","z":"保護大地，需從建設人心開始。","o":[["A","滅火器"],["B","緊急照明燈"],["C","住宅用火災警報器"],["D","緩降機"]],"a":"C","e":"人們在睡覺時，對外界的視覺、觸覺及嗅覺都不甚靈敏，很難察覺火災的煙、熱或是燒焦味等到驚醒時，往往已經深陷火海，逃生困難，所以為了及早察覺火災，必須安裝住宅用火災警報器，藉由住宅用火災警報器偵知火災發生並發出警報聲響的功能，輔助人們越早發現火災，進而越早通報119並採取滅火或逃生避難行動，就有越大的機會保護自身與家人的生命財產安全。","s":"內政部消防署"},{"i":3182079,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"人們在睡覺時，對外界的視覺、觸覺及嗅覺都不甚靈敏，很難察覺火災的煙、熱或是燒焦味，等到驚醒時，往往已經深陷火海，逃生困難，所以一般家中為及早察覺火災，要安裝什麼設備，才能及早偵測知道火災發生？","z":"為自己找藉口，就不會進步。","o":[["A","滅火器"],["B","緊急照明燈"],["C","住宅用火災警報器"],["D","緩降機"]],"a":"C","e":"根據97年至106年建築物火災死亡數據統計，住宅火災死亡人數於凌晨0時至6時此時段發生最多，而死亡原因則是火災發現太慢以致初期應變失敗、避難太晚或是高齡者避難不易為主因。當人們處於睡眠狀態時，對外界的視覺、觸覺及嗅覺都不甚靈敏，很難察覺火災初期的煙、熱、燒焦味而及早發現危險。等到驚醒時，往往已經深陷火海，難以倖存；或甚至於睡夢中即已罹難而不自知。所以藉由住宅用火災警報器偵測火災發生，並發出警報聲響的功能，才能警告大家，越早發現火災，越早採取滅火或避難行動，就有越大的機會保護自身與家人的生命財產安全。","s":"內政部消防署"},{"i":3182080,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"熱水器的安裝，最重要的就是要保持通風，有關屋外式熱水器之安裝處所，下列何者正確？","z":"能先付出愛心，就能得無數人的愛。","o":[["A","安裝在加裝窗戶的陽臺"],["B","安裝在廚房"],["C","安裝在建築物外牆"],["D","安裝在浴室"]],"a":"C","e":"燃氣熱水器應依安裝環境選擇適當的型式，如為屋外式熱水器應安裝於屋外通風良好處所；如為屋內式熱水器，則應依規定正確裝設排氣管。常聞一氧化碳中毒事件常見行為，多是在通風不良的環境中使用瓦斯爐或瓦斯熱水器,因此在不同的地方安裝正確形式的熱水器，保持良好通風是很重要的。","s":"內政部消防署"},{"i":3182081,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"防震準備很重要，居家防震準備有那些?","z":"有心要付出，就有無限的能力。","o":[["A","家具固定"],["B","準備緊急避難包"],["C","準備3日食物飲用水"],["D","以上皆是"]],"a":"D","e":"臺灣位於歐亞大陸板塊與菲律賓海板塊交會處，地震活動頻繁，且經常有強烈地震發生，也因此地震前的準備是相當重要的。1. 依據日本地震經驗，46%之民眾受到家具翻落、掉落或移動而受傷。因此地震前預先固定好家具，更顯得重要，居家內可以利用L型金屬零件、支柱式固定器、鏈條、固定墊片等物品，避免家具因地震翻落、掉落或移動而遭受傷害。2. 緊急避難包是因地震結束後發現建築物有嚴重的結構損傷，民眾須至避難場所進行避難，可攜帶已備妥好的緊急避難包前往，緊急避難包內的物品可和家人事先討論，可以為乾糧、保暖衣物、醫療及清潔用品或貴重物品類，有小孩的家庭，則可多準備奶粉、紙尿褲等。3. 重大地震發生後，可能會造成居家停水停電，或是附近交通物流中斷，食物飲水物資可能無法即時運送，大家必須暫時留在家中避難生活時，都必須要預先準備食物飲水，最好每位家庭成員都能準備3日以上份量之食物及飲用水，才不會陷入斷糧斷水的危機喔。","s":"內政部消防署"},{"i":3182082,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"既然地震不能預測，就必須事前做好準備，緊急避難包就是其中一個重要事前整備事項，裡面需要準備食物與水，所以如果發生地震時，跑到冰箱旁邊躲避也可以收到相同的效果，以上說法是否正確？","z":"能付出的人生，最快樂也最踏實。","o":[["A","正確"],["B","不正確"]],"a":"B","e":"冰箱本身就是相當笨重的大型家具，發生地震時很有可能會翻覆傾倒，造成附近的人嚴重受傷甚至死亡，況且如果真的受困於倒塌建築物中，被眾多瓦礫、碎片活埋，環境空間狹小，冰箱門也不一定能夠順利開啟。因此嘗試躲到冰箱旁邊是相當危險的選擇。","s":"內政部消防署"},{"i":3182083,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"緊急避難包是甚麼情況下才會需要使用到？","z":"若要明天平安，就要將今日做好。","o":[["A","遭倒塌建築物活埋時，延長受困的待救時間"],["B","大門變形出不去的時候使用"],["C","建築因地震損傷而變成危險建築，需要疏散到避難收容場所時"]],"a":"C","e":"地震無法預測，因此期望建物倒塌時能取得緊急避難包是不切實際的。緊急避難包是在因建築物受損，必須撤離建築物到避難收容場所暫時安置時使用的，由於物資支援需要時間，在物資抵達的空窗期，得仰賴緊急避難包的物資暫時生活。","s":"內政部消防署"},{"i":3182085,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"發生地震時，是否需要立刻去取得緊急避難包？","z":"盡本分，得本事。","o":[["A","需要"],["B","不需要"]],"a":"B","e":"發生地震時，應該要立即就地掩蔽、保護自己，緊急避難包不是在地震發生時使用的，因此不應該、也不需要在地震時去設法取得緊急避難包。","s":"內政部消防署"},{"i":3182086,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"居家平常應該將緊急避難包放在何處較適當？","z":"多一個好習慣，就少一個壞習慣。","o":[["A","臥房的床邊"],["B","保險櫃"],["C","放置在玄關門口附近或避難動線上隨手可拿到的地方"]],"a":"C","e":"因為緊急避難包是要離家避難時使用，而要離開家一定要經過家的大門，故平時應放在大門旁，方便取用；另外，原則上只要是在避難動線上之指定位置(經過家族、學校成員討論評估過的)亦可放置。","s":"內政部消防署"},{"i":3182087,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列關於地震規模及震度的描述，何者正確？","z":"清淨的生活，從齋戒開始。","o":[["A","本次地震規模6.5級，震度5"],["B","本次地震規模6.5，震度5級"],["C","本次地震規模6.5，震度5.5級"]],"a":"B","e":"規模是指地震釋放能量的大小，數字有小數點，不加「級」字；震度是指地表搖晃程度，數字無小數點，加上「級」字，如921地震規模為7.3，各地震度不同，南投魚池震度7級、雲林古坑6級、花蓮市5級、台北市4級","s":"內政部消防署"},{"i":3182088,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"開車中遇到大地震，應該怎麼反應？","z":"物質可以貧，但是心靈、志氣不能貧。","o":[["A","停靠路邊，下車逃向附近建築物"],["B","停靠路邊，下車躲在車子旁"],["C","停靠路邊，留在車上"]],"a":"C","e":"因為大地震會造成車子像爆胎一樣，打滑蛇行，故儘速停靠路邊以免發生危險，且留在車內比不會被掉落物品打到，相對比較安全。","s":"內政部消防署"},{"i":3182089,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"爐火烹調導致油鍋起火時，用水撲滅適不適合？","z":"懂得生活禮儀，就懂得愛自己；自愛的人，才會愛人。","o":[["A","適合"],["B","不適合"]],"a":"B","e":"水倒入油鍋中會立刻被高溫的食用油汽化，體積會膨脹超過1700倍的水蒸氣，會將高溫的油和火勢推出鍋外，造成更嚴重的蔓延。","s":"內政部消防署"},{"i":3182091,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"使用中的電線不能綑綁，對嗎？","z":"屋寬不如心寬。","o":[["A","對"],["B","錯"]],"a":"A","e":"綑綁的電線容易蓄熱，容易短路引起火災。","s":"內政部消防署"},{"i":3182092,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"綑綁的電線會造成蓄熱，而這些熱引起電線短路前通常會出現什麼現象？","z":"甘願做，歡喜受。","o":[["A","冒白煙"],["B","冒黑煙"],["C","看到小火星"]],"a":"A","e":"因為短路前會先蓄熱，而這些熱會讓電線的表皮開始冒白煙，且會聞到燒焦味，所以看到電線冒白煙，通常是短路的前兆。","s":"內政部消防署"},{"i":3182093,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"遭遇火警，在樓梯間還可以逃生的狀況下，應該選擇怎麼做？","z":"素食可培養耐力、慈悲與智慧。","o":[["A","往上逃"],["B","往下逃"],["C","視情況"]],"a":"B","e":"煙熱會先蔓延到高樓層，然後向下累積，因此樓層越高，溫度越高、煙越濃、狀況越危險，還可以逃生的狀況必定是指樓梯間還不會感受到煙熱的狀況，此時應該要選擇往下逃生。","s":"內政部消防署"},{"i":3182094,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"我們知道電線過熱會引起短路，而最常見的PVC電線，其絕緣物之容許溫度是攝氏幾度？","z":"福從做中得歡喜，慧從善解得自在。","o":[["A","40度"],["B","50度"],["C","60度"],["D","70度"]],"a":"C","e":"依用戶用電設備裝置規則，低壓絕緣電線之最高容許溫度PVC是攝氏60度，也就是電線如果過載，讓電線超過60度，就有可能引起電線短路，還有就是環境溫度超過60度，也有可能引起電線短路。","s":"內政部消防署"},{"i":3182095,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"Jennifer平常有好好學習防災知識，所以她知道地震時應該要先躲，此時她身邊剛好有桌子，而且不是玻璃桌，那麼應該躲哪裡？","z":"懂得惜福，就會造福；真正造福的人，才是真富有。","o":[["A","桌下"],["B","桌旁"]],"a":"A","e":"躲桌下絕對比躲桌旁安全，因為不會被掉落物品打到，也不會被移位的桌子撞倒，過去有人講桌旁才有生命三角，那是不對的觀念及做法。","s":"內政部消防署"},{"i":3182096,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"地震結束後，Jennifer趕快到房間看看大白天就在睡懶覺的Marco有沒有事，還好Marco也在地震當下立刻做出正確的應變。請問在睡夢中遇到大地震的Marco做了甚麼應變才是正確的？","z":"說做、想做，不如動手做。","o":[["A","滾到床邊躲避"],["B","留在床上，保護頭頸部"],["C","滾到床底下尋求保護"]],"a":"B","e":"平時清醒時遇到大地震通常可以立即察覺，睡夢中被地震驚醒時可能地震已經發生一段時間，且很有可能已有物品掉落，再加上半夜沒有照明，無法立刻確認周圍是否有危險，此時貿然滾到床邊或床下，都是在增加自身的危險，也有可能被移位的床鋪撞到，建議的應變方法是留在床上，盡量縮小身體，保護頭頸部。尤其保護頭頸部是最重要的動作。","s":"內政部消防署"},{"i":3182097,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"雖然地震時，Jennifer和Marco立刻做了正確的應變，但是如果沒有在平時做好家具固定，地震來臨時還是會有很大的危險。請問下列哪個是正確的家具固定方法？","z":"小事不做，大事難成。","o":[["A","以安全鎖固定櫥櫃"],["B","以支架固定衣櫃"],["C","以T型固定器固定書櫃"],["D","以上皆是"]],"a":"D","e":"被掉落物砸傷是地震造成傷亡的主要原因之一，也因為無法地震何時會來臨，平時做好減災準備至關重要，家具固定就是一項非常重要的減災準備。","s":"內政部消防署"},{"i":3182098,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"經過剛才的大地震之後，Jennifer決定要帶著緊急避難包疏散到外面，請問她可能是遇到了甚麼情形，才決定要疏散？","z":"感恩要表於行動。","o":[["A","家具、物品移位、掉落、翻覆，恐在餘震時導致傷亡"],["B","聽到「建築物有異聲」類似「碰、碰」的巨大聲響時"],["C","建築物受損嚴重，牆、樑、柱爆開或明顯變形、倒塌"],["D","以上皆是"]],"a":"D","e":"上述三種情況都代表有危險存在，尤其建築物嚴重受損，應該要選擇疏散避難，以策安全。","s":"內政部消防署"},{"i":3182099,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"半夜發生火警，最害怕的狀況是睡夢中無法察覺，等到發現火災時已經來不及應變，因此哪一種居家消防設備可以及早警報火災？","z":"福不是用求的，是用做的。","o":[["A","滅火器"],["B","緩降機"],["C","火災警報器"],["D","緊急照明燈"]],"a":"C","e":"00時~06時的火警最容易造成人命傷亡，合理的解釋是因為這個時段人們多半已進入睡眠狀態。相較於清醒時，睡夢中較難於火災剛發生時立刻察覺，因此當睡夢中驚醒發覺火災時，常常已沒有足夠時間進行適當的應變。因此能及早發現、及早獲知火警，是火災應變的重要關鍵，不論後續的應變將採取滅火或是逃生，若沒有第一時間獲知火災，後續的應變皆無法啟動。故居家最重要的消防設備是火災警報器。","s":"內政部消防署"},{"i":3182100,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"來到陌生的公共場所，事前應該做哪些事，可在萬一發生火災時，增加自己的安全？","z":"多做多得，少做多失。","o":[["A","詳細閱讀逃生路線圖"],["B","確認兩方向出口位置"],["C","確認常閉式防火門確實關閉"],["D","以上皆是"]],"a":"D","e":"來到陌生的公共場所，應先確認逃生出口的位置，以及逃生通道是否暢通；另外，防火門確實關閉才能在火災發生時，避免火煙快速的流竄而阻斷可以逃生的路線。這些都是在公共場合應先確定的事情，才能更有效的保障安全。","s":"內政部消防署"},{"i":3182101,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"某天Jennifer從外面返家，一進家門就聞到了濃濃的瓦斯臭味，她不知道瓦斯洩漏多久了，這時Jennifer最理想的處理措施是甚麼？","z":"心善造福是福氣。","o":[["A","打開抽風機"],["B","打開窗戶"],["C","立刻離開現場"],["D","嘗試關閉瓦斯開關"]],"a":"C","e":"從外返家時聞到瓦斯臭味，此時無法確定瓦斯洩漏多久，亦無法確認洩漏量有多少，很有可能現場瓦斯含量已達爆炸範圍，隨時都有發生爆炸的危險，此時關閉瓦斯開關或是開啟窗戶都無法在短時間之內有效降低瓦斯濃度；開關電器更是危險的舉動，開關電器生成的火花很可能引發爆炸，因此立刻離開現場在戶外撥打119報案才是上策。","s":"內政部消防署"},{"i":3182102,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"經歷這次經驗之後，Jennifer決定在家安裝瓦斯漏氣檢知器以策安全。如果Jennifer家裡是使用天然氣，那麼瓦斯漏氣檢知器應安裝在甚麼位置才正確？","z":"樂於付出，心靈富足。","o":[["A","靠近天花板附近"],["B","靠近地面附近"]],"a":"A","e":"天然氣的主要成分是甲烷，比重比空氣小，因此洩漏時會往上飄，蓄積在天花板附近，因此使用天然氣的狀況，瓦斯漏氣檢知器要裝在天花板附近才能有效偵測。相反的，液化石油氣的主要成分是丙烷和丁烷，比重比空氣大，洩漏時會往下沉，累積在地面附近，因此使用液化石油氣的狀況，瓦斯漏氣檢知器要裝在地面附近才能有效偵測。","s":"內政部消防署"},{"i":3182103,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"偵煙式住宅用火災警報器不能裝在哪裡？","z":"一心做好事，自然就有福。","o":[["A","客廳"],["B","廚房"],["C","房間"],["D","樓梯"]],"a":"B","e":"因廚房平時可能有炒菜油煙，為了避免偵煙式住宅用火災警報器響起之錯誤動作等情形發生，故類似廚房平時會產生煙粒子之場所，應裝設定溫式住宅用火災警報器為宜。","s":"內政部消防署"},{"i":3182104,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"滅火器的使用順序，下列何者正確？","z":"真正的歡喜，不在於擁有多少，而是有愛。","o":[["A","拉瞄壓掃"],["B","瞄掃拉壓"],["C","壓拉掃瞄"],["D","掃壓瞄拉"]],"a":"A","e":"滅火器的使用順序為1.拉-拉插銷2.瞄-瞄準火源底部3.壓-壓握把4.掃-向火源底部左右掃射","s":"內政部消防署"},{"i":3182105,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"有關火場逃生避難的觀念，下列何者正確？","z":"少欲知足，是最富有的人生。","o":[["A","躲在浴室裡是最安全的"],["B","逃生時要用濕毛巾摀口鼻"],["C","開門若遇濃煙要盡快穿越濃煙逃生"],["D","如果樓梯間沒濃煙就往下逃生"]],"a":"D","e":"A.不可躲在浴室1) 火場第一殺手為濃煙，而浴室的門和天花板大多是塑膠材質，塑膠門不耐高溫，只要濃煙溫度達到約200度至400度就可以使塑膠門熔化變形，且浴室門下方也有通風百葉，因此躲在浴室裡面無法有效阻絕濃煙，最後會因為遭到濃煙侵襲而造成人命傷亡。2)浴室內排水孔下方設有「存水彎」利用彎曲造型將積水留在排水管內， 發揮隔氣作用，避免排水管內的臭味流入室內，所以也不會有新鮮空氣流入浴室內。3) 浴室內常沒有對外窗戶，無法對外呼叫求救，消防人員不易發現。B.不可浪費時間尋找濕毛巾而延誤逃生避難濃煙是火場的頭號殺手，因此不可嘗試穿越濃煙逃生，而以往用濕毛巾摀口鼻即可穿越濃煙逃生的觀念其實是錯誤的，因為濕毛巾擋不住濃煙中會造成人命傷亡的一氧化碳和有毒氣體，因此火場逃生避難時，千萬不可以浪費寶貴的逃生避難時間尋找濕毛巾或塑膠袋等這些無法保護您的無用物品，以免延誤逃生避難時機而不幸受困火場。C.開門若有煙霧則不可嘗試穿越煙霧逃生，應關門退回室內 ，並用衣物或毛巾將門縫塞住，防止煙霧流入，改採其它逃生避難路 線。D.火場逃生最佳策略就是離開建築物，而離開建築物最好的方法就是往一樓往外逃生，而且由於煙平均上升速度為每秒３～５公尺，人平均往上速度為每秒０.５公尺，人往上跑是跑不贏煙的，因此火場逃生原則為往下逃生。","s":"內政部消防署"},{"i":3182106,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"為了避免火災發生，下列何者為錯誤的生活習慣？","z":"人生富足之道，不在於物質，而在於自心。","o":[["A","作飯煮菜時人若要暫時離開，應先關閉瓦斯爐火"],["B","火柴、打火機應妥善收藏，以免小孩拿取"],["C","冬天使用電暖器取暖時，可同時烘乾衣物"],["D","排煙機及風管的油污應定期清理"]],"a":"C","e":"使用電熱器時，應距離可燃物 1 公尺以上，不可用來烘衣服。","s":"內政部消防署"},{"i":3182108,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"身上著火時，應立即做的動作步驟為下列何者?","z":"有愛的人生才幸福。","o":[["A","停、躺、滾"],["B","沖、脫、泡、蓋、送"],["C","走、跑、跳"]],"a":"A","e":"1) 如為局部小面積著火，可用手拍熄。2) 如為四肢或身體大面積著火，則切記口訣：停躺滾！不可慌張與亂跑， 並採取下列步驟：A. 馬上【停】在原地，切勿奔跑以免助長火勢。B.【躺】下來，立刻將雙手摀在臉上，減少顏面傷殘機會，並可將所遭 受到的傷害降到最低。C. 左右來回翻【滾】，直到火勢熄滅。","s":"內政部消防署"},{"i":3182109,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"如果目睹了火災的發生，正確的反應動作為何？","z":"人生的價值，在於能為人間負責任。","o":[["A","如果感覺到火災發生時一定要立刻撥打119電話報案，假如自己無法打電話時，請大聲叫喊『失火了，快打119』，讓聽到的其他民眾幫您報案"],["B","報警時應儘可能正確詳細，例如『 ○○鄉(鎮、市)○○路○○號○○樓的住宅失火了在○○小學對面，廚房起火，二樓有兩個小孩。 』等，消防車和救護車才能早點到達"],["C","大廈等高層住宅，應一併說明樓層數，以利迅速調派適當高度之雲梯車前往搶救"],["D","以上皆是"]],"a":"D","e":"大家不要有打了119被鄰居知道了，會很不好意思的觀念，假如延遲報案造成火勢擴大延燒，反而得不償失。119電話全部都是在消防局(隊)救災救護指揮中心接收，因此，報案時不可僅僅說出街道名稱；應說出詳細地址、附近明顯建築物及現場狀況，例如『 ○○鄉(鎮、市)○○路○○號○○樓的住宅失火了在○○小學對面，廚房起火，二樓有兩個小孩。 』等，消防車和救護車才能早點到達。大廈等高層住宅，應一併說明樓層數，以利迅速調派適當高度之雲梯車前往搶救。","s":"內政部消防署"},{"i":3182110,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"聽到消防車、救護車的警報，不立即避讓者，會有什麼處罰?","z":"擁有正確的人生觀，才能擁有幸福的人生。","o":[["A","汽車駕駛人將處以新臺幣3,600元罰鍰，並吊銷駕駛執照"],["B","被PO上爆料公社"]],"a":"A","e":"汽車駕駛人聞消防車、救護車、警備車、工程救險車、毒性化學物質災害事故應變車之警號不立即避讓者，依「道路交通管理處罰條例」第45條規定，處汽車駕駛人新臺幣3,600元罰鍰，並吊銷駕駛執照至少1年不得考領","s":"內政部消防署"},{"i":3182111,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"緊急救護服務號碼是","z":"做對人生有意義的事，才是生命真正的價值。","o":[["A","119"],["B","110"],["C","116"],["D","113"]],"a":"A","e":"如遇身體不舒服急需送醫時，可撥打119請求消防局派遣救護車將人員送往就近醫院。","s":"內政部消防署"},{"i":3182112,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"防災士於平時得執行下列任務：","z":"今天只要有一次，應好好把握做該做的事。","o":[["A","協助相關單位執行防災相關工作，做為在地防災工作推動的主要骨幹"],["B","與相關單位內或鄰近地區的志工團體，建立起聯繫管道"],["C","初步掌握相關單位和鄰近地區的災害潛勢、脆弱度"],["D","以上皆是"]],"a":"D","e":"一、防災士於平時得執行下列任務：（一）協助相關單位執行防災相關工作，做為在地防災工作推動的主要骨幹。（二）與相關單位內或鄰近地區的志工團體，建立起聯繫管道。（三）初步掌握相關單位和鄰近地區的災害潛勢、脆弱度。二、防災士於災時得執行下列任務：（一）擔任聯絡窗口，掌握與通報最新災情資訊。（二）相關單位如有災情時，能進行通報。（三）協助相關單位人員採取正確行動，能夠迅速應變。（四）協助執行應變工作，如人員疏散避難、收容所開設與管理等。三、防災士於災後得執行下列任務：（一）組織相關單位人員來進行復原工作。（二）協助掌握相關單位災情。（三）能夠協助或引導外部資源進入相關單位來協助復原重建。（四）能夠擔任公部門與救災單位與社區或企業及民眾溝通的橋梁。","s":"內政部消防署"},{"i":3182113,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"防災士於災時得執行下列任務：","z":"人生的責任，是要做利益人群的事。","o":[["A","擔任聯絡窗口，掌握與通報最新災情資訊"],["B","相關單位如有災情時，能進行通報"],["C","協助執行應變工作，如人員疏散避難、收容所開設與管理等。"],["D","以上皆是"]],"a":"D","e":"一、防災士於平時得執行下列任務：（一）協助相關單位執行防災相關工作，做為在地防災工作推動的主要骨幹。（二）與相關單位內或鄰近地區的志工團體，建立起聯繫管道。（三）初步掌握相關單位和鄰近地區的災害潛勢、脆弱度。二、防災士於災時得執行下列任務：（一）擔任聯絡窗口，掌握與通報最新災情資訊。（二）相關單位如有災情時，能進行通報。（三）協助相關單位人員採取正確行動，能夠迅速應變。（四）協助執行應變工作，如人員疏散避難、收容所開設與管理等。三、防災士於災後得執行下列任務：（一）組織相關單位人員來進行復原工作。（二）協助掌握相關單位災情。（三）能夠協助或引導外部資源進入相關單位來協助復原重建。（四）能夠擔任公部門與救災單位與社區或企業及民眾溝通的橋梁。","s":"內政部消防署"},{"i":3182114,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"防災士於災後得執行下列任務：","z":"人生若能減低欲望，生活上便沒有什麼值得計較。","o":[["A","組織相關單位人員來進行復原工作"],["B","能夠協助或引導外部資源進入相關單位來協助復原重建"],["C","能夠擔任公部門與救災單位與社區或企業及民眾溝通的橋梁"],["D","以上皆是"]],"a":"D","e":"一、防災士於平時得執行下列任務：（一）協助相關單位執行防災相關工作，做為在地防災工作推動的主要骨幹。（二）與相關單位內或鄰近地區的志工團體，建立起聯繫管道。（三）初步掌握相關單位和鄰近地區的災害潛勢、脆弱度。二、防災士於災時得執行下列任務：（一）擔任聯絡窗口，掌握與通報最新災情資訊。（二）相關單位如有災情時，能進行通報。（三）協助相關單位人員採取正確行動，能夠迅速應變。（四）協助執行應變工作，如人員疏散避難、收容所開設與管理等。三、防災士於災後得執行下列任務：（一）組織相關單位人員來進行復原工作。（二）協助掌握相關單位災情。（三）能夠協助或引導外部資源進入相關單位來協助復原重建。（四）能夠擔任公部門與救災單位與社區或企業及民眾溝通的橋梁。","s":"內政部消防署"},{"i":3182115,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"防災士主要能貢獻在哪些領域？","z":"知足的人心量開闊，心量開闊，對人對事就不會計較。","o":[["A","自助、協助及公助"],["B","自助及互助"],["C","互助及公助"],["D","自助及協助"]],"a":"B","e":"自助、互助及協作","s":"內政部消防署"},{"i":3182116,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"對於防災士的敘述何者正確？","z":"能幫助別人，能為社會盡一分力，即使一點一滴都有大用；因為有一分心，就有一分力量。","o":[["A","防災士要於災前輔助社區、公所，所有的防災演練及宣導活動"],["B","防災士可以利用防災士名義向外招攬圖利"],["C","防災士並非被動地接收資訊，而是應積極主動地蒐集資訊、且不斷提升自身的知識與行動力"],["D","民眾只能經由內政部或直轄市、縣（市）政府培訓才能成為防災士"]],"a":"C","e":"A. 並非所有的防災演練及宣導活動皆須輔助。B. 不行D. 皆透過防災士培訓機構受訓成為防災士。","s":"內政部消防署"},{"i":3182117,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列敘述何者不屬於「自助」的精神？","z":"人應擴大愛心，於富中修慧，此福慧平行齊進，並取諸社會、用諸社會，即是植福修慧。","o":[["A","災害發生時，無論面臨何種狀況，「守護自身性命」為永遠不變的法則"],["B","自助精神只適用於災害發生時"],["C","防災士平時便應做好萬全準備、學習防災及減災的相關知識和技能，並持續提升自我能力"],["D","要先以自身安全為原則，如不幸喪生或受重傷，則無法救助家人、鄰居等，亦無法對災後重建或振興有所貢獻"]],"a":"B","e":"災害對策的根本為「自助」，無論面臨何種狀況，「守護自身性命」為永遠不變的法則，如在災害中失去生命或受傷，則無法幫助家人或鄰居，更無法執行防災士的救災業務。日本阪神大地震中，約有8成以上的死者因地震後被壓在倒塌的房屋、家具或電視下而於短時間內死亡，為避免此悲劇重演，平時便應加強住宅的耐震性或固定家具等以未雨綢繆。在2011年3月11日東日本大震災中，即有不少民眾因平時做好家具之固定、儲備物資、海嘯避難訓練等，因而在地震發生時以自身之力將傷害降至最低。災害中，防災士如不幸喪生或受重傷，則無法救助家人、鄰居、或職場同事，亦無法對災後重建或振興有所貢獻，因此，防災士平時便應做好萬全準備、學習防災及減災的相關知識和技能，並持續提升自我能力。『以「幫助他人」為目標，而非成為一個「接受他人幫助的人」。』","s":"內政部消防署"},{"i":3182118,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列敘述何者不屬於「互助」的精神範疇內？","z":"付出其實就是最大的收穫，因為能施與的人，比受施的人更幸福。","o":[["A","指志工（個人、團體）、企業、自治體、政府等以防災及減災為共同目的互相合作"],["B","無論平時或災害中皆應本持「合作」信念，全力動員社會人力及物資資源，以執行防災及減災對策"],["C","「互助」應該由政府提供所有的資源及協助"],["D","企業具備龐大的資訊網路及物資輸送系統，企業可利用這些網路及輸送系統在救災行動上有所貢獻"]],"a":"C","e":"「自助」雖為將災害傷害降至最低的基本原則，但因個人的能力有限，故應藉助各界的力量，方能提升區域的災害應變能力，如固定家具以避免倒塌等防災對策雖相對簡易，但對年長者而言卻不然，此時，應藉助「互助」方可實現。災害發生後，當災情越是慘重，則越難指望政府能即刻給予援助；應仰賴地方上守望相助，以自身之力進行救助及搶救行動。此時，防災士應隨機發揮領導力，成為救災的核心人物。阪神大地震中，即有8成以上的受困者是由鄰近居民救出，互助的重要性顯露無遺。災後的救災作業與重建事業雖應仰賴的政府及志工的協助，但兩者皆不如災區附近的民眾支援來得及時。此外，在災後復原重建的階段，除了區域居民間的合作協力外，志工（個人、團體）的存在亦不可或缺。無論在何處發生災難，立即展開救援行動為極為重要的關鍵，而為提升區域或職場的防災力，防災士於平時應與地區或外部單位（學校、企業）上的人們相互協力，致力於防災及減災的啟蒙活動，此外當災害發生時，地區和外部單位更應攜手投入救災支援行動。","s":"內政部消防署"},{"i":3182119,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列有關「公助」之敘述何者正確？","z":"勇氣不可失、信心不可無，世間沒有不能與無能的事，只怕不肯。","o":[["A","當災難發生時，軍、警、消的救災活動、設置避難收容所、配送救災物資、興建臨時住宅等，皆為政府具體之作為"],["B","硬體及軟體的對策，兩者皆為中央政府的任務，如：加強建築物及學校耐震性工程、規劃避難路線、災害資訊發布等"],["C","災害預測及觀察的部分，由內政部氣象局、國家災害防救科技中心及相關大專院校等，進行調查、研究及觀測，有助於預測災情"],["D","防災士應理解相關對策或行動，無論在防災訓練或市民對於防災知識啟蒙活動等場合皆作為核心人物，必要時扮演「行政與市民間的橋梁」即可"]],"a":"A","e":"守護國民與居民的性命、財產安全是中央與地方政府的最大任務，當發生災難時，軍、警、消的救災活動、避難收容所的設置、救災物資的配送、臨時住宅的興建等，皆為具體作為之一。防災士應理解公助相關對策或行動，無論在防災訓練或市民對於防災知識啟蒙活動等場合皆作為核心人物，同時扮演「政府與市民間的橋樑」。B&C. 此為災前的預防與準備。D. 此為協作。","s":"內政部消防署"},{"i":3182122,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"基於臺灣地區的特殊地理位置，臺灣面臨的主要氣象災害下列何者正確？","z":"恆心、毅力能如滴水穿石，再大的困難與阻礙都能突破。","o":[["A","颱風"],["B","梅雨"],["C","寒害"],["D","以上皆是"]],"a":"D","e":"臺灣主要災害的類別：自然災害根據不同的在地性因素有不同的分類方法，在臺灣發生的重要自然災害依據其不同的特性、災害系統及災害防治管理，主要可分為七大類，每一類下又有其各自不同的次要災害：臺灣常見七類天然災害，包含氣象災害、海象災害、地質災害、洪水災害、地震災害、森林災害以及農業災害。","s":"內政部消防署"},{"i":3182123,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"颱風常造成的損害有哪些？","z":"雙手健全卻不肯做事的人，等於是沒有手的人。","o":[["A","夾帶大量豪雨造成淹水"],["B","河川水位暴漲"],["C","雨水沖刷溪谷造成土石流"],["D","以上皆是"]],"a":"D","e":"颱風常造成的損害為：（一）強風：風壓可直接吹毀房屋建築物、電訊及電力線路，使稻麥脫粒、果實脫落等。（二）焚風：乾燥且高溫使農作物枯萎。（三）鹽風：海風含有多量鹽分，吹至陸上可使農作物枯死，有時可導致電路漏電等災害。（四）巨浪：狂風會產生巨浪，颱風所產生的巨浪可高達10至20公尺，在海上易造成船隻顛覆、沉沒，波浪也會逐漸侵蝕海岸，而生災變。（五）暴潮：強風使海面傾斜，同時由於氣壓降低，使得海面升高，導致沿海發生海水倒灌。（六）豪雨：摧毀農作物，淹沒農田並使低窪地區淹水。（七）洪水：山區豪雨，常引起河水高漲、河堤破裂而發生水災，沖毀房屋、建築物，並毀損農田。（八）山崩：豪雨沖刷山石，使山石崩裂坍塌，形成土石流，沖毀房屋、傷及人畜、阻礙交通，山區公路常發生此種災害。（九）傳染病：颱風水災後常易發生各種傳染病，如痢疾、霍亂。","s":"內政部消防署"},{"i":3182124,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"地震常造成之災害下列何者錯誤？","z":"人生若能被人需要，能擁有一分功能為人付出，就是最幸福的人生。","o":[["A","房屋損毀、人命傷亡"],["B","河川水位暴漲"],["C","橋梁與道路損毀，交通中斷"],["D","造成電力與自來水中斷"]],"a":"B","e":"B. 此為颱風。","s":"內政部消防署"},{"i":3182125,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列何者不屬於防災四階段？","z":"每天無所事事，是人生的消費者；積極付出，才是人生的創造者。什麼都沒做，就是空過的人生；若能不斷付出利益人群，就是大好的人生。","o":[["A","減災"],["B","整備"],["C","聯繫溝通"],["D","應變"]],"a":"C","e":"防災四階段為減災、整備、應變及復原。","s":"內政部消防署"},{"i":3182127,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"災前整備階段內容包含哪些項目？","z":"信心、毅力、勇氣三者具備，則天下沒有做不成的事。","o":[["A","辦理跨政府、機構之災害兵棋推演或實兵演習"],["B","各種災害避難路線之規劃"],["C","民間救災機具開口契約訂定"],["D","以上皆是"]],"a":"D","e":"依據災防法第 23 條規定：為有效執行緊急應變措施，各級政府應依權責實施下列整備事項：一、災害防救組織之整備。二、災害防救之訓練、演習。三、災害監測、預報、警報發布及其設施之強化。四、災情蒐集、通報與指揮所需通訊設施之建置、維護及強化。五、災害防救物資、器材之儲備及檢查。六、災害防救設施、設備之整備及檢查。七、對於妨礙災害應變措施之設施、物件，施以加固、移除或改善。八、國際救災支援之配合。九、其他緊急應變整備事項。前項所定整備事項，各級政府應依權責列入各該災害防救計畫。公共事業應依其災害防救業務計畫，實施有關災害整備事項。為確保防救災專用微波通信之暢通，內政部得就電波傳輸暢通之必要範圍，劃定電波傳輸障礙防止區域，並公告之。建築物之起造人於前項公告區域內有新建、增建之建築行為，並符合下列規定之一者，直轄市、縣（市）政府始得給予建築許可：一、與內政部協商達成改善方案。二、同意內政部選擇損失最小之方法，使用該建築物屋頂層架設微波電臺或衛星地球電臺，以維持電波暢通。內政部對於前項因協商達成改善方案，或使用該建築物屋頂層架設微波電臺或衛星地球電臺，致造成相對人損失，應給付相當之補償。前項之損失補償，應以協議為之，作成協議書，並得為執行名義。有關損失補償之程序、方法、期限、金額及其他相關事項之辦法，由內政部定之。","s":"內政部消防署"},{"i":3182128,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列何者不屬於災時應變階段的項目？","z":"口說好話，心想好意，身行好事。","o":[["A","災害搶救及人命搜救"],["B","災民收容所規劃與建置"],["C","災民緊急疏散避難"],["D","物資調度管理及分配"]],"a":"B","e":"依據災防法第 27 條規定：為實施災害應變措施，各級政府應依權責實施下列事項：一、災害警報之發布、傳遞、應變戒備、人員疏散、搶救、避難之勸告、災情蒐集及損失查報。二、警戒區域劃設、交通管制、秩序維持及犯罪防治。三、消防、防汛及其他應變措施。四、受災民眾臨時收容、社會救助及弱勢族群特殊保護措施。五、受災兒童及少年、學生之應急照顧。六、危險物品設施及設備之應變處理。七、傳染病防治、廢棄物處理、環境消毒、食品衛生檢驗及其他衛生事項。八、搜救、緊急醫療救護及運送。九、協助相驗、處理罹難者屍體、遺物。十、民生物資與飲用水之供應及分配。十一、水利、農業設施等災害防備及搶修。十二、鐵路、道路、橋樑、大眾運輸、航空站、港埠、公用氣體與油料管線、輸電線路、電信、自來水及農漁業等公共設施之搶修。十三、危險建築物之緊急評估。十四、漂流物、沈沒品及其他救出物品之保管、處理。十五、災害應變過程完整記錄。十六、其他災害應變及防止擴大事項。前項災害應變措施事項，各級政府應依權責列入各該災害防救計畫。公共事業應依其災害防救業務計畫，實施有關災害應變事項。第一項第十三款有關危險建築物緊急評估之適用災害種類、實施時機、處理人員、程序、危險標誌之張貼、解除及其他相關事項之辦法，由內政部定之。","s":"內政部消防署"},{"i":3182129,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"重建措施不包含哪個項目？","z":"難行能行，難捨能捨，難為能為，才能昇華自我的人格。","o":[["A","重建委員會組織之建置"],["B","維生系統重建計畫"],["C","罹難者遺體處理"],["D","災民心理及健康恢復計畫"]],"a":"C","e":"依據災防法「第 六 章 災後復原重建」規定。","s":"內政部消防署"},{"i":3182130,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列各災害之中央主管機關配對者錯誤？","z":"道德是提升自我的明燈，不是呵斥別人的鞭子。","o":[["A","土石流災害-農委會"],["B","水災-經濟部"],["C","火災-內政部"],["D","空難-內政部"]],"a":"D","e":"依據災防法第 3 條規定：各種災害之預防、應變及復原重建，以下列機關為中央災害防救業務主管機關：一、風災、震災（含土壤液化）、火災、爆炸、火山災害：內政部。二、水災、旱災、礦災、工業管線災害、公用氣體與油料管線、輸電線路災害：經濟部。三、寒害、土石流災害、森林火災、動植物疫災：行政院農業委員會。四、空難、海難、陸上交通事故：交通部。五、毒性化學物質災害、懸浮微粒物質災害：行政院環境保護署。六、生物病原災害：衛生福利部。七、輻射災害：行政院原子能委員會。八、其他災害：依法律規定或由中央災害防救會報指定之中央災害防救業務主管機關。前項中央災害防救業務主管機關就其主管災害防救業務之權責如下：一、中央及直轄市、縣（市）政府與公共事業執行災害防救工作等相關事項之指揮、督導及協調。二、災害防救業務計畫訂定與修正之研擬及執行。三、災害防救工作之支援、處理。四、非屬地方行政轄區之災害防救相關業務之執行、協調，及違反本法案件之處理。五、災害區域涉及海域、跨越二以上直轄市、縣（市）行政區，或災情重大且直轄市、縣（市）政府無法因應時之協調及處理。","s":"內政部消防署"},{"i":3182131,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列何者不屬於天然災害？","z":"不要小看自己，因為人有無限的可能。","o":[["A","風災"],["B","陸上交通事故"],["C","震災（含土壤液化）"],["D","水災"]],"a":"B","e":"B.人為災害。","s":"內政部消防署"},{"i":3182132,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列何者不屬於中央災害防救組織？","z":"任何事都是從一個決心、一粒種子開始。","o":[["A","環保署事業廢棄物管制中心"],["B","中央災害防救會報"],["C","中央災害防救委員會"],["D","行政院災害防救辦公室"]],"a":"A","e":"依據災防法「第 二 章 災害防救組織」規定。","s":"內政部消防署"},{"i":3182133,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列何者屬於臺灣常見的天然災害？","z":"大錯誤容易反省，小習氣不易去除。","o":[["A","地震"],["B","風災"],["C","水災"],["D","以上皆是"]],"a":"D","e":"臺灣地區位於太平洋及歐亞大陸之交界，有明顯的季風現象。另外，以世界地震帶分佈而言，臺灣是處於最大，也是最活躍的環太平洋地震帶上，基於臺灣地區的特殊地理位置，臺灣面臨的主要災害有颱風、梅雨（其內之大豪雨）、寒害、乾旱及地震等，其往往造成的災害也相當巨大。","s":"內政部消防署"},{"i":3182134,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"我國災害防救體系最高決策單位是哪個單位？","z":"有心就有福，有願就有力。","o":[["A","緊急應變小組"],["B","行政院國家搜救指揮中心"],["C","中央災害防救會報"],["D","重建推動委員會"]],"a":"C","e":"依據災防法「第 二 章 災害防救組織」規定。","s":"內政部消防署"},{"i":3182135,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"颱風來臨時不可能伴隨下列何者災害？","z":"去貪就簡，可使心靈得到無比的寧靜與解脫。","o":[["A","強風"],["B","焚風"],["C","土壤液化"],["D","巨浪"]],"a":"C","e":"C. 伴隨地震產生。","s":"內政部消防署"},{"i":3182136,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"臺灣每年易發水災的時期為何？","z":"如果影響不了別人，就做自己該做的事吧！","o":[["A","12至2月"],["B","5至11月"],["C","1至2月"],["D","11至12月"]],"a":"B","e":"汛期：依「河川管理辦法」，為每年五月一日至十一月三十日。","s":"內政部消防署"},{"i":3182137,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"關於土石流之敘述何者正確？","z":"一個人的快樂，不是因為他擁有得多，而是因為他計較得少。","o":[["A","土石流包括山崩與地滑兩種類型，係指山坡地、丘陵或台地，當其坡面因岩石或土塊失衡而向下方或側面移動的現象"],["B","土石流是指地質條件不穩定的山坡地經由風化崩解之大大小小岩石塊、泥沙、土壤，或由於山崩、地滑、與落石而於河谷或坡腳堆積大量的碎屑物"],["C","只有颱風來臨時才會造成土石流"],["D","只要發生過一次土石流的地方就不可能再發生土石流"]],"a":"B","e":"B. 碎屑物須位於傾斜的山麓坡上，若加上豪雨所帶來豐沛的雨量，流水宣洩不良，水加上土、石混和，因為重力順坡下滑流動形成威力無比的土石流。","s":"內政部消防署"},{"i":3182138,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"坡地崩塌的定義為何？","z":"不要小看自己，因為人有無限的可能。","o":[["A","坡地崩塌包括山崩與地滑兩種類型，係指山坡地、丘陵或台地，當其坡面因岩石或土塊失衡而向下方或側面移動的現象"],["B","坡地崩塌的類型只有地滑一種"],["C","坡地崩塌是指地質條件不穩定的山坡地經由風化崩解之大大小小岩石塊、泥沙、土壤，或由於山崩、地滑、與落石而於河谷或坡腳堆積大量的碎屑物"],["D","土石流及坡地崩塌是屬於一樣災害，只是名稱不同"]],"a":"A","e":"B. 參考經濟部中央地質調查所的坡地災害分類 ，將社區可能面臨的坡地災害分為落石、 岩體滑動、順向坡、岩屑崩滑以及土石流共五種類型。","s":"內政部消防署"},{"i":3182139,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"對於複合型災害敘述何者正確？","z":"要把握做好事的因緣，一旦因緣消逝，想做就來不及了！","o":[["A","複合型災害是指，一般性災害發生時，衍生其他災害者"],["B","地震伴隨建築物傾倒、走山與滑坡坡地災害等屬於複合型災害"],["C","颱風衍生災害：淹水、坡地災害、交通中斷、斷水斷電屬於複合型災害"],["D","以上皆正確"]],"a":"D","e":"複合型災害為災害發生時，其他災害同時發生者，例如：地震造成水管破裂，而導致淹水情形的發生。2009年8月颱風莫拉克創下了雨量歷史紀錄，山區豪雨導致大規模崩塌，洪水挾帶大量土石與漂流木衝往下游，衝毀橋樑、堤岸，並引發嚴重水災，重創南臺灣，造成677人死亡、22人失蹤及4人重傷，為近年最嚴重的複合型颱洪災害。","s":"內政部消防署"},{"i":3182140,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列何者屬於評估生命跡象的項目？","z":"人要克服難，不要被難克服。","o":[["A","意識"],["B","脈搏"],["C","膚色"],["D","以上皆是"]],"a":"D","e":"血壓、意識、呼吸、血氧、體溫、膚色、瞳孔、脈搏。","s":"內政部消防署"},{"i":3182142,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"關於AED使用敘述，下列何者錯誤？","z":"好事要大家一起做，才有力量互相感動。","o":[["A","AED適用於全年齡"],["B","電極貼片應貼至右胸上緣及左側肋骨下緣"],["C","到「按…按鈕…」指令之同時，應口喊離開並確定無人接觸到傷病患時立即按下「電擊鈕」"],["D","若聽到「不建議電擊」指令時，依指示繼續施行CPR"]],"a":"A","e":"建議對於嬰兒心律不整的去顫，應優先使用手動去顫器，配有小兒劑量衰減器的AED亦適用於小於8歲孩童，若無法取得小兒劑量衰減器的AED時，一般AED也是可以使用在小於8歲的孩童。","s":"內政部消防署"},{"i":3182143,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"一位在校門口車禍患者，左大腿開放性骨折，且傷口一直在流血，請問其正確的處理步驟為？","z":"人多力大，福就大。","o":[["A","固定→止血→包紮"],["B","包紮→固定→止血"],["C","止血→包紮→固定"],["D","固定→包紮→止血"]],"a":"C","e":"止血→包紮→固定→搬運","s":"內政部消防署"},{"i":3182144,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"成人心肺復甦術中不管施救者為一人或兩人，胸部按壓及人工呼吸的比率為？","z":"感恩他人就是美化自己。","o":[["A","2：30"],["B","30：2"],["C","3：30"],["D","2：20"]],"a":"B","e":"依據救護技術員訓練教材。","s":"內政部消防署"},{"i":3182145,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"在成人心肺復甦術中，給予口對口人工呼吸，每一口氣的時間為？","z":"付出，才能有愛與感恩的互動。","o":[["A","1秒"],["B","2秒"],["C","4秒"],["D","10秒"]],"a":"A","e":"依據救護技術員訓練教材。","s":"內政部消防署"},{"i":3182146,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"災害弱勢者可能具備哪些特徵？","z":"有形的物質給別人，無形的福氣給自己。","o":[["A","移動困難"],["B","資訊之接收及傳遞困難"],["C","需要仰賴藥物或醫療裝置"],["D","以上皆是"]],"a":"D","e":"依據防災士學員手冊規定：一、移動困難二、資訊之接收/傳遞困難三、需要仰賴藥物或醫療裝置","s":"內政部消防署"},{"i":3182147,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"使用AED口訣何者正確？","z":"造福人群，就是為自己造福。","o":[["A","「開、貼、插、電」"],["B","「開、插、貼、電」"],["C","「開、貼、電、插」"],["D","「開、貼、插、貼」"]],"a":"A","e":"CPR+AED急救口訣：叫、叫、壓(C，compress)、電(D，defibrillation)。1. 叫：叫病人。確認有無反應。2. 叫：求救。向119報案，並聽從執勤人員指示，同時找幫手並設法取得AED。3. 壓(C)：壓胸。掌根置放於兩乳頭連線中央，用力壓、快快壓(1秒2下)、胸回彈、莫中斷。4. 電(D)：使用AED，打開電源，貼上貼片，聽從AED指示操作後立刻回復CPR。AED使用口訣：開貼插電1. 開：打開AED電源。2. 貼：在胸前的皮膚上貼上兩塊電擊片。3. 插：插上導線插座。4. 電：若下方扇形有閃電標誌的按鈕閃爍，代表需要電擊，按下按鈕完成電擊，立刻接續CPR。電擊後因心臟要恢復有力的跳動還要一段時間，所以電擊完成就務必要立即壓胸CPR，兩分鐘後AED會自動再次分析心律，並告知是否需要再電擊一次。CPR是救命最重要的關鍵，假使患者始終沒有出現自發性的活動，就必須持續操作至醫護人員趕到現場為止。注意事項：1. 保持乾燥：由於AED的原理為電傳導的道理，患者如果身體是溼的，必須先將身體快速擦乾後再使用。2. 移除貼布：如果患者身上有貼痠痛貼布等，記得撕下來，以免干擾到電擊效果。3. 旁人不可觸碰：因AED通常會與CPR一同執行，要電擊時，操作AED者切記要觀前顧後一下，確認CPR者已經暫停手邊的動作，不要觸碰患者的身體，避免導電意外。","s":"內政部消防署"},{"i":3182148,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"關於青少年與成人之心肺復甦術（CPR）敘述何者錯誤？","z":"肯付出就是造福，不執著就是智慧。","o":[["A","操作心肺復甦術（CPR）時，一定要施予口對口人工呼吸"],["B","以目視方式將一手掌根置於胸骨下半部，手指朝向對側，另一手之掌根置於前一手之上面使雙手重疊或互扣，手臂須打直，雙肩向前傾至手部之正上方，利用上半身之重量向下按壓， 且施力集中於掌根處"],["C","胸部按壓與袋瓣罩甦醒球人工呼吸之比例為30：2，壓胸與吹氣不間斷"],["D","CPR五循環或2分鐘後吹2次氣之同時應檢查頸動脈搏（評估時間<10秒），若有則檢查呼吸，若無則繼續CPR；此時不論有無脈搏均應開始做轉送醫院之準備"]],"a":"A","e":"在民眾CPR簡易版中，倘若施救者不願意跟患者口對口做人工吹氣的步驟，那麼此吹氣步驟可以省略，就一直胸外按壓即可。","s":"內政部消防署"},{"i":3182149,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"關於傷口止血操作敘述何者錯誤？","z":"福不是用求的，是要自己去「造」的。","o":[["A","傷口持續出血時，應直接以無菌紗布放置於出血處，施以直接加壓止血"],["B","若持續加壓止血方法仍無法有效止血時，應繼續加壓止血，不用考慮就醫"],["C","加壓止血若仍繼續出血，絕不要移除原有紗布及敷料，應在其上方加上更多紗布直接加壓"],["D","若傷口無持續出血時，可以用無菌紗布放置於傷口處，以膠帶固定紗布，必要時以網套、彈性繃帶或三角巾等敷料加強固定"]],"a":"B","e":"B. 若持續加壓止血方法仍無法有效止血時，應繼續加壓止血，應考慮直接就醫。","s":"內政部消防署"},{"i":3182150,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"CPR按壓時每分鐘速率應為多少？","z":"平安就是福，助人就是慧。","o":[["A","100至120次，新生兒則約為120次"],["B","80至90次，新生兒則約為120次"],["C","70至90次，新生兒則約為120次"],["D","100至120次，新生兒與成人無差別"]],"a":"A","e":"基本心肺復甦術（成人與青少年）：下壓深度 5 至 6 公分，每次按壓後掌根不可離開胸部，但必須放鬆讓胸部回復原狀，壓與放的時間各佔百分之 50 （％），按壓速率為每分鐘 100 至 120 次。為維持心肺復甦術（CPR） 品質，可使用即時視聽回饋裝置偵測速率。基本心肺復甦術（1 歲至青春期）：下壓深度約 5 公分或至少胸部前後徑的三分之一（1/3） ，每次按壓後掌根不可離開胸部，但必須放鬆讓胸部回復原狀，壓與放的時間各佔百分之 50 （％），按壓速率為每分鐘 100至 120 次。為維持心肺復甦術（CPR） 品質，可使用即時視聽回饋裝置偵測速率。基本心肺復甦術（嬰兒，滿月後至1歲）：下壓深度約 4 公分或至少胸部前後徑的三分之一（1/3） ，每次按壓後手指不可離開胸部，但必須放鬆讓胸部回復原狀，壓與放的時間各佔百分之 50 （％），按壓速率為每分鐘 100至 120 次；為維持心肺復甦術（CPR） 品質，可使用即時視聽回饋裝置偵測速率。基本心肺復甦術（新生兒，未滿月）：下壓深度約 4 公分或至少胸部前後徑的三分之一（1/3） ，每次按壓後手指不可離開胸部，但必須放鬆讓胸部回復原狀，壓與放的時間各佔百分之 50 （％），按壓速率為每分鐘 120 次；為維持心肺復甦術（CPR） 品質，可使用即時視聽回饋裝置偵測速率。","s":"內政部消防署"},{"i":3182151,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"使用止血帶止血時的注意事項，何者為非？","z":"多做好事，才能開闢心靈的天地。","o":[["A","只有當危及生命的大出血且無法用其他止血法止血時才考慮使用止血帶"],["B","紮好止血帶後，每隔十五至二十分鐘需放鬆十五秒"],["C","傷者身上應明顯標記止血帶使用時間"],["D","為加強止血帶效果，可於止血帶上再加以包紮"]],"a":"D","e":"止血帶止血法：1. 選擇適當寬度之止血帶。2. 使用止血帶於患肢出血部位之近心端，並將厚敷料墊於其上，以達到止血效果，但須避開關節。3. 將止血帶繞肢體兩圈後先打半結。4. 再將一硬木棒、或硬筆桿、或湯匙、或任何類似物置於平結上再打二個結。5. 慢慢旋轉此木棒以絞緊止血帶，直到出血停止。","s":"內政部消防署"},{"i":3182152,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"關於傷病患搬運敘述何者錯誤？","z":"只要有心，一定可以撥出時間；只要有願，不怕沒有力量。","o":[["A","單人攙扶法適用於清醒、傷勢病情輕微與在簡單協助下即可行走之傷病患"],["B","肢端搬運法適用於所有傷病患"],["C","揹負法適用於老幼、體輕、需快速移動的傷病患，但疑似有頸椎傷害或骨折傷病患不建議使用"],["D","傷病患因無法行走或有其它生命徵象不穩定現象，應評估現場狀況給予合適的搬運法，但在搬運傷病患前，必須先知道如何保護自身的安全"]],"a":"B","e":"B. 適用於沒有頸椎傷害傷病患。","s":"內政部消防署"},{"i":3182153,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"引導視障者避難時下列何者錯誤？","z":"做好事，不在於做多少，只要應該做的，就要去做。","o":[["A","輕輕地觸碰其未持拐杖之手抑或將手腕借其攙扶"],["B","緩慢地走在其前方半步位置"],["C","大略形容引導的方向"],["D","指引方向時應具體說明方位"]],"a":"C","e":"C. 視障者的避難場地應位於入口處、洗手間等較近較好，因為看不到周圍的狀況，所以要將情報用口頭轉述，以消除他們的不安，在較狹窄的避難處很難單獨行走，也要引導他們行走。而指引方向時，應用「右斜前方10公尺」等方式具體地說明、抑或用時鐘比喻，如「10點鐘方向」等簡明易懂地說明，避免用「這裡」、「那裡」等說詞以免造成混淆。","s":"內政部消防署"},{"i":3182154,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"執行心肺復甦術的口對口人工呼吸時，如何確定氣體正確吹入患者肺部？","z":"人真正的財富在行善。","o":[["A","患者胸部有起伏"],["B","病人無嘔吐情形"],["C","沒有漏氣的聲音"],["D","以上皆是"]],"a":"D","e":"A. 確認給氣順利且進入肺部。B. 確保呼吸道暢通。C. 確實給氣。","s":"內政部消防署"},{"i":3182155,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"當施行成人心肺復甦術時，胸部按壓的位置何者為是？","z":"做好事，是人生的目的，也是義務。","o":[["A","頸下的胸骨處"],["B","胸部中間微偏左"],["C","胸部兩乳頭連線中點的胸骨處"],["D","胸部的左下方"]],"a":"C","e":"C. 胸部兩乳頭連線中央。","s":"內政部消防署"},{"i":3182156,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"當施行成人心肺復甦術時，胸部按壓的深度何者為是？","z":"分秒不空過，步步踏實過。","o":[["A","至少5公分"],["B","3至4公分"],["C","1至2公分"],["D","2至3公分"]],"a":"A","e":"A. 5至6公分","s":"內政部消防署"},{"i":3182157,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"災害弱勢者家屬、協助人員平時應事先確認之事項？","z":"一個人的快樂，不是因為他擁有得多，而是因為他計較得少。","o":[["A","隨身攜帶手冊、緊急連絡卡"],["B","緊急攜出物品之準備"],["C","避難場所、避難路徑、聯絡方式之確認"],["D","以上皆是"]],"a":"D","e":"一、隨身攜帶手冊、緊急連絡卡：一但發生大規模災害，交通通訊往往相當混亂且可能中斷，家庭成員的團聚，常常會有所困難，因此平時應做好緊急連絡卡，以備不時之需。二、緊急攜出物品之準備：經常性服用之藥品、常去的醫療機構聯絡方式、記有常用藥物品項之「藥物手冊」或筆記。輪椅、助聽器、老花眼鏡等當事人所必需的配備、物品。三、避難場所、避難路徑、聯絡方式之確認：平時應與家人討論災害時之避難場所、避難路徑、聯絡方式等事宜，並具體決定約定場所與共通的聯絡人（其他縣市的親戚等）。四、準備看護犬等寵物所應之配備物品","s":"內政部消防署"},{"i":3182158,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"以下哪個網站無法查詢到災害防救相關資源？","z":"最平常的人最富有。","o":[["A","經濟部中央地質調查所"],["B","中華民國勞動部全球資訊網"],["C","經濟部水利署防災資訊網"],["D","內政部消防署全球資訊網"]],"a":"B","e":"依據《防災士學員手冊》貳、網站資源介紹。","s":"內政部消防署"},{"i":3182159,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"防災地圖的災害種類有哪些？","z":"能以他人的快樂為自己的快樂，是最滿足、最富有的人生。","o":[["A","水災防災地圖"],["B","土石流防災地圖"],["C","地震防災地圖"],["D","以上皆是"]],"a":"D","e":"依據「防災地圖作業手冊」規定，防災地圖依照災害種類，考量其危害特性，共區分為五類，分別為水災防災地圖、土石流防災地圖、地震防災地圖（疏散避難地圖）、毒化災與其他災害，以及綜合型防災地圖（各類型災害綜合呈現）。","s":"內政部消防署"},{"i":3182160,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"防災地圖使用說明何者錯誤？","z":"知足，生活才會富樂安穩。","o":[["A","平時應了解疏散路線及避難收容據點之資訊，便於災害預警發布或發生時，得儘快至安全場所避難"],["B","只有防救災業務人員需要知道如何使用"],["C","防災地圖主要為村里或社區層級之疏散避難圖。此類地圖不需包含過於複雜的資訊，重點於正確地呈現避難處所位置分布及安全逃生路線，或是第一時間發現災情得以通報相關單位"],["D","應了解災害可能發生的區域及可能造成的損失後，應著手調查安全之避難收容據點，規劃疏散路線、物資裝備輸送路線及救援道路等資訊，繪製成圖資備用"]],"a":"B","e":"使用對象可分為一般民眾與防救災業務人員。使用時機則依災害管理階段不同，使用圖資也有所不同。一、民眾（防災士）民眾於平時應了解疏散路線及避難收容據點之資訊，便於災害預警發布或發生時，得儘快至安全場所避難，其主要為村里或社區層級之疏散避難圖。此類地圖不需包含過於複雜的資訊，重點於正確地呈現避難處所位置分布及安全逃生路線，或是第一時間發現災情得以通報相關單位。二、防救災業務人員因應減災、整備與應變各階段以及不同防救災工作，需掌握不同圖層資訊。減災、整備階段應確實掌握各類災害潛勢的區域，並劃定災害可能影響的範圍，評估災害造成的損失程度，進行研擬短、中、長程的減災策略及具體的改善措施。另外，了解災害可能發生的區域及可能造成的損失後，應著手調查安全之避難收容據點，規劃疏散路線、物資裝備輸送路線及救援道路等資訊，繪製成圖資備用。應變階段，為能迅速地引導民眾疏散、順利調度物資裝備及救援車輛，指揮官或決策者應掌握轄內各項救災道路資訊及災害防救資源的分布，以輔助下達應變救援指令。","s":"內政部消防署"},{"i":3182162,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"民眾想查詢災害潛勢地圖可至哪個網站查詢？","z":"沒有患得之心，就沒有患失之苦。","o":[["A","環保署"],["B","國家災害防救科技中心"],["C","勞動部"],["D","內政部"]],"a":"B","e":"國家災害防救科技中心災害潛勢地圖網網址：https://dmap.ncdr.nat.gov.tw/提供全臺山崩、土石流、斷層土壤液化、海嘯溢淹、核災潛勢，以及淹水潛勢圖。圖籍下載（縣市及鄉鎮層級-天然災害潛勢地圖）、警戒值查詢、GIS查詢、數值檔案下載、其他資訊。","s":"內政部消防署"},{"i":3182163,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"2017年後，國家災害防救科技中心的災害潛勢地圖網，能查詢到那些災害潛勢地圖？","z":"小事不做，大事難成。","o":[["A","淹水潛勢圖"],["B","斷層土壤液化"],["C","核災潛勢"],["D","以上皆是"]],"a":"D","e":"提供全臺山崩、土石流、斷層土壤液化、海嘯溢淹、核災潛勢，以及淹水潛勢圖。圖籍下載（縣市及鄉鎮層級-天然災害潛勢地圖）、警戒值查詢、GIS查詢、數值檔案下載、其他資訊。","s":"內政部消防署"},{"i":3182164,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"我國能利用的防災資源網站有哪些？","z":"多做多得，少做多失。","o":[["A","經濟部中央地質調查所"],["B","土石流防災資訊網"],["C","內政部消防署全球資訊網"],["D","以上皆是"]],"a":"D","e":"依據《防災士學員手冊》貳、網站資源介紹。","s":"內政部消防署"},{"i":3182165,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"防災圖資類別，以下何者錯誤？","z":"有多少力量就做多少事，不要心存等待，等待會落空。","o":[["A","災害潛勢地圖"],["B","Google Map"],["C","疏散避難路線圖"],["D","校園防災地圖"]],"a":"B","e":"防災地圖是將災害防救資訊以點、線、面的方式繪製成圖，以便於傳達與利用。依照目的與內容差異，有多種不同的主題，例如：災害潛勢圖、疏散避難圖、資源儲存圖、人力資源分配等。本手冊主要係以下列兩項為主：一、災害潛勢圖：標明災害潛勢之可能地區，或標示出災害可能的影響範圍，主要係提供防救災人員使用。二、疏散避難圖：提供一般民眾及防救災人員瞭解避難收容處所位置及防救災情資，或連同標示避難方向，主要以鄉（鎮、市、區）或村（里，含部落）等 2種地圖為原則。必要時應將歷史災害區域或潛勢分析進行套疊，透過災害風險共有，以強化民眾自主防災之效能。","s":"內政部消防署"},{"i":3182166,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列何者正確？","z":"有心就有福，有願就有力。","o":[["A","災害資訊，即有助於民眾免於受災與二次災害之有用資訊"],["B","「無災情資訊」即是天下太平"],["C","過去之災害經驗及教訓對於平時宣導民眾毫無幫助"],["D","災民需求資訊不會隨災害演變而發生改變"]],"a":"A","e":"所謂災害資訊，即有助於民眾免於受災與二次災害之有用資訊。舉例而言，災害發生時，該至何處避難、如何取得水或食物、行政端將給予何種支援與如何獲得協助、水電、瓦斯、大眾交通等維生管線之復原重建狀況完成時間、親友行蹤或安危訊息等資訊。而不僅災害發生後之資訊，災害發生前之注意報或警報、抑或地方政府所發布之避難勸告等亦屬災害資訊。此外，過去之災害教訓或口述傳聞等知識或經驗所衍生出的防災智慧與防範要領等，亦為有助於平時宣導民眾之重要資訊。【重要】一般而言，當災情越為慘重時則災情資訊之發布越為不易；媒體所發布者，多半為災害初期較輕微的災情報導，如此則亦讓民眾誤判「災情不嚴重」。因此，切勿忘記「無災情資訊」有時則意味著災情慘重因而無法將訊息發布出去。","s":"內政部消防署"},{"i":3182167,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"關於淹水警戒的敘述何者錯誤？","z":"人要先點亮自己的心燈，才能引發別人的心燈。","o":[["A","淹水警戒即採用經驗方法，根據歷史淹水與雨量資料，訂出各鄉鎮的1、3、6、12及24小時降雨警戒值"],["B","二級警戒：發布淹水警戒之鄉（鎮、市、區）如持續降雨，其轄內易淹水村里及道路可能已經開始積淹水"],["C","二級警戒：發布淹水警戒之鄉（鎮、市、區）如持續降雨，其轄內易淹水村里及道路可能在三小時內開始積淹水"],["D","一級警戒：發布淹水警戒之鄉（鎮、市、區）如持續降雨，其轄內易淹水村里及道路可能已經開始積淹水"]],"a":"B","e":"淹水警戒即採用經驗方法，根據歷史淹水與雨量資料，訂出各鄉鎮的1、3、6、12及24小時降雨警戒值，只要觀測降雨達到該鄉鎮其中一項警戒值就會發布一級警戒，而當雨量達到略低於警戒值10至60毫米則發布二級警戒。發布時機如以下分類。（一）二級警戒：發布淹水警戒之鄉（鎮、市、區）如持續降雨，其轄內易淹水村里及道路可能在三小時內開始積淹水。（二）一級警戒：發布淹水警戒之鄉（鎮、市、區）如持續降雨，其轄內易淹水村里及道路可能已經開始積淹水。","s":"內政部消防署"},{"i":3182168,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"請問您能在以下哪些官方網站獲得防災資訊？","z":"吃苦了苦，苦盡甘來；享福了福，福盡悲來。","o":[["A","中央氣象局"],["B","水利署水利防災中心"],["C","農委會"],["D","以上皆是"]],"a":"D","e":"依據《防災士學員手冊》貳、網站資源介紹。","s":"內政部消防署"},{"i":3182169,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"豪雨或颱風期間如何取得警戒發布資訊？","z":"一個人不怕錯，就怕不改過，改過並不難。","o":[["A","土石流防災資訊網"],["B","電視新聞報導"],["C","語音廣播及手機簡訊通知緊急聯絡人"],["D","以上皆是"]],"a":"D","e":"政府會經由各種媒體管道通知民眾警戒：1、固定式警報站2、防救災訊息服務發送平臺3、巡迴廣播車4、民政廣播系統5、防空警報系統及警察廣播電臺6、媒體播報（電視、網路）7、災防告警系統－細胞廣播服務（CBS）","s":"內政部消防署"},{"i":3182170,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"電話語音可以透過以下哪個管道取得氣象資訊服務？","z":"人都是求「有」， 有就是煩惱。","o":[["A","166專線"],["B","社會局網站"],["C","內政部消防署"],["D","國家災害防救科技中心網站"]],"a":"A","e":"【重要】1、切勿聽信謠言和傳播謠言，有疑慮時，應直撥166或167氣象資訊語音專線、收聽廣播、收看電視或瀏覽中央氣象局網頁（www.cwb.gov.tw）或應用氣象局開發之Facebook、報天氣粉絲團及生活氣象APP，以取得有關颱風之最新消息。2、假如看不到報紙、沒有收音機或電視機，也沒有網路的情形下，無法知道颱風的消息，可以根據前面所說的幾種颱風將要來臨的預兆（第75問），事先加以防範，千萬不可聽信謠言；亦可至當地派出所或鄉公所去詢問，他們會告知正確的颱風消息。3、教學單位應主動發布消息，避免謠言散播，動搖人心：4、建立並恪遵學校發言人制度，主動發布新聞及詳細傷害情況。5、避免自行使用通信線路或頻道，因其必須管制做為救災最優先使用。6、如果無法一一通知家長，應善用傳播媒體，隨時更新學生受傷害資料，使家長放心。","s":"內政部消防署"},{"i":3182171,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"災害謠言的類型可能會有哪些內容？","z":"若要明日平安，就要將今日做好。","o":[["A","災害之前兆、預言"],["B","災害原因"],["C","災後混亂"],["D","以上皆是"]],"a":"D","e":"依據東京大學研究所橋元良明教授說法，以及各方學術資料統計，災害時的謠言主要可分為以下五種類型：（一）災害之前兆、預言此種類型包含，地震雲、動植物異常反應、考古預言，以及個人感應等等，大多為不可預期之災害發生前產生。（二）災害原因過往此類型謠言總會將災害發生與「報應」、「地方傳說」，以及「迷信」相互連接；近年來則多為毫無根據災害原因為主，如堤壩潰決、隕石落下等。（三）災後混亂關東大地震之際，坊間流傳「朝鮮人與社會主義者之暴動、放火、掠奪」等謠言，造成當時社會動盪不安，成為歷史禍根。（四）相關災情當媒體誤報時，災區以外的民眾則會誤信報導內容，進而產生謠言。如1985年墨西哥地震之際，當時因外電誤發「墨西哥城毀滅」，導致錯誤訊息傳遍全世界。（五）災害再度發生地震時必然會產生的為「再度發生」及海嘯時的「二次災害」相關流言。1978年伊豆大島近海地震之際，氣象廳將「預測資訊」誤報成「餘震資訊」，導致居民陷入混亂狀況，而媒體亦以「餘震資訊恐慌」為題材大幅報導此事件。過往謠言通常透過口耳相傳，近年來則轉變以網路傳遞為主（李欣穎等，2003）。係因近年來科技日新月異，傳遞性質逐漸從人與人間，轉變為人與群眾；方式從口耳相傳轉變報章雜誌，進而演變為大眾媒體、網際網路（LINE、社群網站、網路新聞）等，謠言傳遞的速度也變為極為快速。【案例】2018/06/18大阪地震，社群網路出現謠言0618大阪地震在社群網站上，出現大量的假消息，甚至被人分享，恐誤導民衆。例如某社群網站上，出現2000則以上的訊息，表示京阪電車鐵路公司的車脫軌，引起民衆恐慌。但事實上，此消息是起源於一位當時正在京阪電車上的乘客傳出的「我還以爲會脫軌」的文章，但疑似遭網友有意無意曲解。資料來源：臺灣英文新聞，吳東文2018","s":"內政部消防署"},{"i":3182172,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"我國能夠利用來懲罰災害謠言散播者的法規有哪些？","z":"人生若能被人需要，能夠有一分功能為人付出，這才是最幸福的人生。","o":[["A","社會秩序維護法第63條規定"],["B","刑法第310條規定"],["C","以上皆是"]],"a":"C","e":"當前臺灣社會秩序維護法及刑法皆有針對謠言實施相關法條，以下分別敘述：一、社會秩序維護法第63條規定：散布謠言，足以影響公共之安寧者，處三日以下拘留或新臺幣三萬元以下罰鍰。二、刑法第310條規定：意圖散布於眾，而指摘或傳述足以毀損他人名譽之事者，為誹謗罪，處一年以下有期徒刑、拘役或五百元以下罰金。散布文字、圖畫犯前項之罪者，處二年以下有期徒刑、拘役或一千元以下罰金。對於所誹謗之事，能證明其為真實者，不罰。但涉於私德而與公共利益無關者，不在此限。【重要】1、切勿聽信謠言和傳播謠言，有疑慮時，應直撥166或167氣象資訊語音專線、收聽廣播、收看電視或瀏覽中央氣象局網頁（www.cwb.gov.tw）或應用氣象局開發之Facebook、報天氣粉絲團及生活氣象APP，以取得有關颱風之最新消息。2、假如看不到報紙、沒有收音機或電視機，也沒有網路的情形下，無法知道颱風的消息，可以根據前面所說的幾種颱風將要來臨的預兆（第75問），事先加以防範，千萬不可聽信謠言；亦可至當地派出所或鄉公所去詢問，他們會告知正確的颱風消息。3、教學單位應主動發布消息，避免謠言散播，動搖人心：4、建立並恪遵學校發言人制度，主動發布新聞及詳細傷害情況。5、避免自行使用通信線路或頻道，因其必須管制做為救災最優先使用。6、如果無法一一通知家長，應善用傳播媒體，隨時更新學生受傷害資料，使家長放心。","s":"內政部消防署"},{"i":3182173,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列何者不是正確的破除災害謠言對策？","z":"如果影響不了別人，就做自己該做的事吧！","o":[["A","不須理會謠言，謠言不可能會帶來傷害"],["B","公家機關應提供具體且明確的資訊"],["C","提供「安心資訊（SGS）」"],["D","確保可信賴資訊傳遞"]],"a":"A","e":"當前臺灣社會秩序維護法及刑法皆有針對謠言實施相關法條，以下分別敘述：一、社會秩序維護法第63條規定：散布謠言，足以影響公共之安寧者，處三日以下拘留或新臺幣三萬元以下罰鍰。二、刑法第310條規定：意圖散布於眾，而指摘或傳述足以毀損他人名譽之事者，為誹謗罪，處一年以下有期徒刑、拘役或五百元以下罰金。散布文字、圖畫犯前項之罪者，處二年以下有期徒刑、拘役或一千元以下罰金。對於所誹謗之事，能證明其為真實者，不罰。但涉於私德而與公共利益無關者，不在此限。【重要】1、切勿聽信謠言和傳播謠言，有疑慮時，應直撥166或167氣象資訊語音專線、收聽廣播、收看電視或瀏覽中央氣象局網頁（www.cwb.gov.tw）或應用氣象局開發之Facebook、報天氣粉絲團及生活氣象APP，以取得有關颱風之最新消息。2、假如看不到報紙、沒有收音機或電視機，也沒有網路的情形下，無法知道颱風的消息，可以根據前面所說的幾種颱風將要來臨的預兆（第75問），事先加以防範，千萬不可聽信謠言；亦可至當地派出所或鄉公所去詢問，他們會告知正確的颱風消息。3、教學單位應主動發布消息，避免謠言散播，動搖人心：4、建立並恪遵學校發言人制度，主動發布新聞及詳細傷害情況。5、避免自行使用通信線路或頻道，因其必須管制做為救災最優先使用。6、如果無法一一通知家長，應善用傳播媒體，隨時更新學生受傷害資料，使家長放心。","s":"內政部消防署"},{"i":3182174,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"水災通報方式何者敘述正確？","z":"用心看、用心聽、用心做，終生都受用。","o":[["A","網路通報：可至「民眾及防汛志工水情通報平台」（http：//579.wra.gov.tw/dn）即時通報災情"],["B","電話通報：可撥打各地河川局防汛專線，通報災情現況"],["C","以上皆是"]],"a":"C","e":"（一）網路通報：可至「民眾及防汛志工水情通報平台」（http：//579.wra.gov.tw/dn）即時通報災情。（二）電話通報：可撥打各地河川局防汛專線，通報災情現況。","s":"內政部消防署"},{"i":3182175,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"地震發生前的預防受傷措施下列何者錯誤？","z":"改善自己是自救，影響別人就是救人。","o":[["A","注意家具的配置"],["B","防止玻璃碎裂"],["C","避難路線上放置雜物"],["D","停電時可立即取用之緊急照明"]],"a":"C","e":"C. 不應放置。","s":"內政部消防署"},{"i":3182176,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"家庭防災卡所包含的內容以下何者錯誤？","z":"充滿愛心的人最幸福。","o":[["A","緊急集合點"],["B","緊急聯絡人"],["C","167報平安留言平臺"],["D","災民避難收容場所"]],"a":"C","e":"大規模災害發生時，交通、通訊往往相當混亂且可能中斷，家庭成員的團聚，變得急迫卻又困難，學校若於開學之初，將「家庭防災卡」以連絡單的方式，由學生攜回家，與家長共同填寫，每個家庭有自己個別的內容，平常攜帶於書包、鉛筆盒、身上等，若能貼（印）在家庭聯絡簿的底頁更佳，以便於災時家人團聚及聯絡；觀之過去重大災害發生時，家人互相找尋不但困難，甚至增加了政府救災的負擔，便可了解「家庭防災卡」的重要性。（一）緊急集合點當災害發生時，家人緊急集合的地點。小規模災害（如公寓火災、小震災）時，家人會在住家外的適當地點（如家旁的小綠地）集合，但大規模災害時，可能連住家附近都不太安全或不易靠近，家人就必須在稍遠一點的社區外（如學校、公園）集合。（二）緊急聯絡人當家人集合有困難（甚至遭遇災害時），家人知道可以向誰（親密的親戚好友）聯絡求助，但應事先安排好。小災害時，同一城鎮（本地）的親友足以協助家人（聯絡、醫療照護、收容安置等），但大災害時，可能需要外地的親友過來幫忙。（三）災民避難收容場所可洽詢住家所在地鄉鎮市公所人員或網站、「衛生福利部社會及家庭暑」網站、各縣市政府、社會局（處）或消防局網站中取得，若所在地公所已經就災害類別區分不同避難處所，則應分災害類別填寫不同資料。（四）1991報平安留言平臺當重大災害發生時，常因災區電話系統損壞或民眾關心家人互報平安之話務，進而造成電話線路不通或壅塞、緊急報案電話亦無法撥通，民眾便可利用此專線在災時互報平安。可透過電話（含市內電話、行動電話及公用電話）直撥「1991」，依語音操作指示，輸入「約定電話」後，進行錄音留言報平安；其親友可透過電話撥「1991」，輸入「約定電話」後，即可聽取錄音留言。","s":"內政部消防署"},{"i":3182177,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"地震發生後下列何者錯誤？","z":"能付出愛心就是福，能消除煩惱就是慧。","o":[["A","須（應）以保護「自身安全」為第一優先"],["B","選擇未固定的書櫃旁黃金三角躲藏"],["C","確認家人、同事、鄰居的安危"],["D","確保出口暢通"]],"a":"B","e":"躲大型家具旁「黃金三角」絕對不安全，因為大型家具翻覆、傾倒都是生命威脅，也要遠離可整倒下的家具、吊掛物、燈具、大片玻璃窗。","s":"內政部消防署"},{"i":3182178,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"建築物安全性該注意的項目，下列何者錯誤？","z":"愛不是要求對方，而是要自由身付出，無條件地奉獻，做到事事圓滿。","o":[["A","建物形狀以簡單、規則、對稱為佳"],["B","可以隨意打通室內牆壁"],["C","建築物的間距"],["D","建築物的結構"]],"a":"B","e":"根據內政部的統計資料顯示，在1999年921地震時，死亡者中有大部分是被倒塌的建築物所壓死。因此，房屋耐震評估及必要之補強有其必要性，在平時可請結構技師進行建築物的耐震評估及檢查，例如建物之樑柱是否有裂縫、樓板滲水、牆壁裂縫、圍牆及擋土牆補強等問題。（一）形狀以簡單、規則、對稱為佳形狀如正方形、矩形或圓柱形等越簡單、對稱、規則，而且寬度均勻變化的建築物，在地震時受力比較均勻，搖晃的程度較輕微，所以這一類房屋的耐震強度比較高。（二）建築物的間距興建建築物時最好能與鄰棟建築物保持一定的距離，不然地震時可能會因為搖晃，造成彼此碰撞並產生破壞。（三）建築物的結構屋頂增建會加重頂樓地板的負荷，尤其是使用混凝土或磚塊，其增加的重量更是可觀，地震時可能危害建築物的結構安全。（四）牆面配置牆面具有抵抗水平地震力的能力，良好的牆面配置要盡量對稱、均勻分布，在建築物的雙向也都要有適當配置的牆面；在立面上，牆體配置應盡量上下連續，上下牆體的中心應最好能一致且不宜任意打通牆壁。任意打通牆壁會使樓層強度降低、牆量分佈不均，地震時可能會造成能量集中及偏心扭轉，容易導致建築物崩塌。（五）房屋裝修1、牆、柱、樑、板是房舍的骨骼，所以最好不要任意拆除或變更原來的設計，以免建築物的結構系統產生變化。2、老舊的房屋應該請專業人員來進行結構安全的鑑定，並設法進行補強。3、若房舍要進行增建、裝修，或者當牆、柱、樑或板有嚴重龜裂時，應該要請經驗豐富的建築師或結構工程技師來設計或評估。","s":"內政部消防署"},{"i":3182179,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"關於建物安全性的敘述何者錯誤？","z":"不要小看自己，因為人有無限的可能。","o":[["A","屋頂增建會加重頂樓地板的負荷，尤其是使用混凝土或磚塊，其增加的重量更是可觀，地震時可能危害建築物的結構安全"],["B","興建建築物時最好能與鄰棟建築物保持一定的距離，不然地震時可能會因為搖晃，造成彼此碰撞並產生破壞"],["C","狀如正方形、矩形或圓柱形等越簡單、對稱、規則，而且寬度均勻變化的建築物，在地震時受力比較均勻，搖晃的程度較輕微，所以這一類房屋的耐震強度比較高"],["D","任意拆除或變更原來的牆、柱、樑、板之設計，對於建築物的結構不會產生負面影響"]],"a":"D","e":"根據內政部的統計資料顯示，在1999年921地震時，死亡者中有大部分是被倒塌的建築物所壓死。因此，房屋耐震評估及必要之補強有其必要性，在平時可請結構技師進行建築物的耐震評估及檢查，例如建物之樑柱是否有裂縫、樓板滲水、牆壁裂縫、圍牆及擋土牆補強等問題。（一）形狀以簡單、規則、對稱為佳形狀如正方形、矩形或圓柱形等越簡單、對稱、規則，而且寬度均勻變化的建築物，在地震時受力比較均勻，搖晃的程度較輕微，所以這一類房屋的耐震強度比較高。（二）建築物的間距興建建築物時最好能與鄰棟建築物保持一定的距離，不然地震時可能會因為搖晃，造成彼此碰撞並產生破壞。（三）建築物的結構屋頂增建會加重頂樓地板的負荷，尤其是使用混凝土或磚塊，其增加的重量更是可觀，地震時可能危害建築物的結構安全。（四）牆面配置牆面具有抵抗水平地震力的能力，良好的牆面配置要盡量對稱、均勻分布，在建築物的雙向也都要有適當配置的牆面；在立面上，牆體配置應盡量上下連續，上下牆體的中心應最好能一致且不宜任意打通牆壁。任意打通牆壁會使樓層強度降低、牆量分佈不均，地震時可能會造成能量集中及偏心扭轉，容易導致建築物崩塌。（五）房屋裝修1、牆、柱、樑、板是房舍的骨骼，所以最好不要任意拆除或變更原來的設計，以免建築物的結構系統產生變化。2、老舊的房屋應該請專業人員來進行結構安全的鑑定，並設法進行補強。3、若房舍要進行增建、裝修，或者當牆、柱、樑或板有嚴重龜裂時，應該要請經驗豐富的建築師或結構工程技師來設計或評估。","s":"內政部消防署"},{"i":3182180,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"地震發生後所要採取的行動，下列何者錯誤？","z":"任何事都是從一個決心、一粒種子開始。","o":[["A","地震來了，保護自身安全為首要原則"],["B","躲大型家具旁「黃金三角」是絕對安全"],["C","如地震發生時在床上，需快速利用枕頭或棉被保護頭部，直到地震結束"],["D","如果附近有桌子，盡可能躲在桌下，穩住桌腳，保護自己"]],"a":"B","e":"B. 躲大型家具旁「黃金三角」絕對不安全，因為大型家具翻覆、傾倒都是生命威脅，也要遠離可整倒下的家具、吊掛物、燈具、大片玻璃窗。","s":"內政部消防署"},{"i":3182181,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"土石流基本防災工作，下列何者錯誤？","z":"生活若簡樸，人生就幸福。","o":[["A","瞭解土石流發生的條件與徵兆"],["B","注意各項防災資訊：土石流警戒區發布的獲知管道"],["C","“家”是重要的財產，所以可以不配合撤離死守家園"],["D","熟悉土石流疏散避難方式"]],"a":"C","e":"1. 瞭解土石流發生的條件與徵兆2. 注意各項防災資訊3. 熟悉土石流疏散避難方式","s":"內政部消防署"},{"i":3182182,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"海嘯基本防災工作有那些？","z":"有心要付出，就有無限的能力。","o":[["A","注意海嘯警報與訊息"],["B","遠離海邊、停止活動"],["C","盡量往內陸或高處疏散避難"],["D","以上皆是"]],"a":"D","e":"（一）注意海嘯警報與訊息：地震後隨時注意海嘯警報及收聽相關訊息。（二）遠離海邊、停止活動：盡速離開海嘯可能影響之區域，停止各種海上活動及出海捕魚。（三）盡量往內陸或高處疏散避難：進行海嘯疏散避難時，應優先考慮附近堅固高樓，若無，應往內陸高處方向避難。（四）短距離避難避免使用車輛：使用車輛容易造成交通阻塞，若車輛被海嘯捲入，人員更不易脫困。（五）切勿立即返家，注意相關訊息：海嘯第一波退去後，後續可能有第二波海嘯。","s":"內政部消防署"},{"i":3182183,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"核子事故需採取的行動，下列何者錯誤？","z":"自造福田，自得福緣。","o":[["A","進入室內，關緊門窗，空調設備調整為室內模式"],["B","在車內，應關緊車窗及空調設備，儘速離開事故影響區域"],["C","只要食用碘片就可以不用害怕核子事故"],["D","收看電視或收聽廣播以瞭解進一步的事故情況"]],"a":"C","e":"C. 核子事故發生時，如有大量放射性碘經由呼吸道進入體內，將會傷害甲狀腺，而碘片可阻止游離碘集入甲狀腺，只要有足夠的量就可以阻止放射性碘進入甲狀腺。但碘片不是萬靈丹，對於核子事故發生時所釋放之其他放射性物質並無保護作用，且需在政府下達命令後才能服用。為防範核能電廠緊急意外事故發生時可能因放射性碘洩漏造成甲狀腺危害，由於少部分人對碘片會產生副作用，因此碘片之服用必須等政府通知。此外，由於輻射游離碘對於40歲以上成人甲狀腺之傷害或引發甲狀腺癌之機率極低，因此，建議40歲以上成人除非必要，否則不建議服用碘片，依據政府指示服用碘片，成人每日一錠、孕婦及3-12歲兒童每日1/2錠、未滿3歲兒童每日1/4錠。","s":"內政部消防署"},{"i":3182184,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"準備緊急備糧時，不應該準備何種種類的食物？","z":"「貪」不但帶來痛苦，也使人墮落。","o":[["A","不易腐壞"],["B","需以電力或爐火烹煮"],["C","可長久保存"],["D","高熱量食品"]],"a":"B","e":"緊急備糧的選擇以不易腐壞、可長久保存，建議每人至少準備3天的份量，糧食種類及份量的考量主要在於提供生存所必要之熱量，而不在於吃飽。","s":"內政部消防署"},{"i":3182185,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"地震保命口訣「DCH」的原則是什麼？","z":"能放下身段，才有偉大的人格。","o":[["A","立刻雙手雙膝著地伏下，用雙臂保護頭頸部"],["B","躲在相對強固的柱旁、低矮的家具下或牆壁角落"],["C","搖晃期間不要跑到戶外，不要衝向出入口"],["D","以上皆是"]],"a":"D","e":"地震發生當下，最重要就是保護頸部、頭部，立即採「趴下、掩護、穩住」，躲在桌下或是牆角，躲在桌下立刻撐住桌腳，當桌子隨地移動時，人也可隨著桌子移動形成防護屏障。地震來襲時，謹記DCH（Drop臥倒、趴下，Cover掩蔽、掩護，Hold on握緊、穩住）。（一）原則一：立刻雙手雙膝著地伏下，用雙臂保護頭頸部立刻雙手雙膝著地伏下，避免地震將人震倒，用雙臂保護頭頸部，避免掉落物砸傷；並非在地震時所有建築物都會倒塌，要防範的是家具傾倒、吊掛物掉落、滑動物品掉落、甚至於天花板塌下對頭部、頸部造成的傷害。（二）原則二：躲在相對強固的柱旁、低矮的家具或牆壁角落因無堅固的桌子可以躲，如果可以，設法以其他物品保護頭頸部，並趴著或蹲在相對堅固的柱旁、低矮的家具或附近沒有大型家具的牆角。躲大型家具旁「黃金三角」絕對不安全，因為大型家具翻覆、傾倒都是生命威脅，也要遠離可整倒下的家具、吊掛物、燈具、大片玻璃窗。（三）原則三：搖晃期間不要跑到戶外，不要衝向出入口留在原地直到停止搖晃為止，不要跑到戶外，不要衝向出入口，因為這樣非常容易受到掉落物和飛散物品的傷害，而且此時你根本無法站穩，因為當地震規模大、搖晃強時，會連站都站不穩、走都走不動，最該防範的是自己是否受傷、門有沒有扭曲、出不出得去，前提是要先保住性命，或保護自己不受傷。","s":"內政部消防署"},{"i":3182186,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列何種管道，無法取得土石流警戒區發布相關訊息？","z":"要將苦難當助力，不要當阻力。","o":[["A","166專線"],["B","行政院農業委員會水土保持局土石流防災資訊網"],["C","電視新聞"],["D","當地土石流防災專員通知"]],"a":"A","e":"1、電視新聞。2、行政院農業委員會水土保持局土石流防災資訊網（http://246.swcb.gov.tw）。3、語音廣播及手機簡訊通知。4、當地土石流防災專員通知。5、撥打土石流災情通報專線（0800-246-246）詢問。","s":"內政部消防署"},{"i":3182187,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"輻射防護三原則「距離、時間、屏蔽」所指，下列何者錯誤？","z":"事不做，才困難；路不走，才遙遠。","o":[["A","「時間」- 核子事故無法在短時間復原"],["B","「時間」- 曝露於輻射線的時間越短越好"],["C","「距離」- 離輻射源越遠越好"],["D","「屏蔽」- 掩蔽於混凝土的建築物當中"]],"a":"A","e":"為避免輻射對於人體的影響，需依照事故狀況採行防護行動，基本上，若考量體外曝露，則可以透過簡單的輻射防護三原則「距離、時間、屏蔽」來達到良好的防護效果。1、利用「距離」來進行防護（離輻射源越遠越好）2、利用「時間」來進行防護（曝露於輻射線的時間越短越好）3、利用「屏蔽」來進行防護（掩蔽於混凝土的建築物當中）","s":"內政部消防署"},{"i":3182188,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"政府能由什麼管道第一時間通報民眾核災警戒，下列何者錯誤？","z":"多做一件善事，就放下一項煩惱。","o":[["A","固定式警報站"],["B","書面郵件"],["C","防空警報系統及警察廣播電臺"],["D","民政廣播系統"]],"a":"B","e":"（一）政府會經由各種媒體管道通知民眾警戒：1、固定式警報站2、防救災訊息服務發送平臺3、巡迴廣播車4、民政廣播系統5、防空警報系統及警察廣播電臺6、媒體播報（電視、網路）7、災防告警系統－細胞廣播服務（CBS）（二）採取掩蔽措施：事故警報發布後，保護自己最好的方法就是減少與輻射接觸的機會；已經在家裡者，應關緊門窗，空調設備調整為室內循環模式，收看電視或收聽廣播以了解進一步的事故情況，若在室外，應進入附近有門窗的鋼筋水泥建築物躲避或迅速回家，緊閉門窗，並脫除衣物、淋浴以去除輻射塵；如果是在車內，而附近又沒有適當的掩蔽場所，則應關緊車窗及空調設備，盡速離開事故影響區域；原則上，曝露在外得食物及飲用水不要食用，放置於室內的飲用水或食物則可安心使用，如圖101所示。（三）服用碘片核子事故發生時，如有大量放射性碘經由呼吸道進入體內，將會傷害甲狀腺，而碘片可阻止游離碘集入甲狀腺，只要有足夠的量就可以阻止放射性碘進入甲狀腺。但碘片不是萬靈丹，對於核子事故發生時所釋放之其他放射性物質並無保護作用，且需在政府下達命令後才能服用。為防範核能電廠緊急意外事故發生時可能因放射性碘洩漏造成甲狀腺危害，由於少部分人對碘片會產生副作用，因此碘片之服用必須等政府通知。此外，由於輻射游離碘對於40歲以上成人甲狀腺之傷害或引發甲狀腺癌之機率極低，因此，建議40歲以上成人除非必要，否則不建議服用碘片，依據政府指示服用碘片，成人每日一錠、孕婦及3-12歲兒童每日1/2錠、未滿3歲兒童每日1/4錠。（四）疏散與收容安置：當核子事故發生，原能會將立即與相關部會共同成立中央災害應變中心，地方政府也會成立地方災害應變中心，進行緊急應變作業與民眾防護措施（掩蔽、疏散、服用碘片等），提供即時環境輻射與食品飲水採樣檢測資訊，並定期發布最新訊息，供民眾了解。1、預防性疏散：核子事故發生初期，尚未有放射性物質外釋時，為確保後續應變作業順遂執行，將優先針對緊鄰核能電廠區域之民眾進行預防性疏散措施，同時，針對緊急應變計畫區內弱勢民眾、特定族群（醫院、學校、老人安養與養護中心等）優先調派適宜載具，於準備妥適後疏散至指定收容場所，若有行動不便者，可於家中明顯處放置「我需要協助」指示牌，以利救災人員第一時間提供協助；至於遊客部份則將於事故發生初始，即通知先行離開，事故時之疏散將以當地民眾為主。2、國中小學生疏散：因應核子事故發生是有時序及階段性，將依風險概念進行由內至外及下風向進行階段性疏散作業，未接獲政府下令疏散之區域則以掩蔽措施為主，以避免因匆促及混亂之疏散造成不必要生命財產損失，如後續事故演進有惡化及擴大之趨勢，再依此概念擴大疏散範圍。3、下風向、階段性之疏散：因應核子事故發生是有時序及階段性，將依風險概念進行由內至外及下風向進行階段性疏散作業，未接獲政府下令疏散之區域則以掩蔽措施為主，以避免因匆促及混亂之疏散造成不必要生命財產損失，如後續事故演進有惡化及擴大之趨勢，再依此概念擴大疏散範圍。4、接獲疏散通知怎麼辦：事故若持續惡化，中央災害應變中心經評估後會下令執行疏散行動並透過電視、收音機持續發放疏散通知，接獲疏散通知時，民眾準備簡單行李（例如個人證件、手機、簡單乾糧、飲用說及換洗衣物、帽子、手套、口罩、收音機、手電筒及備用電池、急救包、個人藥物等），關掉瓦斯、電器開關及門窗，遵循應變人員指示，前往緊急應變計畫區（Emergency Planning Zone, EPZ）內平時即規劃設置完成集結地點，搭乘備妥之疏散車輛，萬一放射性物質外釋，應先前往防護站進行偵檢除污，防護站設置目的係為有效掌握EPZ內疏散民眾的人數與動向，保障民眾的健康與安全。","s":"內政部消防署"},{"i":3182189,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"關於核子事故之應變何者錯誤？","z":"雙手健全卻不肯做事的人，等於是沒有手的人。","o":[["A","不管曝露在外得或放置於室內的食物及飲用水，皆可安心使用"],["B","在家裡者，應關緊門窗，空調設備調整為室內循環模式"],["C","在室外，應進入附近有門窗的鋼筋水泥建築物躲避或迅速回家，緊閉門窗，並脫除衣物、淋浴以去除輻射塵"],["D","在車內，而附近又沒有適當的掩蔽場所，則應關緊車窗及空調設備，盡速離開事故影響區域"]] "D","準備完後不需要定時檢查"]],"a":"A","e":"因災害種類複雜，要將所有的防災用品備齊是有其難度的，且防災用品亦會依對象主體與目的而有所不同，舉例來說，為了「自助」而備置於家中的防災用品，與自主防災組織為實現「互助」所準備的防災用品便不盡相同，而防災用品應盡量為「平時即用得到的物品」、抑或是「平時盡可能使用的物品」。","s":"內政部消防署"},{"i":3182192,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列敘述，何者非推動社區防災之必要性策略？","z":"人要知福、惜福、再造福。","o":[["A","提升互助、自助的概念"],["B","結合因地制宜的調適"],["C","提升互助、公助的概念"],["D","強化社區防災的能量"]],"a":"C","e":"「社區」是公共生活的基本單位，具有特定的文化和傳統，防災士在此所扮演的，便是與行政攜手創造防災社區之角色。社區參與的結果反映了地方的認知，參與的過程與行動決定了社區發展的實質內涵，其中也包含災害的影響。從地緣關係來看，社區居民對於在地的人、事、物等脈絡較為了解，社區居民若能直接與專業者合作，由專業者提供居民不同面向的防救災知識，共同尋找合適、可行且有效的操作方法，讓居民可在災時第一時間即直接投入緊急應變，或在災後共同參與復原重建，人命傷亡才能更有效降低。因此，社區是最基本且最有效的單元，做為社區共同意識載體的社區空間，必須重新尋找做為決策主體的主動性特質，防止災害、減少風險，以創造宜居且更具永續性的未來（王价巨等人，2018）。推動社區防災之必要性策略分別為：一、提升互助、自助的概念：近年來全球伴隨氣候變遷，災害之大規模化、高頻率化與複合化，既有防救體制無法全面顧及。二、結合因地制宜的調適：社區為面對災害之最前線單位，當我們無法完全避免災害發生的時候，找出減輕災害、或是與災害共存的辦法為社區永續發展的關鍵。","s":"內政部消防署"},{"i":3182193,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"社區防災應具備以下哪些特性？","z":"知足的人，心量開闊；心量開闊，對人對事就不會計較。","o":[["A","減災層面"],["B","整備與應變層面"],["C","復原重建層面"],["D","以上皆是"]],"a":"D","e":"社區內的每一個人都希望居住在一個安全、舒適的環境中，社區防災的目標就是要建立一個「具備減災與防災意識的產業與生計永續的社區」。當社區本身具備強而有力的社區意識，而且能夠自動自發地進行，從平時、災時到災後的各項防救災工作等，就能被定義為「社區防災」。簡單來說，社區防災應具備以下特性：一、減災層面：具備預防文化（culture of prevention），有能力降低災害發生的機會與衝擊，並根據社區本身環境等特性，選擇有效的減災策略。二、整備與應變層面：能夠承受災害衝擊，並能立即應變，降低災害損失。三、重建層面：可以在災後迅速復原重建，並持續的發展，達成「重建的更好（build back better）」。","s":"內政部消防署"},{"i":3182194,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"土石流警戒區資訊發布的即時獲知管道下列何者錯誤？","z":"人生若能減低欲望，生活上便沒有什麼值得計較！","o":[["A","電視新聞"],["B","行政院農業委員會水土保持局土石流防災資訊網（http：//246.swcb.gov.tw）"],["C","報紙"],["D","當地土石流防災專員通知"]],"a":"C","e":"1. 電視新聞。2. 行政院農業委員會水土保持局土石流防災資訊網（http：//246.swcb.gov.tw）。3. 語音廣播及手機簡訊通知。4. 當地土石流防災專員通知。5. 撥打土石流災情通報專線（0800-246-246）詢問。","s":"內政部消防署"},{"i":3182195,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"海嘯基本防災工作下列何者錯誤？","z":"世間的物質本來是為人所用，但不知足者因欠缺智慧，竟淪為「被物所用」。","o":[["A","注意海嘯警報與訊息"],["B","切勿立即返家，注意相關訊息"],["C","盡量往內陸或高處疏散避難"],["D","開車速度較快，就算短距離避難還是第一優先選擇開車"]],"a":"D","e":"海嘯基本防災工作（一）注意海嘯警報與訊息：地震後隨時注意海嘯警報及收聽相關訊息。（二）遠離海邊、停止活動：盡速離開海嘯可能影響之區域，停止各種海上活動及出海捕魚。（三）盡量往內陸或高處疏散避難：進行海嘯疏散避難時，應優先考慮附近堅固高樓，若無，應往內陸高處方向避難。（四）短距離避難避免使用車輛：使用車輛容易造成交通阻塞，若車輛被海嘯捲入，人員更不易脫困。（五）切勿立即返家，注意相關訊息：海嘯第一波退去後，後續可能有第二波海嘯。","s":"內政部消防署"},{"i":3182196,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"防災地圖呈現資訊主要包含哪些？","z":"今天只有一次，應好好把握做該做的事。","o":[["A","疏散避難路線"],["B","避難收容所"],["C","重要防救災據點"],["D","以上皆是"]],"a":"D","e":"使用對象可分為一般民眾與防救災業務人員。使用時機則依災害管理階段不同，使用圖資也有所不同。一、民眾（防災士）民眾於平時應了解疏散路線及避難收容據點之資訊，便於災害預警發布或發生時，得儘快至安全場所避難，其主要為村里或社區層級之疏散避難圖。此類地圖不需包含過於複雜的資訊，重點於正確地呈現避難處所位置分布及安全逃生路線，或是第一時間發現災情得以通報相關單位。二、防救災業務人員因應減災、整備與應變各階段以及不同防救災工作，需掌握不同圖層資訊。減災、整備階段應確實掌握各類災害潛勢的區域，並劃定災害可能影響的範圍，評估災害造成的損失程度，進行研擬短、中、長程的減災策略及具體的改善措施。另外，了解災害可能發生的區域及可能造成的損失後，應著手調查安全之避難收容據點，規劃疏散路線、物資裝備輸送路線及救援道路等資訊，繪製成圖資備用。應變階段，為能迅速地引導民眾疏散、順利調度物資裝備及救援車輛，指揮官或決策者應掌握轄內各項救災道路資訊及災害防救資源的分布，以輔助下達應變救援指令。","s":"內政部消防署"},{"i":3182197,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"避難地點之類型有哪些？","z":"為天下而承擔，所行益於人間，就能盡人生社會的責任；安心靜定少欲知足，衣食足夠不求多餘，就能有效減緩全球暖化問題。","o":[["A","就地避難"],["B","異地避難"],["C","垂直避難"],["D","以上皆是"]],"a":"D","e":"一、就地避難當災害發生或可能發生時，地方政府針對居住於土石流潛勢區域或易淹水地區之民眾或保全戶，以村里為單位，就近於轄內預先規劃之避難收容處所進行避難，通常以村里辦公室、附近之學校、寺廟等為主。二、異地避難某些山區、危險聚落、地質脆弱等地區，當降雨量過大、堰塞湖或其他因素可能造成大規模崩塌或坡地災害可能時，若公所或村里就近設置之收容場所亦可能受災時，應確實離開危險區域，撤離至其他鄉鎮或地區進行收容安置。三、垂直避難當遇有發生淹水、海嘯災情之虞時，若已無充裕時間前往安全之避難或收容場所，且道路狀況已呈現困難及不安全時，淹水潛勢地區之民眾應盡速移動至居家或鄰居之2樓以上場域進行避難。","s":"內政部消防署"},{"i":3182198,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"疏散撤離之方式可分為哪些項目？","z":"人體需要休息，山體也需要養息——減少開發、做好水土保持。","o":[["A","緊急避難"],["B","自願性撤離"],["C","強制性撤離"],["D","以上皆是"]],"a":"D","e":"一、緊急避難民眾於災害發生或有可能發生之虞，立即以較安全的工具、方法、模式自發且暫時性的離開危險場域之行為，而避難地點之選擇，依災害類型而不同，以地震為例，以公園及空曠處為主，成功的避難行動，取決於事前對災害的認知與準備。二、自願性撤離民眾基於對災害的認知、過去的經驗、危險的徵兆、他人的勸導或政府機關之通知，採取依親或前往政府開設的避難收容處所，進行自發性的疏散撤離行為，例如土石流潛勢溪流保全對象、易淹水地區保全戶對象、坡地災害保全戶對象等，可以自身經驗及認真來選擇提早撤離避難。三、強制性撤離地方政府防救單位，按中央發布之氣象觀測（降雨量）及災害預警標準作業流程（土石流紅色警戒），或自行判斷危險情形，依「災害防救法」第31條相關規定，動用公權力，將危險區域內不願意撤離的民眾強制疏散至安全之避難收容場處所。四、預防性疏散撤離政府部門基於過去災害歷史經驗，針對高災害潛勢地區或危險聚落之保全戶，以較高的標準、較大的規模、更積極的態度、更有效的方法，預先將民眾撤離至較安全的區域之作為。預防性疏散撤離原則（內政部委託研究案，2010。）包括災前疏散，降低救災負荷；針對莫拉克後之特定區域或安全堪虞地區；疏散對象為災害弱勢住戶及保全戶；各層級政府分工負責，提供必要資訊與交通，協助疏散撤離；鼓勵居民自主性疏散撤離；村里為操作居民疏散撤離的基本單位。","s":"內政部消防署"},{"i":3182199,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"災情蒐集的來源敘述何者錯誤","z":"過度消費，是傷害大自然的生機。","o":[["A","所有災情蒐集只能由政府單位負責"],["B","村里長通報"],["C","媒體報導"],["D","災情查報人員現場回報"]],"a":"A","e":"一、民眾傳遞災害發生時，民眾主動告知鄉（鎮、市、區）公所應變中心，鄉（鎮、市、區）公所接獲通報後，派員確認災情，了解災害狀況後，通報至縣（市）政府、農委會水土保持局及其他單位應變中心。二、村里長通報（一）村里長將民眾告知之災情通報至地區災害應變中心、農委會水土保持局及其他相關單位應變中心。（二）村里長以電話方式初步了解相關災情，並通報至地方政府災害應變中心。三、媒體報導（一）媒體得知災害發生，主動告知相關單位，做為災情統計之用。（二）各應變中心人員隨時監看各新聞台及其他各媒體報導之土石流及其他水土保持災情，得知有災情發生，即通知農委會水土保持局及其所屬之工程所，所屬工程所應立即以電話聯繫鄉（鎮、市、區）災害應變中心或村里長確認災情；如報導有誤，農委會水土保持局應適時澄清。四、災情查報人員現場回報災情查報人員於災前回報土石流潛勢溪流附近實際雨量與風雨狀況或至現場勘查，並將勘查結果回報農委會水土保持局。五、主動詢問其他各單位依據「土石流災害預報與警報作業手冊」之所彙整各地區之災害防救業務電話去電詢問各單位所接收到之災害情況，以完成災害蒐集及統計，並將結果回報縣（市）政府及農委會水土保持局。","s":"內政部消防署"},{"i":3182200,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"土石流通報方式，下列何者敘述錯誤？","z":"天地都在變遷中，天氣在變，地質也在變，一切都是因為人心在變；所以要調好自己的心，回歸清淨自然的本性，世間才能平安。","o":[["A","農委會發布土石流警戒相關訊息，應公布於土石流防災資訊網（http://246.swcb.gov.tw），並以電話或傳真方式通知直轄市、縣市政府"],["B","各級政府可逕上土石流防災資訊網（http://246.swcb.gov.tw）查詢土石流警戒相關訊息"],["C","由媒體透過電視、廣播媒體、網路等方式傳遞，且消息一定正確"],["D","直轄市、縣市政府應將相關資訊通知所屬鄉（鎮、市、區）公所"]],"a":"C","e":"土石流通報方式：（一）農委會發布土石流警戒相關訊息，應公布於土石流防災資訊網（http：//246.swcb.gov.tw），並以電話或傳真方式通知直轄市、縣市政府。（二）各級政府可逕上土石流防災資訊網（http：//246.swcb.gov.tw）查詢土石流警戒相關訊息。（三）直轄市、縣市政府應將相關資訊通知所屬鄉（鎮、市、區）公所。（四）由新聞局及地方政府透過電視、廣播媒體、網路等方式迅速傳遞土石流警戒等災害預報訊息。（五）由地方政府迅速運用村里鄰長、警察、消防人力，及巡邏車、廣播車傳遞土石流警戒通報等災害預報訊息，於災害發生前將災害資訊傳達至各單位與民眾、村里鄰社區住戶。（六）原民會應協助將土石流警戒訊息傳遞至原住民鄉（鎮、市）公所。（七）電子媒體訊息傳遞：各級政府應透過電視、廣播媒體、網路等方式，迅速傳遞颱風警報、豪（大）雨特報及紅色（黃色）土石流警戒等訊息，提醒民眾隨時提高警覺，做好防災準備，防範土石流災害發生。（八）警察、消防、民政系統動員：由地方政府迅速動員村里鄰長、警義消人力，及巡邏車、廣播車傳遞颱風警報、豪雨特報及土石流警戒等訊息，於災害發生前將預報資訊傳達至各單位與民眾、村里鄰社區住戶，以利迅速採取防範措施，降低人員傷亡與財物損失。","s":"內政部消防署"},{"i":3182201,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"疏散避難的敘述何者錯誤？","z":"天氣不調則地球氣候亂序，脾氣不調則人倫道德失序；以素食培養慈悲心，人人心地純樸善良，對身體健康、對世界環境都有益處。","o":[["A","當政府發布強制疏散命令時，可以不管安危不配合的留在危險區內"],["B","疏散避難係將處於危害威脅狀況下之個人、家庭或社區，遷移至安全處所並臨時安置"],["C","通常疏散避難之執行，為災前應變之重要工作，以降低人命之傷亡，但亦有災害實際發生後，始執行疏散避難之情形"],["D","疏散避難之過程包含資料收集與分析、疏散避難之決策、疏散避難命令發布時機與內容、疏散避難命令之傳達、民眾對疏散避難之認知、民眾對疏散避難命令之確認、最後則是民眾採取自保措施等七個階段"]],"a":"A","e":"A. 強制性撤離地方政府防救單位，按中央發布之氣象觀測（降雨量）及災害預警標準作業流程（土石流紅色警戒），或自行判斷危險情形，依「災害防救法」第31條相關規定，動用公權力，將危險區域內不願意撤離的民眾強制疏散至安全之避難收容場處所。","s":"內政部消防署"},{"i":3182202,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"社區防災推動面向，下列何者敘述錯誤？","z":"大地養育萬物，四季自然運轉，萬物應時而生長繁衍，眾生與大地共生息，皆在生命共同體之中；大地若健康，依止大地生活的眾生才會平安。","o":[["A","強化民眾危機意識、災害認知與相關知識"],["B","組織動員、提升社區意識與認同"],["C","建立與專業團隊、民間組織或地方政府的互動模式"],["D","鄰近企業組織不需納入其中"]],"a":"D","e":"一、災害防救面（一）強化民眾危機意識、災害認知與相關知識。（二）減少導致災害的因子，降低災害發生機率。（三）災後能迅速復原且重建教義重視地方文化與社區特色。二、社區面（一）組織動員、提升社區意識與認同。（二）配合他項社區事務，推動社區營造。（三）推動事項能合乎社區條件與需求，較容易被民眾接受。三、支援體系面（一）建立與專業團隊、民間組織或地方政府的互動模式。（二）強化緊急應變能力與自救互救技術。（三）落實、執行各項災害防救工作。","s":"內政部消防署"},{"i":3182203,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"社區防災基本的參與對象何者正確？","z":"尊重自然、順應自然，過自然的生活，才能修補地球的毀傷。","o":[["A","專業團隊"],["B","社區組織"],["C","政府機關"],["D","以上皆是"]],"a":"D","e":"1. 專業團隊：提供專業知識與技能。2. 社區組織：參與執行的主體。3. 政府機關：負責監督與行政支援。","s":"內政部消防署"},{"i":3182204,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"社區防災具備哪些特性？","z":"天下一片地，眾生共生息；心寬讓一寸，善念息爭端。","o":[["A","具備預防文化（culture of prevention），有能力降低災害發生的機會與衝擊，並根據社區本身環境等特性，選擇有效的減災策略"],["B","能夠承受災害衝擊，並能立即應變，降低災害損失"],["C","可以在災後迅速復原重建，並持續的發展，達成「重建的更好（build back better）」"],["D","以上皆是"]],"a":"D","e":"社區內的每一個人都希望居住在一個安全、舒適的環境中，社區防災的目標就是要建立一個「具備減災與防災意識的產業與生計永續的社區」。當社區本身具備強而有力的社區意識，而且能夠自動自發地進行，從平時、災時到災後的各項防救災工作等，就能被定義為「社區防災」。簡單來說，社區防災應具備以下特性：一、減災層面：具備預防文化（culture of prevention），有能力降低災害發生的機會與衝擊，並根據社區本身環境等特性，選擇有效的減災策略。二、整備與應變層面：能夠承受災害衝擊，並能立即應變，降低災害損失。三、重建層面：可以在災後迅速復原重建，並持續的發展，達成「重建的更好（build back better）」。","s":"內政部消防署"},{"i":3182205,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"社區防災推動的面向敘述何者錯誤？","z":"大地如母親，負載眾生，長養萬物，我們應以感恩心，疼惜大地。","o":[["A","強化民眾危機意識、災害認知與相關知識"],["B","只需要由少數菁英參與防災工作"],["C","配合他項社區事務，推動社區營造"],["D","建立與專業團隊、民間組織或地方政府的互動模式"]],"a":"B","e":"一、災害防救面（一）強化民眾危機意識、災害認知與相關知識。（二）減少導致災害的因子，降低災害發生機率。（三）災後能迅速復原且重建教義重視地方文化與社區特色。二、社區面（一）組織動員、提升社區意識與認同。（二）配合他項社區事務，推動社區營造。（三）推動事項能合乎社區條件與需求，較容易被民眾接受。三、支援體系面（一）建立與專業團隊、民間組織或地方政府的互動模式。（二）強化緊急應變能力與自救互救技術。（三）落實、執行各項災害防救工作。","s":"內政部消防署"},{"i":3182206,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"自主防災組織推動的流程何者正確？","z":"社會平安，是人民之福；大地平安，是眾生之福。","o":[["A","確認編組→任務調查→彙整任務→建立組織"],["B","建立組織→任務調查→彙整任務→確認編組"],["C","任務調查→彙整任務→建立組織→確認編組"],["D","彙整任務→任務調查→建立組織→確認編組"]],"a":"C","e":"1. 任務調查：記錄社區過去的災害應變行動與環境檢查後所討論的防救災對策。2. 彙整任務：依據內容性質，歸類並形成防救災任務。3. 建立組織：檢視各類別之任務性質，再度歸類形成組別。4. 確認編組：確認各組的成員名單。","s":"內政部消防署"},{"i":3182207,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"關於推動社區既有組織參與防災工作下列敘述何者正確？","z":"普天之下貧富不均，脫離貧窮實非易事，但是人心可以均富；少欲知足，樂於付出，心靈富有就是福。","o":[["A","掌握企業、學校防救災組織與資源分布狀況"],["B","分享防救災相關資訊與資源"],["C","建立社區與企業、學校聯繫管道"],["D","以上皆是"]],"a":"D","e":"社區防災不能只是依賴政府來推動，社區居民與組織幹部的參與才是社區防災能否成功的關鍵因素；除此之外，當地的專家學者、行政部門、社區組織與民間團體，甚至商家與企業都可以共同參與、推動社區防救災的工作。在做法上，社區防災與企業、學校相互支援及合作，可以透過以下方式進行：一、掌握企業、學校防救災組織與資源分布狀況。二、建立社區與企業、學校聯繫管道。三、進行共同防災演練、兵棋推演與教育訓練。四、分享防救災相關資訊與資源。五、與企業、學校共同努力建立防救災作業平台。六、持續與企業、學校合作災後社區復原重建事宜。","s":"內政部消防署"},{"i":3182208,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"社區防災工作內容下列者正確？","z":"生活中落實節能減碳，是對天地盡一分心力。","o":[["A","建立自主防災組織"],["B","資源整備調查及管理"],["C","建立弱勢族群清冊"],["D","以上皆是"]],"a":"D","e":"壹、建立自主防災組織貳、社區內既有組織參與防災工作（企業、學校參與）參、資源整備調查及管理肆、建立弱勢族群清冊伍、避難行動規劃陸、避難收容作業","s":"內政部消防署"},{"i":3182210,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"社區防災組織中，下列哪一個是疏散收容組的任務?","z":"將小愛擴為大愛，愛自己、愛眾人、愛大地；大地安則眾生安，眾生安則自己才能平安。","o":[["A","監控居家環境並通報鄉公所受災情、目前已處置狀況並請求鄉公所派員協助。"],["B","清除障礙物協助逃生。"],["C","協助居民進駐避難所、登記身份、人數。"],["D","急救常識宣導"]],"a":"C","e":"避難收容組任務:1、分配責任區，協助疏散居民至避難所。2、協助居民進駐避難所、登記身份、人數。3、設置服務站，提供協助與諮詢。","s":"內政部消防署"},{"i":3182211,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"下列任務哪一個工作項目屬於搶救組之任務?","z":"信心、毅力、勇氣三者具備，則天下沒有做不成的事。","o":[["A","檢傷分類、基本急救、重傷患就醫護送。"],["B","協助分配發放生活物資、糧食及飲水。"],["C","土石流疏散避難常識宣導。"],["D","清除障礙物協助逃生。"]],"a":"D","e":"搶救組任務：1、受災民眾之搶救及搜救。2、清除障礙物協助逃生。3、協助設置警戒標誌及交通管制。4、強制疏散不願避難之民眾。5、維護災區及避難處所治安。","s":"內政部消防署"},{"i":3182212,"t":"災害防救","c":"災害防救-台灣","k":"tf","q":"防災士的概念結合自「日本防災士機構」所訓練的防災士，以及「日本介助士共育機構」所訓練的防災介助士。","z":"用愛心對待萬物，尊重彼此不同的生態，方能與萬物和平相處，共生共榮。","o":[["O","對"],["X","錯"]],"a":"O","e":"","s":"內政部消防署"},{"i":3182214,"t":"災害防救","c":"災害防救-台灣","k" 費計價方式太貴了，取之於自然的物品無需成本"]],"a":"D","e":"當前的水資源緊張狀況急需各國在政策制定過程中認識、衡量和凸顯水的價值，以實現公平和可持續的水資源管理。而且不能忽略氣候變化與水資源的關係。聯合國的這份報告從5個方面對水的價值評估方式進行了歸納：水源的價值評估以及本地水資源和生態系統；水利基礎設施評估，其中包括水的儲存、使用、再利用或增加供水基礎設施所需的成本；水的服務價值評估，主要表現為飲用水、衛生和人類健康方面的價值；水作為生產和社會經濟活動投入價值的評估，涉及糧食和農業、能源和工業，以及商業和就業等；最後則是水在社會文化和精神方面的價值。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182358,"t":"水資源","c":"水資源-全球","k":"mc","q":"以色列雖然地處沙漠，近年來卻從乾旱國積極轉型為水出口國家，向鄰近國巴勒斯坦、約旦供水，水技術出口更超過22億美元，下列何者不是以色列的獨門密技？","z":"在平和的社會裡要很珍惜，珍惜一切物資，珍惜人與人之間的感情，珍惜自己擁有良能可以利益眾生；有這分珍惜的心，當下就是人間淨土。","o":[["A","使用滴灌系統搭配智慧水網，有效控制每一滴水的利用"],["B","海水淡化廠搭配逆滲透技術，降低持本"],["C","改變水的定價方式，水費全部由政府承擔"],["D","汙廢水循環再用量高達85%，高居全球之冠。"]],"a":"C","e":"從水價與生活細節著手，正視它並非源源不絕，而是會消耗殆盡的一項資源。投資海水淡化廠、高科技監測漏水系統、改善灌溉設施、使用者付費，瞬間節省15%用水、海水、廢水都可以拿來用，現代國家長大的人來說，水，感覺是免費的，就像我們所呼吸的空氣一樣。但事實上，水根本不是免費的，而是得到了很大的補貼，我們用稅收來支付。如此一來，人們便無法體認到它其實是一項可量化的自然資源（如石油）。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182359,"t":"水資源","c":"","k":"mc","q":"下列何者是海水中主要的化學物質？","z":"用愛心對待萬物，尊重彼此不同的生態，方能與萬物和平相處，共生共榮。","o":[["A","氯化鈉"],["B","氫氧化鈉"],["C","碳酸鈣"],["D","磷酸鹽"]],"a":"A","e":"海水所含的鹽分各處不同，平均約為3.5%。這些溶解在海水中的無機鹽，最常見的是氯化鈉，即日用的食鹽。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182360,"t":"水資源","c":"","k":"mc","q":"全球氣候變遷，造成多層面的影響，其中造成海洋環境產生變化的原因為何？","z":"毅力，來自於單純的心；心念純真，自然就有堅持的力量，則天下無難事","o":[["A","海水為動態平衡，所以是自身產生變化"],["B","全球均溫上升使海水溫度隨之提高，影響生態"],["C","因為下雨量減少，海水變少"],["D","因季風吹送，導致海水停止移動"]],"a":"B","e":"氣候變遷使得大氣平均溫度上升，海水的溫度也跟著上升，海岸及潮間帶生態系裡的生物種類可能因此減少，如珊瑚礁白化。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182361,"t":"水資源","c":"水資源-全球","k":"mc","q":"要保護水資源，選出下列選項中可行的方法？","z":"感恩過去的每一時刻，用真誠的愛面對未來的每一個人、每一件事，就是有福之人。","o":[["A","在水源區畜養家畜"],["B","抽取地下水做灌溉"],["C","設立水源保護區禁止開墾"],["D","建設大型遊樂區與高爾夫球場，促進利用"]],"a":"C","e":"水資源保護是為防止水污染和水資源利用不足造成的損害而採取的法律、行政、經濟、技術和教育措施的總和。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182362,"t":"水資源","c":"水資源-全球","k":"mc","q":"都市常位於洪水平原上，下列何者是都市治水的前瞻思維？","z":"感恩過去的每一天，平安度過每一秒；珍惜未來的每一天，謹慎度過每一秒。","o":[["A","引進最新工程技術，防止淹水發生"],["B","工程搭配非工程策略，接受有時發生的淹水，提昇城市韌性"],["C","進行上游河川整治和加高下游堤防，避免洪災發生"],["D","監督行政部門治水，承諾不能淹水"]],"a":"B","e":"「洪水平原」即為洪水經常沖積而形成的平原之意，有洪水乃自然現象。全力防堵並非上策。永續治水需運用工程和非工程的管理手段，管理可能因極端降雨造成的淹水，提昇城市的韌性，而非力求「不淹水」，因為不淹水是不可能的事情。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182363,"t":"水資源","c":"水資源-台灣","k":"tf","q":"2021年台灣經歷嚴峻的缺水危機，經過同島一心的努力，未來將不會再發生類似的用水緊急事件","z":"水是大地萬物的大生命，無水就無生機，所以要感恩有水，珍惜水、適度用水。","o":[["O","對"],["X","錯"]],"a":"X","e":"氣候變遷正在影響臺灣，缺水問題不容小覷，位於亞熱帶季風區的臺灣，由於氣候及地勢，降雨狀況可分為豐水期（5 月至 10 月）、枯水期（亦即乾季，為 11 月至隔年 4 月）。豐水期以梅雨和颱風為主要降水來源，枯水期北部、東部仍會因東北季風而有降雨，但中部、南部因受地形阻擋，降雨機會極少，若豐水期雨量不足，則容易發生旱災。 2020 年，臺灣的梅雨季較短，加上沒有颱風登陸，導致雨量稀缺。水利署表示，6 月迄今主要水庫集水區降雨量，僅約歷年平均值的 2 至 6 成，是造成近半年旱象的主要原因。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182364,"t":"水資源","c":"水資源-台灣","k":"mc","q":"台灣年降雨量是世界平均值的2.6倍，卻仍屬缺水地區，原因何者為非？","z":"少肉食、多護生；做環保、愛地球。","o":[["A","山坡陡峻，以及颱風豪雨雨勢急促，大部分的降雨量皆迅速流入海洋"],["B","水庫蓋得太少，儲水不足"],["C","降雨量在地域、季節分佈極不平均"],["D","台灣自來水的價格過於便宜"]],"a":"B","e":"台灣地區地狹人稠、雨勢集中，山坡陡峭河川短促，所以雨水都流入海洋。自來水水價便宜也是造成浪費原因。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182365,"t":"水資源","c":"水資源-台灣","k":"mc","q":"冷凍食品該如何讓它退冰，才是既「節能」又「省水」？","z":"「齋」是潔淨身心，保護眾生生命；「戒」是防非止惡，保護自己不造惡業。能齋戒就是心靈與大地的環保。","o":[["A","用熱水浸泡，每5分鐘更換一次"],["B","直接用水沖食物強迫退冰"],["C","烹煮前盡早拿出來放置退冰"],["D","使用微波爐解凍快速又方便"]],"a":"C","e":"自然解凍沒有耗費資源，是可兼顧節能及省水的方式。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182366,"t":"氣候變遷","c":"氣候變遷-全球","k":"tf","q":"天氣冷了要多穿外套，天氣熱了要穿涼快一點就是氣候變遷。","z":"生活若簡樸，人生就幸福。","o":[["O","對"],["X","錯"]],"a":"X","e":"天氣變冷是「天氣」的變化，不是「氣候」變遷。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182367,"t":"氣候變遷","c":"氣候變遷-全球","k":"tf","q":"長期記錄各地區的溫度也是研究氣候變遷的方式。","z":"有心要付出，就有無限的能力。","o":[["O","對"],["X","錯"]],"a":"O","e":"https://www.theguardian.com/environment/2012/apr/02/temperature-record-climate-change-warming","s":"國立臺灣師範大學環境教育研究所"},{"i":3182368,"t":"氣候變遷","c":"氣候變遷-全球","k":"tf","q":"氣候變遷對於生物多樣性產生很大的影響。","z":"自造福田，自得福緣。","o":[["O","對"],["X","錯"]],"a":"O","e":"https://e-info.org.tw/node/100344","s":"國立臺灣師範大學環境教育研究所"},{"i":3182369,"t":"氣候變遷","c":"氣候變遷-全球","k":"tf","q":"因為海洋很大所以才會影響氣候變化，其他棲地環境的影響都很小。","z":"「貪」不但帶來痛苦，也使人墮落。","o":[["O","對"],["X","錯"]],"a":"X","e":"https://e-info.org.tw/node/219595","s":"國立臺灣師範大學環境教育研究所"},{"i":3182370,"t":"氣候變遷","c":"氣候變遷-全球","k":"tf","q":"氣候變化會導致糧食生產的季節變化，影響到世界糧食供應鏈。","z":"能放下身段，才有偉大的人格。","o":[["O","對"],["X","錯"]],"a":"O","e":"氣溫上升比全球平均水準高近1.5倍，加上越來越不穩定的降雨模式造成糧食不安全。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182371,"t":"氣候變遷","c":"氣候變遷-全球","k":"tf","q":"在SDGs全球發展目標中，氣候變遷議題與兩性平等沒有關係。","z":"要將苦難當助力，不要當阻力。","o":[["O","對"],["X","錯"]],"a":"X","e":"https://e-info.org.tw/node/41634","s":"國立臺灣師範大學環境教育研究所"},{"i":3182372,"t":"氣候變遷","c":"氣候變遷-全球","k":"tf","q":"全球暖化會導致母海龜增加公海龜變少。","z":"事不做，才困難；路不走，才遙遠。","o":[["O","對"],["X","錯"]],"a":"O","e":"海龜的性別與龜卵孵化期的溫度有關，這種機制又稱作「溫度決定性別」 （temperature-dependent sex determination）。如果龜卵孵化期的溫度較高，孵化出雌性的比例會比較高，反之孵化溫度低。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182373,"t":"氣候變遷","c":"氣候變遷-全球","k":"tf","q":"氣候變遷導致貧富變化越來越嚴重。","z":"多做一件善事，就放下一項煩惱。","o":[["O","對"],["X","錯"]],"a":"O","e":"氣候變遷導致食物或農產品生產不順，產生經濟失調，也會影響到許多依靠天氣營生的行業。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182374,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"太陽的輻射能量驅動地球的各種氣候現象，試問太陽的能量以何種形式來到地球？","z":"雙手健全卻不肯做事的人，等於是沒有手的人。","o":[["A","紫外線與可見光"],["B","紅外線與雷射光"],["C","無線電波與微波"],["D","X射線與伽瑪射線"]],"a":"A","e":"太陽光以短波輻射（紫外線、可見光）的方式傳送能量給地球，這些能量到達地球後，約三分之一會反射回外太空，扣除少部分被大氣吸收的能量，地表吸收了大約三分之二的能量。為了平衡這些吸收的能量，地表會再以長波輻射的形式（紅外線）將能量再次射出；而由地表輻射出的能量又進一步為溫室氣體吸收，溫室氣體再次將能量輻射回地球，就是所謂的溫室效應。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182375,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"下列關於溫室效應的敘述何者正確？","z":"什麼都沒做，就是空過的人生；若能不斷付出利益人群，就是大好的人生。","o":[["A","八大行星中只有地球有溫室效應"],["B","臭氧層破洞是造成溫室效應的主因"],["C","溫室效應是造成氣候變遷的關鍵"],["D","沒有溫室氣體的地球幾乎無法生存"]],"a":"D","e":"溫室效應不只發生在地球，而臭氧層破洞的主因為氟氯碳化物的排放，而氟氯碳化物又剛好是溫室氣體之一；但兩者沒有直接關係。溫室效應是維持地球溫度的關鍵，若沒有溫室效應，地球的平均溫度約為-18℃。「過度的」溫室效應才是造成暖化的原因。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182376,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"下列哪項國際協定和氣候變遷無直接相關？","z":"人一生的行為，不管是善是惡，皆由時間所累積。","o":[["A","巴黎協定"],["B","京都議定書"],["C","哥本哈根協定"],["D","愛知目標"]],"a":"D","e":"2010年世界各國為解決生態破壞、棲地和野生動植物流失，訂下20項「愛知生物多樣性目標，制定了一個保護生物多樣性的未來十年行動計劃。","s":"國立臺灣師範大學環境教育研究所"},{"i":3182377,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"為什麼地球會有四季的變化？","z":"人要知福、惜福、再造福。","o":[["A","因為地球會由西向東自轉"],["B","因為地球繞太陽公轉，且自轉軸傾斜"],["C","因為月球自轉一週剛好等 新品。請問關於植物奶的敘述，下列何者錯誤?","z":"在平和的社會裡要很珍惜，珍惜一切物資，珍惜人與人之間的感情，珍惜自己擁有良能可以利益眾生；有這分珍惜的心，當下就是人間淨土。","o":[["A","植物奶相較於傳統牛奶，製作過程的碳排放量較低。也因此植物奶為友善環境的選擇"],["B","植物奶與牛奶都含有蛋白質與鈣質，因此植物奶可以完全替代牛奶的營養來源"],["C","植物奶以植物原料製成的飲品，原料大致上分為豆類、穀物、堅果三類"],["D","即使植物奶製作過程的碳排放量較低，但選擇植物奶與牛奶時仍要考慮商品的由產地到超市的碳足跡，才能判斷何者為更友善環境的商品"]],"a":"B","e":"動物奶與植物奶的營養價值不同。牛奶的蛋白質、鈣質，維生素A、B群等的含量都高於植物奶，而植物奶的優點為含膳食纖維，及飽和脂肪酸含量較低。以營養價值來看，植物奶沒辦法完全取代牛奶。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531731,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"請問下列何者最非永續飲食時，購買食材的考量因素?","z":"在平和的社會裡要很珍惜，珍惜一切物資，珍惜人與人之間的感情，珍惜自己擁有良能可以利益眾生；有這分珍惜的心，當下就是人間淨土。","o":[["A","碳足跡"],["B","產銷履歷"],["C","包裝材質"],["D","食材美觀"]],"a":"D","e":"購買食材應考量食材從產地到餐桌的過程中對環境的的碳排量與負擔，因此四選項中食材美觀最不是考量因素","s":"國立臺灣師範大學環境教育研究所"},{"i":3531732,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"請問下列敘述何者有誤?","z":"用愛心對待萬物，尊重彼此不同的生態，方能與萬物和平相處，共生共榮。","o":[["A","永續飲食乃強調日常飲食以植物性食材為主、減少動物性食材的使用量，同時也呼籲盡可能達到最大程度減少食物浪費的目標"],["B","永續海鮮以永續海洋資源為旨要，希望人類有智慧的使用海洋資源，以對海洋生態環境友善的方式撈捕，並且善待漁工"],["C","有機農業是遵守自然資源循環永續利用原則，不允許使用一切的化學物質，強調水土資源保育與生態平衡之管理系統，並達到生產自然安全農產品目標之農業"],["D","地中海飲食方式為高比例的植物性食材，低比例的動物性食材，因此飲食組合符合永續飲食的方式"]],"a":"C","e":"有機農業不允許使用合成的化學物質。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531733,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列何者不屬於循環經濟商業模式?","z":"心要清淨，做好內外環保——愛惜地球資源，照顧人生資源。","o":[["A","增加產品及物料運輸里程"],["B","資源回收"],["C","延長產品壽命"],["D","共享平台"]],"a":"A","e":"循環經濟商業模式包含循環物料、資源回收、延長產品壽命、共享平台、產品即服務等。增加產品及物料的運輸里程會增加廢棄物及汙染排放，不符合循環經濟的模式。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531734,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列何者不符合循環經濟的概念?","z":"清清淡淡地生活，自然就平平安安。","o":[["A","使用再生能源"],["B","拒絕使用無法再利用的有毒化學物質"],["C","重新設計產品製程減少廢棄物產生"],["D","縮短產品的使用週期"]],"a":"D","e":"縮短產品的使用週期會使產品更快進入廢棄或重製的過程，增加廢棄物或污染的產出，因此並不符合循環經濟的模式。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531735,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列何者不符合循環經濟減少廢棄物產生的方式?","z":"用感恩心疼惜大地萬物，生活簡單就無缺。","o":[["A","牧場產生之動物糞便用來做沼氣發電"],["B","工業廢水排入河川重回大自然"],["C","廢棄輪胎回收再利用轉製為鞋底"],["D","使用再生能源減少製造過程中的汙染"]],"a":"B","e":"循環經濟的概念之一是生產過程使用再生能源或再利用其他產品的廢棄物作為原料，以減少或利用廢棄物。工業廢水不經處理排放入河川會造成汙染，不符合循環經濟的模式。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531736,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"共享經濟模式帶來的主要效益來自於?","z":"能過清淡生活，最知足；有餘力幫助他人，最富有。","o":[["A","增加現存商品和資產的被使用率"],["B","延長產品壽命"],["C","由廢棄物產生二次原料"],["D","統一處理廢棄物"]],"a":"A","e":"共享經濟主要透過提高現存商品或資產的被使用率，最大化一項產品或服務的利用。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531737,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"工業生態學(Industrial ecology)主要概念為何?","z":"簡樸的人生是美德。","o":[["A","在工業生產過程中使用動植物"],["B","使一種工業的廢物成為另一種工業的資源"],["C","在自然環境中進行工業生產"],["D","利用天然資源生產製造產品"]],"a":"B","e":"工業生態學旨在使廢物轉為新的資源並加入新一輪的系統運行過程中。在自然生態系統中一個物種的廢物也許就是另一個物種的資源，如果工業也能像自然生態系統一樣，讓一種工業的廢物就成為另一種的資源，就可以大幅減少原材料需要和環境污染并能節約廢物垃圾的處理過程。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531738,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"歐盟的綠色政綱(Green Deal)中，哪一項計畫旨在設計及推動循環經濟，達到減少廢棄物的目的?","z":"簡樸的人生是美德。","o":[["A","公正轉型機制"],["B","能源稅改"],["C","循環經濟行動計畫(Circular Economy Action Plan)"],["D","碳邊境調整機制"]],"a":"C","e":"歐盟的綠色政綱(Green Deal)中，循環經濟行動計畫關注設計及推動循環經濟，達到減少廢棄物的目的。包括規範製造物品方法的永續產品政策，以減少材料消耗，並確保產品可重複使用和回收。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531739,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列取得原料的方式，何者不符合循環經濟的概念?","z":"如果人人能節省、惜福，貧窮就不存在。","o":[["A","回收再利用其他產品的廢棄物"],["B","募集二手物品作為原料"],["C","使用高汙染化學物質"],["D","使用可再生資源作為原料"]],"a":"C","e":"循環經濟的商業模式為盡可能減少廢棄物及汙染的產生，因此會避免使用無法再利用的高污染化學物質。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531740,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列何者為以循環經濟模式處理過期食物的方式?","z":"天天苦惱不夠、不足，是富有的窮人。","o":[["A","重新包裝再上架"],["B","加工為動物飼料或廚餘加工利用"],["C","以廢棄物處理"],["D","添加化學物質處理後再上架"]],"a":"B","e":"循環經濟的商業模式為避免廢棄物產生，B為將原廢棄之產品作為他用。A、D則為不符合食品衛生的作法。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531741,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"下列何者配對錯誤?","z":"「齋」是潔淨身心，保護眾生生命；「戒」是防非止惡，保護自己不造惡業。能齋戒就是心靈與大地的環保。","o":[["A","寶特瓶為塑膠1號 (PET)"],["B","保麗龍為塑膠7號 (OTHER)"],["C","含氯塑膠為塑膠3號(PVC)"],["D","具有耐酸鹼、耐碰撞、耐化學物質特性的為塑膠5號 (PP)"]],"a":"B","e":"保麗龍為塑膠回收 6號 (PS) 特徵：硬膠類塑膠，重擊易脆裂，且難再製作成其他塑膠製品。 耐熱溫度：70～90 °C","s":"國立臺灣師範大學環境教育研究所"},{"i":3531742,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"生物可分解(Biodegradable plastic)定義何者正確?","z":"「齋」是潔淨身心，保護眾生生命；「戒」是防非止惡，保護自己不造惡業。能齋戒就是心靈與大地的環保。","o":[["A","生物可分解塑膠流入自然環境，如土壤、河川、海洋，不會破壞環境"],["B","生物可分解塑膠取代一次性、拋棄性的塑膠製品，是從源頭減量的方法之一"],["C","生物可分解塑膠歸類為塑膠4號「lDPE」"],["D","主要的材料是澱粉、聚乳酸及纖維蛋白質"]],"a":"D","e":"英國標準協會(British Standards Institute, BSI) 2020.12月公布新的指引 PAS 9017-陸域環境的戶外聚烯烴生物可分解性(Plastics. Biodegradation of polyolefins in an open-air terrestrial environment) ，明文規定塑膠必須於兩年內在戶外分解成有機物和二氧化碳，才能被歸類為「生物可分解塑膠」，主要的材料是澱粉、聚乳酸及纖維蛋白質。生物可分解塑膠歸類為塑膠 7 號「OTHER」","s":"國立臺灣師範大學環境教育研究所"},{"i":3531743,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"以下哪種廢棄物被認為是含有有害物質的廢棄物？","z":"素食三得——培養愛心、有益健康、保護地球。","o":[["A","電池"],["B","廢棄汽、機車"],["C","塑膠製品"],["D","腐爛變質的食物"]],"a":"A","e":"電池有毒成分電池中含有大量的重金屬元素，如鋅、鉛、鎘、汞、錳等，需回收不可丟一般垃圾。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531744,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"使用材質為PVC的塑膠製品，下列何者錯誤?","z":"心理環保，不貪婪無度；生理環保，素食護生少污染。","o":[["A","久埋地下不會自行分解"],["B","PVC材質的塑膠袋容易破碎"],["C","隨意棄置造成排水管堵塞、破壞生態環境"],["D","焚燒後可能導致戴奧辛之產生"]],"a":"B","e":"聚氯乙烯 （PVC，乙烯基塑膠）的塑膠分類標誌為3號，在生命週期中可能釋放出的危險化學物質範圍很廣，包括會致癌的戴奧辛、干擾內分泌的鄰苯二甲酸酯和雙酚A，以及鉛、汞及鎘等重金屬。不添加任何塑化劑的PVC是非常硬的，但添加了塑化劑的PVC，可衍生出各類用途的製品可(如:保鮮膜)。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531745,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"資源具有回收價值(經濟可行性)才是再利用的關鍵，下列資源回收的價值構成因素何者錯誤?","z":"生活若樸實，素食菜根香，五穀皆佳餚，身心常安康。","o":[["A","廢棄物量"],["B","從源頭減量"],["C","材質價格"],["D","處理成本"]],"a":"B","e":"回收價值主要由四個因素構成:廢棄物量(指能收集到的廢棄物總量，量太少可能沒有再利用的誘因和影響力)、材質價格、收集成本(指收集回收物的成本，例如回收物太輕、細小容易飛散、有髒汙或臭味、材積太大造成運費高，都是提高收集成本的因素)、處理成本(指收集後處理成再生材料的成本)","s":"國立臺灣師範大學環境教育研究所"},{"i":3531746,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"資源回收執行統整為三大具體方針，稱為3R，3R分別為哪三者?","z":"生活若樸實，素食菜根香，五穀皆佳餚，身心常安康。","o":[["A","Recycle、Reduce、Refuse"],["B","Replace、Repair、Refuse"],["C","Recycle、Replace、Repair"],["D","Reduce、Reuse、Recycle"]],"a":"D","e":"3R分別為:Reduce(減量)、Reuse(重複使用)、Recycle(回收再利用)。香港綠色力量推出6R分別為:Reduce（減少使用）、Reuse（廢物重用）、Recycle（循環再用）、Replace（替代使用）、Repair（維修）、Refuse（拒絕）","s":"國立臺灣師範大學環境教育研究所"},{"i":3531747,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"環保意識崛起，近年來有許多膠囊咖啡和補充包等出現，下列分類方法何者正確?","z":"「食」素，也要「心」素——內心清淨，不生煩惱。","o":[["A","一般垃圾"],["B","鋁罐類"],["C","塑膠類"],["D","紙類"]],"a":"A","e":"膠囊咖啡容器為一般垃圾，它回收成本過高且回收價格低、太難處理或太髒等，造成它沒有回收價值，包裝材質分別為封膜含鋁、塑膠(PP)，部分膠囊外殼為鋁製。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531748,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"下列何者是最佳的資源回收行為?","z":"地球資源有限，唯有向全民推動樸實勤勞的精神，改變過度消費、玩樂的行為，才能「固本」保護地球資源。","o":[["A","紙容器直接回收"],["B","陶瓷製品直接回收"],["C","紙尿布直接回收"],["D","寶特瓶瓶身與瓶蓋不分離並直接回收"]],"a":"D","e":"寶特瓶使用後最正確的4步是:1.「開」轉開瓶蓋2.「洗」簡易沖洗3.「壓」壓縮寶特瓶體,積4.「丟」拴回瓶蓋,回收。歐盟規定中有一條「瓶子與瓶蓋不可分離」的規定，瓶蓋與瓶身分離的關係，瓶蓋更容易漂浮進入海洋，而鳥類對於這些漂浮在海上的小塊塑膠垃圾無法辨別，造成生態浩劫。美國Aptar Group集團也提出瓶蓋不與瓶身分離，更利於回收!","s":"國立臺灣師範大學環境教育研究所"},{"i":3531749,"t":"水資源","c":"","k":"mc","q":"下列何者為全世界用水需求最高活動?","z":"恆心、毅力能如滴水穿石，再大的困難與阻礙都能突破。","o":[["A","家用"],["B","灌溉"],["C","工業"],["D","牲畜"]],"a":"B","e":"根據世界資源研究所(World Resources Institute)的調查，所有活動的用水量其實都有顯著上升，但其中灌溉用途的水資源就佔了67.6%，工業用佔21.3%，家用佔10.7%，牲畜佔0.4%。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531750,"t":"水資源","c":"","k":"mc","q":"湖泊優養化「不會」發生以下何種現象?","z":"雙手健全卻不肯做事的人，等於是沒有手的人。","o":[["A","豐富的營養使魚類快速繁殖"],["B","水中溶氧下降"],["C","藻類大量生長"],["D","水質惡化"]],"a":"A","e":"(A)湖泊優養化反而會導致水中溶氧下降，魚類大量死亡","s":"國立臺灣師範大學環境教育研究所"},{"i":3531751,"t":"水資源","c":"","k":"mc","q":"聯合國永續發展目標的第六項(SDG 6)為潔淨水與衛生，關於此目標，以下何者描述錯誤?","z":"人生若能被人需要，能擁有一分功能為人付出，就是最幸福的人生。","o":[["A","每個人都有公平的管道取得安全且負擔的起的飲用水"],["B","到西元 2050 年全面實施綜合水資源管理"],["C","保護及恢復跟水有關的生態系統"],["D","增加各產業的用水效率以確保永續的淡水供應與回收"]],"a":"B","e":"到西元 「2030 年」，全面實施綜合水資源管理，包括跨界合作。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531752,"t":"水資源","c":"水資源-全球","k":"mc","q":"氣候變遷對水資源帶來的直接影響何者為非?","z":"願要大，志要堅，氣要柔，心要細。","o":[["A","海平面上升"],["B","降水模式轉變"],["C","地層下陷"],["D","酸雨"]],"a":"C","e":"地層下陷是因為人為過度抽取地下水引起的情況，並非氣候變遷帶來的直接影響。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531753,"t":"水資源","c":"水資源-全球","k":"mc","q":"水足跡可協助企業瞭解對水資源的依賴及衝擊，並對節水策略提供指引。關於水足跡以下何者描述正確?","z":"信心、毅力、勇氣三者具備，則天下沒有做不成的事。","o":[["A","包含藍、綠、灰、紅四種顏色水足跡"],["B","藍色水足跡為企業在生產過程中直接消耗之地面水"],["C","紅色水足跡為未達溢流程度之雨水之消耗量"],["D","灰色水足跡為將污染消化達到自然水體濃度及水質標準所需之淡水消耗量"]],"a":"D","e":"(A)沒有紅色水足跡；(B)藍色水足跡為沿著產品供應鏈所消耗之地下水及地表水；(C)沒有紅色水足跡。「未達溢流程度之雨水之消耗量」指的是綠色水足跡","s":"國立臺灣師範大學環境教育研究所"},{"i":3531754,"t":"水資源","c":"水資源-全球","k":"mc","q":"我們都希望飲用水的供應更為環保，下列何者並非合適作法？","z":"口說好話，心想好意，身行好事。","o":[["A","創新水資源處理技術"],["B","提升配水系統的品質"],["C","使用瓶裝供應"],["D","在公共場所設置供水點"]],"a":"C","e":"(A、B、D)參考友達光電水資源管理方法，改善水資源運用模式","s":"國立臺灣師範大學環境教育研究所"},{"i":3531755,"t":"水資源","c":"","k":"mc","q":"關於海洋目前面臨的危機，以下何者描述「正確」?","z":"難行能行，難捨能捨，難為能為，才能昇華自我的人格。","o":[["A","防曬乳是造成珊瑚白化的主要因素"],["B","美國西岸的海洋垃圾不會飄到台灣"],["C","過量二氧化碳融入海中造成海洋酸化"],["D","北極冰全部溶化後全球海平面將上升20公尺"]],"a":"C","e":"(A)防曬乳並不是造成珊瑚白化的主因。珊瑚白化現象主要是因為海水溫度上升以及海洋酸化的影響。(B)海洋垃圾會隨著洋流移動，在美國西岸的海洋垃圾也可能飄到台灣；(D)北極冰是海冰，全部溶化海平面也幾乎不會上升。海平面上升主要是因為格陵蘭與南極冰等陸冰溶化。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531756,"t":"水資源","c":"水資源-全球","k":"mc","q":"下列何者「並非」目前水資源面臨的挑戰?","z":"道德是提升自我的明燈，不是呵斥別人的鞭子。","o":[["A","1/3的人類面臨高度缺水危機"],["B","河川與湖泊優養化"],["C","更頻繁的暴雨補充陸地上的水資源"],["D","海洋垃圾汙染"]],"a":"C","e":"氣候變遷導致極端天氣事件更頻繁地出現，例如暴雨或乾旱。聯合國研究也指出，雨下得越多並不代表能夠解決乾旱問題。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531757,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列何者地球物質循環的機制，有助於減少大氣中的溫室氣體?","z":"疼惜物命做環保，因為專心一志而渾然忘我，不僅身體愈做愈健康，心靈垃圾也漸漸去除，故說環保是道場。","o":[["A","氧化還原"],["B","光合作用"],["C","呼吸作用"],["D","酸鹼中和"]],"a":"B","e":"指利用光能把二氧化碳、水轉化成碳水化合物的過程，其在將二氧化碳轉變成能量時，也會產生氧氣。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531760,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列何者不是溫室氣體甲烷(CH4)的排放來源？","z":"日食八分飽，二分助人好。","o":[["A","垃圾掩埋場"],["B","石油及煤礦場"],["C","家畜排泄物"],["D","滅火器"]],"a":"D","e":"(A)有機廢棄物在垃圾掩埋場分解時會產生甲烷。(B)煤和石油的形成是由於大量的有機物質緩慢分解及化學轉換的結果，其中歷了好氧反應而產生二氧化碳、甲烷及其他氣體。(C)家畜及家禽除於消化過程中因腸胃發酵產生甲烷外，其排泄及排遺作用所產生的糞尿，也會產生甲烷及氧化亞氮類之溫室氣體。(D)使用滅火器不會產生烷的排放。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531761,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列何者是造成全球暖化的主要氣體?","z":"能做而不做，辜負的是自己生命的使用權。","o":[["A","溫室氣體"],["B","揮發性氣體"],["C","惰性氣體"],["D","高壓氣體"]],"a":"A","e":"過多的溫室氣體會造成全球暖化","s":"國立臺灣師範大學環境教育研究所"},{"i":3531762,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列哪一種發電形式不須先轉換成熱能再轉變為電能？","z":"培養人格，不能說而不做；言行合一，才能影響他人。","o":[["A","火力發電"],["B","水力發電"],["C","天然氣發電"],["D","核能發電"]],"a":"B","e":"水力發電是透過位能轉換成動能，接者再由動能轉為電能","s":"國立臺灣師範大學環境教育研究所"},{"i":3531763,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"從2019年至今，有很多國家開始宣布其碳中和目標，試問下列對於碳中和概念何者有誤?","z":"培養人格，不能說而不做；言行合一，才能影響他人。","o":[["A","人類只能藉由大幅減少碳排放量，直到下降至接近於「零」的碳排放"],["B","實際上這是一個補償的方式，並非將碳排真正減至於「零」"],["C","可以透過技術，儲存大氣現存的二氧化碳，以達成「淨零碳排」的目標"],["D","這是一個碳排「淨值」的概念，因為人類不可能完全無碳排"]],"a":"A","e":"碳中和指透過減碳手段，將二氧化碳排放量正負抵銷。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531764,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列哪一種產品是屬於節能的用品？","z":"心中的愛多一點，貪欲就會少一點；感恩多一點，爭執就會少一點。","o":[["A","智慧型手機"],["B","悶燒鍋"],["C","熱水瓶"],["D","電鍋"]],"a":"B","e":"燜燒鍋是使用保溫原理將食物燜熟，鍋內一共有兩層，將食物加熱後可減少熱力的流失，其熱能保存在鍋中，經一段時間後仍可以把食物悶熟。同時可達到省瓦斯、省電的效果。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531765,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列何者非電器產品上標示瓦特（Watt）的意思?","z":"不想缺少什麼，想想擁有什麼，就會有幸福感。","o":[["A","為能量的國際單位"],["B","為單位時間內的能量（energy）轉換量"],["C","瓦數越高，能源消耗越多"],["D","可做為電器消耗能源的指標"]],"a":"A","e":"瓦特（Watt）是功率的國際單位","s":"國立臺灣師範大學環境教育研究所"},{"i":3531766,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"下列何者不會造成空氣汙染?","z":"浪費資源，是造惡業；勤儉布施，是造福德。","o":[["A","交通運輸工具"],["B","森林大火"],["C","徒步旅行"],["D","工業排放廢氣"]],"a":"C","e":"徒步旅行並不會產生空氣汙染，交通運輸工具、森林大火、工業排放廢氣皆是空氣汙染的成因。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531767,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"下列哪一個城市的空氣品質最佳","z":"浪費資源，是造惡業；勤儉布施，是造福德。","o":[["A","東京"],["B","石家莊"],["C","孟買"],["D","烏蘭巴托"]],"a":"A","e":"日本東京的空氣品質是這幾個城市中最好的","s":"國立臺灣師範大學環境教育研究所"},{"i":3531768,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"長期處於空氣汙染時，下列何者為空氣汙染所造成的影響?","z":"愛惜物命、節省消費，也是為子孫多積一分福。","o":[["A","大氣能見度(Visibility)佳"],["B","損害人體健康"],["C","促進植物生長"],["D","可以完好保存金屬材料"]],"a":"B","e":"空氣汙染容易造成能見度不佳並且對人體和植物生長造成損害以及腐蝕建築或是金屬材料等等。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531769,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"下列何者並非空氣汙染造成的環境問題?","z":"無貪最富足，有德富有餘。","o":[["A","氣溫上升"],["B","酸雨"],["C","大氣能見度(Visibility)不佳"],["D","水體優養化"]],"a":"D","e":"空氣汙染物中溫室氣體會使溫度上升，硫化物為產生酸雨的主要原因，懸浮微粒則會成能見度不佳，水體優養化與空氣汙染無直接關係。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531770,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"汙染源分為固定汙染源與移動汙染源，下列何者為空氣汙染中的移動汙染源?","z":"生活多一點簡單，心靈多一分歡喜。","o":[["A","火力發電廠"],["B","汽車"],["C","鋼鐵製造工廠"],["D","水泥製造工廠"]],"a":"B","e":"移動汙染源代表污染排放地點可能會改變，汽車在行進當中所排放的廢氣會隨著移動而改變地點。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531771,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"沙塵暴是近年常見的空氣汙染成因，當沙塵暴發生時哪一項汙染物質會急遽上升?","z":"生活多一點簡單，心靈多一分歡喜。","o":[["A","懸浮微粒"],["B","臭氧"],["C","甲烷"],["D","二氧化硫"]],"a":"A","e":"沙塵暴所造成的空氣汙染大多為懸浮微粒。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531772,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"空氣汙染是許多國家正在面對的環境問題，減少空氣汙染需從根本做起，下列何者可減少空氣汙染?","z":"生活多一點簡單，心靈多一分歡喜。","o":[["A","減少使用石化燃料"],["B","開車上班"],["C","設立更多火力發電廠"],["D","購買進口食品"]],"a":"A","e":"石化燃料的使用是造成空氣汙染的主因，需要從源頭減量做起。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531773,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"當PM2.5濃度上升時，下列何種方式可以快速降低PM2.5?","z":"環保應從心啓動，進而雙手推動、雙腳行動，形成愛的循環。","o":[["A","氣溫下降"],["B","減少用電量"],["C","降雨"],["D","搭乘大眾交通工具"]],"a":"C","e":"細懸浮微粒可成為降雨過程的凝結核，或者在雨水下降時進行吸附進而將細懸浮微粒帶到地面，雖然減少用電與搭乘大眾交通工具均對環境有益，但須長時間累積才能夠產生成效。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531774,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"在有些海岸會發生螢光藍藻的現象，成為觀光的焦點。然而，這現象可能是什麼造成的？","z":"做對人生有意義的事，才是生命真正的價值。","o":[["A","海洋酸化"],["B","有機物汙染造成優養化"],["C","輻射污染及熱污染"],["D","油品及化學品洩漏之污染"]],"a":"B","e":"螢光藍藻（藍眼淚）的形成是由於甲藻的生物發光現象，甲藻因感受到環境變化發出螢光。甲藻大多分布在沿海口岸、河口或大陸棚淺水區，因該地有豐富的浮游生物，讓甲藻有充足的食物來源。研究指出，甲藻出現大量繁殖意味海洋中有大量的浮游生物，海洋環境比較不健康。因此，爆量的藍眼淚其實是個生態警訊。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531775,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"有關海洋汙染物的特性，以下何者為非？","z":"今天只要有一次，應好好把握做該做的事。","o":[["A","污染源多且複雜"],["B","累積性及持續性強"],["C","污染擴散範圍廣"],["D","危害大但防治容易"]],"a":"D","e":"人類在陸地和其他活動方面所產生的各種污染物也將通過河川傳輸流入海、大氣擴散和雨雪等降水過程，最終都將匯入海洋。海洋是地球上地勢最低的區域，因此污染物一旦進入海洋後，很難再轉移出去。因此海洋汙染物來源多且複雜、易累積擴散、範圍廣，危害大但不易防治。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531776,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"下列何者並非珊瑚白化成因？","z":"人生的責任，是要做利益人群的事。","o":[["A","海洋酸化"],["B","海水溫度升高"],["C","船舶引發的噪音污染"],["D","海水混濁"]],"a":"C","e":"珊瑚白化現象是珊瑚礁所表現出來的病理特徵，造成珊瑚白化的原因有很多，除最主要的全球暖化而導致的暖流匯聚導致海水溫度過高，諸如沉積物增加而引起水變混濁、細菌感染、海水中除草劑濃度增高、海水鹽度改變、海水中的化學反應的變化、太陽的輻射量的增加以及退潮和曝光等。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531777,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"1993年於核二廠出水口附近海域發現畸形的花身雞魚，其形成原因為何？","z":"人生若能減低欲望，生活上便沒有什麼值得計較。","o":[["A","水溫偏高"],["B","輻射"],["C","塑膠微粒"],["D","化學汙染物"]],"a":"A","e":"「秘雕魚事件」發生於1993年，於核二廠出水口附近海域發現數量頗多之畸形花身雞魚與大鱗魚，經研究發現水溫偏高(最高37℃)為可能之原因。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531778,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"海洋中最常見的污染物質為何？","z":"知足的人心量開闊，心量開闊，對人對事就不會計較。","o":[["A","石油"],["B","塑膠製品"],["C","有機物"],["D","有毒金屬"]],"a":"B","e":"塑膠是海洋中最常見的污染物質，塑膠對環境是有害的並不容易分解，且經常被海洋動物誤認為食物。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531779,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"以下何者不是形成塑膠微粒的來源？","z":"能幫助別人，能為社會盡一分力，即使一點一滴都有大用；因為有一分心，就有一分力量。","o":[["A","塑膠袋"],["B","去角質微珠洗面乳"],["C","刷毛衣物"],["D","有毒金屬"]],"a":"D","e":"塑膠微粒（microplastic）是指長度小於5毫米的塑膠顆粒，包含塑料微粒、塑膠柔珠(美妝產品用於去角質)、人造纖維(如：刷毛衣物)和塑料製品的碎裂物、輪胎。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531780,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"所謂的死區(Dead zone)－低氧海洋地區的主要形成原因為何？","z":"人應擴大愛心，於富中修慧，此福慧平行齊進，並取諸社會、用諸社會，即是植福修慧。","o":[["A","海平面上升"],["B","海洋吸收大氣中的二氧化碳"],["C","海洋中的氧氣大量流失"],["D","塑膠微粒"]],"a":"C","e":"死區的發生原因是過度的營養物質，大部分是氮和磷，進入海岸海域後變成海藻群的營養來源，當這些微小的植物死亡後沉到底層之後，又變成細菌的養分來源，在細菌分解的過程中則需要消耗周遭溶於水的氧分子。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531781,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"以下何者不屬於海洋污染？","z":"付出其實就是最大的收穫，因為能施與的人，比受施的人更幸福。","o":[["A","油品及化學品洩漏之污染"],["B","有機物及營養鹽污染"],["C","輻射污染及熱污染"],["D","光化學煙霧"]],"a":"D","e":"海洋污染有：油品及化學品洩漏之污染、有機物及營養鹽污染、持久性有機物污染、重金屬污染、輻射污染及熱污染、海洋微塑膠。光化學煙霧（Photochemical smog）是由氮氧化物及揮發性有機物等污染物質光解而產生的，之後會留下懸浮粒子及對流層臭氧，屬於大氣中二次污染物。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531782,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"建築業如何達成循環經濟模式?","z":"人若不知福、不懂得感恩，只是多消福。","o":[["A","建築使用中，以綠能源為主"],["B","建築設計以100%使用再生材料為主"],["C","從營造、使用到拆除的各個階段，創造資源循環的迴圈、完整保留建材資源的價值。"],["D","營建過程中，盡可能的降低碳排量"]],"a":"C","e":"循環經濟是一個讓資源持續循環、高度保存產品價值的系統。關鍵並不是建材是否使用了再生材料，也不是單純減少來多少廢棄物的產出，而是我們是否有辦法創造出資源循環的迴圈、完整保留產品的價值。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531783,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列何種建築廢材無法回收再生？","z":"知足則有福，不知足則招禍。","o":[["A","扭曲的鋼材"],["B","表面脫漆的實木木料"],["C","混凝土塊中的排水管"],["D","破碎的玻璃"]],"a":"C","e":"鋼材可以重新融製煉鋼、實木可除漆後再製成板料、玻璃可融化再製。混凝土塊中的排水管難以分離再製，只能當廢料棄置。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531784,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"以下建築規劃何者不屬於循環經濟的原則？","z":"只要有信心與愛心，每天都是健康與平安。","o":[["A","雨水回收系統"],["B","節能隔熱玻璃採光"],["C","使用再生建材"],["D","高樓層是減少土地使用"]],"a":"D","e":"高樓層的建築競技現象，使用更多材料，耗費更多資源。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531785,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"以下何者不是時尚產業應有的循環經濟模式?","z":"人心平淡，才有平安的福。","o":[["A","以產品設計方式增加商品的可回收並再利用性"],["B","增加第三世界童工就業機會"],["C","提升舊衣回收後再製成新商品銷售的數量"],["D","增加生產利用舊衣製成再生布料的服裝商品比例"]],"a":"B","e":"2020年是聯合國國際勞工組織（International Labour Organisation, ILO）在歷史上首次讓187個成員國家全部簽署接受某一個國際勞動標準，也就是第182 號的「最惡劣形式童工公約」（ILO Convention No. 182 on Worst Forms of Child Labour ）。這代表，儘管簽署的成員國可能還是有未成年人惡劣、危險的環境中工作等問題，但在這些國家裡，政府已經展示決心，孩子們也已經至少受到法律保護，不該在不恰當的環境下工作。終結童工更重要的意義是加強對兒童的保護，讓弱勢的孩子不會必須離開學校去賺錢。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531786,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列何者不是推動循環經濟的驅動力？","z":"生活若簡樸，人生就幸福。","o":[["A","ＧＤＰ的穩定增長"],["B","降低環境壓力"],["C","確保自然資源的永續"],["D","創造就業機會與產值"]],"a":"A","e":"在循環經濟的發展架構下，原材料和產品可以得到最佳化的使用，讓自然資源得以再次被利用，並賦予其經濟價值，對環境的損害降到最低，此發展模式不僅適用於再生資源，如農產品和木材等生物原料，也適用於不可再生資源，如化石燃料和金屬。換言之，循環經濟旨在針對生產鏈中所投入的自然資源，儘可能的拉長其利用的時間，同時減少使用新的自然資源與能源，防止對土壤、空氣和水的破壞以及降低產生有害物質與廢物排放。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531787,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"「全農業」(full agriculture)是透過生物精煉技術，將廢棄的農業副產品再製為四類產品。下列何者為非？","z":"造福人間、庇護地球，都需從自己做起。","o":[["A","肥料"],["B","能源"],["C","食品"],["D","飼料"]],"a":"C","e":"循環農業的生物精煉技術，基本上圍繞著「全農業」(full agriculture)的思維發展，全農業則可解釋為一種完全利用的概念。過去農業產品取走食用部位後，其餘的副產物多焚燒、翻耕掩埋，或再製為堆肥；而現藉由生物精練技術，配合不同的技術類型，可將農業副產品再製為肥料、飼料、能源以及材料等四類產品。其中材料應用扮演著將副產物加值為生技產品，或跨入工業應用材料的橋梁，飼料應用則維持農產品部分供應予動物食用的核心用途，肥料與能源則扮演大量去化，與促使各類產品重新回饋到農業生產的關鍵角色。","s":"國立臺灣師範大學環境教育研究所"},{"i":3531788,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"有關大氣的功用，下列敘述何者為非?","z":"有心要付出，就有無限的能力。","o":[["A","維持適合生物生存的溫度"],["B","提供生物賴以為生的氧氣"],["C","提供各種星象讓人們欣賞"],["D","減緩隕石直接撞擊地球"]],"a":"C","e":"天空中的星象是宇宙間各種星體運行所形成的現象，與大氣層無關","s":"國立臺灣師範大學環境教育研究所"},{"i":3531789,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"地球上大部分生物都生活在大氣層中的哪一層?","z":"做環保不僅能呵護地球，也可以回收自己，再造清淨的人品。","o":[["A","臭氧層"],["B","對流層"],["C","中氣層"],["D","平流層"]],"a":"B","e":"距離地表13公里內的大氣層稱為對流層，也是多數生物可以正常生存的地方","s":"國立臺灣師範大學環境教育研究所"},{"i"
