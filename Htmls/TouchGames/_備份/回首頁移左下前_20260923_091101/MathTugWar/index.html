<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>數學拔河大賽</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3b82f6; --blue-d:#1d4ed8; --blue-l:#dbeafe; --blue-ll:#eff6ff;
  --red:#ef4444;  --red-d:#b91c1c;  --red-l:#fee2e2;  --red-ll:#fef2f2;
  --amber:#f59e0b; --amber-d:#d97706;
  --ink:#334155; --ink-soft:#64748b;
  --ok:#10b981; --bad:#ef4444;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; margin:0; padding:0; }
html,body{ width:100%; height:100%; overflow:hidden; touch-action:none; }
body{
  font-family:'Nunito','Microsoft JhengHei','蘋方-繁',sans-serif;
  color:var(--ink);
  background:#fff8ec;
  background-image:radial-gradient(#fde2b3 2px, transparent 2px);
  background-size:26px 26px;
}
input{ user-select:text; -webkit-user-select:text; font-family:inherit; }
button{ font-family:inherit; cursor:pointer; border:none; }

/* ── 等比縮放舞台 1600×900 ── */
#stage{
  position:absolute; left:50%; top:50%;
  width:1600px; height:900px;
  transform-origin:center center;
}

/* ── 標題列 ── */
.title{
  position:absolute; top:22px; left:0; right:0; text-align:center;
  font-size:46px; font-weight:900; letter-spacing:4px;
  color:var(--amber-d);
  text-shadow:0 3px 0 #fff, 0 6px 14px rgba(217,119,6,.25);
}
.title small{ font-size:22px; letter-spacing:1px; color:#b45309; opacity:.75; margin-left:10px; }
#pauseBtn{
  position:absolute; top:22px; right:28px;
  width:58px; height:58px; border-radius:50%;
  background:#fff; border:3px solid #fcd34d;
  box-shadow:0 4px 12px rgba(217,119,6,.25);
  display:flex; align-items:center; justify-content:center;
}
#pauseBtn:active{ transform:scale(.92); }

/* ── 主要三欄 ── */
.arena{
  position:absolute; top:110px; left:30px; right:30px; bottom:40px;
  display:grid; grid-template-columns:400px 1fr 400px; gap:28px;
}

/* ── 隊伍面板 ── */
.team{
  background:#fff; border-radius:30px; overflow:hidden;
  box-shadow:0 10px 30px rgba(15,23,42,.10);
  display:flex; flex-direction:column;
  border:4px solid transparent;
  transition:transform .15s;
}
.team.blue{ border-color:var(--blue-l); }
.team.red { border-color:var(--red-l); }
.team-head{
  height:72px; padding:0 20px; display:flex; align-items:center; justify-content:space-between;
  color:#fff; font-size:30px; font-weight:900;
}
.blue .team-head{ background:linear-gradient(135deg,#60a5fa,var(--blue-d)); }
.red  .team-head{ background:linear-gradient(135deg,#f87171,var(--red-d)); }
.team-name{ display:flex; align-items:center; gap:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:280px; }
.badge{
  min-width:52px; height:52px; border-radius:26px; padding:0 12px;
  background:#fff; font-size:30px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
}
.blue .badge{ color:var(--blue-d); } .red .badge{ color:var(--red-d); }
.question{
  height:104px; display:flex; align-items:center; justify-content:center;
  font-size:56px; font-weight:900; letter-spacing:2px; white-space:nowrap;
}
.blue .question{ background:var(--blue-ll); color:var(--blue-d); }
.red  .question{ background:var(--red-ll);  color:var(--red-d); }
.answer-row{ padding:14px 22px 6px; position:relative; }
.answer{
  height:76px; border-radius:20px; border:3px solid #e2e8f0; background:#f8fafc;
  font-size:48px; font-weight:900; display:flex; align-items:center; justify-content:center;
  color:var(--ink); transition:background .2s,border-color .2s;
}
.answer.empty{ color:#cbd5e1; }
.answer.ok { background:#d1fae5; border-color:var(--ok); color:#047857; }
.answer.bad{ background:#fee2e2; border-color:var(--bad); color:#b91c1c; }
.npc-bar{
  position:absolute; left:22px; right:22px; bottom:-4px; height:8px; border-radius:4px;
  background:#fee2e2; overflow:hidden; display:none;
}
.npc-bar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#fca5a5,var(--red)); border-radius:4px; }
.team.is-npc .npc-bar{ display:block; }
.keypad{
  flex:1; padding:16px 22px 22px;
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(4,1fr); gap:12px;
}
.key{
  border-radius:20px; background:#f1f5f9; color:var(--ink);
  font-size:42px; font-weight:900;
  box-shadow:0 5px 0 #cbd5e1;
  display:flex; align-items:center; justify-content:center;
  transition:transform .06s, box-shadow .06s, background .15s;
}
.key.down, .key:active{ transform:translateY(4px); box-shadow:0 1px 0 #cbd5e1; }
.key.clr{ background:#fb7185; color:#fff; box-shadow:0 5px 0 #e11d48; }
.key.go { color:#fff; }
.blue .key.go{ background:var(--blue); box-shadow:0 5px 0 var(--blue-d); }
.red  .key.go{ background:var(--red);  box-shadow:0 5px 0 var(--red-d); }
.key.clr.down,.key.go.down,.key.clr:active,.key.go:active{ box-shadow:0 1px 0 rgba(0,0,0,.25); }
.team.is-npc .keypad{ pointer-events:none; }
.team.is-npc .key:not(.down){ opacity:.72; }
.team.locked .keypad{ pointer-events:none; opacity:.55; }
.team.shake{ animation:shake .4s; }
@keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-7px)} 80%{transform:translateX(4px)} }
.team.glow.blue{ box-shadow:0 0 0 6px rgba(59,130,246,.35),0 10px 30px rgba(15,23,42,.10); }
.team.glow.red { box-shadow:0 0 0 6px rgba(239,68,68,.35),0 10px 30px rgba(15,23,42,.10); }

/* ── 中央 ── */
.center{
  background:#fff; border-radius:30px; padding:16px;
  box-shadow:0 10px 30px rgba(15,23,42,.10);
  display:flex; flex-direction:column; gap:14px;
}
.board{
  height:92px; border-radius:22px; background:linear-gradient(180deg,#f8fafc,#eef2f7);
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 26px;
}
.board .side{ display:flex; flex-direction:column; }
.board .side.r{ align-items:flex-end; }
.board .nm{ font-size:18px; font-weight:800; color:var(--ink-soft); max-width:220px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.board .sc{ font-size:40px; font-weight:900; line-height:1; }
.board .l .sc{ color:var(--blue); } .board .r .sc{ color:var(--red); }
.timer{ font-size:34px; font-weight:900; color:var(--amber-d); display:flex; align-items:center; gap:8px; }
.meta{ text-align:center; font-size:15px; color:var(--ink-soft); font-weight:800; margin-top:2px; }
.scene{ flex:1; border-radius:22px; overflow:hidden; position:relative; background:#e0f2fe; }
.scene svg{ width:100%; height:100%; display:block; }
#tug{ transition:transform .55s cubic-bezier(.34,1.56,.64,1); }
.crew{ transition:transform .18s; }
.crew.yank-l{ transform:translateX(-10px); }
.crew.yank-r{ transform:translateX(10px); }
.crew.stumble{ animation:stumble .5s; }
@keyframes stumble{ 0%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} 60%{transform:translateY(2px)} }
.idle{ animation:idle 1.1s ease-in-out infinite; }
@keyframes idle{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
.puff{ animation:puff .7s forwards; }
@keyframes puff{ from{opacity:.9; transform:scale(.4)} to{opacity:0; transform:scale(1.6) translateY(-10px)} }
.pop-text{
  position:absolute; font-size:44px; font-weight:900; pointer-events:none;
  animation:popUp 1s forwards; text-shadow:0 3px 0 #fff;
}
@keyframes popUp{ from{opacity:0; transform:translate(-50%,10px) scale(.6)} 20%{opacity:1; transform:translate(-50%,0) scale(1.1)} to{opacity:0; transform:translate(-50%,-50px) scale(1)} }

/* ── 覆蓋層 ── */
.overlay{
  position:absolute; inset:0; background:rgba(51,41,25,.45); backdrop-filter:blur(5px);
  display:flex; align-items:center; justify-content:center; z-index:50;
}
.hidden{ display:none !important; }
.modal{
  width:860px; background:#fff; border-radius:36px; padding:30px 42px 28px;
  box-shadow:0 30px 70px rgba(0,0,0,.25); text-align:center;
  border:5px solid #fde68a;
}
.modal h2{ font-size:42px; font-weight:900; color:var(--amber-d); letter-spacing:3px; }
.stepper{ display:flex; justify-content:center; align-items:flex-start; gap:0; margin:16px 0 12px; }
.st{ width:110px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:17px; font-weight:800; color:#94a3b8; }
.st b{ width:44px; height:44px; border-radius:50%; border:3px solid #fcd34d; color:var(--amber-d); background:#fff;
       display:flex; align-items:center; justify-content:center; font-size:21px; }
.st.on{ color:var(--ink); } .st.on b{ background:var(--amber); color:#fff; border-color:var(--amber); }
.st.done b{ background:#fef3c7; }
.st-line{ width:60px; height:3px; background:#fde68a; margin-top:21px; border-radius:2px; }
.page h3{ font-size:26px; font-weight:900; color:var(--ink); }
.page p.hint{ font-size:17px; color:var(--ink-soft); margin:4px 0 16px; font-weight:700; }
.opts{ display:grid; gap:16px; }
.opts.c2{ grid-template-columns:1fr 1fr; } .opts.c3{ grid-template-columns:1fr 1fr 1fr; }
.opt{
  border-radius:22px; background:#f8fafc; border:3px solid #e2e8f0;
  padding:16px 18px; display:flex; align-items:center; gap:14px;
  font-size:24px; font-weight:900; color:var(--ink); text-align:left;
  transition:all .15s;
}
.opt .ic{ width:58px; height:58px; border-radius:18px; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.08);
          display:flex; align-items:center; justify-content:center; font-size:32px; flex-shrink:0; }
.opt small{ display:block; font-size:15px; color:var(--ink-soft); font-weight:700; margin-top:2px; }
.opt.v{ flex-direction:column; text-align:center; gap:2px; padding:12px 10px; }
.opt.sel{ background:#fffbeb; border-color:var(--amber); box-shadow:0 0 0 4px rgba(245,158,11,.18); }
.opt.sel .ic{ background:var(--amber); color:#fff; }
.opt:active{ transform:scale(.97); }
.sub-title{ font-size:20px; font-weight:900; color:var(--ink-soft); margin:16px 0 8px; }
.names{ display:grid; grid-template-columns:1fr auto 1fr; gap:20px; align-items:center; }
.name-card{ border-radius:24px; padding:20px; border:4px solid; background:#f8fafc; }
.name-card.b{ border-color:#93c5fd; } .name-card.r{ border-color:#fca5a5; }
.name-card .lbl{ font-size:22px; font-weight:900; margin:6px 0 12px; }
.name-card.b .lbl{ color:var(--blue-d); } .name-card.r .lbl{ color:var(--red-d); }
.name-card input{
  width:100%; height:62px; border-radius:16px; border:3px solid #e2e8f0; text-align:center;
  font-size:26px; font-weight:800; color:var(--ink); outline:none;
}
.name-card input:focus{ border-color:var(--amber); }
.vs{ font-size:40px; font-weight:900; color:var(--amber-d); }
.warn{ color:var(--bad); font-weight:800; font-size:17px; height:24px; margin-top:12px; }
.nav{ display:flex; justify-content:center; gap:18px; margin-top:14px; }
.btn{
  height:66px; padding:0 34px; border-radius:20px; font-size:25px; font-weight:900;
  display:inline-flex; align-items:center; gap:10px;
}
.btn.ghost{ background:#fff; color:var(--ink); border:3px solid #e2e8f0; }
.btn.main { background:linear-gradient(135deg,#fbbf24,var(--amber-d)); color:#fff; box-shadow:0 6px 0 #b45309; min-width:220px; justify-content:center; }
.btn.main:active{ transform:translateY(4px); box-shadow:0 2px 0 #b45309; }
.btn.blue{ background:var(--blue); color:#fff; box-shadow:0 6px 0 var(--blue-d); }
.btn:disabled{ opacity:.4; }

#countdown{ font-size:220px; font-weight:900; color:#fff; text-shadow:0 10px 0 var(--amber-d),0 20px 40px rgba(0,0,0,.3); }
#countdown.tick{ animation:cd .9s; }
@keyframes cd{ from{transform:scale(1.8); opacity:0} 30%{transform:scale(1); opacity:1} to{transform:scale(.9); opacity:.9} }

.win-emoji{ font-size:110px; line-height:1; animation:bounce 1.2s infinite; }
@keyframes bounce{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
.win-name{ font-size:54px; font-weight:900; margin:8px 0 2px; }
.stats{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:22px 0 10px; }
.stat{ border-radius:22px; padding:16px; background:#f8fafc; border:3px solid #e2e8f0; }
.stat.b{ border-color:#bfdbfe; } .stat.r{ border-color:#fecaca; }
.stat h4{ font-size:22px; font-weight:900; margin-bottom:8px; }
.stat.b h4{ color:var(--blue-d); } .stat.r h4{ color:var(--red-d); }
.stat div{ font-size:19px; font-weight:800; color:var(--ink-soft); line-height:1.7; }
.stat div b{ color:var(--ink); font-size:22px; }
#confetti{ position:absolute; inset:0; pointer-events:none; z-index:60; }
</style>
</head>
<body>

<a href="../index.html" title="回首頁" style="
    position:fixed;top:14px;left:16px;z-index:99999;
    width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,0.82);
    border:2px solid #f9a8d4;
    box-shadow:0 4px 12px rgba(236,72,153,0.22);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;transition:background 0.2s,box-shadow 0.2s;"
  onmouseover="this.style.background='#fce7f3';this.style.boxShadow='0 6px 18px rgba(236,72,153,0.38)'"
  onmouseout="this.style.background='rgba(255,255,255,0.82)';this.style.boxShadow='0 4px 12px rgba(236,72,153,0.22)'">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
       stroke="#ec4899" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
    <polyline points="9 22 9 12 15 12 15 22"/>
  </svg>
</a>

<div id="stage">
  <div class="title">數學拔河大賽<small>Math Tug of War</small></div>
  <button id="pauseBtn" title="暫停">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#d97706"><rect x="5" y="4" width="5" height="16" rx="2"/><rect x="14" y="4" width="5" height="16" rx="2"/></svg>
  </button>

  <div class="arena">
    <!-- 藍隊 -->
    <section class="team blue" id="teamB">
      <div class="team-head"><span class="team-name" id="nameB">藍隊</span><span class="badge" id="badgeB">0</span></div>
      <div class="question" id="qB">? + ? = ?</div>
      <div class="answer-row"><div class="answer empty" id="ansB">?</div></div>
      <div class="keypad" data-team="B"></div>
    </section>

    <!-- 中央 -->
    <section class="center">
      <div class="board">
        <div class="side l"><span class="nm" id="bNameB">藍隊</span><span class="sc" id="bScB">0</span></div>
        <div>
          <div class="timer">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9 2h6"/></svg>
            <span id="timer">00:00</span>
          </div>
          <div class="meta" id="meta">加法 · 普通</div>
        </div>
        <div class="side r"><span class="nm" id="bNameR">紅隊</span><span class="sc" id="bScR">0</span></div>
      </div>
      <div class="scene" id="scene">
        <svg viewBox="40 -250 820 770" preserveAspectRatio="xMidYMax slice">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#f0f9ff"/>
            </linearGradient>
            <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#4ade80"/>
            </linearGradient>
            <!-- 可愛小朋友（面向右，原點在腳底中心） -->
            <g id="kid">
              <path d="M-8,-58 L-24,-6" stroke="#475569" stroke-width="13" stroke-linecap="round" fill="none"/>
              <path d="M-2,-58 L14,-32 L24,-6" stroke="#475569" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <ellipse cx="-22" cy="-5" rx="13" ry="6.5" fill="currentColor"/>
              <ellipse cx="28" cy="-5" rx="13" ry="6.5" fill="currentColor"/>
              <rect x="-20" y="-114" width="34" height="58" rx="15" fill="currentColor" transform="rotate(-20 -3 -58)"/>
              <path d="M-18,-100 L34,-82" stroke="#fcd7b6" stroke-width="10" stroke-linecap="round"/>
              <path d="M-12,-92 L22,-80" stroke="#f5c29a" stroke-width="10" stroke-linecap="round"/>
              <circle cx="34" cy="-82" r="7" fill="#fcd7b6"/>
              <circle cx="-30" cy="-134" r="25" fill="#fde2c8"/>
              <path d="M-55,-136 A25,25 0 0 1 -6,-140 Q-18,-133 -28,-137 Q-40,-128 -55,-136Z" fill="#4a3426"/>
              <path d="M-55,-142 L-7,-146" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
              <path d="M-54,-142 L-66,-134 M-54,-142 L-64,-148" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
              <path d="M-22,-133 l6,-2" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
              <ellipse cx="-22" cy="-122" rx="5" ry="3" fill="#fda4af" opacity=".8"/>
              <path d="M-14,-121 q4,2 7,-1" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            </g>
          </defs>
          <rect x="-200" y="-400" width="1300" height="800" fill="url(#sky)"/>
          <circle cx="770" cy="-60" r="40" fill="#fde68a"/><circle cx="770" cy="-60" r="56" fill="#fde68a" opacity=".35"/>
          <g fill="#fff" opacity=".9">
            <ellipse cx="170" cy="-40" rx="46" ry="18"/><ellipse cx="200" cy="-52" rx="30" ry="18"/>
            <ellipse cx="520" cy="40" rx="40" ry="14"/><ellipse cx="545" cy="30" rx="24" ry="14"/><ellipse cx="330" cy="110" rx="34" ry="12"/>
          </g>
          <rect x="-200" y="398" width="1300" height="300" fill="url(#grass)"/>
          <g fill="#22c55e" opacity=".5">
            <path d="M90,440 l6,-14 l6,14z M300,500 l5,-12 l5,12z M620,450 l6,-14 l6,14z M800,520 l5,-12 l5,12z M480,560 l5,-11 l5,11z M170,570 l6,-14 l6,14z M720,580 l6,-14 l6,14z"/>
          </g>
          <!-- 勝利線 -->
          <g id="winMarks">
            <line id="winLineB" x1="250" y1="220" x2="250" y2="590" stroke="#3b82f6" stroke-width="5" stroke-dasharray="4 10" stroke-linecap="round"/>
            <line id="winLineR" x1="650" y1="220" x2="650" y2="590" stroke="#ef4444" stroke-width="5" stroke-dasharray="4 10" stroke-linecap="round"/>
            <path id="flagB" d="M250,220 l-34,12 l34,12z" fill="#3b82f6"/>
            <path id="flagR" d="M650,220 l34,12 l-34,12z" fill="#ef4444"/>
          </g>
          <line x1="450" y1="170" x2="450" y2="595" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>

          <g id="tug">
            <!-- 繩子 -->
            <path d="M130,402 Q140,318 200,318 L700,318 Q760,318 770,402" fill="none" stroke="#92602f" stroke-width="9" stroke-linecap="round"/>
            <path d="M130,402 Q140,318 200,318 L700,318 Q760,318 770,402" fill="none" stroke="#d9a066" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>
            <!-- 中心彩帶 -->
            <g>
              <path d="M450,318 l-13,40 l13,-8 l13,8z" fill="#facc15" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="450" cy="318" r="8" fill="#f59e0b" stroke="#fff" stroke-width="3"/>
            </g>
            <!-- 藍隊 -->
            <g class="crew" id="crewB">
              <g class="idle"><use href="#kid" transform="translate(230,400)" style="color:#3b82f6"/></g>
              <g class="idle" style="animation-delay:-.5s"><use href="#kid" transform="translate(320,400)" style="color:#2563eb"/></g>
            </g>
            <!-- 紅隊（鏡像） -->
            <g class="crew" id="crewR">
              <g class="idle" style="animation-delay:-.3s"><use href="#kid" transform="translate(580,400) scale(-1,1)" style="color:#dc2626"/></g>
              <g class="idle" style="animation-delay:-.8s"><use href="#kid" transform="translate(670,400) scale(-1,1)" style="color:#ef4444"/></g>
            </g>
          </g>
          <g id="fx"></g>
        </svg>
      </div>
    </section>

    <!-- 紅隊 -->
    <section class="team red" id="teamR">
      <div class="team-head"><span class="team-name" id="nameR">紅隊</span><span class="badge" id="badgeR">0</span></div>
      <div class="question" id="qR">? + ? = ?</div>
      <div class="answer-row"><div class="answer empty" id="ansR">?</div><div class="npc-bar"><i id="npcBar"></i></div></div>
      <div class="keypad" data-team="R"></div>
    </section>
  </div>

  <!-- ── 設定精靈 ── -->
  <div class="overlay" id="setup">
    <div class="modal">
      <h2>準備開始拔河！</h2>
      <div class="stepper" id="stepper"></div>

      <div class="page" data-page="0">
        <h3>對戰模式</h3><p class="hint">要和電腦比賽，還是找同學一起比？</p>
        <div class="opts c2" data-group="mode">
          <button class="opt" data-val="npc"><span class="ic">🤖</span><span>挑戰電腦<small>一個人對抗 NPC 機器人</small></span></button>
          <button class="opt" data-val="pvp"><span class="ic">🧑‍🤝‍🧑</span><span>雙人對戰<small>兩人（或兩隊）同時搶答</small></span></button>
        </div>
      </div>

      <div class="page" data-page="1">
        <h3>選擇題型</h3><p class="hint">可以複選，題目會從選到的題型隨機出</p>
        <div class="opts c2" data-group="ops" data-multi="1">
          <button class="opt" data-val="+"><span class="ic">＋</span>加法</button>
          <button class="opt" data-val="-"><span class="ic">－</span>減法</button>
          <button class="opt" data-val="*"><span class="ic">×</span>乘法</button>
          <button class="opt" data-val="/"><span class="ic">÷</span>除法</button>
        </div>
        <div class="warn" id="opsWarn"></div>
      </div>

      <div class="page" data-page="2">
        <h3>難度設定</h3>
        <div class="sub-title" style="margin-top:8px">題目難度</div>
        <div class="opts c3" data-group="level">
          <button class="opt" data-val="easy"><span class="ic">🌱</span><span>簡單<small>20 以內・小乘除</small></span></button>
          <button class="opt" data-val="medium"><span class="ic">🌳</span><span>普通<small>二位數・九九乘除</small></span></button>
          <button class="opt" data-val="hard"><span class="ic">🔥</span><span>困難<small>三位數・二位數乘除</small></span></button>
        </div>
        <div class="sub-title">比賽長度（需要拉幾下才獲勝）</div>
        <div class="opts c3" data-group="len">
          <button class="opt v" data-val="3">⚡ 短<small>拉 3 格</small></button>
          <button class="opt v" data-val="5">⏱️ 標準<small>拉 5 格</small></button>
          <button class="opt v" data-val="8">🏔️ 長<small>拉 8 格</small></button>
        </div>
        <div id="npcLevelWrap">
          <div class="sub-title">電腦強度</div>
          <div class="opts c3" data-group="npc">
            <button class="opt v" data-val="1">🐣 新手<small>慢慢算、偶爾算錯</small></button>
            <button class="opt v" data-val="2">🐶 普通<small>速度中等</small></button>
            <button class="opt v" data-val="3">🦊 高手<small>又快又準</small></button>
          </div>
        </div>
      </div>

      <div class="page" data-page="3">
        <h3>隊伍名稱</h3><p class="hint">可以直接使用預設名稱</p>
        <div class="names">
          <div class="name-card b"><div style="font-size:44px">🔵</div><div class="lbl">藍隊（左邊）</div><input id="inB" maxlength="8" value="藍隊"></div>
          <div class="vs">VS</div>
          <div class="name-card r"><div style="font-size:44px" id="redIcon">🔴</div><div class="lbl">紅隊（右邊）</div><input id="inR" maxlength="8" value="紅隊"></div>
        </div>
      </div>

      <div class="nav">
        <button class="btn ghost" id="backBtn">← 上一步</button>
        <button class="btn main" id="nextBtn">下一步 →</button>
      </div>
    </div>
  </div>

  <!-- 倒數 -->
  <div class="overlay hidden" id="cdLayer" style="background:rgba(51,41,25,.35)"><div id="countdown">3</div></div>

  <!-- 暫停 -->
  <div class="overlay hidden" id="pauseLayer">
    <div class="modal" style="width:560px">
      <div class="win-emoji" style="animation:none">⏸️</div>
      <h2 style="margin:10px 0 26px">暫停中</h2>
      <div style="display:flex;flex-direction:column;gap:16px;align-items:center">
        <button class="btn main" id="resumeBtn" style="width:320px">▶ 繼續比賽</button>
        <button class="btn ghost" id="restartBtn" style="width:320px;justify-content:center">🔄 重新開始</button>
        <button class="btn ghost" id="resetupBtn" style="width:320px;justify-content:center">⚙️ 重新設定</button>
      </div>
    </div>
  </div>

  <!-- 結果 -->
  <div class="overlay hidden" id="winLayer">
    <div class="modal" style="width:760px">
      <div class="win-emoji" id="winEmoji">🏆</div>
      <div class="win-name" id="winName">藍隊 獲勝！</div>
      <div style="font-size:20px;font-weight:800;color:var(--ink-soft)" id="winTime">比賽時間 00:00</div>
      <div class="stats">
        <div class="stat b"><h4 id="stNameB">藍隊</h4><div id="stB"></div></div>
        <div class="stat r"><h4 id="stNameR">紅隊</h4><div id="stR"></div></div>
      </div>
      <div class="nav">
        <button class="btn ghost" id="winSetupBtn">⚙️ 重新設定</button>
        <button class="btn main" id="againBtn">🔄 再玩一次</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" width="1600" height="900"></canvas>
</div>

<script>
/* =========================================================
   數學拔河大賽 Math Tug of War
   ========================================================= */
const $ = id => document.getElementById(id);

/* ── 舞台等比縮放 ── */
function fit(){
  const s = Math.min(innerWidth/1600, innerHeight/900);
  $('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ── 音效（WebAudio，免外部檔案） ── */
let actx = null;
function tone(freq, dur=0.12, type='sine', vol=0.18, delay=0){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const SFX = {
  key(){ tone(660,0.05,'triangle',0.08); },
  ok(){ tone(784,0.1,'triangle',0.2); tone(1175,0.18,'triangle',0.2,0.08); },
  bad(){ tone(180,0.25,'sawtooth',0.12); },
  pull(){ tone(220,0.2,'square',0.06); tone(160,0.25,'square',0.05,0.05); },
  cd(){ tone(520,0.15,'sine',0.2); },
  go(){ tone(880,0.35,'sine',0.22); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.2,i*0.14)); }
};

/* ── 設定 ── */
const cfg = { mode:'npc', ops:['+'], level:'medium', len:5, npc:2, nameB:'藍隊', nameR:'紅隊' };
const OP_NAME = { '+':'加法', '-':'減法', '*':'乘法', '/':'除法' };
const LV_NAME = { easy:'簡單', medium:'普通', hard:'困難' };

/* ── 出題 ── */
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function makeQuestion(prevText){
  let q, guard = 0;
  do{
    const op = cfg.ops[rnd(0, cfg.ops.length-1)];
    const L = cfg.level;
    let a, b, ans;
    if(op==='+'){
      if(L==='easy'){ a=rnd(1,10); b=rnd(1,10); }
      else if(L==='medium'){ a=rnd(10,60); b=rnd(5,40); }
      else { a=rnd(100,499); b=rnd(20,499); }
      ans = a+b;
    }else if(op==='-'){
      if(L==='easy'){ a=rnd(2,18); b=rnd(1,a); }
      else if(L==='medium'){ a=rnd(20,99); b=rnd(5,a-1); }
      else { a=rnd(150,999); b=rnd(20,a-10); }
      ans = a-b;
    }else if(op==='*'){
      if(L==='easy'){ a=rnd(2,5); b=rnd(1,9); }
      else if(L==='medium'){ a=rnd(2,9); b=rnd(2,9); }
      else { a=rnd(11,49); b=rnd(2,9); }
      ans = a*b;
    }else{
      let d, qq;
      if(L==='easy'){ d=rnd(2,5); qq=rnd(1,9); }
      else if(L==='medium'){ d=rnd(2,9); qq=rnd(2,9); }
      else { d=rnd(3,9); qq=rnd(11,40); }
      a = d*qq; b = d; ans = qq;
    }
    const sym = {'+':'+','-':'−','*':'×','/':'÷'}[op];
    q = { op, text:`${a} ${sym} ${b} = ?`, ans };
  }while(q.text===prevText && ++guard<20);
  return q;
}

/* ── 遊戲狀態 ── */
const S = {
  running:false, paused:false, over:false,
  pos:0, gameTime:0, lastTs:0,
  B:null, R:null
};
function newTeam(){ return { q:null, input:'', correct:0, wrong:0, lockUntil:0 }; }

/* ── 建立數字鍵盤 ── */
document.querySelectorAll('.keypad').forEach(pad=>{
  const team = pad.dataset.team;
  ['1','2','3','4','5','6','7','8','9','C','0','OK'].forEach(k=>{
    const b = document.createElement('button');
    b.className = 'key' + (k==='C'?' clr':'') + (k==='OK'?' go':'');
    b.dataset.k = k;
    b.innerHTML = k==='C' ? '✕' : k==='OK' ? '✓' : k;
    b.addEventListener('pointerdown', e=>{
      e.preventDefault();
      if(team==='R' && cfg.mode==='npc') return;
      press(team,k);
    });
    pad.appendChild(b);
  });
});
function flashKey(team,k){
  const el = document.querySelector(`.keypad[data-team="${team}"] .key[data-k="${k}"]`);
  if(!el) return;
  el.classList.add('down'); setTimeout(()=>el.classList.remove('down'),120);
}

function press(team,k){
  if(!S.running || S.paused || S.over) return;
  const T = S[team];
  if(S.gameTime < T.lockUntil) return;
  flashKey(team,k);
  if(k==='C'){ T.input=''; SFX.key(); }
  else if(k==='OK'){ submit(team); return; }
  else { if(T.input.length<4){ T.input = (T.input==='0'?'':T.input) + k; SFX.key(); } }
  renderAnswer(team);
}

function renderAnswer(team, cls){
  const el = $('ans'+team), T = S[team];
  el.textContent = T.input==='' ? '?' : T.input;
  el.className = 'answer' + (T.input===''?' empty':'') + (cls?' '+cls:'');
}

function setQuestion(team){
  const T = S[team];
  T.q = makeQuestion(T.q && T.q.text);
  T.input = '';
  $('q'+team).textContent = T.q.text;
  renderAnswer(team);
  if(team==='R' && cfg.mode==='npc') npcPlan();
}

function submit(team){
  const T = S[team];
  if(T.input==='') return;
  if(parseInt(T.input,10) === T.q.ans){
    T.correct++;
    renderAnswer(team,'ok');
    SFX.ok();
    pull(team);
    const panel = $('team'+team);
    panel.classList.add('glow'); setTimeout(()=>panel.classList.remove('glow'),400);
    T.lockUntil = S.gameTime + 350;
    setTimeout(()=>{ if(!S.over) setQuestion(team); }, 350);
  }else{
    T.wrong++;
    renderAnswer(team,'bad');
    SFX.bad();
    const panel = $('team'+team);
    panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake');
    panel.classList.add('locked');
    T.lockUntil = S.gameTime + 800;   // 答錯暫停 0.8 秒，避免亂猜
    setTimeout(()=>{
      panel.classList.remove('locked');
      T.input=''; renderAnswer(team);
      if(team==='R' && cfg.mode==='npc' && !S.over) npcPlan();
    }, 800);
  }
  updateScores();
}

/* ── 拔河動畫 ── */
const MAX_PX = 200;
function stepPx(){ return MAX_PX / cfg.len; }
function pull(team){
  S.pos += (team==='B' ? -1 : 1);
  $('tug').style.transform = `translateX(${S.pos*stepPx()}px)`;
  SFX.pull();
  const me = $('crew'+team), other = $('crew'+(team==='B'?'R':'B'));
  me.classList.add(team==='B'?'yank-l':'yank-r');
  setTimeout(()=>me.classList.remove('yank-l','yank-r'),200);
  other.classList.remove('stumble'); void other.getBBox(); other.classList.add('stumble');
  puff(team);
  popText(team);
  if(Math.abs(S.pos) >= cfg.len) endGame(team);
}
function puff(team){
  const fx = $('fx'), ns='http://www.w3.org/2000/svg';
  const base = (team==='B' ? 230 : 670) + S.pos*stepPx();
  for(let i=0;i<4;i++){
    const c = document.createElementNS(ns,'circle');
    c.setAttribute('cx', base + rnd(-40,40)); c.setAttribute('cy', 396 + rnd(-4,4));
    c.setAttribute('r', rnd(8,14)); c.setAttribute('fill','#e7e5e4');
    c.setAttribute('class','puff'); c.style.transformBox='fill-box'; c.style.transformOrigin='center';
    fx.appendChild(c); setTimeout(()=>c.remove(),750);
  }
}
function popText(team){
  const sc = $('scene'), d = document.createElement('div');
  d.className='pop-text'; d.textContent = team==='B' ? '← 拉！' : '拉！ →';
  d.style.color = team==='B' ? 'var(--blue)' : 'var(--red)';
  d.style.left = (team==='B'?'25%':'75%'); d.style.top='18%';
  sc.appendChild(d); setTimeout(()=>d.remove(),1000);
}

function updateScores(){
  $('badgeB').textContent = $('bScB').textContent = S.B.correct;
  $('badgeR').textContent = $('bScR').textContent = S.R.correct;
}

/* ── NPC 機器人 ── */
const NPC_LV = {
  1:{ min:6.5, max:10, acc:0.72 },
  2:{ min:4.2, max:7,  acc:0.86 },
  3:{ min:2.4, max:4.2,acc:0.95 }
};
const npc = { phase:'idle', start:0, until:0, answer:'', typed:0, nextKey:0 };
function npcPlan(){
  const L = NPC_LV[cfg.npc];
  let t = L.min + Math.random()*(L.max-L.min);
  const op = S.R.q.op;
  if(op==='*'||op==='/') t *= 1.15;
  t *= ({easy:0.8, medium:1, hard:1.45})[cfg.level];
  const right = Math.random() < L.acc;
  let ans = S.R.q.ans;
  if(!right){ ans = Math.max(0, ans + (Math.random()<.5?-1:1)*rnd(1,3)); if(ans===S.R.q.ans) ans++; }
  npc.phase='think'; npc.start=S.gameTime; npc.until=S.gameTime + t*1000;
  npc.answer=String(ans); npc.typed=0;
}
function npcTick(){
  if(cfg.mode!=='npc' || npc.phase==='idle') return;
  const now = S.gameTime;
  if(now < S.R.lockUntil) return;
  if(npc.phase==='think'){
    const p = Math.min(1,(now-npc.start)/(npc.until-npc.start));
    $('npcBar').style.width = (p*100)+'%';
    if(now>=npc.until){ npc.phase='type'; npc.nextKey=now; }
  }else if(npc.phase==='type' && now>=npc.nextKey){
    if(npc.typed < npc.answer.length){
      press('R', npc.answer[npc.typed++]);
      npc.nextKey = now + 190;
    }else{
      npc.phase='idle'; $('npcBar').style.width='0%';
      press('R','OK');
    }
  }
}

/* ── 主迴圈 / 計時 ── */
function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function loop(ts){
  if(S.running && !S.paused && !S.over){
    S.gameTime += Math.min(100, ts - S.lastTs);
    $('timer').textContent = fmt(S.gameTime);
    npcTick();
  }
  S.lastTs = ts;
  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{ S.lastTs=t; loop(t); });

/* ── 開始 / 結束 ── */
function applyNames(){
  $('nameB').textContent = $('bNameB').textContent = $('stNameB').textContent = cfg.nameB;
  const rn = cfg.mode==='npc' ? '🤖 '+cfg.nameR : cfg.nameR;
  $('nameR').textContent = rn; $('bNameR').textContent = $('stNameR').textContent = cfg.nameR;
  $('teamR').classList.toggle('is-npc', cfg.mode==='npc');
  $('meta').textContent = cfg.ops.map(o=>OP_NAME[o]).join('・') + ' · ' + LV_NAME[cfg.level] + ' · ' + cfg.len + ' 格';
  // 勝利線位置
  const x1 = 450 - MAX_PX, x2 = 450 + MAX_PX;
  $('winLineB').setAttribute('x1',x1); $('winLineB').setAttribute('x2',x1);
  $('winLineR').setAttribute('x1',x2); $('winLineR').setAttribute('x2',x2);
  $('flagB').setAttribute('d',`M${x1},220 l-34,12 l34,12z`);
  $('flagR').setAttribute('d',`M${x2},220 l34,12 l-34,12z`);
}

function startGame(){
  applyNames();
  S.B = newTeam(); S.R = newTeam();
  S.pos = 0; S.gameTime = 0; S.over=false; S.paused=false; S.running=false;
  npc.phase='idle'; $('npcBar').style.width='0%';
  $('tug').style.transform = 'translateX(0px)';
  $('timer').textContent='00:00';
  ['B','R'].forEach(t=>{ $('team'+t).classList.remove('locked','shake'); $('q'+t).textContent='準備…'; S[t].input=''; renderAnswer(t); });
  updateScores();
  stopConfetti();
  ['setup','winLayer','pauseLayer'].forEach(id=>$(id).classList.add('hidden'));
  // 倒數 3-2-1
  const cd = $('countdown'), layer = $('cdLayer');
  layer.classList.remove('hidden');
  let n = 3;
  const show = ()=>{
    cd.textContent = n>0 ? n : '開始！';
    cd.style.fontSize = n>0 ? '220px' : '150px';
    cd.classList.remove('tick'); void cd.offsetWidth; cd.classList.add('tick');
    n>0 ? SFX.cd() : SFX.go();
    if(n-- > 0) setTimeout(show, 800);
    else setTimeout(()=>{
      layer.classList.add('hidden');
      S.running = true;
      setQuestion('B'); setQuestion('R');
    }, 650);
  };
  show();
}

function endGame(winner){
  S.over = true; S.running=false; npc.phase='idle'; $('npcBar').style.width='0%';
  setTimeout(()=>{
    const name = winner==='B' ? cfg.nameB : cfg.nameR;
    const npcWon = cfg.mode==='npc' && winner==='R';
    $('winEmoji').textContent = npcWon ? '🤖' : '🏆';
    $('winName').textContent = npcWon ? '電腦獲勝！再挑戰一次吧！' : `${name} 獲勝！`;
    $('winName').style.color = winner==='B' ? 'var(--blue-d)' : 'var(--red-d)';
    $('winTime').textContent = '比賽時間 ' + fmt(S.gameTime);
    ['B','R'].forEach(t=>{
      const T = S[t], tot = T.correct+T.wrong;
      const acc = tot ? Math.round(T.correct/tot*100) : 0;
      const avg = T.correct ? (S.gameTime/1000/T.correct).toFixed(1) : '-';
      $('st'+t).innerHTML = `答對 <b>${T.correct}</b> 題　答錯 <b>${T.wrong}</b> 題<br>正確率 <b>${acc}%</b>　平均 <b>${avg}</b> 秒/題`;
    });
    $('winLayer').classList.remove('hidden');
    SFX.win();
    if(!npcWon) startConfetti(winner);
  }, 700);
}

/* ── 暫停 ── */
$('pauseBtn').addEventListener('click', ()=>{
  if(!S.running || S.over) return;
  S.paused = true; $('pauseLayer').classList.remove('hidden');
});
$('resumeBtn').addEventListener('click', ()=>{ S.paused=false; $('pauseLayer').classList.add('hidden'); });
$('restartBtn').addEventListener('click', startGame);
$('resetupBtn').addEventListener('click', openSetup);
$('againBtn').addEventListener('click', startGame);
$('winSetupBtn').addEventListener('click', openSetup);

/* ── 鍵盤支援（藍隊，方便電腦測試） ── */
addEventListener('keydown', e=>{
  if(document.activeElement && document.activeElement.tagName==='INPUT') return;
  if(/^[0-9]$/.test(e.key)) press('B', e.key);
  else if(e.key==='Enter') press('B','OK');
  else if(e.key==='Backspace' || e.key==='Escape') press('B','C');
});

/* ── 設定精靈 ── */
const STEPS = ['模式','題型','難度','隊名'];
let step = 0;
function openSetup(){
  S.running=false; S.over=true; stopConfetti();
  ['winLayer','pauseLayer','cdLayer'].forEach(id=>$(id).classList.add('hidden'));
  $('setup').classList.remove('hidden');
  step = 0; renderSetup();
}
function renderSetup(){
  $('stepper').innerHTML = STEPS.map((s,i)=>
    (i?'<div class="st-line"></div>':'') +
    `<div class="st ${i===step?'on':''} ${i<step?'done':''}"><b>${i+1}</b>${s}</div>`).join('');
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('hidden', +p.dataset.page!==step));
  $('backBtn').style.visibility = step===0 ? 'hidden' : 'visible';
  $('nextBtn').innerHTML = step===STEPS.length-1 ? '▶ 開始比賽' : '下一步 →';
  $('npcLevelWrap').classList.toggle('hidden', cfg.mode!=='npc');
  // 選取狀態
  document.querySelectorAll('.opts').forEach(g=>{
    const key = g.dataset.group;
    g.querySelectorAll('.opt').forEach(o=>{
      const v = o.dataset.val;
      const sel = key==='ops' ? cfg.ops.includes(v) : String(cfg[key])===v;
      o.classList.toggle('sel', sel);
    });
  });
  $('opsWarn').textContent = '';
  if(step===3){
    $('redIcon').textContent = cfg.mode==='npc' ? '🤖' : '🔴';
    if(cfg.mode==='npc' && ($('inR').value==='紅隊' || $('inR').value==='')) $('inR').value='電腦小機';
    if(cfg.mode==='pvp' && $('inR').value==='電腦小機') $('inR').value='紅隊';
  }
}
document.querySelectorAll('.opts').forEach(g=>{
  g.addEventListener('click', e=>{
    const o = e.target.closest('.opt'); if(!o) return;
    const key = g.dataset.group, v = o.dataset.val;
    SFX.key();
    if(key==='ops'){
      if(cfg.ops.includes(v)) cfg.ops = cfg.ops.filter(x=>x!==v);
      else cfg.ops.push(v);
    }else if(key==='len' || key==='npc'){ cfg[key] = +v; }
    else cfg[key] = v;
    renderSetup();
  });
});
$('backBtn').addEventListener('click', ()=>{ if(step>0){ step--; renderSetup(); } });
$('nextBtn').addEventListener('click', ()=>{
  if(step===1 && cfg.ops.length===0){ $('opsWarn').textContent='請至少選擇一種題型喔！'; SFX.bad(); return; }
  if(step < STEPS.length-1){ step++; renderSetup(); return; }
  cfg.nameB = $('inB').value.trim() || '藍隊';
  cfg.nameR = $('inR').value.trim() || (cfg.mode==='npc' ? '電腦小機' : '紅隊');
  startGame();
});

/* ── 彩帶 ── */
let confAnim = null;
function startConfetti(team){
  const cv = $('confetti'), ctx = cv.getContext('2d');
  const cols = team==='B' ? ['#3b82f6','#93c5fd','#fbbf24','#f472b6','#34d399'] : ['#ef4444','#fca5a5','#fbbf24','#f472b6','#34d399'];
  const P = Array.from({length:160},()=>({
    x:Math.random()*1600, y:-Math.random()*900, w:rnd(8,14), h:rnd(12,20),
    vy:2+Math.random()*3.5, vx:-1.5+Math.random()*3, r:Math.random()*6, vr:-.15+Math.random()*.3,
    c:cols[rnd(0,cols.length-1)]
  }));
  const draw = ()=>{
    ctx.clearRect(0,0,1600,900);
    P.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx; p.r+=p.vr;
      if(p.y>920){ p.y=-20; p.x=Math.random()*1600; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    confAnim = requestAnimationFrame(draw);
  };
  draw();
}
function stopConfetti(){
  if(confAnim) cancelAnimationFrame(confAnim); confAnim=null;
  $('confetti').getContext('2d').clearRect(0,0,1600,900);
}

/* 初始化 */
S.B = newTeam(); S.R = newTeam();
renderSetup();
</script>
