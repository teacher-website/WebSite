<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極速飆車小遊戲 🏎️💨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a252f; /* 更深的背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Microsoft JhengHei', sans-serif;
            color: #ecf0f1;
        }

        h1 {
            color: #ff4757;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 5px;
            animation: shake 0.5s infinite alternate; /* 讓標題有點震動感 */
        }

        @keyframes shake {
            0% { transform: skewX(-3deg); }
            100% { transform: skewX(3deg); }
        }

        p {
            margin-top: 0;
            font-size: 16px;
            color: #ff7f50;
            font-weight: bold;
        }

        .game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 10px;
            overflow: hidden;
            border: 5px solid #ff4757;
        }

        canvas {
            display: block;
            background-color: #57606f; /* 更深的柏油路 */
        }

        #restartBtn {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #ff4757;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #restartBtn:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <h1>🏎️ 極速閃避賽車 🏎️</h1>
    <p>⚡ 警告：車速極快，請集中大腦注意力！ ⚡</p>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <button id="restartBtn" onclick="resetGame()">不服氣？再來一次！</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const restartBtn = document.getElementById("restartBtn");

        let isGameOver = false;
        let score = 0;
        let speedMultiplier = 1;
        let frames = 0;

        // 玩家車輛設定 (提升速度到 10，操作更靈敏)
        const player = {
            width: 40,
            height: 70,
            x: canvas.width / 2 - 20,
            y: canvas.height - 100,
            speed: 10, 
            dx: 0,
            color: "#ff4757" 
        };

        let enemies = [];
        let lines = [];
        for (let i = 0; i < canvas.height; i += 60) {
            lines.push(i);
        }

        // 鍵盤監聽
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") {
                player.dx = -player.speed;
            } else if (e.key === "ArrowRight" || e.key === "d") {
                player.dx = player.speed;
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "a" || e.key === "d") {
                player.dx = 0;
            }
        });

        function drawCar(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(x + 5, y + 15, width - 10, 15);
            ctx.fillRect(x + 5, y + height - 20, width - 10, 10);

            ctx.fillStyle = "#2f3542";
            ctx.fillRect(x - 3, y + 10, 3, 15);
            ctx.fillRect(x + width, y + 10, 3, 15);
            ctx.fillRect(x - 3, y + height - 25, 3, 15);
            ctx.fillRect(x + width, y + height - 25, 3, 15);
        }

        function drawRoad() {
            ctx.fillStyle = "#ffa502"; // 改用亮橘色標線更有賽車感
            for (let i = 0; i < lines.length; i++) {
                ctx.fillRect(canvas.width / 2 - 5, lines[i], 10, 30);
                if (!isGameOver) {
                    lines[i] += 12 * speedMultiplier; // 背景滾動速度大幅拉高 (5 -> 12)
                }
                if (lines[i] > canvas.height) {
                    lines[i] = -30;
                }
            }
        }

        function spawnEnemy() {
            let enemyWidth = 40;
            let enemyHeight = 70;
            let xPos = Math.random() * (canvas.width - enemyWidth);
            let colors = ["#1e90ff", "#eccc68", "#2ed573", "#ffa502"];
            let randomColor = colors[Math.floor(Math.random() * colors.length)];

            enemies.push({
                x: xPos,
                y: -enemyHeight,
                width: enemyWidth,
                height: enemyHeight,
                // 敵車基礎速度大幅提升 (原本是 3~5，現在是 7~11)
                speed: (Math.random() * 4 + 7) * speedMultiplier, 
                color: randomColor
            });
        }

        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function update() {
            if (isGameOver) return;

            player.x += player.dx;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            for (let i = 0; i < enemies.length; i++) {
                enemies[i].y += enemies[i].speed;

                if (checkCollision(player, enemies[i])) {
                    isGameOver = true;
                    restartBtn.style.display = "block";
                }

                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    i--;
                    score++;
                    
                    // 每 10 分的加速幅度變大 (0.1 -> 0.2)
                    if (score % 10 === 0) {
                        speedMultiplier += 0.2; 
                    }
                }
            }

            frames++;
            // 由於車速變快，生成新車的頻率也稍微密集一點
            let spawnRate = Math.max(15, 50 - Math.floor(speedMultiplier * 10));
            if (frames % spawnRate === 0) {
                spawnEnemy();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#57606f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawRoad();

            drawCar(player.x, player.y, player.width, player.height, player.color);

            for (let i = 0; i < enemies.length; i++) {
                drawCar(enemies[i].x, enemies[i].y, enemies[i].width, enemies[i].height, enemies[i].color);
            }

            // 右上角速度儀表板視覺感
            ctx.fillStyle = "#fff";
            ctx.font = "bold 22px 'Microsoft JhengHei', sans-serif";
            ctx.fillText("SCORE: " + score, 15, 35);
            ctx.fillStyle = "#ff7f50";
            ctx.fillText("SPEED: " + Math.round(120 * speedMultiplier) + " km/h", 15, 65);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff4757";
                ctx.font = "bold 45px 'Microsoft JhengHei', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("💥 翻車啦！ 💥", canvas.width / 2, canvas.height / 2 - 50);
                ctx.fillStyle = "#fff";
                ctx.font = "24px 'Microsoft JhengHei', sans-serif";
                ctx.fillText("最終得分: " + score, canvas.width / 2, canvas.height / 2 + 10);
                ctx.textAlign = "left"; 
            }
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            speedMultiplier = 1;
            frames = 0;
            enemies = [];
            player.x = canvas.width / 2 - 20;
            restartBtn.style.display = "none";
            gameLoop();
        }

        gameLoop();
    </script>
</body>
</html>
