<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>森林動物搬家記・溪流上游 教材入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{color-scheme:light dark;--cream:#F4FBF2;--paper:#fff;--ink:#3E4A3C;--ink2:#7C8A78;--line:#D8ECD4;--green:#2E8B74;--blue:#3F7FC1;--sun:#F0B86E;
  --f:'M PLUS Rounded 1c','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#1E241D;--paper:#2A322A;--ink:#EAF3E7;--ink2:#B5C4B1;--line:#40503E}}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f);line-height:1.8;
  background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:26px 26px;min-height:100vh;display:grid;place-items:center;padding:32px 16px}
.box{max-width:840px;width:100%;text-align:center}
.badge{display:inline-block;background:var(--sun);color:#4A3A1A;font-weight:800;font-size:.82rem;padding:5px 16px;border-radius:50px}
h1{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:800;margin:14px 0 6px}
p.sub{color:var(--ink2);margin:0 auto 26px;max-width:36em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:24px 20px;transition:transform .2s}
a.card:hover{transform:translateY(-4px) scale(1.02)}
a.card .ico{font-size:2.4rem;line-height:1}
a.card b{display:block;font-size:1.15rem;font-weight:800;margin:8px 0 4px}
a.card span{font-size:.88rem;color:var(--ink2)}
a.s{border-color:var(--green)}a.d{border-color:var(--blue)}a.f{border-color:var(--sun)}
footer{margin-top:26px;font-size:.82rem;color:var(--ink2)}
</style>
</head>
<body>
<div class="box">
  <span class="badge">貓咪盃・國小動畫 AI 互動組　情境 1</span>
  <h1>🐸 森林動物搬家記：溪流上游，最後一窪水</h1>
  <p class="sub">用青蛙的視角說故事，觀看者用手部動作參與復育：撈起垃圾、種回溪邊的樹、張開手掌擋住偷倒的廢水。
    三種生物、三種環境問題、三種結局。</p>
  <div class="cards">
    <a class="card s" href="student/index.html"><div class="ico">📘</div><b>製作教學</b><span>10 章逐步引導、積木圖、四個互動實驗室、自我檢核</span></a>
    <a class="card d" href="student/doc.html"><div class="ico">📄</div><b>程式說明文件</b><span>已填好範例內容，可修改、自動儲存、列印成 PDF</span></a>
    <a class="card f" href="student/森林動物搬家記_溪流上游.sb3" download><div class="ico">📦</div><b>範例 .sb3</b><span>用 stretch3.github.io 開啟（需 Handpose2Scratch）</span></a>
  </div>
  <footer>角色、背景、音效皆為自製　·　Handpose2Scratch by Junya Ishihara (champierre)</footer>
</div>
</body>
</html>
