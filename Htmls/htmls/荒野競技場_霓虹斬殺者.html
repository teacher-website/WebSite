<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荒野競技場：霓虹斬殺者</title>
    <style>
        /* 基礎設置與暗黑霓虹風格 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0b0e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
        }

        /* UI 介面 */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #top-bar {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #score-display {
            font-size: 28px;
            font-weight: bold;
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
        }

        #health-bar {
            width: 200px;
            height: 20px;
            background: #222;
            border: 2px solid #ff2a6d;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px #ff2a6d;
        }

        #health-fill {
            width: 100%;
            height: 100%;
            background: #ff2a6d;
            transition: width 0.15s ease;
        }

        /* 開始/結束畫面 */
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(11, 11, 14, 0.95);
            padding: 40px;
            border: 2px solid #00ff66;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.4);
            pointer-events: auto;
        }

        #menu h1 {
            margin: 0 0 20px 0;
            color: #00ff66;
            font-size: 38px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ff66;
        }

        #menu p {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        #start-btn {
            background: transparent;
            color: #00ff66;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 45px;
            border: 2px solid #00ff66;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        #start-btn:hover {
            background: #00ff66;
            color: #0b0b0e;
            box-shadow: 0 0 25px #00ff66;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-container">
        <div id="top-bar">
            <div id="score-display">斬殺數: <span id="score">0</span></div>
            <div id="health-bar"><div id="health-fill"></div></div>
        </div>
    </div>

    <div id="menu">
        <h1 id="menu-title">霓虹斬殺者</h1>
        <p id="menu-desc">
            <b>W, A, S, D</b> 控制移動<br>
            <b>滑鼠游標</b> 瞄準方向<br>
            <b>滑鼠左鍵</b> <span style="color: #ffff00; font-weight: bold;">近戰光劍揮砍！</span><br>
            沖進敵陣，把他們全部切碎！
        </p>
        <h2 id="final-score" style="display: none; color: #ff2a6d; text-shadow: 0 0 10px #ff2a6d; margin-bottom: 20px;"></h2>
        <button id="start-btn">拔劍開戰</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const healthFill = document.getElementById('health-fill');
        const menu = document.getElementById('menu');
        const startBtn = document.getElementById('start-btn');
        const finalScoreEl = document.getElementById('final-score');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 遊戲核心變數
        let animationId;
        let score = 0;
        let health = 100;
        let gameActive = false;
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        
        let attackCooldown = 0;
        let shakeTimer = 0; // 畫面震動計時器

        let player;
        let enemies = [];
        let particles = [];
        let slashes = []; // 儲存揮砍特效

        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = false;
        });

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // 滑鼠點擊：揮砍攻擊
        window.addEventListener('mousedown', (e) => {
            if(!gameActive || attackCooldown > 0) return;

            const targetAngle = Math.atan2(e.clientY - player.y, e.clientX - player.x);
            
            // 觸發揮砍視覺特效
            slashes.push(new Slash(player.x, player.y, targetAngle));
            attackCooldown = 8; // 超短冷卻，極速連砍
            shakeTimer = 5;    // 揮刀輕微震動

            // 近戰碰撞檢測 (扇形範圍攻擊)
            const attackRange = 95; // 劍氣斬殺距離
            const attackCone = 1.3; // 攻擊扇形角度 (約 75 度)

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);

                // 檢查是否在距離內
                if (dist <= attackRange + enemy.radius) {
                    const enemyAngle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
                    
                    // 計算角度差
                    let diff = enemyAngle - targetAngle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;

                    // 如果敵人在扇形斬殺範圍內
                    if (Math.abs(diff) <= attackCone) {
                        createParticles(enemy.x, enemy.y, enemy.color, 15);
                        score += 1;
                        scoreElement.innerHTML = score;
                        enemies.splice(i, 1);
                        shakeTimer = 12; // 砍中敵人強力震動
                    }
                }
            }
        });

        // --- 類別設計 ---

        class Player {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.speed = 6;
            }
            draw() {
                const angle = Math.atan2(mouseY - this.y, mouseX - this.x);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(angle);

                // 畫雷射光劍的劍柄與微弱待機光刃
                ctx.fillStyle = '#555';
                ctx.fillRect(this.radius - 5, -4, 10, 8);
                
                ctx.beginPath();
                ctx.moveTo(this.radius + 5, 0);
                ctx.lineTo(this.radius + 35, 0);
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
                ctx.stroke();

                // 畫玩家本體
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.closePath();

                ctx.restore();
            }
            update() {
                if(keys.w && this.y - this.radius > 0) this.y -= this.speed;
                if(keys.s && this.y + this.radius < canvas.height) this.y += this.speed;
                if(keys.a && this.x - this.radius > 0) this.x -= this.speed;
                if(keys.d && this.x + this.radius < canvas.width) this.x += this.speed;
                this.draw();
            }
        }

        // 揮砍劍氣特效
        class Slash {
            constructor(x, y, angle) {
                this.angle = angle;
                this.maxLife = 6; // 特效持續幀數
                this.life = this.maxLife;
                this.radius = 95;
            }
            draw() {
                ctx.save();
                ctx.translate(player.x, player.y); // 跟隨玩家位置
                ctx.rotate(this.angle);

                let progress = (this.maxLife - this.life) / this.maxLife;
                // 從左往右橫掃的角度
                let startArc = -1.4 + (progress * 2.8);

                // 畫弧形劍氣
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, startArc - 0.4, startArc + 0.4);
                ctx.lineWidth = 8;
                ctx.strokeStyle = '#ffff00';
                ctx.shadowColor = '#ffff00';
                ctx.shadowBlur = 25;
                ctx.stroke();

                // 畫扇形動態高亮半透明填滿
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, this.radius, -1.4, startArc);
                ctx.fillStyle = 'rgba(255, 255, 0, 0.08)';
                ctx.fill();

                ctx.restore();
            }
            update() {
                this.life--;
                this.draw();
            }
        }

        class Enemy {
            constructor(x, y, radius, color, speed) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.speed = speed;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.closePath();
            }
            update() {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
                this.draw();
            }
        }

        class Particle {
            constructor(x, y, radius, color, velocity) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
                this.friction = 0.96;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.025;
                this.draw();
            }
        }

        // --- 核心邏輯 ---

        function spawnEnemies() {
            if(!gameActive) return;
            
            // 隨機尺寸，大怪血厚(此處設定皆為一刀流割草，但大怪速度慢體積大)
            const radius = Math.random() * (30 - 12) + 12;
            let x, y;

            if(Math.random() < 0.5) {
                x = Math.random() < 0.5 ? 0 - radius : canvas.width + radius;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
            }

            // 越小的敵人跑越快
            const speed = (30 / radius) + (score * 0.01); 
            enemies.push(new Enemy(x, y, radius, '#ff2a6d', speed));

            // 隨著分數變高，出怪速度瘋狂加快
            let spawnTime = Math.max(200, 1000 - (score * 8));
            setTimeout(spawnEnemies, spawnTime);
        }

        function createParticles(x, y, color, count) {
            for(let i = 0; i < count; i++) {
                const velocity = {
                    x: (Math.random() - 0.5) * (Math.random() * 10),
                    y: (Math.random() - 0.5) * (Math.random() * 10)
                };
                particles.push(new Particle(x, y, Math.random() * 4 + 1, color, velocity));
            }
        }

        function init() {
            player = new Player(canvas.width / 2, canvas.height / 2, 22, '#00e5ff');
            enemies = [];
            particles = [];
            slashes = [];
            score = 0;
            health = 100;
            attackCooldown = 0;
            shakeTimer = 0;
            scoreElement.innerHTML = score;
            healthFill.style.width = '100%';
        }

        function animate() {
            animationId = requestAnimationFrame(animate);
            
            // 科幻殘影底色
            ctx.fillStyle = 'rgba(11, 11, 14, 0.35)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // --- 畫面震動特效區塊 ---
            ctx.save();
            if (shakeTimer > 0) {
                let dx = (Math.random() - 0.5) * 12;
                let dy = (Math.random() - 0.5) * 12;
                ctx.translate(dx, dy);
                shakeTimer--;
            }

            // 減少攻擊冷卻
            if (attackCooldown > 0) attackCooldown--;

            // 更新玩家
            player.update();

            // 更新揮砍特效
            slashes.forEach((slash, index) => {
                if (slash.life <= 0) {
                    slashes.splice(index, 1);
                } else {
                    slash.update();
                }
            });

            // 更新粒子
            particles.forEach((particle, index) => {
                if(particle.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    particle.update();
                }
            });

            // 更新敵人與傷害檢測
            enemies.forEach((enemy, enemyIndex) => {
                enemy.update();

                // 敵人撞擊玩家 (玩家扣血)
                const distPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if(distPlayer - enemy.radius - player.radius < 1) {
                    enemies.splice(enemyIndex, 1);
                    health -= 15;
                    healthFill.style.width = `${Math.max(0, health)}%`;
                    createParticles(player.x, player.y, player.color, 10);
                    shakeTimer = 15; // 被打到畫面大震動

                    if(health <= 0) {
                        cancelAnimationFrame(animationId);
                        gameOver();
                    }
                }
            });

            ctx.restore(); // 結束畫面震動影響
        }

        function gameOver() {
            gameActive = false;
            menu.style.display = 'block';
            menuTitle.innerText = "戰死沙場";
            menuTitle.style.color = "#ff2a6d";
            menuTitle.style.textShadow = "0 0 10px #ff2a6d";
            menuDesc.style.display = "none";
            finalScoreEl.style.display = "block";
            finalScoreEl.innerText = `最終斬殺數: ${score}`;
            startBtn.innerText = "重鑄光劍 再戰一次";
        }

        startBtn.addEventListener('click', () => {
            init();
            gameActive = true;
            menu.style.display = 'none';
            animate();
            spawnEnemies();
        });

    </script>
</body>
</html>
