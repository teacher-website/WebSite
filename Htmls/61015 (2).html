<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵喵羽球大對決 🏸✨</title>
    <style>
        /* 全域可愛風格 */
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f3e5f5; /* 輕柔粉紫底色 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 遊戲主容器 */
        #game-container {
            position: relative;
            width: 700px;
            height: 450px;
            background: linear-gradient(to bottom, #e0f7fa 70%, #fff9c4 100%); /* 藍天與沙灘感 */
            border: 10px solid #ffb74d; /* 溫暖橘黃厚邊框 */
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 183, 77, 0.4);
            overflow: hidden;
        }

        /* 頂部計分板 */
        #scoreboard {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 24px;
            font-weight: bold;
            color: #4a148c;
            z-index: 10;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 球場地面 */
        #court-floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background-color: #81c784; /* 草地綠 */
            border-top: 5px solid #fff;
        }

        /* 羽毛球網 */
        #net {
            position: absolute;
            bottom: 40px;
            left: 347px;
            width: 6px;
            height: 90px;
            background-color: #fff;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }
        #net::after {
            content: "🎀";
            position: absolute;
            top: -12px;
            left: -8px;
            font-size: 16px;
        }

        /* 角色與球的共通樣式 */
        .game-element {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.05s linear;
        }

        /* 玩家 (貓咪) */
        #player {
            width: 60px;
            height: 60px;
            font-size: 50px;
            bottom: 40px;
            left: 100px;
        }

        /* 電腦 (小熊) */
        #computer {
            width: 60px;
            height: 60px;
            font-size: 50px;
            bottom: 40px;
            left: 540px;
        }

        /* 羽毛球 */
        #shuttlecock {
            width: 35px;
            height: 35px;
            font-size: 30px;
            left: 332px;
            top: 100px;
        }

        /* 說明與開頭蓋板 */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 243, 224, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .hidden { display: none !important; }

        h1 { color: #ff7043; font-size: 32px; margin-bottom: 10px; text-shadow: 1px 1px #fff; }
        p { color: #5c5c5c; font-size: 16px; line-height: 1.6; text-align: center; margin-bottom: 25px; }

        .btn {
            padding: 12px 35px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff7043, #ffa726);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px #e65100;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px #e65100;
        }

        /* 手機/滑鼠點擊控制區 */
        #mobile-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            width: 700px;
        }
        .control-btn {
            padding: 10px 25px;
            font-size: 18px;
            background-color: #fff;
            border: 3px solid #b3e5fc;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            color: #0288d1;
            box-shadow: 0 4px #b2ebf2;
        }
        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #b2ebf2;
        }
    </style>
</head>
<body>

    <div>
        <div id="game-container">
            <div id="scoreboard">
                <div class="score-box">玩家 🐱: <span id="player-score">0</span></div>
                <div class="score-box">電腦 🐻: <span id="computer-score">0</span></div>
            </div>

            <div id="net"></div>
            <div id="court-floor"></div>

            <div id="player" class="game-element">🐱</div>
            <div id="computer" class="game-element">🐻</div>
            <div id="shuttlecock" class="game-element">🏸</div>

            <div id="start-screen" class="overlay">
                <h1>🏸 喵喵羽球大對決 ✨</h1>
                <p>運用精湛的跑位，把羽毛球拍過網吧！<br>
                <b>【操作說明】</b>：鍵盤 <b>◀ ▶ 方向鍵</b> 移動，<b>▲ 方向鍵</b> 跳躍。<br>
                接近羽毛球時，可愛的小貓會自動幫你揮拍喔！</p>
                <button class="btn" onclick="startGame()">開球囉！</button>
            </div>

            <div id="round-screen" class="overlay hidden">
                <h1 id="round-result">玩家得分！🎉</h1>
                <p>準備好進行下一回合了嗎？</p>
                <button class="btn" onclick="nextRound()">繼續對決 🏸</button>
            </div>
        </div>

        <div id="mobile-controls">
            <button class="control-btn" mousedown="keys.ArrowLeft=true" ontouchstart="keys.ArrowLeft=true" onmouseup="keys.ArrowLeft=false" ontouchend="keys.ArrowLeft=false">◀ 往左</button>
            <button class="control-btn" onclick="triggerJump()">▲ 跳躍</button>
            <button class="control-btn" mousedown="keys.ArrowRight=true" ontouchstart="keys.ArrowRight=true" onmouseup="keys.ArrowRight=false" ontouchend="keys.ArrowRight=false">往右 ▶</button>
        </div>
    </div>

        const pScoreDisplay = document.getElementById('player-score');

        const startScreen = document.getElementById('start-screen');

        const roundResult = document.getElementById('round-result');

        const containerWidth = 700;
        const containerHeight = 450;

        const netX = 350;
        const netHeight = 130; // 40(floor) + 90(net)

        let pScore = 0;
        let cScore = 0;
        let gameActive = false;
        let lastServer = 'player'; // 誰輸誰發球
