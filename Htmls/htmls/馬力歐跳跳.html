<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑪利歐跳跳 🍄</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f8ff; /* 可愛的天藍色背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;
            flex-direction: column;
        }

        #game-container {
            width: 600px;
            height: 250px;
            background: linear-gradient(to bottom, #87CEEB 60%, #8FBC8F 40%);
            border: 4px solid #fff;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        /* 遊戲角色 */
        #mario {
            width: 50px;
            height: 50px;
            position: absolute;
            bottom: 100px; /* 站在草地上 */
            left: 50px;
            font-size: 40px;
            line-height: 50px;
            text-align: center;
            z-index: 2;
        }

        /* 障礙物 (蘑菇/烏龜) */
        #obstacle {
            width: 40px;
            height: 40px;
            position: absolute;
            bottom: 100px; /* 站在草地上 */
            right: -50px;
            font-size: 35px;
            line-height: 40px;
            text-align: center;
            z-index: 2;
        }

        /* 雲朵裝飾 */
        .cloud {
            position: absolute;
            font-size: 40px;
            color: white;
            opacity: 0.8;
            top: 20px;
            animation: cloudMove 15s infinite linear;
        }

        .cloud:nth-child(2) {
            top: 50px;
            font-size: 30px;
            animation: cloudMove 25s infinite linear reverse;
        }

        /* 動畫類別 */
        .jump-anim {
            animation: jump 0.6s linear;
        }

        .obstacle-anim {
            animation: moveLeft 1.5s infinite linear;
        }

        .blink {
            animation: blinking 0.2s infinite;
        }

        @keyframes jump {
            0% { bottom: 100px; }
            40% { bottom: 220px; }
            50% { bottom: 230px; }
            60% { bottom: 220px; }
            100% { bottom: 100px; }
        }

        @keyframes moveLeft {
            0% { right: -50px; }
            100% { right: 650px; }
        }

        @keyframes cloudMove {
            0% { left: -100px; }
            100% { left: 650px; }
        }

        @keyframes blinking {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 介面 UI */
        #ui-board {
            position: absolute;
            top: 10px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            color: #333;
            font-weight: bold;
            z-index: 10;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #game-over-screen h2 {
            color: #FF6347;
            font-size: 36px;
            margin: 10px 0;
            text-shadow: 2px 2px #FFF;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            background-color: #FFD700;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        .instructions {
            margin-top: 20px;
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="game-container" onclick="jump()">
        <div class="cloud">☁️</div>
        <div class="cloud" style="left: 300px;">☁️</div>

        <div id="ui-board">
            <div>生命: <span id="lives">❤️❤️</span></div>
            <div>分數: <span id="score">0</span></div>
        </div>

        <div id="mario">👨🏻‍🔧</div>
        <div id="obstacle">🍄</div>

        <div id="game-over-screen">
            <h2>Game Over! 😭</h2>
            <p>最終分數: <span id="final-score">0</span></p>
            <button onclick="restartGame()">再玩一次 🎮</button>
        </div>
    </div>

    <div class="instructions">
        👉 玩法：點擊遊戲畫面，或是按下「空白鍵 (Space)」來跳躍避開蘑菇！
    </div>

    <script>
        const mario = document.getElementById("mario");
        const obstacle = document.getElementById("obstacle");
        const scoreDisplay = document.getElementById("score");
        const livesDisplay = document.getElementById("lives");
        const gameOverScreen = document.getElementById("game-over-screen");
        const finalScoreDisplay = document.getElementById("final-score");
        const gameContainer = document.getElementById("game-container");

        let score = 0;
        let lives = 2;
        let isInvincible = false; // 受傷後的無敵狀態
        let gameLoop;
        let scoreLoop;

        // 初始化遊戲
        function initGame() {
            score = 0;
            lives = 2;
            isInvincible = false;
            scoreDisplay.innerText = score;
            updateLivesUI();
            
            gameOverScreen.style.display = "none";
            obstacle.style.right = "-50px"; 
            obstacle.classList.add("obstacle-anim");
            
            // 開始計分
            scoreLoop = setInterval(() => {
                score++;
                scoreDisplay.innerText = score;
            }, 500);

            // 開始碰撞偵測
            gameLoop = setInterval(checkCollision, 20);
        }

        // 跳躍功能
        function jump() {
            // 如果遊戲結束或正在跳躍中，則不執行
            if (lives <= 0) return; 
            if (mario.classList.contains("jump-anim")) return;

            mario.classList.add("jump-anim");
            setTimeout(() => {
                mario.classList.remove("jump-anim");
            }, 600); // 對應 CSS 動畫時間
        }

        // 監聽空白鍵
        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                jump();
            }
        });

        // 碰撞偵測邏輯
        function checkCollision() {
            // 取得瑪利歐的底部位置和障礙物的左側位置
            let marioBottom = parseInt(window.getComputedStyle(mario).getPropertyValue("bottom"));
            let obstacleRight = parseInt(window.getComputedStyle(obstacle).getPropertyValue("right"));
            
            // 將 right 轉換為 left 以方便計算 (容器寬 600 - 障礙物寬 40 - right)
            let obstacleLeft = 600 - 40 - obstacleRight; 

            // 瑪利歐的 left 固定在 50，寬度 50，所以佔據區間是 x: 50~100
            // 障礙物佔據區間是 x: obstacleLeft ~ obstacleLeft+40
            // 判斷X軸重疊且Y軸過低 (沒跳過去)
            if (obstacleLeft > 10 && obstacleLeft < 100 && marioBottom <= 140 && !isInvincible) {
                loseLife();
            }
        }

        // 扣除生命
        function loseLife() {
            lives--;
            updateLivesUI();
            
            if (lives <= 0) {
                gameOver();
            } else {
                // 觸發無敵時間 (閃爍)
                isInvincible = true;
                mario.classList.add("blink");
                
                setTimeout(() => {
                    isInvincible = false;
                    mario.classList.remove("blink");
                }, 1500); // 無敵 1.5 秒
            }
        }

        // 更新愛心 UI
        function updateLivesUI() {
            if (lives === 2) livesDisplay.innerText = "❤️❤️";
            else if (lives === 1) livesDisplay.innerText = "❤️🤍";
            else livesDisplay.innerText = "🤍🤍";
        }

        // 遊戲結束
        function gameOver() {
            clearInterval(gameLoop);
            clearInterval(scoreLoop);
            obstacle.classList.remove("obstacle-anim");
            
            finalScoreDisplay.innerText = score;
            gameOverScreen.style.display = "flex";
        }

        // 重新開始
        function restartGame() {
            initGame();
        }

        // 啟動遊戲
        window.onload = initGame;

    </script>
</body>
</html>
