<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課堂搶答王・題庫編輯器</title>
<style>
:root{--bg:#F4F1FA;--bar:#46178F;--bar2:#2E0F63;--card:#fff;--ink:#2B2B3A;--ink2:#6B6B80;--line:#E4DEF2;--soft:#F8F6FC;--acc:#7B3FE4;--ok:#26890C;--no:#E21B3C;--warn:#B26A00;
  --f:'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17172A;--card:#23233A;--ink:#EEEEF6;--ink2:#A9A9C2;--line:#3A3A58;--soft:#1D1D32;--warn:#F0B040}}
:root[data-theme="dark"]{--bg:#17172A;--card:#23233A;--ink:#EEEEF6;--ink2:#A9A9C2;--line:#3A3A58;--soft:#1D1D32;--warn:#F0B040}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:linear-gradient(90deg,var(--bar),var(--bar2));color:#fff}
header .logo{font-weight:900;font-size:1.1rem;white-space:nowrap}
#title{flex:1;min-width:160px;max-width:420px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:1.05rem}

#fileInfo{font-size:.85rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.hb{border:none;border-radius:10px;padding:7px 12px;font-weight:800;font-size:.92rem;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap}
.hb:hover{background:rgba(255,255,255,.28)}.hb.go{background:var(--ok)}.hb[disabled]{opacity:.4;cursor:default}
.sp{flex:1}
.menu{position:relative}
.menu .dd{position:absolute;right:0;top:110%;background:var(--card);color:var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;min-width:250px;z-index:20}
.menu .dd button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 12px;border-radius:8px;font-weight:700}
.menu .dd button small{display:block;font-weight:400;color:var(--ink2);font-size:.78rem}
.menu .dd button:hover{background:var(--soft)}
main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;padding:14px;max-width:1500px;margin:0 auto}

.card{background:var(--card);border-radius:16px;box-shadow:0 4px 16px rgba(46,15,99,.08);border:1px solid var(--line)}
/* 題目清單 */
#side{display:flex;flex-direction:column;padding:10px;position:sticky;top:64px;max-height:calc(100vh - 80px)}

#side h3 span{color:var(--ink2);font-weight:600;font-size:.85rem}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.qi{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:7px 8px;background:var(--card);cursor:pointer;user-select:none}
.qi:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.qi.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.qi.drag{opacity:.35}.qi.over{box-shadow:0 -3px 0 var(--acc)}

.btn{border:none;border-radius:10px;padding:8px 12px;font-weight:800;background:var(--line);color:var(--ink)}

select.btn{padding:7px 8px}

.imgbox .hint{color:var(--ink2);font-size:.9rem}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ok);color:#fff;border-radius:999px;padding:6px 8px 6px 14px;font-weight:800}
.chip button{border:none;background:rgba(0,0,0,.2);color:#fff;border-radius:50%;width:24px;height:24px;font-weight:900}
.fld{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}

.msgs{display:flex;flex-direction:column;gap:4px;font-size:.9rem}

/* 預覽 */
.pv{background:linear-gradient(160deg,#46178F,#2E0F63);border-radius:14px;padding:12px;color:#fff}
.pv .pq{background:#fff;color:#2B2B3A;border-radius:10px;padding:10px;text-align:center;font-weight:900;font-size:1.05rem;word-break:break-word}
.pv .pimg{display:block;max-height:90px;max-width:60%;margin:8px auto 0;border-radius:8px}
.pv .pg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.pv .po{border-radius:8px;padding:8px;font-weight:800;font-size:.85rem;display:flex;gap:6px;align-items:center;word-break:break-word}
.pv .po.dim{opacity:.35}
.pv .ph{text-align:center;font-size:.8rem;opacity:.8;margin-top:6px}
.empty{padding:40px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;font-size:1.3rem;color:var(--ink);margin-bottom:8px}
/* 視窗 */
dialog{border:none;border-radius:18px;padding:0;width:min(820px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,10,40,.55)}
.dlg{padding:16px 18px;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow:auto}
.dlg h3{margin:0;font-size:1.1rem}
.banks{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.banks button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;display:flex;gap:10px;align-items:center}
.banks button:hover{border-color:var(--acc)}
.banks small{color:var(--ink2)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:52vh;overflow:auto}
.gal button{border:2px solid var(--line);border-radius:10px;background:var(--soft);padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:.75rem;word-break:break-all}
.gal button:hover{border-color:var(--acc)}
.gal img{width:100%;height:90px;object-fit:contain}
#srcText{width:100%;height:56vh;font-family:Consolas,'Microsoft JhengHei',monospace;font-size:.95rem;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card);resize:vertical}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw}
.drop{position:fixed;inset:0;background:rgba(70,23,143,.55);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:900;z-index:40;pointer-events:none}
kbd{background:var(--line);border-radius:5px;padding:0 5px;font-size:.8em}
</style>

<body>
<header>
  <span class="logo">🧩 題庫編輯器</span>

  <button class="hb" id="bSave" title="Ctrl+S">💾 儲存</button>

    <div class="dd" id="expMenu" hidden>
      <button data-x="kahoot">Kahoot 試算表（.xlsx）<small>上傳到 Kahoot「匯入試算表」。只帶單選／複選／是非題</small></button>

    </div></span>
  <button class="hb" id="bSrc" title="直接看／改文字格式">📝 文字模式</button>

<dialog id="dOpen"><div class="dlg">
  <h3>📂 開啟／匯入題庫</h3>
  <div class="row"><button class="btn p" id="oPick">從電腦選擇檔案…</button><span class="cnt" style="text-align:left">支援 .txt（本程式格式）、.xlsx（Kahoot 範本或 Excel 表格）、.csv、.zip（題庫＋圖片）。也可以把檔案直接拖進編輯器。</span></div>

<input type="file" id="fOpen" accept=".txt,.csv,.xlsx,.zip" hidden>
<input type="file" id="fImg" accept="image/*" hidden>

<script>/* 課堂搶答王・題庫函式庫（題庫編輯器用；離線網頁版也內嵌同一份）
   parse_bank()／bank_to_text()／parse_rows() 與 server_core.py 的 Python 版本一一對應，
   tools/test_editor.py 會用同樣的輸入比對兩邊的結果。 */
var BankLib=(function(){
'use strict';
var QTYPES={single:'單選',multi:'複選',tf:'是非',text:'填答',order:'排序',poll:'投票'};
var TYPE_TAGS={'單選':'single','選擇':'single','複選':'multi','多選':'multi','是非':'tf','對錯':'tf','填答':'text','簡答':'text','填空':'text','數字':'text',
  '排序':'order','順序':'order','投票':'poll','意見':'poll','調查':'poll'};
var TF_TRUE=['對','o','○','〇','✓','✔','是','true','t','yes','y','正確','v'];
var TF_FALSE=['錯','x','×','✗','✘','╳','否','false','f','no','n','錯誤'];
var KEY_RE=/^(時間|秒數|秒|答案|正解|解說|說明|解析|圖片|圖)\s*[:：]?\s*([\s\S]*)$/;
var TAG_RE=/^\s*[\[【［]([^\]】］]{1,60})[\]】］]\s*/;
var KAHOOT_TIMES=[5,10,20,30,60,90,120,240];

function cut(s,n){s=String(s==null?'':s);if(s.length<=n)return s;return Array.from(s).slice(0,n).join('');}
function strip(s){return String(s==null?'':s).replace(/^[\s﻿]+|[\s﻿]+$/g,'');}
function normAnswer(s){s=String(s==null?'':s).normalize('NFKC').trim().toLowerCase().replace(/\s+/g,'');return s.replace(/[。.!！?？,，、]+$/,'');}
function firstInt(s){var m=String(s==null?'':s).normalize('NFKC').match(/\d+/);return m?parseInt(m[0],10):null;}
function defaultTime(t){return {text:30,order:30,multi:30,poll:20}[t]||20;}
function mkQ(){return {type:null,text:'',options:[],correct:[],answers:[],time:null,points:'normal',image:'',explain:'',_marks:[]};}
function splitAnswers(v){return String(v).split(/\s*[\/／|｜]\s*/).map(strip).filter(Boolean);}

function finish(q,where){
  var marks=q._marks||[];delete q._marks;
  var opts=q.options,i;
  if(q.type===null){
    if(opts.length)q.type=marks.filter(Boolean).length>1?'multi':'single';
    else if(q.answers.length){var a=normAnswer(q.answers[0]);q.type=q.answers.length===1&&(TF_TRUE.indexOf(a)>=0||TF_FALSE.indexOf(a)>=0)?'tf':'text';}
    else return where+'找不到選項或答案';
  }
  var t=q.type;
  if(!q.text)return where+'沒有題目文字';
  if(t==='tf'){
    var truth=null;
    if(opts.length){for(i=0;i<opts.length&&i<marks.length;i++)if(marks[i])truth=TF_TRUE.indexOf(normAnswer(opts[i]))>=0;}
    else if(q.answers.length){var b=normAnswer(q.answers[0]);truth=TF_TRUE.indexOf(b)>=0?true:TF_FALSE.indexOf(b)>=0?false:null;}
    if(truth===null)return where+'是非題的答案要寫「對」或「錯」';
    q.options=['對','錯'];q.correct=[truth?0:1];q.answers=[];
  }else if(t==='single'||t==='multi'||t==='poll'){
    if(opts.length<2||opts.length>6)return where+'選項要 2～6 個（現在 '+opts.length+' 個）';
    q.correct=[];for(i=0;i<marks.length;i++)if(marks[i])q.correct.push(i);
    if(t==='single'&&q.correct.length!==1){if(q.correct.length>1)q.type='multi';else return where+'請在正確答案前面加 *';}
    if(t==='multi'&&!q.correct.length)return where+'請在正確答案前面加 *（可以好幾個）';
    if(t==='poll'){q.correct=[];q.points='none';}
  }else if(t==='order'){
    if(opts.length<2||opts.length>6)return where+'排序題要 2～6 項（現在 '+opts.length+' 項）';
    q.correct=opts.map(function(_,k){return k;});
  }else if(t==='text'){
    q.options=[];if(!q.answers.length)return where+'填答題要寫「答案 …」';
  }
  if(q.time===null)q.time=defaultTime(q.type);
  q.time=Math.max(5,Math.min(240,q.time|0));
  return '';
}

/* lenient：格式不完整的題目也保留（標 bad），讓編輯器可以接著修；遊戲用的解析不保留 */
function keep(q,marks,err,lenient,questions,errors){
  if(!err){questions.push(q);return;}
  errors.push(err);if(!lenient)return;
  if(!q.type)q.type=q.options.length?'single':q.answers.length?'text':'single';
  var t=q.type;

/* 題目 → 文字題庫（與 Python 的 bank_to_text 相同） */

    else if(q.type==='text')out.push('答案 '+q.answers.join(' / '));

/* Kahoot 官方試算表範本：第 8 列標題、第 9 列起每列一題（B 題目、C～F 答案 1～4、G 秒數、H 正確答案編號） */
function kahootXlsx(title,qs){
  var rows=[[],['','Quiz template'],['','Add questions, at least two answer alternatives, time limit and choose correct answers (at least one). Have fun creating your awesome quiz!'],
    ['','Remember: questions have a limit of 120 characters and answers can have 75 characters max. Text will turn red in Excel or Google Docs if you exceed this limit. If several answers are correct, separate them with a comma.'],
    ['','See an example question below (don\'t forget to overwrite this with your first question!)'],['','And remember,  if you\'re not using Excel you need to export to .xlsx format before you upload to Kahoot!'],[],
    ['','Question - max 120 characters','Answer 1 - max 75 characters','Answer 2 - max 75 characters','Answer 3 - max 75 characters','Answer 4 - max 75 characters','Time limit (sec) – 5, 10, 20, 30, 60, 90, 120, or 240 secs','Correct answer(s) - choose at least one']];
  var warn=[],n=0;
  qs.forEach(function(q,i){
    var no='第 '+(i+1)+' 題';
    if(q.type==='text'||q.type==='order'||q.type==='poll'){warn.push(no+'（'+QTYPES[q.type]+'題）Kahoot 範本不支援，已略過');return;}
    if(q.options.length>4){warn.push(no+' 有 '+q.options.length+' 個選項，Kahoot 最多 4 個，已略過');return;}
    var t=KAHOOT_TIMES.reduce(function(a,b){return Math.abs(b-q.time)<Math.abs(a-q.time)?b:a;});
    if(t!==q.time)warn.push(no+' 秒數 '+q.time+' 改成 Kahoot 可用的 '+t);
    if(Array.from(q.text).length>120)warn.push(no+' 題目超過 120 字，已截斷');
    if(q.options.some(function(o){return Array.from(o).length>75;}))warn.push(no+' 有選項超過 75 字，已截斷');
    if(q.image)warn.push(no+' 的圖片不會帶到 Kahoot，請在 Kahoot 上另外加');
    n++;var r=[n,cut(q.text,120)],k;
    for(k=0;k<4;k++)r.push(q.options[k]?cut(q.options[k],75):'');
    r.push(t);r.push(q.correct.map(function(x){return x+1;}).join(','));rows.push(r);
  });
  return {data:writeXlsx(rows,{bold:[7],widths:[4,60,26,26,26,26,14,14]}),count:n,warnings:warn};
}

/* 單題檢查（編輯器即時提示用）：傳回錯誤與提醒 */
var RESERVED=/^(時間|秒數|秒|答案|正解|解說|說明|解析|圖片|圖)\s*[:：]?/;
function check(q){
  var e=[],w=[],t=q.type,opts=(q.options||[]).map(strip);
  if(!strip(q.text))e.push('還沒有寫題目');
  if(t==='single'||t==='multi'||t==='poll'||t==='order'){
    var filled=opts.filter(Boolean);
    if(filled.length<2)e.push((t==='order'?'排序題':'')+'至少要 2 個'+(t==='order'?'項目':'選項'));
    if(t==='single'&&q.correct.length!==1)e.push('請選 1 個正確答案（按選項旁的 ✓）');
    if(t==='multi'&&!q.correct.length)e.push('請至少選 1 個正確答案');
    var seen={};filled.forEach(function(o){var k=normAnswer(o);if(seen[k])w.push('有兩個選項一樣：「'+o+'」');seen[k]=1;});
    opts.forEach(function(o,i){if(o&&RESERVED.test(o)&&!(q.correct.indexOf(i)>=0&&t!=='order'))w.push('選項「'+cut(o,10)+'」開頭是保留字，存檔後會被當成設定，請換個說法');
      if(o&&/^[*＊✓✔\-–•・]/.test(o))w.push('選項「'+cut(o,10)+'」開頭的符號在存檔時會被去掉或當成正解記號');});
  }
  if(t==='text'&&!(q.answers||[]).filter(function(a){return strip(a);}).length)e.push('請至少寫 1 個可接受的答案');
  if(/^\s*[\[【［#＃]/.test(q.text||''))w.push('題目開頭的 [ 或 # 會被當成標籤或註解');
  return {errors:e,warnings:w};
}

return {QTYPES:QTYPES,TYPE_TAGS:TYPE_TAGS,defaultTime:defaultTime,normAnswer:normAnswer,parseBank:parseBank,bankToText:bankToText,
  parseRows:parseRows,parseCSV:parseCSV,decodeBytes:decodeBytes,unzip:unzip,zip:zip,crc32:crc32,xlsxRows:xlsxRows,writeXlsx:writeXlsx,
  tableRows:tableRows,tableXlsx:tableXlsx,kahootXlsx:kahootXlsx,check:check,cut:cut,KAHOOT_TIMES:KAHOOT_TIMES};
})();
if(typeof module!=='undefined')module.exports=BankLib;

<script>
(function(){

var MODE='offline';            /* server＝課堂搶答王裡開啟（存到題庫資料夾）；offline＝離線網頁版（下載檔案） */

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function info(title,lines){$('iTitle').textContent=title;$('iBody').innerHTML=lines.map(function(l){return '<div class="'+(l[0]||'')+'">'+esc(l[1])+'</div>';}).join('');$('dInfo').showModal();}
document.querySelectorAll('[data-srv]').forEach(function(e){if(!SRV)e.hidden=true;});
document.querySelectorAll('[data-off]').forEach(function(e){if(SRV)e.hidden=true;});

/* ---------- 題目模型 ---------- */
function blank(type){var q={_id:++E.uid,type:type||'single',text:'',options:[],correct:[],answers:[],time:null,points:'normal',image:'',explain:''};
  if(q.type==='single'||q.type==='multi'||q.type==='poll')q.options=['','','',''];

function fromLib(q){return {_id:++E.uid,type:q.type,text:q.text,options:q.options.slice(),correct:q.correct.slice(),answers:q.answers.slice(),
  time:q.time===L.defaultTime(q.type)?null:q.time,points:q.points,image:q.image||'',explain:q.explain||''};}
function toLib(q){
  var o={type:q.type,text:oneLine(q.text),options:[],correct:[],answers:[],time:q.time==null?L.defaultTime(q.type):q.time,
    points:q.type==='poll'?'none':q.points,image:q.image||'',explain:oneLine(q.explain)};
  if(q.type==='tf'){o.options=['對','錯'];o.correct=q.correct.slice(0,1);}
  else if(q.type==='text'){o.answers=q.answers.map(oneLine).filter(Boolean);}
  else{q.options.forEach(function(x,i){x=oneLine(x);if(x){if(q.correct.indexOf(i)>=0)o.correct.push(o.options.length);o.options.push(x);}});
    if(q.type==='order')o.correct=o.options.map(function(_,i){return i;});
    if(q.type==='poll')o.correct=[];}
  return o;}
function chk(q){return L.check(toLib(q));}
function bankText(){return L.bankToText(oneLine(E.title)||'我的題庫',E.qs.map(toLib));}
function cur(){return E.qs[E.sel];}

/* ---------- 復原／重做、未儲存 ---------- */
function state(){return JSON.stringify({t:E.title,q:E.qs});}

function changed(now){clearTimeout(chT);var f=function(){var s=state();if(s===E.snap)return;E.hist.push(E.snap);if(E.hist.length>80)E.hist.shift();E.fut=[];E.snap=s;setDirty(true);saveDraft();updUndo();};
  if(now)f();else chT=setTimeout(f,500);}
function restore(s){var d=JSON.parse(s);E.title=d.t;E.qs=d.q;E.uid=E.qs.reduce(function(m,q){return Math.max(m,q._id||0);},E.uid);E.snap=s;
  if(E.sel>=E.qs.length)E.sel=Math.max(0,E.qs.length-1);$('title').value=E.title;setDirty(true);saveDraft();render();updUndo();}

function redo(){if(!E.fut.length)return;E.hist.push(E.snap);restore(E.fut.pop());}
function updUndo(){$('bUndo').disabled=!E.hist.length;$('bRedo').disabled=!E.fut.length;}
function setDirty(d){E.dirty=d;$('fileInfo').textContent=(E.file?'📄 '+E.file:'（尚未儲存）')+(d?' ・ 未儲存':' ・ 已儲存');}
function resetDoc(title,qs,file){E.title=title;E.qs=qs;E.file=file||'';E.sel=0;E.hist=[];E.fut=[];$('title').value=title;E.snap=state();setDirty(false);updUndo();render();}

    return '<div class="qi'+(i===E.sel?' on':'')+'" draggable="true" data-i="'+i+'"><span class="no">'+(i+1)+'</span>'+
      '<span class="tx"><b>'+QT[q.type]+(q.points==='double'?'・⚡加倍':'')+(c.errors.length?' <span class="bad" title="'+esc(c.errors.join('、'))+'">⚠ 未完成</span>':'')+'</b><span>'+(esc(oneLine(q.text))||'<i style="opacity:.6">（還沒寫題目）</i>')+'</span></span>'+
      (q.image?(imgSrc(q.image)?'<img class="th" src="'+esc(imgSrc(q.image))+'" alt="">':'<span class="th" title="找不到圖片">🖼</span>'):'')+'</div>';}).join('')||'<div class="empty" style="padding:20px">還沒有題目</div>';
  $('qCount').textContent=E.qs.length+' 題'+(bad?'・'+bad+' 題未完成':'');
}
var dragFrom=-1;
$('list').addEventListener('click',function(e){var it=e.target.closest('.qi');if(!it)return;E.sel=+it.getAttribute('data-i');render();});
$('list').addEventListener('dragstart',function(e){var it=e.target.closest('.qi');if(!it)return;dragFrom=+it.getAttribute('data-i');it.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','q');}catch(x){}});
$('list').addEventListener('dragend',function(){dragFrom=-1;renderList();});
$('list').addEventListener('dragover',function(e){if(dragFrom<0)return;e.preventDefault();document.querySelectorAll('.qi.over').forEach(function(x){x.classList.remove('over');});var it=e.target.closest('.qi');if(it)it.classList.add('over');});
$('list').addEventListener('drop',function(e){if(dragFrom<0)return;e.preventDefault();var it=e.target.closest('.qi');var to=it?+it.getAttribute('data-i'):E.qs.length-1;moveQ(dragFrom,to);dragFrom=-1;});
function moveQ(from,to){if(from===to||to<0||to>=E.qs.length)return;var q=E.qs.splice(from,1)[0];E.qs.splice(to,0,q);E.sel=to;changed(true);render();}

/* ---------- 編輯區 ---------- */
function render(){renderList();renderEd();}
function renderEd(){
  var ed=$('ed'),q=cur();
  if(!q){ed.innerHTML='<div class="empty"><b>開始建立題庫</b>按左下角「＋ 新增題目」，或「📂 開啟／匯入」現有的題庫、Kahoot 試算表、Excel 表格。<br>也可以直接把檔案拖進來。</div>';return;}
  var n=E.sel,h='';
  h+='<div class="row"><div class="types" id="types">'+Object.keys(QT).map(function(k){return '<button data-t="'+k+'" class="'+(q.type===k?'on':'')+'">'+QT[k]+'</button>';}).join('')+'</div><span class="sp"></span>'+
    '<span class="cnt">第 '+(n+1)+' / '+E.qs.length+' 題</span><button class="btn sm" id="qUp" title="往上移">↑</button><button class="btn sm" id="qDn" title="往下移">↓</button>'+
    '<button class="btn sm" id="qDup">⧉ 複製</button><button class="btn sm d" id="qDel">🗑 刪除</button></div>';
  h+='<div><div class="lbl">題目</div><textarea id="qText" rows="2" maxlength="300" placeholder="在這裡輸入題目，例如：台灣最高的山是哪一座？"></textarea><div class="cnt" id="qTextN"></div></div>';
  h+='<div><div class="lbl">圖片 <small>（可省略）拖曳圖片到框裡、按 Ctrl+V 貼上，或選擇檔案；大張照片會自動縮小</small></div><div class="imgbox" id="imgBox"></div></div>';
  h+='<div id="ansArea"></div>';
  h+='<div class="set"><label>作答時間<select class="fld" id="qTime"></select></label>'+
    '<label>計分<select class="fld" id="qPts"><option value="normal">標準</option><option value="double">⚡ 分數加倍</option><option value="none">不計分（練習）</option></select></label>'+
    '<label style="grid-column:span 2">解說 <small style="font-weight:400;color:var(--ink2)">公布答案時顯示（可省略）</small><input class="fld" id="qExp" maxlength="300" placeholder="例：玉山主峰海拔約 3952 公尺。"></label></div>';
  h+='<div class="msgs" id="qMsg"></div>';
  h+='<div><div class="lbl">預覽 <small>投影幕上大約的樣子</small></div><div class="pv" id="pv"></div></div>';
  ed.innerHTML=h;
  $('qText').value=q.text;$('qExp').value=q.explain;
  var times=[5,10,15,20,30,45,60,90,120,180,240];if(q.time!=null&&times.indexOf(q.time)<0){times.push(q.time);times.sort(function(a,b){return a-b;});}
  $('qTime').innerHTML='<option value="">預設（'+L.defaultTime(q.type)+' 秒）</option>'+times.map(function(t){return '<option value="'+t+'"'+(q.time===t?' selected':'')+'>'+t+' 秒</option>';}).join('');
  $('qPts').value=q.type==='poll'?'none':q.points;$('qPts').disabled=q.type==='poll';
  $('types').onclick=function(e){var b=e.target.closest('[data-t]');if(b)setType(b.getAttribute('data-t'));};
  $('qUp').onclick=function(){moveQ(n,n-1);};$('qDn').onclick=function(){moveQ(n,n+1);};
  $('qDup').onclick=function(){var c=JSON.parse(JSON.stringify(q));c._id=++E.uid;E.qs.splice(n+1,0,c);E.sel=n+1;changed(true);render();toast('已複製成第 '+(n+2)+' 題');};
  $('qDel').onclick=function(){if((oneLine(q.text)||q.options.some(Boolean))&&!confirm('刪除第 '+(n+1)+' 題？（可以按 ↶ 復原）'))return;E.qs.splice(n,1);if(E.sel>=E.qs.length)E.sel=E.qs.length-1;if(E.sel<0)E.sel=0;changed(true);render();};
  var tx=$('qText');autoH(tx);

function autoH(t){t.style.height='auto';t.style.height=Math.max(64,t.scrollHeight+4)+'px';}
function live(noChange){
  var q=cur();if(!q)return;

  var tn=$('qTextN');if(tn){tn.textContent=n+' / 300'+(n>120?'　（超過 120 字，匯出到 Kahoot 時會被截斷）':'');tn.className='cnt'+(n>120?' over':'');}
  $('qMsg').innerHTML=c.errors.map(function(x){return '<div class="e">⚠ '+esc(x)+'</div>';}).join('')+c.warnings.map(function(x){return '<div class="w">💡 '+esc(x)+'</div>';}).join('')||'<div class="ok">✓ 這一題可以用了</div>';
  var it=document.querySelector('.qi[data-i="'+E.sel+'"]');
  if(it){var sp=it.querySelector('.tx span');if(sp)sp.innerHTML=esc(oneLine(q.text))||'<i style="opacity:.6">（還沒寫題目）</i>';
    var b=it.querySelector('.tx b');if(b)b.innerHTML=QT[q.type]+(q.points==='double'?'・⚡加倍':'')+(c.errors.length?' <span class="bad">⚠ 未完成</span>':'');}
  renderPv();
  if(!noChange)changed();
}
function setType(t){
  var q=cur();if(q.type===t)return;var old=q.type,filled=q.options.filter(function(o){return oneLine(o);});
  if(t==='tf'){q.options=['對','錯'];q.correct=[];}
  else if(t==='text'){q.answers=old==='tf'?[]:(q.correct.map(function(i){return q.options[i];}).filter(Boolean));if(!q.answers.length&&old==='text')q.answers=[];q.options=[];q.correct=[];}
  else{
    if(old==='tf'||old==='text'){q.options=old==='text'&&q.answers.length?q.answers.slice(0,6):['','','',''];while(q.options.length<(t==='order'?3:4))q.options.push('');q.correct=[];}
    else if(!filled.length){q.options=['','','',''];}
    if(t==='single')q.correct=q.correct.slice(0,1);
    if(t==='order'||t==='poll')q.correct=[];
  }
  if(t==='poll')q.points='none';else if(old==='poll')q.points='normal';
  q.type=t;changed(true);$('addType').value=t;renderEd();renderList();
}
/* 答案區 */
function renderAns(){
  var q=cur(),a=$('ansArea'),h='';
  if(q.type==='tf'){
    a.innerHTML='<div class="lbl">正確答案 <small>點一下選「對」或「錯」</small></div><div class="tf"><button data-v="0" style="background:'+TFC[0]+'" class="'+(q.correct[0]===0?'on':'')+'">○ 對</button><button data-v="1" style="background:'+TFC[1]+'" class="'+(q.correct[0]===1?'on':'')+'">✕ 錯</button></div>';
    a.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){q.correct=[+b.getAttribute('data-v')];renderAns();live();};});return;}
  if(q.type==='text'){
    h='<div class="lbl">可接受的答案 <small>可以有好幾個（例：12、十二）。比對時全形半形、大小寫、空白、句尾標點都不影響</small></div><div class="chips">'+
      q.answers.map(function(x,i){return '<span class="chip">'+esc(x)+'<button data-del="'+i+'" title="刪除">✕</button></span>';}).join('')+
      '<input class="fld" id="ansIn" placeholder="輸入答案後按 Enter" style="min-width:220px"><button class="btn" id="ansAdd">＋ 加入</button></div>';
    a.innerHTML=h;
    var add=function(){var v=oneLine($('ansIn').value);if(!v)return;v.split(/\s*[\/／|｜]\s*/).filter(Boolean).forEach(function(x){if(q.answers.indexOf(x)<0)q.answers.push(x);});renderAns();live();$('ansIn').focus();};
    $('ansAdd').onclick=add;$('ansIn').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();add();}};

  if(q.type==='order'){
    h='<div class="lbl">項目 <small>照「正確順序」由上往下排（遊戲時會自動打亂），用 ↑↓ 調整</small></div><div class="ord">'+
      q.options.map(function(o,i){return '<div class="opt"><span class="num">'+'①②③④⑤⑥'.charAt(i)+'</span><input data-o="'+i+'" maxlength="120" placeholder="第 '+(i+1)+' 個"><button class="mv" data-up="'+i+'" title="往上">↑</button><button class="mv" data-dn="'+i+'" title="往下">↓</button>'+(q.options.length>2?'<button class="x" data-x="'+i+'" title="刪除">✕</button>':'')+'</div>';}).join('')+'</div>';

/* 大照片縮小：最長邊 1280、JPEG 品質 0.85；小的 PNG／GIF／SVG 保持原檔 */
function shrink(file){
  return new Promise(function(ok){
    var small=file.size<600*1024;
    if(/gif|svg/.test(file.type)){return ok({blob:file,name:file.name});}
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,1280/Math.max(w,h));
      if(Math.max(w,h)<=1600&&small){URL.revokeObjectURL(url);return ok({blob:file,name:file.name});}   /* 不大就保留原檔（PNG 透明背景也保留） */
      var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){URL.revokeObjectURL(url);ok({blob:b||file,name:String(file.name||'圖片').replace(/\.[^.]+$/,'')+'.jpg',shrunk:w+'×'+h+' → '+c.width+'×'+c.height});},'image/jpeg',.85);};
    img.onerror=function(){URL.revokeObjectURL(url);ok({blob:file,name:file.name});};img.src=url;
  });
}
function blobB64(b){return new Promise(function(ok){var r=new FileReader();r.onload=function(){ok(String(r.result).split(',')[1]);};r.readAsDataURL(b);});}
function blobURL(b){return new Promise(function(ok){var r=new FileReader();r.onload=function(){ok(String(r.result));};r.readAsDataURL(b);});}
function addImage(file,name){
  var q=cur();if(!q)return;
  shrink(file).then(function(r){
    var nm=safeName(name&&!file.name?name:(r.name||name||'圖片.png'));if(!/\.(png|jpe?g|gif|webp|svg)$/i.test(nm))nm+='.png';
    return storeImage(nm,r.blob).then(function(fn){q.image=fn;renderImg();renderList();live();changed(true);toast('已加入圖片 '+fn+(r.shrunk?'（已縮小 '+r.shrunk+'）':''));});
  }).catch(function(e){toast('圖片加入失敗：'+(e&&e.message||e));});
}
function storeImage(name,blob){
  if(SRV)return blobB64(blob).then(function(b64){return post('/api/h/upload_media',{name:name,b64:b64});}).then(function(r){if(!r.ok)throw new Error(r.msg);E.media=null;return r.file;});
  return blobURL(blob).then(function(url){
    var base=name.replace(/\.[^.]+$/,''),ext=name.slice(base.length),fn=name,k=2;
    while(E.imgs[fn]&&E.imgs[fn]!==url)fn=base+'_'+(k++)+ext;
    E.imgs[fn]=url;saveDraft();return fn;});
}

/* 任何檔案 → {title, questions, errors, images:{name:Uint8Array}, kind} */
function parseBytes(name,u8){
  var base=name.replace(/^.*[\\\/]/,'').replace(/\.[^.]+$/,''),ext=(name.match(/\.([^.]+)$/)||['',''])[1].toLowerCase();
  if(ext==='zip'||(ext!=='xlsx'&&u8[0]===0x50&&u8[1]===0x4B&&ext!=='txt'&&ext!=='csv')){
    return L.unzip(u8).then(function(files){
      var names=Object.keys(files),imgs={},main=null;
      names.forEach(function(n){if(/\.(png|jpe?g|gif|webp|svg)$/i.test(n)&&!/__MACOSX/.test(n))imgs[n.replace(/^.*\//,'')]=files[n];});
      main=names.filter(function(n){return /\.txt$/i.test(n)&&!/格式說明|readme|說明/i.test(n)&&!/__MACOSX/.test(n);})[0]||names.filter(function(n){return /\.(xlsx|csv)$/i.test(n);})[0];
      if(!main)throw new Error('zip 裡找不到題庫檔（.txt／.xlsx／.csv）');
      return parseBytes(main.replace(/^.*\//,''),files[main]).then(function(r){r.images=imgs;return r;});
    });
  }
  if(ext==='xlsx')return L.xlsxRows(u8).then(function(rows){var r=L.parseRows(rows,base,true);r.kind=isKahoot(rows)?'Kahoot 試算表':'Excel 表格';return r;});
  var text=L.decodeBytes(u8);
  var r=ext==='csv'?L.parseRows(L.parseCSV(text),base,true):L.parseBank(text,base,true);
  r.kind=ext==='csv'?'CSV 表格':'文字題庫';
  return Promise.resolve(r);
}
function isKahoot(rows){return rows.some(function(r){return r.some(function(c){return /question - max|answer 1 - max/i.test(c||'');});});}
function applyImport(res,serverFile,localName){
  var imgs=res.images||{},jobs=[],rename={};
  Object.keys(imgs).forEach(function(n){
    var used=res.questions.some(function(q){return q.image===n;});if(!used)return;
    var ext=n.split('.').pop().toLowerCase(),blob=new Blob([imgs[n]],{type:'image/'+(ext==='jpg'?'jpeg':ext==='svg'?'svg+xml':ext)});
    jobs.push(storeImage(n,blob).then(function(fn){if(fn!==n)rename[n]=fn;}));
  });
  return Promise.all(jobs).then(function(){
    var qs=res.questions.map(function(q){var e=fromLib(q);if(rename[e.image])e.image=rename[e.image];return e;});
    var merge=$('oMerge').checked&&E.qs.length;
    $('dOpen').close();
    if(merge){E.qs=E.qs.concat(qs);E.sel=E.qs.length-qs.length;changed(true);render();}
    else{var file=serverFile&&/\.txt$/i.test(serverFile)?serverFile:'';resetDoc(res.title,qs.length?qs:[blank('single')],file);if(!SRV&&localName)E.file=localName.replace(/\.[^.]+$/,'')+'.txt';setDirty(!file);saveDraft();}
    var bad=res.questions.filter(function(q){return q.bad;}).length,miss=qs.filter(function(q){return q.image&&!imgSrc(q.image);}).length;
    var lines=[['ok','✓ 讀到 '+res.questions.length+' 題（'+(res.kind||'')+'）'+(merge?'，已加在後面':'')]];
    if(bad)lines.push(['e','⚠ 其中 '+bad+' 題格式不完整，已標「未完成」，請在左邊清單找到後補上']);
    (res.errors||[]).slice(0,12).forEach(function(e){lines.push(['w','・'+e]);});
    if(miss&&!SRV)lines.push(['w','有 '+miss+' 題的圖片不在檔案裡（純文字題庫不含圖片），可以重新選圖，或改開啟 .zip']);
    if(serverFile&&!/\.txt$/i.test(serverFile))lines.push(['w','這是 '+serverFile.split('.').pop().toUpperCase()+' 檔，儲存時會另存成 .txt 題庫']);
    if(bad||(res.errors||[]).length||miss||lines.length>1)info('匯入結果',lines);else toast(lines[0][1]);
  });
}

    if(skip)lines.push(['w','未完成的 '+skip+' 題沒有匯出']);k.warnings.forEach(function(w){lines.push(['w','・'+w]);});info('Kahoot 試算表',lines);}
  else if(x==='table'){download(baseName()+'.xlsx',L.tableXlsx(oneLine(E.title),ok));toast('已匯出 Excel 表格（'+ok.length+' 題）'+(skip?'，未完成的 '+skip+' 題沒有匯出':''),3500);}
  else if(x==='txt'){download(baseName()+'.txt','﻿'+bankText().replace(/\n/g,'\r\n'),'text/plain;charset=utf-8');}
  else if(x==='zip'){exportZip();}
};
function exportZip(){
  var files=[{name:'題庫/'+baseName()+'.txt',data:'﻿'+bankText().replace(/\n/g,'\r\n')}];
  usedImages().forEach(function(n){files.push({name:'題庫/圖片/'+n,data:dataURLBytes(E.imgs[n])});});
  download(baseName()+'.zip',L.zip(files),'application/zip');
  info('已下載 '+baseName()+'.zip',[['ok','✓ 題庫 1 份、圖片 '+(files.length-1)+' 張'],['','使用方式：把 zip 解壓縮到「課堂搶答王」程式所在的資料夾（裡面的「題庫」資料夾會合併進去），主持畫面按 ↻ 就看得到。'],['','之後要再修改，可以在這個編輯器直接開啟這個 .zip。']]);
}

/* ---------- 文字模式 ---------- */
$('bSrc').onclick=function(){changed(true);$('srcText').value=bankText();$('srcMsg').innerHTML='';$('dSrc').showModal();srcCheck();};
var scT=null;function srcCheck(){clearTimeout(scT);scT=setTimeout(function(){var r=L.parseBank($('srcText').value,'題庫',true),bad=r.questions.filter(function(q){return q.bad;}).length;
  $('srcMsg').innerHTML='<div class="'+(bad?'w':'ok')+'">「'+esc(r.title)+'」共 '+r.questions.length+' 題'+(bad?'，'+bad+' 題格式不完整':'')+'</div>'+r.errors.slice(0,6).map(function(e){return '<div class="e">⚠ '+esc(e)+'</div>';}).join('');},250);}
$('srcText').oninput=srcCheck;
$('srcCopy').onclick=function(){var t=$('srcText');t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast('已複製');});}catch(e){document.execCommand('copy');toast('已複製');}};
$('srcApply').onclick=function(){var r=L.parseBank($('srcText').value,E.title||'我的題庫',true);E.title=r.title;$('title').value=E.title;
  E.qs=r.questions.map(fromLib);if(!E.qs.length)E.qs=[blank('single')];if(E.sel>=E.qs.length)E.sel=0;changed(true);$('dSrc').close();render();toast('已套用（'+E.qs.length+' 題）');};

/* ---------- 鍵盤 ---------- */
document.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='s'){e.preventDefault();if(!document.querySelector('dialog[open]'))save();return;}
  if(document.querySelector('dialog[open]'))return;
  var inText=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'');
  if((e.ctrlKey||e.metaKey)&&k==='z'&&!e.shiftKey&&!inText){e.preventDefault();undo();}
  else if((e.ctrlKey||e.metaKey)&&(k==='y'||(k==='z'&&e.shiftKey))&&!inText){e.preventDefault();redo();}
  else if((e.ctrlKey||e.metaKey)&&k==='z'&&!e.shiftKey&&inText){changed(true);}  /* 輸入框裡先讓瀏覽器自己復原文字 */
});

/* ---------- 啟動 ---------- */
window.__qkEditor={state:function(){return {title:E.title,file:E.file,dirty:E.dirty,sel:E.sel,qs:E.qs.map(toLib),bad:problems(),imgs:Object.keys(E.imgs),hist:E.hist.length};},text:bankText,lib:L};
(function start(){
  var p=new URLSearchParams(location.search),f=p.get('file');
  if(SRV&&f){resetDoc('',[],'');openServerFile(f);return;}
  if(!SRV){try{var d=JSON.parse(localStorage.getItem(DRAFT)||'null');
    if(d&&d.q&&d.q.length&&confirm('找到上次沒有存檔的草稿「'+(d.t||'我的題庫')+'」（'+d.q.length+' 題，'+new Date(d.at).toLocaleString()+'），要繼續編輯嗎？\n按「取消」會開一份新的題庫。')){
      E.imgs=d.imgs||{};resetDoc(d.t||'我的題庫',d.q,d.file||'');E.uid=d.q.reduce(function(m,q){return Math.max(m,q._id||0);},0);setDirty(true);return;}}catch(e){}}
  resetDoc('我的題庫',[blank('single')],'');
})();
})();
</script>
