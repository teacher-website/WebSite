":"tf","q":"樣貌不佳的蔬果盡量不要吃，是「惜食」主要核心概念。","z":"甘願做，歡喜受。","o":[["O","對"],["X","錯"]],"a":"X","e":"惜食概念包括：吃多少、點多少；在外用餐，吃不下的菜餚打包回家；煮適量的食物，減少廚餘。但不包括樣貌不佳的蔬果盡量不要吃。","s":"臺北市環保局"},{"i":4237342,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"tf","q":"家裡垃圾可以整理裝袋後扔進路邊的行人專用清潔箱","z":"簡單，才真正有福；單純，才真正快樂。","o":[["O","對"],["X","錯"]],"a":"X","e":"依據廢棄物清理法第12條第1項及本局108年4月23日北市環清字第10830232281號公告事項四：「廢棄物不得任意棄置於地面，家戶垃圾及事業廢棄物不得投置於行人專用清潔箱或其他未經指定之處理。」，違規者處1,200元至6,000元罰緩。","s":"臺北市環保局"},{"i":4237343,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"tf","q":"丟棄家戶垃圾時，需使用專用垃圾袋，並至公告之收運點進行廢棄物排出作業。","z":"懂得生活禮儀，就懂得愛自己；自愛的人，才會愛人。","o":[["O","對"],["X","錯"]],"a":"O","e":"依本局公告「本市一般廢棄物清運時間、地點及排出方式，暨非交本局清運者之清除方式及處理場所相關規定辦理。」","s":"臺北市環保局"},{"i":4237469,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"近年來臺灣已發生過數起「鎘米汙染」意外事件，其主因為塑膠製造工廠大肆排放廢水到灌溉農田的水源中，導致種植作物的污染，引起「鎘中毒」。為防範土壤重金屬汙染，行政院環保署訂定土壤汙染物監測與管制標準，請問「鎘」汙染物在食用作物農地之「監測標準值」為何?","z":"付出，才能有愛與感恩的互動。","o":[["A","1.5毫克/公斤"],["B","2.0毫克/公斤"],["C","2.5毫克/公斤"],["D","3.0毫克/公斤"]],"a":"C","e":"行政院環保署訂定土壤汙染物監測與管制標準，監測項目包含砷(As)、鎘(Cd)、鉻(Cr)、銅(Cu)、汞(Hg)、鎳(Ni) 、鉛(Pb)、鋅(Zn)。其中鎘(Cd)其食用作物農地之監測標準值為2.5，是指重金屬鎘(Cd)全量分析每一公斤土壤中（乾基）所含污染物之毫克數標準值上限為2.5毫克。","s":"臺北市教育局"},{"i":4237470,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"臺北市噪音陳情2021年共計收到2萬多件，是臺北市陳情案件數量最多的公害問題。請問哪個做法不能減少噪音問題呢？","z":"好事要大家一起做，才有力量互相感動。","o":[["A","高架橋鄰近住宅區空間架設隔音牆"],["B","宣導深夜不進行高音量活動"],["C","改善車道鋪面"],["D","拆除機車消音器"]],"a":"D","e":"噪音污染是影響人類健康的第二大環境威脅，除了造成情緒上的焦慮，對身體造成的影響包括呼吸急促、高血壓、胃炎、結腸炎甚至心臟病。加強宣導提高民眾對噪音污染的認識、設置隔音牆、改善車道鋪面都能有效降低噪音。但是拆除消音器或不當改裝車輛，會提高汽機車音量分貝，妨害安寧，道路交通管理處罰條例亦規定，汽車駕駛人、駕駛汽車有拆除消音器，或以其他方式造成噪音情形者，處6,000元以上24,000元以下罰鍰，並當場禁止其駕駛。","s":"臺北市教育局"},{"i":4237471,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"下列哪一項並非我國環境教育法中認為人民需要了解或行動的內容？","z":"人要克服難，不要被難克服。","o":[["A","促進社會正義"],["B","尊重生命"],["C","維護環境生態平衡"],["D","推動文化保存"]],"a":"D","e":"環境教育法第一章總則第一條為推動環境教育，促進國民瞭解個人及社會與環境的相互依存關係，增進全民環境認知、環境倫理與責任，進而維護環境生態平衡、尊重生命、促進社會正義，培養環境公民與環境學習社群，以達到永續發展，特制定本法。","s":"臺北市教育局"},{"i":4237472,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"近年臺北市鄰里民眾與政府機關注重社區文化產業保存，從萬芳社區的芳川礦坑遺跡可知臺北市文山地區從日治時代開始就有礦業發展，當時礦坑的收入豐厚，因此礦業頗為興盛。請問當時文山地區礦坑所開採具經濟價值之礦物種類為何?","z":"如果影響不了別人，就做自己該做的事吧！","o":[["A","金"],["B","銀"],["C","煤"],["D","鐵"]],"a":"C","e":"文山區除了產茶葉之外，豐富的煤礦含量始終不為人知，從日治時代到光復初期開採最盛，全盛時期至少有八處煤礦，但大部分都已不復存在。煤礦大都分布在興隆路的兩側及景美溪兩岸附近，尤其在興隆路至動物園一帶山區，蘊藏量十分豐富。日治時期，因煤礦經營盈利甚豐，吸引私人投入俗稱「黑金」的煤礦開採。","s":"臺北市教育局"},{"i":4237473,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"1971年在伊朗簽署的拉姆薩國際濕地公約，是因為國際上自然保育組織發現( )日益稀少，為了保護其棲息地而訂定的。( )為哪種生物？","z":"雙手健全卻不肯做事的人，等於是沒有手的人。","o":[["A","水禽"],["B","水棲昆蟲"],["C","蛙類"],["D","鯨豚"]],"a":"A","e":"拉姆薩公約於1971年2月2日在伊朗的拉姆薩簽署，全名為「關於特別是作為水禽棲息地的國際重要濕地公約」，簡稱為「濕地公約」，英文是Ramsar Convention。成立的目的是在保護濕地，並希望用國家行動和國際合作來保護與合理利用濕地。為紀念濕地公約的簽署，故將每年的2月2日列為世界濕地日。","s":"臺北市教育局"},{"i":4237474,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"濕地與人類生活密不可分，以下何者不是濕地主要的功能","z":"恆心、毅力能如滴水穿石，再大的困難與阻礙都能突破。","o":[["A","處理污水，淨化水質"],["B","水生動植物生育地，生物多樣性保存庫"],["C","減緩氣候變遷，調節氣候"],["D","海埔地開發，興建海岸結構物與交通建設"]],"a":"D","e":"濕地的功能與價值包含：一、調節水資源--調節洪流、涵養水源、淨化水質二、生物棲地與食物來源--豐富的基因庫、食物供應鏈三、調節氣候--碳匯功能、抵禦極端氣候衝擊、減緩氣候變遷四、能源和經濟--產生能源、經濟效益、休閒觀光","s":"臺北市教育局"},{"i":4237475,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"臺北市的關渡平原棲息了一種世界級的保育類昆蟲，全世界僅有三個地方發現它，它生活在河海交界的蘆葦叢中。請問它叫甚麼?","z":"能以他人的快樂為自己的快樂，是最滿足、最富有的人生。","o":[["A","青紋細蟌"],["B","四斑細蟌"],["C","亞東細蟌"],["D","紅腹細蟌"]],"a":"B","e":"四斑細蟌（Mortonagrion hirosei Asahina, 1972）是蜻蛉目細蟌科桑色細蟌屬的小型豆娘。1971年在日本被首次發現，臺灣到2005年才在淡水河的五股濕地發現，目前全世界僅分布於東亞附近，臺灣則僅在淡水河五股濕地及基隆河（社子島北岸及磺港溪匯流口）附近的感潮濕地有發現。在國際自然保育組織的保育紅皮書中，已被列為近危物種（Near Threatened species）。","s":"臺北市教育局"},{"i":4237476,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"臺北市的市花是?","z":"人最難能可貴的是:擁有一分力量，負起一切責任。","o":[["A","杜鵑花"],["B","茶花"],["C","櫻花"],["D","阿勃勒"]],"a":"A","e":"1987年6月23日臺北市議會通過以杜鵑花和榕樹為臺北市的市花和市樹。在臺大校園、二二八公園、介壽公園，以及忠孝東路、仁愛路、羅斯福路、光復南路等街頭，皆可看見杜鵑的身影。杜鵑花的生命力超強，既耐乾旱又能抵抗潮溼，無論是大太陽或樹蔭下它都能適應。根長的淺分布的廣，能固定在表層泥土上。最厲害的是它不怕都市污濁的空氣，因為它長滿了絨毛的葉片，既能調節水分，又能吸住灰塵，最適合種在人多車多空氣污濁的大都市，可以發揮清淨空氣的功能。","s":"臺北市教育局"},{"i":4237477,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"臺北市轄區內的最高峰為","z":"勇氣不可失、信心不可無，世間沒有不能與無能的事，只怕不肯。","o":[["A","七星山主峰"],["B","大屯山主峰"],["C","玉山主峰"],["D","觀音山"]],"a":"A","e":"七星山位於臺灣北部的陽明山國家公園轄區內，行政區為臺北市北投區，海拔1,120公尺，是臺北市最高的山岳。 七星山為一複式火山，地理上屬於大屯火山彙，峰項置有一等三角點。","s":"臺北市教育局"},{"i":4237478,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"下列哪一條河(溪)流經臺北市?","z":"付出其實就是最大的收穫，因為能施與的人，比受施的人更幸福。","o":[["A","新店溪"],["B","基隆河"],["C","景美溪"],["D","以上皆是"]],"a":"D","e":"臺北市為盆地地形三面環山，盆地中有基隆河橫貫，西以淡水河，南以其支流新店溪、景美溪等與新北市為鄰。","s":"臺北市教育局"},{"i":4237479,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"為紓解臺北盆地淹水而炸毀了關渡隘口，卻造成哪個地方的農田變成溼地?","z":"人應擴大愛心，於富中修慧，此福慧平行齊進，並取諸社會、用諸社會，即是植福修慧。","o":[["A","淡水"],["B","北投"],["C","五股"],["D","士林"]],"a":"C","e":"過去淡水河在關渡宮附近，有著稱為獅象捍門的關渡隘口，由關渡象鼻頭和五股獅子頭形成的隘口，形成淡水河的狹窄天險。直到1963年葛樂理颱風造成社子大淹水，於是隔年開炸關渡象鼻頭和五股獅子頭，擴大河道通洪。過去狹小隘口，讓河水出海壓力大，擋住海水漲潮感潮帶。現今炸掉隘口，使海水壓力大過河水出口的壓力，潮水有進沒出，結果洩洪的目的沒達成，反而促成海水倒灌，讓上游五股良田變濕地。","s":"臺北市教育局"},{"i":4237480,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"面對未來氣候強降雨的頻繁增加，需加速道路排放地表雨水徑流的速度，故臺北市近來在人行道或自行車道的路面鋪設，大量採用何種工法?","z":"能幫助別人，能為社會盡一分力，即使一點一滴都有大用；因為有一分心，就有一分力量。","o":[["A","水泥鋪面"],["B","透水鋪面"],["C","瀝青混凝土鋪面"],["D","碎石鋪面"]],"a":"B","e":"受氣候暖化影響，氣溫逐漸升高，極端氣候不時侵擾，臺北市政府推動「海綿城市」因應，加強城市韌性，持續更新減洪治水工作。為協助都市排水減洪、降溫退燒，路面採用透水鋪面鋪設，取代不透水的瀝青或混凝土鋪面。透水鋪面孔隙率較大，可讓雨水直接滲入地下，提升地表入滲率，減少地面積水。晴天時，透水鋪面表層水分因蒸散作用帶走地表熱量，使鋪面降溫，減緩都市熱島效應。","s":"臺北市教育局"},{"i":4237481,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"為守護日據時代遺留的水道系統，臺北市哪一地區每年會辦理水道祭活動，讓在地居民了解飲水思源的重要性?","z":"知足的人心量開闊，心量開闊，對人對事就不會計較。","o":[["A","四獸山"],["B","公館"],["C","新生"],["D","天母"]],"a":"D","e":"草山水道系統於1932年3月完工， 2004年公告為臺北市第111號古蹟，現在仍然供應天母部分地區的用水。 因應3月22日的世界水資源日而生的「天母水道祭」，藉由提倡水資源的重要與永續發展而延伸的祈福祭典活動，提醒守護水資源的重要，也把愛水融入當地中小學課程。","s":"臺北市教育局"},{"i":4237482,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"近期臺北市政府積極推動「田園城市」政策，於信義區松山文創園區內設置「松菸食農教育園區」，讓民眾及學校親師生能多元體驗並觀察各類型可食作物的生長與收穫，請問該園區的佔地面積大約是多少呢?","z":"人生若能減低欲望，生活上便沒有什麼值得計較。","o":[["A","3500平方公尺"],["B","2500平方公尺"],["C","1500平方公尺"],["D","4500平方公尺"]],"a":"B","e":"臺北市府政府從104年起推動田園城市政策，透過跨局處整合大力推動綠色都市，迄今已經建置約749處田園基地，總計近20萬平方公尺。其中「松菸食農教育園區」面積高達2500平方公尺，其主要功能係作為臺北市各中、小學辦理校外教學及食農體驗之基地，配合已通過的食農教育法，自3月底插秧後，已陸續接待超過100位以上預約參訪的幼稚園、國小、市民團體等，將成為臺北市最重要的食農教育示範基地。","s":"臺北市教育局"},{"i":4237483,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"臺北市各校內都設有空氣品質旗幟，請問哪一種顏色的旗幟建議不要在戶外上體育課？","z":"人生的責任，是要做利益人群的事。","o":[["A","紅"],["B","橙"],["C","黃"],["D","紫"]],"a":"D","e":"","s":"臺北市教育局"},{"i":4237485,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"某日校園中懸掛了紅色的空氣品質旗幟，它所代表的意思是？","z":"做對人生有意義的事，才是生命真正的價值。","o":[["A","空氣品質達普通程度。"],["B","空氣品質達危害程度。"],["C","學生應戴口罩，上課也應適度關窗、減少戶外活動。"],["D","學生不適合外出，若要外出須配戴防毒面具。"]],"a":"C","e":"","s":"臺北市教育局"},{"i":4237486,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"臺北市都會地區空氣汙染的主要來源為何?","z":"擁有正確的人生觀，才能擁有幸福的人生。","o":[["A","餐廳廢氣"],["B","工廠廢氣"],["C","交通車輛廢氣"],["D","餐飲攤販廢氣"]],"a":"C","e":"","s":"臺北市教育局"},{"i":4237487,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"破壞地球碳循環圈平衡，造成地表溫度急遽上升的什麼氣體?","z":"人生的價值，在於能為人間負責任。","o":[["A","一氧化碳"],["B","二氧化碳"],["C","二氧化硫"],["D","臭氧"]],"a":"B","e":"碳元素能在生物的作用下，於大自然中各個儲存庫（大氣層、海洋、地殼、生物體）之間不斷發生物理、化學、生物和地質相互反應的過程，在不同型態間來回「切換」，最後行程完整的循環，並且流動不息，這就是所謂的「碳循環」。在工業化之前，陸地生態系統每年通過光合作用固定的碳元素，和通過呼吸作用返回到大氣中的碳元素，大致是保持平衡的狀態；工業革命後，大量燃燒化石燃料，等於二氧化碳從地底下被釋放到大氣中，所以溫室氣體(包括二氧化碳、甲烷、水蒸氣、氧化亞氮等)濃度增加，導致溫室效應日趨嚴重。","s":"臺北市教育局"},{"i":4237488,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"地球暖化造成的影響為何?","z":"有愛的人生才幸福。","o":[["A","傳染病愈來愈少"],["B","南北極冰層愈來愈穩固"],["C","各地糧食供應漸趨穩定"],["D","極端天氣出現的頻率愈來愈高"]],"a":"D","e":"大氣中溫室氣體過量，引致全球暖化。當平均氣溫和海洋溫度升高，海水體積膨脹，南極和格陵蘭的大陸冰川也會加速融化，導致海平面上升，淹沒沿海低海拔地區。除此之外，降水模式改變和亞熱帶地區的沙漠化，助長極端天氣包括熱浪、乾旱、森林大火、暴雨、水患、暴雪等。各種天災襲擊將在全球造成嚴重的生命與財產損失。","s":"臺北市教育局"},{"i":4237489,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"以下何者非屬於家庭污水?","z":"安心睡、快樂吃、歡喜笑、健康做，是人生四寶。","o":[["A","洗衣排水"],["B","廚房排水"],["C","衛浴排水"],["D","工廠排放的廢水"]],"a":"D","e":"污水係指事業以外所產生含有污染物之水；廢水係指事業於製造、操作、自然資源開發過程中或作業環境所產生含有污染物之水。","s":"臺北市環保局"},{"i":4237490,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"下列何者為生活用水的主要來源？","z":"人生富足之道，不在於物質，而在於自心。","o":[["A","河川水"],["B","水庫水"],["C","地下水"],["D","以上皆非"]],"a":"B","e":"生活用水來源以水庫水為大宗。工業用水來源：地下水居多。農業用水來源：河川水居多。","s":"臺北市環保局"},{"i":4237491,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"為達2050年淨零排放，減少空氣污染，臺北市鼓勵民眾購買哪一種機車?","z":"少欲知足，是最富有的人生。","o":[["A","電動機車"],["B","輕型燃油機車"],["C","重型燃油機車"],["D","大型燃油重機"]],"a":"A","e":"電動機車能源來自電能，且行駛中不會產生二氧化碳。","s":"臺北市環保局"},{"i":4237492,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"機車出廠滿5年每年應做一次排氣定檢，民眾可至以下何處辦理檢驗？","z":"真正的歡喜，不在於擁有多少，而是有愛。","o":[["A","經環保局認可委託之定檢站"],["B","所有機車行均可"],["C","環保署"],["D","縣市環保局"]],"a":"A","e":"機車排氣定檢須至環保局委託之機車排氣檢驗站進行檢驗。","s":"臺北市環保局"},{"i":4237493,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"下列何者不是溫室氣體？","z":"一心做好事，自然就有福。","o":[["A","二氧化碳(CO2)"],["B","氧氣(O2)"],["C","甲烷(CH4)"],["D","以上皆是"]],"a":"B","e":"我國「溫室氣體減量及管理法」管制溫室氣體共有7種，包括二氧化碳(CO2)、氧化亞氮(N2O)、甲烷(CH4)、氫氟碳化物(HFCs)、全氟碳化物(PFCs)、六氟化硫(SF6)及三氟化氮(NF3)。","s":"臺北市環保局"},{"i":4237494,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"為阻止全球溫室效益惡化，重要國家與城市努力減少溫室氣體排放，而臺灣與臺北市規劃何年達成溫室氣體淨零排放目標？","z":"樂於付出，心靈富足。","o":[["A","2030"],["B","2040"],["C","2050"],["D","2060"]],"a":"C","e":"2021年世界地球日臺北市長提出承擔國際減碳責任，追求2050年溫室氣體淨零排放願景，與全球共同努力確保氣候安全。","s":"臺北市環保局"},{"i":4237495,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"下列何者為節能減碳行為？","z":"心善造福是福氣。","o":[["A","汰換老舊燈具"],["B","冷氣不關機"],["C","隨手不關燈"],["D","電腦不必關機"]],"a":"A","e":"老舊燈具設備效能低且耗電量大，汰換為高效LED燈具，有助於節能減碳。","s":"臺北市環保局"},{"i":4237496,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"大家應以環保行動來拯救地球，下列何者非為友善環境的生活方式？","z":"多做多得，少做多失。","o":[["A","買東西時自備購物袋"],["B","外出用餐自帶環保餐具"],["C","使用免洗(一次性)餐具"],["D","以上皆非"]],"a":"C","e":"一次性餐具回收過程及再利用製程耗費水資源、電力及其他能源，並增加二氧化碳排放量。","s":"臺北市環保局"},{"i":4237497,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"以下日常生活中之行為，何者不可以改善環境、保護地球（或改善淨零排放）？","z":"福不是用求的，是用做的。","o":[["A","自備購物袋"],["B","使用循環容器"],["C","多吃蔬食"],["D","購買複合塑膠材質玩具"]],"a":"D","e":"購買複合材質塑膠玩具難以回收再利用，非改善淨零排放生活之行為，會製造塑膠垃圾。","s":"臺北市環保局"},{"i":4237498,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"進行垃圾強制分類，對環境主要的幫助是什麼？","z":"感恩要表於行動。","o":[["A","會減少可回收的量"],["B","會減少垃圾量"],["C","會減少空氣污染"],["D","會減少噪音污染"]],"a":"B","e":"將原本視之為「垃圾」的物品，加以分類，經由回收商或回收管道進行回收、再利用，達成廢棄物減量化、資源化的目標就是資源回收。","s":"臺北市環保局"},{"i":4237499,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"廚餘回收分為「熟廚餘」及「生廚餘」兩類，以下哪一項屬於生廚餘？","z":"小事不做，大事難成。","o":[["A","不要的果皮"],["B","烹煮過的葉菜"],["C","吃剩的滷肉飯"],["D","過期的罐頭"]],"a":"A","e":"熟廚餘主要是烹調過的食品及營養成分較高的廚餘，例如：剩菜、剩飯；生廚餘指的是未經烹煮之葉菜類、果皮、茶葉渣等。","s":"臺北市環保局"},{"i":4237500,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"下列垃圾處理方法何者有錯？","z":"垃圾變黃金，黃金變愛心，愛心化清流，清流繞全球。","o":[["A","做好分類工作"],["B","自行焚化以減少垃圾量"],["C","減少廢棄物的產生"],["D","做好資源回收工作"]],"a":"B","e":"民眾只需要作好確實分類、減量，把垃圾交給清潔隊或專責人員處理，自行燃燒垃圾可能造成空氣污染、有毒物質的釋出，不只會被檢舉罰緩，也對健康造成傷害。","s":"臺北市環保局"},{"i":4237501,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"下列何者是垃圾可能造成的問題？","z":"希望大地資源不短缺，必須從懂得珍惜開始。","o":[["A","污染環境"],["B","滋生病媒"],["C","可能含有毒化物危害生命"],["D","以上皆是"]],"a":"D","e":"隨意放置廢棄物可能會造成環境污染及滋生病媒等情形，若廢棄物中含有有毒物質則可能會進一步危害生命。","s":"臺北市環保局"},{"i":4237502,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"小明發現爺爺昏倒了、叫不醒，該如何求救？","z":"做環保的手，是最美的手。","o":[["A","打113"],["B","打165"],["C","打117"],["D","打119"]],"a":"D","e":"113：家庭暴力、性侵害或性騷擾保護專線165：反詐騙專線117：報時專線119：消防局報案專線","s":"臺北市消防局"},{"i":4237503,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"下列何者是火場中的第一殺手？","z":"人人要疼惜自己，也要疼惜大地。","o":[["A","濃煙"],["B","高溫"],["C","火焰"],["D","以上皆是"]],"a":"A","e":"煙平均上升速度為每秒3~5公尺，擴散速度快且具有毒性，容易使人嗆暈昏倒而造成人命傷亡。","s":"臺北市消防局"},{"i":4237504,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"身上衣物著火時，該採取下列動作進行自救滅火時？","z":"可用的物資，都是值得珍惜的寶。","o":[["A","立即奔跑，尋找水源來澆熄身上著火。"],["B","立即摀住口鼻，停下後趴在地上左右翻滾。"],["C","趕快請周遭人員拿取外套或抹布拍打著火處。"],["D","立即停下，抱住頭部避免倒下時撞傷。"]],"a":"B","e":"身上衣物著火時，應立即停下、雙手掩住口鼻（避免吸入灼傷呼吸道），趴在地上後左右翻滾，滅少火和空氣接觸、阻絕氧氣助燃。","s":"臺北市消防局"},{"i":4237505,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"在廚房烹飪時，發覺油鍋突然起火，以下何者處置方式最為恰當？","z":"素食可讓身心健康，又能保護地球。","o":[["A","拿水桶裝滿水儘速倒入油鍋中可迅速降溫，達到滅火效果。"],["B","趕緊開啟抽油煙機，將火焰吸入。"],["C","拿起鍋蓋蓋住油鍋使其熄滅後，關閉爐火，移至水槽冷卻。"],["D","至臥室拿棉被浸水沾濕後覆蓋油鍋。"]],"a":"C","e":"拿起鍋蓋蓋住後，鍋鍋內火焰缺氧而熄滅，關閉爐火移除熱源，後續移至水槽內降溫冷卻。","s":"臺北市消防局"},{"i":4237506,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"當住家樓下發生火災時應採取下列何種行為，較能夠減少受傷、保護自己？","z":"做環保，除了淨山、淨海、淨大地之外，也要淨心田。","o":[["A","若門把不燙且門外沒煙，應立即緊閉家門以阻絕火勢濃煙帶在家中持續觀察。"],["B","若門把不燙且門外沒煙，應立即開門向下逃生並將家中大門關上以免火勢擴大延燒。"],["C","若門把或門板很燙且門外已有煙霧，應立即向上逃生並設法逃至頂樓求救。"],["D","若門把或門板不燙但門外已有大量煙霧，表示火勢尚未擴大應立即向下逃至室外或避難層避難。"]],"a":"B","e":"人平均往上速度為每秒0.5公尺，人往上跑是跑不贏煙的，因此火場逃生原則為往下逃生。","s":"臺北市消防局"},{"i":4237507,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"有關一氧化碳中毒的敘述，下列何者正確？","z":"疼惜大地，要從人人的足下起步。","o":[["A","多為使用瓦斯熱水器、瓦斯爐時，瓦斯外洩導致造成「瓦斯中毒」。"],["B","發現一氧化碳中毒情形，應立即衝進現場，對昏倒的人員進行急救。"],["C","一氧化碳為無色且具有瓦斯臭味的氣體，提醒人們發現瓦斯外洩。"],["D","輕微時會引起頭痛、虛弱、嗜睡嘔吐等症狀，常常同時造成許多人或全家大小發生相同癥兆。"]],"a":"D","e":"一氧化碳為燃燒不完全產生，為無色、無味的氣體，發現一氧化碳中毒情形，應先開門窗將環境通風、關閉瓦斯，趕緊撥打119求救。","s":"臺北市消防局"},{"i":4237508,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"有關室內消防栓的描述，何者正確？","z":"人人心中湧現淨水，才能拯救發燒的地球。","o":[["A","前方應放置物品擋住或上鎖，避免內部瞄子遭受偷竊，而無法操作使用。"],["B","發現火災時，先立即打開箱門、拿瞄子前往滅火。"],["C","放水時，應先站穩腳步，避免反作用力而跌倒。"],["D","若發現火無法撲滅，應持續滅火、直到火勢熄滅為止。"]],"a":"C","e":"發現火災時，應立即按下警鈴通知大家，如發現火無法撲滅，應立即逃生。","s":"臺北市消防局"},{"i":4237509,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"為了避免火災發生，下列何者為錯誤的生活習慣？","z":"不只愛人，還要愛地球；土地平安，人才能平安。","o":[["A","冬天使用電暖器取暖時，可在上方晾掛衣物進行烘乾。"],["B","作飯煮菜時人若要暫時離開，應先關閉瓦斯爐火。"],["C","火柴、打火機應妥善收藏，以免小孩拿取。"],["D","排煙機及風管的油污應定期清理。"]],"a":"A","e":"使用電暖器時，周遭應淨空、不要放置雜物。","s":"臺北市消防局"},{"i":4237510,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"居家使用延長線時，下列注意事項何者正確？","z":"克己，則能減少碳足跡。","o":[["A","應使用束帶將多餘長度電線綁緊收納成束，以方便收納為及避免行走時受到電線絆倒。"],["B","不要擦拭及清理電器插座插頭處，以免造成觸電受傷。"],["C","廚房中，為免忘記關常用的烤箱、微波爐等高功率電器，應接在同一延長線上，方便一次拔除插頭。"],["D","烤箱、微波爐、電暖器等高功率的電器應避免於同一延長線上使用。"]],"a":"D","e":"不要綑綁電線，避免折損及熱蓄積造成線路損壞；插座應定期清潔，避免累積灰塵棉絮等髒污；不用的電氣插頭應拔掉或將延長線電源關掉。","s":"臺北市消防局"},{"i":4237512,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"有關住宅用火災警報器裝設位置，下列敘述何者正確？","z":"生活若簡樸，人生就幸福。","o":[["A","為能夠及早偵測火災發生，應在每個室內空間中裝設偵煙式住警器。"],["B","以裝置於居室中心為原則，並距離出風口1.5公尺以上。"],["C","為避免灰塵造成住警器誤報，平時應使用塑膠外殼罩住。"],["D","安裝後都不要碰觸及檢查住警器，以避免設備損壞。"]],"a":"B","e":"住宅用火災警報器分為偵煙式及定溫式，應視空間特性選擇適當型式，如廚房等容易有產生煙霧處，應選擇定溫式，避免誤報。裝設位置應以居室中心為原則，距離出風口1.5公尺以上，避免氣流影響偵測時效。安裝後應定期(每個月1次)檢查，按下測試開關確認警報器是否正常動作。","s":"臺北市消防局"},{"i":4237513,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"地震發生時應優先採取下列何種行為，能夠減少受傷、保護自己？","z":"人心平淡，才有平安的福。","o":[["A","立即趴下至堅固桌子底下，抓住桌腳、保護頭頸部。"],["B","應立即躲到堅固的冰箱旁，使得傾倒的牆面與冰箱形成生命黃金三角，不被牆面壓到。"],["C","趕快跑出至屋外空曠處，避免被家中掉落物砸傷。"],["D","迅速打開房間房門，以免門框變形無法逃出。"]],"a":"A","e":"地震時容易因掉落物砸到而受傷，當地震發生時，立即趴下至堅固桌子底下，抓住桌腳、保護頭頸部。生命黃金三角為錯誤知識，我們無法預知地震搖晃的方式、物品或建築物倒塌的方向，就無法預知何處會產生生命黃金三角。","s":"臺北市消防局"},{"i":4237514,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"地震時為防止物品掉落、家具倒塌造成受傷，平時應做下列準備何者錯誤？","z":"只要有信心與愛心，每天都是健康與平安。","o":[["A","各項物品及重物應堆放在各櫃子上方，避免放置在地面上阻擋逃生。"],["B","可使用鏈條、支柱式、L行金屬零件固定大型家具。"],["C","易移動家具可使用裝卸式移動防止帶固定。"]],"a":"A","e":"重物應放置靠近地面處收納整齊，以避免櫥櫃重心較高容易搖晃，物品掉落時造成砸傷。","s":"臺北市消防局"},{"i":4237515,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"平時家中就要準備生活必需用品，以備不時之需，下列有關「日常儲備」概念之敘述，何者錯誤？","z":"知足則有福，不知足則招禍。","o":[["A","平時多採購備份的日常食品或生活用品，待平時使用的份量用完後，將備用品取出使用並進行補充。"],["B","須考慮家中成員的需求進行增減，如女性生理用品、尿布、奶粉等。"],["C","平時即用得到的物品、亦或是平時儘可能使用的物品，並定期檢查保存期限。"],["D","當備份用品用完時才前往一次採購，以避免過期。"]],"a":"D","e":"平時多採購備份的日常食品或生活用品，待平時使用的份量用完後，將備用品取出使用並進行補充。","s":"臺北市消防局"},{"i":4237516,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"下列有關緊急避難包之敘述，何者正確？","z":"人若不知福、不懂得感恩，只是多消福。","o":[["A","為避免在避難收容所無聊，應多準備雜誌、撲克牌及桌遊於緊急避難包中。"],["B","平時應備妥緊急避難包，當大型災害來臨後，發現居家環境不適合停留時，可隨手拿取並進行避難。"],["C","緊急避難包應收納放置在家中儲藏室或櫥櫃深處，避免遺忘放置位置。"],["D","緊急避難包應依專家學者建議，全部準備相同的內容物品，比較有所保障。"]],"a":"B","e":"平時應備妥緊急避難包，並依個人特殊需求準備物品，如奶粉、尿布、衛生棉或個人用藥等，並放置可隨手拿取並進行避難。","s":"臺北市消防局"},{"i":4237517,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"颱風來臨前，可事先做好哪些準備？","z":"天天苦惱不夠、不足，是富有的窮人。","o":[["A","購買儲備糧食及飲用水。"],["B","檢查家中陽臺排水孔有沒有堵塞。"],["C","將陽臺的盆栽移到室內。"],["D","以上皆是"]],"a":"D","e":"","s":"臺北市消防局"},{"i":4237518,"t":"臺北市環境防災教育題庫","c":"臺北市環境防災教育題庫","k":"mc","q":"颱風來臨時，該怎麼辦？","z":"如果人人能節省、惜福，貧窮就不存在。","o":[["A","利用防災假的空檔時間，前往電影院放鬆。"],["B","前往海邊，觀賞壯闊洶湧的大浪。"],["C","待在家中休息，隨時關心中央氣象局最新氣象預報。"],["D","跟朋友相約，前往KTV唱歌。"]],"a":"C 量。","z":"福從做中得歡喜，慧從善解得自在。","o":[["O","對"],["X","錯"]],"a":"X","e":"儘管「人造肉」，或稱「植物肉」掀起一波素食熱潮，更提供蔬食者食材上的新選擇，然而，人造肉、素料等仍屬於高度加工食品，製造過程中仍會消耗較多資源，建議不要過度依賴食用。減少加工品，盡量吃原型食物。https://www.greenpeace.org/taiwan/update/27437/","s":"國立臺灣師範大學環境教育研究所"},{"i":5243461,"t":"食物環保","c":"食物環保-全球","k":"tf","q":"植物食材中，咖啡及巧克力為低碳排的食物，多種植咖啡及可可豆對氣候變遷無影響。","z":"素食可培養耐力、慈悲與智慧。","o":[["O","對"],["X","錯"]],"a":"X","e":"咖啡及巧克力雖然是植物性食物，但它們每公斤產生的碳排放分別是 17 公斤及 19 公斤！原來咖啡在種植過程中，所使用的肥料會產生俗稱「笑氣」的溫室氣體一氧化二氮（nitrous oxide），其全球暖化潛力（global warming potentials, GWP）是二氣化碳的 265 倍！至於巧克力，其原材料為可可豆，在印尼、象牙海岸及巴西等地，就有大面積的熱帶雨林，被開墾成種植可可豆的農地，其「改變土地用途」所產生的碳排放量，僅次於牛肉！https://www.greenpeace.org/taiwan/update/18386/","s":"國立臺灣師範大學環境教育研究所"},{"i":5243463,"t":"時事教育","c":"時事教育-全球","k":"tf","q":"日本排放的核汙水，主要會隨著黑潮延伸流與北太平洋流，往東太平洋及美國西岸傳輸。","z":"屋寬不如心寬。","o":[["O","對"],["X","錯"]],"a":"O","e":"廢水主要會隨著黑潮延伸流與北太平洋流，往東太平洋及美國西岸傳輸。在向東傳輸的過程中，有少部分廢水會順著強勁海流兩側反向流動的渦旋向南傳送。https://ubrand.udn.com/ubrand/story/12117/7393261","s":"國立臺灣師範大學環境教育研究所"},{"i":5243464,"t":"SDGs","c":"SDGs-全球","k":"tf","q":"2015年，聯合國提出的17個永續發展目標，具備法律約束力，簽署的國家都需達成目標，否則將會進行裁罰。","z":"簡單，才真正有福；單純，才真正快樂。","o":[["O","對"],["X","錯"]],"a":"X","e":"聯合國永續發展目標是soft law－以價值與理念倡議為主，不具法律約束力，只能產生一定實際效力的國際文件。 因此，永續發展目標並沒有針對各國設定硬約束指標，也沒有規定具體的執行機構與執行方式。","s":"國立臺灣師範大學環境教育研究所"},{"i":5243465,"t":"SDGs","c":"SDGs-全球","k":"tf","q":"選用當地當季食材可以降低水的消耗量。","z":"懂得生活禮儀，就懂得愛自己；自愛的人，才會愛人。","o":[["O","對"],["X","錯"]],"a":"O","e":"在消費行為選擇較低碳足跡的商品、對環境友善的生產方式等。除了從生產與消費著手外，降低食物浪費以及在生產過程中造成的糧食損失，是SDG12欲達成的目標。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271174,"t":"淨零排放","c":"淨零排放-全球","k":"mc","q":"下列哪一種國際標準驗證與碳盤查或淨零排放無明顯關聯？","z":"物質可以貧，但是心靈、志氣不能貧。","o":[["A","ISO 22000"],["B","PAS 2060"],["C","ISO 14067"],["D","ISO 14064"]],"a":"A","e":"ISO 22000 食品安全管理標準、PAS 2060 碳中和、ISO 14067碳足跡標準、ISO 14064 溫室氣體排放查證。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271175,"t":"淨零排放","c":"淨零排放-全球","k":"mc","q":"IPCC的AR6報告指出，如果全人類能在哪一年達到淨零排放，才有可能在21世紀末讓全球溫度不超過1.5°C？","z":"清淨的生活，從齋戒開始。","o":[["A","2025"],["B","2030"],["C","2050"],["D","2077"]],"a":"C","e":"IPCC-AR6 報告指出，在 21 世紀末之前，仍有可能限制升溫程度在 1.5°C 以內，但經濟發展與能源使用需要徹底轉型。而唯一可能的路徑為「2050 淨零排放」，從大氣中捕捉二氧化碳，並將它儲存於森林、土壤、地層、海洋。去碳行動包括復林與植林、改造土壤增加吸碳量、發展生質能捕集二氧化碳，並封存於地下、強化海洋生物吸碳能力、從空氣直接捕捉並封存等。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271176,"t":"淨零排放","c":"淨零排放-全球","k":"mc","q":"碳捕獲、利用和封存(CCUS)是指在實現全球能源和氣候目標方面可以發揮且多樣化運用的技術。下列哪一個選項敘述錯誤？","z":"多一個好習慣，就少一個壞習慣。","o":[["A","捕捉從化石燃料燃燒或工業製程中產生的二氧化碳"],["B","壓縮後注入地底深處的岩層永久儲存"],["C","運用或創造成其他有價產品"],["D","使人體吸收自行產生碳循環"]],"a":"D","e":"碳捕捉、利用和封存（CCUS）是指在實現全球能源和氣候目標方面可以發揮重要且多樣化作用的一套技術。 CCUS 涉及從大型點源捕獲二氧化碳，包括使用化石燃料或生物質作為燃料的發電或工業設施。二氧化碳也可以直接從大氣中捕獲。 如果不在現場使用，捕捉的二氧化碳將被壓縮並通過管道、船舶、鐵路或卡車運輸以用於一系列應用，或注入深層地質層（包括枯竭的油氣層或鹽層），從而捕捉二氧化碳並永久封存。（IEA：https://www.iea.org/reports/about-ccus）","s":"國立臺灣師範大學環境教育研究所"},{"i":5271177,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"2023年8月24日，日本將福島核廢水排入海中，請問這些核廢水主要受到爭議的成分是碳14以及哪一種元素?","z":"盡本分，得本事。","o":[["A","氧"],["B","二氧化碳"],["C","氫"],["D","氚"]],"a":"D","e":"經過多年國內外激辯，以及數個首相來來去去，日本政府計劃在今夏將福島第一核電站儲存的超過 130 萬噸核廢水排入太平洋，引發全球關注及亞洲鄰居緊張。由於這是人類史上第一起大規模核廢水排放，爭議甚巨，其中包含食品安全、海洋污染、放射性物質影響人體健康等議題，在亞洲引起激辯。 日本鄰國及全球外環保人士憂心，將含有放射性同位素「氚」（Tritium）的核廢水排入海洋，將對全球人體健康和海洋生態造成極大風險，並嚴重影響漁業。有兩種放射性物質備受矚目——氚（tritium）和碳14（Carbon-14）——它們分別是氫和碳的放射性同位素，兩者均難以從水中分離，而同時也常見於大自然，甚至是人體。含有氚的水可稱為氚水（tritiated water）。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271178,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"河流入海口因為人類排放過多營養鹽例如氮、磷等成分，導致大量的藻類叢生，使得水中氧氣過少，容易引起動物無法呼吸而死亡的現象稱為?","z":"齋是素食，戒是規矩；珍惜自我生命，更要尊重萬物生靈。","o":[["A","海洋酸化"],["B","優養化"],["C","磯燒"],["D","過漁"]],"a":"B","e":"海洋「死亡區」（Dead Zones或譯「死亡地帶」）是因為海床缺氧造成生物無法生存，這些區域往往在大河出海口處，因為河水帶來人類產生的太多「營養」，優養化造成的。缺氧會殺死許多生物及破壞整個棲地。依照目前河川優養化速度，在 21世紀結束前，海洋死亡區將增加五成。（譯按：車輛排放的廢氣、家庭與事業廢污水、農業化肥或有機肥等排入河口，在海灣形成大量的氮或磷，超越海水可以代謝自淨的能力。氮磷的養分讓海藻大量繁殖，許多藻類有毒，加上大量吸收水中氧氣導致其他生物缺氧而死。而死去的藻類沈到水底，在腐爛的過程中又吸光了海底的氧氣，周遭生物完全不能存活，因此稱為「死亡區」。）","s":"國立臺灣師範大學環境教育研究所"},{"i":5271179,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"我們建議孕婦少吃海洋大型魚類，因為有可能累積比較多的汞汙染在海中的大型魚類或哺乳動物身上。因為透過什麼機制導致大型魚類會吃下更多的重金屬呢?","z":"若要明天平安，就要將今日做好。","o":[["A","食物鏈"],["B","遺傳"],["C","感染"],["D","爭奪"]],"a":"A","e":"毒性物質如汞，存在於大氣及海洋的濃度是極其微量（一般估計海水中的汞濃度很低，只有1~4 ng/L）左右，因此世界上只有少數幾個實驗室具有直接分析海水中汞濃度的能力。於是人類經由煉金、鹼氯工業、電池製造、使用殺蟲劑、染劑、石化燃料的燃燒、燃煤等活動大量產生的汞廢棄物及污水，不斷地排入海水中，卻因海水龐大的稀釋能力，以及高度易揮發的特性，使得海水中汞濃度些微的變化幾乎無法偵測得到。但是，這些極微量的汞會經由細菌及藻類的消化吸收作用轉化成有機汞儲存於體內，再經由食物鏈的效應，進入更高階的消費者，層層累積的結果，使得海洋中的頂端消費者，如鯊魚、鮪魚體內皆存在較高的汞濃度；而海洋哺乳動物中的齒鯨類的營養階層又有時在這些海洋動物之上，壽命亦更長，無形中便記錄了其棲息海洋環境中的汞污染情形。因此，藉由分析檢驗擱淺鯨豚屍體中的毒性物質含量，讓我們得以了解汞這一類極微量有毒污染物在海洋環境的變化情況。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271180,"t":"水資源","c":"","k":"mc","q":"生產一公斤牛肉約需要多少水?","z":"做中學，學中覺，覺中做。","o":[["A","15000公升"],["B","1000毫升"],["C","1200噸"],["D","500公升"]],"a":"A","e":"一杯咖啡需要140公升的水、1公升的牛奶需600公升的水、一公斤牛肉需要15000公升的水","s":"國立臺灣師範大學環境教育研究所"},{"i":5271181,"t":"水資源","c":"","k":"mc","q":"目前全球面臨極度缺水的人數大約多少人?","z":"能付出的人生，最快樂也最踏實。","o":[["A","17萬人"],["B","17億人"],["C","7千萬人"],["D","7兆人"]],"a":"B","e":"世界資源研究所稱，全球近三分之一人口——26億人生活在「高度缺水」的國家，其中17個國家中的17億人生活在「極度缺水」的地方。https://www.bbc.com/zhongwen/trad/world-49254681","s":"國立臺灣師範大學環境教育研究所"},{"i":5271182,"t":"水資源","c":"","k":"mc","q":"世界衛生組織建議的每人日均用水量是多少?","z":"有心要付出，就有無限的能力。","o":[["A","110公升"],["B","110毫升"],["C","100噸"],["D","無限制"]],"a":"A","e":"世界衛生組織 每人日均用水量110公升。https://www.seinsights.asia/article/9145","s":"國立臺灣師範大學環境教育研究所"},{"i":5271183,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"目前全球空氣污染最嚴重的區域是？","z":"能先付出愛心，就能得無數人的愛。","o":[["A","非洲"],["B","亞洲"],["C","拉丁美州"],["D","歐洲"]],"a":"B","e":"https://www.iqair.com/tw/world-air-quality-ranking","s":"國立臺灣師範大學環境教育研究所"},{"i":5271184,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"2022年空氣品質指數符合世界衛生組織ＷＨＯ標準的國家或區域是？","z":"為自己找藉口，就不會進步。","o":[["A","印度"],["B","巴基斯坦"],["C","布吉納法索"],["D","格瑞那達"]],"a":"D","e":"根據瑞士空氣清淨科技公司IQAir數據報告，2022年全球只有13個國家和地區（六個國家：澳大利亞、愛沙尼亞、芬蘭、格瑞那達、冰島和紐西蘭，以及太平洋和加勒比海的七個區域：關島、波多黎各）的空氣質量列為“健康”。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271185,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"全球最大的空氣品質管制區在哪裡？","z":"保護大地，需從建設人心開始。","o":[["A","日本橫濱"],["B","德國柏林"],["C","英國倫敦"],["D","台灣西濱"]],"a":"C","e":"https://www.bloomberg.com/news/articles/2023-08-29/ulez-expansion-impact-what-data-shows-on-ev-adoption-and-air-pollution#xj4y7vzkg","s":"國立臺灣師範大 ","種族歧視"]],"a":"A","e":"AI 取代人類與演員薪資問題是這次罷工的最大爭議點。參考資料：https://www.gq.com.tw/article/%E7%BE%8E%E5%9C%8B%E6%BC%94%E5%93%A1%E5%B7%A5%E6%9C%83-%E7%BD%B7%E5%B7%A5","s":"國立臺灣師範大學環境教育研究所"},{"i":5271207,"t":"SDGs","c":"SDGs-全球","k":"mc","q":"聯合國設定的SDGs達成期限是哪一年?","z":"知足則有福，不知足則招禍。","o":[["A","2030"],["B","2035"],["C","2040"],["D","2050"]],"a":"A","e":"","s":""},{"i":5271208,"t":"SDGs","c":"SDGs-全球","k":"mc","q":"依據世界經濟論壇所發布的《2023 年全球性別差距報告》，性別平等得分最高的國家是哪一個國家?","z":"人若不知福、不懂得感恩，只是多消福。","o":[["A","阿富汗"],["B","冰島"],["C","日本"],["D","澳洲"]],"a":"B","e":"依據世界經濟論壇所發布的《2023 年全球性別差距報告》，冰島已連續14年被評選為「全球性別最平等」國家。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271209,"t":"SDGs","c":"SDGs-全球","k":"mc","q":"SDG的哪一項目標旨在建設包容、安全、具防災能力與永續的城市和人類住區?","z":"天天苦惱不夠、不足，是富有的窮人。","o":[["A","SDG 10 減少不平等"],["B","SDG 11 永續城鄉"],["C","SDG 16 和平、正義及健全制度"],["D","SDG 17 多元夥伴關係"]],"a":"B","e":"","s":""},{"i":5271210,"t":"淨零排放","c":"淨零排放-全球","k":"mc","q":"淨零排放與下列何項永續發展目標最相關?","z":"如果人人能節省、惜福，貧窮就不存在。","o":[["A","SDG3"],["B","SDG5"],["C","SDG13"],["D","SDG16"]],"a":"C","e":"SDG13為氣候行動，與淨零排放最相關。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271211,"t":"淨零排放","c":"淨零排放-全球","k":"mc","q":"下列何種氣體不是溫室氣體?","z":"簡樸的人生是美德。","o":[["A","二氧化碳"],["B","甲烷"],["C","臭氧"],["D","氮氣"]],"a":"D","e":"氮氣非溫室氣體。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271212,"t":"淨零排放","c":"淨零排放-全球","k":"mc","q":"以下哪一個作為對淨零排放目標達成沒有幫助？","z":"能過清淡生活，最知足；有餘力幫助他人，最富有。","o":[["A","發展碳捕捉技術"],["B","禁止使用化石燃料"],["C","使用再生能源"],["D","禁止使用核能發電"]],"a":"D","e":"2021年6月底，國際能源總署（IEA）發布最新報告《核電與安全能源轉型報告》（Nuclear power and secure energy transitions: From today's challenges to tomorrow's clean energy systems），指出全球要在2050年達到淨零碳排，核能發電量需從今年的 413GW 成長到 2050年的 812GW，才有望達成。參考資料：https://esg.gvm.com.tw/article/8732","s":"國立臺灣師範大學環境教育研究所"},{"i":5271213,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"可造成海洋汙染的物質不包括以下何者？","z":"用感恩心疼惜大地萬物，生活簡單就無缺。","o":[["A","重金屬"],["B","石油"],["C","PM2.5"],["D","塑膠"]],"a":"C","e":"漂浮在空氣中類似灰塵的粒狀污染物質稱為「懸浮微粒」（particulate matter，PM），微粒直徑小於或等於 2.5 微米（μm）的粒子，就稱為「PM2.5」。空氣污染，特別是細懸浮微粒（PM2.5）的污染，是世界各地當前共同面對的嚴重議題。參考資料：綠色和平組織網站","s":"國立臺灣師範大學環境教育研究所"},{"i":5271214,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"去海邊玩時，以下那一個物品的使用會「無形中廣泛的」傷害海洋環境？","z":"清清淡淡地生活，自然就平平安安。","o":[["A","防曬乳"],["B","毛巾"],["C","太陽眼鏡"],["D","陽傘"]],"a":"A","e":"由於不同的防曬乳活性成分化學結構和性質差別很大，因此它們對海洋生物的影響也不盡相同。有些活性成分對海洋生物並沒有明顯的影響，但另外一些則具有較強的毒性。例如有研究表明，磺異苯酮和氧苯酮這兩種結構具有一定相似性的防曬乳活性成分。其中氧苯酮的毒性要大得多，目前環境中探測到的每公升幾十奈克的濃度已經能夠對海洋生物造成一定的影響 。還有一些防曬乳中的活性成分的化學結構與生物體內某些激素相似，因此有可能干擾生物正常的生理機能。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271215,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"2023年3月3日聯合國正式通過《全球海洋公約》，其中的「30x30」目標是指在2030年以前保護什麼？","z":"改變習氣是在一念間，總是不改就會放在心裡不斷掙扎；只要克服一剎那的心態，說改就改就會湧現生命的價值感。","o":[["A","30萬種海洋生物"],["B","30兆的海洋經濟產值"],["C","30個國家的海洋環境"],["D","30%的全球海洋面積"]],"a":"D","e":"《全球海洋公約》是指於聯合國磋商並根據《聯合國海洋法公約》的規定，就「國家管轄範圍以外海洋生物多樣性」（Biodiversity Beyond National Jurisdiction, BBNJ）的保育和永續利用問題，擬定的一份具有法律約束力的國際文書。綠色和平聯同英國牛津大學、約克大學率領的科學研究團隊，於 2019 年發表《30x30 海洋保護藍圖》，目標為致力於推動 2030 年前保護至少 30％ 海洋的目標，即 30x30 之意。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271216,"t":"水資源","c":"水資源-全球","k":"mc","q":"地球所有淡水中有多少比例可供人類使用？","z":"改除習氣不是要求別人改變，能夠改除自身習氣，也是自我成就。","o":[["A","1%"],["B","5%"],["C","10%"],["D","20%"]],"a":"A","e":"地球的淡水有69%被冰川和極地冰帽凍結，另外30%以地下水的形式存在，因此只有1%可以供人使用。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271217,"t":"水資源","c":"","k":"mc","q":"以下哪一項不是水資源管理中水庫的目的？","z":"該做的沒做，會後悔；不該做的做了，應懺悔。","o":[["A","儲水供休閒使用"],["B","調節水溫"],["C","洪水控制"],["D","水力發電"]],"a":"B","e":"水庫有各種不同的用途，例如水灌溉、防洪、休閒娛樂、水力發電等等。然而，調節水溫並不是其中之一。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271218,"t":"水資源","c":"","k":"mc","q":"下列地球的各種水體中，淡水含量最多的是?","z":"不想缺少什麼，想想擁有什麼，就會有幸福感。","o":[["A","湖泊"],["B","地下水"],["C","內陸海與鹹水湖"],["D","冰川與極區"]],"a":"D","e":"全球水量＝海水（97％）＋陸地上的水（3％）。 陸地上的水＝冰雪（77％）＋地下水（22％）＋其他（1％）。 其他＝鹹水湖、內陸海＋土壤中的水分＋大氣中的水氣＋河川、湖泊。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271219,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"以下何者不是人為空氣汙染的主要來源?","z":"心中的愛多一點，貪欲就會少一點；感恩多一點，爭執就會少一點。","o":[["A","汽車"],["B","工廠"],["C","火力發電廠"],["D","下水道"]],"a":"D","e":"空氣汙染源包含固定汙染源及移動汙染源，常見的固定汙染源是工廠及製造業的排放，而常見的移動汙染源有汽機車、公車等移動的運輸工具。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271220,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"請問空氣品質指標(Air Quality Index, AQI)中 PM 2.5、PM 10 使用的\"PM\"全名是什麼?","z":"培養人格，不能說而不做；言行合一，才能影響他人。","o":[["A","pollutes material"],["B","partical material"],["C","particulate matter"],["D","pico-matter"]],"a":"C","e":"PM 2.5、PM 10 使用的\"PM\"全名為particulate matter，中文為懸浮微粒。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271221,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"在地表附近的臭氧是一種空氣汙染物，會影響人體呼吸系統健康，請問通常在哪一種情形下產生的臭氧濃度最高？","z":"能做而不做，辜負的是自己生命的使用權。","o":[["A","春季或夏季天氣晴朗時，且空氣流動率低。"],["B","秋季或冬季天氣晴朗時，且空氣流動率低。"],["C","春季或夏季天氣晴朗時，且空氣流動率高。"],["D","秋季或冬季天氣陰鬱時，且空氣流動率低。"]],"a":"A","e":"地表臭氧是二氧​​化氮和其他化學物質與陽光反應時形成的空氣污染物 。臭氧季節是指一年中大氣中臭氧濃度升高的時期：通常是在春季和夏季，天氣晴朗且空氣流動率低時。參考資料：https://www.londonair.org.uk/londonair/guide/FirstOzone.aspx","s":"國立臺灣師範大學環境教育研究所"},{"i":5271222,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列哪項企業的作為，不符合循環經濟商業模式？","z":"日食八分飽，二分助人好。","o":[["A","使用可生物分解原料"],["B","出租產品代替直接販售"],["C","降低產品的使用年限"],["D","建立舊產品回收管道"]],"a":"C","e":"提高產品的生命週期，使一個產品能使用比較久才符合循環經濟商業模式。選項中的「出租產品代替直接販售」屬於循環經濟模式中的「產品服務化（Product-as-a-Service）」，消費者不需要真正獲得產品的擁有權，而是在租約期間得到產品的服務，如此企業不需過度生產也能盈利，並且能掌控使用後產品的流向。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271223,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列哪一個關於食物的作為，是從減少食物的浪費的角度來達到循環經濟？","z":"心靈淨化是最徹底的環保，少欲知足就能改變生活習慣，保護自然環境免於受到無盡開發的破壞。","o":[["A","管理型放牧"],["B","採用再生農法"],["C","打折販售即期食品"],["D","有機廢棄物化成肥料"]],"a":"C","e":"透過以下三個策略可以增加土壤碳封存並減低供應鏈的排放：重新設計種植與養殖模式、在各階段減少食物浪費和將廢棄物作為其他資源。其中打折販售即期食品，吸引消費者購買，可以減少食物的浪費。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271224,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列哪一個不是循環經濟的模式？","z":"環保，不但是疼惜物命，也是尊重生命。","o":[["A","以租代買"],["B","重複使用"],["C","減少廢棄物產生"],["D","一次性包裝"]],"a":"D","e":"在選購生活用品時，可嘗試無塑商店，自備容器更環保。同時鼓勵業者採用循環經濟的模式，考慮重複使用、以租代買將產品服務化。https://www.greenpeace.org/taiwan/update/37435/循環經濟是什麼？比回收更重要的是？/","s":"國立臺灣師範大學環境教育研究所"},{"i":5271226,"t":"災害防救","c":"災害防救-全球","k":"mc","q":"已經將熱水器安裝於室外陽台的情況下，下列行為何者會增加一氧化碳中毒的機會?","z":"回收資源是惜福，再製造利用是造福。","o":[["A","將水龍頭轉至最底，洗最燙的熱水"],["B","洗澡開窗增加空氣流通"],["C","於陽台晾掛大量衣物"],["D","不安裝半封閉式鐵窗"]],"a":"C","e":"於陽台晾掛大量衣物，會導致安裝在陽台上的熱水器阻礙通風，可能導致一氧化碳中毒。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271227,"t":"災害防救","c":"災害防救-全球","k":"mc","q":"下列何者不是造成土石流的三大要素?","z":"環保就是惜物愛人，不只要用心回收有形的資源，更要珍惜時間、空間、人與人之間，把握當下付出愛。","o":[["A","豐富的堆積物"],["B","足夠的坡度"],["C","充份之水分"],["D","溪谷間種植樹林"]],"a":"D","e":"土石流三大要素為豐富的堆積物、足夠的坡度、充份之水分，在溪谷間種植樹林為輸送段治理，以樹林為緩衝區，使土石流在大片林木的阻礙下停滯堆積，避免土石流直接侵襲。https://246.swcb.gov.tw/Info/Debris_Introductionn","s":"國立臺灣師範大學環境教育研究所"},{"i":5271228,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"回收什麼塑膠材質，可再製成環保袋、環保衣、環保帽及環保鞋等?","z":"彎腰「做」環保——身體力行；挺腰「說」環保——推廣帶動。","o":[["A","PVC"],["B","PP"],["C","PS"],["D","PET"]],"a":"D","e":"市面上常見的礦泉水、汽水或茶飲等寶特瓶，特徵：透明、質地輕盈、瓶底有一顆圓點，耐熱溫度：60～85 °C，不可加熱，不建議多次使用，回收處理過的PET通常會再製成環保袋及環保衣等。https://esg.businesstoday.com.tw/article/category/187312/post/202109010033/","s":"國立臺灣師範大學環境教育研究所"},{"i":5271229,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"玻璃因為何種特性，無法被當作一般垃圾處理，須個別回收?","z":"做環保不僅能呵護地球，也可以回收自己，再造清淨的人品。","o":[["A","質地脆弱"],["B","容易燃燒"],["C","不易腐化"],["D","容易分解"]],"a":"C","e":"玻璃是將石英（SiO2，砂的主要成分）混合了定量的碳酸鈉與碳酸鉀後，在 1,500 °C 熔煉爐中燒製而成的，是一種透明、高硬度的材料，具有成分安定的特性，所以許多化學會使用玻璃瓶來盛裝。但也是因為不易腐化的特性，如果將廢玻璃作為垃圾處理，無論是掩埋或是焚化，都無法很有效的處理廢玻璃，玻璃碎片將成為土壤中難以分解的物質。https://pansci.asia/archives/336925","s":"國立臺灣師範大學環境教育研究所"},{"i":5271230,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"垃圾問題最理想的解決辦法是以","z":"環保應從心啓動，進而雙手推動、雙腳行動，形成愛的循環。","o":[["A","掩埋方式"],["B","焚化爐焚燒方式"],["C","垃圾源頭減量方式"],["D","改用生物可分解塑膠"]],"a":"C","e":"根據統計，全球從 1950 年開始所製造的塑膠產品，至今有超過 90% 沒有被回收。回收是廢棄物處理的重要一環，但只依賴回收，完全無法趕上塑膠被製造出來、使用與拋棄的速度。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271231,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"全球暖化造成位於北極圈的永凍土正在融化，融化過程中會影響自然界哪一項物質循環，加速氣候變遷，讓地球暖化惡性循環?","z":"生活多一點簡單，心靈多一分歡喜。","o":[["A","氮循環"],["B","碳循環"],["C","水循環"],["D","硫循環"]],"a":"B","e":"永凍土融化將釋放出所封存的碳，加速氣候變遷，讓地球暖化惡性循環。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271232,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"京都議定書管制的溫室氣體，不包含下列何者？","z":"無貪最富足，有德富有餘。","o":[["A","水蒸氣"],["B","六氟化硫"],["C","二氧化碳"],["D","甲烷"]],"a":"A","e":"京都議定書裡所管制的溫室氣體包括6種：人為排放之二氧化碳、甲烷、氧化亞氮、氟化烴、全氟化碳、六氟化硫。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271233,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"2023年9月，香港和紐約先後因暴雨襲擊而進入緊急狀態，下列敘述何者與全球各處旱澇交替出現無關？","z":"愛惜物命、節省消費，也是為子孫多積一分福。","o":[["A","都市建築物密度過高"],["B","全球暖化增加大氣中水蒸氣含量，導致猛烈降雨更常發生"],["C","高溫下，地表被烤乾，難以吸收降雨濕氣，無法吸收的水分在地面形成逕流，造成洪水"],["D","氣候變遷加劇聖嬰現象"]],"a":"A","e":"近年來，全球各地諸如印度、尼泊爾、肯亞、孟加拉、日本、中國，均發生過嚴重水患，上百萬人無家可歸，發生地點不見得都在都市，主要原因都是極端氣候影響。","s":"國立臺灣師範大學環境教育研究所"},{"i":5271234,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列四個日常生活，哪一種選項相對碳排量低？","z":"浪費資源，是造惡業；勤儉布施，是造福德。","o":[["A","1枝冰淇淋"],["B","看1小時電視"],["C","1份牛排"],["D","500mL瓶裝水"]],"a":"B","e":"看1小時電視 碳排放量為10-100公克；1枝冰淇淋、500mL瓶裝水，碳排放量都是100公克-1公斤；1份牛排碳排放量為1公斤-10公斤。參考資料：https://e-info.org.tw/node/232155","s":"國立臺灣師範大學環境教育研究所"},{"i":5271235,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列哪一種燈泡的耗能最低？","z":"不輕視一粒米，不浪費一滴水，則能富有餘。","o":[["A","白熾燈泡"],["B","鹵素燈泡"],["C","省電燈泡"],["D","LED燈泡"]],"a":"D","e":"白熾燈泡（鎢絲燈泡）：傳統電燈泡，發光效率低、較耗電且壽命短，約1000個小時。鹵素燈泡（石英燈泡）：白熾燈泡的變種，壽命、發光效率皆有提高，使用壽命約白熾燈泡的4倍。省電燈泡（一體式螢光燈）：含有有毒的汞，尺寸和白熾燈泡相近，燈座介面相同可直接更換，省電且壽命較長，為白熾燈泡8到15倍，分成螺旋狀和柱狀，柱狀就是一般常見的日光燈管。LED燈泡（發光二極體）：相對用電少、壽命長，散熱合宜壽命可達30000小時，可以調校出多種顏色，用途也較廣，但價格較其他燈泡高。https://esg.businesstoday.com.tw/article/category/180687/post/202011180069/","s":"國立臺灣師範大學環境教育研究所"},{"i":5271236,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"使用電腦時，哪一項做法有助於節能？","z":"愛惜物命，不只是珍惜平時使用的物品，人物及動物等生命體也是「物」，都要用愛疼惜。","o":[["A","採用休眠模式或關機"],["B","使用螢幕保護程式"],["C","調高螢幕亮度"],["D","保持開機狀態"]],"a":"A","e":"在光亮的戶外調高電腦螢幕亮度，也是耗電、增熱的一大主因。https://www.asus.com/tw/support/FAQ/1044624/#:~:text=%E7%95%B6%E9%9B%BB%E8%85%A6%E9%80%B2%E5%85%A5%E7%9D%A1%E7%9C%A0%E7%8B%80%E6%85%8B,%E9%9B%BB%E8%85%A6%E8%9E%A2%E5%B9%95%E4%BE%86%E5%96%9A%E9%86%92%E9%9B%BB%E8%85%A6%E3%80%82","s":"國立臺灣師範大學環境教育研究所"},{"i":5271237,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"用來比較食物碳足跡的指數為?","z":"地球資源有限，唯有向全民推動樸實勤勞的精神，改變過度消費、玩樂的行為，才能「固本」保護地球資源。","o":[["A","草莓指數"],["B","西瓜指數"],["C","香蕉指數"],["D","番茄指數"]],"a":"C","e":"2023年，隨著永續和減碳從願景觀念，逐漸成為能夠落實到生活的行動，《經濟學人》再推出討論永續的「香蕉指數」。讓一般民眾更清楚地計算：選擇吃哪一種食物，碳排放量影響更小？對於那些有消費永續行動的民眾，期許成為一個實用的指標。之所以選擇香蕉，原因有二：香蕉對氣候的影響、營養價值，在常見的食物中都居於中間位置，所以很適合當作基礎指標。https://esg.gv // ---------- 紀錄（存在瀏覽器；拿不到也能照常使用） ----------
// 每個學生（班級＋座號）一份：錯題本、進度、成績紀錄。共用電腦也不會混在一起。
const STORE_KEY = 'pagamo_practice_v2';
const store = (() => {
  let s = { cur: '', pick: null, profiles: {} };
  try { s = Object.assign(s, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) {}
  try {  // 舊版（v1）的紀錄搬到「訪客」
    const old = JSON.parse(localStorage.getItem('pagamo_practice_v1') || 'null');
    if (old && !s.profiles['']) s.profiles[''] = { info: null, wrong: old.wrong || {}, stats: old.stats || {}, records: [] };
  } catch (e) {}
  return s;
})();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
function P() {  // 目前的學生（沒填＝訪客 ''）
  const k = store.cur || '';
  if (!store.profiles[k]) store.profiles[k] = { info: null, wrong: {}, stats: {}, records: [] };
  return store.profiles[k];
}
function toast(msg, ms = 2600) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), ms);
}

// 檢查碼：讓老師看得出檔案有沒有被改過（防一般修改，不是加密）
const SALT = 'csps-pagamo-practice';
function fnv(str) {
  let h = 0x811c9dc5;
  for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return ('0000000' + h.toString(16)).slice(-8);
}
const csvCell = v => { v = String(v ?? ''); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const CSV_HEAD = ['班級', '座號', '姓名', '完成時間', '模式', '主題', '題型', '題數', '答對', '分數', '用時秒', '答錯題號', '作答明細', '檢查碼'];

function exportScores() {
  const p = P();
  if (!p.info) { askMe(); return; }
  if (!p.records.length) { toast('還沒有完成的紀錄，先做一回練習或測驗吧 🍀'); return; }
  const { cls, seat, name } = p.info;
  const lines = [CSV_HEAD.join(',')];
  p.records.forEach(r => {
    const f = [cls, seat, name, r.time, r.mode, r.topics, r.type, r.n, r.right, r.pct, r.sec, r.wrongIds, r.detail];
    lines.push(f.concat([fnv(SALT + '|' + f.join('|'))]).map(csvCell).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  a.download = `成績_${cls}班${String(seat).padStart(2, '0')}號_${name}_${ymd}.csv`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(`已下載 ${a.download}（${p.records.length} 回紀錄），交給老師就完成囉 ✨`, 4000);
}

// ---------- 小工具 ----------
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const show = id => ['home', 'quiz', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id));
const byId = Object.fromEntries(DATA.q.map(q => [q.i, q]));
const CHEER_OK = ['答對了！🎉', '太棒了！✨', '好厲害！🌟', '正確！🍬', '完全正確！🌸'];
const CHEER_BAD = ['再想想看 🍀', '差一點點！💪', '沒關係，記起來就好 🌙'];

// ---------- 首頁 ----------
let picked = new Set(store.pick && store.pick.length ? store.pick : DATA.topics.map(t => t.name));
let optCount = 20, optType = 'all';

function topicStats(name) {
  const qs = DATA.q.filter(q => q.t === name);
  let done = 0;
  qs.forEach(q => { const s = P().stats[q.i]; if (s && s[1] > 0) done++; });
  return { n: qs.length, done };
}

function drawHome() {
  $('sub').textContent = `共 ${DATA.q.length} 題｜題庫更新：${DATA.built}`;
  const box = $('topics'); box.innerHTML = '';
  DATA.topics.forEach(t => {
    const st = topicStats(t.name);
    const d = el('div', 'topic' + (picked.has(t.name) ? ' on' : ''));
    d.append(el('div', 'name', (picked.has(t.name) ? '🌸 ' : '') + t.name));
    d.append(el('div', 'meta', `${st.n} 題・答對過 ${st.done} 題`));
    const bar = el('div', 'bar'); const i = el('i'); i.style.width = (st.n ? st.done / st.n * 100 : 0) + '%'; bar.append(i); d.append(bar);
    d.onclick = () => { picked.has(t.name) ? picked.delete(t.name) : picked.add(t.name); store.pick = [...picked]; save(); drawHome(); };
    box.append(d);
  });
  const n = pool().length;
  $('pickCount').textContent = `（已選 ${picked.size} 個主題，${n} 題）`;
  const w = Object.keys(P().wrong).filter(k => byId[k]).length;
  $('wrongN').textContent = `（${w} 題）`;
  $('goWrong').disabled = w === 0;
  $('goPractice').disabled = $('goTest').disabled = n === 0;
  $('foot').textContent = '題目、正解與詳解來自 PaGamO 慈濟環境與防災教育題庫，僅供校內練習使用';
  drawMe();
}

// ---------- 我是誰 ----------
const MODE_NAME = { practice: '練習', test: '測驗', wrong: '錯題本' };
function drawMe(editing) {
  const p = P();
  const edit = editing || !p.info;
  $('meEdit').classList.toggle('hidden', !edit);
  $('meShow').classList.toggle('hidden', edit);
  $('meCancel').classList.toggle('hidden', !p.info);
  if (edit) {
    if (p.info) { $('inCls').value = p.info.cls; $('inSeat').value = p.info.seat; $('inName').value = p.info.name; }
    return;
  }
  const { cls, seat, name } = p.info;
  $('meWho').textContent = `🌸 ${cls} 班 ${seat} 號 ${name}`;
  const box = $('recBox'); box.innerHTML = '';
  const recs = p.records.slice(-5).reverse();
  if (!recs.length) { box.append(el('div', 'hint', '還沒有紀錄。做完一回練習或測驗就會記下成績 ✨')); return; }
  const t = el('table', 'rec');
  const hr = el('tr'); ['時間', '模式', '題數', '答對', '分數'].forEach(h => hr.append(el('th', 'hint', h))); t.append(hr);
  recs.forEach(r => {
    const tr = el('tr');
    [r.time.slice(5, 16), MODE_NAME[r.mode] || r.mode, r.n, r.right, r.pct + ' 分'].forEach(v => tr.append(el('td', '', v)));
    t.append(tr);
  });
  box.append(t);
  box.append(el('div', 'hint', `共 ${p.records.length} 回紀錄（這裡顯示最近 5 回）`));
}
function askMe() {
  drawMe(true);
  $('meCard').classList.remove('need'); void $('meCard').offsetWidth; $('meCard').classList.add('need');
  $('meCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('inCls').focus();
  toast('請先填班級、座號、姓名 🎀');
}
$('meOk').onclick = () => {
  const cls = $('inCls').value.trim(), seat = $('inSeat').value.trim().replace(/^0+(?=\d)/, ''), name = $('inName').value.trim();
  if (!cls || !seat || !name) { toast('班級、座號、姓名都要填喔 🎀'); return; }
  if (!/^\d{1,3}$/.test(seat)) { toast('座號請填數字 🎀'); return; }
  const key = `${cls}-${seat}`;
  if (!store.profiles[key]) store.profiles[key] = { info: null, wrong: {}, stats: {}, records: [] };
  store.profiles[key].info = { cls, seat, name };
  store.cur = key; save();
  toast(`嗨，${name}！之後的成績都會記在你的名下 ✨`);
  drawHome();
};
$('meCancel').onclick = () => drawMe(false);
$('meChange').onclick = () => { $('inCls').value = $('inSeat').value = $('inName').value = ''; drawMe(true); $('inCls').focus(); };
['inCls', 'inSeat', 'inName'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('meOk').click(); }));
$('exportBtn').onclick = exportScores;
$('exportBtn2').onclick = exportScores;

function pool() {
  return DATA.q.filter(q => picked.has(q.t) && (optType === 'all' || q.k === optType));
}

function seg(id, cb) {
  $(id).querySelectorAll('button').forEach(b => b.onclick = () => {
    $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset.v); drawHome();
  });
}
seg('segCount', v => optCount = +v);
seg('segType', v => optType = v);
$('allOn').onclick = () => { picked = new Set(DATA.topics.map(t => t.name)); store.pick = [...picked]; save(); drawHome(); };
$('allOff').onclick = () => { picked.clear(); store.pick = []; save(); drawHome(); };
$('resetAll').onclick = e => {
  e.preventDefault();
  if (confirm('要清除「' + (P().info ? P().info.name : '訪客') + '」的錯題本和答題進度嗎？（成績紀錄會保留）')) { P().wrong = {}; P().stats = {}; save(); drawHome(); }
};

// ---------- 作答 ----------
let S = null; // 這一輪的狀態

function start(mode, list) {
  let qs = shuffle(list.slice());
  if (mode !== 'wrong' && optCount > 0) qs = qs.slice(0, optCount);
  if (!qs.length) return;
  S = { mode, qs, idx: 0, right: 0, answered: false, wrongs: [], picks: {}, t0: Date.now(),
        topics: mode === 'wrong' ? '錯題本' : [...picked].join('、'), type: { all: '全部', tf: '是非', mc: '選擇' }[optType] };
  show('quiz'); drawQ();
}
$('goPractice').onclick = () => start('practice', pool());
$('goTest').onclick = () => { if (!P().info) { askMe(); return; } start('test', pool()); };
$('goWrong').onclick = () => start('wrong', Object.keys(P().wrong).map(k => byId[k]).filter(Boolean));
$('quit').onclick = () => { if (!S || S.idx === 0 || confirm('要結束這一輪回到首頁嗎？')) { S = null; show('home'); drawHome(); } };

function drawQ() {
  const q = S.qs[S.idx];
  S.answered = false;
  $('qPos').textContent = `第 ${S.idx + 1} / ${S.qs.length} 題`;
  $('qTopic').textContent = q.c || q.t;
  $('qScore').textContent = S.mode === 'test' ? '📝 測驗中' : `答對 ${S.right}`;
  $('prog').style.width = (S.idx / S.qs.length * 100) + '%';
  $('qText').textContent = q.q;
  $('qQuote').textContent = q.z ? '💬 ' + q.z : '';
  $('qQuote').classList.toggle('hidden', !q.z);
  const box = $('opts'); box.innerHTML = '';
  box.className = 'opts' + (q.k === 'tf' ? ' tf' : '');
  q.o.forEach(([pos, text], n) => {
    const b = el('button', 'opt');
    b.dataset.pos = pos;
    if (q.k === 'tf') {
      b.textContent = pos === 'O' ? '⭕ 對' : '❌ 錯';
    } else {
      b.append(el('span', 'key', pos), el('span', '', text));
    }
    b.onclick = () => answer(pos);
    box.append(b);
  });
  $('fb').classList.add('hidden');
  $('next').classList.add('hidden');
  $('qCard').classList.remove('pop'); void $('qCard').offsetWidth; $('qCard').classList.add('pop');
}

function answer(pos) {
  if (S.answered) return;
  S.answered = true;
  const q = S.qs[S.idx];
  const ok = pos === q.a;
  S.picks[q.i] = pos;
  const st = P().stats[q.i] || [0, 0]; st[0]++; if (ok) st[1]++; P().stats[q.i] = st;
  if (ok) { S.right++; if (P().wrong[q.i]) delete P().wrong[q.i]; }
  else { P().wrong[q.i] = (P().wrong[q.i] || 0) + 1; S.wrongs.push(q); }
  save();
  const btns = [...$('opts').children];
  btns.forEach(b => b.disabled = true);
  if (S.mode === 'test') {
    btns.find(b => b.dataset.pos === pos).classList.add('picked');
    setTimeout(next, 350);
    return;
  }
  btns.forEach(b => {
    if (b.dataset.pos === q.a) b.classList.add('correct');
    else if (b.dataset.pos === pos) b.classList.add('wrong');
  });
  const fb = $('fb'); fb.innerHTML = '';
  fb.className = 'feedback pop ' + (ok ? 'ok' : 'bad');
  const ansText = q.k === 'tf' ? (q.a === 'O' ? '⭕ 對' : '❌ 錯') : `${q.a}．${(q.o.find(o => o[0] === q.a) || ['', ''])[1]}`;
  fb.append(el('div', 'title', ok ? pick(CHEER_OK) : `${pick(CHEER_BAD)}　正確答案：${ansText}`));
  if (q.e) fb.append(el('div', '', '📖 ' + q.e));
  if (q.s) fb.append(el('div', 'src', '出處：' + q.s));
  $('qScore').textContent = `答對 ${S.right}`;
  $('next').classList.remove('hidden');
  $('next').textContent = S.idx + 1 < S.qs.length ? '下一題 ➜' : '看結果 🎀';
  $('next').focus();
}
const pick = a => a[Math.floor(Math.random() * a.length)];

function next() {
  if (S.idx + 1 < S.qs.length) { S.idx++; drawQ(); } else { finish(); }
}
$('next').onclick = next;

document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden') || !S) return;
  if (S.answered) {
    if ((e.key === 'Enter' || e.key === ' ') && !$('next').classList.contains('hidden')) { e.preventDefault(); next(); }
    return;
  }
  const q = S.qs[S.idx];
  let k = e.key.toUpperCase();
  if (q.k === 'tf') {
    if (k === '1') k = 'O'; if (k === '2') k = 'X';
    if (k === 'O' || k === 'X') answer(k);
  } else {
    if ('1234'.includes(k) && k) k = 'ABCD'[+k - 1];
    if (q.o.some(o => o[0] === k)) answer(k);
  }
});

// ---------- 結果 ----------
function finish() {
  $('prog').style.width = '100%';
  const n = S.qs.length, pct = Math.round(S.right / n * 100);
  $('pct').textContent = pct + ' 分';
  $('stars').innerHTML = '';
  const nStar = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  for (let i = 0; i < 3; i++) { const s = el('span', i < nStar ? 'bounce' : '', i < nStar ? '⭐' : '☆'); s.style.animationDelay = (i * .15) + 's'; $('stars').append(s); }
  $('sumText').textContent = `${n} 題答對 ${S.right} 題` + (pct === 100 ? '，全對！太厲害了 🎉' : pct >= 70 ? '，很棒喔 ✨' : '，答錯的已經放進錯題本，再練一次吧 🍀');
  // 記錄成績（有填班級座號姓名才記）
  const p = P();
  if (p.info) {
    const d = new Date(), z = v => String(v).padStart(2, '0');
    p.records.push({
      time: `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`,
      mode: MODE_NAME[S.mode], topics: S.topics, type: S.type, n, right: S.right, pct,
      sec: Math.round((Date.now() - S.t0) / 1000),
      wrongIds: S.wrongs.map(q => q.i).join(' '),
      detail: S.qs.map(q => `${q.i}:${S.picks[q.i] || '-'}:${S.picks[q.i] === q.a ? 1 : 0}`).join(' ')
    });
    save();
    $('savedNote').textContent = `✅ 已記錄在 ${p.info.cls} 班 ${p.info.seat} 號 ${p.info.name} 的成績裡（共 ${p.records.length} 回）`;
  } else {
    $('savedNote').textContent = '這一回沒有記錄成績：回首頁填好班級、座號、姓名，之後的成績才會記下來';
  }
  $('exportBtn2').classList.toggle('hidden', !p.info);
  $('redoWrong').classList.toggle('hidden', S.wrongs.length === 0);
  const box = $('wrongList'); box.innerHTML = '';
  box.classList.toggle('hidden', S.wrongs.length === 0);
  if (S.wrongs.length) {
    box.append(el('h2', '', `🎀 這次答錯的 ${S.wrongs.length} 題（點開看詳解）`));
    S.wrongs.forEach(q => {
      const d = el('details', 'wq');
      d.append(el('summary', '', q.q));
      const mine = S.picks[q.i];
      const txt = p => q.k === 'tf' ? (p === 'O' ? '⭕ 對' : '❌ 錯') : `${p}．${(q.o.find(o => o[0] === p) || ['', ''])[1]}`;
      d.append(el('div', '', '你的答案：' + txt(mine)));
      d.append(el('div', 'ans', '正確答案：' + txt(q.a)));
      if (q.e) d.append(el('div', '', '📖 ' + q.e));
      if (q.s) d.append(el('div', 'hint', '出處：' + q.s));
      box.append(d);
    });
  }
  show('result');
  S.done = true;
}
$('again').onclick = () => start(S.mode, S.mode === 'wrong' ? Object.keys(P().wrong).map(k => byId[k]).filter(Boolean) : pool());
$('redoWrong').onclick = () => start('wrong', S.wrongs.slice());
$('toHome').onclick = () => { show('home'); drawHome(); };

drawHome();
</script>
</body>
</html>
