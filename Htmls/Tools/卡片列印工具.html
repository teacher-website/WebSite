<html lang="zh-TW"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片列印工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #printSection, #printSection * {
                visibility: visible;
            }
            #printSection {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
            .print-page {
                page-break-after: always;
                margin: 0;
                padding: 0;
            }
            .print-container {
                position: relative;
                margin: 0;
                padding: 0;
                box-shadow: none;
            }
            @page {
                margin: 0;
            }
        }
        
        .preview-container {
            width: 100%;
            max-width: 297mm;
            height: auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            margin: 20px auto;
        }
        
        .portrait-preview {
            aspect-ratio: 297/210;
        }
        
        .landscape-preview {
            aspect-ratio: 210/297;
        }
        
        .card-placeholder {
            background-color: #f0f0f0;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: absolute;
        }
        
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .landscape-front {
            transform: rotate(180deg);
        }
        
        /* Fold line */
        .fold-line {
            position: absolute;
            background-color: rgba(255, 0, 0, 0.5);
            z-index: 10;
        }
        
        .fold-line-vertical {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
        }
        
        .fold-line-horizontal {
            width: 100%;
            height: 1px;
            left: 0;
            top: 50%;
        }
        
        /* Mobile-specific styles */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            top: 0;
            right: 0;
            min-width: 100%;
            min-height: 100%;
            font-size: 100px;
            text-align: right;
            filter: alpha(opacity=0);
            opacity: 0;
            outline: none;
            cursor: pointer;
            display: block;
        }
        
        .file-input-button {
            display: block;
            width: 100%;
            padding: 8px 12px;
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            color: #374151;
            text-align: center;
            cursor: pointer;
        }
        
        .file-name {
            margin-top: 4px;
            font-size: 0.75rem;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Developer button and modal */
        .dev-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            background-color: #4f46e5;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .dev-button:hover {
            background-color: #4338ca;
            transform: scale(1.05);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            overflow-y: auto;
        }
        
        .modal-content {
            background-color: white;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        
        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
        }
        
        .code-container {
            background-color: #f8f9fa;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 15px;
            margin: 15px 0;
            overflow-x: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        
        /* PDF container styles */
        #pdfContainer {
            position: absolute;
            left: -9999px;
        }
        
        .pdf-page {
            position: relative;
            background-color: white;
            margin-bottom: 20px;
        }
        
        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Print section styles */
        #printSection {
            display: none;
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
        }
        
        /* Debug border */
        .debug-border {
            border: 2px solid red !important;
        }
    </style>

<body class="bg-gradient-to-br from-blue-50 to-purple-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6 mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-center text-purple-800 mb-2">卡片列印工具</h1>
            <p class="text-center text-gray-600 mb-6">上傳四張圖片，選擇方向，生成可列印的卡片佈局</p>
            
            <div class="grid grid-cols-1 gap-6 mb-8">
                <div class="space-y-4">
                    <h2 class="text-xl font-semibold text-purple-700">1. 選擇卡片方向</h2>
                    <div class="flex flex-wrap gap-4">
                        <label class="flex items-center cursor-pointer bg-purple-100 p-4 rounded-lg hover:bg-purple-200 transition flex-grow">
                            <input type="radio" name="orientation" value="portrait" checked="" class="mr-2 h-5 w-5 text-purple-600">
                            <span>直式卡片 (左右翻)</span>
                        </label>
                        <label class="flex items-center cursor-pointer bg-purple-100 p-4 rounded-lg hover:bg-purple-200 transition flex-grow">
                            <input type="radio" name="orientation" value="landscape" class="mr-2 h-5 w-5 text-purple-600">
                            <span>橫式卡片 (上下翻)</span>
                        </label>
                    </div>
                </div>
                
                <div class="space-y-4">
                    <h2 class="text-xl font-semibold text-purple-700">2. 上傳卡片圖片</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">封面</label>
                            <div class="file-input-wrapper">
                                <div class="file-input-button">選擇封面圖片</div>
                                <input type="file" id="frontCover" accept="image/*" class="file-input">
                                <div id="frontCoverName" class="file-name">尚未選擇檔案</div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">封底</label>
                            <div class="file-input-wrapper">
                                <div class="file-input-button">選擇封底圖片</div>
                                <input type="file" id="backCover" accept="image/*" class="file-input">
                                <div id="backCoverName" class="file-name">尚未選擇檔案</div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">內頁 1</label>
                            <div class="file-input-wrapper">
                                <div class="file-input-button">選擇內頁 1 圖片</div>
                                <input type="file" id="insidePage1" accept="image/*" class="file-input">
                                <div id="insidePage1Name" class="file-name">尚未選擇檔案</div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">內頁 2</label>
                            <div class="file-input-wrapper">
                                <div class="file-input-button">選擇內頁 2 圖片</div>
                                <input type="file" id="insidePage2" accept="image/*" class="file-input">
                                <div id="insidePage2Name" class="file-name">尚未選擇檔案</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-center mb-8">
                <button id="generateBtn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 w-full sm:w-auto">
                    生成卡片列印佈局
                </button>
            <button id="layoutExplanationBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow flex items-center mt-4 mx-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                查看佈局說明
            </button></div>
        </div>
        
        <div id="previewSection" class="hidden no-print">
            <h2 class="text-2xl font-bold text-center text-purple-800 mb-4">預覽</h2>
            <p class="text-center text-gray-600 mb-6">以下是您的卡片列印佈局預覽</p>
            
            <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6 mb-8">
                <h3 class="text-xl font-semibold text-purple-700 mb-4">輸出選項</h3>
                <div class="flex flex-wrap gap-4 justify-center">
                    <button id="printBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                        </svg>
                        列印卡片
                    </button>
                    <button id="downloadPdfBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        下載 PDF
                    </button>
                </div>
                <div class="mt-4 text-sm text-gray-600">
                    <p class="mb-2"><strong>列印卡片：</strong>開啟瀏覽器的列印對話框，您可以選擇印表機並調整列印設定。</p>
                    <p><strong>下載 PDF：</strong>將卡片佈局保存為 PDF 文件，共 2 頁。</p>
                </div>
            </div>
            
            <div class="space-y-8">
                <div>
                    <h3 class="text-lg font-semibold text-purple-700 mb-2">第 1 頁</h3>
                    <div id="page1" class="preview-container portrait-preview" style="width: 100%; max-width: 297mm; aspect-ratio: 297 / 210;"></div>
                </div>
                <div>
                    <h3 class="text-lg font-semibold text-purple-700 mb-2">第 2 頁</h3>
                    <div id="page2" class="preview-container portrait-preview" style="width: 100%; max-width: 297mm; aspect-ratio: 297 / 210;"></div>
                </div>
            </div>
        </div>
        
        <!-- Hidden container for PDF generation -->
        <div id="pdfContainer" style="position: absolute; left: -9999px;">
            <div id="pdfPage1" class="pdf-page" style="width: 297mm; height: 210mm;"></div>
            <div id="pdfPage2" class="pdf-page" style="width: 297mm; height: 210mm;"></div>
        </div>
        
        <!-- Hidden container for print -->
        <div id="printSection">
            <div id="printPage1" class="print-container print-page"></div>
            <div id="printPage2" class="print-container print-page"></div>
        </div>
    </div>
    
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p id="loadingText">處理中，請稍候...</p>
        </div>
    </div>
    
    <!-- Developer Button -->
    <div class="dev-button no-print" id="devButton">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
    </div>
    
    <!-- Code Modal -->
    <div id="codeModal" class="modal no-print">
        <div class="modal-content">
            <span class="close-button" id="closeModal">×</span>
            <h2 class="text-2xl font-bold text-purple-800 mb-4">完整程式碼</h2>
            <button id="copyCodeBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mb-4">
                複製程式碼
            </button>
            <div class="code-container" id="codeContainer">
                <!-- Code will be inserted here by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log("Document loaded");
            const orientationInputs = document.querySelectorAll('input[name="orientation"]');
            const generateBtn = document.getElementById('generateBtn');
            const printBtn = document.getElementById('printBtn');
            const downloadPdfBtn = document.getElementById('downloadPdfBtn');
            const previewSection = document.getElementById('previewSection');
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const printPage1 = document.getElementById('printPage1');
            const printPage2 = document.getElementById('printPage2');
            const pdfPage1 = document.getElementById('pdfPage1');
            const pdfPage2 = document.getElementById('pdfPage2');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const printSection = document.getElementById('printSection');
            
            const imageInputs = {
                frontCover: document.getElementById('frontCover'),
                backCover: document.getElementById('backCover'),
                insidePage1: document.getElementById('insidePage1'),
                insidePage2: document.getElementById('insidePage2')
            };
            
            const imageNameElements = {
                frontCover: document.getElementById('frontCoverName'),
                backCover: document.getElementById('backCoverName'),
                insidePage1: document.getElementById('insidePage1Name'),
                insidePage2: document.getElementById('insidePage2Name')
            };
            
            const imageUrls = {
                frontCover: null,
                backCover: null,
                insidePage1: null,
                insidePage2: null
            };
            
            // Handle orientation change
            orientationInputs.forEach(input => {
                input.addEventListener('change', function() {
                    updatePreviewContainers(input.value);
                });
            });
            
            // Update preview containers based on orientation
            function updatePreviewContainers(orientation) {
                if (orientation === 'portrait') {
                    // Portrait cards use landscape A4 paper (297mm x 210mm)
                    page1.classList.remove('landscape-preview');
                    page1.classList.add('portrait-preview');
                    page2.classList.remove('landscape-preview');
                    page2.classList.add('portrait-preview');
                    
                    page1.style.width = '100%';
                    page1.style.maxWidth = '297mm';
                    page1.style.aspectRatio = '297/210';
                    
                    page2.style.width = '100%';
                    page2.style.maxWidth = '297mm';
                    page2.style.aspectRatio = '297/210';
                    
                    pdfPage1.style.width = '297mm';
                    pdfPage1.style.height = '210mm';
                    pdfPage2.style.width = '297mm';
                    pdfPage2.style.height = '210mm';
                } else {
                    // Landscape cards use portrait A4 paper (210mm x 297mm)
                    page1.classList.remove('portrait-preview');
                    page1.classList.add('landscape-preview');
                    page2.classList.remove('portrait-preview');
                    page2.classList.add('landscape-preview');
                    
                    page1.style.width = '100%';
                    page1.style.maxWidth = '210mm';
                    page1.style.aspectRatio = '210/297';
                    
                    page2.style.width = '100%';
                    page2.style.maxWidth = '210mm';
                    page2.style.aspectRatio = '210/297';
                    
                    pdfPage1.style.width = '210mm';
                    pdfPage1.style.height = '297mm';
                    pdfPage2.style.width = '210mm';
                    pdfPage2.style.height = '297mm';
                }
            }
            
            // Initialize preview containers
            updatePreviewContainers('portrait');
            
            // Handle file uploads
            Object.keys(imageInputs).forEach(key => {
                imageInputs[key].addEventListener('change', function(e) {
                    if (e.target.files && e.target.files[0]) {
                        const fileName = e.target.files[0].name;
                        imageNameElements[key].textContent = fileName;
                        
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            imageUrls[key] = event.target.result;
                        };
                        reader.readAsDataURL(e.target.files[0]);
                    }
                });
            });
            
            // Generate layout
            generateBtn.addEventListener('click', function() {
                console.log("Generate button clicked");
                const orientation = document.querySelector('input[name="orientation"]:checked').value;
                
                // Check if all images are uploaded
                const missingImages = Object.keys(imageUrls).filter(key => !imageUrls[key]);
                if (missingImages.length > 0) {
                    alert('請上傳所有四張圖片');
                    return;
                }
                
                // Clear previous content
                page1.innerHTML = '';
                page2.innerHTML = '';
                printPage1.innerHTML = '';
                printPage2.innerHTML = '';
                pdfPage1.innerHTML = '';
                pdfPage2.innerHTML = '';
                
                if (orientation === 'portrait') {
                    // Portrait layout (A4 landscape with portrait cards)
                    createPortraitLayout(page1, page2, imageUrls);
                    createPortraitLayout(printPage1, printPage2, imageUrls);
                    createPortraitLayout(pdfPage1, pdfPage2, imageUrls);
                } else {
                    // Landscape layout (A4 portrait with landscape cards)
                    createLandscapeLayout(page1, page2, imageUrls);
                    createLandscapeLayout(printPage1, printPage2, imageUrls);
                    createLandscapeLayout(pdfPage1, pdfPage2, imageUrls);
                }
                
                // Show preview section
                previewSection.classList.remove('hidden');
                
                // Scroll to preview section
                previewSection.scrollIntoView({ behavior: 'smooth' });
            });
            
            // Print function
            printBtn.addEventListener('click', function() {
                console.log("Print button clicked");
                try {
                    // Show the print section
                    printSection.style.display = 'block';
                    
                    // Set the correct page orientation for printing
                    const orientation = document.querySelector('input[name="orientation"]:checked').value;
                    const style = document.createElement('style');
                    if (orientation === 'portrait') {
                        // For portrait cards, use landscape paper
                        style.textContent = '@page { size: landscape; margin: 0; }';
                    } else {
                        // For landscape cards, use portrait paper
                        style.textContent = '@page { size: portrait; margin: 0; }';
                    }
                    document.head.appendChild(style);
                    
                    // Use the browser's print dialog
                    window.print();
                    
                    // Hide the print section after printing
                    setTimeout(() => {
                        printSection.style.display = 'none';
                        document.head.removeChild(style);
                    }, 1000);
                } catch (error) {
                    console.error("Print error:", error);
                    alert("列印時發生錯誤，請再試一次。");
                }
            });
            
            // Download PDF function
            downloadPdfBtn.addEventListener('click', function() {
                console.log("Download PDF button clicked");
                
                // Show loading overlay
                loadingOverlay.style.display = 'flex';
                loadingText.textContent = '正在生成 PDF，請稍候...';
                
                try {
                    // Use jsPDF and html2canvas
                    const { jsPDF } = window.jspdf;
                    const orientation = document.querySelector('input[name="orientation"]:checked').value;
                    
                    // Create a new PDF document with the correct orientation
                    const pdfOrientation = orientation === 'portrait' ? 'landscape' : 'portrait';
                    const pdf = new jsPDF(pdfOrientation, 'mm', 'a4');
                    
                    // First, render page 1
                    loadingText.textContent = '正在處理第 1 頁...';
                    
                    setTimeout(() => {
                        html2canvas(pdfPage1, {
                            scale: 2,
                            useCORS: true,
                            logging: true
                        }).then(canvas1 => {
                            // Add the first page to PDF
                            const imgData1 = canvas1.toDataURL('image/jpeg', 1.0);
                            if (orientation === 'portrait') {
                                pdf.addImage(imgData1, 'JPEG', 0, 0, 297, 210);
                            } else {
                                pdf.addImage(imgData1, 'JPEG', 0, 0, 210, 297);
                            }
                            
                            // Update loading text
                            loadingText.textContent = '正在處理第 2 頁...';
                            
                            // Then render page 2
                            html2canvas(pdfPage2, {
                                scale: 2,
                                useCORS: true,
                                logging: true
                            }).then(canvas2 => {
                                // Add the second page to PDF
                                pdf.addPage();
                                const imgData2 = canvas2.toDataURL('image/jpeg', 1.0);
                                if (orientation === 'portrait') {
                                    pdf.addImage(imgData2, 'JPEG', 0, 0, 297, 210);
                                } else {
                                    pdf.addImage(imgData2, 'JPEG', 0, 0, 210, 297);
                                }
                                
                                // Save the PDF
                                loadingText.textContent = '正在保存 PDF...';
                                pdf.save('卡片列印.pdf');
                                
                                // Hide loading overlay
                                loadingOverlay.style.display = 'none';
                                console.log("PDF generated successfully");
                            }).catch(error => {
                                console.error("Error rendering page 2:", error);
                                alert("生成 PDF 時發生錯誤，請再試一次。");
                                loadingOverlay.style.display = 'none';
                            });
                        }).catch(error => {
                            console.error("Error rendering page 1:", error);
                            alert("生成 PDF 時發生錯誤，請再試一次。");
                            loadingOverlay.style.display = 'none';
                        });
                    }, 100);
                } catch (error) {
                    console.error("PDF generation error:", error);
                    alert("生成 PDF 時發生錯誤，請再試一次。");
                    loadingOverlay.style.display = 'none';
                }
            });
            
            function createPortraitLayout(page1Container, page2Container, images) {
                // Portrait cards use landscape A4 paper (297mm x 210mm)
                page1Container.style.width = '100%';
                page1Container.style.maxWidth = '297mm';
                page1Container.style.aspectRatio = '297/210';
                
                page2Container.style.width = '100%';
                page2Container.style.maxWidth = '297mm';
                page2Container.style.aspectRatio = '297/210';
                
                // Page 1: Front cover (right) and back cover (left)
                // For portrait cards, we need to place them correctly for folding
                
                // Front cover (right side, normal orientation)
                const frontCover = document.createElement('div');
                frontCover.className = 'card-placeholder';
                frontCover.style.width = '50%';
                frontCover.style.height = '100%';
                frontCover.style.right = '0';
                frontCover.style.top = '0';
                frontCover.style.border = '2px dashed #ccc';
                
                const frontCoverImg = document.createElement('img');
                frontCoverImg.className = 'card-image'; // Normal orientation
                frontCoverImg.src = images.frontCover;
                frontCoverImg.crossOrigin = 'Anonymous';
                frontCover.appendChild(frontCoverImg);
                
                // Back cover (left side, normal orientation)
                const backCover = document.createElement('div');
                backCover.className = 'card-placeholder';
                backCover.style.width = '50%';
                backCover.style.height = '100%';
                backCover.style.left = '0';
                backCover.style.top = '0';
                backCover.style.border = '2px dashed #ccc';
                
                const backCoverImg = document.createElement('img');
                backCoverImg.className = 'card-image'; // Normal orientation
                backCoverImg.src = images.backCover;
                backCoverImg.crossOrigin = 'Anonymous';
                backCover.appendChild(backCoverImg);
                
                page1Container.appendChild(frontCover);
                page1Container.appendChild(backCover);
                
                // Add fold line
                const foldLine1 = document.createElement('div');
                foldLine1.className = 'fold-line fold-line-vertical no-print';
                page1Container.appendChild(foldLine1);
                
                // Page 2: Inside pages
                // Inside page 1 (left side)
                const insidePage1 = document.createElement('div');
                insidePage1.className = 'card-placeholder';
                insidePage1.style.width = '50%';
                insidePage1.style.height = '100%';
                insidePage1.style.left = '0';
                insidePage1.style.top = '0';
                insidePage1.style.border = '2px dashed #ccc';
                
                const insidePage1Img = document.createElement('img');
                insidePage1Img.className = 'card-image'; // Normal orientation
                insidePage1Img.src = images.insidePage1;
                insidePage1Img.crossOrigin = 'Anonymous';
                insidePage1.appendChild(insidePage1Img);
                
                // Inside page 2 (right side)
                const insidePage2 = document.createElement('div');
                insidePage2.className = 'card-placeholder';
                insidePage2.style.width = '50%';
                insidePage2.style.height = '100%';
                insidePage2.style.right = '0';
                insidePage2.style.top = '0';
                insidePage2.style.border = '2px dashed #ccc';
                
                const insidePage2Img = document.createElement('img');
                insidePage2Img.className = 'card-image'; // Normal orientation
                insidePage2Img.src = images.insidePage2;
                insidePage2Img.crossOrigin = 'Anonymous';
                insidePage2.appendChild(insidePage2Img);
                
                page2Container.appendChild(insidePage1);
                page2Container.appendChild(insidePage2);
                
                // Add fold line
                const foldLine2 = document.createElement('div');
                foldLine2.className = 'fold-line fold-line-vertical no-print';
                page2Container.appendChild(foldLine2);
                
                // Add debug labels to help understand the layout
                addDebugLabel(frontCover, "封面 (右側)");
                addDebugLabel(backCover, "封底 (左側)");
                addDebugLabel(insidePage1, "內頁 1 (左側)");
                addDebugLabel(insidePage2, "內頁 2 (右側)");
            }
            
            function createLandscapeLayout(page1Container, page2Container, images) {
                // Landscape cards use portrait A4 paper (210mm x 297mm)
                page1Container.style.width = '100%';
                page1Container.style.maxWidth = '210mm';
                page1Container.style.aspectRatio = '210/297';
                
                page2Container.style.width = '100%';
                page2Container.style.maxWidth = '210mm';
                page2Container.style.aspectRatio = '210/297';
                
                // Page 1: Front cover (top, rotated 180°) and back cover (bottom)
                // Front cover (top, rotated 180°)
                const frontCover = document.createElement('div');
                frontCover.className = 'card-placeholder';
                frontCover.style.width = '100%';
                frontCover.style.height = '50%';
                frontCover.style.top = '0';
                frontCover.style.left = '0';
                frontCover.style.border = '2px dashed #ccc';
                
                const frontCoverImg = document.createElement('img');
                frontCoverImg.className = 'card-image landscape-front'; // Apply 180° rotation
                frontCoverImg.src = images.frontCover;
                frontCoverImg.crossOrigin = 'Anonymous';
                frontCover.appendChild(frontCoverImg);
                
                // Back cover (bottom, normal orientation)
                const backCover = document.createElement('div');
                backCover.className = 'card-placeholder';
                backCover.style.width = '100%';
                backCover.style.height = '50%';
                backCover.style.bottom = '0';
                backCover.style.left = '0';
                backCover.style.border = '2px dashed #ccc';
                
                const backCoverImg = document.createElement('img');
                backCoverImg.className = 'card-image'; // Normal orientation
                backCoverImg.src = images.backCover;
                backCoverImg.crossOrigin = 'Anonymous';
                backCover.appendChild(backCoverImg);
                
                page1Container.appendChild(frontCover);
                page1Container.appendChild(backCover);
                
                // Add fold line
                const foldLine1 = document.createElement('div');
                foldLine1.className = 'fold-line fold-line-horizontal no-print';
                page1Container.appendChild(foldLine1);
                
                // Page 2: Inside pages
                // Inside page 1 (top)
                const insidePage1 = document.createElement('div');
                insidePage1.className = 'card-placeholder';
                insidePage1.style.width = '100%';
                insidePage1.style.height = '50%';
                insidePage1.style.top = '0';
                insidePage1.style.left = '0';
                insidePage1.style.border = '2px dashed #ccc';
                
                const insidePage1Img = document.createElement('img');
                insidePage1Img.className = 'card-image'; // Normal orientation
                insidePage1Img.src = images.insidePage1;
                insidePage1Img.crossOrigin = 'Anonymous';
                insidePage1.appendChild(insidePage1Img);
                
                // Inside page 2 (bottom)
                const insidePage2 = document.createElement('div');
                insidePage2.className = 'card-placeholder';
                insidePage2.style.width = '100%';
                insidePage2.style.height = '50%';
                insidePage2.style.bottom = '0';
                insidePage2.style.left = '0';
                insidePage2.style.border = '2px dashed #ccc';
                
                const insidePage2Img = document.createElement('img');
                insidePage2Img.className = 'card-image'; // Normal orientation
                insidePage2Img.src = images.insidePage2;
                insidePage2Img.crossOrigin = 'Anonymous';
                insidePage2.appendChild(insidePage2Img);
                
                page2Container.appendChild(insidePage1);
                page2Container.appendChild(insidePage2);
                
                // Add fold line
                const foldLine2 = document.createElement('div');
                foldLine2.className = 'fold-line fold-line-horizontal no-print';
                page2Container.appendChild(foldLine2);
                
                // Add debug labels to help understand the layout
                addDebugLabel(frontCover, "封面 (上方，顛倒180度)");
                addDebugLabel(backCover, "封底 (下方)");
                addDebugLabel(insidePage1, "內頁 1 (上方)");
                addDebugLabel(insidePage2, "內頁 2 (下方)");
            }
            
            // Helper function to add debug labels
            function addDebugLabel(container, text) {
                const label = document.createElement('div');
                label.className = 'absolute top-2 left-2 bg-white bg-opacity-70 px-2 py-1 rounded text-xs font-bold text-purple-800 no-print';
                label.textContent = text;
                container.appendChild(label);
            }
            
            // Developer modal functionality
            const devButton = document.getElementById('devButton');
            const codeModal = document.getElementById('codeModal');
            const closeModal = document.getElementById('closeModal');
            const codeContainer = document.getElementById('codeContainer');
            const copyCodeBtn = document.getElementById('copyCodeBtn');
            
            // Get the current HTML code
            function getCurrentCode() {
                return document.documentElement.outerHTML;
            }
            
            // Open modal with code
            devButton.addEventListener('click', function() {
                const currentCode = getCurrentCode();
                codeContainer.textContent = currentCode;
                codeModal.style.display = 'block';
            });
            
            // Close modal
            closeModal.addEventListener('click', function() {
                codeModal.style.display = 'none';
            });
            
            // Close modal when clicking outside
            window.addEventListener('click', function(event) {
                if (event.target === codeModal) {
                    codeModal.style.display = 'none';
                }
            });
            
            // Copy code button
            copyCodeBtn.addEventListener('click', function() {
                const codeText = codeContainer.textContent;
                navigator.clipboard.writeText(codeText).then(function() {
                    const originalText = copyCodeBtn.textContent;
                    copyCodeBtn.textContent = '複製成功！';
                    copyCodeBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                    copyCodeBtn.classList.add('bg-green-600', 'hover:bg-green-700');
                    
                    setTimeout(function() {
                        copyCodeBtn.textContent = originalText;
                        copyCodeBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                        copyCodeBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                    }, 2000);
                }).catch(function(err) {
                    console.error('無法複製程式碼: ', err);
                    copyCodeBtn.textContent = '複製失敗';
                    copyCodeBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                    copyCodeBtn.classList.add('bg-red-600', 'hover:bg-red-700');
                    
                    setTimeout(function() {
                        copyCodeBtn.textContent = '複製程式碼';
                        copyCodeBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                        copyCodeBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                    }, 2000);
                });
            });
            
            // Add a layout explanation button
            const layoutExplanationBtn = document.createElement('button');
            layoutExplanationBtn.id = 'layoutExplanationBtn';
            layoutExplanationBtn.className = 'bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow flex items-center mt-4 mx-auto';
            layoutExplanationBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                查看佈局說明
            `;
            
            // Add the explanation button after the generate button
            generateBtn.parentNode.appendChild(layoutExplanationBtn);
            
            // Layout explanation function
            layoutExplanationBtn.addEventListener('click', function() {
                const orientation = document.querySelector('input[name="orientation"]:checked').value;
                let explanationText = '';
                
                if (orientation === 'portrait') {
                    explanationText = `
                        <h3 class="text-xl font-bold mb-4">直式卡片佈局說明 (左右翻)</h3>
                        <p class="mb-3">直式卡片使用 A4 橫式紙張 (297mm x 210mm)：</p>
                        <ul class="list-disc pl-5 mb-4">
                            <li class="mb-2"><strong>第 1 頁：</strong> 左側是封底（正常方向），右側是封面（正常方向）</li>
