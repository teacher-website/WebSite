<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜點貓咪收集賽 🐾</title>
    <style>
        :root {
            --bg-color: #ffeef2;
            --primary-pink: #ff8fa3;
            --accent-purple: #b39ddb;
            --text-color: #5d4037;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffeef2 0%, #e8eaf6 100%);
            font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            color: var(--text-color);
        }

        h1 {
            margin: 5px 0;
            font-size: 32px;
            color: #ff6b81;
            text-shadow: 2px 2px 0px #fff;
        }

        #game-wrapper {
            position: relative;
            width: 480px;
            height: 600px;
            background: linear-gradient(to bottom, #e3f2fd 0%, #fff9c4 85%, #a5d6a7 85%);
            border: 10px solid #fff;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 143, 163, 0.2);
            overflow: hidden;
        }

        /* UI 面板 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            z-index: 10;
        }

        #score-board {
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid var(--primary-pink);
        }

        #lives-board {
            color: #ff4757;
            font-size: 26px;
            letter-spacing: 3px;
        }

        /* 貓咪角色 (純CSS繪製) */
        #basket-cat {
            position: absolute;
            bottom: 65px; /* 站在草地上 */
            left: 240px;
            width: 80px;
            height: 60px;
            background: #ffffff;
            border-radius: 40px 40px 25px 25px;
            box-shadow: inset -5px -5px 0px #f0f0f0, 0 8px 10px rgba(0,0,0,0.05);
            z-index: 5;
            transform: translateX(-50%);
        }

        /* 貓耳朵 */
        #basket-cat::before, #basket-cat::after {
            content: '';
            position: absolute;
            top: -12px;
            width: 20px;
            height: 25px;
            background: #ffffff;
            border-radius: 50% 50% 0 0;
        }
        #basket-cat::before { left: 8px; transform: rotate(-15deg); }
        #basket-cat::after { right: 8px; transform: rotate(15deg); }

        /* 臉部細節 */
        .cat-face {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .cat-face::before { /* 眼睛 */
            content: '•   •';
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 20px;
            color: #333;
            font-weight: bold;
        }
        .cat-face::after { /* 腮紅 */
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            width: 10px;
            height: 6px;
            background: #ffb7b2;
            border-radius: 50%;
            box-shadow: 46px 0 #ffb7b2;
        }

        /* 掉落物品 */
        .falling-item {
            position: absolute;
            font-size: 35px;
            user-select: none;
            z-index: 4;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
        }

        /* 特效粒子 */
        .particle {
            position: absolute;
            pointer-events: none;
            font-size: 16px;
            z-index: 6;
            animation: popOut 0.4s ease-out forwards;
        }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(1.2); opacity: 0; }
        }

        /* 遊戲結束與開始畫面 */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 238, 242, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .btn {
            padding: 12px 35px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff7675, #ff6b81);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,107,129,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255,107,129,0.6);
        }

        .btn:active { transform: scale(0.95); }

        #game-over-screen { display: none; }
    </style>
</head>
<body>

    <h1>🐾 甜點貓咪收集賽 🍰</h1>
    
    <div id="game-wrapper">
        <div id="ui-layer">
            <div>得分: <span id="score">0</span></div>
            <div id="lives-board">❤️❤️❤️</div>
        </div>

        <div id="basket-cat">
            <div class="cat-face"></div>
        </div>

        <div id="start-screen" class="screen">
            <span style="font-size: 60px;">🐱</span>
            <h2 style="color: #ff6b81; margin: 10px 0;">幫小貓收集甜點吧！</h2>
            <p style="color: #777; font-size: 14px; text-align: center; padding: 0 30px;">
                左右移動滑鼠或用手指拖曳控制貓咪。<br>
                接住美味甜點，但千萬要躲開炸彈 💣 喔！
            </p>
            <button class="btn" onclick="startGame()">開始遊戲</button>
        </div>

        <div id="game-over-screen" class="screen">
            <span style="font-size: 60px;">😿</span>
            <h2 style="color: #ff6b81; margin: 10px 0;">肚子好撐、Game Over</h2>
            <p style="font-size: 22px; font-weight: bold;">最終得分: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">再玩一次</button>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('game-wrapper');
        const cat = document.getElementById('basket-cat');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives-board');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

        let score = 0;
        let lives = 3;
        let gameActive = false;
        let items = [];
        let spawnTimer = 0;
        let spawnInterval = 60; 
        let gameSpeed = 3.5;
        let catX = 240;

        // 解決隱私安全限制：點擊按鈕時才初始化音效
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.log("此瀏覽器不支援 Web Audio API");
                }
            }
            // 確保音效在被瀏覽器鎖定時能恢復運作
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'catch') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'bomb') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch(e) {
                console.log("播放音效時發生錯誤");
            }
        }

        const treats = ['🍬', '🍩', '🍰', '🧁', '🍪', '🍓'];
        const dangers = ['💣'];

        function moveCat(clientX) {
            if (!gameActive) return;
            const rect = wrapper.getBoundingClientRect();
            let x = clientX - rect.left;
            if (x < 40) x = 40;
            if (x > 440) x = 440;
            catX = x;
            cat.style.left = catX + 'px';
        }

        // 游標移入時隱藏游標，移出時顯示，讓體驗更好
        wrapper.addEventListener('mouseenter', () => { if (gameActive) wrapper.style.cursor = 'none'; });
        wrapper.addEventListener('mouseleave', () => { wrapper.style.cursor = 'default'; });

        wrapper.addEventListener('mousemove', (e) => moveCat(e.clientX));
        wrapper.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                e.preventDefault(); // 阻止滑動螢幕時畫面跟著晃動
                moveCat(e.touches[0].clientX);
            }
        }, { passive: false });

        function startGame() {
            // 安全觸發音效初始化
            initAudio();
            
            // 清理舊物品
            document.querySelectorAll('.falling-item').forEach(el => el.remove());
            items = [];
            
            score = 0;
            lives = 3;
            gameSpeed = 3.5;
            spawnInterval = 60;
            gameActive = true;
            
            scoreEl.innerText = score;
            updateLivesDisplay();
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            if (gameActive) wrapper.style.cursor = 'none';
            
            requestAnimationFrame(gameLoop);
        }

        function updateLivesDisplay() {
            livesEl.innerText = '❤️'.repeat(lives);
        }

        function spawnItem() {
            const isBomb = Math.random() < 0.25; 
            const char = isBomb ? dangers[0] : treats[Math.floor(Math.random() * treats.length)];
            
            const el = document.createElement('div');
            el.classList.add('falling-item');
            el.innerText = char;
            wrapper.appendChild(el);

            const x = Math.random() * (400) + 40;
            el.style.left = x + 'px';
            el.style.top = '-40px';

            items.push({
                el: el,
                x: x,
                y: -40,
                isBomb: isBomb
            });
        }

        function createParticles(x, y, color) {
            for(let i=0; i<6; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.innerText = color;
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                const mx = (Math.random() - 0.5) * 100 + 'px';
                const my = (Math.random() - 0.8) * 100 + 'px';
                p.style.setProperty('--mx', mx);
                p.style.setProperty('--my', my);
                
                wrapper.appendChild(p);
                setTimeout(() => p.remove(), 400);
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnItem();
                spawnTimer = 0;
                if (spawnInterval > 25) spawnInterval -= 0.5;
                gameSpeed += 0.05;
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += gameSpeed;
                item.el.style.top = item.y + 'px';

                // 貓咪碰撞判定
                if (item.y >= 510 && item.y <= 545) {
                    if (Math.abs(item.x - catX) < 45) {
                        if (item.isBomb) {
                            playSound('bomb');
                            createParticles(item.x, item.y, '💥');
                            lives--;
                            updateLivesDisplay();
                        } else {
                            playSound('catch');
                            createParticles(item.x, item.y, '✨');
                            score += 10;
                            scoreEl.innerText = score;
                        }
                        item.el.remove();
                        items.splice(i, 1);
                        
                        if (lives <= 0) endGame();
                        continue;
                    }
                }

                // 超過邊界
                if (item.y > 550) {
                    if (!item.isBomb) {
                        lives--;
                        updateLivesDisplay();
                        createParticles(item.x, 530, '💧');
                        if (lives <= 0) endGame();
                    }
                    item.el.remove();
                    items.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameActive = false;
            wrapper.style.cursor = 'default';
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
