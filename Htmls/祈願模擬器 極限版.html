<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 原神祈願模擬器 極限版 🔥</title>
    <style>
        :root {
            /* 調整為更帥氣的霓虹/金屬色系 */
            --5star: #FFD700;
            --5star-glow: rgba(255, 215, 0, 0.6);
            --4star: #B041FF;
            --4star-glow: rgba(176, 65, 255, 0.6);
            --3star: #00E5FF;
            --3star-glow: rgba(0, 229, 255, 0.6);
            --bg-dark: #0a0a0c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Segoe UI', Tahoma, Geneva, sans-serif;
            /* 深邃的暗色漸層背景 */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            /* 科技感深色玻璃面板 */
            background: rgba(15, 15, 20, 0.85);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 2px rgba(255,255,255,0.1);
            text-align: center;
            max-width: 900px;
            width: 90%;
            margin: 20px 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            /* 尊爵不凡的黑金漸層字體 */
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 5px 15px rgba(255, 215, 0, 0.1);
        }

        p.subtitle {
            color: #8892b0;
            margin-bottom: 20px;
            font-size: 1rem;
            margin-top: 0;
            letter-spacing: 1px;
        }

        .resource-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            padding: 12px 30px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 30px;
            color: #a0aabf;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .resource-box span.highlight {
            color: #00E5FF;
            font-size: 1.5rem;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
            margin-bottom: 40px;
        }

        button {
            background: transparent;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            color: white;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
        }

        /* 俐落的按鈕點擊回饋 */
        button:active {
            transform: scale(0.95);
        }

        .btn-single {
            border: 2px solid #5a8bdc;
            color: #c0d6ff;
            box-shadow: 0 0 15px rgba(90, 139, 220, 0.2) inset;
        }

        .btn-single:hover {
            background: rgba(90, 139, 220, 0.1);
            box-shadow: 0 0 20px rgba(90, 139, 220, 0.5), 0 0 15px rgba(90, 139, 220, 0.4) inset;
            color: #fff;
        }

        .btn-multi {
            border: 2px solid var(--5star);
            color: #fff6c0;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2) inset;
        }

        .btn-multi:hover {
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6), 0 0 15px rgba(255, 215, 0, 0.4) inset;
            color: #fff;
        }

        #results {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            min-height: 220px;
            padding: 10px;
        }

        /* --- 帥氣銳利動畫 CSS --- */
        @keyframes sharpReveal {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
                filter: brightness(0);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1);
            }
        }

        @keyframes goldNeon {
            0% { box-shadow: 0 0 10px var(--5star-glow), inset 0 0 5px var(--5star-glow); }
            50% { box-shadow: 0 0 30px var(--5star), inset 0 0 10px var(--5star); }
            100% { box-shadow: 0 0 10px var(--5star-glow), inset 0 0 5px var(--5star-glow); }
        }

        .card {
            background: #111115;
            border-radius: 6px;
            padding: 15px 10px;
            width: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            
            /* 銳利的出現動畫 */
            opacity: 0;
            animation: sharpReveal 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* 黑金 5星 */
        .card.star-5 {
            border: 2px solid var(--5star);
            background: linear-gradient(180deg, #1f1b0a 0%, #0a0a0a 100%);
            animation: sharpReveal 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards, goldNeon 2s infinite;
        }

        /* 賽博紫 4星 */
        .card.star-4 {
            border: 2px solid var(--4star);
            background: linear-gradient(180deg, #170d24 0%, #0a0a0a 100%);
            box-shadow: 0 0 15px var(--4star-glow);
        }

        /* 冷光藍 3星 */
        .card.star-3 {
            border: 2px solid var(--3star);
            background: linear-gradient(180deg, #091a20 0%, #0a0a0a 100%);
            box-shadow: 0 0 10px var(--3star-glow);
        }

        .card .emoji {
            font-size: 3rem;
            margin-bottom: 12px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .card .name {
            font-size: 0.95rem;
            font-weight: bold;
            color: #e0e0e0;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            letter-spacing: 1px;
        }

        .card .stars {
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .star-5 .stars { color: var(--5star); text-shadow: 0 0 5px var(--5star); }
        .star-4 .stars { color: var(--4star); text-shadow: 0 0 5px var(--4star); }
        .star-3 .stars { color: var(--3star); text-shadow: 0 0 5px var(--3star); }

    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 祈願模擬器 極限版 🔥</h1>
        <p class="subtitle">>>> SYSTEM READY. INFINITE PULLS ENGAGED. <<<</p>
        
        <div class="resource-box">
            [ 資源模組 ] 原石：<span class="highlight">∞</span> ｜ 
            權限：<span class="highlight">∞</span> 次
        </div>

        <div class="btn-group">
            <button id="btn-single" class="btn-single" onclick="gacha(1)">[ 執行 ] 單次祈願</button>
            <button id="btn-multi" class="btn-multi" onclick="gacha(10)">[ 爆發 ] 十連祈願</button>
        </div>

        <div id="results">
            <!-- 抽卡結果會顯示在這裡 -->
        </div>
    </div>

    <script>
        // 大幅擴充的獎池 (保留多億點角色)
        const pool = {
            star5: [
                { name: '胡桃', emoji: '👻' }, { name: '雷電將軍', emoji: '⚡' },
                { name: '納西妲', emoji: '🌱' }, { name: '芙寧娜', emoji: '💧' },
                { name: '鍾離', emoji: '🛡️' }, { name: '神里綾華', emoji: '❄️' },
                { name: '溫迪', emoji: '🌪️' }, { name: '楓原萬葉', emoji: '🍁' },
                { name: '夜蘭', emoji: '🎲' }, { name: '甘雨', emoji: '🏹' },
                { name: '魈', emoji: '👹' }, { name: '八重神子', emoji: '🦊' },
                { name: '神里綾人', emoji: '🧋' }, { name: '那維萊特', emoji: '⚖️' },
                { name: '林尼', emoji: '🎩' }, { name: '萊歐斯利', emoji: '🥊' },
                { name: '妮露', emoji: '💃' }, { name: '艾爾海森', emoji: '🎧' },
                { name: '阿蕾奇諾', emoji: '🔥' }, { name: '瑪拉妮', emoji: '🦈' },
                { name: '基尼奇', emoji: '🦖' }, { name: '希諾寧', emoji: '🐆' },
                { name: '可莉', emoji: '💣' }, { name: '達達利亞', emoji: '🐳' },
                { name: '宵宮', emoji: '🎇' }, { name: '珊瑚宮心海', emoji: '🐟' },
                { name: '荒瀧一斗', emoji: '🪨' }, { name: '流浪者', emoji: '🎐' }
            ],
            star4: [
                { name: '香菱', emoji: '🌶️' }, { name: '行秋', emoji: '📚' },
                { name: '班尼特', emoji: '👍' }, { name: '菲謝爾', emoji: '🐦‍⬛' },
                { name: '芭芭拉', emoji: '🎵' }, { name: '迪奧娜', emoji: '🐱' },
                { name: '諾艾爾', emoji: '🧹' }, { name: '凝光', emoji: '💎' },
                { name: '北斗', emoji: '🏴‍☠️' }, { name: '重雲', emoji: '🍦' },
                { name: '雷澤', emoji: '🐺' }, { name: '砂糖', emoji: '🧪' },
                { name: '羅莎莉亞', emoji: '🦇' }, { name: '煙緋', emoji: '⚖️' },
                { name: '早柚', emoji: '🥷' }, { name: '托馬', emoji: '🧹' },
                { name: '五郎', emoji: '🐕' }, { name: '雲堇', emoji: '🎭' },
                { name: '久岐忍', emoji: '🥷' }, { name: '鹿野院平藏', emoji: '👊' },
                { name: '柯萊', emoji: '🪃' }, { name: '多莉', emoji: '💰' },
                { name: '萊依拉', emoji: '😴' }, { name: '琺露珊', emoji: '📐' },
                { name: '瑤瑤', emoji: '🐇' }, { name: '卡維', emoji: '🏛️' },
                { name: '綺良良', emoji: '📦' }, { name: '琳妮特', emoji: '🐈‍⬛' },
                { name: '菲米尼', emoji: '🐧' }, { name: '夏洛蒂', emoji: '📸' },
                { name: '夏沃蕾', emoji: '🔫' }, { name: '嘉明', emoji: '🦁' },
                { name: '卡齊娜', emoji: '🛹' }, { name: '賽索斯', emoji: '🏜️' }
            ],
            star3: [
                { name: '黎明神劍', emoji: '🗡️' }, { name: '討龍英傑譚', emoji: '📖' },
                { name: '黑纓槍', emoji: '🎋' }, { name: '彈弓', emoji: '🏹' },
                { name: '飛天御劍', emoji: '⚔️' }, { name: '冷刃', emoji: '🔪' },
                { name: '魔導緒論', emoji: '📘' }, { name: '神射手之誓', emoji: '🎯' },
                { name: '沐浴龍血的劍', emoji: '🗡️' }, { name: '鐵影闊劍', emoji: '🛡️' },
                { name: '翡玉法球', emoji: '🔮' }, { name: '鴉羽弓', emoji: '🪶' }
            ]
        };

        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function pullOne() {
            const rand = Math.random() * 100;
            if (rand < 3) return { ...getRandomItem(pool.star5), rarity: 5 };
            else if (rand < 18) return { ...getRandomItem(pool.star4), rarity: 4 };
            else return { ...getRandomItem(pool.star3), rarity: 3 };
        }

        function gacha(times) {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = ''; 

            let pulls = [];
            let hasFourStarOrHigher = false;

            for (let i = 0; i < times; i++) {
                let item = pullOne();
                if (item.rarity >= 4) hasFourStarOrHigher = true;
                pulls.push(item);
            }

            // 十連抽保底機制
            if (times === 10 && !hasFourStarOrHigher) {
                pulls[Math.floor(Math.random() * 10)] = { ...getRandomItem(pool.star4), rarity: 4 };
            }

            // 渲染結果與俐落的延遲動畫
            pulls.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `card star-${item.rarity}`;
                
                // 動畫節奏加快，展現帥氣感
                card.style.animationDelay = `${index * 0.08}s`; 

                let starsHtml = '';
                for(let s=0; s<item.rarity; s++) starsHtml += '★';

                card.innerHTML = `
                    <div class="emoji">${item.emoji}</div>
                    <div class="name">${item.name}</div>
                    <div class="stars">${starsHtml}</div>
                `;

                resultsContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
