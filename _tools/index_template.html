<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__SITE_TITLE__</title>
<!-- 這個檔案由 _tools/generate_index.ps1 產生，請不要直接修改；要改外觀請改 _tools/index_template.html -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字型由下方程式依 site-config.json 的 font（或訪客自己選的）載入，只下載用到的那一套 -->
<style>
  :root {
    --bg: #FFF0F5;
    --dot: #FADADD;
    --text: #5D4037;
    --muted: #8D6E63;
    --card: #FFFFFF;
    --line: #FADADD;
    --pink: #FF8FAB;
    --pink-deep: #E85D88;
    --orange: #FFB74D;
    --shadow: rgba(255, 143, 171, 0.25);
    --lv0: #FFE4EC; --lv0b: #FFC2D4;
    --lv1: #E3F7EA; --lv1b: #B5E6C6;
    --lv2: #FFF6D6; --lv2b: #FFE08A;
    --lv3: #E3F0FD; --lv3b: #B9D8F7;
    --mark: #FFE08A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font, 'Microsoft JhengHei'), 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
    color: var(--text);
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 2px, transparent 2.5px);
    background-size: 26px 26px;
    line-height: 1.65;
    min-height: 100vh;
    padding: 28px 16px 48px;
    overflow-x: hidden;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  /* ---------- 標題 ---------- */
  header.hero {
    position: relative;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 30px 30px 30px 30px / 34px 34px 26px 26px;
    box-shadow: 0 10px 24px var(--shadow);
    padding: 28px 24px 22px;
    text-align: center;
    margin-bottom: 20px;
    overflow: hidden;
  }
  header.hero::before, header.hero::after {
    content: ''; position: absolute; border-radius: 50%; opacity: .55; pointer-events: none;
  }
  header.hero::before { width: 120px; height: 120px; background: var(--lv1); top: -50px; left: -40px; }
  header.hero::after  { width: 90px;  height: 90px;  background: var(--lv2); bottom: -38px; right: -26px; }
  .hero h1 {
    position: relative;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    font-weight: 800;
    color: var(--pink-deep);
    letter-spacing: .04em;
    line-height: 1.35;
    word-break: break-word;
  }
  .hero h1 .deco { display: inline-block; animation: bob 2.6s ease-in-out infinite; }
  .hero p.sub { position: relative; color: var(--muted); margin-top: 6px; font-size: .98rem; }
  .stats { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }
  .chip {
    background: var(--bg); border: 2px solid var(--line); border-radius: 50px;
    padding: 4px 14px; font-size: .9rem; font-weight: 700; white-space: nowrap;
  }
  .chip b { color: var(--pink-deep); font-size: 1.05rem; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-6deg); } }

  /* ---------- 工具列 ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .search {
    flex: 1 1 240px; min-width: 0; position: relative;
  }
  .search input {
    width: 100%; font: inherit; color: var(--text);
    border: 3px solid var(--line); border-radius: 50px; background: var(--card);
    padding: 10px 44px 10px 44px; outline: none;
    box-shadow: 0 4px 12px var(--shadow);
    transition: border-color .2s, box-shadow .2s;
  }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search input:focus { border-color: var(--pink); box-shadow: 0 6px 16px rgba(255,143,171,.4); }
  .search .ico { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .search button.clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: none; background: var(--bg); color: var(--muted); width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; font: inherit; display: none;
  }
  .search.has-text button.clear { display: block; }
  .btn {
    font: inherit; font-weight: 700; font-size: .92rem; cursor: pointer;
    border: 3px solid #fff; border-radius: 50px; padding: 8px 16px;
    background: var(--pink); color: #fff;
    box-shadow: 0 4px 12px rgba(255, 143, 171, .45);
    transition: transform .18s, box-shadow .18s;
    white-space: nowrap;
  }
  .btn.alt { background: var(--orange); box-shadow: 0 4px 12px rgba(255, 183, 77, .45); }
  .btn:hover { transform: scale(1.06); }
  .btn:focus-visible, .folder-head:focus-visible, a:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 2px; }

  /* ---------- 最近更新 ---------- */
  .panel {
    background: var(--card); border: 3px solid var(--line); border-radius: 24px;
    box-shadow: 0 8px 18px var(--shadow); padding: 16px 18px; margin-bottom: 18px;
  }
  .panel h2 { font-size: 1.05rem; margin-bottom: 10px; color: var(--pink-deep); }
  .recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .recent a {
    display: block; text-decoration: none; color: inherit;
    background: var(--lv2); border: 2px solid var(--lv2b); border-radius: 18px; padding: 8px 12px;
    transition: transform .18s; min-width: 0;
  }
  .recent a:hover { transform: scale(1.03); }
  .recent .r-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent .r-where { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 樹狀清單 ---------- */
  .tree, .tree ul { list-style: none; }
  .tree ul { margin: 8px 0 4px 18px; padding-left: 12px; border-left: 3px dashed var(--line); }
  .tree li { margin: 8px 0; min-width: 0; }

  .page {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 3px solid var(--line); border-radius: 20px;
    padding: 10px 14px; text-decoration: none; color: inherit;
    box-shadow: 0 4px 10px var(--shadow);
    transition: transform .18s, border-color .18s, box-shadow .18s;
    min-width: 0;
  }
  .page:hover { transform: scale(1.02); border-color: var(--pink); box-shadow: 0 8px 18px rgba(255,143,171,.35); }
  .page .ico { font-size: 1.45rem; flex-shrink: 0; }
  .page .info { flex: 1; min-width: 0; }
  .page .name { font-weight: 700; word-break: break-word; }
  .page .title { font-size: .82rem; color: var(--muted); word-break: break-word; }
  .page .date { font-size: .78rem; color: var(--muted); white-space: nowrap; flex-shrink: 0;
                background: var(--bg); border-radius: 50px; padding: 2px 10px; }
  .page.home-page { background: var(--lv1); border-color: var(--lv1b); }

  .folder-row { display: flex; align-items: stretch; gap: 8px; min-width: 0; }
  .folder-head {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
    border: 3px solid var(--lv0b); background: var(--lv0); border-radius: 22px;
    padding: 10px 14px;
    box-shadow: 0 4px 10px var(--shadow);
    transition: transform .18s, box-shadow .18s;
  }
  .folder-head:hover { transform: scale(1.015); box-shadow: 0 8px 18px rgba(255,143,171,.35); }
  .lv1 > .folder-row .folder-head { background: var(--lv1); border-color: var(--lv1b); }
  .lv2 > .folder-row .folder-head { background: var(--lv2); border-color: var(--lv2b); }
  .lv3 > .folder-row .folder-head { background: var(--lv3); border-color: var(--lv3b); }
  .folder-head .chev {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: #fff;
    display: grid; place-items: center; font-size: .75rem; color: var(--pink-deep);
    transition: transform .25s;
  }
  .folder.open > .folder-row .chev { transform: rotate(90deg); }
  .folder-head .ico { font-size: 1.45rem; flex-shrink: 0; }
  .folder-head .name { flex: 1; min-width: 0; font-weight: 800; word-break: break-word; }
  .folder-head .count {
    flex-shrink: 0; background: #fff; border-radius: 50px; padding: 1px 10px;
    font-size: .8rem; font-weight: 700; color: var(--pink-deep);
  }
  .home-btn {
    flex-shrink: 0; display: flex; align-items: center; gap: 4px;
    text-decoration: none; font-weight: 700; font-size: .88rem; color: #fff;
    background: var(--orange); border: 3px solid #fff; border-radius: 22px; padding: 0 14px;
    box-shadow: 0 4px 10px rgba(255, 183, 77, .45);
    transition: transform .18s;
  }
  .home-btn:hover { transform: scale(1.06); }
  .folder > ul { display: none; }
  .folder.open > ul { display: block; animation: pop .22s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  mark { background: var(--mark); color: inherit; border-radius: 6px; padding: 0 2px; }
  .empty {
    text-align: center; color: var(--muted); padding: 34px 16px;
    background: var(--card); border: 3px dashed var(--line); border-radius: 24px;
  }
  .empty .big { font-size: 2.2rem; display: block; margin-bottom: 4px; }
  footer { text-align: center; margin-top: 34px; color: var(--muted); font-size: .85rem; }
  .font-pick { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-weight: 700; }
  .font-pick select {
    font: inherit; font-weight: 400; color: var(--text); cursor: pointer;
    background: var(--card); border: 3px solid var(--line); border-radius: 50px; padding: 4px 12px;
    max-width: 70vw;
  }
  .font-pick select:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 2px; }

  @media (max-width: 560px) {
    body { padding: 18px 12px 40px; }
    .tree ul { margin-left: 8px; padding-left: 8px; }
    .search { flex-basis: 100%; }
    .toolbar .btn { flex: 1; }
    .recent a:nth-child(n+4) { display: none; }
    .page { flex-wrap: wrap; gap: 2px 10px; padding: 10px 12px; }
    .page .info { flex-basis: calc(100% - 46px); }
    .page .date { margin-left: 36px; }
    .folder-head { padding: 9px 10px; gap: 8px; }
    .home-btn { padding: 0 10px; }
    .home-btn .t { display: none; }
    .btn { padding: 7px 13px; font-size: .86rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1><span class="deco">🌸</span> <span id="siteTitle">__SITE_TITLE__</span> <span class="deco">🎀</span></h1>
    <p class="sub" id="siteSub"></p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <div class="search" id="searchBox">
      <span class="ico">🔍</span>
      <input id="q" type="search" placeholder="找網頁：輸入名稱或關鍵字" aria-label="搜尋網頁" autocomplete="off">
      <button class="clear" id="clearQ" type="button" aria-label="清除搜尋">✕</button>
    </div>
    <button class="btn" id="expandAll" type="button">📂 全部展開</button>
    <button class="btn alt" id="collapseAll" type="button">📁 全部收合</button>
  </div>

  <section class="panel" id="recentPanel" hidden>
    <h2>✨ 最近更新</h2>
    <div class="recent" id="recent"></div>
  </section>

  <main>
    <ul class="tree" id="tree"></ul>
    <div class="empty" id="empty" hidden></div>
  </main>

  <footer>
    <div id="footer"></div>
    <label class="font-pick">🔤 字型
      <select id="fontSel" aria-label="選擇字型"></select>
    </label>
  </footer>
</div>

<script>
window.SITE_DATA = __SITE_DATA__;
</script>
<script>
(function () {
  'use strict';
  var D = window.SITE_DATA;
  var STORE_KEY = 'ws-tree-open:' + location.pathname;
  var openSet = loadOpen();
  var treeEl = document.getElementById('tree');
  var emptyEl = document.getElementById('empty');
  var qEl = document.getElementById('q');
  var allPages = [];   // { node, where }

  function loadOpen() {
    try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]')); } catch (e) { return new Set(); }
  }
  function saveOpen() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(openSet))); } catch (e) {}
  }
  function href(path) {
    return './' + path.split('/').map(encodeURIComponent).join('/');
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  // 顯示路徑時拿掉最前面的 Htmls
  function where(path) {
    var parts = path.split('/'); parts.shift(); parts.pop();
    return parts.length ? parts.join(' › ') : '最上層';
  }
  // 把關鍵字標上螢光筆（用 DOM 組，不用 innerHTML，檔名有特殊字元也安全）
  function setText(node, text, q) {
    node.textContent = '';
    if (!q) { node.textContent = text; return; }
    var low = text.toLowerCase(), i = 0, j;
    while ((j = low.indexOf(q, i)) !== -1) {
      if (j > i) node.appendChild(document.createTextNode(text.slice(i, j)));
      node.appendChild(el('mark', null, text.slice(j, j + q.length)));
      i = j + q.length;
    }
    if (i < text.length) node.appendChild(document.createTextNode(text.slice(i)));
  }

  function pageItem(f, q, icon, extraCls) {
    var a = el('a', 'page' + (extraCls ? ' ' + extraCls : ''));
    a.href = href(f.path);
    a.appendChild(el('span', 'ico', icon || '📄'));
    var info = el('span', 'info');
    // 顯示網頁的 <title>；沒有 title 才用檔名。檔名放在滑鼠提示裡
    var nm = el('span', 'name'); setText(nm, label(f), q); info.appendChild(nm); nm.style.display = 'block';
    a.title = (f.title ? f.title + '\n' : '') + '檔案：' + f.path.split('/').pop();
    a.appendChild(info);
    if (f.mtime) a.appendChild(el('span', 'date', '🕒 ' + f.mtime.slice(0, 10)));
    return a;
  }

  // 首頁只顯示 title 中「｜」（或半形 |）前面的第一段，例如「單元1 太陽的祕密｜自然五上｜互動學習網」→「單元1 太陽的祕密」
  function shortTitle(t) {
    if (!t) return '';
    var first = t.split(/[｜|]/)[0].trim();
    return first || t.trim();
  }
  function label(f) { return shortTitle(f.title) || f.name; }
  function matches(text, q) { return !!text && text.toLowerCase().indexOf(q) !== -1; }

  // 回傳 <li> 或 null（搜尋時沒有符合的就不顯示）
  function buildFolder(d, depth, q) {
    // 資料夾有 index.html 就顯示它的 <title>，沒有才用資料夾名稱
    var folderLabel = (d.index && shortTitle(d.index.title)) || d.name;
    var selfHit = q && (matches(d.name, q) || matches(folderLabel, q));
    var kids = [];
    d.children.forEach(function (c) {
      var li = c.t === 'd' ? buildFolder(c, depth + 1, selfHit ? '' : q) : buildFile(c, q && !selfHit ? q : '');
      if (li) kids.push(li);
    });
    var indexHit = q && d.index && matches(d.index.title, q);
    if (q && !selfHit && !indexHit && kids.length === 0) return null;

    // 只有 index.html、沒有其他網頁的資料夾 → 直接當一個網頁顯示
    if (d.index && d.children.length === 0) {
      var li0 = el('li');
      li0.appendChild(pageItem({ name: d.name, title: d.index.title, path: d.index.path, mtime: d.index.mtime }, q, '🏠', 'home-page'));
      return li0;
    }

    var li = el('li', 'folder lv' + (depth % 4));
    var open = q ? true : openSet.has(d.path);
    if (open) li.classList.add('open');
    var row = el('div', 'folder-row');
    var head = el('button', 'folder-head');
    head.type = 'button';
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    head.appendChild(el('span', 'chev', '▶'));
    head.appendChild(el('span', 'ico', open ? '📂' : '📁'));
    var nm = el('span', 'name'); setText(nm, folderLabel, q); head.appendChild(nm);
    head.title = (d.index && d.index.title ? d.index.title + '\n' : '') + '資料夾：' + d.name;
    head.appendChild(el('span', 'count', d.count + ' 頁'));
    head.addEventListener('click', function () {
      var now = !li.classList.contains('open');
      li.classList.toggle('open', now);
      head.setAttribute('aria-expanded', now ? 'true' : 'false');
      head.querySelector('.ico').textContent = now ? '📂' : '📁';
      if (!qEl.value.trim()) { if (now) openSet.add(d.path); else openSet.delete(d.path); saveOpen(); }
    });
    row.appendChild(head);
    if (d.index) {
      var hb = el('a', 'home-btn');
      hb.href = href(d.index.path);
      hb.title = '開啟「' + d.name + '」的首頁';
      hb.appendChild(el('span', null, '🏠'));
      hb.appendChild(el('span', 't', '首頁'));
      row.appendChild(hb);
    }
    li.appendChild(row);
    li.dataset.path = d.path;
    var ul = el('ul');
    kids.forEach(function (k) { ul.appendChild(k); });
    li.appendChild(ul);
    return li;
  }
  function buildFile(f, q) {
    if (q && !matches(f.name, q) && !matches(f.title, q)) return null;
    var li = el('li');
    li.appendChild(pageItem(f, q));
    return li;
  }

  function collect(d) {
    if (d.index) allPages.push({ name: shortTitle(d.index.title) || d.name, path: d.index.path, mtime: d.index.mtime });
    d.children.forEach(function (c) {
      if (c.t === 'd') collect(c); else allPages.push({ name: label(c), path: c.path, mtime: c.mtime });
    });
  }

  function render() {
    var q = qEl.value.trim().toLowerCase();
    document.getElementById('searchBox').classList.toggle('has-text', !!q);
    treeEl.textContent = '';
    var n = 0;
    D.tree.children.forEach(function (c) {
      var li = c.t === 'd' ? buildFolder(c, 0, q) : buildFile(c, q);
      if (li) { treeEl.appendChild(li); n++; }
    });
    emptyEl.hidden = n > 0;
    if (n === 0) {
      emptyEl.textContent = '';
      emptyEl.appendChild(el('span', 'big', q ? '🔎' : '🌱'));
      emptyEl.appendChild(document.createTextNode(q ? '找不到「' + qEl.value.trim() + '」，換個關鍵字試試看～' : '目前還沒有網頁，把 .html 檔放進 Htmls 資料夾就會出現在這裡喔！'));
    }
    document.getElementById('recentPanel').hidden = !!q || allPages.length < 4;
  }

  function setAll(open) {
    qEl.value = '';
    openSet = new Set();
    if (open) {
      (function walk(d) { d.children.forEach(function (c) { if (c.t === 'd') { openSet.add(c.path); walk(c); } }); })(D.tree);
    }
    saveOpen();
    render();
  }

  // ---------- 初始化 ----------
  document.title = D.title;
  document.getElementById('siteTitle').textContent = D.title;
  document.getElementById('siteSub').textContent = D.subtitle || '';
  var stats = document.getElementById('stats');
  [['📄', D.pages, ' 個網頁'], ['📁', D.folders, ' 個資料夾'], ['🕒', D.generated, ' 更新']].forEach(function (s) {
    var c = el('span', 'chip');
    c.appendChild(document.createTextNode(s[0] + ' '));
    c.appendChild(el('b', null, String(s[1])));
    c.appendChild(document.createTextNode(s[2]));
    stats.appendChild(c);
  });
  document.getElementById('footer').textContent = '🍬 最後更新：' + D.generated + '　·　本頁由 Sync.bat 自動產生';

  // ---------- 字型：預設用 site-config.json 的 font，訪客可在頁尾自己換（記在這台瀏覽器） ----------
  // 都是有完整繁體中文的字型；舊版用的 M PLUS Rounded 1c 是日文字型，缺「啟圖錄關」等字，會混到別的字型
  var FONTS = {
    huninn: { label: '粉圓體（可愛圓體）', family: "'Huninn'", css: 'Huninn' },
    chiron: { label: '昭源圓體（端正圓體）', family: "'Chiron GoRound TC'", css: 'Chiron+GoRound+TC:wght@400;700;800' },
    iansui: { label: '芫荽（手寫風）', family: "'Iansui'", css: 'Iansui' },
    wenkai: { label: '霞鶩文楷（楷書風）', family: "'LXGW WenKai TC'", css: 'LXGW+WenKai+TC:wght@400;700' },
    system: { label: '微軟正黑體（不用下載）', family: "'Microsoft JhengHei'", css: '' }
  };
  var FONT_KEY = 'ws-font:' + location.pathname;
  var fontSel = document.getElementById('fontSel');
  Object.keys(FONTS).forEach(function (k) {
    var o = el('option', null, FONTS[k].label); o.value = k; fontSel.appendChild(o);
  });
  function applyFont(key) {
    if (!FONTS[key]) key = 'huninn';
    var f = FONTS[key];
    if (f.css) {
      var link = document.getElementById('fontCss');
      if (!link) { link = document.createElement('link'); link.id = 'fontCss'; link.rel = 'stylesheet'; document.head.appendChild(link); }
      link.href = 'https://fonts.googleapis.com/css2?family=' + f.css + '&display=swap';
    }
    document.documentElement.style.setProperty('--font', f.family);
    fontSel.value = key;
  }
  var savedFont = null;
  try { savedFont = localStorage.getItem(FONT_KEY); } catch (e) {}
  applyFont(savedFont || D.font || 'huninn');
  fontSel.addEventListener('change', function () {
    applyFont(fontSel.value);
    try { localStorage.setItem(FONT_KEY, fontSel.value); } catch (e) {}
  });

  collect(D.tree);
  var recent = allPages.slice().sort(function (a, b) { return a.mtime < b.mtime ? 1 : a.mtime > b.mtime ? -1 : 0; }).slice(0, 6);
  var recentEl = document.getElementById('recent');
  recent.forEach(function (p) {
    var a = el('a'); a.href = href(p.path);
    a.appendChild(el('div', 'r-name', '📄 ' + p.name));
    a.appendChild(el('div', 'r-where', '📍 ' + where(p.path) + '　🕒 ' + (p.mtime || '').slice(0, 10)));
    recentEl.appendChild(a);
  });

  var timer;
  qEl.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(render, 120); });
  document.getElementById('clearQ').addEventListener('click', function () { qEl.value = ''; render(); qEl.focus(); });
  document.getElementById('expandAll').addEventListener('click', function () { setAll(true); });
  document.getElementById('collapseAll').addEventListener('click', function () { setAll(false); });
  render();
})();
</script>
</body>
</html>
