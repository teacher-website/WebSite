<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>閃避賽車小遊戲 🏎️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50; /* 深色背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Microsoft JhengHei', sans-serif;
            color: #ecf0f1;
        }

        h1 {
            color: #f1c40f;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 10px;
        }

        p {
            margin-top: 0;
            font-size: 16px;
            color: #bdc3c7;
        }

        .game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 5px solid #bdc3c7;
        }

        canvas {
            display: block;
            background-color: #7f8c8d; /* 柏油路顏色 */
        }

        #restartBtn {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #e74c3c;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #restartBtn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <h1>🏎️ 閃避賽車小遊戲 🏎️</h1>
    <p>使用鍵盤的 <b>「左(←)」</b> 與 <b>「右(→)」</b> 方向鍵來躲避車輛！</p>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <button id="restartBtn" onclick="resetGame()">重新開始</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const restartBtn = document.getElementById("restartBtn");

        // 遊戲狀態
        let isGameOver = false;
        let score = 0;
        let speedMultiplier = 1;
        let frames = 0;

        // 玩家車輛設定
        const player = {
            width: 40,
            height: 70,
            x: canvas.width / 2 - 20,
            y: canvas.height - 100,
            speed: 6,
            dx: 0,
            color: "#e74c3c" // 紅色
        };

        // 障礙物車輛陣列
        let enemies = [];

        // 道路標線設定
        let lines = [];
        for (let i = 0; i < canvas.height; i += 60) {
            lines.push(i);
        }

        // 監聽鍵盤事件
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") {
                player.dx = -player.speed;
            } else if (e.key === "ArrowRight" || e.key === "d") {
                player.dx = player.speed;
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "a" || e.key === "d") {
                player.dx = 0;
            }
        });

        // 畫車輛的共用函數 (簡單的矩形組合)
        function drawCar(x, y, width, height, color) {
            // 車身
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            
            // 擋風玻璃
            ctx.fillStyle = "#ecf0f1";
            ctx.fillRect(x + 5, y + 15, width - 10, 15);
            ctx.fillRect(x + 5, y + height - 20, width - 10, 10);

            // 輪胎
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(x - 3, y + 10, 3, 15);
            ctx.fillRect(x + width, y + 10, 3, 15);
            ctx.fillRect(x - 3, y + height - 25, 3, 15);
            ctx.fillRect(x + width, y + height - 25, 3, 15);
        }

        // 畫道路標線
        function drawRoad() {
            ctx.fillStyle = "#bdc3c7";
            for (let i = 0; i < lines.length; i++) {
                ctx.fillRect(canvas.width / 2 - 5, lines[i], 10, 30);
                // 標線往下移動模擬速度感
                if (!isGameOver) {
                    lines[i] += 5 * speedMultiplier;
                }
                // 超出底部就移回頂部
                if (lines[i] > canvas.height) {
                    lines[i] = -30;
                }
            }
        }

        // 產生敵方車輛
        function spawnEnemy() {
            let enemyWidth = 40;
            let enemyHeight = 70;
            let xPos = Math.random() * (canvas.width - enemyWidth);
            // 隨機顏色：藍色、黃色、綠色
            let colors = ["#3498db", "#f1c40f", "#2ecc71"];
            let randomColor = colors[Math.floor(Math.random() * colors.length)];

            enemies.push({
                x: xPos,
                y: -enemyHeight,
                width: enemyWidth,
                height: enemyHeight,
                speed: (Math.random() * 2 + 3) * speedMultiplier,
                color: randomColor
            });
        }

        // 碰撞偵測 (AABB)
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        // 更新遊戲邏輯
        function update() {
            if (isGameOver) return;

            // 移動玩家
            player.x += player.dx;

            // 邊界限制
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // 更新敵方車輛
            for (let i = 0; i < enemies.length; i++) {
                enemies[i].y += enemies[i].speed;

                // 碰撞判定
                if (checkCollision(player, enemies[i])) {
                    isGameOver = true;
                    restartBtn.style.display = "block";
                }

                // 移除超過畫面的車輛並加分
                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    i--;
                    score++;
                    
                    // 每 10 分增加一點遊戲速度
                    if (score % 10 === 0) {
                        speedMultiplier += 0.1;
                    }
                }
            }

            frames++;
            // 根據速度動態調整生成敵方車輛的頻率
            let spawnRate = Math.max(30, 90 - Math.floor(speedMultiplier * 10));
            if (frames % spawnRate === 0) {
                spawnEnemy();
            }
        }

        // 渲染畫面
        function draw() {
            // 清除畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#7f8c8d";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 畫道路
            drawRoad();

            // 畫玩家車輛
            drawCar(player.x, player.y, player.width, player.height, player.color);

            // 畫敵方車輛
            for (let i = 0; i < enemies.length; i++) {
                drawCar(enemies[i].x, enemies[i].y, enemies[i].width, enemies[i].height, enemies[i].color);
            }

            // 畫分數
            ctx.fillStyle = "#fff";
            ctx.font = "24px 'Microsoft JhengHei', sans-serif";
            ctx.fillText("分數: " + score, 15, 35);

            // 遊戲結束文字
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#e74c3c";
                ctx.font = "40px 'Microsoft JhengHei', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("遊戲結束!", canvas.width / 2, canvas.height / 2 - 50);
                ctx.textAlign = "left"; // 恢復設定
            }
        }

        // 遊戲主迴圈
        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        // 重新開始遊戲
        function resetGame() {
            isGameOver = false;
            score = 0;
            speedMultiplier = 1;
            frames = 0;
            enemies = [];
            player.x = canvas.width / 2 - 20;
            restartBtn.style.display = "none";
            gameLoop();
        }

        // 啟動遊戲
        gameLoop();
    </script>
</body>
</html>
