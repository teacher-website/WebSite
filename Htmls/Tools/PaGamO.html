<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>環境與防災題庫練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Nunito:wght@600;800&display=swap">
<style>
:root {
  --bg: #FFF0F5; --mint: #F0FFF4; --cream: #FFFDE7; --sky: #E3F2FD;
  --text: #5D4037; --soft: #8D6E63; --pink: #FF8FAB; --pink-d: #F06292; --orange: #FFB74D;
  --line: #FADADD; --ok: #66BB6A; --ok-bg: #E8F5E9; --bad: #EF7A85; --bad-bg: #FFEBEE;
  --shadow: 0 8px 16px rgba(255, 182, 193, 0.4);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--text); line-height: 1.7;
  font-family: 'M PLUS Rounded 1c', 'Nunito', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
  background-color: var(--bg);
  background-image: radial-gradient(#FFD6E0 2px, transparent 2px), radial-gradient(#D7F5E3 2px, transparent 2px);
  background-size: 36px 36px; background-position: 0 0, 18px 18px;
}
main { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; }
h1 { text-align: center; font-size: 1.9rem; margin: 8px 0 2px; color: var(--pink-d); letter-spacing: 1px; }
.sub { text-align: center; color: var(--soft); margin: 0 0 18px; font-size: .95rem; }
.card {
  background: #fff; border: 3px solid var(--line); border-radius: 26px; box-shadow: var(--shadow);
  padding: 20px 22px; margin-bottom: 18px;
}
.card h2 { margin: 0 0 10px; font-size: 1.15rem; }
.hidden { display: none !important; }

/* 按鈕 */
.btn {
  border: none; border-radius: 50px; padding: 11px 24px; font: inherit; font-weight: 800; cursor: pointer;
  background: var(--pink); color: #fff; box-shadow: 0 4px 12px rgba(255, 143, 171, .45);
  transition: transform .15s, box-shadow .15s; font-size: 1rem;
}
.btn:hover { transform: scale(1.06); box-shadow: 0 6px 18px rgba(255, 143, 171, .55); }
.btn:active { transform: scale(.97); }
.btn.alt { background: #fff; color: var(--pink-d); border: 3px solid var(--line); box-shadow: none; }
.btn.orange { background: var(--orange); box-shadow: 0 4px 12px rgba(255, 183, 77, .45); }
.btn.big { font-size: 1.25rem; padding: 14px 38px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.center { justify-content: center; }

/* 主題選擇 */
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.topic {
  border: 3px solid var(--line); border-radius: 20px; padding: 10px 14px; cursor: pointer; background: var(--cream);
  transition: transform .15s, background .15s; user-select: none;
}
.topic:hover { transform: scale(1.04); }
.topic.on { background: #FFE3EC; border-color: var(--pink); }
.topic .name { font-weight: 800; }
.topic .meta { font-size: .82rem; color: var(--soft); }
.bar { height: 8px; border-radius: 8px; background: #F3E5E9; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #FFB3C6, var(--pink)); border-radius: 8px; }

.seg { display: inline-flex; background: var(--sky); border-radius: 50px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button {
  border: none; background: transparent; border-radius: 50px; padding: 7px 16px; font: inherit; cursor: pointer;
  color: var(--text); font-weight: 700;
}
.seg button.on { background: #fff; color: var(--pink-d); box-shadow: 0 3px 8px rgba(144, 202, 249, .5); }
.label { font-weight: 800; margin-right: 6px; min-width: 64px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.mode {
  border-radius: 24px; padding: 14px 16px; cursor: pointer; border: 3px solid #fff; box-shadow: var(--shadow);
  transition: transform .15s; text-align: left; font: inherit; color: var(--text);
}
.mode:hover { transform: translateY(-3px) scale(1.02); }
.mode b { font-size: 1.1rem; display: block; }
.mode small { color: var(--soft); }
.mode.practice { background: var(--mint); }
.mode.test { background: var(--sky); }
.mode.wrong { background: var(--cream); }
.mode:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* 作答 */
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.pill { background: #fff; border: 3px solid var(--line); border-radius: 50px; padding: 3px 14px; font-weight: 700; font-size: .9rem; }
.progress { height: 14px; background: #fff; border: 3px solid var(--line); border-radius: 20px; overflow: hidden; margin-bottom: 16px; }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #FFC1D4, var(--pink)); transition: width .3s; }
.qtext { font-size: 1.3rem; font-weight: 800; margin: 4px 0 6px; }
.quote { font-size: .88rem; color: #7E9CB8; background: var(--sky); border-radius: 16px; padding: 6px 12px; display: inline-block; margin-bottom: 12px; }
.opts { display: grid; gap: 10px; }
.opts.tf { grid-template-columns: 1fr 1fr; }
.opt {
  display: flex; gap: 12px; align-items: center; text-align: left; font: inherit; font-size: 1.08rem; color: var(--text);
  background: #fff; border: 3px solid var(--line); border-radius: 20px; padding: 12px 16px; cursor: pointer;
  transition: transform .12s, background .15s;
}
.opt:hover:not(:disabled) { transform: scale(1.02); background: #FFF7FA; }
.opt .key {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--bg); font-weight: 800; color: var(--pink-d);
}
.opts.tf .opt { justify-content: center; font-size: 1.4rem; font-weight: 800; padding: 18px; }
.opt.correct { background: var(--ok-bg); border-color: var(--ok); }
.opt.correct .key { background: var(--ok); color: #fff; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); animation: shake .35s; }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.picked { border-color: var(--pink); background: #FFE3EC; }
.opt:disabled { cursor: default; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.feedback { margin-top: 14px; border-radius: 20px; padding: 12px 16px; }
.feedback.ok { background: var(--ok-bg); }
.feedback.bad { background: var(--bad-bg); }
.feedback .title { font-weight: 800; font-size: 1.1rem; }
.feedback .src { font-size: .82rem; color: var(--soft); margin-top: 4px; }
.pop { animation: pop .35s; }
@keyframes pop { 0% { transform: scale(.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* 結果 */
.score { text-align: center; }
.score .big { font-family: 'Nunito', sans-serif; font-size: 4rem; font-weight: 800; color: var(--pink-d); line-height: 1.1; }
.stars { font-size: 2rem; letter-spacing: 6px; }
.bounce { display: inline-block; animation: bounce 1.2s infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
details.wq { border: 3px solid var(--line); border-radius: 18px; padding: 8px 14px; margin-bottom: 8px; background: #fff; }
details.wq summary { cursor: pointer; font-weight: 700; }
details.wq .ans { color: var(--ok); font-weight: 800; }
.foot { text-align: center; color: var(--soft); font-size: .8rem; margin-top: 24px; }

/* 我是誰 */
.me { background: var(--cream); }
.me input {
  font: inherit; color: var(--text); border: 3px solid var(--line); border-radius: 16px; padding: 7px 12px;
  width: 92px; background: #fff; outline: none;
}
.me input.name { width: 150px; }
.me input:focus { border-color: var(--pink); }
.me .who { font-size: 1.15rem; font-weight: 800; }
.me.need { animation: glow 1s 3; }
@keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(255, 143, 171, .55); } }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #fff; color: var(--text);
  border: 3px solid var(--pink); border-radius: 50px; padding: 10px 22px; font-weight: 800; box-shadow: var(--shadow);
  z-index: 10; max-width: 92vw; text-align: center;
}
table.rec { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: .9rem; }
table.rec td, table.rec th { padding: 4px 8px; text-align: center; }
table.rec tr td { background: #FFF7FA; }
table.rec tr td:first-child { border-radius: 14px 0 0 14px; }
table.rec tr td:last-child { border-radius: 0 14px 14px 0; }
.hint { font-size: .82rem; color: var(--soft); }
@media (max-width: 560px) {
  h1 { font-size: 1.5rem; }
  .qtext { font-size: 1.12rem; }
  .opts.tf .opt { font-size: 1.15rem; padding: 14px; }
  .card { padding: 16px; }
  .kbd { display: none; }
}
</style>
</head>
<body>
<main>
  <h1>🌸 環境與防災題庫練習 🌸</h1>
  <p class="sub" id="sub"></p>

  <!-- 首頁 -->
  <section id="home">
    <div class="card me" id="meCard">
      <div id="meEdit">
        <h2>👤 我是誰？<span class="hint">（填好才會記錄成績，可以匯出給老師）</span></h2>
        <div class="row">
          <input id="inCls" placeholder="班級 601" inputmode="numeric" maxlength="6">
          <input id="inSeat" placeholder="座號" inputmode="numeric" maxlength="3">
          <input id="inName" class="name" placeholder="姓名" maxlength="12">
          <button class="btn" id="meOk">確定</button>
          <button class="btn alt hidden" id="meCancel">取消</button>
        </div>
      </div>
      <div id="meShow" class="hidden">
        <div class="row" style="justify-content:space-between">
          <span class="who" id="meWho"></span>
          <div class="row">
            <button class="btn orange" id="exportBtn">📤 匯出成績給老師</button>
            <button class="btn alt" id="meChange">換人</button>
          </div>
        </div>
        <div id="recBox" style="margin-top:8px"></div>
      </div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2>① 選主題 <span class="hint" id="pickCount"></span></h2>
        <div class="row">
          <button class="btn alt" id="allOn">全選</button>
          <button class="btn alt" id="allOff">全不選</button>
        </div>
      </div>
      <div class="topics" id="topics"></div>
    </div>
    <div class="card">
      <h2>② 設定</h2>
      <div class="row" style="margin-bottom:10px">
        <span class="label">題數</span>
        <div class="seg" id="segCount">
          <button data-v="10">10 題</button><button data-v="20" class="on">20 題</button>
          <button data-v="50">50 題</button><button data-v="0">全部</button>
        </div>
      </div>
      <div class="row">
        <span class="label">題型</span>
        <div class="seg" id="segType">
          <button data-v="all" class="on">全部</button><button data-v="tf">是非題</button><button data-v="mc">選擇題</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>③ 開始 ✨</h2>
      <div class="modes">
        <button class="mode practice" id="goPractice"><b>🍀 練習模式</b><small>每題答完馬上看答案和詳解</small></button>
        <button class="mode test" id="goTest"><b>📝 測驗模式</b><small>全部做完才看成績</small></button>
        <button class="mode wrong" id="goWrong"><b>🎀 錯題本 <span id="wrongN"></span></b><small>只練習答錯過的題目，答對就移出</small></button>
      </div>
      <p class="hint" style="margin:12px 0 0">作答紀錄只存在這台電腦的這個瀏覽器。
        <a href="#" id="resetAll" style="color:var(--pink-d)">清除我的紀錄</a></p>
    </div>
  </section>

  <!-- 作答 -->
  <section id="quiz" class="hidden">
    <div class="top">
      <span class="pill" id="qPos"></span>
      <span class="pill" id="qTopic"></span>
      <span class="pill" id="qScore"></span>
      <button class="btn alt" id="quit">回首頁</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="card" id="qCard">
      <div class="qtext" id="qText"></div>
      <div class="quote" id="qQuote"></div>
      <div class="opts" id="opts"></div>
      <div class="feedback hidden" id="fb"></div>
      <div class="row center" style="margin-top:14px">
        <button class="btn orange big hidden" id="next">下一題 ➜</button>
      </div>
      <p class="hint kbd" style="text-align:center;margin:10px 0 0">鍵盤：1～4 或 A～D 選答（是非題 O／X），Enter 下一題</p>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="hidden">
    <div class="card score">
      <div class="stars" id="stars"></div>
      <div class="big" id="pct"></div>
      <p id="sumText" style="font-size:1.1rem;margin:4px 0 14px"></p>
      <div class="row center">
        <button class="btn" id="again">再來一次</button>
        <button class="btn orange" id="redoWrong">重做這次答錯的</button>
        <button class="btn alt" id="toHome">回首頁</button>
      </div>
      <p class="hint" id="savedNote" style="margin:12px 0 0"></p>
      <div class="row center" style="margin-top:8px">
        <button class="btn alt" id="exportBtn2">📤 匯出成績給老師</button>
      </div>
    </div>
    <div class="card" id="wrongList"></div>
  </section>

  <p class="foot" id="foot"></p>
</main>
<div class="toast hidden" id="toast"></div>

<script>
const DATA = {"built":"2026-10-04 21:44","topics":[{"name":"水資源","n":133},{"name":"海洋污染","n":46},{"name":"氣候變遷","n":111},{"name":"災害防救","n":363},{"name":"循環經濟","n":60},{"name":"節能減碳","n":60},{"name":"空氣污染","n":55},{"name":"資源回收","n":56},{"name":"食物環保","n":46},{"name":"時事教育","n":13},{"name":"淨零排放","n":60},{"name":"SDGs","n":60},{"name":"永續發展","n":7},{"name":"集水區保育","n":2},{"name":"臺北市環境防災教育題庫","n":59}],"q":[{"i":2837712,"t":"水資源","c":"水資源-台灣","k":"mc","q":"小明的班上參觀了臺灣的幾個水庫，瞭解到水庫有很多功能。請問下列何者不是臺灣水庫的功能？","z":"口說好話，心想好意，身行好事。","o":[["A","水力發電"],["B","農業灌溉"],["C","觀光遊憩"],["D","促進航運"]],"a":"D","e":"雖然在世界上有些地方，水庫可以調節上游水位，讓船隻可以避開礁石，促進航運。但在台灣，水庫並無此功能。","s":"國立臺灣師範大學環境教育研究所"},{"i":2837714,"t":"水資源","c":"水資源-台灣","k":"mc","q":"請問目前台灣最大的水庫為下列何者？","z":"信心、毅力、勇氣三者具備，則天下沒有做不成的事。","o":[["A","石門水庫"],["B","曾文水庫"],["C","德基水庫"],["D","翡翠水庫"]],"a":"B","e":"曾文水庫位於台灣嘉義縣與臺南市交界的柳藤潭峽谷，集水區在嘉義縣大埔鄉境內曾文溪上游大埔溪上，水庫管理局則在臺南市楠西區。為台灣最大的水庫與湖泊，滿水位面積17.14平方公里，同時也是台灣面積最大的水庫，興建之目的主要為提供嘉南地區灌溉用水，另具發電、防洪和觀光的功能，是個多目標利用的水庫。於1967年開始建造，1973年完工。","s":"國立臺灣師範大學環境教育研究所"},{"i":2837715,"t":"水資源","c":"水資源-台灣","k":"mc","q":"西元2021年夏季台灣的缺水問題相當嚴重，許多地區被迫限水或停水，影響許多居民的生活。請問下列何者不是台灣水資源的主要來源？","z":"真正的歡喜，不在於擁有多少，而是有愛。","o":[["A","冰河"],["B","降雨"],["C","河川與湖泊"],["D","地下水"]],"a":"A","e":"台灣水資源主要來源包含降水、降水所形成的地面水（河川、湖泊）以及地下水，而冰河在台灣並非為主要的水資源來源。","s":"國立臺灣師範大學環境教育研究所"},{"i":2837716,"t":"水資源","c":"水資源-台灣","k":"mc","q":"大熊是一位小學老師，最近他在整理關於台灣水資源使用的資料。請問在台灣下列何種用水佔總用水量的比例最高？","z":"素食可培養耐力、慈悲與智慧。","o":[["A","生活用水"],["B","工業用水"],["C","水力發電"],["D","農業用水"]],"a":"D","e":"台灣供水來源以地面水為主，其中河川引水占最多，地下水其次，水庫調節居末。關於台灣的用水情形，以農業用水所佔的比例最高（約70%），其次是生活用水（約20%）與工業用水（約9%）。","s":"國立臺灣師範大學環境教育研究所"},{"i":2837717,"t":"水資源","c":"","k":"mc","q":"最近星星社區面臨缺水問題，社區的小學生科南正在和他的朋友如何節約用水。請問下列誰提出的方法對省水最有幫助？","z":"清淨的生活，從齋戒開始。","o":[["A","科南：每天在家泡澡1個小時"],["B","布美：出門前不需要檢查家裡的水龍頭有無關緊"],["C","圓太：家裡的浴室採用省水馬桶並重複利用水資源"],["D","光焰：拖地完的的髒水直接倒進路邊水溝"]],"a":"C","e":"每天泡澡會大量使用水資源，以淋浴代替泡澡對省水較有幫助。平時出門前應檢查家裡的水龍頭是否有鎖緊，以避免不必要的水資源浪費。拖地完後的髒水可以再利用，例如澆花、沖馬桶。","s":"國立臺灣師範大學環境教育研究所"},{"i":2837718,"t": ,"收集在海中漂流的口罩，重新使用"],["C","從生活中減少使用塑膠製品"],["D","把海洋廢棄物推到別的國家"]],"a":"C","e":"海洋廢棄物大部份是由陸地上使用過之後，未適當回收及處理，就排放到海洋，除了污染水域，殺死海洋野生動物，甚至還會隨著食物鏈不斷累積，最後將這些塑膠吃進肚子的，還是人類自己。回收利用並不能防止塑料廢物對環境的影響，它只是延遲進入垃圾掩埋場或自然環境，從源頭減量並使用替代方案，才有可能逐漸減少塑膠污染。","s":"國立臺灣師範大學環境教育研究所"},{"i":2850398,"t":"海洋污染","c":"海洋污染-全球","k":"mc","q":"日本東部飄出去的海漂垃圾，會透過哪一個洋流流到美國西部海岸?","z":"培養人格，不能說而不做；言行合一，才能影響他人。","o":[["A","北赤道洋流"],["B","北大西洋洋流"],["C","北太平洋洋流"],["D","親潮"]],"a":"C","e":"","s":"國立臺灣師範大學環境教育研究所"},{"i":2850399,"t":"水資源","c":"","k":"mc","q":"地球上水的分佈，以下列何者佔的比例最多？","z":"能做而不做，辜負的是自己生命的使用權。","o":[["A","海水"],["B","冰川"],["C","地下水"],["D","河水"]],"a":"A","e":"地球上水資源分佈，海水約佔總量的97%。其次依序為冰川、地下水、湖泊等。","s":"國立臺灣師範大學環境教育研究所"},{"i":2850400,"t":"水資源","c":"水資源-全球","k":"mc","q":"全世界最長的河川是哪一條？","z":"日食八分飽，二分助人好。","o":[["A","長江"],["B","密西西比河"],["C","尼羅河"],["D","亞馬遜河"]],"a":"C","e":"如果以長度來算的話，世界排名前三的就是非洲的尼羅河(6,670公里）、南美洲的亞馬遜河(6,400公里）以及中國的長江(6,380公里）。世界最長的河流是尼羅河，世界最長十大河流排名中，中國的長江、黃河和黑龍江都榜上有名。","s":"國立臺灣師範大學環境教育研究所"},{"i":2850402,"t":"水資源","c":"","k":"mc","q":"河川的水流向大海，但是數億年來，海水的總量並沒有明顯增加；下列何者為主要原因？","z":"環保，不但是疼惜物命，也是尊重生命。","o":[["A","海水會結冰成為冰山"],["B","海水會蒸發進入大氣"],["C","海水會滲入地表中"],["D","人類與動物大量用水"]],"a":"B","e":"自然界的水在大氣與陸地、海洋間交換，以固體、液體、氣體三態的形式循環不已，稱為「水循環」。水循環可以大致分為蒸發→凝結→降水。流入海洋的水會在經由蒸發過程回到水循環中，因此海水不會因為河水持續流入而增加。","s":"國立臺灣師範大學環境教育研究所"},{"i":2850403,"t":"水資源","c":"水資源-全球","k":"mc","q":"因為氣候變遷而導致的水資源短缺問題，哪一個選項不會對於兒童的生存，產生最直接的影響？","z":"疼惜物命做環保，因為專心一志而渾然忘我，不僅身體愈做愈健康，心靈垃圾也漸漸去除，故說環保是道場。","o":[["A","疾病的傳播"],["B","糧食供應問題"],["C","缺乏潔淨飲用水"],["D","冰層融化"]],"a":"D","e":"聯合國兒童基金會2019年的報告指出，氣候變遷加遽了疾病的威脅、糧食的不安全以及獲得安全飲水與衛生設施的機會減少，從而對兒童的健康與福祉，構成重大風險。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921929,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"和工業革命之前相比，現在的地球平均氣溫產生了什麼樣的改變？","z":"大地養育萬物，四季自然運轉，萬物應時而生長繁衍，眾生與大地共生息，皆在生命共同體之中；大地若健康，依止大地生活的眾生才會平安。","o":[["A","上升2℃"],["B","上升1℃"],["C","下降0.6℃"],["D","和工業革命前相比沒有改變"]],"a":"B","e":"據估計，人類活動所導致的地球暖化，已高出前工業革命水準約1.0°C，可能的範圍為0.8°C至1.2°C之間。若以目前暖化速度持續增加，可能在2030年到2052年之間，地球暖化便會達到1.5°C（高信心水準）。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921930,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"哪一種發電方式比較不利於降低碳排放量？","z":"尊重自然、順應自然，過自然的生活，才能修補地球的毀傷。","o":[["A","核能發電"],["B","火力發電"],["C","水力發電"],["D","風力發電"]],"a":"B","e":"每年燃燒化石燃料產生的二氧化碳約有213億噸，但自然界只能吸收其中的一半，因此每年在大氣中約增加107億噸的二氧化碳。二氧化碳是溫室氣體的主來源之一，因此也是加快全球變暖的因素之一。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921931,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"以下哪一個氣體不屬於溫室氣體？","z":"天下一片地，眾生共生息；心寬讓一寸，善念息爭端。","o":[["A","水蒸氣(H2O)"],["B","氧化亞氮(N2O)"],["C","氮氣(N2)"],["D","甲烷(CH4)"]],"a":"C","e":"溫室氣體(Greenhouse Gas, GHG)是指易吸收太陽輻射的氣體，將太陽熱能保留在地球中，大幅增加則會形成地球暖化現象。地球大氣中重要的溫室氣體包括：水蒸氣(H2O)、臭氧(O3)、二氧化碳(CO2)、氧化亞氮(N2O)、甲烷(CH4)、氫氟氯碳化物類(CFCs，HFCs，HCFCs)、全氟碳化物(PFCs)及六氟化硫(SF6)等，這些溫室氣體有些是環境中自然生成，有些則是人為活動所產生。而我國「溫室氣體減量及管理法」所管制的溫室氣體共7種，包括上述所提及之二氧化碳(CO2)、氧化亞氮(N2O)、甲烷(CH4)、氫氟碳化物(HFCs)、全氟碳化物(PFCs)、六氟化硫(SF6)及三氟化氮(NF3)。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921933,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"以下哪一個現象不是氣候變遷的影響？","z":"大地如母親，負載眾生，長養萬物，我們應以感恩心，疼惜大地。","o":[["A","動植物棲息地環境變化"],["B","極端天氣出現的頻率與強度增加"],["C","冰原與冰川融化造成海平面上升"],["D","出生率下降，人口負成長"]],"a":"D","e":"(A)大多數動、植物僅在特定的氣候條件下成長，由於全球暖化，某些物種已經被迫遷移到較寒冷的區域，例如北美的動、植物正逐漸往北方或高海拔地區遷徙。(B)極端天氣事件形容歷史中極罕見的天氣現象，尤其是嚴重或反常氣候的類型。如颱風等熱帶性氣旋，可以從溫暖的海水中獲得更多的能量。因此當海水溫度越高，颱風及熱帶氣旋的威力也越大，將挾帶更豐沛的雨量。由於溫度越高所產生的蒸發現象越旺盛，因此氣候變遷所造成的颱風威力也隨之增強。(C)當海水溫度上升，海水的體積將會增加。如果每一滴水都增加一點體積，便會擴張整個海洋的深度，使海平面上升。而極地山區冰川和冰蓋的冰量數量正在減少，冰川融化流入海洋促使了海平面加速上升，同時擴大了海洋變暖的範圍。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921934,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"下列哪一項不屬於個人在生活上的氣候變遷減緩行動？","z":"社會平安，是人民之福；大地平安，是眾生之福。","o":[["A","多吃肉類補充營養"],["B","選擇有節能標章的家電"],["C","利用公共運輸"],["D","吃在地生產的食物"]],"a":"A","e":"(A)透過畜牧來生產食物需要利用太多的土地與水資源、排放太多的溫室氣體，不僅是個沒有效率的食物生產方式，且對環境造成高度傷害。(B)日常生活中使用電器用品，常會消耗能源並排放二氧化碳。若使用具節能標章或環保標章之產品、調高冷氣溫度、隨手關燈、拔插頭減少待機、多利用天然採光及通風等，將有效減少個人碳排放量。(C)交通運輸佔地球溫室氣體排放14％，最有效的減量方式，就是多騎腳踏車、利用大眾運輸系統、搭公車及捷運。(D)吃在地生產的食物，能有效減少運送食物所耗費的能源及運輸產生的溫室氣體，同時也避免過度包裝、冷藏的能源。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921935,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"以下何者不是氣候變遷可能造成的影響？","z":"覺有情之人，所見的花草樹木，無不都是有情，對有知覺的生命會愛護，對無情的物命也會愛惜。","o":[["A","所得提升"],["B","全球暖化"],["C","極端天氣"],["D","提高疾病致死率"]],"a":"A","e":"氣候變遷會對人體健康造成許多方面的影響，高溫事件可能使心臟、血液循環系統和呼吸道相關疾病惡化，提升這些疾病的致死率。此外，水災或暴風雨等極端天氣現象會更頻繁出現。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921936,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"全球暖化造成的海平面上升，可能最快造成以下哪個國家消失？","z":"生活中落實節能減碳，是對天地盡一分心力。","o":[["A","格陵蘭"],["B","冰島"],["C","智利"],["D","馬爾地夫"]],"a":"D","e":"馬爾地夫為海島國家，平均海拔僅1.5公尺，若全球暖化速度未減緩，海平面上升可能淹沒整個國家。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921937,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"大氣中的二氧化碳可以因為什麼作用而變少？","z":"將小愛擴為大愛，愛自己、愛眾人、愛大地；大地安則眾生安，眾生安則自己才能平安。","o":[["A","光合作用"],["B","呼吸作用"],["C","燃燒作用"],["D","反饋作用"]],"a":"A","e":"光合作用可以把大氣中的二氧化碳轉化為葡萄糖，固定為綠色植物的質量，並且釋放出氧氣。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921938,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"上一個冰河時期大概在多久之前結束的？","z":"在平和的社會裡要很珍惜，珍惜一切物資，珍惜人與人之間的感情，珍惜自己擁有良能可以利益眾生；有這分珍惜的心，當下就是人間淨土。","o":[["A","200萬年"],["B","100萬年"],["C","50萬年"],["D","2萬年"]],"a":"D","e":"上一個冰河時期大約在1.8萬年前結束，二個冰河時期之間平均相隔10萬年。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921939,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"下列哪一年是人類有完整氣象記錄以來最熱的一年？","z":"用愛心對待萬物，尊重彼此不同的生態，方能與萬物和平相處，共生共榮。","o":[["A","1988"],["B","2005"],["C","2014"],["D","2020"]],"a":"D","e":"2016與2020年目前並列人類有完整氣象紀錄以來最熱的一年。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921940,"t":"氣候變遷","c":"氣候變遷-台灣","k":"mc","q":"氣候變遷導致的海平面上升對下列哪一個城市影響最大？","z":"地球資源有限，唯有向全民推動樸實勤勞的精神，改變過度消費、玩樂的行為，才能「固本」保護地球資源。","o":[["A","台北"],["B","台中"],["C","台南"],["D","埔里"]],"a":"C","e":"台南是海拔最低的臨海城市，受影響最大。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921941,"t":"氣候變遷","c":"氣候變遷-全球","k":"mc","q":"哪一個國家的人均溫室氣體排放量最高？","z":"水是大地萬物的大生命，無水就無生機，所以要感恩有水，珍惜水、適度用水。","o":[["A","美國"],["B","日本"],["C","中國大陸"],["D","俄羅斯"]],"a":"A","e":"美國的人均溫室氣體排放量是最高的，雖然其總排放量比中國大陸低，但人口數只有中國大陸的四分之一，所以人均高出中國大陸二倍以上。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921942,"t":"氣候變遷","c":"氣候變遷-台灣","k":"mc","q":"我國的氣候變遷政策哪一個中央部會負責的？","z":"愛惜物命，不只是珍惜平時使用的物品，人物及動物等生命體也是「物」，都要用愛疼惜。","o":[["A","科技部"],["B","經濟部"],["C","環境部"],["D","內政部"]],"a":"C","e":"依據我國溫室氣體減量與管理法，環境部為中央主管機關。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921943,"t":"氣候變遷","c":"氣候變遷-台灣","k":"mc","q":"我國大約多少百分比的民眾認為氣候變遷真實存在？","z":"不輕視一粒米，不浪費一滴水，則能富有餘。","o":[["A","30%"],["B","50%"],["C","80%"],["D","95%"]],"a":"D","e":"近十年以來各機構的民調大致上顯示我國民眾約90-95%認為氣候變遷真實存在。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921945,"t":"災害防救","c":"災害防救-全球","k":"mc","q":"為了在地震發生時，讓家中財產損失降到最低，平日我們應預作什麼準備？","z":"為自己找藉口，就不會進步。","o":[["A","看網路討論區取得資訊"],["B","事先將家中的家具重物固定妥當"],["C","每天看星座運勢確定沒有問題"],["D","時時注意天花板確認燈具、鋼架不會掉落"]],"a":"B","e":"在地震災害來臨前做好準備，能在受災時立即派上用場且發揮保護生命財產的效益。準備動作包括：固定家具重物、適當準備居家防災用品及緊急避難包、預擬逃生計畫、防災避難疏散地圖、進行防災演練。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921947,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"當淹水警戒二級警戒發布時，表示如果持續降雨，易淹水村里或道路可能在幾小時內開始積淹水？","z":"事不做，才困難；路不走，才遙遠。","o":[["A","已經淹水了"],["B","三"],["C","八"],["D","二十四"]],"a":"B","e":"臺灣在經歷2009年莫拉克風災後，面對天然災害發生頻繁，持續加強防災科技研發與防災資訊服務，協助防救災人員及民眾確實做好離災、減災的工作。當淹水警戒發布二級警戒時，表示發布淹水警戒之鄉(鎮、市、區)如持續降雨，其易淹水村里或道路可能三小時內開始積淹水；發布一級警戒時，表示易淹水村里或道路可能已開始積淹水。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921948,"t":"災害防救","c":"災害防救-全球","k":"mc","q":"下列何者「不是」造成土石流可能發生的徵兆？","z":"有心要付出，就有無限的能力。","o":[["A","溪水異常混濁"],["B","溪水流量急劇減少"],["C","環境十分安靜"],["D","感覺地表震動"]],"a":"C","e":"當土石流三個主要發生原因一成立（雨量多、土石多及坡度大等「三多」），土石流便可能發生。可藉由徵兆得知可能會發生土石流，如：溪水異常混濁（上游可能發生山崩）、溪水流量急劇減少（上游可能已被崩塌土阻塞）、感覺地表震動（土石流滾動時造成震動）。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921949,"t":"災害防救","c":"災害防救-台灣","k":"mc","q":"為了有效防疫，應該從何處獲得新冠肺炎資訊？","z":"人要知福、惜福、再造福。","o":[["A","注意衛福部公告最新疫情訊息"],["B","跟媽媽去菜市場聊天聽大家的意見"],["C","去網路上查朋友怎麼說"],["D","我身體很好，新冠肺炎跟我沒關係。"]],"a":"A","e":"面對生物病原災害，應進行減災整備，包括：養成良好的衛生習慣，肥皂勤洗手、 出入人潮多的地方戴上口罩、保持社交距離、維持室內通風、經常消毒環境、隨時留意個人身體健康狀況、留意衛福部公告最新疫情訊息，並配合政府各項防疫措施。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921950,"t":"災害防救","c":"災害防救-全球","k":"mc","q":"接收到土石流警戒時，下列何種作為無法確保人身安全？","z":"能付出的人生，最快樂也最踏實。","o":[["A","向溪流兩側高地疏散"],["B","依預先規劃好的防災地圖疏散至緊急避難處所"],["C","穿越陡坡區以快速離開"],["D","盡量利用現有道路撤離"]],"a":"C","e":"當民眾接收到土石流警戒時， 建議依照預先規劃好的土石流防災地圖疏散至當地緊急避難處所，撤離過程中應盡量利用現有道路， 同時向溪流兩側高地疏散，切勿穿越土石流潛勢溪流、危險路段或陡坡區， 以確保人身安全。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921951,"t":"災害防救","c":"災害防救-全球","k":"mc","q":"若持續下雨，易淹水的地方或道路可能已開始積淹水，應於最短時間內離開，前往避難處所，下列哪個作為是正確的？","z":"齋是素食，戒是規矩；珍惜自我生命，更要尊重萬物生靈。","o":[["A","進入已淹水地下室開車離開"],["B","疏散時依車輛輪胎的高 。稀有且頻臨絕種的動植物資源並不符合以上條件。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921965,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列哪個原材料屬於循環經濟中定義可「工業循環」的材料？","z":"克己，則能減少碳足跡。","o":[["A","核廢料"],["B","廢鋼鐵"],["C","衛生紙"],["D","COVID-19疫苗"]],"a":"B","e":"工業循環（Technical Cycle）的材料來自「不可快速再生的材料」，產品不使用後須回到工業循環，由回收廠循環再生，讓材料達到同等級或升級應用，並且可用於再製成新的產品。C2C工業循環的材料例如：金屬、塑膠、玻璃等。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921966,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"請問以下誰對推動循環經濟有責任?","z":"不只愛人，還要愛地球；土地平安，人才能平安。","o":[["A","政府"],["B","企業"],["C","消費者"],["D","以上皆是"]],"a":"D","e":"政府應推動循環經濟相關政策，鼓勵企業生產時使用循環再生資源及進行循環經濟相關設計；消費者購物時應考量物品是否可共享、維修或延長使用壽命，若有需要購買新的物品，優先考慮可高度循環使用之產品而非流行性或一次性產品。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921967,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列哪個不屬於循環經濟的基礎原則?","z":"人人心中湧現淨水，才能拯救發燒的地球。","o":[["A","設計之初即避免廢棄及汙染"],["B","延長產品和材料的使用週期"],["C","所有材料皆必須取得環保標章"],["D","促進自然系統再生"]],"a":"C","e":"循環經濟三大原則為：設計之初即避免廢棄及汙染、延長產品和材料的使用週期、促進自然系統再生。鼓勵材料取得環保標章但非必要條件。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921968,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"「產品共享」為循環經濟中目前新興的商業模式，請問下列哪項不屬於此模式?","z":"疼惜大地，要從人人的足下起步。","o":[["A","租借共享運具(如：Ubike、GoShare、iRent、WeMo等…)"],["B","自備個人使用之環保杯購買飲料"],["C","去健身房運動取代自己購買健身設備"],["D","去圖書館借書取代自己買書"]],"a":"B","e":"產品共享概念為產品所有權屬於供應商，產品在其壽命期間之內，被不同終端使用者 使用多次。個人擁有的環保杯仍是個人擁有所有權，無法與他人共用，因此不算共享經濟。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921969,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下面哪一項是企業生產商品時可考慮符合循環經濟作法?","z":"做環保，除了淨山、淨海、淨大地之外，也要淨心田。","o":[["A","延長產品維修年限"],["B","把賣產品改成賣服務"],["C","研究自家廢棄物作為另一家公司生產原料的可行性"],["D","以上皆是"]],"a":"D","e":"ABC皆為循環經濟中不同的商業模式。延長產品維修年限，屬於「修復及翻新」模式；把賣產品改成賣服務，屬於「產品服務化」模式；研究自家廢棄物作為另一家公司生產原料的可行性，屬於「副產品及產業共生」模式。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921971,"t":"循環經濟","c":"循環經濟-全球","k":"mc","q":"下列哪一個SDG與循環經濟之間的關係最密切？","z":"素食可讓身心健康，又能保護地球。","o":[["A","SDG 1"],["B","SDG 5"],["C","SDG 12"],["D","SDG 16"]],"a":"C","e":"SDG 12是「負責任的消費與生產」，和循環經濟之間的關係最密切。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921972,"t":"節能減碳","c":"節能減碳-台灣","k":"mc","q":"臺灣目前最主要的發電方式為何？","z":"心理環保，不貪婪無度；生理環保，素食護生少污染。","o":[["A","再生能源發電"],["B","核能發電"],["C","火力發電"],["D","用愛發電"]],"a":"C","e":"109年台電系統發電量為2,389.3億度，其中火力發電量占比達80.2%，包括燃煤36.4%、燃油1.3%、燃氣40.8%、汽電共生1.7%(不含垃圾及沼氣)等，再生能源占比為5.8%(含水力及汽電共生中之垃圾及沼氣)，抽蓄水力1.3%，核能為12.7%。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921973,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"為何垃圾資源回收可以達到節能減碳的目的？","z":"愛惜物命，不只是珍惜平時使用的物品，人物及動物等生命體也是「物」，都要用愛疼惜。","o":[["A","可以兌換回收金"],["B","資源再利用可以減少能源消耗"],["C","可以將寶特瓶做成風車"],["D","垃圾桶會比較乾淨"]],"a":"B","e":"資源回收再利用可以減少能源消耗。原本要廢棄的材料，可被分解再製成新產品，或者被收集，在清潔和處理之後再利用，達到減少垃圾的製造和原料的消耗。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921974,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列哪一項行動「無法」達到減碳的目的？","z":"不輕視一粒米，不浪費一滴水，則能富有餘。","o":[["A","將現有的電器換成節能標章商品"],["B","考量大眾經濟壓力調低電價"],["C","若需要移動，多搭乘大眾運輸工具"],["D","選擇當地當季的蔬菜食物"]],"a":"B","e":"人人可做的環保行動：(1)選購有節能或環保標章商品、(2)使用大眾運輸工具，近距離可騎腳踏車或步行、(3)吃當地當季，減少食物里程的碳排放。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921975,"t":"節能減碳","c":"節能減碳-台灣","k":"mc","q":"自溫室效應被發現且由科學家提出警訊至今，聯合國及各國政府與非政府組織即著手研擬各種不同類型之減緩策略，以下哪些「不是」臺灣的減緩策略？","z":"浪費資源，是造惡業；勤儉布施，是造福德。","o":[["A","節約能源、提高能源效率"],["B","發展火力發電技術"],["C","開發新興與再生能源"],["D","發展溫室氣體減量"]],"a":"B","e":"自溫室效應被發現且由科學家提出警訊至今，聯合國及各國政府與非政府組織即著手研擬各種不同類型之減緩策略，包括：節約能源、提高能源效率、開發新興與再生能源、發展溫室氣體減量技術。然而全球暖化和氣候變遷的趨勢，已非靠人類減少溫室氣體排放所能避免。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921976,"t":"節能減碳","c":"節能減碳-台灣","k":"mc","q":"「臺灣碳標籤」係由下列哪一種圖案搭配「CO2」化學符號及數字所組成？","z":"生活若樸實，素食菜根香，五穀皆佳餚，身心常安康。","o":[["A","由紅色心形及綠葉組成腳印"],["B","由紅色心形及紅花組成腳印"],["C","由綠色心形及綠葉組成腳印"],["D","由綠色心形及紅葉組成腳印"]],"a":"C","e":"「臺灣碳標籤」由綠色心形和綠葉組成腳印，並搭配「CO2」化學符號及愛心中的數字揭露產品「碳足跡」，整體圖示意涵用愛大自然的心，減碳愛地球及落實綠色消費，以邁向低碳社會。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921977,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列哪項作為「不能」減緩溫室效應？","z":"愛惜物命、節省消費，也是為子孫多積一分福。","o":[["A","大量燒煤，以解决能源問題"],["B","提倡使用節能技術和節能產品"],["C","植樹造林，嚴禁亂砍濫伐森林"],["D","提倡公共交通或步行方式出行"]],"a":"A","e":"大量燒煤只會增加CO2的排放，並促使溫室效應日趨嚴重，並不能減輕溫室效應。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921978,"t":"節能減碳","c":"節能減碳-台灣","k":"mc","q":"下列何者為臺電實施「夏月電價」的時期？","z":"做環保，除了淨山、淨海、淨大地之外，也要淨心田。","o":[["A","1~3月"],["B","4~6月"],["C","6~9月"],["D","10~12月"]],"a":"C","e":"夏月電價(每年6月~9月)較非夏月(每年1~5月及10~12月)電價為高，係為公平合理反映夏月及非夏月間的季節性供電成本差異。所謂的「夏月電價調整」原則，就是調降供電成本較低的「非夏月」(10月-5月)電價，再調升供電成本較高的「夏月」(6月-9月)電價，以維持全年電費收入不變，並藉此激勵全民共同落實節能減碳。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921979,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列何種方式可避免生活環境中熱島效應的產生？","z":"生活多一點簡單，心靈多一分歡喜。","o":[["A","選用可回收產品"],["B","增加綠樹及綠地面積"],["C","盡量待在有冷氣的室內空間"],["D","建築物蓋的越高越好"]],"a":"B","e":"減少熱島效應的方法有：植樹、採用高反射能素材、確保風的流通性、減低建築物(如冷氣)的人工排熱、分散市區人口至郊區以減低人工排熱、合理地規劃城市、選用節能減碳產品等等。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921980,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"對於日常節能行為的敘述，下列何者是「錯誤」的？","z":"環保應從心啓動，進而雙手推動、雙腳行動，形成愛的循環。","o":[["A","多吹自然風，關閉空調冷氣"],["B","使用通過節能標章產品"],["C","無人使用的空間應該關閉燈光"],["D","避免使用太陽能板產生電力，以免浪費資源"]],"a":"D","e":"使用太陽能板可產生電力資源。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921981,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"電動車因具低污染之優點，而成為各國推廣的綠色低碳運具，下列關於電動車之描述，何者為「非」？","z":"做環保不僅能呵護地球，也可以回收自己，再造清淨的人品。","o":[["A","行駛成本較低"],["B","噪音較低"],["C","不會消耗能源"],["D","具減碳效益"]],"a":"C","e":"電動車行駛使用電力驅動馬達運轉，非傳統燃油汽車以燃燒汽油使內燃機運作，行駛成本相對較低，減碳效益較好，空氣污染及噪音也較傳統車輛低，但還是需要消耗能源(電力)來運轉。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921982,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"下列哪一項不是對地球環境有幫助的行為?","z":"彎腰「做」環保——身體力行；挺腰「說」環保——推廣帶動。","o":[["A","自備環保碗筷"],["B","買東西用店家提供的塑膠袋裝"],["C","出門自備環保袋"],["D","買飲料自備環保杯"]],"a":"B","e":"使用可重複性的餐具、碗盤及杯子避免過度使用一次性的素料產品。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921983,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"能源的種類大致可分為再生能源與非再生能源，請問天然氣、石油、太陽能、核燃料、地熱、生質能、水力、風力；以上有幾種為再生能源？","z":"環保就是惜物愛人，不只要用心回收有形的資源，更要珍惜時間、空間、人與人之間，把握當下付出愛。","o":[["A","7種"],["B","6種"],["C","5種"],["D","4種"]],"a":"C","e":"再生能源：可以隨著大自然的運轉而永不枯竭的能源，例如：風力能、水力能、太陽能、地熱能、生質能、海洋能等。非再生能源：必須消耗掉的能源，所以蘊藏量有限，與再生能源相對穩定度高、成本較低，但是使用時卻會造成環境污染，例如：石油、天然氣、煤炭、核燃料等。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921984,"t":"節能減碳","c":"節能減碳-台灣","k":"mc","q":"某間大型工廠，在生產時需使用大量的能源，因此此工廠增設小型發電機組並將生產過程中產生的廢熱回收，並利用蒸氣來再次發電，來彌補電力公司在尖峰用電時供電不足的部分，此種發電方式稱為：","z":"回收資源是惜福，再製造利用是造福。","o":[["A","火力發電"],["B","汽電共生"],["C","蒸氣發電"],["D","永續發電"]],"a":"B","e":"汽電共生是一種工業製程中的能源再利用技術，主要概念就是廢熱的回收再利用，以達到熱電共同使用的最佳效益。「後發電式汽電共生系統」是在生產過程有高溫製程的工廠中，將廢熱回收後以蒸汽帶動發電機的方式轉化成電能，這些電能既可再度投入製程中使用，亦可賣回給台電公司併入電網使用；另外目前亦有「先發電式汽電共生系統」，則是反過來先進行發電，再將發電過程中發電機的餘熱用於生產製程。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921985,"t":"節能減碳","c":"節能減碳-全球","k":"mc","q":"一般我們常聽到的「沼氣」其實就是甲烷，請問是屬於哪種能源？","z":"疼惜物命做環保，因為專心一志而渾然忘我，不僅身體愈做愈健康，心靈垃圾也漸漸去除，故說環保是道場。","o":[["A","海洋能源"],["B","化石能源"],["C","生質能源"],["D","地熱能源"]],"a":"C","e":"沼氣，即是各種有機物質在隔絕空氣(即無氧氣 的還原條件)，並且在適宜的溫度、濕度下，經 過微生物的發酵作用，所產生的一種可以燃燒氣體。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921986,"t":"空氣污染","c":"空氣污染-台灣","k":"mc","q":"什麼顏色的學校空氣品質旗代表空氣品質良好?","z":"人體需要休息，山體也需要養息——減少開發、做好水土保持。","o":[["A","黃"],["B","綠"],["C","橘"],["D","紫"]],"a":"B","e":"行政院環境保護署於105年整空氣污染指標（PSI）及細懸浮微粒（PM2.5）雙指標，參考美國改採單一指標「空氣品質指標（AQI）」，分為綠、黃、橘、紅、紫、褐紅６色。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921987,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"哪一個不是造成空氣變髒的原因?","z":"過度消費，是傷害大自然的生機。","o":[["A","汽機車"],["B","工廠"],["C","工地"],["D","森林"]],"a":"D","e":"空氣污染來源有固定及移動污染源。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921988,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"空氣污染造成的酸雨pH值是","z":"天地都在變遷中，天氣在變，地質也在變，一切都是因為人心在變；所以要調好自己的心，回歸清淨自然的本性，世間才能平安。","o":[["A","pH值=7"],["B","pH值>7"],["C","pH值<5"],["D","與pH值無關"]],"a":"C","e":"科學家定義受到人為酸性污染物影響的雨水，其 pH 值小於 5.0。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921989,"t":"空氣污染","c":"空氣污染-台灣","k":"mc","q":"學校的空氣品質旗出現什麼顏色代表對空氣敏感的人要注意?","z":"天氣不調則地球氣候亂序，脾氣不調則人倫道德失序；以素食培養慈悲心，人人心地純樸善良，對身體健康、對世界環境都有益處。","o":[["A","黃"],["B","橘"],["C","紫"],["D","紅"]],"a":"A","e":"綠、黃、橘、紅、紫、褐紅６色，黃色代表普通但敏感族群要注意。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921990,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"空氣中最多的是什麼氣體?","z":"大地養育萬物，四季自然運轉，萬物應時而生長繁衍，眾生與大地共生息，皆在生命共同體之中；大地若健康，依止大地生活的眾生才會平安。","o":[["A","氧氣"],["B","二氧化碳"],["C","笑氣"],["D","氮氣"]],"a":"D","e":"主要由78%的氮氣、21%氧氣、還有1%的稀有氣體和雜質組成的混合物。 空氣的成分不是固定的，隨著高度的改變、氣壓的改變，空氣的組成比例也會改變。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921991,"t":"空氣污染","c":"空氣污染-全球","k":"mc","q":"做什麼事會讓空氣變髒?","z":"尊重自然、順應自然，過自然的生活，才能修補地球的毀傷。","o":[["A","節約用電"],["B","多種樹"],["C","搭公車或捷運"],["D","任意焚燒垃圾"]],"a":"D","e":"人為露天焚燒包括焚燒稻草、枯枝樹葉或事業廢棄物，不僅產生惱人的濃煙與臭氣，火勢還可能失控、隨風延燒。","s":"國立臺灣師範大學環境教育研究所"},{"i":2921992,"t":"空氣污染","c":"空氣污染-台灣","k":"mc","q":"臺灣在哪一個季節的空氣品質最不好?"," 所以大自然的雨水原本就是酸的。","z":"「齋」是潔淨身心，保護眾生生命；「戒」是防非止惡，保護自己不造惡業。能齋戒就是心靈與大地的環保。","o":[["O","對"],["X","錯"]],"a":"O","e":"在化學上定義水之酸鹼值等於7是中性的，PH5~7為弱酸性 小於5則是酸性。自然大氣中含有大量的二氧化碳，二氧化碳在常溫時溶解於雨水中並達到氣液相平衡後，雨水的酸鹼值約為5.5，所以大自然的雨水是弱酸的。","s":"國立臺灣師範大學環境教育研究所"},{"i":2922057,"t":"空氣污染","c":"空氣污染-全球","k":"tf","q":"森林火災會造成嚴重的空氣汙染及霾害，對環境及生態造成嚴重的傷害，因此，絕對不能讓森林火災發生","z":"素食三得——培養愛心、有益健康、保護地球。","o":[["O","對"],["X","錯"]],"a":"X","e":"森林火災的起因有兩種：人為火及自然火，自然火包括雷電或自燃等，由其引起的森林火災僅占森林火災總數的1%，自然的情況下，火災是森林規律更新的一部分，燃燒死亡、腐敗的動植物，將養分回歸土壤中，可以使樹木長得更高更壯，也更有空間孕育生命。所以我們應該絕對避免的是人為造成的森林火災。","s":"國立臺灣師範大學環境教育研究所"},{"i":2922058,"t":"資源回收","c":"資源回收-台灣","k":"tf","q":"垃圾排出前，應進行一般垃圾、資源垃圾、廚餘等三大類分類。","z":"素食可培養耐力、慈悲與智慧。","o":[["O","對"],["X","錯"]],"a":"O","e":"垃圾總共分為一般垃圾、資源垃圾、以及廚餘三大類。","s":"國立臺灣師範大學環境教育研究所"},{"i":2922059,"t":"資源回收","c":"資源回收-全球","k":"tf","q":"紙跟紙容器都屬於紙類，回收處理流程相同。","z":"充滿愛心的人最幸福。","o":[["O","對"],["X","錯"]],"a":"X","e":"紙容器含有一層不透水塑膠薄膜，處理程序不同。","s":"國立臺灣師範大學環境教育研究所"},{"i":2922060,"t":"資源回收","c":"資源回收-台灣","k":"tf","q":"玻璃瓶分為透明、棕色、綠色三種，以透明的回收價值最高。","z":"不要小看自己，因為人有無限的可能。","o":[["O","對"],["X","錯"]],"a":"O","e":"玻璃瓶分三色，並以未染色的透明玻璃，回收價值最好。","s":"國立臺灣師範大學環境教育研究所"},{"i":2922061,"t":"資源回收","c":"資源回收-台灣","k":"tf","q":"源頭減量政策包含減少一次性、有害物質、塑膠產品。","z":"真正的歡喜，不在於擁有多少，而是有愛。","o":[["O","對"],["X","錯"]],"a":"O","e":"源頭減量包含一次用產品、生鮮包裝、飲料杯、紙杯、免洗餐具、塑膠袋、含汞產品等減量。","s":"國立臺灣師範大學環境教育研究所"},{"i":2922062,"t":"資源回收","c":"資源回收-全球","k":"tf","q":"紙尿布是用紙做成的，所以可以進行資源回收。","z":"任何事都是從一個決心、一粒種子開始。","o":[["O","對"],["X","錯"]],"a":"X","e":"傳統紙尿布：30%是由塑膠組成，源自非再生石油資源，需要花上500年的時間來完成分解。而尿布看似潔白純淨的內裡襯布與吸收層等，都經過漂白處理，使用包含氯、漂白水等成分。這些過程不論是塑膠的處理，又或者是漂白過程產生的廢水，都對地球環境造成嚴重的傷害。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180511,"t":"資源回收","c":"資源回收-台灣","k":"mc","q":"臺灣目前處理垃圾的主要方式?","z":"擁有正確的人生觀，才能擁有幸福的人生。","o":[["A","掩埋"],["B","焚化"],["C","填海"],["D","花錢讓其他國家處理"]],"a":"B","e":"行政院於73年核定「都市垃圾處理方案」，初期以掩埋為主，中長程以焚化為主，由中央補助經費，積極推動地方興建垃圾掩埋場或焚化廠，期解決垃圾處理問題。由於垃圾掩埋場用地取得日趨困難，本署於80年訂定「垃圾處理方案」，明定「焚化為主、掩埋為輔」為垃圾處理的主軸。為使垃圾焚化廠的順利興建，於80年6月訂定「臺灣地區垃圾資源回收(焚化)廠興建計畫」，由本署在臺灣省興建大型焚化廠。目前我國垃圾處理方式以焚化為主，兼顧妥善處理及能源回收，全國興建完成26座可回收電能的大型焚化廠，除了雲林廠及臺東廠之外，其餘24座均已投入運轉，營運中焚化廠設計處理量為24,650 公噸/日。請參考：https://www.epa.gov.tw/Page/16FAB5046B4F80FC","s":"國立臺灣師範大學環境教育研究所"},{"i":3180512,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"電子垃圾為全球增長速度最快的家庭垃圾，下列何者是電子垃圾？","z":"樂於付出，心靈富足。","o":[["A","遙控器"],["B","電動牙刷"],["C","吸塵器"],["D","以上皆是"]],"a":"D","e":"舉凡帶有電池或電源插頭的各類電子產品，小至遙控器、電動牙刷、平板、手機，大至冰箱、冷氣、洗衣機，甚至近幾年很熱門的智能家居如掃地機器人都是電子垃圾。聯合國「2020年全球電子廢棄物監測報告」指出：2019 年產出最多電子垃圾的是 2,490 萬噸的亞洲，其次是 1,310 萬噸的美洲以及 1,200 萬噸的歐洲，而從人均產生電子垃圾來說，第一名是歐洲的 16.2 公斤，再來是大洋洲的 16.1 公斤以及美洲的 13.3 公斤。聯合國分析，如此大量的電子產品淪為垃圾的主要原因有三：電子產品的用量越來越大、生命週期越來越短以及維修不易（價格昂貴、送修程序繁冗等等）。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180513,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"為何垃圾資源回收可以達到節能減碳的目的?","z":"一心做好事，自然就有福。","o":[["A","資源再利用可以減少能源消耗"],["B","可以兌換回收金"],["C","垃圾量會變少"],["D","可以將廣告紙折成紙盒裝垃圾"]],"a":"A","e":"依據估計，溫室氣體排放有50%來自於物料管理，排放溫室氣體的源頭在於地球資源使用上的過度消耗，若能將這些資源回收再利用，就能減少許多浪費。請參考：https://www.taiwannews.com.tw/ch/news/3053883","s":"國立臺灣師範大學環境教育研究所"},{"i":3180514,"t":"資源回收","c":"資源回收-台灣","k":"mc","q":"下列何者是「垃圾強制分類」的目標?","z":"做對人生有意義的事，才是生命真正的價值。","o":[["A","降低國內垃圾產生量"],["B","降低政府處理廢棄物成本"],["C","提高資源回收率"],["D","以上皆是"]],"a":"D","e":"為加強促進資源循環再生，環保署從民國94年起推動垃圾強制分類計畫， 將垃圾區分為「資源」、「廚餘」與「一般垃圾」等三類，以利後端回收處理。希望透過民眾的配合，提昇資源與廚餘回收率，朝著「零廢棄」的垃圾減量目標邁進。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180515,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"下列何者可以進行廢塑膠資源回收?","z":"真正的歡喜，不在於擁有多少，而是有愛。","o":[["A","寶特瓶"],["B","百葉窗"],["C","保鮮膜"],["D","錄音帶"]],"a":"A","e":"塑膠雖然可以回收，但因材質與經濟效益低，使得有些物品未必真的能回收再製。玻璃纖維FRP物品、汽機車坐墊、塑膠膜、化學纖維物品、塑膠繩、尼龍繩、塑膠布、樹脂、安全座椅、PU巧拼地墊、護貝膠膜、腳踏墊、保鮮膜、墊子、塑膠製印台、泡棉、旅行袋、膠帶、錄音帶、原子筆、百葉窗、吸管、飼料袋、唱片、刷子、底片、板擦、塑膠玩具、塑膠鉛筆盒等是不能回收的。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180516,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"此國際通用資源回收編碼是指什麼？","z":"少欲知足，是最富有的人生。","o":[["A","聚氯乙烯"],["B","聚丙烯"],["C","所有其他的塑膠"],["D","高密度聚乙烯"]],"a":"C","e":"日常生活經手的塑膠瓶罐、塑膠包裝，上面都有標上塑膠回收標誌，標誌圖案是由三個箭頭循環組成的三角形，而三角形內標有塑膠分類回收號碼1至7號，這7個號碼代表不同的塑膠材質，它們的特徵、用途和耐熱程度也有所不同。國際通用資源回收編碼（International Universal Recycling Codes）是利用標誌與編碼標示著物品的製造材料，這樣的編碼可以使資源回收的分類更加容易。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180517,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"下列何者不是非塑膠容器回收後可再製成的產品？","z":"人生富足之道，不在於物質，而在於自心。","o":[["A","假髮"],["B","環保運動衣"],["C","垃圾桶"],["D","以上皆可"]],"a":"D","e":"塑膠屬於石化製品，原本並不存在於自然界中，因此也無法自然分解，回歸大自然循環使用。若沒有經過良好的處理，就會成為所謂的「萬年垃圾」。生活中經常使用的飲料杯瓶，多半都屬於塑膠材質，這些材質包括PET、PP、PE、PVC、PS等，經過分類回收後，除了可製成大家熟知的花盆及環保運動衣外，還有許多我們日常生活經常使用到的塑膠製品，都可以用回收的塑膠容器再生製造。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180518,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"光碟片可回收再製為什麼物品？","z":"安心睡、快樂吃、歡喜笑、健康做，是人生四寶。","o":[["A","光碟"],["B","手機"],["C","筆電"],["D","以上皆是"]],"a":"D","e":"光碟片的主要材質為聚碳酸酯 (Polycarbonate，PC) 的高級塑料，其上鍍有金、銀等貴重金屬反射層。回收後之貴重金屬，可進一步予以純化再利用。剩餘的ＰＣ材料可以再賣給生產光碟片的製造商，用以壓製成新的光碟。亦可與ABS、PBT、PET或玻璃纖維依不同的比率混成各種不同用途的塑膠合金，或是高級的工業用塑膠，可以再製成手機、筆記型電腦、電器、照相機……等之外殼廢光碟片處理後衍生之資源化產品。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180519,"t":"資源回收","c":"資源回收-台灣","k":"mc","q":"下列何者「不是」資源回收前要做的處理?","z":"今天只要有一次，應好好把握做該做的事。","o":[["A","將盒子、瓶子、或罐子壓扁"],["B","將不要的大型傢俱與家電用品放在路邊"],["C","將瓶罐洗淨"],["D","將破碎的玻璃包好"]],"a":"B","e":"飲料容器應先行倒空容器內之殘餘物，鋁箔包要將吸管取出，用水略為沖洗，壓扁後回收。一般家庭及住戶所產生之體積龐大廢棄家具(彈簧床墊、床組、手推車、腳踏車、電風扇、沙發、桌椅、櫥櫃、廢行李箱3只(含)以上)、家電用品(抽油煙機、瓦斯爐、大型飲水機、電視機、電冰箱、洗衣機、冷氣機)、樹枝及個人自行修繕之非石材類廢棄物丟棄前須先與清潔隊員聯繫並預約丟棄","s":"國立臺灣師範大學環境教育研究所"},{"i":3180520,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"北歐國家產生的垃圾運到英國去焚燒，還可以發電。英國的設備為何？","z":"有愛的人生才幸福。","o":[["A","傳統垃圾焚化爐"],["B","火力發電廠"],["C","生質能發電廠"],["D","資源分類處理廠"]],"a":"C","e":"垃圾基本上是有機物質，燃燒後產生熱，可以發電，稱之為生質能發電","s":"國立臺灣師範大學環境教育研究所"},{"i":3180521,"t":"資源回收","c":"資源回收-全球","k":"mc","q":"四年一次的世界盃足球賽球員身上穿的排汗衫，原料並非天然棉，來自於哪一種資源回收物？","z":"人生的價值，在於能為人間負責任。","o":[["A","咖啡渣"],["B","寶特瓶"],["C","紙杯"],["D","鐵鋁罐"]],"a":"B","e":"寶特瓶作為原料後，加工成為人造纖維，製作各類衣物","s":"國立臺灣師範大學環境教育研究所"},{"i":3180522,"t":"資源回收","c":"資源回收-台灣","k":"mc","q":"在台灣，下列哪一種物質可以回收？","z":"人生的責任，是要做利益人群的事。","o":[["A","生質塑膠杯"],["B","稻渣環保筷"],["C","塑膠杯蓋"],["D","金屬與人造纖維混紡衣服"]],"a":"C","e":"生質塑膠在臺灣仍無法回收再利用，其餘物質需為單一材質才能回收，僅有塑膠杯蓋是。稻渣環保筷是稻渣混合塑膠製成的產品，是複合材料。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180523,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"聯合國報告顯示，每年的全球食物浪費會增加多少百分比的排碳量？","z":"甘願做，歡喜受。","o":[["A","5%"],["B","10%"],["C","20%"],["D","40%"]],"a":"B","e":"https://csr.cw.com.tw/article/41885","s":"國立臺灣師範大學環境教育研究所"},{"i":3180524,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"如果全球食物浪費的資源量屬於一個國家，其碳排放居於全球第幾位？","z":"素食可培養耐力、慈悲與智慧。","o":[["A","1"],["B","3"],["C","10"],["D","20"]],"a":"B","e":"因食物浪費而產生的碳排放佔全球10%，僅有中國大陸與美國的排放量超過這個比例。因此，是第三名。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180525,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"食物浪費有很多效應，但不包括以下何者？","z":"口說好話，心想好意，身行好事。","o":[["A","食物耗損"],["B","資源損耗"],["C","能源消耗"],["D","促進經濟"]],"a":"D","e":"UNEP專家歐圖（Martina Otto）則表示：「食物浪費會產生三倍的損失，不僅是食物減損，也是耗損生產食物所使用自然資源和經濟資源。反之則能創造三贏。」","s":"國立臺灣師範大學環境教育研究所"},{"i":3180526,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"以下哪一種食物的單位重量代表的碳排放最高？","z":"福從做中得歡喜，慧從善解得自在。","o":[["A","水稻"],["B","羊肉"],["C","豬肉"],["D","馬鈴薯"]],"a":"B","e":"肉類的單位重量碳排放大於蔬菜，而羊肉的排放量遠大於豬肉，因為羊是反芻動物","s":"國立臺灣師範大學環境教育研究所"},{"i":3180527,"t":"食物環保","c":"食物環保-台灣","k":"mc","q":"在台灣，如何處理家戶廚餘是最適當的方案？","z":"多做多得，少做多失。","o":[["A","購買廚餘處理機處理"],["B","在家裡或陽台製作廚餘堆肥"],["C","讓清潔隊收取"],["D","碾碎後倒入馬桶沖掉"]],"a":"C","e":"臺灣的氣候不適合在家裡製作廚餘堆肥，會產生病媒與惡臭，形成二次污染；使用廚餘處理器另外消耗能源，並不環保。讓清潔隊收去，集中處理，是最佳策略。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180528,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"哪一種聚餐的型式最環保？","z":"懂得惜福，就會造福；真正造福的人，才是真富有。","o":[["A","去大飯店吃自助餐"],["B","叫外燴到辦公室或學校來"],["C","提供每個人同樣的高價便當"],["D","點菜吃，剩下的大家包回家"]],"a":"D","e":"大飯店的自助餐是造成食物浪費的大宗，外燴也類似。提供每個人一樣的大份量便當可能因口味與食量不同，造成大量廚餘。點菜吃並且將剩菜包回家最環保。","s":"國立臺灣師範大學環境教育研究所"},{"i":3180529,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"下列何者不是減少食物浪費的作法？","z":"說做、想做，不如動手做。","o":[["A","擬定精確的採買計畫"],["B","不設定採買食物的預算"],["C","妥善運用冰箱"],["D","管理保存期限"]],"a":"B","e":"訂定採買的金額上限，可以避免買太多東西","s":"國立臺灣師範大學環境教育研究所"},{"i":3180530,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"下列哪一種食物的單位重量的碳足跡最低？","z":"小事不做，大事難成。","o":[["A","西瓜"],["B","豌豆"],["C","稻米"],["D","橄欖"]],"a":"B","e":"豆類通常是碳排放最低的食物，蛋白質的量也高","s":"國立臺灣師範大學環境教育研究所"},{"i":3180531,"t":"食物環保","c":"食物環保-全球","k":"mc","q":"下列哪一種材質不適合製作食物袋？","z":"感恩要表於行動。","o":[["A","矽樹脂 Silicone"],["B","熱塑性橡膠TPU"],["C","聚乙烯—醋酸乙烯酯 PEVA"],["D","聚氯
