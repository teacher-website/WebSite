      <li>點一下<b>燈泡（洋蔥皮）</b>，就能淡淡看到前一格，照著畫出一點點不同的動作。長按燈泡可以改成顯示原本顏色、設定看幾格。</li>
      <li>重複幾次後按 ▶ 播放，看看動起來的樣子。</li><li>按「⋯」匯出 GIF 或影片分享作品。</li></ul>
      <h4>小技巧</h4>
      <ul><li><b>背景圖層</b>是所有影格共用的，畫一次天空或房間，每一格都看得到。</li>
      <li>用<b>選取</b>圈住角色→複製→換下一格→貼上，再拖到新位置，就能讓角色移動。</li>
      <li>每秒影格數（FPS）在下方數字那裡設定：8～12 適合手繪動畫。</li>
      <li>作品會自動存在這台裝置；要換電腦請用「⋯ → 儲存專案檔」。</li>
      <li>「匯出全部影格（ZIP）」勾選透明背景，就能把每一格拖進 Scratch 當造型。</li></ul>` }),
    ui: () => {
      const d = h('div', { class: 'help' });
      d.append(h('p', {}, '在畫面上標出每個按鈕的用途（和圖片教學一樣）。'));
      d.append(h('button', { class: 'btn primary', onclick: () => { closeTopDialog(); setTimeout(showGuide, 60); } }, iconEl('help'), '顯示介面導覽'));
      d.append(h('h4', {}, '畫面配置'));
      d.append(h('ul', { html: '<li><b>上方</b>：回到作品列表、說明；右邊是選取、文字、筆刷、橡皮擦、填色、顏色，最右邊是圖層。</li><li><b>左邊</b>：筆刷尺寸、不透明度、復原、重做（上下拖曳圓圈可快速調整）。</li><li><b>中間</b>：工作區，在這裡畫圖。</li><li><b>下方</b>：時間軸開關、播放控制、每秒影格數、透視、尺規形狀、網格、所有影格、更多功能。</li><li>工具按鈕<b>再點一次</b>（或長按）會打開它的設定。</li>' }));
      return d;
    },
  };
  const tabsDef = [['gest', '手勢操作'], ['keys', '滑鼠與鍵盤'], ['tips', '動畫小技巧'], ['ui', '介面導覽']];
  const content = h('div');
  const tabs = h('div', { class: 'tabs', role: 'tablist' });
  const show = (k) => { content.textContent = ''; content.append(pages[k]()); $$('button', tabs).forEach((b) => b.classList.toggle('on', b.dataset.k === k)); };
  for (const [k, t] of tabsDef) tabs.append(h('button', { 'data-k': k, role: 'tab', onclick: () => show(k) }, t));
  const body = h('div', {}, content);
  const p = dialog({ title: 'FlipDesk 翻翻動畫桌．操作說明', body, cls: 'wide', buttons: [{ label: '開始畫畫', value: true, primary: true }] });
  const box = dialogStack[dialogStack.length - 1].box;
  box.insertBefore(tabs, box.querySelector('.modal-body'));
  show(tab);
  LS.set('helpSeen', true);
  return p;
}

/* ---------- 介面導覽（在畫面上標示按鈕） ---------- */
function showGuide() {
  if (!P) return;
  closePop();
  const prevTL = S.showTimeline, prevLP = S.showLayers;
  toggleTimeline(true); toggleLayers(true);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ov = h('div', { class: 'guide', role: 'dialog', 'aria-label': '介面導覽，點任一處關閉' });
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    ov.append(svg);
    document.body.append(ov);
    const vw = innerWidth, vh = innerHeight;
    const items = $$('[data-guide]').filter((el) => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden'; });
    const groups = { below: [], above: [], right: [], left: [] };
    for (const el of items) {
      const r = el.getBoundingClientRect();
      const big = r.width > 90 || r.height > 90;
      let side;
      if (big) side = el.id === 'layerPanel' ? 'left' : 'above';
      else if (r.top < vh * 0.25) side = 'below';
      else if (r.bottom > vh * 0.75) side = 'above';
      else side = r.left < vw / 2 ? 'right' : 'left';
      groups[side].push({ el, r, big });
    }
    const line = (x1, y1, x2, y2) => { const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); Object.entries({ x1, y1, x2, y2, stroke: '#e5352b', 'stroke-width': 2 }).forEach(([k, v]) => l.setAttribute(k, v)); svg.append(l); };
    const placed = [];
    const overlaps = (a) => placed.some((b) => a.x < b.x + b.w + 4 && a.x + a.w + 4 > b.x && a.y < b.y + b.h + 3 && a.y + a.h + 3 > b.y);
    const place = ({ el, r, big }, side) => {
      ov.append(h('div', { class: 'g-ring' + (big ? ' box' : ''), style: { left: r.left - 3 + 'px', top: r.top - 3 + 'px', width: r.width + 6 + 'px', height: r.height + 6 + 'px' } }));
      const lab = h('div', { class: 'g-label' }, el.dataset.guide);
      ov.append(lab);
      const lw = lab.offsetWidth, lh = lab.offsetHeight;
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let box = null;
      for (let k = 0; k < 8; k++) {
        let x, y;
        if (side === 'below') { x = cx - lw / 2; y = r.bottom + 14 + k * (lh + 6); }
        else if (side === 'above') { x = cx - lw / 2; y = (big ? cy : r.top - 14) - lh - k * (lh + 6); }
        else if (side === 'right') { x = r.right + 16; y = cy - lh / 2 + k * (lh + 4); }
        else { x = (big ? cx : r.left - 16) - lw; y = cy - lh / 2 + k * (lh + 4); }
        x = clamp(x, 4, vw - lw - 4); y = clamp(y, 4, vh - lh - 4);
        box = { x, y, w: lw, h: lh };
        if (!overlaps(box)) break;
      }
      placed.push(box);
      lab.style.left = box.x + 'px'; lab.style.top = box.y + 'px';
      const lx = clamp(cx, box.x, box.x + lw), ly = clamp(cy, box.y, box.y + lh);
      const ex = clamp(lx, r.left, r.right), ey = clamp(ly, r.top, r.bottom);
      line(ex, ey, lx, ly);
    };
    // 工作區
    const cs = [[0, 0], [P.w, 0], [P.w, P.h], [0, P.h]].map(([a, b]) => toScreen(a, b));
    const st = cv.getBoundingClientRect();
    const xs = cs.map((p) => p[0] + st.left), ys = cs.map((p) => p[1] + st.top);
    const wr = { left: Math.min(...xs), top: Math.min(...ys), right: Math.max(...xs), bottom: Math.max(...ys) };
    ov.append(h('div', { class: 'g-ring box', style: { left: wr.left + 'px', top: wr.top + 'px', width: wr.right - wr.left + 'px', height: wr.bottom - wr.top + 'px' } }));
    const wl = h('div', { class: 'g-label' }, '工作區，在這裡繪圖');
    ov.append(wl);
    const wbox = { x: (wr.left + wr.right) / 2 - wl.offsetWidth / 2, y: (wr.top + wr.bottom) / 2 - wl.offsetHeight / 2, w: wl.offsetWidth, h: wl.offsetHeight };
    wl.style.left = wbox.x + 'px'; wl.style.top = wbox.y + 'px';
    placed.push(wbox);
    for (const side of ['below', 'right', 'left', 'above']) {
      groups[side].sort((a, b) => (side === 'below' || side === 'above' ? a.r.left - b.r.left : a.r.top - b.r.top));
      for (const it of groups[side]) place(it, side);
    }
    ov.append(h('div', { class: 'g-tip' }, '點任何地方關閉導覽'));
    const close = () => { ov.remove(); toggleTimeline(prevTL); toggleLayers(prevLP); document.removeEventListener('keydown', kd, true); };
    const kd = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
    document.addEventListener('keydown', kd, true);
    ov.addEventListener('click', close);
  }));
}


/* ---------- 匯出匯入紀錄 ---------- */
function fmtKB(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function fmtFull(t) {
  const d = new Date(t), z = (v) => String(v).padStart(2, '0');
  return `${d.getFullYear()}/${z(d.getMonth() + 1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}
const IOLOG_MAX = 300;
function logIO(type, kind, file, detail = '', name) {
  const list = LS.get('iolog', []);
  list.unshift({ t: Date.now(), type, kind, name: name != null ? name : (P ? P.name : ''), file: file || '', detail });
  LS.set('iolog', list.slice(0, IOLOG_MAX));
}
function openIOLog() {
  closePop();
  let filter = 'all';
  const wrap = h('div');
  const table = h('div', { class: 'log-list' });
  const render = () => {
    const list = LS.get('iolog', []).filter((e) => filter === 'all' || e.type === filter);
    table.textContent = '';
    if (!list.length) { table.append(h('div', { class: 'empty-note' }, '還沒有紀錄。匯出 GIF、影片、圖片、專案檔、備份，或匯入檔案之後，這裡會記下時間和檔名。')); return; }
    for (const e of list) {
      table.append(h('div', { class: 'log-row' },
        h('span', { class: 'log-type ' + (e.type === '匯出' ? 'out' : 'in') }, e.type),
        h('div', { class: 'log-main' },
          h('div', {}, h('b', {}, e.kind), e.name ? '　' + e.name : ''),
          h('div', { class: 'log-file' }, e.file),
          e.detail ? h('div', { class: 'log-detail' }, e.detail) : null),
        h('span', { class: 'log-time' }, fmtFull(e.t))));
    }
  };
  const all = LS.get('iolog', []);
  wrap.append(h('p', { class: 'muted', style: { margin: '0 0 8px' } }, `紀錄存在這台裝置的瀏覽器裡，保留最近 ${IOLOG_MAX} 筆（目前 ${all.length} 筆）。`));
  wrap.append(segRow([{ value: 'all', label: '全部' }, { value: '匯出', label: '只看匯出', icon: 'download' }, { value: '匯入', label: '只看匯入', icon: 'upload' }], filter, (v) => { filter = v; render(); }));
  wrap.append(table);
  render();
  dialog({
    title: '匯出匯入紀錄', body: wrap, cls: 'wide',
    buttons: [
      { label: '清除紀錄', value: 'clear' },
      { label: '下載紀錄（Excel 可開）', icon: 'download', value: 'csv' },
      { label: '關閉', value: null, primary: true },
    ],
  }).then(async (v) => {
    if (v === 'csv') {
      const rows = [['時間', '動作', '類型', '作品', '檔名', '說明'], ...LS.get('iolog', []).map((e) => [fmtFull(e.t), e.type, e.kind, e.name, e.file, e.detail])];
      const csv = '﻿' + rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const d = new Date(), z = (n) => String(n).padStart(2, '0');
      if (!(await downloadBlob(new Blob([csv], { type: 'text/csv' }), `FlipDesk_匯出匯入紀錄_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}.csv`))) return;
      toast('紀錄已下載');
    } else if (v === 'clear') {
      if (await confirmBox('清除紀錄', '確定要清除所有匯出匯入紀錄嗎？（作品不會受影響）', '清除', true)) { LS.set('iolog', []); toast('紀錄已清除'); }
      openIOLog();
    }
  });
}

/* ---------- 全部作品一次備份／還原 ---------- */
function blobToDataURL(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}
function stamp() {
  const d = new Date(), z = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`;
}
async function backupAll() {
  if (!dbOK) { toast('這個瀏覽器不能自動儲存，請改用「儲存專案檔」'); return; }
  if (P) { finishEdits(); await saveNow(); }
  const metas = (await dbAll('meta')).sort((a, b) => b.updated - a.updated);
  if (!metas.length) { toast('還沒有作品可以備份'); return; }
  const prog = showProgress('正在備份全部作品…');
  try {
    const projects = [];
    let frames = 0;
    for (let i = 0; i < metas.length; i++) {
      const rec = await dbGet('data', metas[i].id);
      if (!rec) continue;
      prog.set(i / metas.length, `${i + 1} / ${metas.length}：${rec.name}`);
      const out = { ...rec, bgImage: rec.bgImage ? await blobToDataURL(rec.bgImage) : null, frames: [] };
      for (const f of rec.frames || []) {
        const cells = {};
        for (const [lid, b] of Object.entries(f.cells || {})) if (b) cells[lid] = await blobToDataURL(b);
        out.frames.push({ id: f.id, cells });
      }
      frames += out.frames.length;
      projects.push(out);
    }
    const fname = `FlipDesk_全部作品備份_${stamp()}.json`;
    const blob = new Blob([JSON.stringify({ app: 'flipdesk-backup', version: 1, created: Date.now(), count: projects.length, projects })], { type: 'application/json' });
    prog.close();
    if (!(await downloadBlob(blob, fname))) return;
    logIO('匯出', '全部作品備份', fname, `${projects.length} 件作品．共 ${frames} 格．${fmtKB(blob.size)}`, projects.map((p) => p.name).join('、').slice(0, 80));
    toast(`已備份 ${projects.length} 件作品`);
  } catch (e) {
    console.error(e); prog.close(); toast('備份失敗：' + e.message);
  }
}
async function restoreBackup(rec, fileName) {
  if (!dbOK) { toast('這個瀏覽器不能自動儲存，無法還原備份'); return; }
  const list = Array.isArray(rec.projects) ? rec.projects.filter((p) => p && Array.isArray(p.frames)) : [];
  if (!list.length) { toast('備份檔裡沒有作品'); return; }
  const existing = new Set((await dbAll('meta')).map((m) => m.id));
  const same = list.filter((p) => existing.has(p.id)).length;
  const body = h('div');
  body.append(h('p', {}, `備份時間：${rec.created ? fmtFull(rec.created) : '不明'}`));
  body.append(h('p', {}, `共 ${list.length} 件作品：${list.map((p) => p.name).join('、').slice(0, 120)}`));
  let mode = 'copy';
  if (same) {
    body.append(h('p', { class: 'muted' }, `其中 ${same} 件這台裝置已經有了，要怎麼處理？`));
    body.append(segRow([{ value: 'copy', label: '另存一份（保留原本的）' }, { value: 'replace', label: '用備份覆蓋' }, { value: 'skip', label: '略過' }], mode, (v) => { mode = v; }));
  }
  const ok = await dialog({ title: '還原全部作品備份', body, buttons: [{ label: '取消', value: false }, { label: '開始還原', icon: 'upload', primary: true, value: true }] });
  if (!ok) return;
  if (P) { finishEdits(); await saveNow(); }
  const prog = showProgress('正在還原作品…');
  let done = 0, skipped = 0, failed = 0, reopen = null;
  for (let i = 0; i < list.length; i++) {
    const src = list[i];
    prog.set(i / list.length, `${i + 1} / ${list.length}：${src.name}`);
    const dup = existing.has(src.id);
    if (dup && mode === 'skip') { skipped++; continue; }
    try {
      const copy = dup && mode === 'copy';
      const p = await deserializeProject({ ...src, id: copy ? uid() : src.id, name: copy ? src.name + '（還原）' : src.name });
      await writeProjectToDB(p);
      if (P && P.id === p.id) reopen = p;
      done++;
    } catch (e) { console.error(e); failed++; }
  }
  prog.close();
  logIO('匯入', '全部作品備份', fileName, `還原 ${done} 件${skipped ? `，略過 ${skipped} 件` : ''}${failed ? `，失敗 ${failed} 件` : ''}`, list.map((p) => p.name).join('、').slice(0, 80));
  if (reopen) { reopen._dirty = false; setProject(reopen); }
  toast(`已還原 ${done} 件作品${skipped ? `，略過 ${skipped} 件` : ''}${failed ? `，${failed} 件失敗` : ''}`, 3500);
  await showHome();
}

/* ===== 啟動與按鈕綁定 ===== */

function bindUI() {
  hydrateIcons();
  $('#btnHome').addEventListener('click', showHome);
  $('#btnHelp').addEventListener('click', () => openHelp());
  $('#projName').addEventListener('click', renameProject);

  for (const b of $$('.tool')) {
    onPress(b, () => { if (S.tool === b.dataset.tool) openToolOptions(b.dataset.tool, b); else { closePop(); setTool(b.dataset.tool); } },
      () => { setTool(b.dataset.tool); openToolOptions(b.dataset.tool, b); });
  }
  $('#btnColor').addEventListener('click', openColorPop);
  $('#btnLayers').addEventListener('click', () => toggleLayers());
  $('#lpAdd').addEventListener('click', opAddLayer);

  bindDragAdjust($('#btnSize'), sizeValue, setSize, (v0, d) => v0 * Math.exp(d / 110), openSizePop);
  bindDragAdjust($('#btnAlpha'), () => S.alpha, setAlpha, (v0, d) => v0 + d / 250, openAlphaPop);
  $('#btnUndo').addEventListener('click', undo);
  $('#btnRedo').addEventListener('click', redo);

  $('#btnTimeline').addEventListener('click', () => { toggleTimeline(); });
  $('#btnFirst').addEventListener('click', () => { stopPlay(); setFrame(0); });
  $('#btnPrev').addEventListener('click', () => { stopPlay(); setFrame(S.fi - 1); });
  $('#btnNext').addEventListener('click', () => { stopPlay(); setFrame(S.fi + 1); });
  $('#btnLast').addEventListener('click', () => { stopPlay(); setFrame(P.frames.length - 1); });
  $('#btnPlay').addEventListener('click', () => togglePlay(1));
  $('#btnPlayRev').addEventListener('click', () => togglePlay(-1));
  $('#btnCounter').addEventListener('click', openFpsPop);
  onPress($('#btnOnion'), () => { closePop(); toggleOnion(); }, openOnionPop);
  $('#btnShape').addEventListener('click', openShapePop);
  onPress($('#btnGrid'), () => toggleGrid(), openGridPop);
  $('#btnOverview').addEventListener('click', openOverview);
  $('#btnMore').addEventListener('click', openMoreMenu);
  $('#viewChip').addEventListener('click', fitView);

  $('#tlAdd').addEventListener('click', () => opAddFrame());
  $('#tlDup').addEventListener('click', () => opDupFrame());
  $('#tlDel').addEventListener('click', deleteSelectedFrames);
  $('#tlMulti').addEventListener('click', () => setMultiMode());

  $('#homeOpenFile').addEventListener('click', () => $('#fileProject').click());
  $('#homeBackup').addEventListener('click', backupAll);
  $('#homeLog').addEventListener('click', openIOLog);
  $('#homeHelp').addEventListener('click', () => openHelp());
  $('#fileImage').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importImage(f); });
  $('#fileImages').addEventListener('change', (e) => { const f = [...e.target.files]; e.target.value = ''; importImageFrames(f); });
  $('#fileProject').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importProjectFile(f); });

  // 拖放圖片或專案檔到視窗
  window.addEventListener('dragover', (e) => { e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    const files = [...(e.dataTransfer && e.dataTransfer.files || [])];
    if (!files.length) return;
    const proj = files.find((f) => /\.(json|flipdesk)$/i.test(f.name));
    if (proj) { importProjectFile(proj); return; }
    if (!P) return;
    const imgs = files.filter((f) => f.type.startsWith('image/'));
    if (imgs.length === 1) importImage(imgs[0]);
    else if (imgs.length > 1) importImageFrames(imgs);
  });
  // 從剪貼簿貼上圖片
  window.addEventListener('paste', (e) => {
    if (!P || !$('#home').hidden || (e.target.closest && e.target.closest('input, textarea'))) return;
    const item = [...(e.clipboardData && e.clipboardData.items || [])].find((i) => i.type.startsWith('image/'));
    if (item) { e.preventDefault(); importImage(item.getAsFile()); }
  });

  new ResizeObserver(() => resizeView()).observe($('#stage'));
  document.addEventListener('visibilitychange', () => { if (document.hidden && P) { finishEdits(); saveNow(); } });
  window.addEventListener('pagehide', () => { if (P) { finishEdits(); saveNow(); } });
}

async function boot() {
  bindUI();
  toggleTimeline(S.showTimeline);
  toggleLayers(false);
  setTool(S.tool);
  updateSidebar();
  updatePlayBtns();
  try { DB = await openDB(); } catch (e) { console.warn('IndexedDB unavailable', e); dbOK = false; }
  let opened = false;
  if (dbOK) {
    const last = LS.get('last', null);
    if (last) { try { await openProject(last); opened = !!P; } catch (e) { console.warn(e); } }
    if (!opened) {
      const metas = await dbAll('meta').catch(() => []);
      if (metas.length) { await showHome(); opened = true; }
    }
  }
  if (!opened) createProject(NEW_SIZES[0]);
  if (!dbOK) toast('這個瀏覽器不能自動儲存作品，記得用「⋯ → 儲存專案檔」保存', 5000);
  if (!LS.get('helpSeen', false)) openHelp();
}
boot();
