<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光速神話賽車小遊戲 🌌💨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e15; /* 宇宙深空黑 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Microsoft JhengHei', sans-serif;
            color: #ecf0f1;
            overflow: hidden;
        }

        h1 {
            color: #00ffcc; /* 螢光霓虹綠 */
            text-shadow: 0 0 10px #00ffcc, 2px 2px 0px #000;
            margin-bottom: 5px;
            animation: warp 0.2s infinite alternate; 
        }

        @keyframes warp {
            0% { transform: scale(0.98) skewX(-1deg); filter: hue-rotate(0deg); }
            100% { transform: scale(1.02) skewX(1deg); filter: hue-rotate(30deg); }
        }

        p {
            margin-top: 0;
            font-size: 16px;
            color: #ff0055;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255,0,85,0.5);
        }

        .game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 5px solid #00ffcc;
        }

        canvas {
            display: block;
            background-color: #1e202b; /* 超深色賽道 */
        }

        #restartBtn {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background-color: #00ffcc;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ffcc;
        }

        #restartBtn:hover {
            background-color: #ffffff;
            box-shadow: 0 0 25px #ffffff;
        }
    </style>
</head>
<body>

    <h1>🌌 光速神話：超越極限 🌌</h1>
    <p>🚨 警告：此速度已超越人類反應極限，祝你好運！ 🚨</p>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <button id="restartBtn" onclick="resetGame()">時空倒流（重新開始）</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const restartBtn = document.getElementById("restartBtn");

        let isGameOver = false;
        let score = 0;
        let speedMultiplier = 1;
        let frames = 0;

        // 玩家車輛設定 (操作反應速度拉到 18，近乎瞬移)
        const player = {
            width: 40,
            height: 70,
            x: canvas.width / 2 - 20,
            y: canvas.height - 100,
            speed: 18, 
            dx: 0,
            color: "#00ffcc" // 變成超跑螢光色
        };

        let enemies = [];
        let lines = [];
        for (let i = 0; i < canvas.height; i += 60) {
            lines.push(i);
        }

        // 鍵盤監聽
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") {
                player.dx = -player.speed;
            } else if (e.key === "ArrowRight" || e.key === "d") {
                player.dx = player.speed;
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "a" || e.key === "d") {
                player.dx = 0;
            }
        });

        function drawCar(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(x + 5, y + 15, width - 10, 15);
            ctx.fillRect(x + 5, y + height - 20, width - 10, 10);

            ctx.fillStyle = "#000";
            ctx.fillRect(x - 3, y + 10, 3, 15);
            ctx.fillRect(x + width, y + 10, 3, 15);
            ctx.fillRect(x - 3, y + height - 25, 3, 15);
            ctx.fillRect(x + width, y + height - 25, 3, 15);
        }

        function drawRoad() {
            ctx.fillStyle = "#ff0055"; // 改用霓虹粉紅標線
            for (let i = 0; i < lines.length; i++) {
                ctx.fillRect(canvas.width / 2 - 5, lines[i], 10, 30);
                if (!isGameOver) {
                    lines[i] += 25 * speedMultiplier; // 背景狂飆速度拉到 25！
                }
                if (lines[i] > canvas.height) {
                    lines[i] = -30;
                }
            }
        }

        function spawnEnemy() {
            let enemyWidth = 40;
            let enemyHeight = 70;
            let xPos = Math.random() * (canvas.width - enemyWidth);
            let colors = ["#ff9f43", "#ff6b6b", "#54a0ff", "#00d2d3"];
            let randomColor = colors[Math.floor(Math.random() * colors.length)];

            enemies.push({
                x: xPos,
                y: -enemyHeight,
                width: enemyWidth,
                height: enemyHeight,
                // 敵車基礎速度瘋狂提升 (18 ~ 28)
                speed: (Math.random() * 10 + 18) * speedMultiplier, 
                color: randomColor
            });
        }

        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function update() {
            if (isGameOver) return;

            player.x += player.dx;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            for (let i = 0; i < enemies.length; i++) {
                enemies[i].y += enemies[i].speed;

                if (checkCollision(player, enemies[i])) {
                    isGameOver = true;
                    restartBtn.style.display = "block";
                }

                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    i--;
                    score++;
                    
                    // 每 10 分增幅直接拉到 0.4！
                    if (score % 10 === 0) {
                        speedMultiplier += 0.4; 
                    }
                }
            }

            frames++;
            // 出車頻率極高，幾乎沒有喘息空間
            let spawnRate = Math.max(8, 25 - Math.floor(speedMultiplier * 5));
            if (frames % spawnRate === 0) {
                spawnEnemy();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#1e202b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawRoad();

            drawCar(player.x, player.y, player.width, player.height, player.color);

            for (let i = 0; i < enemies.length; i++) {
                drawCar(enemies[i].x, enemies[i].y, enemies[i].width, enemies[i].height, enemies[i].color);
            }

            // 頂級儀表板
            ctx.fillStyle = "#fff";
            ctx.font = "bold 22px 'Microsoft JhengHei', sans-serif";
            ctx.fillText("SCORE: " + score, 15, 35);
            ctx.fillStyle = "#00ffcc";
            // 基礎時速模擬從 350 km/h 開始狂飆
            ctx.fillText("SPEED: " + Math.round(350 * speedMultiplier) + " km/h", 15, 65);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 45px 'Microsoft JhengHei', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("💥 時空結構瓦解！ 💥", canvas.width / 2, canvas.height / 2 - 50);
                ctx.fillStyle = "#fff";
                ctx.font = "24px 'Microsoft JhengHei', sans-serif";
                ctx.fillText("最終超光速得分: " + score, canvas.width / 2, canvas.height / 2 + 10);
                ctx.textAlign = "left"; 
            }
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            speedMultiplier = 1;
            frames = 0;
            enemies = [];
            player.x = canvas.width / 2 - 20;
            restartBtn.style.display = "none";
            gameLoop();
        }

        gameLoop();
    </script>
</body>
</html>
