<style>
:root{
  --bg:#FFF5F8; --dot:#F8D7E0; --panel:#E3F2FD; --card:#FFFFFF; --ink:#5D4037; --ink2:#8D6E63;
  --line:#FADADD; --pink:#FF8FAB; --orange:#FFB74D; --mint:#E8F8EE; --cream:#FFFDE7;
  --shadow:0 8px 18px rgba(255,160,185,.28);
  --k-motion:#4C97FF; --k-looks:#9966FF; --k-sound:#CF63CF; --k-events:#E0A500; --k-control:#F5A00F;
  --k-sensing:#4AA6CC; --k-operators:#4CAF50; --k-data:#FF8C1A; --k-list:#FF661A; --k-custom:#FF6680;
  --k-pen:#0FBD8C; --k-ext:#0FA88C;
  --fix:#FF6B81; --suggest:#FFA726; --tip:#5AA9E6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#241C27; --dot:#342839; --panel:#2B2333; --card:#33283A; --ink:#F6E7EE; --ink2:#CDB6C2;
    --line:#4E3C57; --mint:#233429; --cream:#3A3424; --shadow:0 8px 18px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241C27; --dot:#342839; --panel:#2B2333; --card:#33283A; --ink:#F6E7EE; --ink2:#CDB6C2;
  --line:#4E3C57; --mint:#233429; --cream:#3A3424; --shadow:0 8px 18px rgba(0,0,0,.35); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100%;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.5px, transparent 1.7px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:'Nunito','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  font-size:16px; line-height:1.7;
}
img{max-width:100%}
:focus-visible{outline:3px solid var(--orange); outline-offset:2px}
h1,h2,h3,h4{line-height:1.35}
.top{max-width:1200px; margin:0 auto; padding:22px 16px 8px; display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; justify-content:space-between}
.brand{display:flex; align-items:center; gap:14px}
.logo{width:56px; height:56px; border-radius:20px; background:var(--pink); display:grid; place-items:center; font-size:30px; border:3px solid #fff; box-shadow:var(--shadow); transform:rotate(-6deg)}
h1{margin:0; font-size:1.55rem; font-weight:800}
.sub{margin:0; color:var(--ink2); font-size:.92rem}
.muted{color:var(--ink2)}
.btn{font:inherit; font-weight:700; border:none; border-radius:50px; padding:10px 20px; cursor:pointer; background:var(--pink); color:#fff; box-shadow:0 4px 12px rgba(255,143,171,.4); transition:transform .15s ease, box-shadow .15s ease}
.btn:hover{transform:scale(1.05); box-shadow:0 6px 16px rgba(255,143,171,.5)}
.btn.ghost{background:var(--card); color:var(--ink); border:3px solid var(--line); box-shadow:none}
.btn.orange{background:var(--orange); box-shadow:0 4px 12px rgba(255,183,77,.4)}
.btn.small{padding:6px 14px; font-size:.88rem}
.btn:disabled{opacity:.5; cursor:default; transform:none}
.linkbtn{font:inherit; background:none; border:none; color:var(--ink2); text-decoration:underline; cursor:pointer; padding:6px 4px; font-size:.85rem}
.card{background:var(--card); border:3px solid var(--line); border-radius:24px; box-shadow:var(--shadow); padding:20px; margin-bottom:18px}
.card h3{margin:0 0 10px; font-size:1.1rem}

/* empty state */
.hero{max-width:880px; margin:18px auto 40px; padding:0 16px}
.drop{border:3px dashed var(--pink); background:var(--cream); border-radius:30px; padding:40px 24px; text-align:center; transition:transform .2s, background .2s}
.drop.over{transform:scale(1.02); background:var(--mint)}
.drop .big{font-size:56px; display:inline-block; animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.drop .big{animation:none}.btn:hover{transform:none}}
.drop h2{margin:8px 0 4px; font-size:1.35rem}
.drop .acts{justify-content:center; margin-top:18px}
.feats{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:22px}
.feat{background:var(--card); border:3px solid var(--line); border-radius:22px; padding:16px 18px}
.feat b{display:block; font-size:1.02rem; margin-bottom:4px}
.feat p{margin:0; color:var(--ink2); font-size:.9rem}

/* layout */
.layout{max-width:1200px; margin:0 auto; padding:10px 16px 40px; display:grid; grid-template-columns:260px minmax(0,1fr); gap:20px; align-items:start}
.side{position:sticky; top:calc(env(safe-area-inset-top,0px) + 12px); background:var(--card); border:3px solid var(--line); border-radius:24px; padding:14px; box-shadow:var(--shadow)}
.side-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; font-weight:800}
.wlist{display:flex; flex-direction:column; gap:8px; max-height:65vh; overflow:auto; padding:2px}
.witem{font:inherit; text-align:left; background:var(--bg); color:var(--ink); border:3px solid transparent; border-radius:18px; padding:9px 12px; cursor:pointer; transition:transform .15s}
.witem:hover{transform:scale(1.03)}
.witem.on{border-color:var(--pink); background:var(--cream)}
.wname{display:block; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.wmeta{display:flex; gap:6px; flex-wrap:wrap; font-size:.8rem; color:var(--ink2); margin-top:2px}
.score{background:var(--pink); color:#fff; border-radius:50px; padding:0 8px; font-weight:800}
.bad{background:color-mix(in srgb,var(--fix) 18%,var(--card)); color:var(--fix); border-radius:50px; padding:0 8px; font-weight:800}
@media (max-width:840px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .wlist{flex-direction:row; overflow-x:auto; max-height:none}
  .witem{min-width:170px}
}
.head-card{padding:18px 20px 12px}
.wtitle{display:flex; flex-wrap:wrap; gap:10px 16px; justify-content:space-between; align-items:flex-start}
.wtitle h2{margin:0; font-size:1.4rem; word-break:break-all}
.acts{display:flex; flex-wrap:wrap; gap:8px}
.tabs{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.tab{font:inherit; font-weight:800; border:3px solid var(--line); background:var(--bg); color:var(--ink); border-radius:50px; padding:6px 16px; cursor:pointer; transition:transform .15s}
.tab:hover{transform:scale(1.05)}
.tab.on{background:var(--pink); border-color:var(--pink); color:#fff}
.tab .n{display:inline-block; min-width:20px; margin-left:4px; padding:0 6px; border-radius:50px; background:var(--orange); color:#fff; font-size:.78rem}

/* overview */
.stats{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px}
.stat{background:var(--bg); border-radius:18px; padding:10px 12px; text-align:center}
.stat b{display:block; font-size:1.6rem; font-weight:800; line-height:1.2}
.stat span{font-size:.84rem; color:var(--ink2)}
.cthead{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px}
.total{font-size:1.9rem; font-weight:800; color:var(--pink)}
.total small{font-size:1rem; color:var(--ink2)}
.lvbadge{display:inline-block; background:var(--orange); color:#fff; border-radius:50px; padding:2px 12px; font-weight:800; font-size:.88rem; margin-left:8px}
.ctrow{display:grid; grid-template-columns:minmax(120px,1.2fr) auto minmax(0,2fr); gap:6px 14px; align-items:center; padding:9px 0; border-top:2px dotted var(--line)}
.ctname{font-weight:800}
.dots{display:flex; gap:5px}
.dots i{width:16px; height:16px; border-radius:50%; background:var(--line); display:block}
.dots i.on{background:var(--pink)}
.cthint{font-size:.86rem; color:var(--ink2)}
@media (max-width:560px){.ctrow{grid-template-columns:1fr auto}.cthint{grid-column:1/-1}}
.bars{display:flex; flex-direction:column; gap:7px}
.bar{display:grid; grid-template-columns:78px 1fr 40px; gap:10px; align-items:center; font-size:.88rem}
.bar .track{height:14px; background:var(--bg); border-radius:50px; overflow:hidden}
.bar .fill{height:100%; border-radius:50px; background:var(--c)}
.bar .num{text-align:right; color:var(--ink2)}
.sprites{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.sprite{background:var(--bg); border-radius:20px; padding:10px; text-align:center}
.thumb{width:64px; height:64px; margin:0 auto 4px; border-radius:16px; background:var(--card); display:grid; place-items:center; overflow:hidden; font-size:28px; border:3px solid var(--line)}
.thumb img{width:100%; height:100%; object-fit:contain}
.thumb.sm{width:36px; height:36px; font-size:18px; border-width:2px; border-radius:12px; margin:0}
.sprite b{display:block; word-break:break-all}
.sprite span{font-size:.8rem; color:var(--ink2)}
.rel{list-style:none; margin:0; padding:0}
.rel li{padding:8px 0; border-top:2px dotted var(--line)}
.rel li:first-child{border-top:none}
.msg{display:inline-block; background:color-mix(in srgb,var(--k-events) 20%,var(--card)); border-radius:50px; padding:0 10px; font-weight:800}
.arrow{color:var(--pink); font-weight:800; margin:0 6px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-block; background:var(--bg); border-radius:50px; padding:1px 10px; font-size:.82rem; color:var(--ink2); font-weight:700}

/* logic */
details.tgt{padding:0; overflow:hidden}
details.tgt>summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:14px 18px; font-size:1.05rem}
details.tgt>summary::-webkit-details-marker{display:none}
details.tgt>summary::before{content:"▸"; color:var(--pink); font-weight:800; transition:transform .2s}
details.tgt[open]>summary::before{transform:rotate(90deg)}
.tgtbody{padding:0 18px 16px}
.script{background:var(--panel); border-radius:20px; padding:10px 14px 12px; margin:10px 0; overflow-x:auto}
.shead{display:flex; gap:8px; align-items:center; font-size:.85rem; color:var(--ink2); font-weight:700; margin-bottom:2px}
.orph{background:color-mix(in srgb,var(--suggest) 12%,var(--card)); border:2px dashed var(--suggest)}
.blk{--c:#999; background:color-mix(in srgb,var(--c) 14%,var(--card)); border-left:6px solid var(--c); border-radius:14px; padding:4px 12px; margin:5px 0; line-height:2.05; min-width:max-content}
.blk.hat{border-radius:22px 22px 14px 14px; font-weight:700}
.cblk{padding:0; background:transparent; border-left:none; min-width:0}
.cblk>.bh{background:color-mix(in srgb,var(--c) 14%,var(--card)); border-left:6px solid var(--c); border-radius:14px 14px 14px 4px; padding:4px 12px; min-width:max-content}
.cblk>.bh.belse{border-radius:4px 14px 14px 4px; font-weight:700}
.cblk>.bin{margin-left:10px; padding:1px 0 1px 12px; border-left:4px dashed color-mix(in srgb,var(--c) 50%,transparent)}
.emptyin{font-size:.85rem; color:var(--ink2); font-style:italic; padding:4px 0}
.rp{--c:#999; background:var(--c); color:#fff; border-radius:50px; padding:2px 9px; margin:0 2px; font-weight:700; font-size:.93em; box-decoration-break:clone; -webkit-box-decoration-break:clone}
.rp.bool{border-radius:7px}
.lit{background:var(--card); color:var(--ink); border:1.5px solid color-mix(in srgb,var(--ink) 25%,transparent); border-radius:50px; padding:0 8px; margin:0 2px; font-weight:700}
.lit.menu::after{content:" ▾"; font-size:.72em; opacity:.6}
.fld{font-weight:800}
.sw{display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:-2px; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.unk{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em}

/* advice */
.find{display:grid; grid-template-columns:auto 1fr; gap:12px; padding:12px 0; border-top:2px dotted var(--line)}
.find:first-of-type{border-top:none}
.find p{margin:2px 0 0; font-size:.92rem}
.tag{display:inline-block; border-radius:50px; padding:2px 10px; color:#fff; font-weight:800; font-size:.8rem; white-space:nowrap; height:max-content}
.lv-fix .tag{background:var(--fix)} .lv-suggest .tag{background:var(--suggest)} .lv-tip .tag{background:var(--tip)}
.snip{margin:8px 0 0; background:var(--bg); border-radius:14px; padding:8px 12px; font-size:.82rem; overflow-x:auto; white-space:pre; font-family:ui-monospace,Menlo,Consolas,monospace}
.good{list-style:none; margin:0; padding:0}
.good li{padding:6px 0 6px 30px; position:relative}
.good li::before{content:"🌸"; position:absolute; left:0; top:6px}
.good-card{background:var(--mint)}
.next li{margin:4px 0}

/* ai */
.aictl{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end}
.aictl label{display:flex; flex-direction:column; gap:4px; font-size:.85rem; font-weight:700; color:var(--ink2)}
select{font:inherit; color:var(--ink); background:var(--bg); border:3px solid var(--line); border-radius:16px; padding:6px 12px}
.aiout{margin-top:16px; background:var(--bg); border-radius:20px; padding:16px 18px; min-height:80px}
.aiout h3{font-size:1.05rem; margin:14px 0 6px; color:var(--pink)}
.aiout h3:first-child{margin-top:0}
.aiout p{margin:6px 0}
.aiout ul,.aiout ol{margin:6px 0; padding-left:1.4em}
.aiout code{background:var(--card); border-radius:8px; padding:0 5px}
.thinking{color:var(--ink2); display:flex; align-items:center; gap:10px}
.thinking::before{content:""; width:18px; height:18px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--pink); animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--fix); font-weight:700}

/* class table */
.tablewrap{overflow-x:auto}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:.9rem}
th,td{padding:8px 10px; text-align:center; border-bottom:2px dotted var(--line); white-space:nowrap}
th{background:var(--bg); font-weight:800}
th:first-child{border-radius:14px 0 0 14px} th:last-child{border-radius:0 14px 14px 0}
td:first-child,th:first-child{text-align:left}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--cream)}
.lvl0{color:var(--ink2)} .lvl3{color:var(--pink); font-weight:800}

/* toast & modal */
#toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); transform:translateX(-50%) translateY(120px); background:var(--ink); color:var(--card); border-radius:50px; padding:10px 20px; font-weight:700; transition:transform .3s; z-index:20; max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed; inset:0; background:rgba(40,20,30,.45); display:grid; place-items:center; padding:16px; z-index:30}
.modal[hidden]{display:none}
.mbox{width:min(680px,100%); margin:0}
.mbox textarea{width:100%; height:50vh; font:inherit; font-size:.85rem; border:3px solid var(--line); border-radius:16px; padding:10px; background:var(--bg); color:var(--ink); margin:10px 0}
</style>

/* ---------- 轉寫：積木 → 文字／HTML ---------- */
const litOut = (v, mode, menu) => {
  const s = String(v ?? '');
  if (mode === 'html') return `<span class="lit${menu ? ' menu' : ''}">${s === '' ? '&nbsp;' : esc(s)}</span>`;
  if (s === '') return '[ ]';
  return (menu || !isNaN(Number(s))) ? `[${s}]` : `「${s}」`;
};
const colorOut = (v, mode) => {
  const c = /^#[0-9a-f]{3,8}$/i.test(String(v)) ? v : '#999999';

};
const varOut = (name, kind, mode) => mode === 'html'

function renderValue(ctx, val, mode) {
  if (val == null) return litOut('', mode);
  if (typeof val === 'string') {
    const b = ctx.blocks[val];
    if (!b) return litOut('', mode);
    if (Array.isArray(b)) return renderValue(ctx, b, mode);
    if (b.shadow) return renderShadow(b, mode);
    return renderReporter(ctx, val, mode);
  }
  if (Array.isArray(val)) {
    const [t, v] = val;
    if (t === 12) return varOut(v, 'data', mode);
    if (t === 13) return varOut(v, 'list', mode);
    if (t === 9) return colorOut(v, mode);
    if (t === 11) return litOut(v, mode, true);

}

  const menu = !/^(math_|text$|note$)/.test(b.opcode);

  if (mode === 'html') return `<span class="rp${bool ? ' bool' : ''}" style="--c:var(--k-${cat})">${inner}</span>`;

  return tpl.split(/(\{(?:F:)?[A-Z0-9_]+\})/).map(part => {
    const m = part.match(/^\{(F:)?([A-Z0-9_]+)\}$/);
    if (!m) return mode === 'html' ? esc(part) : part;
    if (m[1]) {
      const f = b.fields?.[m[2]];
      if (!f) return '';
      if (m[2] === 'VARIABLE') return varOut(f[0], 'data', mode);
      if (m[2] === 'LIST') return varOut(f[0], 'list', mode);
      if (m[2] === 'BROADCAST_OPTION') return litOut(f[0], mode, true);

function analyze(proj, fileName) {
  if (!proj || !Array.isArray(proj.targets)) {
    if (proj && (proj.objName !== undefined || proj.children)) throw new Error('這是 Scratch 2.0（sb2）格式。請用 Scratch 3 開啟後另存為 sb3 再上傳。');
    throw new Error('檔案內容不是 Scratch 3 作品格式。');
  }
  const targets = proj.targets;
  const vars = {};
  for (const t of targets) {
    const owner = t.isStage ? '舞台' : t.name;
    for (const [id, v] of Object.entries(t.variables || {})) vars[id] = {id, name:v[0], owner, kind:'var', set:0, change:0, read:0, write:0};
    for (const [id, v] of Object.entries(t.lists || {})) vars[id] = {id, name:v[0], owner, kind:'list', set:0, change:0, read:0, write:0};
  }
  const mark = (id, name, kind, how) => {
    const v = vars[id] || Object.values(vars).find(x => x.name === name && x.kind === kind);
    if (v) v[how]++;

  const opc = {}, catCount = {}, hats = {}, bSend = {}, bRecv = {};

  const addB = (map, name, who) => {
    if (name == null) return;
    const k = String(name).toLowerCase();

  };
  const tinfos = [];
  for (const t of targets) {
    const blocks = t.blocks || {};
    const ti = {name: t.isStage ? '舞台' : t.name, isStage: !!t.isStage, costumes: (t.costumes || []).length, sounds: (t.sounds || []).length,
      costumeRef: (t.costumes || [])[t.currentCostume || 0] || null, blockCount: 0, comments: Object.keys(t.comments || {}).length,
      procDef: {}, procCall: {}, scripts: [], orphans: [], emptyC: [], thumb: null};

    const tops = [], orph = [], loose = [];
    for (const [id, b] of Object.entries(blocks)) {
      if (Array.isArray(b)) {
        if (b[0] === 12 || b[0] === 13) { mark(b[2], b[1], b[0] === 12 ? 'var' : 'list', 'read'); loose.push(b); }
        continue;
      }
      if (!b || b.shadow) continue;
      const op = b.opcode, cat = catOf(op);
      ti.blockCount++; totalBlocks++;
      opc[op] = (opc[op] || 0) + 1;
      catCount[cat] = (catCount[cat] || 0) + 1;
      if (b.next) anyNext = true;
      const vf = b.fields?.VARIABLE;
      if (vf) mark(vf[1], vf[0], 'var', op === 'data_setvariableto' ? 'set' : op === 'data_changevariableby' ? 'change' : 'read');
      const lf = b.fields?.LIST;
      if (lf) mark(lf[1], lf[0], 'list', /^data_(addto|deleteof|deleteall|insertat|replaceitem)/.test(op) ? 'write' : 'read');
      for (const inp of Object.values(b.inputs || {})) {
        if (!Array.isArray(inp)) continue;
        for (const v of inp.slice(1)) if (Array.isArray(v) && (v[0] === 12 || v[0] === 13)) mark(v[2], v[1], v[0] === 12 ? 'var' : 'list', 'read');
      }

        const p = b.fields?.PROPERTY?.[0];

  ct.data = hasRe(/^data_.*list/) ? 3 : has('data_setvariableto', 'data_changevariableby', 'data_showvariable', 'data_hidevariable') ? 2

    : has('event_whenflagclicked') ? 1 : 0;
  ct.parallel = (hatsDup('msg:') || hatsDup('backdrop:') || hc('clone') >= 2 || hc('gt') >= 2) ? 3 : (hatsDup('key:') || hatsDup('click:')) ? 2 : hc('flag') >= 2 ? 1 : 0;
  ct.sync = has('control_wait_until', 'event_whenbackdropswitchesto', 'event_broadcastandwait') ? 3

  ct.abstraction = has('control_start_as_clone') ? 3 : has('procedures_definition') ? 2 : (totalScripts > 1 && sprites.length > 1) ? 1 : 0;
  ct.total = CT_DEFS.reduce((s, c) => s + ct[c.key], 0);

  const add = (level, title, detail, code) => F.push({level, title, detail, code});
  const monitorsOn = new Set((proj.monitors || []).filter(m => m.visible).map(m => m.id));
  const allNames = Object.keys(bSend).concat(Object.keys(bRecv));
  const bNames = [...new Set(allNames)];
  if (!dynamicB) {
    const dead = bNames.filter(k => bRecv[k] && !bSend[k]).map(k => `「${bRecv[k].name}」（${[...bRecv[k].who].join('、')}）`);
    if (dead.length) add('fix', '有接收訊息的程式永遠不會被觸發', `以下訊息有角色在等待接收，但沒有任何地方廣播它：${dead.join('、')}。請確認是否漏掉「廣播訊息」積木，或訊息名稱打錯。`);
  }
  const lonely = bNames.filter(k => bSend[k] && !bRecv[k]).map(k => `「${bSend[k].name}」`);
  if (lonely.length) add('suggest', '廣播的訊息沒有人接收', `${lonely.join('、')} 被廣播了，但沒有任何角色使用「當收到訊息」。這個廣播目前沒有作用，可以刪除或補上接收的程式。`);
  const vlist = Object.values(vars);
  const uninit = vlist.filter(v => v.kind === 'var' && v.change > 0 && v.set === 0);
  if (uninit.length) add('fix', '變數可能沒有設定初始值', `${uninit.map(v => `「${v.name}」`).join('、')} 只有「改變」，沒有「設為」。重新開始時會沿用上一次的數值，建議在「當 🚩 被點擊」時先把變數設為初始值。`);
  const unusedV = vlist.filter(v => v.kind === 'var' && !v.set && !v.change && !v.read && !v.write && !DEFAULT_VARS.has(v.name));
  if (unusedV.length) add('suggest', '有宣告但沒有使用的變數', `${unusedV.map(v => `「${v.name}」（${v.owner}）`).join('、')} 沒有被任何積木使用，可以刪除讓作品更整潔。`);
  const unusedL = vlist.filter(v => v.kind === 'list' && !v.read && !v.write);
  if (unusedL.length) add('suggest', '有宣告但沒有使用的清單', `${unusedL.map(v => `「${v.name}」（${v.owner}）`).join('、')} 沒有被任何積木使用。`);
  const writeOnly = vlist.filter(v => v.kind === 'var' && (v.set || v.change) && !v.read && !monitorsOn.has(v.id) && !DEFAULT_VARS.has(v.name));
  if (writeOnly.length) add('tip', '變數只被寫入、從未讀取', `${writeOnly.map(v => `「${v.name}」`).join('、')} 有被設定或改變，但沒有任何程式讀取它，也沒有顯示在舞台上。請確認它是否真的有用途。`);
  for (const ti of tinfos) {
    if (ti.orphans.length) add('suggest', `「${ti.name}」有 ${ti.orphans.length} 組未連接的積木`, '這些積木沒有接在任何事件下方，作品執行時不會運作。若是測試用的可以刪除，否則請接到合適的事件積木下。',
      ti.orphans[0].text.split('\n').slice(0, 5).join('\n'));
    const unc = Object.keys(ti.procDef).filter(pc => !ti.procCall[pc]);
    if (unc.length) add('suggest', `「${ti.name}」有自訂積木沒有被使用`, `${unc.map(p => `「${p.replace(/%[snb]/g, '○')}」`).join('、')} 定義了卻從未呼叫，可以刪除或在程式中使用它。`);
  }
  const emptyCs = tinfos.flatMap(ti => ti.emptyC.map(e => `${ti.name}：${e}`));
  if (emptyCs.length) add('suggest', '有空的迴圈或條件積木', `以下積木裡面沒有放任何積木：${emptyCs.slice(0, 8).join('；')}${emptyCs.length > 8 ? '…' : ''}。`);
  const lone = tinfos.flatMap(ti => ti.scripts.filter(s => s.lone).map(s => `${ti.name}：${s.text.split('\n')[0]}`));
  if (lone.length) add('tip', '有只放了事件、沒有動作的程式', `${lone.slice(0, 8).join('；')}。事件下面沒有接任何積木，可以刪除或補完。`);
  const sig = {};
  tinfos.forEach(ti => ti.scripts.forEach((s, i) => { if (s.n >= 4) (sig[s.text] ||= []).push(`${ti.name} 腳本 ${i + 1}`); }));
  for (const [text, list] of Object.entries(sig)) if (list.length >= 2)
    add('suggest', `有 ${list.length} 段完全相同的程式`, `出現在：${list.join('、')}。可以把共同部分做成「自訂積木」，或改用「分身」讓一份程式控制多個相同物件，之後修改只需改一處。`, text.split('\n').slice(0, 5).join('\n'));
  tinfos.forEach(ti => ti.scripts.forEach((s, i) => {
    if (s.n > 40) add('suggest', `「${ti.name}」腳本 ${i + 1} 很長（${s.n} 個積木）`, '程式太長不容易閱讀與除錯。可以把其中一段功能拆成自訂積木，或依功能拆成幾段腳本。');
    if (s.depth >= 4) add('tip', `「${ti.name}」腳本 ${i + 1} 巢狀層數很深（${s.depth} 層）`, '迴圈或條件包了很多層，閱讀時容易混淆。可以用「且／或」合併條件，或把內層邏輯拆成自訂積木。');
  }));
  const defNames = sprites.filter(s => /^(角色|sprite)\s*\d*$/i.test(s.name.trim())).map(s => `「${s.name}」`);
  if (defNames.length) add('tip', '角色使用預設名稱', `${defNames.join('、')} 還是預設名稱。改成有意義的名字（例如「主角」「蘋果」），程式會更容易看懂。`);
  const noCode = sprites.filter(s => !s.scripts.length && !s.orphans.length).map(s => `「${s.name}」`);
  if (noCode.length) add('tip', '有角色沒有任何程式', `${noCode.join('、')} 沒有程式。若只是裝飾可以忽略；若應該有動作，請記得補上。`);
  if (totalScripts > 0 && !has('event_whenflagclicked')) add('tip', '作品沒有「當 🚩 被點擊」', '沒有綠旗作為起點，使用者不容易知道怎麼開始。建議用綠旗做初始化，例如設定位置、變數與造型。');
  if (has('control_create_clone_of') && !has('control_delete_this_clone')) add('tip', '分身產生後沒有刪除', 'Scratch 同時最多只能有 300 個分身。分身完成任務後，記得用「分身刪除」移除，避免作品越跑越慢。');
  if (totalBlocks >= 40 && totalComments === 0) add('tip', '程式沒有任何註解', '作品已有一定規模，建議在重要的程式旁加上註解，說明這段程式在做什麼。');
  const order = {fix: 0, suggest: 1, tip: 2};
  F.sort((a, b) => order[a.level] - order[b.level]);

  /* ---- 做得好的地方 ---- */
  const G = [];
  if (ct.abstraction >= 2) G.push('使用「自訂積木」把重複的步驟模組化，程式更好讀、更好改。');
  if (has('control_start_as_clone')) G.push('運用「分身」產生多個行為相同的物件，程式簡潔有效率。');
  if (bNames.some(k => bSend[k] && bRecv[k])) G.push('用廣播訊息讓角色之間互相溝通，分工清楚。');
  if (ct.data === 3) G.push('使用清單管理多筆資料。');
  if (ct.logic === 3) G.push('用「且／或／不成立」組合條件，判斷更精確。');
  else if (ct.logic === 2) G.push('使用「如果…否則」處理不同情況。');
  if (vlist.some(v => v.kind === 'var' && (v.set || v.change) && (v.read || monitorsOn.has(v.id)))) G.push('用變數記錄作品的狀態（例如分數或時間）。');
  if (ct.interact >= 2) G.push('作品能讓使用者用鍵盤、滑鼠或回答問題互動。');
  if (totalComments > 0) G.push('有在程式中加入註解，方便別人理解。');
  if (sprites.length >= 2 && !defNames.length) G.push('角色命名清楚，一看就知道用途。');
  if (!G.length && totalBlocks > 0) G.push('作品已經有可以執行的程式流程，是很好的起點！');

  const vcount = vlist.filter(v => v.kind === 'var').length, lcount = vlist.filter(v => v.kind === 'list').length;
  const procCount = tinfos.reduce((s, t) => s + Object.keys(t.procDef).length, 0);
  const rel = bNames.map(k => ({name: (bSend[k] || bRecv[k]).name, from: bSend[k] ? [...bSend[k].who] : [], to: bRecv[k] ? [...bRecv[k].who] : []}));
  return {
    title: String(fileName).replace(/\.(sb3|json)$/i, ''), fileName, targets: tinfos, ct, findings: F, strengths: G, catCount, rel,
    extensions: (proj.extensions || []).map(e => EXT[e] || e),
    stats: {sprites: sprites.length, scripts: totalScripts, blocks: totalBlocks, vars: vcount, lists: lcount, broadcasts: bNames.length, procs: procCount, comments: totalComments},
    fixCount: F.filter(f => f.level === 'fix').length, suggestCount: F.filter(f => f.level === 'suggest').length
  };
}

/* ---------- 示範作品 ---------- */
function buildSample() {
  let n = 0; const nid = () => 's' + (++n);
  function build(blocks, nodes, parent, top) {
    let first = null, prev = null;
    nodes.forEach((nd, i) => {
      const id = nid();
      const b = {opcode: nd.op, next: null, parent: prev || parent || null, inputs: {}, fields: nd.f || {}, shadow: false, topLevel: !!(top && i === 0)};
      if (b.topLevel) { b.x = 0; b.y = top.y || 0; }
      blocks[id] = b;
      if (prev) blocks[prev].next = id; else first = id;
      for (const [k, v] of Object.entries(nd.in || {})) {
        if (v && v.op) { const rid = build(blocks, [v], id, null); b.inputs[k] = BOOL.has(v.op) ? [2, rid] : [3, rid, [4, '']]; }
        else if (v && v.menu) { const mid = nid(); blocks[mid] = {opcode: v.menu, next: null, parent: id, inputs: {}, fields: {[v.field]: [v.value, null]}, shadow: true, topLevel: false}; b.inputs[k] = [1, mid]; }
        else b.inputs[k] = [1, [typeof v === 'number' ? 4 : 10, String(v)]];
      }
      if (nd.sub) b.inputs.SUBSTACK = [2, build(blocks, nd.sub, id, null)];
      prev = id;
    });
    return first;
  }
  const key = k => ({op: 'sensing_keypressed', in: {KEY_OPTION: {menu: 'sensing_keyoptions', field: 'KEY_OPTION', value: k}}});
  const stage = {}, cat = {}, apple = {};
  build(stage, [{op: 'event_whenflagclicked'}, {op: 'data_setvariableto', f: {VARIABLE: ['分數', 'v1']}, in: {VALUE: 0}}], null, {y: 0});
  build(stage, [{op: 'event_whenbroadcastreceived', f: {BROADCAST_OPTION: ['遊戲結束', 'bc1']}}, {op: 'control_stop', f: {STOP_OPTION: ['all', null]}}], null, {y: 200});
  build(cat, [{op: 'event_whenflagclicked'}, {op: 'motion_gotoxy', in: {X: 0, Y: -130}}, {op: 'control_forever', sub: [
    {op: 'control_if', in: {CONDITION: key('right arrow')}, sub: [{op: 'motion_changexby', in: {DX: 10}}]},
    {op: 'control_if', in: {CONDITION: key('left arrow')}, sub: [{op: 'motion_changexby', in: {DX: -10}}]}
  ]}], null, {y: 0});
  build(cat, [{op: 'looks_sayforsecs', in: {MESSAGE: '你好！', SECS: 2}}], null, {y: 400});
  const rx = () => ({op: 'operator_random', in: {FROM: -200, TO: 200}});
  build(apple, [{op: 'event_whenflagclicked'}, {op: 'motion_gotoxy', in: {X: rx(), Y: 180}}, {op: 'control_forever', sub: [
    {op: 'motion_changeyby', in: {DY: -5}},
    {op: 'control_if', in: {CONDITION: {op: 'sensing_touchingobject', in: {TOUCHINGOBJECTMENU: {menu: 'sensing_touchingobjectmenu', field: 'TOUCHINGOBJECTMENU', value: '貓咪'}}}}, sub: [
      {op: 'data_changevariableby', f: {VARIABLE: ['分數', 'v1']}, in: {VALUE: 1}},
      {op: 'motion_gotoxy', in: {X: rx(), Y: 180}}]},
    {op: 'control_if', in: {CONDITION: {op: 'operator_lt', in: {OPERAND1: {op: 'motion_yposition'}, OPERAND2: -170}}}, sub: [
      {op: 'event_broadcast', in: {BROADCAST_INPUT: {menu: 'event_broadcast_menu', field: 'BROADCAST_OPTION', value: '遊戲結束'}}}]}
  ]}], null, {y: 0});
  return {targets: [
    {isStage: true, name: 'Stage', variables: {v1: ['分數', 0], v2: ['我的變數', 0], v3: ['速度', 3]}, lists: {}, broadcasts: {bc1: '遊戲結束'}, blocks: stage, comments: {}, costumes: [{name: '背景1'}], sounds: []},
    {isStage: false, name: '貓咪', variables: {}, lists: {}, broadcasts: {}, blocks: cat, comments: {}, costumes: [{name: '造型1'}, {name: '造型2'}], sounds: [{name: '喵'}]},
    {isStage: false, name: '角色2', variables: {}, lists: {}, broadcasts: {}, blocks: apple, comments: {}, costumes: [{name: '蘋果'}], sounds: []}
  ], monitors: [{id: 'v1', visible: true}], extensions: [], meta: {semver: '3.0.0'}};
}

/* ---------- 載入檔案 ---------- */
async function loadFiles(files) {
  const list = [...files].filter(f => /\.(sb3|json)$/i.test(f.name));
  if (!list.length) { toast('請選擇 .sb3 檔案'); return; }
  const ws = list.map(f => ({id: ++seq, fileName: f.name, file: f, status: 'loading'}));
  S.works.push(...ws);
  if (!S.sel || S.sel === 'class' || !S.works.find(w => w.id === S.sel)) S.sel = S.works.length > 1 ? 'class' : ws[0].id;
  render();
  for (const w of ws) {
    try {
      let proj, zip = null;
      if (/\.json$/i.test(w.fileName)) {
        try { proj = JSON.parse(await w.file.text()); } catch (err) { throw new Error('JSON 格式錯誤，無法讀取。'); }
      }
      else {
        if (typeof JSZip === 'undefined') throw new Error('解壓縮元件載入失敗，請重新整理頁面後再試。');
        try { zip = await JSZip.loadAsync(w.file); }
        catch (err) { throw new Error('檔案無法解壓縮，可能已損壞或不是 sb3 檔。'); }
        const pj = zip.file('project.json');
        if (!pj) throw new Error('找不到 project.json，這可能不是 Scratch 3 的 sb3 檔。');
        try { proj = JSON.parse(await pj.async('string')); } catch (err) { throw new Error('作品內容損壞，無法讀取 project.json。'); }
      }
      w.data = analyze(proj, w.fileName);
      if (zip) await attachThumbs(w.data, zip);
      w.status = 'ok';
    } catch (e) {
      w.status = 'error';
      w.error = e && e.message ? e.message : '無法讀取這個檔案。';
    }
    delete w.file;
    render();
  }
}
async function attachThumbs(d, zip) {
  for (const ti of d.targets) {
    const c = ti.costumeRef;
    if (!c) continue;
    const fname = c.md5ext || (c.assetId && c.dataFormat ? `${c.assetId}.${c.dataFormat}` : null);
    const f = fname && zip.file(fname);
    if (!f) continue;
    try {
      const b64 = await f.async('base64');
      if (b64.length > 800000) continue;
      const fmt = String(c.dataFormat || fname.split('.').pop()).toLowerCase();
      const mime = fmt === 'svg' ? 'image/svg+xml' : fmt === 'jpg' || fmt === 'jpeg' ? 'image/jpeg' : fmt === 'gif' ? 'image/gif' : 'image/png';
      ti.thumb = `data:${mime};base64,${b64}`;
    } catch (e) { /* 略過縮圖 */ }
  }
}
function loadSample() {
  const w = {id: ++seq, fileName: '示範作品－接蘋果.sb3', status: 'ok'};
  w.data = analyze(buildSample(), w.fileName);
  S.works.push(w); S.sel = w.id; S.tab = 'overview'; render();
}

function md(src) {
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let out = '', list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of esc(src).split('\n')) {
    const l = raw.trimEnd(); let m;
    if ((m = l.match(/^#{1,2}\s+(.*)/))) { close(); out += `<h3>${inline(m[1])}</h3>`; }
    else if ((m = l.match(/^#{3,}\s+(.*)/))) { close(); out += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.、]\s*(.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) close();
    else { close(); out += `<p>${inline(l)}</p>`; }
  }
  close();
  return out;
}

      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();

});
render();
})();
</script>
