<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日式可愛風教室分組工具</title>
    <style>
        /* 全局樣式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Yusei Magic', 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: #fff3f7;
            color: #6a4873;
            line-height: 1.6;
            padding: 20px;
        }
        
        /* 單選按鈕樣式 */
        .radio-group {
            display: flex;
            align-items: center;
            margin-top: 15px;
        }
        
        .radio-group-label {
            color: #e66da0;
            font-weight: bold;
            margin-right: 15px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            margin-right: 15px;
            cursor: pointer;
            position: relative;
        }
        
        .radio-option input[type="radio"] {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }
        
        .radio-checkmark {
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-right: 5px;
            border: 2px solid #ffc2d8;
            border-radius: 50%;
            background-color: white;
            position: relative;
            vertical-align: middle;
            box-sizing: border-box;
        }
        
        .radio-option input[type="radio"]:checked + .radio-checkmark:after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #e66da0;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transform: translate(0, 0);
        }
        
        .radio-option label {
            color: #6a4873;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: normal;
        }

        /* 日式可愛風標題 */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #e66da0;
            text-shadow: 2px 2px 0 #fff, 3px 3px 0 #ffc2d8;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1rem;
            color: #9b7aab;
        }

        /* 主要容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(255, 159, 191, 0.3);
            border: 3px solid #ffc2d8;
        }

        /* 表單區域 */
        .form-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #fff9fc;
            border-radius: 15px;
            border: 2px dashed #ffc2d8;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e66da0;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #ffc2d8;
            border-radius: 10px;
            background-color: white;
            font-size: 1rem;
            color: #6a4873;
            transition: all 0.3s ease;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #e66da0;
            box-shadow: 0 0 10px rgba(230, 109, 160, 0.3);
        }

        .input-group textarea {
            height: 100px;
            resize: vertical;
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
            cursor: pointer;
        }

        .file-upload input[type=file] {
            position: absolute;
            font-size: 100px;
            opacity: 0;
            right: 0;
            top: 0;
            cursor: pointer;
        }

        .file-upload-btn {
            display: inline-block;
            background-color: #ffc2d8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .file-upload-btn:hover {
            background-color: #e66da0;
        }

        .file-name {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #9b7aab;
        }

        /* 按鈕樣式 */
        .btn {
            background-color: #e66da0;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 3px 6px rgba(230, 109, 160, 0.4);
            transition: all 0.3s ease;
            display: block;
            margin: 0 auto;
        }

        .btn:hover {
            background-color: #d65b90;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(230, 109, 160, 0.5);
        }

        /* 分組結果區域 */
        .result-section {
            margin-top: 30px;
        }

        .classroom {
            width: 100%;
            position: relative;
            margin-top: 40px;
        }

        /* 移除講台樣式 */

        .groups-container {
            display: grid;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }

        .group {
            background-color: #fff3f7;
            border-radius: 15px;
            padding: 15px;
            border: 2px solid #e66da0;
            box-shadow: 0 3px 10px rgba(255, 159, 191, 0.3);
            transition: all 0.3s ease;
        }

        .group:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 159, 191, 0.5);
        }

        .group-header {
            background-color: #ffc2d8;
            color: #6a4873;
            text-align: center;
            padding: 8px;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .group-members {
            font-size: 0.9rem;
            color: #6a4873;
            min-height: 80px;
            padding: 8px;
            background-color: white;
            border-radius: 8px;
        }

        .group-member {
            margin-bottom: 5px;
        }

        /* 響應式設計 */
        @media screen and (max-width: 768px) {
            .form-section {
                flex-direction: column;
            }

            .header h1 {
                font-size: 2rem;
            }

            .container {
                padding: 15px;
            }
        }

        /* 可愛裝飾 */
        .decoration {
            position: absolute;
            z-index: -1;
            opacity: 0.6;
        }

        .decoration-1 {
            top: 10%;
            left: 3%;
            width: 60px;
            height: 60px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23ffc2d8" d="M50 0 A50 50 0 0 1 100 50 A50 50 0 0 1 50 100 A50 50 0 0 1 0 50 A50 50 0 0 1 50 0 z"/><path fill="%23fff" d="M30 30 L70 30 L70 70 L30 70 z"/></svg>');
            background-repeat: no-repeat;
            transform: rotate(45deg);
        }

        .decoration-2 {
            bottom: 15%;
            right: 5%;
            width: 80px;
            height: 80px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23e66da0" d="M50 0 L95 50 L50 100 L5 50 z"/></svg>');
            background-repeat: no-repeat;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div class="header">
        <h1>日式可愛風教室分組工具</h1>
        <p>上傳學生名單，輕鬆生成可愛的分組圖</p>
    </div>

    <div class="container">
        <div class="form-section">
            <div class="input-group">
                <label for="studentList">學生名單</label>
                <textarea id="studentList" placeholder="輸入學生名單，每行一個名字"></textarea>
                <div class="file-upload">
                    <button class="file-upload-btn">上傳文字檔案</button>
                    <input type="file" id="fileInput" accept=".txt">
                </div>
                <div class="file-name" id="fileName"></div>
            </div>
            <div class="input-group">
                <label for="columns">直排數</label>
                <input type="number" id="columns" min="1" value="3">
                <label for="rows" style="margin-top: 15px;">橫排數</label>
                <input type="number" id="rows" min="1" value="2">
                <p style="margin-top: 10px; font-size: 0.9rem; color: #9b7aab;">
                    總共會有 <span id="totalGroups">6</span> 組
                </p>
                <div class="radio-group">
                    <span class="radio-group-label">分組方式：</span>
                    <label class="radio-option">
                        <input type="radio" id="fixed" name="groupingMethod" value="fixed">
                        <span class="radio-checkmark"></span>
                        固定
                    </label>
                    <label class="radio-option">
                        <input type="radio" id="sequential" name="groupingMethod" value="sequential">
                        <span class="radio-checkmark"></span>
                        依序
                    </label>
                    <label class="radio-option">
                        <input type="radio" id="random" name="groupingMethod" value="random" checked>
                        <span class="radio-checkmark"></span>
                        隨機
                    </label>
                </div>
            </div>
        </div>

        <button id="generateBtn" class="btn">產生分組圖</button>

        <div class="result-section">
            <div class="classroom">
                <div id="groupsContainer" class="groups-container">
                    <!-- 分組結果將在這裡生成 -->
                </div>
            </div>
        </div>
    </div>


    <footer class="footer" align="center">
        <p>By Han © 2025 - 用心打造教學體驗</p>
    </footer>
	
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 獲取DOM元素
            const fileInput = document.getElementById('fileInput');
            const fileName = document.getElementById('fileName');
            const studentList = document.getElementById('studentList');
            const columnsInput = document.getElementById('columns');
            const rowsInput = document.getElementById('rows');
            const totalGroupsSpan = document.getElementById('totalGroups');
            const generateBtn = document.getElementById('generateBtn');
            const groupsContainer = document.getElementById('groupsContainer');

            // 更新總分組數
            function updateTotalGroups() {
                const columns = parseInt(columnsInput.value) || 0;
                const rows = parseInt(rowsInput.value) || 0;
                totalGroupsSpan.textContent = columns * rows;
            }

            // 監聽直排和橫排輸入變化
            columnsInput.addEventListener('input', updateTotalGroups);
            rowsInput.addEventListener('input', updateTotalGroups);

            // 檔案上傳處理
            fileInput.addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (!file) {
                    return;
                }

                fileName.textContent = file.name;

                const reader = new FileReader();
                reader.onload = function (e) {
                    studentList.value = e.target.result;
                };
                reader.readAsText(file);
            });

            // 產生分組
            generateBtn.addEventListener('click', function () {
                const students = studentList.value
                    .split('\n')
                    .map(name => name.trim())
                    .filter(name => name);

                const columns = parseInt(columnsInput.value) || 3;
                const rows = parseInt(rowsInput.value) || 2;
                const totalGroups = columns * rows;

                if (students.length === 0) {
                    alert('請輸入學生名單！');
                    return;
                }

                // 清空分組容器
                groupsContainer.innerHTML = '';

                // 設置分組容器的網格佈局
                groupsContainer.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;

                // 獲取選擇的分組方式
                const groupingMethod = document.querySelector('input[name="groupingMethod"]:checked').value;
                
                // 根據分組方式分配學生
                let groups = [];
                
                if (groupingMethod === 'fixed') {
                    // 固定分組 - 每組固定人數
                    groups = distributeFixedGroups([...students], totalGroups);
                } else if (groupingMethod === 'sequential') {
                    // 依序分組 - 不洗牌，但平均分配
                    groups = distributeStudents([...students], totalGroups);
                } else {
                    // 隨機分組 - 洗牌後平均分配
                    groups = distributeStudents(shuffleArray([...students]), totalGroups);
                }

                // 創建分組元素
                for (let i = 0; i < totalGroups; i++) {
                    const group = document.createElement('div');
                    group.className = 'group';

                    const groupHeader = document.createElement('div');
                    groupHeader.className = 'group-header';
                    groupHeader.textContent = `第 ${i + 1} 組`;

                    const groupMembers = document.createElement('div');
                    groupMembers.className = 'group-members';

                    if (groups[i]) {
                        groups[i].forEach(student => {
                            const memberDiv = document.createElement('div');
                            memberDiv.className = 'group-member';
                            memberDiv.textContent = student;
                            groupMembers.appendChild(memberDiv);
                        });
                    }

                    group.appendChild(groupHeader);
                    group.appendChild(groupMembers);
                    groupsContainer.appendChild(group);
                }
            });

            // 洗牌算法
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            // 將學生依序平均分配到各組
            function distributeStudents(students, totalGroups) {
                const groups = Array(totalGroups).fill().map(() => []);
                let groupIndex = 0;

                for (const student of students) {
                    groups[groupIndex].push(student);
                    groupIndex = (groupIndex + 1) % totalGroups;
                }

                return groups;
            }
            
            // 將學生固定分組（前N個分到第一組，接下來N個分到第二組...）
            function distributeFixedGroups(students, totalGroups) {
                const groups = Array(totalGroups).fill().map(() => []);
                const totalStudents = students.length;
                const baseSize = Math.floor(totalStudents / totalGroups);
                const remainder = totalStudents % totalGroups;
                
                let startIndex = 0;
                
                for (let i = 0; i < totalGroups; i++) {
                    // 計算當前組的大小（如果有餘數，前幾組多分配1人）
                    const groupSize = baseSize + (i < remainder ? 1 : 0);
                    // 計算結束索引
                    const endIndex = startIndex + groupSize;
                    
                    // 分配學生到當前組
                    if (startIndex < totalStudents) {
                        groups[i] = students.slice(startIndex, endIndex);
                    }
                    
                    // 更新下一組的起始索引
                    startIndex = endIndex;
                }
                
                return groups;
            }

            // 初始化
            updateTotalGroups();
        });
    </script>
</body>
</html>
