<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ececec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="手繪逐格動畫網頁：筆刷、圖層、透視前後影格、時間軸、匯出 GIF／影片。支援滑鼠鍵盤、平板與手機觸控。">
<title>FlipDesk 翻翻動畫桌</title>
<style>
:root {
  --stage: #d6d6d6;
  --bar: #ececec;
  --bar-line: #cfcfcf;
  --panel: #f6f6f6;
  --ink: #3a3a3a;
  --muted: #8a8a8a;
  --accent: #f0a20b;
  --accent-ink: #a86a00;
  --accent-soft: #fff1d2;
  --blue: #1a73e8;
  --danger: #d93025;
  --tb-h: 56px;
  --bb-h: 60px;
  --tl-h: 94px;
  --ib: 44px;
  --thumb-h: 54px;
  --radius: 14px;
  --font: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Heiti TC", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--stage); }
body {
  font-family: var(--font); color: var(--ink); font-size: 15px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
input, textarea, select { font: inherit; -webkit-user-select: text; user-select: text; }

.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
.ic .f { fill: currentColor; }
.ic .d { stroke-dasharray: 2.6 2.6; }
i[data-ic] { display: contents; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ---------- icon buttons ---------- */
.ib {
  width: var(--ib); height: var(--ib); border: 0; background: transparent; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
  color: #4a4a4a; flex: none; padding: 0;
}
.ib:hover { background: rgba(0,0,0,.06); }
.ib:active { background: rgba(0,0,0,.1); }
.ib:disabled { color: #b9b9b9; cursor: default; background: transparent; }
.ib.on { color: var(--accent); }
.ib.on.tool { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.ib:focus-visible, .btn:focus-visible, .side-btn:focus-visible, .counter:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
.ib.pop-open { background: rgba(0,0,0,.08); }

/* ---------- top bar ---------- */
#topbar {
  height: calc(var(--tb-h) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
  background: var(--bar); border-bottom: 1px solid var(--bar-line);
  display: flex; align-items: center; gap: 6px; flex: none; z-index: 5;
}
.tb-left { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1 1 auto; }
.tb-tools { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 0 1 auto; min-width: 0; }
.tb-tools::-webkit-scrollbar { display: none; }
.tb-right { display: flex; align-items: center; gap: 6px; flex: none; }
.sep { width: 1px; height: 30px; background: #c8c8c8; margin: 0 6px; }
.proj-name {
  border: 0; background: transparent; font-weight: 700; font-size: 15px; padding: 6px 10px; border-radius: 10px; cursor: pointer;
  max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #555;
}
.proj-name:hover { background: rgba(0,0,0,.06); }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.save-state.err { color: var(--danger); }
.badge { position: absolute; right: 3px; bottom: 5px; font-size: 11px; font-weight: 700; line-height: 1; }
.color-ring {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(#ff4d4d, #ffb84d, #f5e663, #5fd35f, #4dc3ff, #5a6bff, #c45aff, #ff4d4d);
}
.color-dot { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #fff; background: #222; }

/* ---------- stage ---------- */
#stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: var(--stage); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: crosshair; }
body.tool-select #view { cursor: default; }
body.tool-text #view { cursor: text; }
body.panning #view { cursor: grabbing !important; }
body.space #view { cursor: grab; }

#sidebar {
  position: absolute; left: max(10px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%);
  background: #f3f3f3; border-radius: 30px; padding: 12px 6px; box-shadow: 0 2px 10px rgba(0,0,0,.12);
  display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 4; width: 56px;
}
.side-btn {
  width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center;
  cursor: pointer; padding: 0; touch-action: none;
}
.side-btn:hover { background: rgba(0,0,0,.06); }
.side-btn.ib { margin-top: 6px; }
.side-val { font-size: 11px; color: #666; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.size-ring, .alpha-ring {
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid #3a3a3a; display: grid; place-items: center; background: #fff;
}
.size-dot { border-radius: 50%; background: #222; width: 10px; height: 10px; }
.alpha-ring { background: conic-gradient(#ccc 25%, #fff 0 50%, #ccc 0 75%, #fff 0) 0 0 / 10px 10px; overflow: hidden; }
.alpha-dot { width: 100%; height: 100%; border-radius: 50%; }
#sidebar.na-size #btnSize, #sidebar.na-size #sizeVal { opacity: .35; }

.float-bar {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6;
  display: flex; gap: 2px; background: #fff; border-radius: 16px; padding: 4px; box-shadow: 0 3px 14px rgba(0,0,0,.18);
  max-width: calc(100% - 20px); overflow-x: auto; scrollbar-width: none;
}
.float-bar::-webkit-scrollbar { display: none; }
.fb-btn {
  border: 0; background: transparent; border-radius: 12px; min-width: 52px; height: 52px; padding: 4px 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-size: 12px; color: #444; flex: none;
}
.fb-btn:hover { background: #f0f0f0; }
.fb-btn:disabled { color: #bbb; cursor: default; background: transparent; }
.fb-btn.primary { color: #fff; background: var(--accent); }
.fb-btn .ic { width: 22px; height: 22px; }

.view-chip {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 4;
  border: 0; border-radius: 999px; background: rgba(40,40,40,.78); color: #fff; padding: 7px 14px; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.view-chip .ic { width: 18px; height: 18px; }

/* layers */
#layerPanel {
  position: absolute; right: max(8px, env(safe-area-inset-right)); top: 8px; bottom: 8px; width: 132px; z-index: 4;
  background: #f3f3f3; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.16); border: 2px solid #d8d8d8;
  display: flex; flex-direction: column; align-items: stretch; padding: 8px; gap: 8px; overflow: hidden;
}
#layerPanel .lp-list { display: flex; flex-direction: column; gap: 8px; }
#lpList { overflow-y: auto; flex: 0 1 auto; min-height: 0; }
.lp-add {
  align-self: center; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #555; color: #fff; display: grid; place-items: center; cursor: pointer; flex: none;
}
.lp-add:disabled { opacity: .35; }
.lp-sep { height: 2px; background: #d0d0d0; flex: none; }
.litem {
  border-radius: 8px; overflow: hidden; background: #fff; border: 2px solid #e0e0e0; cursor: pointer; position: relative; flex: none;
}
.litem.cur { border-color: var(--accent); }
.lth { background: conic-gradient(#e2e2e2 25%, #fff 0 50%, #e2e2e2 0 75%, #fff 0) 0 0 / 12px 12px; aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; }
.lth canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
.lname { font-size: 12px; padding: 3px 26px 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.litem.cur .lname { background: var(--accent); color: #fff; font-weight: 700; }
.litem.off .lth { opacity: .3; }
.leye {
  position: absolute; right: 2px; bottom: 0; width: 24px; height: 22px; border: 0; background: transparent; padding: 0; display: grid; place-items: center; cursor: pointer; color: inherit;
}
.leye .ic { width: 16px; height: 16px; }

/* ---------- timeline ---------- */
#timeline {
  height: var(--tl-h); flex: none; background: #1d1d1d; display: flex; align-items: center; gap: 8px;
  padding: 0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
}
body.no-timeline #timeline { display: none; }
.tl-actions { display: flex; gap: 4px; flex: none; }
.tl-btn {
  border: 0; background: #333; color: #eee; border-radius: 10px; width: 50px; height: 56px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px;
}
.tl-btn:hover { background: #444; }
.tl-btn .ic { width: 20px; height: 20px; }
.frame-strip {
  flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 8px 4px; align-items: center; height: 100%;
  touch-action: pan-x; scrollbar-width: thin; scrollbar-color: #555 transparent; justify-content: safe center;
}
.ftile {
  flex: none; border-radius: 6px; background: #f3f3f3; border: 3px solid transparent; cursor: pointer; overflow: hidden; position: relative;
  display: flex; flex-direction: column;
}
.ftile.cur { border-color: var(--accent); }
.ftile .fnum { font-size: 11px; text-align: center; background: #d9d9d9; color: #333; line-height: 15px; font-variant-numeric: tabular-nums; }
.ftile.cur .fnum { background: var(--accent); color: #fff; font-weight: 700; }
.ftile canvas { height: var(--thumb-h); width: auto; display: block; background: #fff; }
.ftile.msel { border-color: #4dc3ff; }
.ftile.msel .fnum { background: #4dc3ff; color: #fff; font-weight: 700; }
.ftile.cur.msel { border-color: var(--accent); }
.ftile.cur.msel .fnum { background: var(--accent); }
.ftile.dragging { opacity: .45; }
.tl-btn.on { background: #4dc3ff; color: #fff; }
.tl-btn.multi { background: var(--danger); color: #fff; }
#tlDel { width: auto; min-width: 50px; padding: 0 8px; white-space: nowrap; }
#timeline #tlDel.multi span { display: inline; }
.ftile.drop-before { box-shadow: -6px 0 0 -2px #4dc3ff; }
.ftile.drop-after { box-shadow: 6px 0 0 -2px #4dc3ff; }
.fadd {
  flex: none; height: calc(var(--thumb-h) + 15px + 6px); min-width: 64px; border-radius: 6px; border: 2px solid #666; background: #111; color: #fff;
  font-size: 18px; display: grid; place-items: center; cursor: pointer;
}
.fadd:hover { background: #2a2a2a; }

/* ---------- bottom bar ---------- */
#bottombar {
  min-height: calc(var(--bb-h) + env(safe-area-inset-bottom)); padding: 0 max(10px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(10px, env(safe-area-inset-left));
  background: var(--bar); border-top: 1px solid var(--bar-line); display: flex; align-items: center; justify-content: space-between; gap: 6px; flex: none; z-index: 5;
}
.bb-group { display: flex; align-items: center; gap: 4px; }
.bb-left, .bb-right { flex: 1 1 0; }
.bb-right { justify-content: flex-end; }
.bb-transport { flex: none; }
.counter {
  display: flex; border: 0; background: #f7f7f7; border-radius: 18px; padding: 4px 4px; cursor: pointer; margin: 0 6px; box-shadow: inset 0 0 0 1px #dedede;
}
.cnt-col { display: flex; flex-direction: column; align-items: center; padding: 0 12px; line-height: 1.15; min-width: 62px; }
.cnt-col + .cnt-col { border-left: 1px solid #d5d5d5; }
.cnt-col b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cnt-col small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
#btnTimeline.on, #btnOnion.on, #btnGrid.on, #btnShape.on { color: var(--accent); }
body.playing #btnPlay { color: var(--accent); }

/* ---------- popovers ---------- */
.pop {
  position: fixed; z-index: 60; background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.22);
  padding: 12px; max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px); overflow: auto; color: var(--ink);
  animation: popIn .12s ease-out;
}
@keyframes popIn { from { opacity: 0; transform: scale(.97); } }
.pop h3 { margin: 2px 4px 10px; font-size: 15px; }
.pop .row { display: flex; align-items: center; gap: 10px; margin: 8px 4px; }
.pop .row label { white-space: nowrap; }
.pop .hint { font-size: 12px; color: var(--muted); margin: 6px 4px 2px; line-height: 1.5; }
.menu { display: flex; flex-direction: column; min-width: 220px; padding: 6px; }
.menu button {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; min-height: 44px; border: 0; background: transparent;
  border-radius: 10px; text-align: left; cursor: pointer; font-size: 15px;
}
.menu button:hover { background: #f2f2f2; }
.menu button.danger { color: var(--danger); }
.menu button:disabled { color: #bbb; cursor: default; background: transparent; }
.menu hr { border: 0; border-top: 1px solid #eee; margin: 4px 6px; }
.menu .ic { width: 22px; height: 22px; color: #666; }
.menu button.danger .ic { color: var(--danger); }

.seg { display: flex; background: #f0f0f0; border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button {
  flex: 1 1 auto; border: 0; background: transparent; border-radius: 9px; padding: 8px 10px; min-height: 40px; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); color: var(--accent-ink); font-weight: 700; }
.seg .ic { width: 20px; height: 20px; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; background: transparent; touch-action: none; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: #ddd; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); margin-top: -10px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #ddd; }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
.hue-range::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
.hue-range::-moz-range-track { height: 14px; border-radius: 7px; background: linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
.hue-range::-webkit-slider-thumb { margin-top: -6px; }
.slider-row { display: flex; align-items: center; gap: 10px; margin: 6px 4px; }
.slider-row .val { min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 4px; cursor: pointer; min-height: 36px; }
.switch input { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: #ccc; position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 21px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 4px; }
.chip { border: 0; background: #f0f0f0; border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--accent); color: #fff; font-weight: 700; }

/* color picker */
.cp { width: 268px; max-width: 100%; }
.cp-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cp-cur { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #ddd; flex: none; }
.cp-hex { width: 100%; min-width: 0; border: 1px solid #ddd; border-radius: 10px; padding: 9px 10px; font-family: ui-monospace, Consolas, monospace; }
.cp-sv { width: 100%; height: 150px; border-radius: 10px; display: block; touch-action: none; cursor: crosshair; }
.cp-sw { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 10px; }
.cp-sw button { aspect-ratio: 1; border-radius: 8px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; padding: 0; min-height: 26px; }
.cp-sw button.on { outline: 3px solid var(--accent); outline-offset: 1px; }
.cp-label { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }

.brush-list { display: flex; flex-direction: column; gap: 6px; }
.brush-opt { display: flex; align-items: center; gap: 10px; border: 2px solid transparent; background: #f5f5f5; border-radius: 12px; padding: 6px 10px; cursor: pointer; min-height: 48px; }
.brush-opt.on { border-color: var(--accent); background: var(--accent-soft); }
.brush-opt canvas { width: 120px; height: 34px; flex: none; }
.brush-opt span { font-weight: 700; white-space: nowrap; }

/* ---------- text editor ---------- */
.text-ed { position: absolute; z-index: 7; transform-origin: 0 0; }
.text-ta {
  display: block; border: 0; outline: 1.5px dashed var(--blue); outline-offset: 2px; background: rgba(255,255,255,.35);
  padding: 0; margin: 0; resize: none; overflow: hidden; white-space: pre; min-width: 40px; line-height: 1.25;
}
.text-bar { position: absolute; bottom: 100%; left: -4px; margin-bottom: 10px; display: flex; gap: 6px; }
.text-bar button {
  border: 0; border-radius: 10px; padding: 6px 12px; min-height: 38px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: pointer;
  display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 14px;
}
.text-bar .ok { background: var(--accent); color: #fff; }
.text-bar .ic { width: 18px; height: 18px; }

/* ---------- modal ---------- */
.modal-bg {
  position: fixed; inset: 0; z-index: 80; background: rgba(20,20,20,.45); display: grid; place-items: center; padding: 12px;
  animation: fadeIn .15s;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  background: #fff; border-radius: 20px; max-width: min(560px, 100%); width: 100%; max-height: calc(100dvh - 24px);
  display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden;
}
.modal.wide { max-width: min(860px, 100%); }
.modal h2 { margin: 0; padding: 18px 20px 6px; font-size: 19px; }
.modal-body { padding: 8px 20px 12px; overflow: auto; line-height: 1.6; -webkit-user-select: text; user-select: text; }
.modal-btns { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 16px; flex-wrap: wrap; }
.btn {
  border: 0; border-radius: 12px; padding: 10px 18px; min-height: 44px; background: #eee; cursor: pointer; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { background: #e2e2e2; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: #e09405; }
.btn.danger { background: var(--danger); color: #fff; }
.btn .ic { width: 20px; height: 20px; }
.inp, .sel { width: 100%; border: 1px solid #ccc; border-radius: 10px; padding: 10px 12px; font-size: 16px; background: #fff; }
.form-row { margin: 10px 0; }
.form-row > label { display: block; font-weight: 700; margin-bottom: 6px; }
.progress { height: 12px; border-radius: 6px; background: #eee; overflow: hidden; margin: 12px 0 6px; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.muted { color: var(--muted); font-size: 13px; }

/* help */
.tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid #eee; overflow-x: auto; flex: none; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; cursor: pointer; border-bottom: 3px solid transparent; font-weight: 700; color: #777; white-space: nowrap; min-height: 44px; }
.tabs button.on { color: var(--accent-ink); border-color: var(--accent); }
.gest { display: flex; align-items: center; gap: 18px; padding: 10px 0; border-bottom: 1px dashed #eee; }
.gest:last-child { border-bottom: 0; }
.gest svg { width: 110px; height: 110px; flex: none; }
.gest b { font-size: 16px; }
.gest p { margin: 4px 0 0; color: #666; font-size: 14px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; font-size: 14px; }
.keys kbd, .help kbd { background: #f3f3f3; border: 1px solid #d6d6d6; border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; font-family: inherit; font-size: 13px; white-space: nowrap; }
.help h4 { margin: 14px 0 6px; }
.help ul { margin: 4px 0; padding-left: 22px; }

/* guide overlay */
.guide { position: fixed; inset: 0; z-index: 90; background: rgba(255,255,255,.35); cursor: pointer; }
.guide svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.g-ring { position: absolute; border: 2.5px solid #e5352b; border-radius: 50%; pointer-events: none; }
.g-ring.box { border-radius: 10px; border-style: dashed; }
.g-label {
  position: absolute; background: #fff; border: 2px solid #e5352b; color: #c4261d; font-weight: 700; font-size: 13px; padding: 2px 7px; border-radius: 4px;
  white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.15); pointer-events: none;
}
.g-tip { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; pointer-events: none; white-space: nowrap; }

/* toast */
#toast {
  position: fixed; left: 50%; top: calc(var(--tb-h) + 14px + env(safe-area-inset-top)); transform: translate(-50%, -10px); z-index: 100;
  background: rgba(30,30,30,.88); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; max-width: calc(100vw - 24px); text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- home ---------- */
.screen { position: fixed; inset: 0; z-index: 70; background: #e6e6e6; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.home-inner { max-width: 1100px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.logo { display: flex; align-items: baseline; gap: 10px; }
.logo-mark {
  font: 900 34px/1 "Arial Rounded MT Bold", "Segoe UI", sans-serif; color: #fff; letter-spacing: .5px;
  -webkit-text-stroke: 7px #2d2d2d; paint-order: stroke fill; text-shadow: 3px 4px 0 rgba(0,0,0,.25);
}
.logo-sub { font-weight: 700; color: #555; font-size: 18px; }
.home-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.home-h { font-size: 17px; margin: 22px 2px 10px; color: #444; }
.new-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.new-card {
  border: 0; border-radius: 16px; background: #fff; padding: 14px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08); min-height: 120px; justify-content: center;
}
.new-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.14); }
.new-card .shape { border: 3px solid var(--accent); border-radius: 6px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }
.new-card .shape .ic { width: 22px; height: 22px; }
.new-card b { font-size: 15px; }
.new-card small { color: var(--muted); }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.proj-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); position: relative; cursor: pointer; display: flex; flex-direction: column; }
.proj-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.14); }
.proj-card .pthumb { aspect-ratio: 4 / 3; background: #f4f4f4; display: grid; place-items: center; overflow: hidden; }
.proj-card .pthumb img { max-width: 100%; max-height: 100%; display: block; }
.proj-card .pinfo { padding: 8px 46px 10px 12px; }
.proj-card .pinfo b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-card .pinfo small { color: var(--muted); font-size: 12px; }
.proj-card .pmenu { position: absolute; right: 4px; bottom: 6px; }
.home-note { color: var(--muted); font-size: 13px; margin-top: 22px; }
.empty-note { color: var(--muted); padding: 20px; background: rgba(255,255,255,.6); border-radius: 14px; text-align: center; grid-column: 1 / -1; }

/* io log */
.log-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.log-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #f7f7f7; }
.log-type { flex: none; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; color: #fff; margin-top: 1px; }
.log-type.out { background: #1a73e8; }
.log-type.in { background: #16a34a; }
.log-main { flex: 1 1 auto; min-width: 0; font-size: 14px; }
.log-file { font-size: 13px; color: #555; word-break: break-all; }
.log-detail { font-size: 12px; color: var(--muted); }
.log-time { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 560px) { .log-row { flex-wrap: wrap; } .log-time { width: 100%; padding-left: 44px; } }

/* overview */
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 4px; }
.ov-tile { border: 3px solid transparent; border-radius: 10px; overflow: hidden; background: #fff; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.ov-tile.cur { border-color: var(--accent); }
.ov-tile canvas { width: 100%; height: auto; display: block; }
.ov-tile div { text-align: center; font-size: 13px; padding: 3px; background: #eee; font-variant-numeric: tabular-nums; }
.ov-tile.cur div { background: var(--accent); color: #fff; font-weight: 700; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {

}

  .tb-left, .tb-right { gap: 0; }
  .tb-tools { gap: 0; }

  #bottombar { flex-wrap: wrap; padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); row-gap: 0; }
  .bb-transport { order: 1; flex: 1 1 100%; justify-content: center; }

  #sidebar { width: 48px; padding: 8px 3px; left: 6px; border-radius: 26px; }

  .modal h2 { font-size: 17px; padding: 16px 16px 4px; }
  .modal-body { padding: 6px 16px 10px; }
  .tabs { padding: 0 12px; }
  .logo-mark { font-size: 28px; -webkit-text-stroke-width: 6px; }
  .new-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .proj-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (max-width: 400px) {

@media (hover: none) {

<script>
/* ---- 01_util.js ---- */
'use strict';
/* ===== 共用小工具 ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k in el && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const nextPaint = () => new Promise((r) => requestAnimationFrame(() => r()));
const pad3 = (n) => String(n).padStart(3, '0');

function makeCanvas(w, hh) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(hh));
  return c;
}
function copyCanvas(src) {
  const c = makeCanvas(src.width, src.height);
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}
function canvasToBlob(c, type = 'image/png', q) {
  return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('toBlob failed'))), type, q));
}
function loadImg(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('圖片讀取失敗'));
    im.src = src;
  });
}
async function blobToImg(blob) {
  const u = URL.createObjectURL(blob);
  try { return await loadImg(u); } finally { URL.revokeObjectURL(u); }
}
function readFileText(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); });
}
/* 發布成 claude.ai 網頁時，下載要透過 downloads 功能（會先請使用者確認）；直接開檔案時用一般下載 */
let downloadsCap = null;
function getDownloadsCap() {
  if (!downloadsCap) {
    const c = window.claude;
    downloadsCap = c && typeof c.use === 'function' ? Promise.resolve(c.use('downloads')).catch(() => null) : Promise.resolve(null);
  }
  return downloadsCap;
}
/** 回傳 true＝已交給瀏覽器存檔；false＝使用者取消或無法下載 */
async function downloadBlob(blob, name) {
  const dl = await getDownloadsCap();
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); return true; } catch (e) {
      const code = e && e.code;
      if (code === 'declined') toast('已取消下載');
      else if (code === 'rate_limited') toast('請先完成上一個下載確認視窗');
      else if (code === 'too_large') toast('檔案太大，請改用較小的尺寸再匯出');
      else toast('這裡無法下載檔案' + (e && e.message ? '：' + e.message : ''));
      return false;
    }
  }
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  return true;
}
function safeName(s) { return (s || '動畫').replace(/[\\/:*?"<>|]+/g, '_').trim() || '動畫'; }

function hexToRgb(hex) {
  let m = String(hex).replace('#', '');
  if (m.length === 3) m = m.split('').map((c) => c + c).join('');
  const n = parseInt(m, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let hh = 0;
  if (d) {
    if (mx === r) hh = ((g - b) / d) % 6;
    else if (mx === g) hh = (b - r) / d + 2;
    else hh = (r - g) / d + 4;
    hh *= 60; if (hh < 0) hh += 360;
  }
  return [hh, mx ? d / mx : 0, mx];
}
function hsvToRgb(hh, s, v) {
  const c = v * s, x = c * (1 - Math.abs(((hh / 60) % 2) - 1)), m = v - c;

/* ===== 檔案編碼：GIF（含調色盤量化與 LZW）、ZIP（不壓縮） ===== */

class ByteOut {
  constructor(n = 1 << 16) { this.buf = new Uint8Array(n); this.len = 0; }
  grow(need) {
    if (this.len + need <= this.buf.length) return;
    let n = this.buf.length * 2;
    while (n < this.len + need) n *= 2;
    const b = new Uint8Array(n); b.set(this.buf.subarray(0, this.len)); this.buf = b;
  }
  byte(v) { this.grow(1); this.buf[this.len++] = v & 255; }
  u16(v) { this.byte(v); this.byte(v >> 8); }
  bytes(arr) { this.grow(arr.length); this.buf.set(arr, this.len); this.len += arr.length; }
  str(s) { for (let i = 0; i < s.length; i++) this.byte(s.charCodeAt(i)); }
  result() { return this.buf.slice(0, this.len); }
}

/** 中位切割：從 15-bit 直方圖選出最多 maxColors 個代表色 */
function medianCutPalette(count, sumR, sumG, sumB, maxColors = 256) {
  const bins = [];
  for (let k = 0; k < 32768; k++) if (count[k]) bins.push(k);
  const colorOf = (list) => {
    let n = 0, r = 0, g = 0, b = 0;
    for (const k of list) { n += count[k]; r += sumR[k]; g += sumG[k]; b += sumB[k]; }
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  };
  if (bins.length <= maxColors) return bins.map((k) => colorOf([k]));
  const ch = (k, c) => (c === 0 ? (k >> 10) & 31 : c === 1 ? (k >> 5) & 31 : k & 31);
  const boxInfo = (list) => {
    let best = 0, bestC = 0, total = 0;
    for (let c = 0; c < 3; c++) {
      let mn = 31, mx = 0;
      for (const k of list) { const v = ch(k, c); if (v < mn) mn = v; if (v > mx) mx = v; }
      if (mx - mn > best) { best = mx - mn; bestC = c; }
    }
    for (const k of list) total += count[k];
    return { list, range: best, c: bestC, score: best * Math.sqrt(total) };
  };
  const boxes = [boxInfo(bins)];
  while (boxes.length < maxColors) {
    let bi = -1, bs = 0;
    for (let i = 0; i < boxes.length; i++) if (boxes[i].list.length > 1 && boxes[i].score > bs) { bs = boxes[i].score; bi = i; }
    if (bi < 0) break;
    const box = boxes[bi];
    const c = box.c;
    box.list.sort((a, b) => ch(a, c) - ch(b, c));
    let half = 0, total = 0;
    for (const k of box.list) total += count[k];
    let cut = 1;
    for (let i = 0; i < box.list.length - 1; i++) {
      half += count[box.list[i]];
      if (half >= total / 2) { cut = i + 1; break; }
      cut = i + 1;
    }
    boxes.splice(bi, 1, boxInfo(box.list.slice(0, cut)), boxInfo(box.list.slice(cut)));
  }
  return boxes.map((b) => colorOf(b.list));
}

function lzwEncode(out, indices, minCode) {
  const clear = 1 << minCode, eoi = clear + 1;
  let codeSize = minCode + 1, next = eoi + 1;
  let dict = new Map();
  const sub = new Uint8Array(255); let subLen = 0;
  let acc = 0, nbits = 0;
  const flushByte = (b) => { sub[subLen++] = b; if (subLen === 255) { out.byte(255); out.bytes(sub); subLen = 0; } };
  const emit = (code) => {
    acc |= code << nbits; nbits += codeSize;
    while (nbits >= 8) { flushByte(acc & 255); acc >>>= 8; nbits -= 8; }
  };
  out.byte(minCode);
  emit(clear);
  let prefix = indices[0];
  for (let i = 1; i < indices.length; i++) {
    const k = indices[i];
    const key = (prefix << 8) | k;
    const hit = dict.get(key);
    if (hit !== undefined) { prefix = hit; continue; }
    emit(prefix);
    if (next === 4096) {
      emit(clear);
      dict = new Map(); next = eoi + 1; codeSize = minCode + 1;
    } else {
      if (next >= (1 << codeSize)) codeSize++;
      dict.set(key, next++);
    }
    prefix = k;
  }
  emit(prefix);
  emit(eoi);
  if (nbits > 0) flushByte(acc & 255);
  if (subLen) { out.byte(subLen); out.bytes(sub.subarray(0, subLen)); }
  out.byte(0);
}

/**
 * 產生 GIF。getFrame(i) 需回傳 ImageData（會被呼叫兩輪：先統計顏色、再編碼，避免一次佔用大量記憶體）

async function encodeGIF({ width, height, count, fps, loop, getFrame, onProgress }) {
  const cnt = new Uint32Array(32768), sr = new Float64Array(32768), sg = new Float64Array(32768), sb = new Float64Array(32768);
  for (let f = 0; f < count; f++) {
    const d = (await getFrame(f)).data;
    for (let i = 0; i < d.length; i += 4) {
      const k = ((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3);
      cnt[k]++; sr[k] += d[i]; sg[k] += d[i + 1]; sb[k] += d[i + 2];
    }
    onProgress && onProgress((f + 1) / count * 0.35);
  }
  const pal = medianCutPalette(cnt, sr, sg, sb, 256);
  while (pal.length < 256) pal.push([0, 0, 0]);
  const cache = new Int16Array(32768).fill(-1);
  const nearest = (r, g, b) => {
    let best = 0, bd = Infinity;
    for (let i = 0; i < pal.length; i++) {
      const p = pal[i], dr = p[0] - r, dg = p[1] - g, db = p[2] - b;
      const dd = dr * dr * 3 + dg * dg * 4 + db * db * 2;
      if (dd < bd) { bd = dd; best = i; if (!dd) break; }
    }
    return best;
  };

  const out = new ByteOut(width * height);
  out.str('GIF89a');
  out.u16(width); out.u16(height);
  out.byte(0xf7); out.byte(0); out.byte(0);
  for (const p of pal) { out.byte(p[0]); out.byte(p[1]); out.byte(p[2]); }
  if (loop) {
    out.bytes([0x21, 0xff, 0x0b]); out.str('NETSCAPE2.0'); out.bytes([3, 1, 0, 0, 0]);
  }
  const idx = new Uint8Array(width * height);
  for (let f = 0; f < count; f++) {
    const d = (await getFrame(f)).data;
    for (let i = 0, j = 0; j < idx.length; i += 4, j++) {
      const k = ((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3);
      let c = cache[k];
      if (c < 0) { c = cache[k] = nearest(sr[k] / cnt[k], sg[k] / cnt[k], sb[k] / cnt[k]); }
      idx[j] = c;
    }
    const delay = Math.max(2, Math.round((f + 1) * 100 / fps) - Math.round(f * 100 / fps));
    out.bytes([0x21, 0xf9, 4, 0x04, delay & 255, delay >> 8, 0, 0]);
    out.byte(0x2c); out.u16(0); out.u16(0); out.u16(width); out.u16(height); out.byte(0);
    lzwEncode(out, idx, 8);
    onProgress && onProgress(0.35 + (f + 1) / count * 0.65);
    await sleep(0);
  }
  out.byte(0x3b);
  return out.result();
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();

  return (c ^ 0xffffffff) >>> 0;

  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

/* ---------- 復原／重做 ---------- */
const HIST = { list: [], i: 0, max: 60 };

function histPush(e) {

}

}
function redo() {

function showFrameOf(fid) {

}
function pixEntry(label, fid, lid, r, before, after) {

}

}
function clipRect(r) {
  const x0 = Math.max(0, Math.floor(r.x)), y0 = Math.max(0, Math.floor(r.y));
  const x1 = Math.min(P.w, Math.ceil(r.x + r.w)), y1 = Math.min(P.h, Math.ceil(r.y + r.h));

  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
/** 在一個矩形範圍內修改圖層，並自動記錄復原 */
function editCell(label, fr, lid, rect, fn) {
  const r = clipRect(rect);
  if (!r) return false;
  const x = getCell(fr, lid, true).getContext('2d');
  const before = x.getImageData(r.x, r.y, r.w, r.h);
  x.save(); fn(x); x.restore();
  const after = x.getImageData(r.x, r.y, r.w, r.h);
  histPush(pixEntry(label, fr ? fr.id : null, lid, r, before, after));

/** 一次刪除多格；整批算一個復原步驟 */
function opDeleteFrames(list) {
  finishEdits();
  const idx = [...new Set(list)].filter((i) => i >= 0 && i < P.frames.length).sort((a, b) => a - b);
  if (idx.length <= 1) { opDeleteFrame(idx.length ? idx[0] : S.fi); return; }
  const before = P.frames.slice();
  const drop = new Set(idx.map((i) => before[i]));
  let after = before.filter((f) => !drop.has(f));
  if (!after.length) after = [newFrameObj()];
  const target = Math.min(idx[0], after.length - 1);
  const set = (arr, fi) => { P.frames = arr.slice(); setFrame(fi, true); structChanged(); };
  set(after, target);
  histPush({ label: `刪除 ${idx.length} 格`, undo: () => set(before, idx[0]), redo: () => set(after, target) });
  toast(`已刪除 ${idx.length} 格（按復原可以救回來）`, 1800);
}
function opMoveFrame(from, to) {

/* ---------- 圖層 ---------- */

  finishEdits();

  const L = P.layers[k], B = P.layers[k - 1];
  const before = P.frames.map((f) => [f, f.cells[B.id] || null, f.cells[lid] || null]);
  const merged = before.map(([f, t, s]) => {
    if (!s) return t;

  });

    before.forEach(([f], i) => { if (merged[i]) f.cells[B.id] = merged[i]; else delete f.cells[B.id]; delete f.cells[lid]; });

    S.layerId = B.id;

  finishEdits();

/* ---- 04_view.js ---- */
/* ===== 畫面：視角（平移／縮放／旋轉）與繪製 ===== */

const cv = $('#view');
const vctx = cv.getContext('2d');
let dpr = 1, VW = 0, VH = 0;
const cam = { x: 0, y: 0, s: 1, r: 0 };
let camIsFit = true;
const MIN_S = 0.05, MAX_S = 16;
let renderPending = false;
let antsOffset = 0;

let STK = null;        // 正在畫的一筆 { erase, alpha, lid, fid }
let SEL = null;        // 選取範圍 / 浮動中的圖片
let HOVER = null;      // 滑鼠／觸控筆懸停位置（螢幕座標）
let strokeCv = null, tmpCv = null;
function ensureScratch() {
  if (!strokeCv || strokeCv.width !== P.w || strokeCv.height !== P.h) {
    strokeCv = makeCanvas(P.w, P.h);
    tmpCv = makeCanvas(P.w, P.h);
  }
}

function requestRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => { renderPending = false; render(); });
}

/* ---------- 座標轉換 ---------- */
function toScreen(px, py, c = cam) {
  const dx = px - P.w / 2, dy = py - P.h / 2;
  const co = Math.cos(c.r) * c.s, si = Math.sin(c.r) * c.s;
  return [c.x + co * dx - si * dy, c.y + si * dx + co * dy];
}
function toDoc(sx, sy, c = cam) {
  const dx = sx - c.x, dy = sy - c.y;
  const co = Math.cos(-c.r) / c.s, si = Math.sin(-c.r) / c.s;
  return [co * dx - si * dy + P.w / 2, si * dx + co * dy + P.h / 2];
}
/** 調整位置，讓文件上的點 d 出現在螢幕 (sx, sy) */
function placeDocAt(d, sx, sy) {
  const dx = d[0] - P.w / 2, dy = d[1] - P.h / 2;
  const co = Math.cos(cam.r) * cam.s, si = Math.sin(cam.r) * cam.s;
  cam.x = sx - (co * dx - si * dy);
  cam.y = sy - (si * dx + co * dy);
}
function normAngle(a) { a %= Math.PI * 2; if (a > Math.PI) a -= Math.PI * 2; if (a < -Math.PI) a += Math.PI * 2; return a; }
function zoomAt(sx, sy, f) {
  const d = toDoc(sx, sy);
  cam.s = clamp(cam.s * f, MIN_S, MAX_S);
  placeDocAt(d, sx, sy);
  camIsFit = false;
  requestRender();
}
function rotateAt(sx, sy, da) {
  if (!S.allowRotate) return;
  const d = toDoc(sx, sy);
  let r = normAngle(cam.r + da);
  if (Math.abs(r) < 0.02) r = 0;
  cam.r = r;
  placeDocAt(d, sx, sy);
  camIsFit = false;
  requestRender();
}
function fitView() {
  if (!P || !VW) return;
  const st = cv.getBoundingClientRect();
  const sb = $('#sidebar').getBoundingClientRect();
  const left = Math.max(8, sb.right - st.left + 6);
  let right = 8;
  if (S.showLayers) { const lp = $('#layerPanel').getBoundingClientRect(); if (lp.width) right = st.right - lp.left + 6; }
  const availW = Math.max(60, VW - left - right);
  // 紙張上方有定位尺＋標誌（約 0.25h），下方有定位尺（0.14h）
  const s = Math.min(availW / (P.w * 1.03), (VH - 14) / (P.h * 1.4));
  cam.s = clamp(s, MIN_S, MAX_S);
  cam.r = 0;
  cam.x = left + availW / 2;
  cam.y = VH / 2 + P.h * 0.055 * cam.s;
  camIsFit = true;
  requestRender();
}
function resizeView() {
  const r = cv.getBoundingClientRect();
  const oldW = VW, oldH = VH;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  VW = r.width; VH = r.height;
  cv.width = Math.max(1, Math.round(VW * dpr));
  cv.height = Math.max(1, Math.round(VH * dpr));
  if (!P) return;
  if (camIsFit || !oldW) fitView();
  else { cam.x += (VW - oldW) / 2; cam.y += (VH - oldH) / 2; }
  render();
}

/* ---------- 繪製 ---------- */
function rrect(x, a, b, w, hh, r) {
  x.beginPath();
  x.moveTo(a + r, b); x.lineTo(a + w - r, b); x.quadraticCurveTo(a + w, b, a + w, b + r);
  x.lineTo(a + w, b + hh - r); x.quadraticCurveTo(a + w, b + hh, a + w - r, b + hh);
  x.lineTo(a + r, b + hh); x.quadraticCurveTo(a, b + hh, a, b + hh - r);
  x.lineTo(a, b + r); x.quadraticCurveTo(a, b, a + r, b);
  x.closePath();
}
/** 燈箱桌外觀：圓盤＋上下定位尺 */
function drawLightbox(x) {
  const w = P.w, hh = P.h, cx = w / 2, cy = hh / 2;
  const R = Math.max(w, hh * 1.33) * 0.66;
  const px = 1 / cam.s;
  x.save();
  x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2);
  x.fillStyle = '#e4e4e4'; x.fill();
  x.lineWidth = 2 * px; x.strokeStyle = '#c3c3c3'; x.stroke();
  x.beginPath(); x.arc(cx, cy, R * 0.94, 0, Math.PI * 2);
  x.lineWidth = R * 0.04; x.strokeStyle = '#d4d4d4'; x.stroke();
  const bw = w * 1.13, bx = (w - bw) / 2, bh = hh * 0.14;
  x.fillStyle = '#d2d2d2'; x.strokeStyle = '#bdbdbd'; x.lineWidth = px;
  rrect(x, bx, -bh, bw, bh, 6 * px + 2); x.fill(); x.stroke();
  rrect(x, bx, hh, bw, bh, 6 * px + 2); x.fill(); x.stroke();
  x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(bx, -bh, bw, bh * 0.12);
  // 定位孔
  const py = hh + bh * 0.32, pw = w * 0.07, ph = Math.max(4, bh * 0.16);
  x.fillStyle = '#f7f7f7'; x.strokeStyle = '#b5b5b5';
  for (const fx of [0.22, 0.78]) { rrect(x, w * fx - pw / 2, py - ph / 2, pw, ph, ph / 2); x.fill(); x.stroke(); }

const onionCache = new Map();

  x.clearRect(0, 0, P.w, P.h);

/** 畫出某格的合成結果（縮圖、匯出用） */
function drawComposite(x, fr, scale, opts = {}) {

  for (let gy = g; gy < P.h; gy += g) { x.moveTo(0, gy); x.lineTo(P.w, gy); }

function render() {

/* ---- 05_input.js ---- */
/* ===== 輸入：手勢、滑鼠、觸控筆與各種工具 ===== */

const ptrs = new Map();
let GEST = null;   // 移動畫布的手勢
let ACT = null;    // 正在進行的工具動作
let TXT = null;    // 文字輸入框
let CLIP = null;   // 剪貼簿
let spaceDown = false, ignoreTouches = false, tapInfo = null;
const SNAP_ANGLE = 5 * Math.PI / 180;
const hitCtx = makeCanvas(1, 1).getContext('2d');

function evPos(e, rect) {
  const r = rect || cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function pressureOf(e) {
  if (e.pointerType === 'pen' && S.pressure) return e.pressure > 0 ? e.pressure : 0.5;
  return 1;
}

cv.addEventListener('contextmenu', (e) => e.preventDefault());

cv.addEventListener('pointerdown', (e) => {
  if (!P) return;
  e.preventDefault();
  closePop();
  if (S.playing) stopPlay();
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 有些瀏覽器不支援 */ }
  const [sx, sy] = evPos(e);
  ptrs.set(e.pointerId, { x: sx, y: sy, x0: sx, y0: sy, type: e.pointerType });

  if (e.pointerType === 'pen' && !S.penSeen) {
    S.penSeen = true;
    if (!S.penOnlyAsked) {
      S.penOnly = true; S.penOnlyAsked = true; saveSettings();
      toast('偵測到觸控筆：之後手指只用來移動畫布，手掌碰到也不會亂畫（可在「⋯ → 設定」修改）', 4500);
    }
  }
  if (e.pointerType === 'touch') {
    const touches = [...ptrs.entries()].filter(([, p]) => p.type === 'touch');
    if (touches.length === 1) { tapInfo = { t: performance.now(), max: 1, moved: false }; ignoreTouches = false; }
    else if (tapInfo) tapInfo.max = Math.max(tapInfo.max, touches.length);
    if (touches.length >= 2) {
      abortAction();
      if (!GEST || GEST.type !== 'pinch') startPinch(touches);
      return;
    }
    if (ignoreTouches) return;
    if (S.penOnly && S.penSeen) { startPan(e.pointerId, sx, sy); return; }
  }
  if (e.button === 1 || e.button === 2 || spaceDown) { startPan(e.pointerId, sx, sy); return; }
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (GEST) return;
  startAction(e, sx, sy);
});

cv.addEventListener('pointermove', (e) => {
  if (!P) return;
  const rect = cv.getBoundingClientRect();
  const [sx, sy] = evPos(e, rect);
  const pt = ptrs.get(e.pointerId);
  if (e.pointerType !== 'touch') HOVER = { x: sx, y: sy };
  if (!pt) { if (e.pointerType !== 'touch' && (S.tool === 'brush' || S.tool === 'eraser')) requestRender(); return; }
  pt.x = sx; pt.y = sy;
  if (tapInfo && Math.hypot(sx - pt.x0, sy - pt.y0) > 12) tapInfo.moved = true;
  if (GEST) { updateGesture(); return; }
  if (ACT && ACT.pid === e.pointerId) {
    const list = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    for (const ce of list.length ? list : [e]) {
      const [cx, cy] = evPos(ce, rect);
      const [dx, dy] = toDoc(cx, cy);
      ACT.move({ x: dx, y: dy, pr: pressureOf(ce) }, ce, cx, cy);
    }
  }
});

function onPointerEnd(e) {
  const pt = ptrs.get(e.pointerId);
  if (!pt) return;
  ptrs.delete(e.pointerId);
  if (GEST) {
    if (GEST.ids.includes(e.pointerId)) endGesture();
  } else if (ACT && ACT.pid === e.pointerId) {
    if (e.type === 'pointercancel') abortAction();
    else {
      const [sx, sy] = evPos(e);
      const [dx, dy] = toDoc(sx, sy);
      const a = ACT; ACT = null;
      a.up({ x: dx, y: dy, pr: pressureOf(e) }, e);
    }
  }
  if (e.pointerType === 'touch') {
    const left = [...ptrs.values()].filter((p) => p.type === 'touch').length;
    if (!left) {
      if (tapInfo && !tapInfo.moved && performance.now() - tapInfo.t < 400 && S.twoFingerUndo) {
        if (tapInfo.max === 2) { undo(); toast('復原', 700); }
        else if (tapInfo.max === 3) { redo(); toast('重做', 700); }
      }

    }

}
cv.addEventListener('pointerup', onPointerEnd);
cv.addEventListener('pointercancel', onPointerEnd);
cv.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch' && !ptrs.size) { HOVER = null; requestRender(); } });

cv.addEventListener('wheel', (e) => {
  if (!P) return;
  e.preventDefault();
  const [sx, sy] = evPos(e);
  const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
  if (e.shiftKey && !e.ctrlKey) rotateAt(sx, sy, (dy > 0 ? 1 : -1) * Math.PI / 36);
  else zoomAt(sx, sy, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)));

// iOS Safari：避免整頁被縮放
for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, (e) => e.preventDefault());

/* ---------- 畫布手勢 ---------- */
function startPan(pid, sx, sy) {
  GEST = { type: 'pan', ids: [pid], p0: [sx, sy], cam0: { ...cam } };
  document.body.classList.add('panning');
}
function startPinch(touches) {
  const [a, b] = touches.slice(0, 2).map((t) => t[1]);
  const m0 = [(a.x + b.x) / 2, (a.y + b.y) / 2];
  GEST = {
    type: 'pinch', ids: touches.slice(0, 2).map((t) => t[0]), m0,
    d0: Math.hypot(b.x - a.x, b.y - a.y) || 1, a0: Math.atan2(b.y - a.y, b.x - a.x), cam0: { ...cam },

}

    cam.y = g.cam0.y + (p.y - g.p0[1]);

    const a = ptrs.get(g.ids[0]), b = ptrs.get(g.ids[1]);

      if (Math.abs(r) < SNAP_ANGLE) r = 0;

/* ---------- 工具動作 ---------- */
function startAction(e, sx, sy) {
  const [dx, dy] = toDoc(sx, sy);
  const p = { x: dx, y: dy, pr: pressureOf(e) };
  if (S.picking || (e.altKey && S.tool !== 'select')) { pickColorAt(p); return; }
  if (TXT) { finishText(true); return; }
  let a = null;
  switch (S.tool) {
    case 'brush': case 'eraser': a = strokeAction(e, p); break;
    case 'fill': a = tapAction(() => doFill(p)); break;
    case 'text': a = tapAction(() => openTextEditor(p)); break;
    case 'select': a = selectAction(p, sx, sy); break;

    move(q) { if (!p0) p0 = q; else if (Math.hypot(q.x - p0.x, q.y - p0.y) * cam.s > 14) moved = true; },
    up() { if (!moved) fn(); },

  };
}
function checkLayerUsable() {

  return true;

/* 筆刷印章（鉛筆、噴槍） */
const stampCache = new Map();
function getStamp(type, size, color, variant) {
  const key = `${type}|${Math.round(size * 2) / 2}|${color}|${variant}`;
  let c = stampCache.get(key);
  if (c) return c;
  const D = Math.max(2, Math.ceil(size) + 2), r = size / 2;
  c = makeCanvas(D, D);
  const x = c.getContext('2d');
  const [R, G, B] = hexToRgb(color);
  if (type === 'pencil') {
    const n = Math.max(3, Math.round(D * D * 0.45));
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * r;
      x.fillStyle = `rgba(${R},${G},${B},${(0.25 + Math.random() * 0.6).toFixed(2)})`;
      x.fillRect(D / 2 + Math.cos(a) * d - 0.5, D / 2 + Math.sin(a) * d - 0.5, 1, 1);
    }

    const g = x.createRadialGradient(D / 2, D / 2, 0, D / 2, D / 2, r);
    g.addColorStop(0, `rgba(${R},${G},${B},1)`);
    g.addColorStop(0.5, `rgba(${R},${G},${B},.5)`);
    g.addColorStop(1, `rgba(${R},${G},${B},0)`);
    x.fillStyle = g; x.fillRect(0, 0, D, D);

      const an = Math.round(Math.atan2(y1 - y0, x1 - x0) / step) * step;

    if (constrain) { const m = Math.max(Math.abs(w), Math.abs(hh)); w = (w < 0 ? -1 : 1) * m; hh = (hh < 0 ? -1 : 1) * m; }
    if (fromCenter) { x0 -= w; y0 -= hh; w *= 2; hh *= 2; }
    x1 = x0 + w; y1 = y0 + hh;
    if (shape === 'rect') x.rect(x0, y0, w, hh);

    if (st.lid !== 'bg' && !fr) return;
    const r = clipRect({ x: bb.x0, y: bb.y0, w: bb.x1 - bb.x0, h: bb.y1 - bb.y0 });
    if (!r) { requestRender(); return; }

    up(q) { add(q, true); commit(bb); },

}

/* 填色 */
function composeFrameTo(c) {

  const x0 = Math.floor(p.x), y0 = Math.floor(p.y);
  if (x0 < 0 || y0 < 0 || x0 >= W || y0 >= Hh) return;
  const lid = S.layerId, fr = lid === 'bg' ? null : curFrame();
  let data;
  if (S.fillRef === 'all') data = composeFrameTo(tmpCv).getImageData(0, 0, W, Hh).data;
  else {
    const c = getCell(fr, lid, false);
    data = c ? c.getContext('2d').getImageData(0, 0, W, Hh).data : new Uint8ClampedArray(W * Hh * 4);
  }
  const tol = S.fillTol;

    const j = i * 4;

    x++; i++;
    let up = false, dn = false;
    while (x < W && !mask[i] && match(i)) {
      mask[i] = 1;
      if (y > 0) { const j = i - W; if (!mask[j] && match(j)) { if (!up) { stack.push(x, y - 1); up = true; } } else up = false; }
      if (y < Hh - 1) { const j = i + W; if (!mask[j] && match(j)) { if (!dn) { stack.push(x, y + 1); dn = true; } } else dn = false; }
      x++; i++;
    }
  }
  for (let pass = 0; pass < S.fillGrow; pass++) {
    const m2 = mask.slice();
    for (let y = 0; y < Hh; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (mask[i]) continue;
        if ((x > 0 && mask[i - 1]) || (x < W - 1 && mask[i + 1]) || (y > 0 && mask[i - W]) || (y < Hh - 1 && mask[i + W])) m2[i] = 1;

  }

    for (let x = 0; x < W; x++) if (mask[row + x]) { if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; by1 = y; }
  }

  const tc = makeCanvas(bw, bh), tx = tc.getContext('2d');
  const img = tx.createImageData(bw, bh);

  for (let y = 0; y < bh; y++) {
    for (let x = 0; x < bw; x++) {

      const j = (y * bw + x) * 4;
      img.data[j] = R; img.data[j + 1] = G; img.data[j + 2] = B; img.data[j + 3] = 255;
    }
  }
  tx.putImageData(img, 0, 0);
  editCell('填色', fr, lid, { x: bx0, y: by0, w: bw, h: bh }, (x) => { x.globalAlpha = S.alpha; x.drawImage(tc, bx0, by0); });
}

  const box = h('div', { class: 'text-ed' },

  const fr = t.lid === 'bg' ? null : frameById(t.fid);

  hitCtx.font = textFont(t, t.size);
  const lines = txt.split('\n'), lh = t.size * 1.25;
  let mw = 0;
  for (const l of lines) mw = Math.max(mw, hitCtx.measureText(l).width);
  editCell('文字', fr, t.lid, { x: t.p.x - 4, y: t.p.y - 4, w: mw + t.size * 0.5 + 8, h: lines.length * lh + t.size * 0.4 + 8 }, (x) => {

/* ---------- 選取 ---------- */
function buildSelPath(sel) {
  const path = new Path2D();
  if (sel.mode === 'rect') {
    const x0 = clamp(Math.min(sel.a.x, sel.b.x), 0, P.w), x1 = clamp(Math.max(sel.a.x, sel.b.x), 0, P.w);
    const y0 = clamp(Math.min(sel.a.y, sel.b.y), 0, P.h), y1 = clamp(Math.max(sel.a.y, sel.b.y), 0, P.h);
    path.rect(Math.round(x0), Math.round(y0), Math.round(x1 - x0), Math.round(y1 - y0));
    sel.bbox = clipRect({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 });
  } else {
    const pts = sel.pts;
    path.moveTo(pts[0].x, pts[0].y);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const q of pts) { path.lineTo(q.x, q.y); x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }
    path.closePath();
    sel.bbox = clipRect({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 });
  }

}

  const lx = (co * dx - si * dy) / f.sx, ly = (si * dx + co * dy) / f.sy;

}

  if (Math.hypot(sx - hd.scale[0], sy - hd.scale[1]) < 22) return 'scale';

}
function selectAction(p, sx, sy) {

    const hnd = hitHandle(sx, sy);
    if (hnd === 'scale') {
      const d0 = Math.hypot(p.x - f.cx, p.y - f.cy) || 1, s0x = f.sx, s0y = f.sy;
      return { move(q) { const k = Math.max(0.02, Math.hypot(q.x - f.cx, q.y - f.cy) / d0); f.sx = s0x * k; f.sy = s0y * k; requestRender(); }, up() {}, cancel() {} };

        move(q, ev) {
          let r = r0 + Math.atan2(q.y - f.cy, q.x - f.cx) - a0;
          if ((ev && ev.shiftKey) || S.shapeSnap) r = Math.round(r / (Math.PI / 12)) * (Math.PI / 12);

    if (inFloat(p)) return moveFloatAction(p);
    commitFloat();

    if (!liftSelection()) return null;
    return moveFloatAction(p);
  }
  SEL = null;
  const mode = S.selMode;
  const sel = { mode, a: p, b: p, pts: [p], drawing: true };
  SEL = sel;
  updateSelBar();
  return {
    move(q) {
      if (mode === 'rect') sel.b = q;
      else { const l = sel.pts[sel.pts.length - 1]; if (Math.hypot(q.x - l.x, q.y - l.y) * cam.s > 3) sel.pts.push(q); }

    up(q) {

      sel.path = buildSelPath(sel);
      sel.drawing = false;

/* ---------- 播放 ---------- */
let playRAF = 0, playLast = 0, playAcc = 0;
function togglePlay(dir = 1) {
  if (S.playing) { const same = S.playDir === dir; stopPlay(); if (same) return; }
  startPlay(dir);
}
function startPlay(dir = 1) {

  S.playing = true; S.playDir = dir;
  if (!P.loop) {
    if (dir > 0 && S.fi === P.frames.length - 1) S.fi = 0;
    if (dir < 0 && S.fi === 0) S.fi = P.frames.length - 1;
  }

  document.body.classList.add('playing');
  updatePlayBtns();

}
function playTick(t) {
  if (!S.playing) return;
  playAcc += t - playLast; playLast = t;
  const fd = 1000 / P.fps;
  let moved = false;
  while (playAcc >= fd) {
    playAcc -= fd;
    let n = S.fi + S.playDir;
    if (n >= P.frames.length || n < 0) {
      if (P.loop) n = (n + P.frames.length) % P.frames.length;
      else { stopPlay(); return; }
    }
    S.fi = n; moved = true;
  }
  if (moved) { updateCounter(); highlightTimeline(false); render(); }
  playRAF = requestAnimationFrame(playTick);
}

  if (!S.playing) return;
  S.playing = false;
  cancelAnimationFrame(playRAF);
  document.body.classList.remove('playing');
  updatePlayBtns();
  highlightTimeline(true);
  updateLayerThumbs();
  requestRender();
}

function openPop(anchor, build, opts = {}) {

  closePop();
  if (same && !opts.force) return null;
  const el = h('div', { class: 'pop ' + (opts.cls || ''), role: 'dialog' });
  build(el);
  document.body.append(el);
  POP = { el, anchor, onClose: opts.onClose, key: opts.key };
  anchor && anchor.classList.add('pop-open');

}
function placePop(el, anchor, side) {
  const vw = innerWidth, vh = innerHeight, m = 8;
  const pr = { width: el.offsetWidth, height: el.offsetHeight }; // 不用 getBoundingClientRect：彈出動畫中會被縮小
  if (!anchor) { el.style.left = Math.max(m, (vw - pr.width) / 2) + 'px'; el.style.top = Math.max(m, (vh - pr.height) / 2) + 'px'; return; }
  const a = anchor.getBoundingClientRect();

  if (side === 'below') { x = a.left + a.width / 2 - pr.width / 2; y = a.bottom + 8; }
  else if (side === 'above') { x = a.left + a.width / 2 - pr.width / 2; y = a.top - 8 - pr.height; }
  else if (side === 'right') { x = a.right + 10; y = a.top + a.height / 2 - pr.height / 2; }
  else { x = a.left - 10 - pr.width; y = a.top + a.height / 2 - pr.height / 2; }
  if (side === 'right' && x + pr.width > vw - m) { x = m; y = a.bottom + 8; }
  if (side === 'left' && x < m) { x = vw - pr.width - m; y = a.bottom + 8; }
  x = clamp(x, m, Math.max(m, vw - pr.width - m));
  y = clamp(y, m, Math.max(m, vh - pr.height - m));
  el.style.left = x + 'px'; el.style.top = y + 'px';
}

let multiMode = false;
function selectedFrameIdx() {

function tileClick(i, e) {
  const fr = P.frames[i];
  if (!fr) return;
  const ctrl = !!(e && (e.ctrlKey || e.metaKey)) || multiMode;
  if (e && e.shiftKey) {
    const a = Math.min(fselAnchor, i), b = Math.max(fselAnchor, i);
    if (!ctrl) FSEL.clear();
    for (let k = a; k <= b; k++) FSEL.add(P.frames[k].id);
    setFrame(i, false, true);
  } else if (ctrl) {
    if (!FSEL.size) FSEL.add(curFrame().id);
    if (FSEL.has(fr.id) && FSEL.size > 1) {
      FSEL.delete(fr.id);
      if (i === S.fi) { const rest = selectedFrameIdx(); setFrame(rest[rest.length - 1], false, true); }
      else highlightTimeline(false);
    } else {
      FSEL.add(fr.id);

    clearTimeout(lp);

    if (!tileDrag.active && Math.abs(e.clientX - x0) > 8) { tileDrag.active = true; moved = true; tile.classList.add('dragging'); }
    if (tileDrag.active) {
      const tiles = $$('#frameStrip .ftile');

      let to = tiles.length - 1;
      for (let i = 0; i < tiles.length; i++) { const r = tiles[i].getBoundingClientRect(); if (e.clientX < r.left + r.width / 2) { to = i; break; } }
      const from = tileDrag.from;

      if (e.clientX >= tiles[tiles.length - 1].getBoundingClientRect().left + tiles[tiles.length - 1].getBoundingClientRect().width / 2) { tiles[tiles.length - 1].classList.add('drop-after'); target = tiles.length - 1; }

const dialogStack = [];
function dialog({ title, body, buttons = [{ label: '確定', value: true, primary: true }], cls = '', dismiss = true, enterValue }) {
  return new Promise((res) => {
    closePop();
    const bg = h('div', { class: 'modal-bg' });
    const btns = h('div', { class: 'modal-btns' });
    const box = h('div', { class: 'modal ' + cls, role: 'dialog', 'aria-modal': 'true' }, title ? h('h2', {}, title) : null, h('div', { class: 'modal-body' }, body), btns);
    const close = (v) => {
      if (!bg.isConnected) return;
      bg.remove();
      const k = dialogStack.indexOf(entry); if (k >= 0) dialogStack.splice(k, 1);
      document.removeEventListener('keydown', kd, true);
      res(v);
    };
    const entry = { close };
    for (const b of buttons) {
      btns.append(h('button', { class: 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : ''), onclick: () => close(typeof b.value === 'function' ? b.value() : b.value) }, b.icon ? iconEl(b.icon) : null, b.label));
    }
    if (!buttons.length) btns.remove();
    const kd = (e) => {
      if (dialogStack[dialogStack.length - 1] !== entry) return;
      if (e.key === 'Escape' && dismiss) { e.stopPropagation(); e.preventDefault(); close(null); }
      else if (e.key === 'Enter' && enterValue && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); close(enterValue()); }
    };
    document.addEventListener('keydown', kd, true);
    if (dismiss) bg.addEventListener('pointerdown', (e) => { if (e.target === bg) close(null); });
    bg.append(box);
    $('#modalRoot').append(bg);
    dialogStack.push(entry);
    hydrateIcons(box);
    const f = box.querySelector('input:not([type=checkbox]):not([type=range]), select, textarea');
    if (f) setTimeout(() => { f.focus(); if (f.select) f.select(); }, 40);
    entry.box = box;
  });
}

/* ===== 儲存（IndexedDB）、作品列表、匯出匯入 ===== */

let DB = null, dbOK = true;
function openDB() {
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open('flipdesk', 1); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('data')) d.createObjectStore('data', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
}
function dbReq(store, mode, fn) {
  return new Promise((res, rej) => {
    const tx = DB.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('aborted'));
  });
}
const dbPut = (store, v) => dbReq(store, 'readwrite', (s) => s.put(v));
const dbGet = (store, id) => dbReq(store, 'readonly', (s) => s.get(id));
const dbAll = (store) => dbReq(store, 'readonly', (s) => s.getAll());
const dbDel = (store, id) => dbReq(store, 'readwrite', (s) => s.delete(id));

async function cellBlob(c) {
  if (c._blob) return c._blob;
  const v = c._ver || 0;
  const b = await canvasToBlob(c);
  if ((c._ver || 0) === v) c._blob = b;
  return b;
}
async function serializeProject(p) {
  const frames = [];
  for (const f of p.frames) {
    const cells = {};
    for (const L of p.layers) { const c = f.cells[L.id]; if (c) cells[L.id] = await cellBlob(c); }
    frames.push({ id: f.id, cells });
  }
  return {
    id: p.id, name: p.name, w: p.w, h: p.h, fps: p.fps, loop: p.loop, bg: p.bg, bgVisible: p.bgVisible,
    created: p.created, updated: p.updated,
    layers: p.layers.map(({ id, name, visible, opacity }) => ({ id, name, visible, opacity })),
    bgImage: await cellBlob(p.bgCanvas), frames,
  };
}
/** 從儲存的資料重建專案；src 可以是 Blob 或 dataURL */
async function deserializeProject(rec, onProgress) {
  const w = clamp(Math.round(rec.w) || 800, 16, 4096), hh = clamp(Math.round(rec.h) || 600, 16, 4096);
  const p = {
    id: rec.id || uid(), name: rec.name || '我的動畫', w, h: hh, fps: clamp(Math.round(rec.fps) || 12, 1, 30), loop: rec.loop !== false,
    bg: normHex(rec.bg) || '#ffffff', bgVisible: rec.bgVisible !== false, bgCanvas: makeCanvas(w, hh),
    layers: (rec.layers || []).map((l) => ({ id: String(l.id), name: String(l.name || '圖層'), visible: l.visible !== false, opacity: clamp(+l.opacity || 1, 0, 1) })),
    frames: [], created: rec.created || Date.now(), updated: rec.updated || Date.now(),
  };
  if (!p.layers.length) p.layers.push({ id: uid(), name: '圖層 1', visible: true, opacity: 1 });
  const loadInto = async (c, src) => {
    if (!src) return;
    const img = src instanceof Blob ? await blobToImg(src) : await loadImg(src);
    c.getContext('2d').drawImage(img, 0, 0);
    if (src instanceof Blob) c._blob = src;
  };
  await loadInto(p.bgCanvas, rec.bgImage);
  const ids = new Set(p.layers.map((l) => l.id));
  const list = rec.frames || [];
  for (let i = 0; i < list.length; i++) {
    const fr = newFrameObj();
    fr.id = list[i].id || uid();
    const jobs = [];
    for (const [lid, src] of Object.entries(list[i].cells || {})) {
      if (!ids.has(lid) || !src) continue;
      const c = makeCanvas(w, hh);
      fr.cells[lid] = c;
      jobs.push(loadInto(c, src));
    }
    await Promise.all(jobs);
    p.frames.push(fr);
    onProgress && onProgress((i + 1) / list.length);
  }
  if (!p.frames.length) p.frames.push(newFrameObj());
  return p;
}

let saveTimer = 0, saveChain = Promise.resolve();
function setSaveState(st) {
  const el = $('#saveState');

  el.textContent = { dirty: '', saving: '儲存中…', saved: '已自動儲存', error: '⚠ 無法自動儲存', off: '⚠ 這個瀏覽器不能自動儲存' }[st] || '';
}
function scheduleSave() {

  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1500);
  setSaveState('dirty');
}
function saveNow() {
  clearTimeout(saveTimer);
  saveChain = saveChain.then(doSave, doSave);
  return saveChain;
}
async function doSave() {
  const p = P;
  if (!p || !p._dirty || !dbOK) return;
  p._dirty = false;
  setSaveState('saving');
  try {
    await writeProjectToDB(p);
    if (P === p) setSaveState('saved');
  } catch (err) {
    console.warn('save failed', err);
    p._dirty = true;
    if (P === p) setSaveState('error');
  }
}

/** 把專案（含縮圖）寫進 IndexedDB */
async function writeProjectToDB(p) {
  const rec = await serializeProject(p);
  const tc = makeCanvas(240, Math.round(240 * p.h / p.w));
  const pr = P; P = p;
  try { drawComposite(tc.getContext('2d'), p.frames[0], tc.width / p.w); } finally { P = pr; }
  const meta = { id: p.id, name: p.name, w: p.w, h: p.h, fps: p.fps, frames: p.frames.length, updated: p.updated, created: p.created, thumb: await canvasToBlob(tc, 'image/jpeg', 0.85) };
  await dbPut('data', rec);
  await dbPut('meta', meta);
}

async function exportProjectFile() {
  if (!P) return;
  finishEdits();
  const rec = {
    app: 'flipdesk', version: 1, name: P.name, w: P.w, h: P.h, fps: P.fps, loop: P.loop, bg: P.bg, bgVisible: P.bgVisible,
    layers: P.layers.map(({ id, name, visible, opacity }) => ({ id, name, visible, opacity })),
    bgImage: P.bgCanvas.toDataURL('image/png'),
    frames: P.frames.map((f) => {
      const cells = {};
      for (const L of P.layers) if (f.cells[L.id]) cells[L.id] = f.cells[L.id].toDataURL('image/png');
      return { cells };
    }),
  };
  const fname = safeName(P.name) + '.flipdesk.json';
  const blob = new Blob([JSON.stringify(rec)], { type: 'application/json' });
  if (!(await downloadBlob(blob, fname))) return;
  logIO('匯出', '專案檔', fname, `${P.frames.length} 格．${P.layers.length} 個圖層．${fmtKB(blob.size)}`);
  toast('已下載專案檔，下次可用「開啟專案檔」繼續畫');
}
async function importProjectFile(file) {
  let rec;
  try { rec = JSON.parse(await readFileText(file)); } catch (e) { toast('這不是 FlipDesk 專案檔'); return; }
  if (rec && rec.app === 'flipdesk-backup') { await restoreBackup(rec, file.name); return; }
  if (!rec || rec.app !== 'flipdesk' || !Array.isArray(rec.frames)) { toast('這不是 FlipDesk 專案檔'); return; }
  if (P) { finishEdits(); await saveNow(); }
  const prog = showProgress('開啟專案檔…');
  try {
    const p = await deserializeProject({ ...rec, id: uid(), updated: Date.now() }, (f) => prog.set(f));
    p._dirty = true;
    setProject(p);
    saveNow();
    logIO('匯入', '專案檔', file.name, `${p.frames.length} 格．${p.layers.length} 個圖層`);
    toast(`已開啟「${p.name}」`);
  } catch (e) {
    console.error(e);
    toast('檔案讀取失敗');
  } finally { prog.close(); }
}

async function importImage(file) {

    const img = await blobToImg(file);
    placeImageAsFloat(img);
    logIO('匯入', '圖片', file.name || '剪貼簿圖片', `${img.naturalWidth}×${img.naturalHeight}，放到第 ${S.fi + 1} 格「${layerName(S.layerId)}」`);
  } catch (e) { toast('圖片讀取失敗'); }
}
async function importImageFrames(files) {
  files = [...files].filter((f) => f.type.startsWith('image/')).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  if (!files.length) return;
  finishEdits();
  const lid = S.layerId === 'bg' ? P.layers[0].id : S.layerId;
  const frs = [];
  const prog = files.length > 5 ? showProgress('匯入圖片…') : null;
  try {
    for (let i = 0; i < files.length; i++) {
      const img = await blobToImg(files[i]);
      const fr = newFrameObj();
      const c = getCell(fr, lid, true);
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const k = Math.min(P.w / iw, P.h / ih);
      c.getContext('2d').drawImage(img, (P.w - iw * k) / 2, (P.h - ih * k) / 2, iw * k, ih * k);
      frs.push(fr);
      prog && prog.set((i + 1) / files.length);
    }
  } catch (e) { toast('有圖片讀取失敗'); }
  if (prog) prog.close();
  if (!frs.length) return;
  if (S.layerId === 'bg') S.layerId = lid;
  opInsertFrames(S.fi + 1, frs, '匯入圖片序列');
  logIO('匯入', '圖片序列', files.length > 1 ? `${files[0].name} 等 ${files.length} 個檔案` : files[0].name, `新增 ${frs.length} 個影格`);
  renderLayerPanel();
  toast(`已加入 ${frs.length} 個影格`);
}

function renderFrameCanvas(fr, scale, transparent) {
  const c = makeCanvas(P.w * scale, P.h * scale);

}
async function exportGIF() {

  const prog = showProgress('正在產生 GIF…');

    const c = makeCanvas(W, Hh), x = c.getContext('2d', { willReadFrequently: true });
    const bytes = await encodeGIF({
      width: W, height: Hh, count: P.frames.length, fps: P.fps, loop: o.loop,
      getFrame: async (i) => { drawComposite(x, P.frames[i], W / P.w); return x.getImageData(0, 0, W, Hh); },
      onProgress: (f) => prog.set(f, `處理中 ${Math.round(f * 100)}%`),
    });
    prog.close();

function videoMime() {
  if (typeof MediaRecorder === 'undefined' || !HTMLCanvasElement.prototype.captureStream) return null;
  return ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'].find((t) => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || null;
}
async function exportVideo() {
  finishEdits(); stopPlay();
  const mime = videoMime();
  if (!mime) { toast('這個瀏覽器不支援錄製影片，請改用 GIF'); return; }
  const o = await exportOptionsDialog('匯出影片', { note: '影片會即時錄製，需要等動畫播完。' });
  if (!o) return;
  const W = Math.round(P.w * o.scale / 2) * 2, Hh = Math.round(P.h * o.scale / 2) * 2;
  const c = makeCanvas(W, Hh), x = c.getContext('2d');
  const n = P.frames.length, dur = n / P.fps;
  const loops = P.loop ? Math.max(1, Math.ceil(3 / dur)) : 1;
  const prog = showProgress('正在錄製影片…');
  try {
    drawComposite(x, P.frames[0], W / P.w);
    const stream = c.captureStream(P.fps);
    const track = stream.getVideoTracks()[0];
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6e6 });
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise((r) => { rec.onstop = r; });
    rec.start(200);
    const t0 = performance.now();
    let k = 0;
    for (let l = 0; l < loops; l++) {
      for (let i = 0; i < n; i++) {
        drawComposite(x, P.frames[i], W / P.w);
        if (track.requestFrame) track.requestFrame();
        k++;
        prog.set(k / (n * loops), `錄製中 ${k} / ${n * loops} 格`);
        await sleep(Math.max(0, t0 + (k * 1000) / P.fps - performance.now()));
      }
    }
    rec.stop();
    await stopped;
    track.stop();
    prog.close();
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    const vname = safeName(P.name) + (mime.includes('mp4') ? '.mp4' : '.webm');
    if (!(await downloadBlob(blob, vname))) return;
    logIO('匯出', '影片', vname, `${W}×${Hh}．${P.fps} FPS．${fmtKB(blob.size)}`);
    toast('影片已下載');
  } catch (e) {
    console.error(e); prog.close(); toast('影片錄製失敗：' + e.message);
  }
}

async function exportZip() {
  finishEdits(); stopPlay();
  const o = await exportOptionsDialog('匯出全部影格（PNG，打包成 ZIP）', { transparent: true, note: '解壓縮後可以一次拖進 Scratch 當造型。' });
  if (!o) return;
  const prog = showProgress('正在打包…');
  try {
    const files = [];
    for (let i = 0; i < P.frames.length; i++) {
      const blob = await canvasToBlob(renderFrameCanvas(P.frames[i], o.scale, o.transparent));
      files.push({ name: `${pad3(i + 1)}.png`, data: new Uint8Array(await blob.arrayBuffer()) });
      prog.set((i + 1) / P.frames.length, `第 ${i + 1} / ${P.frames.length} 格`);
    }
    prog.close();
    const zip = makeZip(files);
    if (!(await downloadBlob(zip, safeName(P.name) + '_影格.zip'))) return;
    logIO('匯出', 'ZIP', safeName(P.name) + '_影格.zip', `${files.length} 張 PNG${o.transparent ? '．透明背景' : ''}．${fmtKB(zip.size)}`);
    toast(`已打包 ${files.length} 張圖片`);
  } catch (e) { console.error(e); prog.close(); toast('打包失敗：' + e.message); }
}
async function exportSprite() {
  finishEdits(); stopPlay();
  const o = await exportOptionsDialog('匯出造型表（所有影格排成一張大圖）', { transparent: true });
  if (!o) return;
  const n = P.frames.length, cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
  let sc = o.scale;
  const maxSide = 8192;
  sc = Math.min(sc, maxSide / (cols * P.w), maxSide / (rows * P.h));
  const fw = Math.round(P.w * sc), fh = Math.round(P.h * sc);
  const c = makeCanvas(cols * fw, rows * fh), x = c.getContext('2d');
  P.frames.forEach((fr, i) => x.drawImage(renderFrameCanvas(fr, sc, o.transparent), (i % cols) * fw, Math.floor(i / cols) * fh));
  const sheet = await canvasToBlob(c);
  if (!(await downloadBlob(sheet, `${safeName(P.name)}_造型表_${cols}x${rows}.png`))) return;
  logIO('匯出', '造型表', `${safeName(P.name)}_造型表_${cols}x${rows}.png`, `${n} 格．${cols} 欄 × ${rows} 列．${fmtKB(sheet.size)}`);
  toast(`造型表：${cols} 欄 × ${rows} 列，每格 ${fw}×${fh}`);
}
