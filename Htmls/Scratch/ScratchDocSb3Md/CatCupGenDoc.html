<style>
:root{
  --bg:#FFF5F8; --dot:#F8D7E0; --card:#FFFFFF; --ink:#5D4037; --ink2:#8D6E63;
  --line:#FADADD; --pink:#FF8FAB; --orange:#FFB74D; --mint:#E8F8EE; --cream:#FFFDE7; --sky:#E3F2FD;
  --ok:#2E9E5B; --warn:#E67E22; --chk:#5AA9E6;
  --shadow:0 8px 18px rgba(255,160,185,.28);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#241C27; --dot:#342839; --card:#33283A; --ink:#F6E7EE; --ink2:#CDB6C2;
    --line:#4E3C57; --mint:#233429; --cream:#3A3424; --sky:#26303B; --shadow:0 8px 18px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241C27; --dot:#342839; --card:#33283A; --ink:#F6E7EE; --ink2:#CDB6C2;
  --line:#4E3C57; --mint:#233429; --cream:#3A3424; --sky:#26303B; --shadow:0 8px 18px rgba(0,0,0,.35); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background-color:var(--bg); background-image:radial-gradient(var(--dot) 1.5px, transparent 1.7px); background-size:22px 22px;
  color:var(--ink); font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif; line-height:1.6}
header.top{max-width:1080px; margin:0 auto; padding:22px 16px 6px; display:flex; gap:14px; align-items:center}
.logo{width:54px; height:54px; border-radius:18px; background:var(--pink); display:grid; place-items:center; font-size:28px; box-shadow:var(--shadow); flex:none}
h1{margin:0; font-size:1.5rem}
.sub{margin:0; color:var(--ink2); font-size:.92rem}
main{max-width:1080px; margin:0 auto; padding:8px 16px 60px}
.card{background:var(--card); border:3px solid var(--line); border-radius:22px; padding:18px; margin:14px 0; box-shadow:var(--shadow)}
.card h2{margin:0 0 10px; font-size:1.2rem}
.card h3{margin:14px 0 8px; font-size:1.05rem}
.step{display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--pink); color:#fff; font-weight:800; margin-right:6px}
.groups{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px}
.grp{border:3px solid var(--line); border-radius:18px; padding:14px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; background:var(--bg)}
.grp input{margin-top:6px; accent-color:var(--pink); width:18px; height:18px}
.grp b{display:block; font-size:1.05rem}
.grp span{font-size:.88rem; color:var(--ink2)}
.grp:has(input:checked){border-color:var(--pink); background:var(--cream)}
.drop{border:3px dashed var(--pink); border-radius:20px; padding:26px 16px; text-align:center; cursor:pointer; background:var(--bg); margin-top:12px}
.drop.over{background:var(--cream)}
.drop b{font-size:1.1rem}
.btn{appearance:none; border:none; border-radius:50px; padding:10px 18px; font:inherit; font-weight:800; cursor:pointer; background:var(--pink); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px); box-shadow:none}
.btn.orange{background:var(--orange); color:#4a2c00}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line); box-shadow:none}
.btn.small{padding:6px 12px; font-size:.85rem}
.acts{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.err{color:#D8435B; font-weight:700}
.muted{color:var(--ink2)}
.hint{background:var(--sky); border-radius:14px; padding:10px 14px; font-size:.9rem; margin:10px 0}
.warnbox{background:var(--cream); border-radius:14px; padding:10px 14px; font-size:.9rem; margin:10px 0}
.stats{display:flex; flex-wrap:wrap; gap:8px}
.stat{background:var(--bg); border:2px solid var(--line); border-radius:14px; padding:6px 12px; font-size:.88rem}
.stat b{font-size:1.1rem; margin-right:4px}
ul.checks{list-style:none; padding:0; margin:0}
ul.checks li{display:flex; gap:10px; padding:10px 0; border-top:2px dashed var(--line)}
ul.checks li:first-child{border-top:none}
.badge{flex:none; border-radius:50px; padding:2px 10px; font-size:.8rem; font-weight:800; color:#fff; height:fit-content; white-space:nowrap}
.b-ok{background:var(--ok)} .b-warn{background:var(--warn)} .b-check{background:var(--chk)}
ul.checks p{margin:2px 0 0; font-size:.88rem; color:var(--ink2); white-space:pre-wrap}
.form{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px}
.form label{display:flex; flex-direction:column; font-size:.88rem; font-weight:700; gap:4px}
.form input{font:inherit; border:2px solid var(--line); border-radius:12px; padding:8px 10px; background:var(--bg); color:var(--ink)}
.radios{display:flex; flex-wrap:wrap; gap:6px 14px; font-weight:400}
.radios label{flex-direction:row; align-items:center; font-weight:400; gap:4px}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.tab{border:2px solid var(--line); background:var(--bg); color:var(--ink); border-radius:50px; padding:6px 14px; font:inherit; font-weight:700; cursor:pointer}
.tab[aria-selected="true"]{background:var(--pink); border-color:var(--pink); color:#fff}
pre.code{background:var(--bg); border:2px solid var(--line); border-radius:14px; padding:10px; overflow:auto; max-height:420px; font-size:.82rem; white-space:pre}
.facts h3{border-left:6px solid var(--pink); padding-left:8px}
.facts ul{margin:4px 0; padding-left:22px; font-size:.9rem}
.facts table{border-collapse:collapse; font-size:.86rem; width:100%}
.facts td,.facts th{border:1px solid var(--line); padding:4px 8px; text-align:left; vertical-align:top}
.tablewrap{overflow-x:auto}

/* ---------- 紙本預覽（固定白底黑字，跟正式文件一樣） ---------- */
.paperwrap{overflow-x:auto; padding:6px 0}
.paper{background:#fff; color:#000; width:100%; max-width:800px; margin:0 auto; padding:34px 40px; border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.18);
  font-family:'DFKai-SB','BiauKai','標楷體','Kaiti TC',serif; min-width:640px}
.paper .att{display:inline-block; border:1px solid #000; padding:0 6px; font-size:.85rem}
.paper .ttl{text-align:center; font-weight:700; font-size:1.2rem; margin:4px 0 0}
.paper .ttl2{text-align:center; font-weight:700; font-size:1.2rem; margin:0 0 12px}
.paper .sec{font-weight:700; font-size:1.1rem; margin:14px 0 6px}
.paper table{border-collapse:collapse; width:100%; table-layout:fixed; margin-bottom:14px}
.paper td{border:1px solid #000; padding:6px 7px; vertical-align:top; font-size:.95rem; word-break:break-word}
.paper td.lb{font-weight:700; width:22%}
.paper td.c{text-align:center; vertical-align:middle}
.paper [contenteditable]{outline:none; white-space:pre-wrap; min-height:1.4em; display:block; border-radius:3px}
/* 接在「任務一：」冒號後面的編輯框；空的時候留一段底線，才點得到 */
.paper [contenteditable].inl{display:inline; min-height:0}
.paper [contenteditable].inl:empty{display:inline-block; min-width:8em; border-bottom:1px dotted #999; vertical-align:bottom}
.paper .pair div{margin:2px 0}
.paper [contenteditable]:hover{background:#FFF7D6}
.paper [contenteditable]:focus{background:#FFF1B8}
.paper .fill{color:#000}
.paper .todo{color:#B00020}
.paper .rowctl{display:flex; gap:4px; margin-top:6px}
.paper .rowctl button{font:inherit; font-size:.72rem; border:1px solid #bbb; background:#f6f6f6; border-radius:6px; cursor:pointer; padding:1px 6px; color:#333}
.legend{font-size:.85rem; color:var(--ink2); margin:6px 0 0}
#toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(120px); background:var(--ink); color:var(--card); border-radius:50px; padding:10px 20px; font-weight:700; transition:transform .3s; z-index:20; max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}

@media print{
  @page{size:A4; margin:15mm}
  body{background:#fff}

  body > *:not(main){display:none !important}
  main{padding:0; max-width:none}
  main > *:not(#result){display:none !important}
  #result > *:not(#docCard){display:none !important}
  #docCard{border:none; box-shadow:none; padding:0; margin:0; background:#fff}
  #docCard > *:not(.paperwrap){display:none !important}
  .paper{box-shadow:none; padding:0; max-width:none; min-width:0}

  .paper tr.keep{break-inside:avoid}
}

        const c = {id: bid, op, who: ctx.who, text: typeof condId === 'string' ? renderValue(ctx, condId) : '<（空）>', refs: r, path, script: s,
          thenActs: sub ? acts(ctx, sub) : [], elseActs: sub2 ? acts(ctx, sub2) : [], ctx};
        M.conds.push(c);
        if (sub) visitStack(ctx, sub, path.concat({c, branch: op === 'control_if_else' || op === 'control_if' ? 'then' : 'loop'}), s);
        if (sub2) visitStack(ctx, sub2, path.concat({c, branch: 'else'}), s);
      } else {
        if (sub) visitStack(ctx, sub, path.concat({loop: blockText(ctx, b)}), s);
        if (sub2) visitStack(ctx, sub2, path, s);
      }
    }
  }
  function findRandoms(ctx, b, bid, where) {
    const walk = (val, g = {n: 0}) => {
      if (g.n++ > 200 || typeof val !== 'string') return false;
      const x = ctx.blocks[val];
      if (!x || Array.isArray(x) || x.shadow) return false;
      if (x.opcode === 'operator_random') return true;
      return Object.values(x.inputs || {}).some(inp => Array.isArray(inp) && walk(inp[1], g));
    };
    const has = Object.entries(b.inputs || {}).some(([k, inp]) => Array.isArray(inp) && !k.startsWith('SUBSTACK') && k !== 'CONDITION' && walk(inp[1]));
    if (has) M.randoms.push({text: blockText(ctx, b), op: b.opcode, list: b.fields?.LIST?.[0], variable: b.fields?.VARIABLE?.[0], ...where});
  }
  /* 條件成立後「做了什麼」（含巢狀） */
  function acts(ctx, id, depth = 0, out = []) {
    if (depth > 6) return out;
    for (const bid of chain(ctx, id)) {
      const b = ctx.blocks[bid], op = b.opcode;
      if (op === 'data_setvariableto' || op === 'data_changevariableby') {
        const vIn = b.inputs?.VALUE?.[1];
        const lit = Array.isArray(vIn) ? String(vIn[1]) : (ctx.blocks[vIn]?.shadow ? String(Object.values(ctx.blocks[vIn].fields)[0][0]) : null);
        out.push({k: op === 'data_setvariableto' ? 'set' : 'change', name: b.fields.VARIABLE[0], lit, text: blockText(ctx, b)});
      } else if (op === 'event_broadcast' || op === 'event_broadcastandwait') out.push({k: 'bc', name: bcastName(ctx, b), text: blockText(ctx, b)});
      else if (/^looks_switchbackdropto/.test(op)) out.push({k: 'bd', name: menuVal(ctx, b, 'BACKDROP'), text: blockText(ctx, b)});
      else if (op === 'looks_nextbackdrop') out.push({k: 'bd', name: '下一個背景', text: blockText(ctx, b)});
      else if (op === 'control_stop') out.push({k: 'stop', text: blockText(ctx, b)});
      else if (/^data_(addtolist|deleteoflist|deletealloflist|insertatlist|replaceitemoflist)$/.test(op)) out.push({k: 'list', name: b.fields.LIST[0], text: blockText(ctx, b)});
      else if (/^(looks_|sound_|music_|motion_glide|text2speech_)/.test(op)) out.push({k: 'fx', text: blockText(ctx, b)});
      else if (op === 'procedures_call') out.push({k: 'call', text: blockText(ctx, b)});
      const sub = subOf(b), sub2 = subOf(b, 'SUBSTACK2');
      if (sub) acts(ctx, sub, depth + 1, out);
      if (sub2) acts(ctx, sub2, depth + 1, out);
    }

  }
  for (const s of scripts) visitStack(s.ctx, s.id, [], s);

  /* 變數：直接或間接由 AI 積木算出來的，標成 AI 衍生變數 */
  for (const r of setsRaw) {
    const v = V(r.name);
    if (!v) continue;
    (r.kind === 'set' ? v.sets : v.changes).push(r);
  }
  for (let round = 0; round < 6; round++) {
    let changed = false;
    for (const r of setsRaw) {
      const v = V(r.name);
      if (!v || v.ai) continue;
      if (r.refs.ai || [...r.refs.vars].some(n => V(n)?.ai)) { v.ai = true; changed = true; }
    }
    if (!changed) break;
  }
  const condAI = c => c.refs.ai || [...c.refs.vars].some(n => V(n)?.ai);
  for (const c of M.conds) c.ai = condAI(c);
  for (const s of scripts) if (s.hat.startsWith('videoSensing_') || (isAIext(extOf(s.hat)) && /when/i.test(s.hat))) {
    M.conds.push({id: s.id, op: 'hat', who: s.who, text: blockText(s.ctx, s.ctx.blocks[s.id]), refs: {ai: true, parts: [], vars: new Set(), nums: []}, path: [], script: s,
      thenActs: acts(s.ctx, s.ctx.blocks[s.id].next || null), elseActs: [], ai: true, ctx: s.ctx});
  }
  const inAI = r => r.path.some(p => p.c && p.c.ai);
  M.aiConds = M.conds.filter(c => c.ai);

  /* 動作名稱：在 AI 條件裡被設成「文字」的變數值，例如 動作 設為 左 */
  const actVals = new Map();
  for (const c of M.aiConds) for (const a of c.thenActs) if (a.k === 'set' && a.lit != null && a.lit !== '' && isNaN(Number(a.lit)))
    (actVals.get(a.name) || actVals.set(a.name, new Set()).get(a.name)).add(a.lit);
  let best = null;
  for (const [n, set] of actVals) if (!best || set.size > best[1].size) best = [n, set];
  M.actionVar = best ? best[0] : null;
  /* 「預備」「無」「中間」這類是中立狀態，不算玩家要做的動作 */
  const NEUTRAL = /^(預備|準備|無|沒有|中間|其他|空|none|ready|idle|rest|-)$/i;
  M.actionStates = best ? [...best[1]] : [];
  M.actions = M.actionStates.filter(a => !NEUTRAL.test(a.trim()));
  /* 用到「AI 動作變數」的條件＝動作觸發（例如 手勢 = 舉高 → 廣播 種樹） */
  for (const n of actVals.keys()) { const v = V(n); if (v) v.aiAct = true; }
  for (const c of M.conds) c.trig = !c.ai && [...c.refs.vars].some(n => V(n)?.aiAct);
  M.trigConds = M.conds.filter(c => c.trig);

  /* 防重複：同一個變數同時出現在 AI 條件裡、又在條件成立後被改掉 → 旗標 */
  const flags = new Map();
  for (const c of [...M.aiConds, ...M.trigConds]) {
    for (const n of c.refs.vars) {
      const v = V(n);
      if (!v || v.ai || v.aiAct) continue;
      const hit = [...c.thenActs, ...c.elseActs].filter(a => a.k === 'set' && a.name === n);
      if (hit.length) (flags.get(n) || flags.set(n, []).get(n)).push({cond: c, values: hit.map(h => h.lit ?? h.text)});
    }
  }
  for (const [n, list] of flags) {
    const v = V(n);
    const resets = [];
    for (const r of v.sets) {
      const cs = r.path.filter(p => p.c).map(p => (p.branch === 'else' ? '否則（' : '') + p.c.text + (p.branch === 'else' ? '）' : ''));
      resets.push({value: r.text, where: r.who, cond: cs.length ? cs.join(' 之中的 ') : `「${r.script.text.split('\n')[0]}」一開始`});
    }
    flags.set(n, {name: n, uses: list, sets: resets, named: RE.flag.test(n)});
  }
  for (const v of M.vars.values()) if (RE.flag.test(v.name) && !flags.has(v.name) && v.sets.length)
    flags.set(v.name, {name: v.name, uses: [], sets: v.sets.map(r => ({value: r.text, where: r.who, cond: r.path.filter(p => p.c).map(p => p.c.text).join(' 之中的 ') || '（沒有條件）'})), named: true});
  M.flags = [...flags.values()];
  M.waitUntilAI = M.conds.filter(c => c.op === 'control_wait_until' && c.ai);
  /* 偵測不到：跟空字串比、或判斷人數／手的數量 */
  M.noDetect = M.conds.filter(c => (c.ai || [...c.refs.vars].some(n => V(n)?.ai)) && (/[「\[]\s*[」\]]|\[ \]|人數|count|數量/.test(c.text)));

  /* 分支：成立／不成立時分別換背景、廣播或停止 */
  const sceneActs = list => list.filter(a => a.k === 'bd' || a.k === 'bc' || a.k === 'stop');
  M.branches = M.conds.filter(c => c.op !== 'hat' && (c.op === 'control_if' || c.op === 'control_if_else') && sceneActs(c.thenActs).length &&
    (c.op === 'control_if_else' ? sceneActs(c.elseActs).length : true));
  const outcome = list => sceneActs(list).map(a => a.k === 'bd' ? `背景換成「${a.name}」` : a.k === 'bc' ? `廣播「${a.name}」` : a.text).filter((x, i, arr) => arr.indexOf(x) === i).slice(0, 4).join('、');
  M.outcome = outcome;
  const endish = c => [...c.thenActs, ...c.elseActs].some(a => (a.k === 'bc' || a.k === 'bd') && (RE.win.test(a.name || '') || RE.lose.test(a.name || '')) || (a.k === 'stop' && /全部|all/.test(a.text)));
  M.endConds = M.conds.filter(c => c.op !== 'hat' && endish(c));
  M.levelVar = [...M.vars.values()].find(v => RE.level.test(v.name) && (v.sets.length || v.changes.length)) || null;
  M.scoreVar = [...M.vars.values()].find(v => RE.score.test(v.name) && (v.sets.length || v.changes.length)) || null;
  M.comboVar = [...M.vars.values()].find(v => RE.combo.test(v.name) && (v.sets.length || v.changes.length)) || null;
  M.lifeVar = [...M.vars.values()].find(v => RE.life.test(v.name) && (v.sets.length || v.changes.length)) || null;
  /* 結局變數：在不同條件分支裡被設成不同文字（例如 結局 設為 好／壞／普通），再依它的值帶出不同結果 */
  const pathText = r => r.path.filter(p => p.c).map(p => p.branch === 'else' ? `不符合 ${p.c.text}` : p.c.text).join(' 而且 ');
  const cand = [];
  for (const v of M.vars.values()) {
    if (v.ai || v.aiAct || flags.has(v.name)) continue;
    const lits = v.sets.filter(r => /^「.*」$/.test(r.text) && r.path.some(p => p.c && !p.c.ai && !p.c.trig));
    const vals = [...new Set(lits.map(r => r.text.slice(1, -1)))];
    if (vals.length < 2) continue;
    const items = vals.map(val => {
      const rs = lits.filter(r => r.text === `「${val}」`);
      const oc = M.conds.find(c => c.text.includes(`(${v.name}) = 「${val}」`) && (c.thenActs.some(a => a.k === 'bc' || a.k === 'bd' || a.k === 'fx')));
      return {value: val, when: rs.map(pathText).join('；或 '), who: rs[0].who, oc, outcome: oc ? (outcome(oc.thenActs) || oc.thenActs.filter(a => a.k === 'fx').slice(0, 3).map(a => a.text).join('、')) : ''};
    });
    const score = (/結局|ending|結果|路線|故事|分支/i.test(v.name) ? 10 : 0) + items.filter(i => i.oc).length * 2 + vals.length;
    if (items.some(i => i.oc) || score >= 10) cand.push({name: v.name, items, score});
  }
  cand.sort((a, b) => b.score - a.score);
  M.endings = cand[0] || null;
  M.inAI = inAI;
  M.V = V;
  M.sprites = M.targets.filter(t => !t.isStage);
  M.stats.vars = M.vars.size; M.stats.lists = M.lists.size; M.stats.broadcasts = M.bc.size;
  M.aiExts = M.extensions.filter(isAIext);
  M.partsUsed = [...new Set(M.aiUses.map(u => u.part).filter(Boolean))];
  /* 環境／狀態變數：在 AI 條件成立後被「改變」的數值變數 */
  const envNames = new Set();
  const trigAll = [...M.aiConds, ...M.trigConds];
  for (const c of trigAll) for (const a of c.thenActs) if (a.k === 'change') envNames.add(a.name);
  for (const r of setsRaw) if (r.kind === 'change' && r.path.some(p => p.c && (p.c.ai || p.c.trig))) envNames.add(r.name);
  /* AI 條件成立後常常是「廣播」，由收到訊息的腳本去改變數 → 沿著廣播追三層 */
  const aiScripts = new Set();
  let frontier = trigAll.flatMap(c => c.thenActs.filter(a => a.k === 'bc').map(a => a.name));
  for (let d = 0; d < 3 && frontier.length; d++) {
    const next = [];
    for (const n of frontier) for (const s of (M.bc.get(String(n).toLowerCase())?.receivers || [])) {
      if (aiScripts.has(s)) continue;
      aiScripts.add(s);
      next.push(...acts(s.ctx, s.ctx.blocks[s.id].next || null).filter(a => a.k === 'bc').map(a => a.name));
    }
    frontier = next;
  }
  for (const r of setsRaw) if (r.kind === 'change' && aiScripts.has(r.script)) { envNames.add(r.name); r.viaBc = true; }
  M.aiScripts = aiScripts;
  M.envVars = [...envNames].map(V).filter(Boolean).filter(v => !flags.has(v.name) && !v.ai && !v.aiAct);
  return M;
}

/* ======================================================================
   四、動畫組：用「故事時間軸」推出分鏡

function storyTimeline(M) {
  const byName = Object.fromEntries(M.targets.map(t => [t.name, t]));
  const segs = [];
  const oneBackdrop = M.backdrops.length <= 1;
  let cur = null;
  const newSeg = (scene, label) => { cur = {scene, label, acts: new Map()}; segs.push(cur); };
  const push = (who, text) => { if (!cur) newSeg(M.backdrops[0] || '舞台', null); const a = cur.acts.get(who) || []; if (a.length < 6 && !a.includes(text)) a.push(text); cur.acts.set(who, a); };
  const seen = new Set();
  const skipIds = new Set([...M.branches.map(c => c.id), ...(M.endings ? M.endings.items.filter(i => i.oc).map(i => i.oc.id) : [])]);
  const bdRecv = name => M.targets.flatMap(t => t.scripts.filter(s => s.hat === 'event_whenbackdropswitchesto' && t.ctx.blocks[s.id].fields.BACKDROP[0] === name));
  const describe = (ctx, b) => {
    const op = b.opcode;
    if (/^looks_(say|think)/.test(op)) { const m = renderInput(ctx, b, 'MESSAGE'); return (op.includes('think') ? '想著' : '說') + (m.startsWith('「') ? m : `「${m}」`); }
    if (op === 'text2speech_speakAndWait') return '唸出' + renderInput(ctx, b, 'WORDS');
    if (/^motion_(glide|move|goto|change|set[xy])/.test(op)) return '移動';
    if (op === 'looks_show') return '出現';
    if (op === 'looks_hide') return '隱藏';
    if (op === 'looks_switchcostumeto') { const n = menuVal(ctx, b, 'COSTUME'); return n ? `換成「${n}」造型` : '換造型'; }
    if (op === 'looks_nextcostume') return '換造型（動畫）';
    if (/^sound_play/.test(op)) { const n = menuVal(ctx, b, 'SOUND_MENU'); return n ? `播放「${n}」音效` : '播放音效'; }
    if (/^music_play/.test(op)) return '演奏音樂';
    if (/effect/i.test(op)) return '特效變化';
    if (/size/i.test(op) && op.startsWith('looks_')) return '改變大小';
    if (op === 'control_create_clone_of') return '產生分身';
    if (isAIop(op)) return '偵測觀看者的動作';
    return null;
  };
  function walk(ctx, id, depth, inBranch) {
    if (depth > 5) return;
    for (const bid of chain(ctx, id)) {
      const b = ctx.blocks[bid], op = b.opcode;
      if (/^looks_switchbackdropto/.test(op) || op === 'looks_nextbackdrop') {
        const n = op === 'looks_nextbackdrop' ? '（下一個背景）' : menuVal(ctx, b, 'BACKDROP');
        if (n) { newSeg(n, null); for (const s of bdRecv(n)) if (!seen.has(s.id)) { seen.add(s.id); walk(s.ctx, s.ctx.blocks[s.id].next, depth + 1, inBranch); } }
        continue;
      }
      if (op === 'event_broadcast' || op === 'event_broadcastandwait') {
        const n = bcastName(ctx, b);
        const rec = n != null ? (M.bc.get(String(n).toLowerCase())?.receivers || []) : [];
        const fresh = rec.filter(s => !seen.has(s.id));
        if (fresh.length && oneBackdrop && !inBranch) newSeg(cur ? cur.scene : (M.backdrops[0] || '舞台'), n);
        for (const s of fresh) { seen.add(s.id); walk(s.ctx, s.ctx.blocks[s.id].next, depth + 1, inBranch); }
        continue;
      }
      if (op === 'procedures_call') {
        const pc = b.mutation?.proccode;
        const def = byName[ctx.who]?.scripts.find(s => s.hat === 'procedures_definition' && ctx.blocks[ctx.blocks[s.id].inputs?.custom_block?.[1]]?.mutation?.proccode === pc);
        if (def && !seen.has(def.id)) { seen.add(def.id); walk(ctx, ctx.blocks[def.id].next, depth + 1, inBranch); seen.delete(def.id); }
        continue;
      }
      if ((op === 'control_if' || op === 'control_if_else') && skipIds.has(bid)) continue;  /* 分支另外處理 */
      const d = describe(ctx, b);
      if (d) push(ctx.who, d);
      const sub = subOf(b), sub2 = subOf(b, 'SUBSTACK2');
      if (sub) walk(ctx, sub, depth + 1, inBranch);
      if (sub2) walk(ctx, sub2, depth + 1, inBranch);
    }
  }
  /* 主線：舞台的綠旗先走，再走其他角色的綠旗 */
  const flagScripts = M.targets.flatMap(t => t.scripts.filter(s => s.hat === 'event_whenflagclicked')).sort((a, b) => (b.ctx.isStage - a.ctx.isStage));
  for (const s of flagScripts) { seen.add(s.id); walk(s.ctx, s.ctx.blocks[s.id].next, 0, false); }
  /* 角色太多時，先列有說話、動作較多的角色 */
  const talks = a => a.some(t => /說「|想著|唸出/.test(t));
  const rank = sg => [...sg.acts.entries()].sort((x, y) => (talks(y[1]) - talks(x[1])) || (y[1].length - x[1].length));
  const toShots = list => list.filter(sg => sg.acts.size).map(sg => ({
    scene: sg.scene + (sg.label ? `（${sg.label}）` : ''),
    roles: rank(sg).slice(0, 5).map(e => e[0]).join('、') + (sg.acts.size > 5 ? ` 等 ${sg.acts.size} 個角色` : ''),
    action: rank(sg).slice(0, 5).map(([w, a]) => `${w}：${a.join('、')}`).join('\n')
  }));
  const main = toShots(segs);
  /* 結局：每一種結局各走一次它帶出的程式 */
  const branchTasks = [];
  if (M.endings) for (const it of M.endings.items.slice(0, 4)) {
    segs.length = 0; cur = null;
    newSeg(`${M.endings.name}「${it.value}」`, null);
    const sid = it.oc ? subOf(it.oc.ctx.blocks[it.oc.id]) : null;
    if (sid) walk(it.oc.ctx, sid, 0, true);
    const shots = toShots(segs);
    branchTasks.push({ending: it, shots: shots.length ? shots.slice(0, 4) : [{scene: `${M.endings.name}「${it.value}」`, roles: TODO, action: TODO}]});
  }
  /* 其他分支：成立／不成立各走一次 */
  for (const c of (M.endings ? [] : M.branches).slice(0, 4)) {
    const res = [];
    for (const [k, label] of [['SUBSTACK', '條件成立'], ['SUBSTACK2', '條件不成立']]) {
      const sid = subOf(c.ctx.blocks[c.id], k);
      if (!sid) continue;
      segs.length = 0; cur = null;
      newSeg(label, null);
      walk(c.ctx, sid, 0, true);
      toShots(segs).forEach(sh => { sh.scene = sh.scene.replace(label, '').trim() || label; res.push({...sh, scene: `${label}→${sh.scene === label ? '' : sh.scene}`.replace(/→$/, '')}); });
    }
    if (res.length) branchTasks.push({cond: c, shots: res.slice(0, 6)});
  }
  return {main, branchTasks};
}

/* ======================================================================
   五、產生草稿
   ====================================================================== */
const list = (arr, n = 6) => arr.slice(0, n).join('、') + (arr.length > n ? `…等 ${arr.length} 項` : '');
function aiSummary(M) {
  const lines = [];
  lines.push(M.aiExts.length ? `使用擴充功能：${M.aiExts.map(e => EXT_NAME[e] || e).join('、')}` : '使用擴充功能：沒有偵測到 AI 擴充功能' + TODO);
  if (M.partsUsed.length) lines.push(`偵測部位：${list(M.partsUsed, 8)}`);
  const derived = [...M.vars.values()].filter(v => v.ai);
  if (derived.length) lines.push('由 AI 座標算出的變數：\n' + derived.slice(0, 8).map(v => `・${v.name} ＝ ${v.sets[0]?.text ?? v.changes[0]?.text ?? '（見程式）'}`).join('\n'));
  return lines.join('\n');
}
/* 動作觸發 → 效果：條件成立後做什麼；若是廣播，再看收到訊息的角色做了什麼 */
function trigLines(M, n = 8) {
  const FX = /^(播放音效|演奏|造型換成|背景換成|說出|變數 .* 改變)/;
  return M.trigConds.slice(0, n).map(c => {
    const out = c.thenActs.filter(a => a.k !== 'set' || !M.V(a.name)?.aiAct).slice(0, 4).map(a => {
      if (a.k !== 'bc') return a.text;
      const rec = M.bc.get(String(a.name).toLowerCase())?.receivers || [];
      const fx = rec.flatMap(s => s.text.split('\n').slice(1).map(l => l.trim()).filter(l => FX.test(l)).slice(0, 2).map(l => `${s.who}${l}`));
      return `廣播「${a.name}」` + (fx.length ? `（${[...new Set(fx)].slice(0, 3).join('；')}）` : '');
    });
    return `如果 ${c.text}（${c.who}）→ ${out.join('；') || '（見程式）'}`;
  });

const KEY_NAME = {space: '空白鍵', 'left arrow': '← 鍵', 'right arrow': '→ 鍵', 'up arrow': '↑ 鍵', 'down arrow': '↓ 鍵', any: '任意鍵', enter: 'Enter 鍵'};

function reach(ctx, id) {

    seen.add(cur);
    if (b.next) stack.push(b.next);
    for (const inp of Object.values(b.inputs || {})) if (Array.isArray(inp)) { if (typeof inp[1] === 'string') stack.push(inp[1]); if (typeof inp[2] === 'string') stack.push(inp[2]); }

function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = val;
}

document.addEventListener('click', async e => {

  const a = t.dataset.act, i = Number(t.dataset.i), j = Number(t.dataset.j);

  else if (a === 'delTask') { if (S.doc.tasks.length > 1) { S.doc.tasks.splice(i, 1); render(); } else toast('至少要保留一個任務'); }
  else if (a === 'addPair') { S.doc.pairs.push({task: '', rule: ''}); render(); }
  else if (a === 'delPair') { if (S.doc.pairs.length > 1) { S.doc.pairs.splice(i, 1); render(); } else toast('至少要保留一組'); }

  else if (a === 'print') { window.print(); return; }

  else if (a === 'md') { download(`${safeName(S.basic.title || S.M.title)}_AI分析包.md`, new Blob([aiPack(S)], {type: 'text/markdown;charset=utf-8'})); toast('已下載 AI 分析包'); return; }
  else if (a === 'copymd') {
    try { await navigator.clipboard.writeText(aiPack(S)); toast('已複製，可以貼到 AI 的對話框'); }
    catch { toast('無法複製，請改用「下載 AI 分析包」'); }
    return;
  }
  scrollTo(0, y);
});

/* ---------- 讀檔 ---------- */
async function loadFile(file) {
  const errEl = $('#loadErr');
  errEl.hidden = true;
  try {
    let proj;
    if (/\.json$/i.test(file.name)) proj = JSON.parse(await file.text());
    else {
      if (typeof JSZip === 'undefined') throw new Error('解壓縮元件載入失敗，請重新整理頁面後再試。');
      let zip;
      try { zip = await JSZip.loadAsync(file); } catch { throw new Error('無法開啟，可能不是 .sb3 檔，或檔案已損壞。'); }
      const pj = zip.file('project.json');
      if (!pj) throw new Error('.sb3 裡面找不到 project.json。');
      proj = JSON.parse(await pj.async('string'));
    }
    S.M = analyze(proj, file.name);
    S.basic.title = S.M.title;
    S.tab = 'doc';
    regenerate();
    $('#result').scrollIntoView({behavior: 'smooth'});
  } catch (err) {
    console.error(err);
    errEl.textContent = `無法分析「${file.name}」：${err.message}`;
    errEl.hidden = false;
  }
}
const drop = $('#drop'), fileIn = $('#fileIn');
drop.addEventListener('click', () => fileIn.click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } });
fileIn.addEventListener('change', () => { if (fileIn.files[0]) loadFile(fileIn.files[0]); fileIn.value = ''; });
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer?.files?.[0]; if (f) loadFile(f); });

/* 給自動測試用 */
window.__gen = {S, analyze, aiPack, makeDocx, buildDocxXML, regenerate, render};
})();
</script>
</body>
