<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子崩解賽車小遊戲 🌀⚡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030307; /* 虛無黑 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        h1 {
            color: #ff00ff; /* 魅惑紫紅 */
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
            margin-bottom: 5px;
            font-size: 32px;
            animation: glitch 0.1s infinite alternate; 
        }

        @keyframes glitch {
            0% { transform: translate(2px, -2px) skewX(-5deg); filter: hue-rotate(0deg); }
            100% { transform: translate(-2px, 2px) skewX(5deg); filter: hue-rotate(180deg); }
        }

        p {
            margin-top: 0;
            font-size: 16px;
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
        }

        .game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.6);
            border-radius: 10px;
            overflow: hidden;
            border: 5px solid #ff00ff;
        }

        canvas {
            display: block;
            background-color: #090a10; 
        }

        #restartBtn {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 35px;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            background-color: #00ffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 20px #00ffff;
        }

        #restartBtn:hover {
            background-color: #fff;
            box-shadow: 0 0 30px #fff;
        }
    </style>
</head>
<body>

    <h1>🌀 維度崩解：神經反射極限 🌀</h1>
    <p>🌌 當前狀態：肉眼已無法捕捉，請用靈魂去感知 🌌</p>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <button id="restartBtn" onclick="resetGame()">重組肉身（重新開始）</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const restartBtn = document.getElementById("restartBtn");

        let isGameOver = false;
        let score = 0;
        let speedMultiplier = 1;
        let frames = 0;

        // 玩家車輛設定 (速度 40！按一下直接瞬移半個賽道)
        const player = {
            width: 40,
            height: 70,
            x: canvas.width / 2 - 20,
            y: canvas.height - 100,
            speed: 40, 
            dx: 0,
            color: "#00ffff" 
        };

        let enemies = [];
        let lines = [];
        for (let i = 0; i < canvas.height; i += 60) {
            lines.push(i);
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") {
                player.dx = -player.speed;
            } else if (e.key === "ArrowRight" || e.key === "d") {
                player.dx = player.speed;
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "a" || e.key === "d") {
                player.dx = 0;
            }
        });

        function drawCar(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            
            // 讓擋風玻璃有動態閃爍感
            ctx.fillStyle = Math.random() > 0.5 ? "#fff" : "#ff00ff";
            ctx.fillRect(x + 5, y + 15, width - 10, 15);
            ctx.fillRect(x + 5, y + height - 20, width - 10, 10);

            ctx.fillStyle = "#000";
            ctx.fillRect(x - 3, y + 10, 3, 15);
            ctx.fillRect(x + width, y + 10, 3, 15);
        }

        function drawRoad() {
            ctx.fillStyle = "#ff00ff"; 
            for (let i = 0; i < lines.length; i++) {
                ctx.fillRect(canvas.width / 2 - 5, lines[i], 10, 30);
                if (!isGameOver) {
                    lines[i] += 60 * speedMultiplier; // 背景狂飆速度達到震撼的 60！
                }
                if (lines[i] > canvas.height) {
                    lines[i] = -30;
                }
            }
        }

        function spawnEnemy() {
            let enemyWidth = 40;
            let enemyHeight = 70;
            let xPos = Math.random() * (canvas.width - enemyWidth);
            let colors = ["#ff0055", "#00ffcc", "#ffff00", "#70a1ff"];
            let randomColor = colors[Math.floor(Math.random() * colors.length)];

            enemies.push({
                x: xPos,
                y: -enemyHeight,
                width: enemyWidth,
                height: enemyHeight,
                // 敵車速度驚人 (40 ~ 65)
                speed: (Math.random() * 25 + 40) * speedMultiplier, 
                color: randomColor
            });
        }

        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function update() {
            if (isGameOver) return;

            player.x += player.dx;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            for (let i = 0; i < enemies.length; i++) {
                enemies[i].y += enemies[i].speed;

                if (checkCollision(player, enemies[i])) {
                    isGameOver = true;
                    restartBtn.style.display = "block";
                }

                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    i--;
                    score++;
                    
                    // 沒人能撐到加分，但如果撐到了，每 10 分增幅暴拉 0.6！
                    if (score % 10 === 0) {
                        speedMultiplier += 0.6; 
                    }
                }
            }

            frames++;
            // 極高頻率出車
            let spawnRate = Math.max(4, 15 - Math.floor(speedMultiplier * 3));
            if (frames % spawnRate === 0) {
                spawnEnemy();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#090a10";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawRoad();

            drawCar(player.x, player.y, player.width, player.height, player.color);

            for (let i = 0; i < enemies.length; i++) {
                drawCar(enemies[i].x, enemies[i].y, enemies[i].width, enemies[i].height, enemies[i].color);
            }

            // 儀表板改用曲速等級 (Warp Factor)
            ctx.fillStyle = "#fff";
            ctx.font = "bold 22px 'Comic Sans MS', sans-serif";
            ctx.fillText("SCORE: " + score, 15, 35);
            ctx.fillStyle = "#ff00ff";
            ctx.fillText("WARP FACTOR: " + (9.9 * speedMultiplier).toFixed(2), 15, 65);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.95)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffff";
                ctx.font = "bold 40px 'Microsoft JhengHei', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("💥 粒子態蒸發！ 💥", canvas.width / 2, canvas.height / 2 - 50);
                ctx.fillStyle = "#ff00ff";
                ctx.font = "24px 'Microsoft JhengHei', sans-serif";
                ctx.fillText("你成功在二維空間撐了 " + score + " 個微秒", canvas.width / 2, canvas.height / 2 + 10);
                ctx.textAlign = "left"; 
            }
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            speedMultiplier = 1;
            frames = 0;
            enemies = [];
            player.x = canvas.width / 2 - 20;
            restartBtn.style.display = "none";
            gameLoop();
        }

        gameLoop();
    </script>
</body>
</html>
