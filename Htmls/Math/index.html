<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數學出題小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&family=Iansui&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#FF8FAB;--pink2:#FADADD;--pinkbg:#FFF0F5;--mint:#F0FFF4;--cream:#FFFDE7;--sky:#E3F2FD;
  --txt:#5D4037;--txt2:#8D6E63;--orange:#FFB74D;--teal:#4DB6AC;
  --shadow:0 6px 14px rgba(255,182,193,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'M PLUS Rounded 1c','Noto Sans TC',sans-serif;color:var(--txt);background:var(--pinkbg);display:flex;flex-direction:column;overflow:hidden;line-height:1.6}
button{font-family:inherit}
.hidden{display:none!important}

/* ---------- App bar ---------- */
#appbar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:linear-gradient(90deg,#FFE4EC,#FFF6E0 55%,#E3F2FD);border-bottom:3px solid #fff;flex-wrap:wrap}
.logo{font-weight:700;font-size:19px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.logo .mascot{display:inline-flex;width:30px;height:30px;border-radius:10px;background:var(--pink);color:#fff;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 8px rgba(255,143,171,.5);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#docname{border:3px solid var(--pink2);border-radius:50px;padding:3px 14px;font:inherit;font-size:14px;color:var(--txt);background:#fff;width:210px;max-width:40vw}
#saveState{font-size:12px;color:var(--txt2)}
#tabs{display:flex;gap:5px;flex-wrap:wrap;margin-left:6px}
.tab{border:none;background:rgba(255,255,255,.7);color:var(--txt);border-radius:50px;padding:5px 13px;font-size:14px;cursor:pointer;transition:transform .2s,background .2s}
.tab:hover{transform:scale(1.05);background:#fff}
.tab.on{background:var(--pink);color:#fff;box-shadow:0 4px 10px rgba(255,143,171,.45)}
.appbar-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{border:none;border-radius:50px;padding:5px 14px;font-size:13px;cursor:pointer;background:#fff;color:var(--txt);box-shadow:0 3px 8px rgba(255,182,193,.35);transition:transform .2s}
.pill:hover{transform:scale(1.06)}
.pill.primary{background:var(--pink);color:#fff}
.pill.orange{background:var(--orange);color:#fff}
.pill.on{background:#E53935;color:#fff}

/* ---------- Ribbon ---------- */
#ribbon{background:#fff;border-bottom:3px solid var(--pink2);padding:6px 10px;display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;gap:6px;box-shadow:var(--shadow);position:relative;z-index:5;align-items:stretch}
.grp{display:flex;flex-direction:column;flex:none;background:#FFF8FB;border:2px solid var(--pink2);border-radius:16px;padding:4px 6px 1px}
.grp-items{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);gap:3px;align-items:center;justify-items:start;flex:1}
.grp-label{font-size:10.5px;color:var(--txt2);text-align:center;line-height:1.4}
.tb{display:inline-flex;align-items:center;gap:3px;border:2px solid transparent;background:#fff;border-radius:12px;padding:2px 7px;font-size:13px;color:var(--txt);cursor:pointer;min-height:30px;transition:transform .15s,background .15s;white-space:nowrap;line-height:1.2}
.tb:hover{background:#FFE4EC;transform:scale(1.05)}
.tb.on{background:var(--pink);color:#fff}
.tb.sym{min-width:30px;justify-content:center;font-family:'Noto Sans TC',sans-serif;font-size:16px;padding:2px 5px}
.tb .ic{font-size:15px}
.tb .caret{font-size:10px;opacity:.7}
.tb b.fmt{font-family:serif;font-size:15px}
select.ts{border:2px solid var(--pink2);border-radius:12px;padding:2px 4px;font:inherit;font-size:13px;color:var(--txt);background:#fff;height:30px;max-width:130px}
.colorbtn{position:relative;display:inline-flex;align-items:center;gap:2px;border-radius:12px;background:#fff;padding:0 4px;height:30px;border:2px solid transparent;cursor:pointer}
.colorbtn:hover{background:#FFE4EC}
.colorbtn input{width:26px;height:22px;border:none;padding:0;background:none;cursor:pointer}

/* ---------- Menu ---------- */
#menu{position:fixed;z-index:60;background:#fff;border:3px solid var(--pink2);border-radius:16px;padding:6px;box-shadow:0 10px 24px rgba(255,143,171,.35);max-height:70vh;overflow:auto;min-width:160px}
#menu .mi{display:block;width:100%;text-align:left;border:none;background:none;padding:6px 12px;border-radius:10px;font-size:14px;color:var(--txt);cursor:pointer;white-space:nowrap}
#menu .mi:hover{background:#FFE4EC}
#menu .msep{height:2px;background:var(--pink2);margin:4px 6px;border-radius:2px}
#menu .mh{font-size:11px;color:var(--txt2);padding:2px 10px}
#menu.grid{display:grid;grid-template-columns:repeat(6,auto);gap:2px;min-width:0}
#menu.grid .mi{text-align:center;font-family:'Noto Sans TC',sans-serif;font-size:17px;padding:5px 8px}
#menu.grid .mh,#menu.grid .msep{grid-column:1/-1}

/* ---------- Main ---------- */
#main{flex:1;display:flex;min-height:0}
#workspace{flex:1;overflow:auto;background-color:#FDF3F7;background-image:radial-gradient(#F8C8D8 1px,transparent 1px);background-size:18px 18px;padding:20px 24px 60px;position:relative}
#pages{zoom:var(--zoom,1);display:flex;flex-direction:column;align-items:center;width:max-content;margin:0 auto}
.page-wrap{margin-bottom:22px}
.page-bar{display:flex;align-items:center;gap:5px;margin:0 0 6px;font-size:13px}
.page-bar b{background:#fff;border-radius:50px;padding:1px 12px;border:2px solid var(--pink2);font-weight:700}
.pb{border:none;background:#fff;border-radius:50px;padding:2px 10px;cursor:pointer;font-size:12px;color:var(--txt);transition:transform .15s}
.pb:hover{background:var(--pink);color:#fff;transform:scale(1.05)}
.addpage{border:3px dashed var(--pink);background:rgba(255,255,255,.7);color:var(--txt);border-radius:24px;padding:10px 30px;font-size:15px;cursor:pointer;margin-bottom:30px;transition:transform .2s}
.addpage:hover{transform:scale(1.05);background:#fff}
#statusbar{display:flex;gap:14px;align-items:center;padding:3px 14px;background:#fff;border-top:3px solid var(--pink2);font-size:12px;flex-wrap:wrap}
#statusbar .sp{margin-left:auto;display:flex;align-items:center;gap:6px}
#statusbar input[type=range]{accent-color:var(--pink);width:120px}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:#fff;padding:8px 20px;border-radius:50px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:100}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#wbar[hidden],#menu[hidden]{display:none!important}
/* ---------- Widget floating bar ---------- */
#wbar{position:fixed;z-index:40;display:flex;gap:3px;background:#fff;border:2px solid var(--pink);border-radius:50px;padding:3px;box-shadow:0 6px 14px rgba(255,143,171,.4)}
#wbar button{border:none;background:#FFF0F5;border-radius:50px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--txt)}
#wbar button:hover{background:var(--pink);color:#fff}
#wbar .wname{font-size:12px;padding:3px 8px;color:var(--txt2)}

/* ---------- Dialog ---------- */
.mask{position:fixed;inset:0;background:rgba(93,64,55,.35);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:24px;border:3px solid var(--pink2);box-shadow:0 16px 40px rgba(255,143,171,.4);width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.dlg-h{display:flex;align-items:center;padding:10px 18px;background:linear-gradient(90deg,#FFE4EC,#FFF6E0);font-weight:700;font-size:16px}
.dlg-h .x{margin-left:auto;border:none;background:#fff;border-radius:50%;width:30px;height:30px;cursor:pointer;color:var(--txt)}
.dlg-body{display:flex;gap:14px;padding:14px 18px;overflow:auto;flex-wrap:wrap}
#dlgForm{flex:1 1 300px;display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-content:start}
#dlgForm label.fl{font-size:13px;padding-top:5px;white-space:nowrap}
#dlgForm input[type=text],#dlgForm input[type=number],#dlgForm select,#dlgForm textarea{width:100%;border:2px solid var(--pink2);border-radius:12px;padding:5px 9px;font:inherit;font-size:14px;color:var(--txt);background:#FFFDFE}
#dlgForm textarea{min-height:76px;resize:vertical;font-family:'Noto Sans TC',monospace}
#dlgForm input:focus,#dlgForm select:focus,#dlgForm textarea:focus{outline:none;border-color:var(--pink)}
#dlgForm .fh{grid-column:1/-1;font-size:12px;color:var(--txt2);background:var(--cream);border-radius:12px;padding:6px 10px}
#dlgForm .chk{display:flex;align-items:center;gap:6px;font-size:14px}
#dlgForm .chk input{accent-color:var(--pink);width:17px;height:17px}
.dlg-prev-wrap{flex:1 1 320px;display:flex;flex-direction:column;min-width:0}
.prev-h{font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.prev-h label{display:flex;gap:4px;align-items:center}
#dlgPrev{border:3px dashed var(--pink2);border-radius:16px;padding:14px;background:#fff;color:#222;min-height:140px;overflow:auto;max-height:52vh}
.dlg-f{display:flex;gap:8px;align-items:center;padding:10px 18px;border-top:2px solid var(--pink2)}
.dlg-f .hint{font-size:12px;color:var(--txt2);margin-right:auto}
.btn{border:none;border-radius:50px;padding:7px 22px;font-size:14px;cursor:pointer;background:#F3E5E9;color:var(--txt);transition:transform .2s}
.btn:hover{transform:scale(1.05)}
.btn.primary{background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(255,143,171,.4)}
.dlg.nopreview .dlg-prev-wrap{display:none}
.dlg.small{width:min(460px,100%)}

/* ---------- Template gallery ---------- */
#gallery .gal{width:min(1180px,100%);height:min(88vh,900px);background:#fff;border-radius:30px;border:3px solid var(--pink2);box-shadow:0 16px 40px rgba(255,143,171,.4);display:flex;flex-direction:column;overflow:hidden}
.gal-h{display:flex;align-items:center;gap:10px;padding:14px 22px 6px}
.gal-h h2{margin:0;font-size:20px}
.gal-h small{color:var(--txt2)}
.gal-h .x{margin-left:auto;border:none;background:#FFF0F5;border-radius:50%;width:34px;height:34px;cursor:pointer;color:var(--txt);font-size:16px}
.gal-cats{display:flex;gap:6px;flex-wrap:wrap;padding:6px 22px 10px}
.gal-cats button{border:none;border-radius:50px;padding:5px 14px;background:#F6EEF1;color:var(--txt);cursor:pointer;font-size:14px;transition:transform .2s}
.gal-cats button:hover{transform:scale(1.05)}
.gal-cats button.on{background:var(--pink);color:#fff}
.gal-grid{flex:1;overflow:auto;padding:4px 22px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;align-content:start}
.gcard{background:#FFF3F7;border-radius:24px;padding:12px 12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .2s,box-shadow .2s;border:3px solid transparent;position:relative}
.gcard:hover{transform:scale(1.03);box-shadow:0 8px 16px rgba(255,182,193,.45);border-color:var(--pink2)}
.gthumb{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.gthumb .tscale{position:absolute;left:50%;top:50%;transform-origin:center center;pointer-events:none}
.gthumb .page{box-shadow:0 4px 12px rgba(0,0,0,.12)}
.gcard .gname{font-size:14px;margin-top:6px;text-align:center;line-height:1.35;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .gdesc{font-size:11px;color:var(--txt2);text-align:center;line-height:1.3;min-height:1.3em}
.gcard.blank .gthumb{border:3px dashed var(--pink);border-radius:16px;background:#fff;font-size:48px;color:var(--pink)}
.gcard .gdel{position:absolute;right:8px;top:8px;border:none;background:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer;z-index:2}
.gal-empty{grid-column:1/-1;text-align:center;color:var(--txt2);padding:40px}

/* ================= PAPER ================= */
.page{width:210mm;height:297mm;background:#fff;color:#222;position:relative;display:flex;flex-direction:column;box-shadow:0 10px 24px rgba(255,143,171,.3);overflow:hidden;font-family:var(--pf);font-size:var(--pfs);line-height:var(--plh);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page.land{width:297mm;height:210mm}
.page-body{flex:1;min-height:0;display:flex;flex-direction:column}
.page-body>.node{flex:1 1 0}
.node{flex:1 1 0;min-width:0;min-height:0;position:relative}
.split{display:flex}
.split.h{flex-direction:row}
.split.v{flex-direction:column}
.split.h>.divider+.node{margin-left:-1px}
.split.v>.divider+.node{margin-top:-1px}
.cell{display:flex;flex-direction:column;overflow:hidden}
.cell.b-solid{border:1px solid #333}
.cell.b-dashed{border:1px dashed #555}
.cell.b-dotted{border:1.2px dotted #555}
.cell.b-thick{border:2px solid #222}
.cell.b-round{border:1.5px solid #333;border-radius:4mm}
.cell.b-bottom{border-bottom:1px solid #333}
.cell.b-right{border-right:1px solid #333}
.cell.va-middle{justify-content:center}
.cell.va-bottom{justify-content:flex-end}
.cell.al-center .cc{text-align:center}
.cc{outline:none;min-height:1.4em;word-break:break-word}
.cc:empty::before{content:'✎ 點此輸入';color:#e9b5c5;font-size:10pt}
.guides .cell.b-none,.guides .cell.b-bottom,.guides .cell.b-right{outline:1px dashed #F4B6C8;outline-offset:-1px}
.cell.active{box-shadow:inset 0 0 0 2px rgba(255,143,171,.7)}
.cell.over::after{content:'⚠ 內容超出此區';position:absolute;right:3px;bottom:3px;background:#FF8FAB;color:#fff;font-size:10px;padding:0 6px;border-radius:8px;font-family:sans-serif;line-height:1.6}
.divider{position:relative;flex:0 0 0;z-index:3}
.divider::before{content:'';position:absolute;top:0;bottom:0;left:-4px;width:8px;cursor:col-resize;border-radius:4px}
.split.v>.divider::before{left:0;right:0;top:-4px;bottom:auto;height:8px;width:auto;cursor:row-resize}
.divider:hover::before{background:rgba(255,143,171,.55)}

/* header */
.hdr{margin-bottom:3mm;flex:none}
.hce{outline:none;min-width:2em}
.hce:empty::before{content:attr(data-ph);color:#e9b5c5}
.hdr-review{display:flex;align-items:stretch;gap:4mm;border-bottom:1.5px solid #222;padding-bottom:2mm}
.hdr-main{flex:1;text-align:center}
.h-school{font-size:.9em}
.h-title{font-size:var(--hts,20pt);font-weight:700;letter-spacing:.05em;line-height:1.35}
.h-sub{font-size:.85em}
.h-fields{display:flex;justify-content:center;gap:5mm;flex-wrap:wrap;margin-top:1mm}
.hf{white-space:nowrap}
.hf-b{display:inline-block;border-bottom:1px solid #222;height:1.1em;vertical-align:baseline;margin-left:1mm}
.score{border:1.5px solid #222;display:flex;flex-direction:column;width:24mm;flex:none}
.score-l{text-align:center;border-bottom:1px solid #222;font-size:.85em;line-height:1.6}
.score-b{flex:1;min-height:12mm}
.hdr-quiz{display:flex;align-items:flex-end;gap:4mm;border-bottom:1.5px solid #222;padding-bottom:1.5mm}
.hdr-quiz .h-title{font-size:var(--hts,16pt);flex:1;text-align:left}
.hdr-quiz .h-fields{margin:0;gap:4mm}
.hdr-quiz .score{flex-direction:row;width:auto;align-items:stretch}
.hdr-quiz .score-l{border-bottom:none;border-right:1px solid #222;padding:0 2mm;display:flex;align-items:center}
.hdr-quiz .score-b{min-height:9mm;width:16mm}
.hdr-ws{text-align:center}
.hdr-ws .h-title-box{display:inline-block;border:2.5px solid #333;border-radius:8mm;padding:1mm 10mm;margin:1mm 0 2mm;box-shadow:1.2mm 1.2mm 0 #ddd}
.hdr-ws .h-row{display:flex;align-items:flex-end;gap:4mm;border-bottom:1px dashed #555;padding-bottom:1.5mm}
.hdr-ws .h-sub{flex:1;text-align:left}
.hdr-ws .h-fields{margin:0}
.hdr-ws .score{flex-direction:row;width:auto}
.hdr-ws .score-l{border-bottom:none;border-right:1px solid #222;padding:0 2mm}
.hdr-ws .score-b{min-height:8mm;width:14mm}
.hdr-banner{text-align:center}
.hdr-banner .h-title-band{display:inline-block;background:#e8e8e8;padding:1mm 14mm;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);margin-bottom:1.5mm}
.hdr-banner .h-fields{justify-content:flex-end;border-bottom:1.5px solid #222;padding-bottom:1.5mm}
.page-foot{flex:none;text-align:center;font-size:9pt;padding-top:1.5mm;color:#444;display:flex;justify-content:space-between}
.page-foot span:nth-child(2){flex:1;text-align:center}

/* content blocks */
.cc div{min-height:1em}
.sec-h{font-weight:700;margin-top:1.5mm}
.sec-s{font-weight:400;font-size:.9em}
.q{margin:.6mm 0}
.opts{display:grid;column-gap:4mm;padding-left:2.2em}
.qgrid{display:grid;column-gap:4mm;row-gap:1.5mm}
.qgrid>div{min-width:0}
.tbl{border-collapse:collapse;margin:1mm 0}
.tbl td,.tbl th{border:1px solid #333;padding:.6mm 2mm;min-width:10mm;height:1.8em;text-align:center}
.tbl th{background:#eee;font-weight:700}
.tbox{margin:1.5mm 0;padding:2mm 3mm}
.tbox.solid{border:1px solid #333}
.tbox.dashed{border:1px dashed #444}
.tbox.round{border:1.5px solid #333;border-radius:3mm}
.tbox.gray{background:#eee;border-radius:2mm}
.tbox.tip{border:1.5px solid #333;border-left:5px solid #333;border-radius:1mm}
.boxt{border:1px solid #222;padding:0 .15em}
.work{border:1px dashed #bbb;margin:1mm 0}
.wline{display:block;margin-top:1mm}

/* widgets */
.mw{display:inline-block;vertical-align:middle;cursor:pointer;border-radius:3px;line-height:1.25;text-indent:0;user-select:none}
.mw:hover{box-shadow:0 0 0 1px rgba(255,143,171,.7)}
.mw.sel{box-shadow:0 0 0 2px #FF8FAB;background:rgba(255,143,171,.07)}
.ans{color:#E53935;visibility:hidden}
.show-ans .ans{visibility:visible}
.bx{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;height:1.5em;border:1px solid #333;vertical-align:middle;margin:0 .1em;line-height:1;padding:0 .12em}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;margin:0 .12em;line-height:1.15;text-align:center}
.frac>.fn{border-bottom:1px solid currentColor;padding:0 .18em .05em}
.frac>.fd{padding:.05em .18em 0}
.frac .bx{height:1.25em;min-width:1.25em}
.mixw{vertical-align:middle;margin-right:.03em}
.mw-frac,.mw-pow,.mw-sqrt,.mw-rep,.mw-blank,.mw-cmp,.mw-qno,.mw-sec,.mw-latex{vertical-align:middle}
.mw-qno,.mw-sec{vertical-align:baseline;line-height:inherit}
.mw-blank{vertical-align:baseline;line-height:inherit}
.bl-line{display:inline-block;border-bottom:1px solid #333;text-align:center;line-height:1.25}
.bl-in{display:inline-block;text-align:center}
.bl-circle{display:inline-flex;min-width:1.6em;height:1.6em;border:1px solid #333;border-radius:50%;align-items:center;justify-content:center;vertical-align:middle}
.sqrt{white-space:nowrap}
.sqrt .ri{font-size:.6em;margin-right:-.35em;vertical-align:.9em}
.sqrt .rs{font-size:1.1em}
.sqrt .rc{border-top:1px solid #222;padding:0 .15em}
.rep .rd{position:relative;display:inline-block}
.rep .rd::before{content:'';position:absolute;top:-.12em;left:50%;width:.22em;height:.22em;margin-left:-.11em;border-radius:50%;background:currentColor}
.cmp{white-space:nowrap}
.mw-vert,.mw-ldiv,.mw-sdiv{vertical-align:top;margin:1mm 2mm}
.vgrid{display:inline-grid;line-height:1;font-variant-numeric:tabular-nums}
.vgrid>.vc{height:1.55em;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.vgrid>.vc.top{border-top:1.2px solid #222}
.vgrid>.vc.lb{border-left:1.2px solid #222}
.vgrid>.vc.bb{border-bottom:1.2px solid #222}
.vgrid>.vrule{height:0;border-top:1.2px solid #222;margin:1px 0}
.vgrid>.vgap{height:1.55em}
.vb{display:inline-flex;align-items:center;justify-content:center;width:1.12em;height:1.3em;border:1px solid #444}
.vb.sm{width:.8em;height:.8em;font-size:.8em}
.vgrid>.vc.lbr{position:relative;border-top:1.2px solid #222}
.vgrid>.vc.lbr::after{content:'';position:absolute;right:.05em;top:-1px;bottom:-.15em;width:.45em;border-right:1.3px solid #222;border-radius:0 60% 60% 0/0 50% 50% 0}
.mw-block{display:inline-block;vertical-align:top;margin:1mm}
.mw-lines,.mw-space,.mw-hr{display:block;cursor:pointer}
.lines{display:block}
.ln{display:flex;align-items:flex-end;border-bottom:1px solid #333;padding-bottom:.5mm}
.ln.dashed{border-bottom-style:dashed}
.ln.dotted{border-bottom-style:dotted}
.lnp{margin-right:2mm}
.space{display:block;position:relative}
.space .spl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9pt;color:#e9b5c5;border:1px dashed #F4D0DC;font-family:sans-serif}
.hr{display:block;margin:2mm 0;border-top:1px solid #333}
.hr.dashed{border-top-style:dashed}
.hr.double{border-top:3px double #333}
.hr.thick{border-top-width:2px}
.hr-cut{display:flex;align-items:center;gap:2mm;margin:2mm 0;font-size:9pt;color:#555}
.hr-cut::after{content:'';flex:1;border-top:1px dashed #555}
.pvt{border-collapse:collapse}
.pvt th,.pvt td{border:1px solid #333;min-width:11mm;height:9mm;text-align:center;padding:0 1mm}
.pvt th{background:#eee}
.bond{display:inline-flex;flex-direction:column;width:36mm;vertical-align:top}
.bond-row{display:flex;justify-content:space-around}
.bond-c{width:11mm;height:11mm;border:1.2px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center}
.bond-c .bx{border:none}
.bond-l{width:100%;height:7mm;display:block}
.match{display:inline-grid;row-gap:3mm;align-items:center}
.match .ml{text-align:right}
.match .dot{font-size:.7em;margin:0 1.5mm}
.mw-img img{display:block}
.imgph{display:flex;align-items:center;justify-content:center;width:40mm;height:25mm;border:1px dashed #999;color:#999;font-size:9pt}
.gtable{border-collapse:collapse}
.dice{display:inline-grid;grid-template-columns:repeat(3,1fr);width:9mm;height:9mm;border:1.2px solid #222;border-radius:1.5mm;padding:.8mm;vertical-align:middle}
.dice i{display:block;width:1.6mm;height:1.6mm;border-radius:50%;margin:auto}
.dice i.on{background:#222}
.money{display:inline-flex;align-items:center;justify-content:center;border:1.2px solid #222;font-weight:700;vertical-align:middle;margin:.5mm}
.money.coin{border-radius:50%;width:10mm;height:10mm;font-size:9pt}
.money.bill{width:22mm;height:11mm;border-radius:1mm;font-size:10pt}
.pic{display:inline-flex;flex-wrap:wrap;gap:1mm;vertical-align:middle;max-width:60mm}
.pic span{font-size:1.2em;line-height:1}

/* modes */
.exporting .page{box-shadow:none!important}
.exporting .cell.active,.exporting .mw.sel,.exporting .mw:hover{box-shadow:none!important;background:none!important}
.exporting .cell.over::after,.exporting .divider,.exporting .space .spl,.exporting .cc:empty::before,.exporting .hce:empty::before{display:none!important;content:none!important}
.paper-prev{font-family:var(--pf);font-size:var(--pfs);line-height:var(--plh)}
.paper-prev .mw{cursor:default}

@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;overflow:visible;display:block;background:#fff}
  #appbar,#ribbon,#statusbar,.page-bar,.addpage,#wbar,#menu,.mask,#toast{display:none!important}
  #main,#workspace{display:block;overflow:visible;padding:0;background:none}
  #pages{zoom:1!important;display:block;width:auto}
  .page-wrap{margin:0}
  .page{box-shadow:none;break-after:page;page-break-after:always}
  .cell.active,.mw.sel,.mw:hover{box-shadow:none!important;background:none!important}
  .guides .cell{outline:none!important}
  .cell.over::after,.divider,.space .spl,.cc:empty::before,.hce:empty::before{display:none!important;content:none!important}
}
@media (max-width:700px){
  #workspace{padding:12px}
  #docname{width:140px}
}

  <nav id="tabs"></nav>

<script>
'use strict';
/* ================= 工具函式 ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'n' + Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const splitList = (s, keepEmpty) => { const a = String(s ?? '').split(/[,，、]/).map(x => x.trim()); return keepEmpty ? a : a.filter(x => x !== ''); };
const lines = s => String(s ?? '').split('\n').map(x => x.trim()).filter(Boolean);
const fmtNum = v => { const r = Math.round(v * 1e6) / 1e6; return String(r); };
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];

const FONTS = {
  kai: { label: '標楷體', css: "'標楷體','DFKai-SB','BiauKai','LXGW WenKai TC',serif" },
  wenkai: { label: '霞鶩文楷', css: "'LXGW WenKai TC','標楷體','DFKai-SB',serif" },
  sans: { label: '思源黑體', css: "'Noto Sans TC','Microsoft JhengHei',sans-serif" },
  serif: { label: '思源宋體', css: "'Noto Serif TC','PMingLiU',serif" },
  jh: { label: '微軟正黑體', css: "'Microsoft JhengHei','微軟正黑體','Noto Sans TC',sans-serif" },
  iansui: { label: '芫荽（手寫感）', css: "'Iansui','LXGW WenKai TC',serif" },
  round: { label: '圓體', css: "'M PLUS Rounded 1c','Noto Sans TC',sans-serif" },
};
const paperFont = () => (FONTS[(window.S && S.doc && S.doc.page.font)] || FONTS.kai).css;
const svgFont = () => `font-family="${esc(paperFont())}"`;

function cnum(n) {
  const d = '零一二三四五六七八九';
  if (n <= 0) return String(n);
  if (n < 10) return d[n];
  if (n === 10) return '十';
  if (n < 20) return '十' + d[n % 10];
  if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  return String(n);
}
function bignum(n) { const d = '零壹貳參肆伍陸柒捌玖拾'; return n <= 10 ? d[n] : n <= 19 ? '拾' + d[n - 10] : String(n); }
function circ(n) { return n >= 1 && n <= 20 ? String.fromCodePoint(0x2460 + n - 1) : `(${n})`; }
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];

function qLabel(n, st) {
  switch (st) {
    case 'paren': return `(${n})`;
    case 'circle': return circ(n);
    case 'alpha': return String.fromCharCode(64 + ((n - 1) % 26) + 1) + '.';
    case 'dun': return `${n}、`;
    case 'cnparen': return `（${cnum(n)}）`;
    case 'box': return `[${n}]`;
    default: return `${n}.`;
  }
}
function secLabel(n, st) {
  switch (st) {
    case 'big': return bignum(n) + '、';
    case 'roman': return (ROMAN[n] || n) + '.';
    case 'cnparen': return `（${cnum(n)}）`;
    case 'part': return `第${cnum(n)}部分：`;
    default: return cnum(n) + '、';
  }
}

/* 文字格式語法：{1/2} 分數、{2 1/3} 帶分數、[答案] 方框填空、[] 空方框、x^2 次方 */
function fmt(s) {
  let h = esc(s);
  h = h.replace(/\{(?:([^{}\s\/]+)\s+)?([^{}\/]+)\/([^{}]+)\}/g, (m, w, n, d) =>
    (w ? `<span class="mixw">${w}</span>` : '') + `<span class="frac"><span class="fn">${n}</span><span class="fd">${d}</span></span>`);
  h = h.replace(/\[([^\[\]]*)\]/g, (m, a) => a ? `<span class="bx"><span class="ans">${a}</span></span>` : `<span class="bx"></span>`);
  h = h.replace(/\^([0-9a-zA-Z]+)/g, '<sup>$1</sup>');
  return h.replace(/\n/g, '<br>');
}
const ansSpan = a => a !== '' && a != null ? `<span class="ans">${fmt(a)}</span>` : '';

/* ================= 數學元件 ================= */
const SHAPES = [['square', '正方形'], ['rect', '長方形'], ['tri', '三角形'], ['rtri', '直角三角形'], ['itri', '等腰三角形'], ['circle', '圓形'], ['sector', '扇形'],
  ['para', '平行四邊形'], ['trap', '梯形'], ['rhombus', '菱形'], ['kite', '箏形'], ['penta', '正五邊形'], ['hexa', '正六邊形'], ['angle', '角'],
  ['cube', '正方體'], ['cuboid', '長方體'], ['cylinder', '圓柱'], ['cone', '圓錐'], ['tprism', '三角柱']];

const F = {
  text: (k, label, hint) => ({ k, label, type: 'text', hint }),
  num: (k, label, min, max, step) => ({ k, label, type: 'num', min, max, step }),
  sel: (k, label, opts) => ({ k, label, type: 'sel', opts }),
  area: (k, label, hint) => ({ k, label, type: 'area', hint }),
  chk: (k, label) => ({ k, label, type: 'chk' }),
  color: (k, label) => ({ k, label, type: 'color' }),
  img: (k, label) => ({ k, label, type: 'img' }),
  note: (text) => ({ type: 'note', text }),
};
const SYNTAX_NOTE = F.note('✨ 小技巧：輸入 {1/2} 會變成分數、{2 1/3} 帶分數、[5] 會變成方框（解答 5）、[] 空方框、x^2 次方。');
const MODE_OPTS = [['box', '方框作答'], ['blank', '留白作答'], ['show', '直接顯示答案']];

const W = {
  blank: {
    name: '填空格', def: { style: 'line', w: 4, ans: '' },
    fields: [F.sel('style', '樣式', [['line', '底線 ＿＿'], ['box', '方框 □'], ['paren', '括號（　）'], ['circle', '圓圈 ○'], ['bracket', '方括號〔　〕'], ['dotline', '點線 ……']]),
      F.num('w', '寬度（字元）', 1, 40, 0.5), F.text('ans', '解答（解答卷顯示）')],
    render(p) {
      const a = ansSpan(p.ans), w = +p.w || 4;
      switch (p.style) {
        case 'box': return `<span class="bx" style="min-width:${Math.max(1.5, w * .5)}em">${a}</span>`;
        case 'paren': return `（<span class="bl-in" style="width:${w * .7}em">${a}</span>）`;
        case 'circle': return `<span class="bl-circle" style="min-width:${Math.max(1.6, w * .4)}em">${a}</span>`;
        case 'bracket': return `〔<span class="bl-in" style="width:${w * .7}em">${a}</span>〕`;
        case 'dotline': return `<span class="bl-line" style="min-width:${w}em;border-bottom-style:dotted">${a}</span>`;
        default: return `<span class="bl-line" style="min-width:${w}em">${a}</span>`;
      }
    }
  },
  frac: {
    name: '分數', def: { w: '', n: '1', d: '2' },
    fields: [F.text('w', '整數部分（帶分數用）'), F.text('n', '分子'), F.text('d', '分母'), F.note('分子、分母可輸入 [3] 變成方框（解答 3），或 [] 空白方框。')],
    render: p => (p.w !== '' ? `<span class="mixw">${fmt(p.w)}</span>` : '') + `<span class="frac"><span class="fn">${fmt(p.n)}</span><span class="fd">${fmt(p.d)}</span></span>`
  },
  pow: {
    name: '次方', def: { base: '10', exp: '2' },
    fields: [F.text('base', '底數'), F.text('exp', '指數')],
    render: p => `${fmt(p.base)}<sup>${fmt(p.exp)}</sup>`
  },
  sqrt: {
    name: '根號', def: { idx: '', c: '16' },
    fields: [F.text('c', '根號內'), F.text('idx', '根指數（空白為平方根）')],
    render: p => `<span class="sqrt">${p.idx ? `<sup class="ri">${fmt(p.idx)}</sup>` : ''}<span class="rs">√</span><span class="rc">${fmt(p.c)}</span></span>`
  },
  rep: {
    name: '循環小數', def: { int: '0', non: '1', rep: '6' },
    fields: [F.text('int', '整數部分'), F.text('non', '不循環的小數位'), F.text('rep', '循環節')],
    render(p) {
      const r = [...String(p.rep)];
      return `<span class="rep">${esc(p.int)}.${esc(p.non)}${r.map((d, i) => (i === 0 || i === r.length - 1) ? `<span class="rd">${esc(d)}</span>` : esc(d)).join('')}</span>`;
    }
  },
  cmp: {
    name: '比大小', def: { l: '345', r: '354', ans: '<', style: 'circle' },
    fields: [F.text('l', '左邊'), F.text('r', '右邊'), F.sel('ans', '解答', [['<', '＜'], ['>', '＞'], ['=', '＝'], ['', '（不設定）']]),
      F.sel('style', '作答樣式', [['circle', '圓圈 ○'], ['paren', '括號（　）'], ['box', '方框 □']]), SYNTAX_NOTE],
    render(p) {
      const a = p.ans ? `<span class="ans">${esc(p.ans)}</span>` : '';
      const c = p.style === 'paren' ? `（<span class="bl-in" style="width:1.4em">${a}</span>）` : p.style === 'box' ? `<span class="bx">${a}</span>` : `<span class="bl-circle">${a}</span>`;
      return `<span class="cmp">${fmt(p.l)} ${c} ${fmt(p.r)}</span>`;
    }
  },
  qno: {
    name: '題號', def: { style: 'dot', start: '' }, auto: true,
    fields: [F.sel('style', '樣式', [['dot', '1.'], ['paren', '(1)'], ['circle', '①'], ['dun', '1、'], ['alpha', 'A.'], ['cnparen', '（一）']]), F.text('start', '從此號重新起算（空白為自動）'), F.note('題號會自動依順序編號，遇到「大題號」會重新從 1 開始。')],
    render: p => qLabel(p.start ? +p.start : 1, p.style)
  },
  sec: {
    name: '大題號', def: { style: 'cn', start: '' }, auto: true,
    fields: [F.sel('style', '樣式', [['cn', '一、'], ['big', '壹、'], ['roman', 'I.'], ['cnparen', '（一）'], ['part', '第一部分：']]), F.text('start', '從此號重新起算（空白為自動）')],
    render: p => secLabel(p.start ? +p.start : 1, p.style)
  },
  latex: {
    name: 'LaTeX 公式', def: { tex: '\\frac{a}{b}+\\sqrt{x^2+1}', display: false },
    fields: [F.area('tex', 'LaTeX 語法'), F.chk('display', '獨立一行（大型公式）'), F.note('例：\\frac{3}{4}、x^{2}、\\sqrt{2}、\\times、\\div、\\pi r^2、\\angle ABC')],
    render(p) {
      if (window.katex) { try { return katex.renderToString(p.tex || '', { throwOnError: false, displayMode: !!p.display }); } catch (e) { } }
      return `<code>${esc(p.tex)}</code>`;
    }
  },

  /* ---- 計算 ---- */
  vert: {
    name: '直式計算', block: true, def: { a: '345', op: '+', b: '278', mid: '', ans: '623', mode: 'box', carry: false },
    fields: [F.text('a', '被加數／被減數／被乘數'), F.sel('op', '運算', [['+', '＋ 加法'], ['−', '－ 減法'], ['×', '× 乘法']]), F.text('b', '第二個數'),
      F.area('mid', '中間過程（乘法部分積，一行一列，會自動往左錯位）'), F.text('ans', '答案'), F.sel('mode', '答案呈現', MODE_OPTS), F.chk('carry', '顯示進位／借位小方框'),
      F.note('數字中可用 [] 或 □ 表示要學生填的空格，例如 3[4]5 。')],
    render(p) {
      const A = vtoks(p.a), B = vtoks(p.b), R = vtoks(p.ans);
      const M = String(p.mid || '').split('\n').filter(x => x.trim()).map((x, i) => { const t = vtoks(x.replace(/^\s+/, '')); if (p.op === '×' && !/\s$/.test(x)) for (let k = 0; k < i; k++) t.push({ c: ' ' }); return t; });
      const Wd = 1 + Math.max(A.length, B.length, R.length, ...M.map(m => m.length), 1);
      const row = (op, t, isAns) => vcell(op ? esc(op) : '') + vpad(Wd - 1 - t.length) + t.map(x => vcell(vtokHTML(x, isAns, p.mode), x.c === '.' ? 'dot' : '')).join('');
      let h = '';
      if (p.carry) h += vcell('') + vpad(Wd - 1 - A.length) + A.map(() => vcell('<span class="vb sm"></span>')).join('');
      h += row('', A, false) + row(p.op, B, false) + '<span class="vrule" style="grid-column:1/-1"></span>';
      if (M.length) { M.forEach(m => h += row('', m, true)); h += '<span class="vrule" style="grid-column:1/-1"></span>'; }
      h += R.length ? row('', R, true) : `<span class="vgap" style="grid-column:1/-1"></span>`;
      return `<span class="vgrid" style="grid-template-columns:repeat(${Wd},1.3em)">${h}</span>`;
    }
  },
  ldiv: {
    name: '直式除法', block: true, def: { divisor: '12', dividend: '156', q: '13', r: '', mode: 'box', work: 4 },
    fields: [F.text('divisor', '除數'), F.text('dividend', '被除數'), F.text('q', '商'), F.text('r', '餘數（可空白）'), F.sel('mode', '商的呈現', MODE_OPTS), F.num('work', '計算過程空白列數', 0, 12, 1)],
    render(p) {
      const d = vtoks(p.divisor), D = vtoks(p.dividend), Q = vtoks(p.q);
      const cols = d.length + 1 + D.length;
      let h = vpad(d.length + 1) + vpad(Math.max(0, D.length - Q.length)) + Q.map(x => vcell(vtokHTML(x, true, p.mode))).join('');
      h += d.map(x => vcell(vtokHTML(x, false))).join('') + vcell('', 'lbr') + D.map(x => vcell(vtokHTML(x, false), 'top')).join('');
      for (let i = 0; i < (+p.work || 0); i++) {
        h += vpad(cols);
        if (i % 2 === 1) h += `<span class="vrule" style="grid-column:${d.length + 2}/-1"></span>`;
      }
      if (p.r !== '' && p.r != null) h += `<span class="vc" style="grid-column:1/-1;justify-content:flex-end;font-size:.85em">餘 ${p.mode === 'show' ? esc(p.r) : `<span class="bx"><span class="ans">${esc(p.r)}</span></span>`}</span>`;

const OPSYM = { add: '+', sub: '−', mul: '×', div: '÷' };

    if (!b) b = 1;
    if (p.intdiv) { const lo = Math.max(1, Math.ceil(+p.amin / b)), hi = Math.max(lo, Math.floor(+p.amax / b)); const q = rnd(lo, hi); a = q * b; ans = q; }
    else ans = Math.round(a / b * 100) / 100;

}

  const { a, b, op, ans } = g;

    const r = Math.max(0, ans + rnd(-3, 3));
    return mwHTML('cmp', { l: `${a} ${op} ${b}`, r: String(r), ans: ans > r ? '>' : ans < r ? '<' : '=', style: 'circle' });
  }
  if (p.kind === 'missing') {
    const box = v => mwHTML('blank', { style: 'box', w: 3, ans: String(v) });
    return Math.random() < .5 ? `${box(a)} ${op} ${b} ＝ ${ans}` : `${a} ${op} ${box(b)} ＝ ${ans}`;
  }
  if (p.fmt === 'vert') {
    if (op === '÷') return mwHTML('ldiv', { divisor: String(b), dividend: String(a), q: String(ans), mode: 'box', work: Math.min(8, String(ans).length * 2) });
    return mwHTML('vert', { a: String(a), op, b: String(b), ans: String(ans), mode: 'box' });
  }
  return `${a} ${op} ${b} ＝ ${mwHTML('blank', p.fmt === 'hbox' ? { style: 'box', w: 3.5, ans: String(ans) } : { style: 'line', w: 4, ans: String(ans) })}`;
}

}

function openGallery(cat) {
  const cats = $('#galCats'); cats.innerHTML = '';
  G_CATS.forEach(c => { const b = el('button'); b.textContent = c; b.onclick = () => showGalCat(c); cats.append(b); });
  $('#gallery').classList.remove('hidden');
  showGalCat(cat || S.galCat || '推薦');
}
function closeGallery() { $('#gallery').classList.add('hidden'); }
function thumbOf(doc) {
  const box = el('div', 'gthumb'), sc = el('div', 'tscale'), page = renderPageEl(doc, 0, true);
  sc.append(page); box.append(sc); renumber(page);
  const land = doc.page.orientation === 'landscape', pw = land ? 1123 : 794, ph = land ? 794 : 1123;
  requestAnimationFrame(() => { const s = Math.min(box.clientWidth / pw, box.clientHeight / ph) * .92 || .16; sc.style.transform = `translate(-50%,-50%) scale(${s})`; });
  return box;
}
function showGalCat(c) {
  S.galCat = c; $$('#galCats button').forEach(b => b.classList.toggle('on', b.textContent === c));
  const grid = $('#galGrid'); grid.innerHTML = ''; grid.scrollTop = 0;
  if (c === '我的範本') {
    const imp = el('div', 'gcard blank'); imp.innerHTML = `<div class="gthumb">📥</div><div class="gname">開啟專案檔</div><div class="gdesc">.mathpaper.json</div>`; imp.onclick = () => importAny('project'); grid.append(imp);
    const mine = getMine();
    if (lsGet(LS_AUTO)) { const card = el('div', 'gcard'); try { const d = JSON.parse(lsGet(LS_AUTO)); card.append(thumbOf(d)); card.insertAdjacentHTML('beforeend', `<div class="gname">↩ 繼續上次編輯</div><div class="gdesc">${esc(d.meta.name)}</div>`); card.onclick = () => { loadDoc(d, '↩ 已回到上次的編輯'); closeGallery(); }; grid.append(card); } catch (e) { } }
    if (!mine.length) grid.insertAdjacentHTML('beforeend', '<div class="gal-empty">還沒有自訂範本。編輯好後，到「檔案 → 存成我的範本」就會出現在這裡 ⭐</div>');
    mine.forEach(m => {
      const card = el('div', 'gcard'); card.append(thumbOf(m.doc)); card.insertAdjacentHTML('beforeend', `<div class="gname">${esc(m.name)}</div><div class="gdesc">${esc(m.date)}</div>`);
      const del = el('button', 'gdel'); del.textContent = '✕'; del.title = '刪除範本'; del.onclick = e => { e.stopPropagation(); lsSet(LS_MINE, JSON.stringify(getMine().filter(x => x.id !== m.id))); showGalCat(c); };
      card.append(del); card.onclick = () => useDoc(clone(m.doc)); grid.append(card);
    });
    return;
  }
  GALLERY.filter(g => g.cats.includes(c)).forEach(g => {
    const card = el('div', 'gcard' + (g.blank ? ' blank' : ''));
    if (g.blank) card.innerHTML = '<div class="gthumb">＋</div>';
    else { try { card.append(thumbOf(buildTpl(g))); } catch (e) { console.error(g.id, e); card.innerHTML = '<div class="gthumb">📄</div>'; } }
    card.insertAdjacentHTML('beforeend', `<div class="gname">${esc(g.name)}</div><div class="gdesc">${esc(g.desc || '')}</div>`);
    card.onclick = () => useDoc(buildTpl(g)); grid.append(card);
  });
}
function buildTpl(g) { let d = g.build(); if (g.post) d = g.post(d); return d; }
function useDoc(d) {
  const go = () => { loadDoc(d, '🎉 已開啟範本：' + d.meta.name); closeGallery(); };
  const cur = S.doc && cellsOf(S.doc.pages[0].layout).some(c => c.html && c.html.replace(/<[^>]*>|\s|​|&nbsp;/g, ''));
  if (cur && S.hist.length > 1) { closeGallery(); confirmBox('開啟範本會取代目前的文件內容（目前內容已自動暫存，可到「我的範本 → 繼續上次編輯」或按復原找回）。確定開啟嗎？', () => { S.hist = []; go(); }); }
  else go();

/* ================= 事件 ================= */
function bindEvents() {
  const pg = $('#pages');
  pg.addEventListener('click', e => {
    const pa = e.target.closest('[data-pa]'); if (pa) { const w = pa.closest('.page-wrap'); return pageAction(pa.dataset.pa, w ? +w.dataset.i : S.doc.pages.length - 1); }
    const mw = e.target.closest('.mw'); if (mw && !e.target.closest('.dlg')) { selectW(mw); const c = mw.closest('.cell'); if (c) setActiveCell(c); return; }
    deselectW();
    const cell = e.target.closest('.cell');
    if (cell) { setActiveCell(cell); if (e.target === cell) { const cc = cell.firstElementChild; cc.focus(); const r = document.createRange(); r.selectNodeContents(cc); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
  });
  pg.addEventListener('dblclick', e => { const mw = e.target.closest('.mw'); if (mw) { e.preventDefault(); selectW(mw); editWidget(mw); } });
  pg.addEventListener('input', e => {
    const h = e.target.closest('.hce'); if (h) S.doc.header[h.dataset.h] = h.innerHTML;
    checkOverflow(); scheduleHistory();
  });
  pg.addEventListener('focusin', e => { const cc = e.target.closest('.cc'); if (cc) setActiveCell(cc.parentElement); });
  pg.addEventListener('paste', e => {
    const ed = e.target.closest('.cc, .hce'); if (!ed) return;
    const items = [...(e.clipboardData?.items || [])], img = items.find(i => i.type.startsWith('image/'));
    if (img) { e.preventDefault(); const rd = new FileReader(); rd.onload = () => insertHTML(mwHTML('img', { src: rd.result, w: 60 })); rd.readAsDataURL(img.getAsFile()); return; }
    const html = e.clipboardData.getData('text/html'); if (html && html.includes('data-type=')) return;
    e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
  });
  pg.addEventListener('mousedown', e => {
    const dv = e.target.closest('.divider'); if (!dv) return; e.preventDefault(); syncFromDOM();
    const f = findNode(dv.dataset.sid); if (!f) return; const sp = f.node, i = +dv.dataset.i, par = dv.parentElement, horiz = sp.dir === 'h';
    const kids = [...par.children].filter(c => c.classList.contains('node')), total = sp.sizes.reduce((a, b) => a + b, 0);
    const rect = par.getBoundingClientRect(), len = horiz ? rect.width : rect.height, start = horiz ? e.clientX : e.clientY, s0 = [...sp.sizes];
    const move = ev => {
      const du = ((horiz ? ev.clientX : ev.clientY) - start) / len * total, min = total * .04;
      let a = s0[i] + du, b = s0[i + 1] - du; if (a < min) { b -= min - a; a = min; } if (b < min) { a -= min - b; b = min; }
      sp.sizes[i] = a; sp.sizes[i + 1] = b; kids[i].style.flex = `${a} 1 0px`; kids[i + 1].style.flex = `${b} 1 0px`;
    };
    const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); checkOverflow(); pushHistory(); };
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  });
  $('#workspace').addEventListener('scroll', () => { if (S.selW) selectW(S.selW); }, { passive: true });
  $('#wbar').addEventListener('mousedown', e => e.preventDefault());
  $('#wbar').addEventListener('click', e => { const b = e.target.closest('[data-wa]'); if (b) wAction(b.dataset.wa); });
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (a && !a.closest('#ribbon')) runAct(a.dataset.act);
    if (!$('#menu').hidden && !e.target.closest('#menu') && !(S.menuBtn && S.menuBtn.contains(e.target))) hideMenu();
  });
  document.addEventListener('keydown', e => {
    const inForm = e.target.closest && e.target.closest('input, textarea, select');
    const dlgOpen = !$('#dlgMask').classList.contains('hidden');
    if (e.key === 'Escape') { hideMenu(); if (dlgOpen) closeDialog(); else if (!$('#gallery').classList.contains('hidden')) closeGallery(); else deselectW(); return; }
    if (dlgOpen) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); S.dlgOK(); } return; }
    if (e.ctrlKey || e.metaKey) {
      const k = e.key.toLowerCase();
      if (inForm && k !== 's') return;
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
      else if (k === 's') { e.preventDefault(); exportProject(); }
      else if (k === 'p') { e.preventDefault(); doPrint('q'); }
      return;
    }
    if (S.selW && (e.key === 'Delete' || e.key === 'Backspace') && !inForm) { e.preventDefault(); wAction('del'); return; }
    if (S.selW && e.key === 'Enter' && !inForm) { e.preventDefault(); editWidget(S.selW); return; }
    if (S.selW && !inForm && e.key.length === 1) deselectW();
  });
  $('#dlgOK').onclick = () => S.dlgOK && S.dlgOK();
  $('#dlgCancel').onclick = closeDialog; $('#dlgX').onclick = closeDialog;
  $('#dlgMask').addEventListener('mousedown', e => { if (e.target.id === 'dlgMask') closeDialog(); });
  $('#galX').onclick = closeGallery;
  $('#docname').addEventListener('input', scheduleHistory);
  $('#zoom').addEventListener('input', e => setZoom(e.target.value / 100));
  addEventListener('resize', () => { hideMenu(); deselectW(); });
}

/* ================= 啟動 ================= */

  const st = el('style'); st.id = 'pageSizeStyle'; document.head.append(st);
  buildTabs(); bindEvents();
  const saved = lsGet(LS_AUTO); let restored = false;
  if (saved) { try { loadDoc(JSON.parse(saved)); restored = true; } catch (e) { } }
  if (!restored) loadDoc(buildTpl(GALLERY.find(g => g.id === 'demo')));
  showTab(lsGet('mathpaper.tab') || 'q');
  if (restored) toast('↩ 已還原上次的編輯內容'); else openGallery('推薦');
  loadCSS(['lib/katex/katex.min.css', 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css']);
  loadScript(['lib/katex/katex.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js']).then(() => { $$('#pages .mw-latex').forEach(refreshW); checkOverflow(); }).catch(() => { });
  if (document.fonts) document.fonts.ready.then(checkOverflow);
}
