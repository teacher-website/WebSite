<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鬼抓人 - 恐怖生存</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #8b0000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            text-shadow: 0 0 10px #ff0000;
            opacity: 0;
            transition: opacity 1s;
        }

        .menu {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #8b0000;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px #ff0000;
            pointer-events: auto;
        }

        h1 {
            font-size: 48px;
            margin-top: 0;
            text-shadow: 2px 2px 15px #ff0000;
            animation: flicker 2s infinite alternate;
        }

        p {
            font-size: 18px;
            color: #aaa;
        }

        button {
            background-color: transparent;
            color: #8b0000;
            border: 1px solid #8b0000;
            padding: 15px 30px;
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #8b0000;
            color: #000;
            box-shadow: 0 0 15px #ff0000;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            5% { opacity: 0.8; }
            10% { opacity: 1; }
            15% { opacity: 0.5; }
            20% { opacity: 1; }
            100% { opacity: 1; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="score-board">生存時間: <span id="time">0.0</span> 秒</div>
        
        <div id="start-menu" class="menu">
            <h1>無處可逃</h1>
            <p>在黑暗中，"它"正朝你靠近...</p>
            <p>控制方式：W A S D 或 鍵盤方向鍵</p>
            <button id="start-btn">開始逃亡</button>
        </div>

        <div id="game-over-menu" class="menu hidden">
            <h1>你被抓到了</h1>
            <p id="final-score">你存活了 0 秒</p>
            <button id="restart-btn">再次掙扎</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startMenu = document.getElementById('start-menu');
        const gameOverMenu = document.getElementById('game-over-menu');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreBoard = document.getElementById('score-board');
        const timeDisplay = document.getElementById('time');
        const finalScoreDisplay = document.getElementById('final-score');

        // 遊戲設定
        let isPlaying = false;
        let startTime;
        let survivalTime = 0;
        let animationId;

        // 玩家狀態
        const player = {
            x: 0, y: 0, radius: 10, speed: 4, color: '#aaaaaa'
        };

        // 鬼狀態
        const ghost = {
            x: 0, y: 0, radius: 12, baseSpeed: 2.5, speed: 2.5, color: '#ff0000'
        };

        // 按鍵追蹤
        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            w: false, a: false, s: false, d: false
        };

        // 調整畫布大小
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 鍵盤監聽
        window.addEventListener('keydown', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = false;
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        function initGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            
            // 讓鬼在畫面邊緣隨機重生
            if (Math.random() > 0.5) {
                ghost.x = Math.random() > 0.5 ? 0 : canvas.width;
                ghost.y = Math.random() * canvas.height;
            } else {
                ghost.x = Math.random() * canvas.width;
                ghost.y = Math.random() > 0.5 ? 0 : canvas.height;
            }
            ghost.speed = ghost.baseSpeed;

            survivalTime = 0;
            startTime = Date.now();
            isPlaying = true;
            
            startMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            scoreBoard.style.opacity = 1;
            
            update();
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            scoreBoard.style.opacity = 0;
            finalScoreDisplay.innerText = `你存活了 ${survivalTime.toFixed(1)} 秒`;
            gameOverMenu.classList.remove('hidden');
            
            // 死亡特效 - 畫面全紅
            ctx.fillStyle = 'rgba(139, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function update() {
            if (!isPlaying) return;

            // 更新時間
            survivalTime = (Date.now() - startTime) / 1000;
            timeDisplay.innerText = survivalTime.toFixed(1);

            // 玩家移動
            if ((keys.ArrowUp || keys.w) && player.y - player.radius > 0) player.y -= player.speed;
            if ((keys.ArrowDown || keys.s) && player.y + player.radius < canvas.height) player.y += player.speed;
            if ((keys.ArrowLeft || keys.a) && player.x - player.radius > 0) player.x -= player.speed;
            if ((keys.ArrowRight || keys.d) && player.x + player.radius < canvas.width) player.x += player.speed;

            // 鬼的 AI (朝向玩家移動)
            const dx = player.x - ghost.x;
            const dy = player.y - ghost.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // 隨著時間增加鬼的速度
            ghost.speed = ghost.baseSpeed + (survivalTime * 0.05);

            if (distance > 0) {
                ghost.x += (dx / distance) * ghost.speed;
                ghost.y += (dy / distance) * ghost.speed;
            }

            // 碰撞判定 (被抓到了)
            if (distance < player.radius + ghost.radius - 5) {
                gameOver();
                return;
            }

            draw();
            animationId = requestAnimationFrame(update);
        }

        function draw() {
            // 清除畫布
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製背景網格 (增加一點空間感)
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for(let i = 0; i < canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // 繪製鬼 (發出紅光)
            ctx.beginPath();
            ctx.arc(ghost.x, ghost.y, ghost.radius, 0, Math.PI * 2);
            ctx.fillStyle = ghost.color;
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.closePath();

            // 繪製玩家
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.closePath();

            // 重置陰影避免影響手電筒圖層
            ctx.shadowBlur = 0;

            // 恐怖手電筒效果 (黑暗遮罩)
            // 產生一點閃爍效果
            const flicker = Math.random() * 10 - 5; 
            const sightRadius = 150 + flicker; 

            const gradient = ctx.createRadialGradient(
                player.x, player.y, sightRadius * 0.2, 
                player.x, player.y, sightRadius
            );
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.98)'); // 邊緣接近全黑

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 綁定按鈕
        startBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('click', initGame);

        // 初始繪製黑畫面
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

    </script>
</body>
</html>
