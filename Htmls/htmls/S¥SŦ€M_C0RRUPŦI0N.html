<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S¥SŦ€M_C0RRUPŦI0N</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" style="fill:red;"><circle cx="5" cy="5" r="5"/></svg>'), auto;
        }

        body {
            background-color: #050000;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* CRT 螢幕效果 */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        #game-container {
            width: 800px;
            height: 600px;
            border: 3px solid #ff0000;
            background-color: #0a0101;
            box-shadow: 0 0 20px #ff0000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        /* 頂部狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .hp-container {
            width: 45%;
        }

        .hp-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hp-bar-outer {
            width: 100%;
            height: 20px;
            border: 1px solid #ff0000;
            background: #200;
            padding: 2px;
        }

        .hp-bar-inner {
            height: 100%;
            background: #ff0000;
            width: 100%;
            transition: width 0.2s ease;
            box-shadow: 0 0 10px #ff0000;
        }

        #enemy-hp {
            background: #8800ff;
            box-shadow: 0 0 10px #8800ff;
        }
        #enemy-border { border-color: #8800ff; }

        /* 主戰場 */
        .arena {
            flex: 1;
            border: 1px dashed #ff0000;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #020000;
            overflow: hidden;
        }

        #enemy-sprite {
            font-size: 12px;
            white-space: pre;
            text-align: center;
            color: #8800ff;
            text-shadow: 0 0 5px #8800ff;
            animation: glitch 1s infinite alternate;
        }

        /* 動作按鈕區 */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        button {
            background: #1a0000;
            border: 1px solid #ff0000;
            color: #ff3333;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
        }

        button:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 15px #ff0000;
        }

        button:active {
            transform: scale(0.95);
        }

        /* 日誌系統 */
        #log-console {
            height: 100px;
            border: 1px solid #330000;
            background: #000;
            margin-top: 15px;
            padding: 10px;
            font-size: 12px;
            overflow-y: hidden;
            color: #aa2222;
        }

        /* 突發錯誤視窗 (QTE 機制) */
        .popup-error {
            position: absolute;
            background: #200000;
            border: 2px solid #ff0000;
            color: #fff;
            padding: 15px;
            z-index: 10;
            box-shadow: 0 0 30px #ff0000;
            text-align: center;
            animation: popup-shake 0.3s infinite;
        }

        .popup-error button {
            margin-top: 10px;
            padding: 5px 10px;
            font-size: 12px;
        }

        /* 動效與濾鏡 */
        @keyframes glitch {
            0% { transform: translate(0) skew(0deg); text-shadow: 2px 0 #f0f, -2px 0 #0ff; }
            20% { transform: translate(-2px, 2px) skew(2deg); }
            40% { transform: translate(-2px, -2px) skew(-1deg); text-shadow: -2px 0 #f0f, 2px 0 #0ff; }
            60% { transform: translate(2px, 2px) skew(1deg); }
            80% { transform: translate(2px, -2px) skew(0deg); }
            100% { transform: translate(0) skew(0deg); }
        }

        @keyframes popup-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2px, -2px) rotate(1deg); }
            50% { transform: translate(-2px, 2px) rotate(-1deg); }
            75% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(-2px, -2px) rotate(1deg); }
        }

        .shake {
            animation: screen-shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screen-shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); }
            20%, 80% { transform: translate3d(8px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-12px, 0, 0); }
            40%, 60% { transform: translate3d(12px, 0, 0); }
        }

        .flash {
            animation: flash-red 0.3s ease-out;
        }

        @keyframes flash-red {
            0% { background-color: rgba(255, 0, 0, 0.7); }
            100% { background-color: transparent; }
        }

        /* 結局畫面 */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        #overlay h1 {
            font-size: 48px;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="status-bar">
            <div class="hp-container">
                <div class="hp-label">YOUR SANITY (你的神智)</div>
                <div class="hp-bar-outer">
                    <div id="player-hp" class="hp-bar-inner"></div>
                </div>
            </div>
            <div class="hp-container">
                <div class="hp-label" style="text-align: right; color: #8800ff;">MAINFRAME (電腦核心)</div>
                <div id="enemy-border" class="hp-bar-outer">
                    <div id="enemy-hp" class="hp-bar-inner"></div>
                </div>
            </div>
        </div>

        <div class="arena" id="arena">
            <div id="enemy-sprite">
 ___________________________
/                           \
|   [☠]  SYSTEM_ERROR  [☠]  |
|                           |
|      01001001   010101    |
|      N O   E S C A P E    |
|                           |
\___________________________/
     ||               ||
    ==============     
            </div>
        </div>

        <div class="controls">
            <button onclick="playerAction('punch')">物理超度 (攻擊)</button>
            <button onclick="playerAction('patch')">修補防火牆 (防禦)</button>
            <button onclick="playerAction('overclock')">超頻代碼 (重擊)</button>
        </div>

        <div id="log-console">
            <div>[SYSTEM]: 歡迎來到主機端。它已經注意到你了...</div>
        </div>
    </div>

    <div id="overlay" id="overlay-screen">
        <h1 id="overlay-title">你死了</h1>
        <p id="overlay-desc" style="margin-bottom: 30px; color: #666;"></p>
        <button onclick="location.reload()" style="padding: 10px 40px;">重 新 刻 錄 靈 魂</button>
    </div>

    <script>
        let playerMaxHP = 100;
        let playerHP = 100;
        let enemyMaxHP = 150;
        let enemyHP = 150;
        let isGameOver = false;

        const creepyMessages = [
            "電腦正在透過螢幕看著你...",
            "你有聽到機殼裡的抓撓聲嗎？",
            "系統正在下載你的瀏覽紀錄與意識...",
            "不要回頭。不要回頭。不要回頭。",
            "風扇轉速過快... 那不是風的聲音，是哀嚎。",
            "警告：偵測到未知靈體試圖寫入記憶體。",
            "你的鍵盤開始發熱了，那是地獄的溫度。"
        ];

        const enemySprites = [
` ___________________________
/                           \
|   [☠]  SYSTEM_ERROR  [☠]  |
|                           |
|      01001001   010101    |
|      N O   E S C A P E    |
|                           |
\___________________________/
     ||               ||
    ==============     `,
` ___________________________
/                           \
|   👁️   I   S E E   👁️     |
|                           |
|       Y O U R   S O U L   |
|                           |
\___________________________/
     ||               ||
    ==============     `,
` ___________________________
/                           \
|    ☠️  LET  ME  OUT  ☠️   |
|                           |
|     ERR_SOUL_INSUFFICIENT |
|                           |
\___________________________/
     ||               ||
    ==============     `
        ];

        // 核心計時器：電腦自動攻擊
        let gameLoop = setInterval(() => {
            if (isGameOver) return;
            
            // 隨機觸發事件
            let rand = Math.random();
            if (rand < 0.35) {
                enemyAttack();
            } else if (rand < 0.50) {
                spawnPopupError();
            }

            // 隨機更換恐怖外觀與日誌
            if (Math.random() < 0.25) {
                document.getElementById('enemy-sprite').innerText = enemySprites[Math.floor(Math.random() * enemySprites.length)];
                logMessage(`[未知線程]: ${creepyMessages[Math.floor(Math.random() * creepyMessages.length)]}`);
            }
        }, 1800);

        function logMessage(msg) {
            const consoleBox = document.getElementById('log-console');
            const newLog = document.createElement('div');
            newLog.innerText = msg;
            consoleBox.appendChild(newLog);
            if (consoleBox.childNodes.length > 5) {
                consoleBox.removeChild(consoleBox.firstChild);
            }
        }

        function triggerVisualEffects(type) {
            const container = document.getElementById('game-container');
            if (type === 'damage') {
                container.classList.add('flash');
                container.classList.add('shake');
                setTimeout(() => {
                    container.classList.remove('flash');
                    container.classList.remove('shake');
                }, 300);
            }
        }

        // 電腦的普通攻擊
        function enemyAttack() {
            let dmg = Math.floor(Math.random() * 12) + 8;
            playerHP -= dmg;
            if (playerHP < 0) playerHP = 0;
            updateBars();
            logMessage(`[⚠️系統逆襲]: 電腦釋放高壓電流/精神污染，對你造成 ${dmg} 點精神傷害！`);
            triggerVisualEffects('damage');
            checkGameOver();
        }

        // 玩家動作
        function playerAction(action) {
            if (isGameOver) return;

            if (action === 'punch') {
                let dmg = Math.floor(Math.random() * 10) + 10;
                enemyHP -= dmg;
                logMessage(`[💥你重擊了螢幕]: 對電腦硬體造成了 ${dmg} 點物理損壞！`);
                document.getElementById('enemy-sprite').style.animation = 'glitch 0.2s infinite alternate';
                setTimeout(() => {
                    document.getElementById('enemy-sprite').style.animation = 'glitch 1s infinite alternate';
                }, 400);
            } 
            else if (action === 'patch') {
                let heal = Math.floor(Math.random() * 15) + 10;
                playerHP += heal;
                if (playerHP > playerMaxHP) playerHP = playerMaxHP;
                logMessage(`[🛡️防禦]: 你瘋狂刷新防火牆與防毒軟體，恢復了 ${heal} 點神智！`);
            } 
            else if (action === 'overclock') {
                if (Math.random() > 0.3) {
                    let dmg = Math.floor(Math.random() * 25) + 20;
                    enemyHP -= dmg;
                    logMessage(`[⚡超頻終結]: 你成功往代碼注入邏輯炸彈！造成 ${dmg} 點致命毀滅！`);
                } else {
                    playerHP -= 15;
                    logMessage(`[❌超頻失敗]: 系統代碼反噬！你受到了 15 點藍幕反彈傷害！`);
                    triggerVisualEffects('damage');
                }
            }

            if (enemyHP < 0) enemyHP = 0;
            updateBars();
            checkGameOver();
        }

        // 惡意彈窗 QTE (不理它會持續扣血)
        function spawnPopupError() {
            if (isGameOver) return;

            const arena = document.getElementById('arena');
            const popup = document.createElement('div');
            popup.className = 'popup-error';
            
            // 隨機位置
            const x = Math.random() * (arena.clientWidth - 200);
            const y = Math.random() * (arena.clientHeight - 150);
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';

            const errorTexts = [
                "想要活下去嗎？",
                "刪除 SYSTEM32？",
                "牠在窗外看你",
                "拒絕訪問：靈魂權限不足"
            ];
            
            popup.innerHTML = `
                <div style="font-weight:bold; color:#ff0000; margin-bottom:5px;">⚠️ FATAL_ERROR ⚠️</div>
                <div style="font-size:12px; margin-bottom:10px;">${errorTexts[Math.floor(Math.random() * errorTexts.length)]}</div>
                <button onclick="closePopup(this)">【 拒 絕 】</button>
            `;

            arena.appendChild(popup);
            logMessage("[⚡警告]: 電腦彈出了詛咒視窗！快點關閉它！");

            // 彈窗懲罰機制：如果3秒內沒關閉，玩家扣血
            let punishment = setTimeout(() => {
                if (popup.parentNode) {
                    playerHP -= 18;
                    if (playerHP < 0) playerHP = 0;
                    updateBars();
                    logMessage("[☠️精神崩潰]: 你沒有及時關閉錯誤視窗，精神受到嚴重侵蝕！");
                    triggerVisualEffects('damage');
                    popup.remove();
                    checkGameOver();
                }
            }, 3000);

            popup.dataset.timeoutId = punishment;
        }

        function closePopup(btn) {
            const popup = btn.parentNode;
            clearTimeout(popup.dataset.timeoutId);
            popup.remove();
            logMessage("[✓]: 你成功關閉了一個惡意視窗。");
        }

        function updateBars() {
            document.getElementById('player-hp').style.width = `${(playerHP / playerMaxHP) * 100}%`;
            document.getElementById('enemy-hp').style.width = `${(enemyHP / enemyMaxHP) * 100}%`;
        }

        function checkGameOver() {
            if (isGameOver) return;

            const overlay = document.getElementById('overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');

            if (playerHP <= 0) {
                isGameOver = true;
                clearInterval(gameLoop);
                overlay.style.display = 'flex';
                title.innerText = "你 被 吞 噬 了";
                title.style.color = "#ff0000";
                title.style.textShadow = "0 0 20px #ff0000";
                desc.innerText = "你的意識已被上傳至主機核心。你成了下一個詛咒代碼。";
            } else if (enemyHP <= 0) {
                isGameOver = true;
                clearInterval(gameLoop);
                overlay.style.display = 'flex';
                title.innerText = "系 統 已 淨 化";
                title.style.color = "#00ff66";
                title.style.textShadow = "0 0 20px #00ff66";
                desc.innerText = "主機冒出了黑煙與鮮血...你活下來了。至少目前是這樣。";
            }
        }
    </script>
</body>
</html>
